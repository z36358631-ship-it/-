  <script>
  (()=>{
    const A=window.DEMO_ASSETS;
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const clone=v=>JSON.parse(JSON.stringify(v));
    const placements=[
      ['O1','启动开屏','双方向'],['H1','首页原生混投','竖屏'],['P1','玩游戏页赞助卡','横屏'],['C1','签到时长加倍','横屏'],['G1','零时长激励','横屏'],['Q1','排队加速激励','横屏'],['L1','PC 启动等待广告','横屏']
    ];
    const placementName=Object.fromEntries(placements.map(x=>[x[0],x[1]]));
    const seedRows=region=>placements.map(([id,name],i)=>({id,name,platform:id==='H1'?'Android 竖屏':'Android 横屏',enabled:id!=='O1'||region==='cn',audience:id==='O1'?'老用户':'全部用户',ratio:id==='H1'||id==='P1'?60:100,frequency:i===0?'永久 1 次':'1 天 1 次',status:i<5?'已发布':'草稿',updated:`2026-07-${String(17-i).padStart(2,'0')} 14:${20+i}`}));
    const seedExperiments=region=>[
      {id:'EXP-101',name:'首页原生卡首轮验证',placement:'H1',audience:'Android 活跃用户',groups:'对照 40% / 实验 60%',status:'运行中',updated:'2026-07-17 15:20'},
      {id:'EXP-102',name:'排队加速权益组合',placement:'Q1',audience:'免费排队 > 阈值',groups:'对照 50% / 时长 25% / 双权益 25%',status:'草稿',updated:'2026-07-17 15:28'},
      {id:'EXP-103',name:'签到双倍领取',placement:'C1',audience:region==='cn'?'国内签到用户':'海外签到用户',groups:'对照 50% / 激励 50%',status:'已暂停',updated:'2026-07-16 18:10'}
    ];
    const state={
      surface:'user',page:'O1',orientation:'portrait',badges:false,annoTab:'interaction',region:'cn',adminPage:'delivery',
      o1Step:'logo',c1:{base:false,double:false,ad:false,rewardId:null},g1:{awarded:false},q1:{status:'QUEUING',awarded:false},l1:{stage:'firmware',visible:true,requestId:'l1-demo-session',creativeId:'creative-start-01'},
      delivery:{cn:seedRows('cn'),overseas:seedRows('overseas')},experiments:{cn:seedExperiments('cn'),overseas:seedExperiments('overseas')},drawer:null,deleteTarget:null
    };
    const annotations={
      O1:{i:['真正冷启动、命中人群与频控，且广告已完成预加载。','先播放盖世 Logo 动画，再显示开屏广告；竖屏落到首页，横屏落到游戏库。','“下一阶段”推进 Logo → 广告 → 目标页；跳过只结束广告，不跳过 Logo。'],e:['无填充、热启动、Push、Deep Link 或游戏返回时，Logo 后直接进入目标页。','横竖屏独立校验；广告不能延长应用启动链路。']},
      H1:{i:['进入首页且命中实验、人群、频控与内容广告占比。','在“为你推荐”至少 3 张自然卡之后插入同尺寸卡，仅增加“广告”标识。','点击赞助卡打开模拟落地页，关闭后返回原页面。'],e:['无填充不留空白，不改变自然卡顺序。','单次访问最多插入一次，搜索与详情页不复用此广告位。']},
      P1:{i:['进入横屏玩游戏页，秒玩人气热游至少展示 2 张自然卡。','赞助卡与自然卡比例、圆角、标题基线一致，位于同一内容流。','点击卡片打开落地页，关闭后保留页面位置。'],e:['无填充直接拼接前后自然内容。','不插入最近常玩、签到或时长卡区域。']},
      C1:{i:['用户点击原页面“签到”按钮。','基础签到奖励立即到账，再弹出签到成功结果，提供看广告领取同额时长。','完整观看后补发同额奖励；“完成”直接关闭结果。'],e:['广告失败或提前关闭不能回收基础奖励。','同一 reward_id 重复回调不得重复发奖。']},
      G1:{i:['用户主动启动云游戏，剩余时长为 0，启动请求尚未创建。','在原页面上显示盖世粉紫毛玻璃弹层，不自动播放广告。','用户主动选择看广告；完整观看到账后再继续启动。'],e:['提前关闭、无填充或播放失败不发奖、不扣次数。','与 Q1 同一会话互斥，重复回调幂等。']},
      Q1:{i:['免费通道排队且预计等待超过后台阈值，用户主动点击加速。','在原排队页加速区域内增加激励入口，排队名次与状态持续可见。','播放期间保持排队；成功发加速和时长，已排到/已退出只发时长。'],e:['失败保留原排队位置，不扣次数。','付费快速通道、短等待或 G1 已使用时隐藏入口。']},
      L1:{i:['进入固件/运行环境准备或 Steam 与客户端启动阶段。','右侧固定 204×140 静态无声原生位，不遮挡进度、错误信息与关系图。','两阶段沿用同一 requestId 和素材；点击不暂停启动。'],e:['阶段切换不刷新素材、不重复曝光。','完成、失败、无填充或安全区不足时立即隐藏。']},
      delivery:{i:['运营在后台容器内选择国内/海外，再查看投放配置列表。','列表展示 7 个广告位、状态、比例、频控、更新时间和操作。','支持新增、查看、编辑、删除；保存草稿与发布状态按地区隔离。'],e:['删除必须二次确认。','国内修改不污染海外，草稿不立即影响用户端。']},
      experiment:{i:['运营选择地区后进入 A/B 测试配置。','列表展示关联广告位、人群、分组比例、状态与更新时间。','支持新增、查看、编辑、删除；比例必须合计 100% 才能启动。'],e:['运行中实验核心分组字段锁定。','实验停止后保留历史统计，不自动删除。']},
      report:{i:['运营选择地区和统计周期。','展示收入、eCPM、CTR、次日留存及 7 个广告位效果。','可按地区查看 C1、Q1、L1 专项指标与用户损伤护栏。'],e:['地区和币种隔离。','留存下降、启动耗时或退出率触发阈值时标红并支持停投。']}
    };

    function sourceLabel(asset){return `<span class="reference ${A[asset].preferred?'':'fallback'}">参考图：${esc(A[asset].source)}${A[asset].preferred?'':'（最新指定图未落盘，当前使用目录内回退图）'}</span>`}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    function openModal(html,admin=false){$('#modalBox').className='modal-card'+(admin?' admin-confirm':'');$('#modalBox').innerHTML=html;$('#modal').classList.add('open')}
    function closeModal(){$('#modal').classList.remove('open')}
    function marker(n,style){return `<span class="marker" style="${style}">${n}</span>`}
    function device(orientation,inner,assetKey=''){return `<div class="device ${orientation} ${state.badges?'show-badges':''}" data-orientation="${orientation}" ${assetKey?`data-reference="${esc(A[assetKey].source)}"`:''}>${inner}</div>`}
    function titlebar(id,asset,tools=''){return `<div class="scene-titlebar"><div><h2>${id} · ${placementName[id]}</h2><p>${placements.find(x=>x[0]===id)?.[2]||''}</p></div>${asset?sourceLabel(asset):''}<div class="scene-tools">${tools}</div></div>`}
    function img(key,cls='screen-img'){return `<img class="${cls}" src="${A[key].src}" alt="${esc(A[key].source)}">`}
    function adLanding(){openModal(`<h2>模拟广告落地页</h2><div class="video-box">${state.region==='cn'?'穿山甲':'Google AdMob'} · 赞助内容</div><p>关闭后返回原页面与原滚动位置。</p><div class="actions"><button class="primary" data-action="modal-close">关闭并返回</button></div>`)}

    function renderO1(){
      const key=state.orientation==='portrait'?'home':'libraryLandscape';
      const tools=`<button class="chip ${state.orientation==='portrait'?'active':''}" data-orientation="portrait">竖屏</button><button class="chip ${state.orientation==='landscape'?'active':''}" data-orientation="landscape">横屏</button><button class="chip" data-action="o1-reset">重播</button>`;
      let content='';
      if(state.o1Step==='logo')content=`<div class="startup-logo" data-o1-step="logo"><img src="${A.logo.src}" alt="盖世游戏"><span>GameHub · 盖世游戏</span></div>`;

    function renderH1(){const card=`<button class="native-card h1-card hotspot" data-action="landing" data-hotspot="2"><span class="disclosure">广告</span><span class="game-symbol">🚀</span><strong>星际探索</strong><small>限时免费试玩</small></button>`;return titlebar('H1','home')+`<div class="stage">${device('portrait',img('home')+card+marker(1,'left:18px;top:36%')+marker(2,'right:16px;top:42%')+marker(3,'left:16px;bottom:18px'),'home')}</div>`}
    function renderP1(){const card=`<button class="native-card p1-card hotspot" data-action="landing" data-hotspot="2"><span class="disclosure">广告</span><span class="game-symbol">🎮</span><strong>本周赞助热游</strong><small>点击了解</small></button>`;return titlebar('P1','playLandscape')+`<div class="stage">${device('landscape',img('playLandscape')+card+marker(1,'left:45%;top:45%')+marker(2,'left:61%;top:56%')+marker(3,'right:18px;bottom:16px'),'playLandscape')}</div>`}
    function c1Dialog(){
      if(state.c1.ad)return `<section class="glass dialog"><div class="video-box">激励广告播放中 · 约 15 秒</div><div class="actions"><button class="primary" data-action="c1-ad-complete">完整观看</button><button class="secondary" data-action="c1-ad-fail">提前关闭 / 失败</button></div></section>`;
      if(state.c1.double)return `<section class="glass dialog"><h2>双倍时长已领取</h2><div class="reward">+120 分钟</div><p>基础 60 分钟 + 广告奖励 60 分钟</p><div class="actions"><button class="primary" data-action="c1-done">完成</button></div></section>`;
      return `<section class="glass dialog" data-checkin-state="base-awarded"><h2>签到成功</h2><p>基础签到奖励已到账</p><div class="reward">+60 分钟</div><div class="actions"><button class="primary" data-action="c1-watch">看广告再领 60 分钟</button><button class="secondary" data-action="c1-done">完成</button></div></section>`;
    }
    function renderC1(){const overlay=state.c1.base?c1Dialog():'';return titlebar('C1','checkin')+`<div class="stage">${device('landscape',img('checkin')+`<button class="hotspot" data-action="c1-checkin" data-hotspot="1" aria-label="点击原签到按钮" style="left:39%;top:34%;width:12%;height:17%"></button>`+overlay+marker(1,'left:39%;top:32%')+marker(2,'left:52%;top:29%')+marker(3,'right:18px;bottom:16px'),'checkin')}</div>`}
    function renderG1(){const dialog=state.g1.awarded?`<section class="glass dialog"><h2>5 分钟已到账</h2><p>正在继续创建云游戏启动请求…</p><div class="actions"><button class="primary" data-action="g1-reset">完成</button></div></section>`:`<section class="glass dialog" data-hotspot="2"><span class="tag">主动激励 · 不自动播放</span><h2>秒玩时长不足</h2><p>看约 15 秒广告，获得 5 分钟</p><div class="actions"><button class="primary" data-action="g1-watch">看广告得时长</button><button class="secondary" data-action="g1-dismiss">暂不领取</button></div></section>`;return titlebar('G1','playLandscape')+`<div class="stage">${device('landscape',img('playLandscape')+dialog+marker(1,'left:18px;top:18px')+marker(2,'left:52%;top:28%')+marker(3,'right:18px;bottom:16px'),'playLandscape')}</div>`}
    function renderQ1(){const background=A.queue.preferred?img('queue'):'<div class="queue-fallback-bg"></div>';const q=`<div class="queue-page">${background}<div class="screen-dark"></div><div class="queue-top"><span>云游戏 · GTA V</span><span>网络良好 · 免费通道</span></div><div class="queue-center"><small>当前排队</small><h1>${state.q1.status==='QUEUING'?'822':'—'}</h1><p>${state.q1.awarded?'已进入加速通道 · 预计等待 18 分钟':'预计等待 52 分钟 · 正在为你保留位置'}</p><div class="queue-progress"><i></i></div></div><section class="glass queue-action" data-hotspot="2"><span class="tag">用户主动激励</span><h3>${state.q1.awarded?'加速成功，5 分钟已到账':'看广告加速排队'}</h3><p>${state.q1.awarded?'双权益已由服务端确认':'约 15 秒 · 加速排队并领取 5 分钟'}</p><button class="primary" data-action="q1-watch" ${state.q1.awarded?'disabled':''}>${state.q1.awarded?'今日已领取':'立即观看'}</button></section><button class="secondary queue-exit" data-action="q1-exit">退出排队</button>${marker(1,'left:46%;top:27%')}${marker(2,'right:18px;bottom:24px')}${marker(3,'left:18px;bottom:24px')}</div>`;return titlebar('Q1','queue')+`<div class="stage">${device('landscape',q,'queue')}</div>`}
    function renderL1(){const key=state.l1.stage==='firmware'?'startFirmware':'startClient';const tools=`<button class="chip ${state.l1.stage==='firmware'?'active':''}" data-l1-stage="firmware">阶段 1</button><button class="chip ${state.l1.stage==='client'?'active':''}" data-l1-stage="client">阶段 2</button><button class="chip" data-action="l1-hide">完成 / 失败</button><button class="chip" data-action="l1-show">重置</button>`;const ad=state.l1.visible?`<article class="l1-ad" data-placement="L1" data-request-id="${state.l1.requestId}" data-creative-id="${state.l1.creativeId}" data-hotspot="2"><small>广告 · 启动等待期间推荐</small><h3>盖世装备实验室</h3><button data-action="landing">了解详情</button></article>`:'';const stageName=state.l1.stage==='firmware'?'正在安装固件 / 准备运行环境':'正在启动 Steam 与游戏客户端';const background=A[key].preferred?img(key):`<div class="startup-fallback"><span class="windows">⊞</span><div class="loading"><i></i></div><span class="fusion">GAMEFUSION</span></div>`;const inner=background+`<div class="stage-label"><b>${stageName}</b><small>阶段切换不刷新右侧素材</small></div>${ad}<div class="protected system" data-protected="system"></div><div class="protected progress" data-protected="progress"></div>${marker(1,'left:18px;top:18px')}${marker(2,'right:18px;top:42px')}${marker(3,'left:18px;bottom:18px')}`;return titlebar('L1',key,tools)+`<div class="stage">${device('landscape',inner,key)}</div>`}
    const userRenderers={O1:renderO1,H1:renderH1,P1:renderP1,C1:renderC1,G1:renderG1,Q1:renderQ1,L1:renderL1};

    function adminShell(content){return `<section class="admin-shell"><aside class="admin-side" id="adminSidebar"><div class="admin-product" id="adminProductName">盖世游戏运营后台</div>${[['delivery','广告投放配置'],['experiment','A/B 测试配置'],['report','效果统计']].map(([id,n])=>`<button class="${state.adminPage===id?'active':''}" data-admin-nav="${id}">${n}</button>`).join('')}</aside><main class="admin-main"><div class="admin-header"><h2>${state.adminPage==='delivery'?'广告投放配置':state.adminPage==='experiment'?'A/B 测试配置':'效果统计'}</h2><div class="region-tabs" id="adminRegionTabs"><button class="${state.region==='cn'?'active':''}" data-region="cn">国内 · 穿山甲</button><button class="${state.region==='overseas'?'active':''}" data-region="overseas">海外 · AdMob</button></div></div>${content}</main></section>`}
    function renderDelivery(){const rows=state.delivery[state.region];const body=rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><small>${r.id}</small></td><td>${esc(r.platform)}</td><td>${esc(r.audience)}</td><td>${r.ratio}%</td><td>${esc(r.frequency)}</td><td><span class="status-pill ${r.status==='草稿'?'draft':''}">${esc(r.status)}</span></td><td>${esc(r.updated)}</td><td><button class="link-btn" data-crud="view" data-kind="delivery" data-id="${r.id}">查看</button><button class="link-btn" data-crud="edit" data-kind="delivery" data-id="${r.id}">编辑</button><button class="link-btn delete" data-crud="delete" data-kind="delivery" data-id="${r.id}">删除</button></td></tr>`).join('');return adminShell(`<div class="toolbar"><input id="deliverySearch" placeholder="搜索名称或广告位"><button class="primary" data-crud="create" data-kind="delivery">+ 新增投放配置</button></div><div class="table-wrap"><table class="data-table" id="deliveryTable"><thead><tr><th>名称 / 广告位</th><th>平台</th><th>用户范围</th><th>投放比例</th><th>频控</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div>`)}
    function renderExperiment(){const rows=state.experiments[state.region];const body=rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><small>${r.id}</small></td><td>${r.placement}</td><td>${esc(r.audience)}</td><td>${esc(r.groups)}</td><td><span class="status-pill ${r.status==='草稿'?'draft':''}">${esc(r.status)}</span></td><td>${esc(r.updated)}</td><td><button class="link-btn" data-crud="view" data-kind="experiment" data-id="${r.id}">查看</button><button class="link-btn" data-crud="edit" data-kind="experiment" data-id="${r.id}">编辑</button><button class="link-btn delete" data-crud="delete" data-kind="experiment" data-id="${r.id}">删除</button></td></tr>`).join('');return adminShell(`<div class="toolbar"><input placeholder="搜索实验名称"><button class="primary" data-crud="create" data-kind="experiment">+ 新建 A/B 测试</button></div><div class="table-wrap"><table class="data-table" id="experimentTable"><thead><tr><th>实验名称</th><th>广告位</th><th>人群</th><th>分组比例</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div>`)}
    function renderReport(){const overseas=state.region==='overseas';const rows=placements.map(([id,name],i)=>`<tr><td>${id} · ${name}</td><td>${(162800/(i+2)).toFixed(0)}</td><td>${(2.1+i*.42).toFixed(2)}%</td><td>${overseas?'$':'¥'}${(38.2+i*7.4).toFixed(1)}</td><td>${id==='C1'?'双倍领取率 36.8%':id==='Q1'?'退出率 -4.2%':id==='L1'?'启动耗时 +0.0s':'次日留存变化 < 0.3%'}</td></tr>`).join('');return adminShell(`<div class="metric-grid"><div class="metric"><small>广告收入</small><strong>${overseas?'$4,820':'¥12,480'}</strong></div><div class="metric"><small>eCPM</small><strong>${overseas?'$3.92':'¥7.66'}</strong></div><div class="metric"><small>CTR</small><strong>2.36%</strong></div><div class="metric"><small>次日留存变化</small><strong style="color:#178d66">-0.18%</strong></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>资源位</th><th>曝光</th><th>CTR</th><th>收入</th><th>用户损伤 / 专项指标</th></tr></thead><tbody>${rows}</tbody></table></div><div class="chart-card"><h3>重点护栏</h3>${[['C1 基础奖励成功率',99.99],['Q1 完播后双权益成功率',93.2],['L1 启动成功率',98.7],['Android 次日留存',97.6]].map(([n,v])=>`<div class="bar-row"><span>${n.split(' ')[0]}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}%</b></div>`).join('')}</div>`)}
    const adminRenderers={delivery:renderDelivery,experiment:renderExperiment,report:renderReport};

    function renderLeft(){
      if(state.surface==='user')$('#leftNav').innerHTML=`<div class="nav-title">用户端广告场景</div><div class="nav-sub">7 个已确认资源位</div>${placements.map(([id,n])=>`<button class="nav-item ${state.page===id?'active':''}" data-page="${id}"><span class="nav-code">${id}</span>${n}</button>`).join('')}<div class="sim-box"><h4>演示条件</h4><div class="field"><label>广告填充</label><select id="fillSim"><option>正常填充</option><option>无填充 / SDK 失败</option></select></div><label class="checkline"><input type="checkbox" checked> 命中实验与人群</label><label class="checkline"><input type="checkbox" checked> 频控允许</label></div>`;
      else $('#leftNav').innerHTML=`<div class="nav-title">运营后台</div><div class="nav-sub">后台容器内含自身产品名、导航与地区 Tab</div>${[['delivery','广告投放配置'],['experiment','A/B 测试配置'],['report','效果统计']].map(([id,n],i)=>`<button class="nav-item ${state.adminPage===id?'active':''}" data-admin-nav="${id}"><span class="nav-code">0${i+1}</span>${n}</button>`).join('')}`;

    function renderAnno(){const key=state.surface==='user'?state.page:state.adminPage;const a=annotations[key];const rows=state.annoTab==='interaction'?a.i:a.e;const titles=state.annoTab==='interaction'?['触发条件','展示说明','交互说明']:['失败回退','异常与边界'];$('#annoList').innerHTML=rows.map((b,i)=>`<article class="anno-item ${state.annoTab==='exception'?'exception':''}" data-anno="${i+1}"><div class="anno-head"><span class="anno-badge">${state.annoTab==='interaction'?i+1:'E'+(i+1)}</span>${titles[i]||'边界说明'}</div><div class="anno-body"><span class="tag">${titles[i]||'边界说明'}</span>${b}</div></article>`).join('')}

    function openRewardVideo(kind){openModal(`<h2>${kind==='g1'?'G1 时长激励':'Q1 排队加速激励'}</h2><div class="video-box">广告播放中 · 约 15 秒<br><small>业务状态在后台持续保持</small></div><div class="actions"><button class="primary" data-action="${kind}-complete">完整观看</button><button class="secondary" data-action="modal-close">提前关闭 / 播放失败</button></div>`)}
    function drawerFields(kind,row,mode){const readonly=mode==='view'?'disabled':'';if(kind==='delivery')return `<h2>${mode==='create'?'新增投放配置':mode==='view'?'查看投放配置':'编辑投放配置'}</h2><div class="field"><label>名称</label><input id="drawerName" value="${esc(row.name)}" ${readonly}></div><div class="field"><label>广告位</label><select id="drawerPlacement" ${readonly}>${placements.map(([id,n])=>`<option value="${id}" ${row.id===id?'selected':''}>${id} · ${n}</option>`).join('')}</select></div><div class="field"><label>用户范围</label><select id="drawerAudience" ${readonly}><option ${row.audience==='全部用户'?'selected':''}>全部用户</option><option ${row.audience==='新用户'?'selected':''}>新用户</option><option ${row.audience==='老用户'?'selected':''}>老用户</option></select></div><div class="field"><label>投放比例（%）</label><input id="drawerRatio" type="number" min="0" max="100" value="${row.ratio}" ${readonly}></div><div class="field"><label>频控</label><select id="drawerFrequency" ${readonly}><option ${row.frequency==='1 天 1 次'?'selected':''}>1 天 1 次</option><option ${row.frequency==='X 天 X 次'?'selected':''}>X 天 X 次</option><option ${row.frequency==='永久 1 次'?'selected':''}>永久 1 次</option></select></div><div class="drawer-actions"><button class="secondary" data-action="drawer-close">关闭</button>${mode==='view'?'':`<button class="primary" data-action="drawer-save" data-kind="delivery" data-mode="${mode}" data-origin="${esc(row.id)}">保存草稿</button>`}</div>`;
      return `<h2>${mode==='create'?'新建 A/B 测试':mode==='view'?'查看 A/B 测试':'编辑 A/B 测试'}</h2><div class="field"><label>实验名称</label><input id="drawerName" value="${esc(row.name)}" ${readonly}></div><div class="field"><label>关联广告位</label><select id="drawerPlacement" ${readonly}>${placements.map(([id,n])=>`<option value="${id}" ${row.placement===id?'selected':''}>${id} · ${n}</option>`).join('')}</select></div><div class="field"><label>人群</label><input id="drawerAudience" value="${esc(row.audience)}" ${readonly}></div><div class="field"><label>分组比例</label><input id="drawerGroups" value="${esc(row.groups)}" ${readonly}></div><p style="font-size:12px;color:#7b8496">示例格式：对照 40% / 实验 60%，合计必须为 100%。</p><div class="drawer-actions"><button class="secondary" data-action="drawer-close">关闭</button>${mode==='view'?'':`<button class="primary" data-action="drawer-save" data-kind="experiment" data-mode="${mode}" data-origin="${esc(row.id)}">保存草稿</button>`}</div>`}
    function openDrawer(kind,mode,id){const rows=kind==='delivery'?state.delivery[state.region]:state.experiments[state.region];let row=rows.find(r=>r.id===id);if(mode==='create')row=kind==='delivery'?{id:'H1',name:'新投放配置',audience:'全部用户',ratio:100,frequency:'1 天 1 次'}:{id:'',name:'新 A/B 测试',placement:'H1',audience:'Android 用户',groups:'对照 50% / 实验 50%'};state.drawer={kind,mode,id};$('#adminDrawer').innerHTML=drawerFields(kind,row,mode);$('#drawerMask').classList.add('open')}
    function closeDrawer(){$('#drawerMask').classList.remove('open');state.drawer=null}
    function saveDrawer(kind,mode,origin){if(kind==='delivery'){const rows=state.delivery[state.region],id=$('#drawerPlacement').value,data={id,name:$('#drawerName').value.trim()||placementName[id],platform:id==='H1'?'Android 竖屏':'Android 横屏',enabled:true,audience:$('#drawerAudience').value,ratio:Number($('#drawerRatio').value),frequency:$('#drawerFrequency').value,status:'草稿',updated:'2026-07-17 17:30'};if(mode==='create')rows.push(data);else rows.splice(rows.findIndex(r=>r.id===origin),1,data)}else{const rows=state.experiments[state.region],data={id:mode==='create'?`EXP-${Date.now().toString().slice(-3)}`:origin,name:$('#drawerName').value.trim()||'未命名实验',placement:$('#drawerPlacement').value,audience:$('#drawerAudience').value,groups:$('#drawerGroups').value,status:'草稿',updated:'2026-07-17 17:30'};if(mode==='create')rows.push(data);else rows.splice(rows.findIndex(r=>r.id===origin),1,data)}closeDrawer();toast('草稿已保存，仅当前地区可见');render()}
    function confirmDelete(kind,id){state.deleteTarget={kind,id};openModal(`<h2>确认删除？</h2><p>将删除当前${state.region==='cn'?'国内':'海外'}地区的配置，另一地区不受影响。</p><div class="actions"><button class="secondary" data-action="modal-close">取消</button><button class="danger-btn" data-action="delete-confirm">确认删除</button></div>`,true)}
    function reset(){Object.assign(state,{surface:'user',page:'O1',orientation:'portrait',badges:false,annoTab:'interaction',region:'cn',adminPage:'delivery',o1Step:'logo',c1:{base:false,double:false,ad:false,rewardId:null},g1:{awarded:false},q1:{status:'QUEUING',awarded:false},l1:{stage:'firmware',visible:true,requestId:'l1-demo-session',creativeId:'creative-start-01'}});toast('演示已重置');render()}

    document.addEventListener('click',e=>{
      const b=e.target.closest('button,[data-anno]');if(!b)return;
      if(b.dataset.surface){state.surface=b.dataset.surface;render();return}
      if(b.dataset.page){state.page=b.dataset.page;render();return}
      if(b.dataset.adminNav){state.surface='admin';state.adminPage=b.dataset.adminNav;render();return}
      if(b.dataset.region){state.region=b.dataset.region;render();return}
      if(b.dataset.orientation){state.orientation=b.dataset.orientation;state.o1Step='logo';render();return}
      if(b.dataset.l1Stage){state.l1.stage=b.dataset.l1Stage;render();return}
      if(b.dataset.crud){if(b.dataset.crud==='delete')confirmDelete(b.dataset.kind,b.dataset.id);else openDrawer(b.dataset.kind,b.dataset.crud,b.dataset.id);return}
      if(b.dataset.anno){const h=document.querySelector(`[data-hotspot="${b.dataset.anno}"]`);if(h){h.classList.add('pulse');setTimeout(()=>h.classList.remove('pulse'),900)}return}
      const a=b.dataset.action;
      if(a==='landing')adLanding();
      if(a==='modal-close')closeModal();
      if(a==='o1-next'){state.o1Step=state.o1Step==='logo'?'ad':state.o1Step==='ad'?'destination':'logo';render()}
      if(a==='o1-reset'){state.o1Step='logo';render()}
      if(a==='c1-checkin'&&!state.c1.base){state.c1.base=true;state.c1.rewardId='checkin-20260717';toast('基础签到奖励 +60 分钟已到账');render()}
      if(a==='c1-watch'){state.c1.ad=true;render()}
      if(a==='c1-ad-complete'){if(!state.c1.double){state.c1.double=true;toast('广告奖励 +60 分钟已到账')}state.c1.ad=false;render()}
      if(a==='c1-ad-fail'){state.c1.ad=false;toast('广告未完成，基础 60 分钟不受影响');render()}
      if(a==='c1-done'){state.c1.base=false;toast(state.c1.double?'今日双倍已领取':'今日签到已完成');render()}
      if(a==='g1-watch')openRewardVideo('g1');if(a==='g1-complete'){state.g1.awarded=true;closeModal();render()}
      if(a==='g1-dismiss'){toast('已取消，不创建广告请求');state.page='P1';render()}if(a==='g1-reset'){state.g1.awarded=false;render()}
      if(a==='q1-watch')openRewardVideo('q1');if(a==='q1-complete'){state.q1.awarded=true;closeModal();render()}if(a==='q1-exit'){state.q1.status='EXITED';toast('已退出排队；如广告已完成，仅发时长');render()}
      if(a==='l1-hide'){state.l1.visible=false;toast('启动完成或失败，广告位立即隐藏');render()}if(a==='l1-show'){state.l1.visible=true;state.l1.stage='firmware';render()}
      if(a==='drawer-close')closeDrawer();if(a==='drawer-save')saveDrawer(b.dataset.kind,b.dataset.mode,b.dataset.origin);
      if(a==='delete-confirm'){const t=state.deleteTarget,rows=t.kind==='delivery'?state.delivery[state.region]:state.experiments[state.region];rows.splice(rows.findIndex(r=>r.id===t.id),1);state.deleteTarget=null;closeModal();toast('已删除当前地区配置');render()}
    });
    $('#interactionTab').addEventListener('click',()=>{state.annoTab='interaction';renderAnno();$('#interactionTab').classList.add('active');$('#exceptionTab').classList.remove('active')});
    $('#exceptionTab').addEventListener('click',()=>{state.annoTab='exception';renderAnno();$('#exceptionTab').classList.add('active');$('#interactionTab').classList.remove('active')});
    $('#badgeToggle').addEventListener('click',()=>{state.badges=!state.badges;render()});$('#resetDemo').addEventListener('click',reset);
    $('#drawerMask').addEventListener('click',e=>{if(e.target.id==='drawerMask')closeDrawer()});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
    window.AdDemoApp={state,render,reset};render();
  })();
  </script>
</body>
</html>
