      O1:{i:['真正冷启动、命中人群与频控，且广告已完成预加载。','先播放盖世 Logo 动画，再显示开屏广告；竖屏落到首页，横屏落到游戏库。','“下一阶段”推进 Logo → 广告 → 目标页；跳过只结束广告，不跳过 Logo。'],e:['无填充、热启动、Push、Deep Link 或游戏返回时，Logo 后直接进入目标页。','横竖屏独立校验；广告不能延长应用启动链路。']},

    function hashText(text){let h=2166136261;for(const c of text){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
    function seededRandom(seed){return()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296)}
    function searchAdPositions(batch){
      if(batch===1)return [2,8,20];
      const key=`${state.search.query}:${batch}`;
      if(state.search.positions[key])return state.search.positions[key];
      const random=seededRandom(hashText(key)),picked=[];
      while(picked.length<3){
        const pos=1+Math.floor(random()*20),previousBatchEndsWithAd=searchAdPositions(batch-1).includes(20);
        if(picked.includes(pos)||picked.some(x=>Math.abs(x-pos)===1)||(pos===1&&previousBatchEndsWithAd))continue;
        picked.push(pos);
      }
      return state.search.positions[key]=picked.sort((a,b)=>a-b);
    }

      const filters=`<section class="admin-filter-card"><div class="admin-filter-title">⌕ 统计条件</div><div class="quick-date">${quick}</div><div class="admin-filter-grid" style="margin-top:12px"><div class="admin-filter-field"><label>自定义日期</label><div class="filter-date-range"><input id="reportFrom" type="date" value="${esc(f.from)}"><span>至</span><input id="reportTo" type="date" value="${esc(f.to)}"></div></div><div class="admin-filter-field"><label>广告位</label><select id="reportPlacement"><option value="all">全部广告位</option>${placements.map(([id,name])=>`<option value="${id}" ${selected(id,f.placement)}>${id} · ${name}</option>`).join('')}</select></div><div class="admin-filter-field"><label>广告网络</label><select id="reportNetwork"><option value="all">全部广告网络</option><option ${selected(network,f.network)}>${network}</option></select></div><div class="admin-filter-field"><label>A/B 实验</label><select id="reportExperiment"><option value="all">全部实验</option>${state.experiments[state.region].map(e=>`<option value="${e.id}" ${selected(e.id,f.experiment)}>${e.id} · ${e.name}</option>`).join('')}</select></div><div class="admin-filter-field"><label>投放状态</label><select id="reportStatus"><option value="all">全部状态</option><option ${selected('已发布',f.status)}>已发布</option><option ${selected('草稿',f.status)}>草稿</option></select></div></div><div class="admin-filter-actions"><button class="admin-btn" data-action="report-export">导出数据</button><button class="admin-btn ghost" data-filter-action="reset" data-filter-key="report">重置</button><button class="admin-btn primary" data-filter-action="query" data-filter-key="report">查询</button></div></section>`;

      return adminShell(`${filters}${metrics}<section class="admin-panel"><div class="admin-result-head"><h3>广告位效果明细</h3><span class="admin-result-meta">${f.from} 至 ${f.to} · 筛选结果 ${filtered.length} 条</span></div><div class="table-wrap"><table class="data-table" id="reportTable"><thead><tr><th>资源位</th><th>请求</th><th>填充率</th><th>曝光</th><th>点击</th><th>CTR</th><th>收入</th><th>eCPM</th><th>用户损伤 / 专项指标</th></tr></thead><tbody>${body}</tbody></table></div>${pager.html}</section><div class="chart-card"><h3>重点护栏</h3>${guards}</div>`);
    }
    const adminRenderers={delivery:renderDelivery,experiment:renderExperiment,report:renderReport};

    function applyAdminFilters(key){
      if(key==='delivery')state.adminFilters.delivery={keyword:fieldValue('deliveryKeyword').trim(),platform:fieldValue('deliveryPlatform'),audience:fieldValue('deliveryAudience'),status:fieldValue('deliveryStatus'),network:fieldValue('deliveryNetwork'),format:fieldValue('deliveryFormat')};

    function renderAnno(){const key=state.surface==='user'?state.page:state.adminPage;const a=annotations[key];const rows=state.annoTab==='interaction'?a.i:a.e;const titles=state.annoTab==='interaction'?['触发条件','展示说明','交互说明']:['失败回退','异常与边界'];$('#annoList').innerHTML=rows.map((b,i)=>`<article class="anno-item ${state.annoTab==='exception'?'exception':''}" data-anno="${i+1}"><div class="anno-head"><span class="anno-badge">${state.annoTab==='interaction'?i+1:'E'+(i+1)}</span>${titles[i]||'边界说明'}</div><div class="anno-body"><span class="tag">${titles[i]||'边界说明'}</span>${b}</div></article>`).join('')}

    function openRewardVideo(kind){const duration=kind==='q1'?'时长以当前素材为准':'约 15 秒';const title=kind==='g1'?'G1 时长激励':kind==='q1'?'Q1 排队加速激励':'R1 抽奖次数激励';const status=kind==='q1'?'排队计时与位置在后台持续保持':kind==='r1'?'完整观看并校验成功后抽奖次数 +1':'业务状态在后台持续保持';openModal(`<h2>${title}</h2><div class="video-box">广告播放中 · ${duration}<br><small>${status}</small></div><div class="actions"><button class="primary" data-action="${kind}-complete">完整观看</button><button class="secondary" data-action="modal-close">提前关闭 / 播放失败</button></div>`)}
    function drawerFields(kind,row,mode){const readonly=mode==='view'?'disabled':'';if(kind==='delivery')return `<h2>${mode==='create'?'新增投放配置':mode==='view'?'查看投放配置':'编辑投放配置'}</h2><div class="field"><label>名称</label><input id="drawerName" value="${esc(row.name)}" ${readonly}></div><div class="field"><label>广告位</label><select id="drawerPlacement" ${readonly}>${placements.map(([id,n])=>`<option value="${id}" ${row.id===id?'selected':''}>${id} · ${n}</option>`).join('')}</select></div><div class="field"><label>用户范围</label><select id="drawerAudience" ${readonly}><option ${row.audience==='全部用户'?'selected':''}>全部用户</option><option ${row.audience==='新用户'?'selected':''}>新用户</option><option ${row.audience==='老用户'?'selected':''}>老用户</option><option ${row.audience==='活动页可领奖用户'?'selected':''}>活动页可领奖用户</option></select></div><div class="field"><label>投放比例（%）</label><input id="drawerRatio" type="number" min="0" max="100" value="${row.ratio}" ${readonly}></div><div class="field"><label>频控</label><select id="drawerFrequency" ${readonly}><option ${row.frequency==='1 天 1 次'?'selected':''}>1 天 1 次</option><option ${row.frequency==='X 天 X 次'?'selected':''}>X 天 X 次</option><option ${row.frequency==='永久 1 次'?'selected':''}>永久 1 次</option><option ${row.frequency==='后台配置每日上限 / 冷却'?'selected':''}>后台配置每日上限 / 冷却</option></select></div><div class="field"><label>素材规则</label><input id="drawerCreativeRule" value="${esc(row.creativeRule||'—')}" ${readonly}></div><div class="drawer-actions"><button class="secondary" data-action="drawer-close">关闭</button>${mode==='view'?'':`<button class="primary" data-action="drawer-save" data-kind="delivery" data-mode="${mode}" data-origin="${esc(row.id)}">保存草稿</button>`}</div>`;
      return `<h2>${mode==='create'?'新建 A/B 测试':mode==='view'?'查看 A/B 测试':'编辑 A/B 测试'}</h2><div class="field"><label>实验名称</label><input id="drawerName" value="${esc(row.name)}" ${readonly}></div><div class="field"><label>关联广告位</label><select id="drawerPlacement" ${readonly}>${placements.map(([id,n])=>`<option value="${id}" ${row.placement===id?'selected':''}>${id} · ${n}</option>`).join('')}</select></div><div class="field"><label>人群</label><input id="drawerAudience" value="${esc(row.audience)}" ${readonly}></div><div class="field"><label>分组比例</label><input id="drawerGroups" value="${esc(row.groups)}" ${readonly}></div><p style="font-size:12px;color:#7b8496">示例格式：对照 40% / 实验 60%，合计必须为 100%。</p><div class="drawer-actions"><button class="secondary" data-action="drawer-close">关闭</button>${mode==='view'?'':`<button class="primary" data-action="drawer-save" data-kind="experiment" data-mode="${mode}" data-origin="${esc(row.id)}">保存草稿</button>`}</div>`}
    function openDrawer(kind,mode,id){const rows=kind==='delivery'?state.delivery[state.region]:state.experiments[state.region];let row=rows.find(r=>r.id===id);if(mode==='create')row=kind==='delivery'?{id:'S3',name:'新投放配置',audience:'全部用户',ratio:100,frequency:'1 天 1 次',creativeRule:'—'}:{id:'',name:'新 A/B 测试',placement:'S3',audience:'Android 用户',groups:'对照 50% / 实验 50%'};state.drawer={kind,mode,id};$('#adminDrawer').innerHTML=drawerFields(kind,row,mode);$('#drawerMask').classList.add('open')}

    function confirmDelete(kind,id){state.deleteTarget={kind,id};openModal(`<h2>确认删除？</h2><p>将删除当前${state.region==='cn'?'国内':'海外'}地区的配置，另一地区不受影响。</p><div class="actions"><button class="secondary" data-action="modal-close">取消</button><button class="danger-btn" data-action="delete-confirm">确认删除</button></div>`,true)}

      if(a==='queue-recharge')openModal(`<h2>充值加速</h2><p>进入付费加速流程，返回后继续保留当前排队位置。</p><div class="actions"><button class="primary" data-action="modal-close">返回排队</button></div>`)
      if(a==='q1-offer'&&!state.q1.awarded){state.q1.offerOpen=true;openModal(`<h2>看广告领加速时长</h2><p>完整观看后进入加速通道，并获得 5 分钟云游时长。</p><div class="actions"><button class="primary" data-action="q1-watch">观看广告</button><button class="secondary" data-action="modal-close">暂不领取</button></div>`)}
      if(a==='q1-watch')openRewardVideo('q1');if(a==='q1-complete'){state.q1.awarded=true;state.q1.offerOpen=false;closeModal();toast(state.q1.status==='QUEUING'?'加速通道与 5 分钟时长已到账':'已退出排队，仅发放 5 分钟时长');render()}if(a==='q1-exit'){state.q1.status='EXITED';toast('已退出排队；如广告已完成，仅发时长');render()}
      if(a==='r1-watch'&&!state.r1.rewarded)openRewardVideo('r1');if(a==='r1-complete'){const rewardId='draw-20260720-01';if(state.r1.rewardId!==rewardId){state.r1.rewardId=rewardId;state.r1.rewarded=true;state.r1.drawCount+=1;toast('抽奖次数 +1')}closeModal();render()}
      if(a==='r1-draw'&&state.r1.drawCount>0){state.r1.drawCount-=1;openModal(`<h2>恭喜获得云游时长</h2><div class="video-box">🎁<br><strong>云游 5 分钟</strong></div><div class="actions"><button class="primary" data-action="modal-close">收下奖励</button></div>`);render()}
      if(a==='drawer-close')closeDrawer();if(a==='drawer-save')saveDrawer(b.dataset.kind,b.dataset.mode,b.dataset.origin);
      if(a==='delete-confirm'){const t=state.deleteTarget,rows=t.kind==='delivery'?state.delivery[state.region]:state.experiments[state.region];rows.splice(rows.findIndex(r=>r.id===t.id),1);state.deleteTarget=null;closeModal();toast('已删除当前地区配置');render()}
    });
    document.addEventListener('scroll',e=>{const scroller=e.target.closest?.('[data-scroll-key]');if(!scroller)return;const key=scroller.dataset.scrollKey;if(key.startsWith('search'))state.search.scrollTop=scroller.scrollTop;else if(key==='community-main')state.community.mainScroll=scroller.scrollTop;else if(key==='community-detail')state.community.detailScroll=scroller.scrollTop},true);
    document.addEventListener('change',e=>{if(e.target.id==='fillSim'){state.adFill=e.target.selectedIndex===0;render();toast(state.adFill?'已恢复广告填充':'已模拟无填充：自然内容补位')}});
    $('#interactionTab').addEventListener('click',()=>{state.annoTab='interaction';renderAnno();$('#interactionTab').classList.add('active');$('#exceptionTab').classList.remove('active')});
    $('#exceptionTab').addEventListener('click',()=>{state.annoTab='exception';renderAnno();$('#exceptionTab').classList.add('active');$('#interactionTab').classList.remove('active')});
    $('#badgeToggle').addEventListener('click',()=>{state.badges=!state.badges;render()});$('#resetDemo').addEventListener('click',reset);
    $('#drawerMask').addEventListener('click',e=>{if(e.target.id==='drawerMask')closeDrawer()});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
    window.AdDemoApp={state,render,reset};render();
  })();
  </script>
</body>
</html>
