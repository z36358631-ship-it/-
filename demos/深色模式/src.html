<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盖世游戏 · 深色模式</title><style>
/* BASE_CSS */
:root{color-scheme:dark}body{background:#111113}.demo-toolbar{position:relative;gap:16px}.demo-brand{display:block}.demo-brand span{display:block;margin-top:4px}.review-note{font-size:12px;color:#b5b5bd;line-height:1.8;max-width:1040px;margin:16px auto;padding:0 24px}.review-note p{margin:5px 0}.review-note summary{cursor:pointer}.review-note pre{white-space:pre-wrap;max-height:190px;overflow:auto;color:#c5d7e2}.demo-options select{max-width:190px}.device{--fg:#eee;--muted:#ababaf;--line:#ffffff0b;--card:linear-gradient(140deg,#ffffff0d,#ffffff03);--stroke:#ffffff12;--sheet:#242426;color:var(--fg);color-scheme:dark}.device[data-theme=light]{--fg:#202124;--muted:#65666b;--line:#16171b10;--card:linear-gradient(145deg,#fff,#f6f6f8);--stroke:#25263218;--sheet:#fff;background:radial-gradient(ellipse 105% 90% at 90% 0%,#f4f4f6 0%,#ececef 42%,#e7e7ea 100%);color-scheme:light}.device[data-theme=light] .source-icon{filter:brightness(.23)}.device[data-theme=light] .row-arrow{opacity:.8}.device[data-theme=light] .battery{border-color:#555}.device[data-theme=light] .battery:after{background:#555}.settings-card{background:var(--card);border-color:var(--stroke)}.setting-row:not(:last-child):after{background:var(--line)}.setting-row .row-value{color:var(--muted)}.setting-row{color:var(--fg)}button.setting-row:hover{background:#88888810}.app-header h1,.land-header h1{color:var(--fg)}.app-back{width:28px;height:44px;margin-left:-6px}.app-header{gap:4px}.row-spacer{width:21px;flex:none}.app-body{padding-bottom:36px}.homebar{position:absolute;bottom:7px;left:calc(50% - 55px);width:110px;height:4px;background:currentColor;border-radius:4px;opacity:.7}.shade{position:absolute;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:10}.sheet{width:100%;border-radius:23px 23px 0 0;background:var(--sheet);padding:22px 20px 26px;box-shadow:0 -12px 48px #0003}.sheet h2{font-size:20px;margin:0 0 18px}.choices{border:1px solid var(--stroke);border-radius:14px;overflow:hidden}.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:14px 16px;text-align:left;background:transparent;border:0;color:var(--fg);font-size:16px}.choice+.choice{border-top:1px solid var(--line)}.choice span{flex:1}.radio{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center}.choice[aria-checked=true] .radio{border-color:#53b8d4;background:#53b8d4}.choice[aria-checked=true] .radio:after{content:'';width:9px;height:5px;border-left:2px solid #102c34;border-bottom:2px solid #102c34;transform:rotate(-45deg) translateY(-1px)}.cancel{width:100%;border:1px solid var(--stroke);border-radius:12px;background:#88888814;color:var(--fg);min-height:48px;margin-top:16px;font-size:16px}.landscape .shade{align-items:center;justify-content:center}.landscape .sheet{max-width:390px;border-radius:20px;padding:20px}.landscape .sheet h2{margin-bottom:14px}.landscape .choice{min-height:50px}.landscape .land-settings{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.landscape .land-header{border-color:var(--line)}.land-clock{color:var(--muted)!important}.capture-mode .review-note{display:none}.capture-mode .device.portrait{font-size:calc(100vw / 390 * 16)}.demo-toolbar label{color:#bdbdc6}.source-note{color:#999}.device button:focus-visible{outline:3px solid #38aaca;outline-offset:-3px}.back-marker{opacity:.75;cursor:default}.setting-row .row-value{max-width:40%}
</style><body><header class="demo-toolbar"><div class="demo-brand"><strong>深色模式</strong><span>GUANWANGGAID-51 · 评审演示</span></div><div class="demo-options"><button id="orientation" aria-pressed="false">横屏</button><label class="state-picker">系统外观<select id="system"><option value="actual">使用系统实际外观</option><option value="dark">模拟深色</option><option value="light">模拟浅色</option></select></label><label class="state-picker">初始化场景<select id="scenario"><option value="new">新用户</option><option value="old-dark">老用户 · 原深色</option><option value="old-light">老用户 · 原浅色</option></select></label><button id="reset">重新初始化</button></div></header><main id="app-stage"><section id="device" class="device portrait" aria-label="盖世游戏设置预览"></section></main><aside class="review-note"><p>评审控件仅用于验证，不属于 App。修改三项偏好即时生效并保存在本设备；“重新初始化”仅重置本 Demo 偏好。其他设置项保留原稿外观，不扩展业务。</p><p id="status"></p><details><summary>本地事件与来源说明</summary><p>参数 user_mode=dark/light 表示实际主题；theme_preference=system/on/off 表示偏好。事件仅在本地内存记录、不联网。浅色与横屏为派生方案，原始图标沿用登记局部资产；新增项缺少原图标，保留空图标位，不伪造。</p><pre id="events"></pre></details></aside><script>
const icons=/* ICON_DATA */;
const q=new URLSearchParams(location.search),key='gamehub-dark-mode-v1',mq=matchMedia('(prefers-color-scheme: dark)'),labels={system:'跟随系统',on:'开启',off:'关闭'};
const state={preference:null,system:q.get('system')||'actual',orientation:q.get('orientation')||'portrait',scenario:q.get('scenario')||'new',open:false,storage:true};
let saved;try{saved=localStorage.getItem(key)}catch(e){state.storage=false}state.preference=['system','on','off'].includes(saved)?saved:state.scenario==='old-dark'?'on':state.scenario==='old-light'?'off':'system';
const events=[];const device=document.querySelector('#device');const img=(id,cls='')=>`<img class="source-icon ${cls}" src="${icons[id]}" alt="">`;
function persist(){try{localStorage.setItem(key,state.preference);state.storage=true;return true}catch(e){state.storage=false;return false}}persist();
function effective(){return state.preference==='on'?'dark':state.preference==='off'?'light':state.system==='actual'?(mq.matches?'dark':'light'):state.system}
function log(event,extra={}){events.push({event,event_id:crypto.randomUUID(),user_mode:effective(),theme_preference:state.preference,...extra,time:new Date().toISOString()});document.querySelector('#events').textContent=JSON.stringify(events.slice(-20),null,2)}
const rows=[['account','账号管理'],['mode','模式切换','探索模式'],['theme','深色模式'],['gift','兑换中心'],['bell','通知'],['sound','按键音'],['shield','隐私设置'],['storage','存储管理'],['download','下载任务']];
function row([id,label,value]){const interactive=id==='theme';if(interactive&&q.has('baseline'))return '';return `<${interactive?'button':'div'} class="setting-row" ${interactive?'id="theme-entry" aria-haspopup="dialog"':''}>${interactive?'<span class="row-spacer" aria-hidden="true"></span>':img(id,'row-icon')}<span class="row-label">${label}</span>${(value||interactive)?`<span class="row-value">${interactive?labels[state.preference]:value}</span>`:''}${img('arrow','row-arrow')}</${interactive?'button':'div'}>`}
function cards(){return `<div class="settings-main"><div class="settings-card" data-component-id="settings-main">${rows.map(row).join('')}</div></div><div class="settings-secondary"><div class="settings-card" data-component-id="settings-support">${row(['feedback','反馈&建议'])}${row(['info','关于'])}</div><div class="settings-card"><div class="setting-row logout-row">退出登录</div></div></div>`}
function render(){const dark=effective();device.dataset.theme=dark;device.className=`device ${state.orientation}`;const back=`<span class="app-back back-marker" aria-hidden="true">${img('back')}</span>`;device.innerHTML=state.orientation==='portrait'?`<div class="statusbar"><span>10:11</span><span class="status-right"><span class="signal">▂▄▆</span><span>◉</span><span class="battery">91</span></span></div><header class="app-header" data-component-id="header">${back}<h1>设置</h1></header><div class="app-body">${cards()}</div>`:`<header class="land-header">${back}<h1>设置</h1><span class="land-clock">10:11　▂▄▆　91%</span></header><div class="land-settings">${cards()}</div>`;
if(state.open){device.insertAdjacentHTML('beforeend',`<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><h2 id="sheet-title">深色模式</h2><div class="choices" role="radiogroup" aria-label="深色模式偏好">${Object.entries(labels).map(([id,label])=>`<button class="choice" role="radio" aria-checked="${id===state.preference}" tabindex="${id===state.preference?0:-1}" data-value="${id}"><span>${label}</span><i class="radio" aria-hidden="true"></i></button>`).join('')}</div><button class="cancel">取消</button></section></div>`);device.querySelector('header').inert=true;device.querySelector('.app-body,.land-settings').inert=true;device.querySelector('[aria-checked=true]').focus()}
document.querySelector('#status').textContent=`当前偏好：${labels[state.preference]} · 实际外观：${dark==='dark'?'深色':'浅色'} · ${state.storage?'本设备已保存':'保存失败，已保留原选择，无法保存新偏好'}`;document.querySelector('#orientation').textContent=state.orientation==='portrait'?'横屏':'竖屏';document.querySelector('#orientation').setAttribute('aria-pressed',String(state.orientation==='landscape'));}
function close(){state.open=false;render();document.querySelector('#theme-entry')?.focus()}
function choose(value){const previous=state.preference,before=effective();if(value===previous){close();return}state.preference=value;if(!persist()){state.preference=previous;close();return}close();log('theme_preference_change',{previous_preference:previous});if(before!==effective())log('theme_view',{trigger_source:'user_selection'});lastActual=effective()}
device.addEventListener('click',e=>{if(e.target.closest('#theme-entry')){state.open=true;render()}else if(e.target.closest('[data-value]'))choose(e.target.closest('[data-value]').dataset.value);else if(e.target.closest('.cancel')||e.target.classList.contains('shade'))close()});
document.addEventListener('keydown',e=>{if(!state.open)return;if(e.key==='Escape'){e.preventDefault();close();return}const opts=[...device.querySelectorAll('.choice')];if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const step=['ArrowUp','ArrowLeft'].includes(e.key)?-1:1;opts[(opts.indexOf(document.activeElement)+step+3)%3].focus()}if(e.key==='Tab'){const first=device.querySelector('[aria-checked=true]'),last=device.querySelector('.cancel');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let lastActual=effective();document.querySelector('#orientation').onclick=()=>{state.orientation=state.orientation==='portrait'?'landscape':'portrait';render()};document.querySelector('#system').value=state.system;document.querySelector('#system').onchange=e=>{const before=effective();state.system=e.target.value;render();if(before!==effective())log('theme_view',{trigger_source:'system_change'});lastActual=effective()};document.querySelector('#scenario').value=state.scenario;document.querySelector('#reset').onclick=()=>{const previous=state.preference;state.scenario=document.querySelector('#scenario').value;state.preference=state.scenario==='old-dark'?'on':state.scenario==='old-light'?'off':'system';if(!persist())state.preference=previous;state.open=false;render();lastActual=effective();log('theme_view',{trigger_source:'foreground'})};mq.addEventListener('change',()=>{if(state.preference==='system'&&state.system==='actual'&&!document.hidden){render();if(lastActual!==effective())log('theme_view',{trigger_source:'system_change'});lastActual=effective()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();lastActual=effective();log('theme_view',{trigger_source:'foreground'})}});if(q.has('capture'))document.body.classList.add('capture-mode');render();log('theme_view',{trigger_source:'foreground'});window.ThemeDemo={state,events,effective,render};
</script></body></html>
