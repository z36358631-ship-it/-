let macReviews;try{const saved=JSON.parse(localStorage.getItem(MAC_STORAGE));macReviews=Array.isArray(saved)?saved:structuredClone(macSeeds)}catch{macReviews=structuredClone(macSeeds)}

function macTimestamp(){return new Intl.DateTimeFormat('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date())}
let macPage='detail',macTab='device',macMenu=null,macDraft=null,macSnapshotId=null,macUploading=false;
function macEsc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function macType(id){return MAC_TYPES.find(x=>x.id===id)||MAC_TYPES[1]}
function macAverageType(value){return value>=4?'perfect':value>=3?'basic':value>=2?'partial':'unplayable'}
function macReviewType(r){return MAC_TYPES.some(t=>t.id===r.type)?r.type:Number(r.stars)>=1&&Number(r.stars)<=5?macAverageType(Number(r.stars)):null}
function macStats(){const valid=macReviews.filter(r=>macReviewType(r));const count=valid.length;return{count,overall:count?macType(macAverageType(valid.reduce((s,r)=>s+(MAC_TYPES.some(t=>t.id===r.type)?macType(r.type).score:Number(r.stars)),0)/count)):null,counts:MAC_TYPES.map(t=>valid.filter(r=>macReviewType(r)===t.id).length)}}
function macSave(){try{localStorage.setItem(MAC_STORAGE,JSON.stringify(macReviews));return true}catch{return false}}
function macRender(){if(macTab==='device'&&!macReviews.some(r=>r.chip===MAC_DEVICE.chip))macTab='all';const s=macStats();document.getElementById('macContent').innerHTML=macPage==='detail'?macDetail(s):macReviewPage(s)}
function macDetail(s){return '<section class="mac-page"><div class="mac-top"><h1>赛博朋克 2077：终极版</h1></div><div class="detail-layout"><div><div class="detail-media">游戏视频／截图</div><div class="media-thumbs" aria-label="游戏媒体缩略图占位">'+Array(6).fill('<span></span>').join('')+'</div><div class="detail-sections"><b>游戏介绍</b><span>最低配置</span><span>成就</span><span>商品</span><span>讨论区</span><span>MOD</span></div><div class="content-placeholder">游戏介绍内容</div><h2 class="section-title">游戏配置</h2><div class="content-placeholder">游戏配置内容</div></div><aside><div class="detail-info"><div class="cover-placeholder">游戏封面</div><div class="info-body"><div class="info-row"><span>发行商名称</span><b>CD PROJEKT RED</b></div><div class="info-row"><span>开发商名称</span><b>CD PROJEKT RED</b></div><div class="info-row"><span>上线日期</span><b>2020-12-10</b></div><div class="info-row"><span>年龄</span><b>18+</b></div><div class="info-row"><span>支持平台</span><b>Steam · Mac · Windows</b></div><div class="purchase-actions"><span class="mac-btn light context-only">启动游戏／获取游戏</span><span class="mac-btn light context-only">云玩</span></div></div></div><button class="compat-card" onclick="macOpenReviews()" id="macCompatibilityEntry"><div><h3>兼容性评价</h3><strong>'+(s.overall?.label||'暂无评价')+'</strong>'+(s.overall?'<p class="compat-description">'+s.overall.description+'</p>':'')+'</div><span class="mac-muted">查看详情 ›</span></button><div class="content-placeholder related-placeholder">游戏相关资料：<br>支持平台、语言</div></aside></div></section>'}
let macDetailScroll=0;
function macOpenReviews(){macDetailScroll=window.scrollY;macPage='reviews';macTab=macReviews.some(r=>r.chip===MAC_DEVICE.chip)?'device':'all';macMenu=null;macRender();document.scrollingElement.scrollTo(0,0)}
function macBack(){macClose();macPage='detail';macRender();document.scrollingElement.scrollTo(0,macDetailScroll)}
function macSetTab(tab){macTab=tab;macMenu=null;macRender()}
function macReviewPage(s){const labels=[['all','全部'],['device','同配置'],['support','支持最多'],['mine','我的']];let rows=macReviews.slice();if(macTab==='device')rows=rows.filter(r=>r.chip===MAC_DEVICE.chip);if(macTab==='mine')rows=rows.filter(r=>r.mine);if(macTab==='support')rows.sort((a,b)=>b.likes-a.likes);return '<section class="mac-page reviews-page"><button class="mac-btn ghost back-to-detail" id="macBackToDetail" onclick="macBack()">‹ 返回游戏详情</button><div class="summary"><div class="summary-heading">兼容性评价</div><div><strong style="color:'+(s.overall?.color||'#92989c')+'">'+(s.overall?.label||'暂无评价')+'</strong>'+(s.overall?'<p class="compat-description">'+s.overall.description+'</p>':'')+'<small>'+s.count+' 条玩家评价</small></div><div class="bars">'+MAC_TYPES.map((t,i)=>'<div class="bar-row"><span style="color:'+t.color+'">'+t.label+'</span><div class="track"><div class="fill" style="background:'+t.color+';width:'+(s.count?s.counts[i]/Math.max(...s.counts)*100:0)+'%"></div></div><em>'+s.counts[i]+'</em></div>').join('')+'</div></div><div class="review-toolbar"><div class="tabs" role="tablist" aria-label="评价筛选">'+labels.map(([id,label])=>'<button role="tab" aria-selected="'+(macTab===id)+'" class="'+(macTab===id?'active':'')+'" onclick="macSetTab(\''+id+'\')">'+label+'</button>').join('')+'</div><button class="mac-btn blue" id="macWriteReview" onclick="macCompose()">我要评价</button></div><div class="reviews">'+(rows.length?rows.map(macReview).join(''):'<div class="empty"><strong>'+(macTab==='mine'?'还没有你的评价':'暂无同配置评价')+'</strong><p>'+(macTab==='mine'?'分享你的实际游玩体验':'看看其他玩家的兼容性体验')+'</p><button class="mac-btn ghost" onclick="'+(macTab==='mine'?'macCompose()':'macSetTab(\'all\')')+'">'+(macTab==='mine'?'我要评价':'查看全部评价')+'</button></div>')+'</div></section>'}
function macPhotoLayout(photos){const portraitCount=photos.filter(p=>MAC_PORTRAIT_IMAGES.includes(p)).length;return portraitCount===photos.length?'portrait':portraitCount?'mixed':'landscape'}
function macPhotoLoaded(image){const gallery=image.closest('.photos'),images=[...gallery.querySelectorAll('img')];if(!images.every(i=>i.complete&&i.naturalWidth>0))return;const portraitCount=images.filter(i=>i.naturalWidth<i.naturalHeight).length;gallery.dataset.layout=portraitCount===images.length?'portrait':portraitCount?'mixed':'landscape'}
function macReview(r){const t=macType(macReviewType(r));return '<article class="review" data-review="'+macEsc(r.id)+'"><div class="review-topline"><strong class="review-conclusion">'+t.label+'</strong><div class="device">'+macEsc('Steam · '+r.chip+' · '+r.memory+' · '+r.date)+'</div></div><div class="review-head"><div class="avatar">'+macEsc(r.name.slice(0,1))+'</div><div><div class="name">'+macEsc(r.name)+'</div></div>'+(r.mine?'<button class="more" aria-label="我的评价操作" onclick="macToggleMenu(\''+r.id+'\')">···</button>':'')+'</div>'+(macMenu===r.id?'<div class="menu"><button onclick="macCompose(\''+r.id+'\')">编辑</button><button class="delete" onclick="macDeleteConfirm(\''+r.id+'\')">删除</button></div>':'')+(r.text?'<p>'+macEsc(r.text)+'</p>':'')+(r.photos?.length?'<div class="photos '+(r.photos.length===1?'single':'')+'" data-count="'+r.photos.length+'" data-layout="'+macPhotoLayout(r.photos)+'">'+r.photos.map((p,i)=>'<button aria-label="查看评价图片 '+(i+1)+'" onclick="macOpenImage(\''+r.id+'\','+i+')"><img src="'+macEsc(p)+'" alt="玩家上传的游戏画面" onload="macPhotoLoaded(this)"></button>').join('')+'</div>':'')+(r.snapshot?'<button class="solution-card" onclick="macOpenSnapshot(\''+r.id+'\')"><span class="cube">'+MAC_CUBE+'</span><span><strong>本次启动配置</strong><small>本次游玩 '+macEsc(r.snapshot.duration)+'</small></span></button>':'')+'<div class="review-foot"><button class="support '+(r.supported?'on':'')+'" aria-label="支持评价" aria-pressed="'+!!r.supported+'" onclick="macSupport(\''+r.id+'\')">'+MAC_THUMB+' 支持 '+r.likes+'</button>'+(r.mine?'':'<button class="support report" onclick="macReport(\''+r.id+'\')" '+(r.reported?'disabled':'')+'>'+(r.reported?'已举报':'举报')+'</button>')+'</div></article>'}
function macReport(id){const r=macReviews.find(r=>r.id===id);if(!r||r.mine||r.reported)return;macModal('<div class="dialog-head"><h2 id="macDialogTitle">举报内容</h2><button class="close" onclick="macClose()" aria-label="关闭">×</button></div><p>'+macEsc(r.text)+'</p><p>选择原因</p><div class="report-reasons">'+['辱骂攻击','广告引流','恶意刷分','与游戏无关','其他'].map(x=>'<label><input type="radio" name="macReportReason" value="'+x+'"> '+x+'</label>').join('')+'</div><label class="field-title" for="macReportNote">补充说明（选填）</label><textarea class="description" id="macReportNote"></textarea><p class="error" id="macReportError" role="status"></p><div class="dialog-actions"><button class="mac-btn ghost" onclick="macClose()">取消</button><button class="mac-btn blue" onclick="macSubmitReport(\''+id+'\')">提交举报</button></div>')}
function macSubmitReport(id){if(!document.querySelector('input[name="macReportReason"]:checked')){document.getElementById('macReportError').textContent='请选择举报原因';return}const r=macReviews.find(r=>r.id===id);if(!r)return;r.reported=true;macSave();macClose();macRender()}
function macToggleMenu(id){macMenu=macMenu===id?null:id;macRender()}
function macSupport(id){const r=macReviews.find(r=>r.id===id);if(!r)return;r.supported=!r.supported;r.likes+=r.supported?1:-1;macSave();macRender()}
function macModal(body,wide=false){document.getElementById('macOverlay').innerHTML='<div class="overlay"><section class="dialog '+(wide?'wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="macDialogTitle">'+body+'</section></div>';document.querySelector('#macOverlay .close')?.focus()}
function macClose(){if(macDraft)macPersistDraft();document.getElementById('macOverlay').innerHTML='';macDraft=null;macSnapshotId=null;macUploading=false}
function macCompose(id){macMenu=null;const existing=id?macReviews.find(r=>r.id===id):macReviews.find(r=>r.mine&&r.chip===MAC_DEVICE.chip);macDraft=existing?structuredClone(existing):{id:'m'+Date.now(),name:'我',mine:true,chip:MAC_DEVICE.chip,device:MAC_DEVICE.name,os:MAC_DEVICE.os,memory:MAC_DEVICE.memory,type:'',text:'',photos:[],likes:0,date:new Date().toLocaleDateString('sv-SE')};try{const saved=JSON.parse(localStorage.getItem('gh-mac-review-draft-'+(existing?.id||'new')));if(saved&&saved.chip===MAC_DEVICE.chip)macDraft=saved}catch{}macDraft.editing=!!existing;macDraft.draftKey='gh-mac-review-draft-'+(existing?.id||'new');if(macDraft.keepSnapshot===undefined)macDraft.keepSnapshot=!!macDraft.snapshot;macRender();macRenderCompose(!!existing)}
function macRenderCompose(editing){const d=macDraft;macModal('<div class="dialog-head"><h2 id="macDialogTitle">'+(editing?'编辑评价':'评价')+'</h2><button class="close" onclick="macClose()" aria-label="关闭">×</button></div><div class="field-title">兼容性 <small>（设备：'+macEsc(d.device+' · '+d.chip)+'）</small></div><div class="choices">'+MAC_TYPES.map(t=>'<button class="choice '+(d.type===t.id?'selected':'')+'" data-type="'+t.id+'" aria-pressed="'+(d.type===t.id)+'" onclick="macChooseType(\''+t.id+'\')">'+t.label+'</button>').join('')+'</div><label class="field-title" for="macDescription">补充说明 <small>（选填）</small></label><textarea class="description" id="macDescription" maxlength="200" placeholder="描述遇到的问题或游玩体验" oninput="macChangeText(this.value)">'+macEsc(d.text)+'</textarea><div class="counter" id="macCounter">'+d.text.length+'/200</div><div class="field-title">图片 <small>（选填，最多 '+MAC_PHOTO_LIMIT+' 张）</small></div><div class="upload-row" id="macUploads"></div>'+(d.snapshot?'<div class="solution-card"><span class="cube">'+MAC_CUBE+'</span><span><strong>本次启动配置</strong><small>本次游玩 '+macEsc(d.snapshot.duration)+'</small></span></div><label class="notice" style="display:flex;gap:8px;align-items:center"><input id="macKeepSnapshot" type="checkbox" '+(d.keepSnapshot?'checked':'')+' '+(['perfect','basic'].includes(d.type)?'':'disabled')+' onchange="macDraft.keepSnapshot=this.checked;macPersistDraft()"> 保留已分享的配置</label><p class="notice" id="macShareHint">'+(['perfect','basic'].includes(d.type)?'已分享的配置随评价保留。':'部分兼容、不可玩不展示配置分享。')+'</p>':'')+'<div class="error" id="macFormError" role="status"></div><div class="dialog-actions"><button class="mac-btn ghost" onclick="macClose()">取消</button><button class="mac-btn blue" id="macSubmit" onclick="macSubmit()">'+(editing?'保存修改':'提交评价')+'</button></div>');macRenderUploads()}
function macPersistDraft(){if(!macDraft)return;try{localStorage.setItem(macDraft.draftKey,JSON.stringify(macDraft))}catch{}}
function macChooseType(type){macDraft.type=type;const keep=document.getElementById('macKeepSnapshot');if(keep){keep.disabled=!['perfect','basic'].includes(type);document.getElementById('macShareHint').textContent=keep.disabled?'部分兼容、不可玩不展示配置分享。':'已分享的配置随评价保留。'}macPersistDraft();document.querySelectorAll('#macOverlay .choice').forEach(b=>{const on=b.dataset.type===type;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});document.getElementById('macFormError').textContent=''}
function macChangeText(value){macDraft.text=value;macPersistDraft();document.getElementById('macCounter').textContent=value.length+'/200'}
function macRenderUploads(){document.getElementById('macUploads').innerHTML=macDraft.photos.map((p,i)=>'<div class="upload-thumb"><img src="'+macEsc(p)+'" alt="评价配图 '+(i+1)+'"><button class="remove-photo" aria-label="移除配图 '+(i+1)+'" onclick="macRemovePhoto('+i+')">×</button></div>').join('')+(macDraft.photos.length<MAC_PHOTO_LIMIT?'<label class="upload" aria-label="添加图片">+<input type="file" accept="image/*" multiple style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer" onchange="macAddPhotos(this.files)"></label>':'')}
function macRemovePhoto(index){macDraft.photos.splice(index,1);macPersistDraft();macRenderUploads()}
async function macAddPhotos(files){if(macUploading)return;const draft=macDraft;const error=document.getElementById('macFormError');if(files.length+draft.photos.length>MAC_PHOTO_LIMIT){error.textContent='最多上传 '+MAC_PHOTO_LIMIT+' 张图片';return}if([...files].some(f=>!f.type.startsWith('image/'))){error.textContent='请选择图片文件';return}macUploading=true;document.getElementById('macSubmit').disabled=true;try{const urls=await Promise.all([...files].map(f=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,1200/img.width);const canvas=document.createElement('canvas');canvas.width=img.width*scale;canvas.height=img.height*scale;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.8))};img.src=reader.result};reader.readAsDataURL(f)})));if(macDraft!==draft)return;draft.photos.push(...urls);macPersistDraft();macRenderUploads();error.textContent=''}catch{if(macDraft===draft)error.textContent='图片读取失败，请重新选择'}finally{macUploading=false;if(macDraft===draft)document.getElementById('macSubmit').disabled=false}}
function macSubmit(){if(!macDraft||macUploading)return;const err=document.getElementById('macFormError');if(!macDraft.type){err.textContent='请选择兼容性';return}if(macDraft.photos.length>MAC_PHOTO_LIMIT){err.textContent='最多保留 '+MAC_PHOTO_LIMIT+' 张图片，请移除多余图片';return}const draftKey=macDraft.draftKey;if(!['perfect','basic'].includes(macDraft.type)||!macDraft.keepSnapshot)delete macDraft.snapshot;const old=structuredClone(macReviews),i=macReviews.findIndex(r=>r.id===macDraft.id);macDraft.date=i>=0?macReviews[i].date:macTimestamp();if(i>=0)macReviews[i]=structuredClone(macDraft);else macReviews.unshift(structuredClone(macDraft));if(!macSave()){macReviews=old;err.textContent='本地存储空间不足，请减少图片后重试';return}localStorage.removeItem(draftKey);macDraft=null;macClose();macTab='mine';macPage='reviews';macRender()}
function macDeleteConfirm(id){macMenu=null;macRender();macModal('<div class="dialog-head"><h2 id="macDialogTitle">删除评价</h2><button class="close" onclick="macClose()" aria-label="关闭">×</button></div><p class="confirm-copy">删除后，这条评价及附带的配置分享将不再展示。确定删除吗？</p><div class="dialog-actions"><button class="mac-btn ghost" onclick="macClose()">取消</button><button class="mac-btn danger" onclick="macDelete(\''+id+'\')">删除</button></div>')}
function macDelete(id){macReviews=macReviews.filter(r=>r.id!==id);macSave();macClose();macRender()}
function macOpenImage(id,index){const r=macReviews.find(r=>r.id===id);if(!r?.photos?.[index])return;document.getElementById('macOverlay').innerHTML='<div class="overlay" role="dialog" aria-modal="true" aria-label="评价图片"><div class="image-dialog"><button class="close" onclick="macClose()" aria-label="关闭图片">×</button><img src="'+macEsc(r.photos[index])+'" alt="玩家上传图片"><div class="image-caption">'+(index+1)+' / '+r.photos.length+'</div></div></div>';document.querySelector('#macOverlay .close').focus()}
function macOpenSnapshot(id){const r=macReviews.find(r=>r.id===id);if(!r?.snapshot)return;macSnapshotId=id;const s=r.snapshot,mismatch=s.chip!==MAC_DEVICE.chip;macModal('<div class="dialog-head"><h2 id="macDialogTitle">配置详情</h2><button class="close" onclick="macClose()" aria-label="关闭">×</button></div><div class="snapshot-title"><span class="cube">'+MAC_CUBE+'</span><div><strong>本次启动配置</strong><p>'+macEsc(s.author)+' · 本次游玩 '+macEsc(s.duration)+'</p></div></div><div class="snapshot-grid">'+[['芯片',s.chip],['运行引擎',s.engine],['图形渲染',s.renderer],['分辨率',s.resolution],['垂直同步',s.sync],['游戏','赛博朋克 2077']].map(([k,v])=>'<div class="info-row"><span>'+k+'</span><b>'+macEsc(v)+'</b></div>').join('')+'</div><p class="notice">该配置为评价发布时保存的快照，不随作者后续修改而变化。</p>'+(mismatch?'<p class="notice warn">当前芯片与配置芯片不同，暂无法应用</p>':'')+'<div id="macSnapshotResult" class="inline-result" role="status"></div><div class="dialog-actions"><button class="mac-btn ghost" id="macCopyConfig" onclick="macCopySnapshot()">复制到本地</button><button class="mac-btn blue" id="macApplyConfig" '+(mismatch?'disabled':'')+' onclick="macApplyConfirm()">应用配置</button></div>',true)}
function macCopySnapshot(){const r=macReviews.find(r=>r.id===macSnapshotId);if(!r?.snapshot)return;try{const key='gh-mac-local-schemes',items=JSON.parse(localStorage.getItem(key)||'[]');if(!items.some(x=>x.sourceReviewId===r.id)){items.push({...structuredClone(r.snapshot),sourceReviewId:r.id,name:'本次启动配置'});localStorage.setItem(key,JSON.stringify(items))}document.getElementById('macCopyConfig').textContent='已复制到本地';document.getElementById('macSnapshotResult').textContent='已保存到本地配置方案'}catch{document.getElementById('macSnapshotResult').textContent='保存失败，请重试'}}
function macApplyConfirm(){const r=macReviews.find(r=>r.id===macSnapshotId);if(!r?.snapshot||r.snapshot.chip!==MAC_DEVICE.chip)return;const id=r.id;macModal('<div class="dialog-head"><h2 id="macDialogTitle">应用配置</h2><button class="close" onclick="macClose()" aria-label="关闭">×</button></div><p class="confirm-copy">将此配置应用于赛博朋克 2077，下次启动时生效。</p><div class="dialog-actions"><button class="mac-btn ghost" onclick="macOpenSnapshot(\''+id+'\')">取消</button><button class="mac-btn blue" onclick="macApply(\''+id+'\')">确认应用</button></div>')}
function macApply(id){const r=macReviews.find(r=>r.id===id);if(!r?.snapshot||r.snapshot.chip!==MAC_DEVICE.chip)return;try{localStorage.setItem('gh-mac-active-scheme',JSON.stringify(r.snapshot));macOpenSnapshot(id);document.getElementById('macApplyConfig').textContent='已应用';document.getElementById('macSnapshotResult').textContent='已应用，下次启动时生效'}catch{macOpenSnapshot(id);document.getElementById('macSnapshotResult').textContent='应用失败，请重试'}}
document.addEventListener('keydown',function macKeydown(event){if(event.key==='Escape'){macClose();macMenu=null;macRender()}});
window.macCompatibilityDemo={openReviews:macOpenReviews,openCompose:macCompose,openSnapshot:macOpenSnapshot,close:macClose,getReviews:()=>structuredClone(macReviews),getStats:macStats,getDevice:()=>({...MAC_DEVICE}),setTab:macSetTab,getState:()=>({page:macPage,tab:macTab,draft:macDraft?structuredClone(macDraft):null}),setDeviceChip(chip){MAC_DEVICE.chip=chip;macRender()},reset(){localStorage.removeItem(MAC_STORAGE);macReviews=structuredClone(macSeeds);macPage='detail';macClose();macRender()}};
macRender();
