function statusbar(){return `<div class="statusbar"><span>4:17</span><div class="signals"><span>▮▮▮</span><span>⌁</span><span class="battery"></span></div></div>`}
function bottomNav(){return `<div class="bottom-nav"><div class="bottom-item">${I.home}<span>主页</span></div><div class="bottom-item">${I.game}<span>玩游戏</span></div><div class="bottom-item">${I.rank}<span>排行榜</span></div><div class="bottom-item active">${I.library}<span>游戏库</span></div><div class="bottom-item">${I.me}<span>我的</span></div></div>`}
function tabs(cls='tabs'){const labels={pc:'PC游戏',console:'主机游戏',retro:'复古游戏'};return `<div class="${cls}">${Object.entries(labels).map(([k,v])=>`<button class="tab ${state.tab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div>`}
function searchBox(mode){const value=state.search[state.tab]||'';return `<label class="search-box ${mode==='landscape'?'l-search':''}">${I.search}<input value="${escapeHtml(value)}" placeholder="搜索游戏名" oninput="setSearch(this.value)"></label>`}
function getGames(){const q=(state.search[state.tab]||'').trim().toLowerCase();let list=[...(state.games[state.tab]||[])];if(q)list=list.filter(x=>x.name.toLowerCase().includes(q));if(state.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));return list}
function portraitCard(g){return `<article class="game-card"><div class="game-cover ${g.cover}"><span class="platform-badge">${state.tab==='console'?'主机':state.tab==='pc'?'PC':'复古'}</span></div><div class="game-body"><div class="game-name">${g.name}</div><div class="game-meta">${g.meta}</div><div class="card-actions"><button class="play-btn" onclick="startGame('${g.id}')">启动</button><button class="more-btn" aria-label="更多" onclick="openMore('${g.id}')">•••</button></div></div></article>`}
function landscapeCard(g){return `<article class="l-card"><div class="game-cover ${g.cover}"><span class="platform-badge">${state.tab==='console'?'主机':state.tab==='pc'?'PC':'复古'}</span></div><div class="game-body"><div class="game-name">${g.name}</div><div class="game-meta">${g.meta}</div><div class="card-actions"><button class="play-btn" onclick="startGame('${g.id}','landscape')">启动</button><button class="more-btn" onclick="openMore('${g.id}','landscape')">•••</button></div></div></article>`}

function importDialog(landscape=false){return `${landscape?landscapeLibraryBody():portraitLibraryBody()}<div class="shade"><div class="dialog"><div class="sheet-head"><h2>导入游戏</h2><button class="x" onclick="closeImport()">×</button></div><button class="option" onclick="choosePkg()"><span class="option-icon">PKG</span><span><h3>选择 PKG</h3><p>从文件管理器选择单个游戏本体、更新包或 DLC</p></span></button><button class="option" onclick="chooseFolder()"><span class="option-icon">${I.folder}</span><span><h3>导入游戏文件夹</h3><p>选择包含多款游戏文件的文件夹，识别后自行勾选</p></span></button></div></div>`}
function sceneImport(){return importDialog(false)}

function phonePage(title,body,action='',back='library'){return statusbar()+`<div class="page-head"><button class="back" onclick="go('${back}')">‹</button><h1>${title}</h1>${action}</div><div class="page-body">${body}</div>`}

function filePicker(kind){const isPkg=kind==='pkg';const title=isPkg?'选择 PKG':'选择游戏文件夹';const rows=isPkg?[{id:'pkg1',name:'CUSA20344_base_v1.00.pkg',meta:'28.4 GB · PKG 文件'},{id:'pkg2',name:'CUSA20344_update_v1.09.pkg',meta:'9.6 GB · PKG 文件'}]:[{id:'folder1',name:'主机游戏备份',meta:'包含 3 个游戏目录 · 76.8 GB'},{id:'folder2',name:'Download',meta:'12 个项目'},{id:'folder3',name:'Documents',meta:'8 个项目'}];const selected=isPkg?state.pkgSelected:state.folderSource;return `<div class="file-manager"><div class="fm-head"><button class="back" onclick="go('${state.flowOrientation==='landscape'?'import_landscape':'import'}')">‹</button><h1>${title}</h1><span style="font-size:11px;color:#8f9299">文件管理器</span></div><div class="fm-path">内部存储 / ${isPkg?'Download':'GameBackup'}</div><div class="fm-list">${rows.map(r=>`<button class="fm-row ${selected===r.id?'selected':''}" onclick="${isPkg?`selectPkg('${r.id}')`:`selectFolder('${r.id}')`}"><span class="fm-icon">${isPkg?'PKG':I.folder}</span><span class="fm-main"><span class="fm-name">${r.name}</span><span class="fm-meta">${r.meta}</span></span><span class="fm-radio"></span></button>`).join('')}</div><div class="fm-foot"><button class="secondary" onclick="go('${state.flowOrientation==='landscape'?'import_landscape':'import'}')">取消</button><button class="primary" onclick="go('${isPkg?'pkgRecognize':'folderScan'}')">${isPkg?'选择此文件':'选择此文件夹'}</button></div></div>`}

function scenePlaying(){let touch=state.touchKeys?`<div class="joy"></div><div class="keys"><i class="key y">Y</i><i class="key x">X</i><i class="key b">B</i><i class="key a">A</i></div>`:'';let menu=state.pauseOpen?`<div class="pause-card"><h2>游戏菜单</h2><button class="pause-row" onclick="continueGame()"><span class="row-icon">Ⅱ</span>继续游戏<span class="arrow">›</span></button><button class="pause-row" onclick="toggleTouchIngame()"><span class="row-icon">◎</span>显示触控按键<span class="switch ${state.touchKeys?'on':''}"></span></button><button class="pause-row" onclick="openIngamePanel('layout')"><span class="row-icon">AB</span>按键与布局<span class="arrow">›</span></button><button class="pause-row" onclick="openIngamePanel('mapping')"><span class="row-icon">⌁</span>手柄映射<span class="arrow">›</span></button><button class="pause-row quit" onclick="askExit()"><span class="row-icon">×</span>退出游戏<span class="arrow">›</span></button></div>`:'';let panel='';if(state.ingamePanel==='layout')panel=`<div class="ingame-panel"><div class="sheet-head"><h2>按键与布局</h2><button class="x" onclick="closeIngamePanel()">×</button></div><div class="layout-choice"><button class="layout-card active" onclick="selectLayout(this)">标准布局</button><button class="layout-card" onclick="selectLayout(this)">紧凑布局</button></div><div class="group-title">按键透明度</div><input class="range" type="range" min="20" max="100" value="65" oninput="showToast('透明度 '+this.value+'%')"><button class="primary" style="width:100%;margin-top:18px" onclick="closeIngamePanel()">保存</button></div>`;if(state.ingamePanel==='mapping')panel=`<div class="ingame-panel"><div class="sheet-head"><h2>手柄映射</h2><button class="x" onclick="closeIngamePanel()">×</button></div><div class="list-group"><button class="list-row" onclick="showToast('A 已设置为确认')"><span class="row-icon">A</span><span class="row-text"><b>确认</b><span>物理按键 A</span></span><span class="row-end">修改</span></button><button class="list-row" onclick="showToast('B 已设置为返回')"><span class="row-icon">B</span><span class="row-text"><b>返回</b><span>物理按键 B</span></span><span class="row-end">修改</span></button><button class="list-row" onclick="showToast('摇杆映射已校准')"><span class="row-icon">L</span><span class="row-text"><b>移动</b><span>左摇杆</span></span><span class="row-end">校准</span></button></div><button class="primary" style="width:100%;margin-top:18px" onclick="closeIngamePanel()">保存</button></div>`;let exit=state.exitConfirm?`<div class="shade" style="align-items:center"><div class="confirm-card"><h2>退出游戏？</h2><p>当前游戏进度请先在游戏内保存，退出后将返回游戏库。</p><div class="sticky-actions"><button class="secondary" onclick="cancelExit()">继续游戏</button><button class="secondary danger" onclick="exitGame()">退出游戏</button></div></div></div>`:'';return `<div class="game-world"><div class="ingame-top"><span class="ingame-badge">暗夜余烬</span><span class="ingame-badge">60 FPS</span></div>${touch}<button class="side-trigger" onclick="openGameMenu()">•••</button>${menu}${panel}${exit}</div>`}

function sceneAdmin(){return `<aside class="admin-side"><div class="admin-brand">盖世游戏运营中心</div><div class="admin-menu"><div>首页</div><div>用户管理</div><div>游戏管理</div><div class="active">引擎插件管理</div><div>操作记录</div></div></aside><main class="admin-main"><div class="admin-title"><div><h1>引擎插件管理</h1><p>管理客户端引擎插件版本、灰度和更新策略</p></div><button class="admin-primary" onclick="openAdminModal()">＋ 新增版本</button></div><div class="filters"><input class="admin-input" value="主机游戏引擎"><select class="admin-input"><option>全部状态</option><option>灰度中</option><option>已启用</option></select><input class="admin-input" placeholder="版本号"><button class="admin-primary" onclick="showToast('已按当前条件查询')">查询</button></div><div class="admin-card"><table class="table"><thead><tr><th>插件名称</th><th>版本号</th><th>适用端</th><th>更新策略</th><th>灰度范围</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody><tr><td>主机游戏引擎</td><td>1.2.0</td><td>Android</td><td><span class="tag blue">非强制</span></td><td>Global · 20%</td><td><span class="tag">${state.adminStatus}</span></td><td>2026-08-14 09:20</td><td><button class="op" onclick="openAdminModal()">编辑</button><button class="op" onclick="adminAction('停用')">停用</button><button class="op" onclick="adminAction('全量')">全量</button></td></tr><tr><td>主机游戏引擎</td><td>1.1.2</td><td>Android</td><td><span class="tag blue">强制</span></td><td>国内 · 100%</td><td><span class="tag">已启用</span></td><td>2026-08-08 11:42</td><td><button class="op" onclick="showToast('已打开版本详情')">详情</button><button class="op" onclick="adminAction('回滚')">回滚</button></td></tr></tbody></table><div class="admin-foot"><span>共 2 条记录</span><span>第 1 / 1 页</span></div></div></main>${state.adminModal?adminModal():''}`}
function adminModal(){return `<div class="admin-modal"><div class="admin-dialog"><h2>配置引擎版本</h2><div class="admin-form"><label class="admin-field">版本号<input value="1.2.1"></label><label class="admin-field">更新策略<select><option>非强制更新</option><option>强制更新</option></select></label><label class="admin-field">外放地区<select><option>Global</option><option>国内</option><option>自定义</option></select></label><label class="admin-field">灰度比例<input value="20%"></label></div><div class="admin-actions"><button class="admin-secondary" onclick="closeAdminModal()">取消</button><button class="admin-primary" onclick="saveAdminModal()">保存</button></div></div></div>`}

const renderers={library:sceneLibrary,library_landscape:sceneLibraryLandscape,empty:sceneEmpty,unsupported:sceneUnsupported,import:sceneImport,import_landscape:sceneImportLandscape,pkgPicker:scenePkgPicker,pkgRecognize:scenePkgRecognize,pkgInstall:scenePkgInstall,folderPicker:sceneFolderPicker,folderScan:sceneFolderScan,folderSelect:sceneFolderSelect,folderInstall:sceneFolderInstall,scan:sceneFolderSelect,install:sceneFolderInstall,more:sceneMore,more_landscape:sceneMoreLandscape,saves:sceneSaves,saves_delete:()=>{state.saveDelete='s1';return sceneSaves()},savePicker:sceneSavePicker,settings:sceneSettings,controls:sceneControls,component:sceneComponent,playing:scenePlaying,playing_exit:()=>{state.exitConfirm=true;state.pauseOpen=true;return scenePlaying()},admin:sceneAdmin};
const flowScenes=new Set(['pkgPicker','pkgRecognize','pkgInstall','folderPicker','folderScan','folderSelect','folderInstall','saves','saves_delete','savePicker','settings','controls','component']);
function isLandscape(scene){return scene==='library_landscape'||scene==='import_landscape'||scene==='more_landscape'||scene==='playing'||scene==='playing_exit'||(flowScenes.has(scene)&&state.flowOrientation==='landscape')}
function go(scene,push=true){if(!renderers[scene])scene='library';if(state.installTimer){clearInterval(state.installTimer);state.installTimer=null}state.currentScene=scene;document.querySelectorAll('.scene-btn').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene));const adminMode=scene==='admin',landMode=isLandscape(scene);phoneWrap.classList.toggle('active',!adminMode&&!landMode);landscapeWrap.classList.toggle('active',landMode);adminWrap.classList.toggle('active',adminMode);if(adminMode)admin.innerHTML=renderers[scene]();else if(landMode)landscape.innerHTML=renderers[scene]();else phone.innerHTML=renderers[scene]();const n=notes[scene]||notes[scene.replace('_landscape','')]||notes.library;noteTitle.textContent=n[0];noteRule.textContent=n[1];noteList.innerHTML=n[2].map(x=>`<li>${x}</li>`).join('');if(scene==='saves')initPullRefresh();if(scene==='pkgInstall')beginInstall('pkg');if(scene==='folderInstall')beginInstall('folder');if(push){const u=new URL(location.href);u.searchParams.set('scene',scene);history.replaceState(null,'',u)}}
function setTab(tab){state.tab=tab;go(state.currentScene.includes('landscape')?'library_landscape':'library')}
function setSearch(value){state.search[state.tab]=value;const host=isLandscape(state.currentScene)?landscape:phone;const scroll=host.querySelector('.l-content,.p-scroll');if(scroll){const temp=isLandscape(state.currentScene)?sceneLibraryLandscape():sceneLibrary();host.innerHTML=temp;host.querySelector('input')?.focus()}}
function clearSearch(){state.search[state.tab]='';go(state.currentScene.includes('landscape')?'library_landscape':'library')}
function cycleSort(){state.sort=state.sort==='recent'?'name':'recent';go(state.currentScene.includes('landscape')?'library_landscape':'library');showToast(state.sort==='name'?'已按名称排序':'已按最近安装排序')}
function toggleView(){state.view=state.view==='grid'?'list':'grid';go('library')}
function openImport(orientation='portrait'){state.flowOrientation=orientation;state.returnScene=orientation==='landscape'?'library_landscape':'library';go(orientation==='landscape'?'import_landscape':'import')}
function closeImport(){go(state.returnScene)}
function choosePkg(){go('pkgPicker')}
function chooseFolder(){go('folderPicker')}
function selectPkg(id){state.pkgSelected=id;go('pkgPicker')}
function selectFolder(id){state.folderSource=id;go('folderPicker')}
function toggleFolder(id){if(state.folderSelected.has(id))state.folderSelected.delete(id);else state.folderSelected.add(id);go('folderSelect')}
function startGame(id,orientation='portrait'){state.flowOrientation=orientation;state.returnScene=orientation==='landscape'?'library_landscape':'library';go('component')}
function openMore(id,orientation='portrait'){state.flowOrientation=orientation;state.returnScene=orientation==='landscape'?'library_landscape':'library';go(orientation==='landscape'?'more_landscape':'more')}
function beginInstall(type){let pct=12;state.installTimer=setInterval(()=>{pct=Math.min(100,pct+11);document.querySelectorAll('.install-pct').forEach(e=>e.textContent=pct+'%');document.querySelectorAll('.install-bar').forEach(e=>e.style.width=pct+'%');document.querySelectorAll('.install-size').forEach(e=>e.textContent=(pct*.36).toFixed(1)+' GB');document.querySelectorAll('.install-remain').forEach(e=>e.textContent=pct<76?'约 '+Math.max(1,Math.ceil((100-pct)/22))+' 分钟':'即将完成');document.querySelectorAll('#installRing').forEach(e=>e.style.background=`conic-gradient(var(--blue) 0 ${pct}%,#292b30 ${pct}%)`);if(pct>=48)document.querySelectorAll('.install-stage').forEach(e=>e.textContent=type==='pkg'?'正在安装游戏':'正在安装第 2/2 款游戏');if(pct===100){clearInterval(state.installTimer);state.installTimer=null;setTimeout(()=>{state.installed=true;state.tab='console';showToast('安装完成');go(state.flowOrientation==='landscape'?'library_landscape':'library')},650)}},380)}
function cancelInstall(back){if(state.installTimer)clearInterval(state.installTimer);state.installTimer=null;go(back)}
function confirmRemove(){const host=isLandscape(state.currentScene)?landscape:phone;host.insertAdjacentHTML('beforeend',`<div class="shade" style="align-items:center"><div class="confirm-card"><h2>移除游戏？</h2><p>将删除游戏本体、更新包和 DLC，存档会保留。</p><div class="sticky-actions"><button class="secondary" onclick="go('${state.returnScene}')">取消</button><button class="secondary danger" onclick="removeGame()">移除</button></div></div></div>`)}
function removeGame(){state.games.console=state.games.console.filter(g=>g.id!=='g1');go(state.returnScene)}
function initPullRefresh(){const zone=document.getElementById('pullZone'),scroll=document.getElementById('saveScroll');if(!zone||!scroll)return;let start=0,pulling=false;scroll.addEventListener('pointerdown',e=>{if(scroll.parentElement.scrollTop===0){start=e.clientY;pulling=true}});scroll.addEventListener('pointermove',e=>{if(!pulling)return;const d=Math.max(0,e.clientY-start);zone.style.height=Math.min(72,35+d*.45)+'px';zone.textContent=d>55?'松开刷新':'下拉刷新'});scroll.addEventListener('pointerup',e=>{if(!pulling)return;pulling=false;const d=e.clientY-start;if(d>55){state.saveRefresh='正在刷新…';zone.textContent=state.saveRefresh;setTimeout(()=>{state.saveRefresh='刷新完成';go('saves');showToast('存档已更新')},650)}else{zone.style.height='35px';zone.textContent='下拉刷新'}})}
function openExport(){state.saveExport=true;go('saves')}
function openSaveDelete(id){state.saveDelete=id;go('saves')}
function closeSaveDialog(){state.saveExport=false;state.saveDelete='';go('saves')}
function finishExport(){state.saveExport=false;go('saves');showToast('存档已导出')}
function deleteSave(){state.saves=state.saves.filter(s=>s.id!==state.saveDelete);state.saveDelete='';go('saves');showToast('存档已删除')}
function importSave(){state.saves.push({id:'s'+Date.now(),name:'导入存档 · 城堡前厅',meta:'2026-08-14 09:12 · 16.5 MB'});go('saves');showToast('存档导入成功')}
function toggleRowSwitch(btn){btn.querySelector('.switch')?.classList.toggle('on')}
function toggleTouchFromSettings(btn){state.touchKeys=!state.touchKeys;btn.querySelector('.switch')?.classList.toggle('on',state.touchKeys)}
function showChoice(){showToast('已切换为系统 Vulkan 驱动')}
function selectLayout(el){el.parentElement.querySelectorAll('.layout-card').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function showRange(v){const e=document.getElementById('rangeValue');if(e)e.textContent=v+'%'}
function openGameMenu(){state.pauseOpen=true;state.ingamePanel='';go('playing')}
function continueGame(){state.pauseOpen=false;go('playing')}
function toggleTouchIngame(){state.touchKeys=!state.touchKeys;state.pauseOpen=true;go('playing')}
function openIngamePanel(panel){state.ingamePanel=panel;state.pauseOpen=false;go('playing')}
function closeIngamePanel(){state.ingamePanel='';state.pauseOpen=true;go('playing')}
function askExit(){state.exitConfirm=true;go('playing')}
function cancelExit(){state.exitConfirm=false;state.pauseOpen=false;go('playing')}
function exitGame(){state.exitConfirm=false;state.pauseOpen=true;go('library_landscape')}
function openAdminModal(){state.adminModal=true;go('admin')}
function closeAdminModal(){state.adminModal=false;go('admin')}
function saveAdminModal(){state.adminModal=false;state.adminStatus='灰度中';go('admin');showToast('版本配置已保存')}
function adminAction(type){if(type==='停用')state.adminStatus='已停用';if(type==='全量')state.adminStatus='已启用';go('admin');showToast(type==='回滚'?'已回滚至 1.1.2':`已${type}`)}
function showToast(text){document.querySelectorAll('.toast').forEach(x=>x.remove());const host=document.querySelector('.device-wrap.active .screen,.device-wrap.active .landscape,.device-wrap.active .admin-shell')||document.body;const e=document.createElement('div');e.className='toast';e.textContent=text;host.appendChild(e);setTimeout(()=>e.remove(),2300)}
function escapeHtml(value){return String(value).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

document.querySelectorAll('.scene-btn').forEach(b=>b.onclick=()=>{if(['library_landscape','playing'].includes(b.dataset.scene))state.flowOrientation='landscape';else if(b.dataset.scene!=='admin')state.flowOrientation='portrait';go(b.dataset.scene)});
go(new URLSearchParams(location.search).get('scene')||'library',false);
</script>
</body>
</html>
