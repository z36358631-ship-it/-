  <aside class="notes">

function showToast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());let host=document.querySelector('.active .screen,.active .landscape,.active .admin-shell')||document.body;let e=document.createElement('div');e.className='toast';e.textContent=t;host.appendChild(e);setTimeout(()=>e.remove(),2300)}
const renderers={library:sceneLibrary,empty:()=>sceneEmpty('empty'),unsupported:()=>sceneEmpty('unsupported'),import:sceneImport,scan:sceneScan,install:sceneInstall,more:sceneMore,saves:sceneSaves,settings:sceneSettings,component:sceneComponent,playing:scenePlaying,admin:sceneAdmin};
function go(scene,push=true){if(!renderers[scene])scene='library';document.querySelectorAll('.scene-btn').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene));phoneWrap.classList.toggle('active',!['playing','admin'].includes(scene));landscapeWrap.classList.toggle('active',scene==='playing');adminWrap.classList.toggle('active',scene==='admin');if(scene==='playing')landscape.innerHTML=renderers[scene]();else if(scene==='admin')admin.innerHTML=renderers[scene]();else phone.innerHTML=renderers[scene]();let n=notes[scene];noteTitle.textContent=n[0];noteRule.textContent=n[1];noteList.innerHTML=n[2].map(x=>`<li>${x}</li>`).join('');if(push){let u=new URL(location.href);u.searchParams.set('scene',scene);history.replaceState(null,'',u)}}
document.querySelectorAll('.scene-btn').forEach(b=>b.onclick=()=>go(b.dataset.scene));
go(new URLSearchParams(location.search).get('scene')||'library',false);
</script>
</body>
