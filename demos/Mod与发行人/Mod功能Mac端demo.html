<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>盖世游戏 · 饥荒联机版 MODS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --canvas-width: 2160;
      --canvas-height: 1480;
      --bg-window: #1c1b20;
      --bg-rail: #222126;
      --bg-card: #242328;
      --bg-card-raised: #2b2a2f;
      --bg-modal: #29282b;
      --border: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f6f6f7;
      --text-secondary: #b9b7bd;
      --text-muted: #85838a;
      --text-dark: #121214;
      --success: #64d7ac;
      --warning: #ffba6a;
      --danger: #ff7b78;
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --shadow-card: 0 24px 68px rgba(0, 0, 0, 0.22);
      --shadow-modal: 0 38px 120px rgba(0, 0, 0, 0.56);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d0f;
    }

    body {
      color: var(--text-primary);
      font-family: var(--font-primary);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    input {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.86);
      outline-offset: 4px;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(83, 77, 88, 0.18), transparent 38%),
        #0d0d0f;
    }

    .mac-canvas {
      position: relative;
      width: 2160px;
      height: 1480px;
      flex: none;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.17);
      border-radius: 32px;
      background:
        radial-gradient(circle at 40% -6%, rgba(79, 72, 83, 0.15), transparent 32%),
        radial-gradient(circle at 75% 8%, rgba(44, 50, 54, 0.12), transparent 28%),
        var(--bg-window);
      box-shadow:
        0 50px 160px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transform: scale(var(--canvas-scale, 1));
      transform-origin: center;
    }

    .traffic-lights {
      position: absolute;
      z-index: 70;
      top: 18px;
      left: 19px;
      display: flex;
      gap: 18px;
    }

    .traffic-lights span {
      width: 29px;
      height: 29px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 50%;
      background: #45444a;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }

    .side-rail {
      position: absolute;
      z-index: 20;
      top: 76px;
      left: 28px;
      width: 132px;
      height: 1376px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 34px;
      background: rgba(35, 34, 39, 0.96);
      box-shadow:
        0 20px 52px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .rail-button,
    .rail-avatar {
      position: absolute;
      left: 34px;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: #aaa9ae;
    }

    .rail-button.back { top: 62px; }
    .rail-button.home { top: 233px; }
    .rail-button.cloud { top: 337px; }
    .rail-button.stats { top: 441px; }
    .rail-button.gamepad { top: 545px; }
    .rail-button.grid { top: 649px; }
    .rail-button.device { top: 753px; }
    .rail-button.search { top: 1057px; }
    .rail-button.download { top: 1161px; }

    .rail-avatar {
      top: 1270px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.04)),
        #35343a;
      color: #d5d3d7;
    }

    .icon {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .icon.small {
      width: 26px;
      height: 26px;
    }

    .icon.large {
      width: 44px;
      height: 44px;
    }

    .product-view {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .game-detail {
      position: absolute;
      top: 93px;
      left: 207px;
      width: 1300px;
      height: 1387px;
    }

    .compatibility-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 1300px;
      height: 192px;
      padding: 31px 41px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      background:
        linear-gradient(130deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.005)),
        rgba(31, 30, 35, 0.72);
      box-shadow: var(--shadow-card);
    }

    .compatibility-card h2 {
      color: #d3d1d5;
      font-size: 27px;
      font-weight: 430;
      line-height: 36px;
    }

    .compatibility-card strong {
      display: block;
      margin-top: 18px;
      color: #c4c2c7;
      font-size: 25px;
      font-weight: 360;
    }

    .compatibility-card p {
      margin-top: 18px;
      color: #a7a5aa;
      font-size: 23px;
      line-height: 32px;
    }

    .compatibility-link {
      position: absolute;
      top: 72px;
      right: 42px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #c5c3c8;
      font-size: 24px;
    }

    .game-detail-title {
      position: absolute;
      top: 238px;
      left: 0;
      font-size: 34px;
      font-weight: 580;
      line-height: 48px;
    }

    .workshop-card {
      position: absolute;
      top: 321px;
      left: 0;
      width: 1300px;
      height: 460px;
      padding: 31px 33px 28px;
      border: 2px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      background: rgba(31, 30, 35, 0.78);
      box-shadow: var(--shadow-card);
    }

    .workshop-heading {
      height: 72px;
      display: flex;
      align-items: center;
    }

    .workshop-symbol,
    .mods-symbol {
      width: 61px;
      height: 61px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.11);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.035);
      color: #bbb9be;
    }

    .workshop-copy {
      margin-left: 20px;
    }

    .workshop-copy strong {
      display: block;
      color: #d7d5d8;
      font-size: 28px;
      font-weight: 430;
      line-height: 36px;
    }

    .workshop-copy span {
      display: block;
      margin-top: 6px;
      color: #85838a;
      font-size: 22px;
    }

    .workshop-all {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #c1bfc4;
      font-size: 24px;
    }

    .workshop-count {
      padding: 8px 15px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      color: #8d8b91;
      font-size: 20px;
    }

    .workshop-thumbnails {
      position: absolute;
      right: 33px;
      bottom: 28px;
      left: 33px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .workshop-tile {
      height: 307px;
      overflow: hidden;
      border-radius: 20px;
      background: #302f34;
    }

    .workshop-tile img {
      display: block;
      width: 100%;
      height: 208px;
      object-fit: cover;
    }

    .workshop-tile strong,
    .workshop-tile span {
      display: block;
      padding: 0 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workshop-tile strong {
      margin-top: 14px;
      color: #d6d4d7;
      font-size: 22px;
      font-weight: 400;
    }

    .workshop-tile span {
      margin-top: 7px;
      color: #77757b;
      font-size: 19px;
    }

    .mods-entry-card {
      position: absolute;
      top: 823px;
      left: 0;
      width: 1300px;
      height: 147px;
      padding: 0 34px;
      display: flex;
      align-items: center;
      border: 2px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.035), transparent 40%),
        rgba(31, 30, 35, 0.82);
      color: var(--text-primary);
      text-align: left;
      box-shadow: var(--shadow-card);
      transition: 150ms ease;
    }

    .mods-entry-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background-color: #242328;
    }

    .mods-entry-copy {
      margin-left: 21px;
    }

    .mods-entry-copy strong {
      display: block;
      font-size: 28px;
      font-weight: 560;
      line-height: 36px;
    }

    .mods-entry-copy span {
      display: block;
      margin-top: 8px;
      color: #8e8c92;
      font-size: 21px;
      font-weight: 350;
    }

    .mods-entry-chevron {
      margin-left: auto;
      color: #77757b;
    }

    .entry-preview {
      width: 160px;
      height: 89px;
      margin-left: 22px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: #29282d;
    }

    .entry-preview.placeholder {
      display: grid;
      place-items: center;
      color: #747279;
    }

    .entry-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .explore-title {
      position: absolute;
      top: 1015px;
      left: 0;
      font-size: 35px;
      font-weight: 520;
    }

    .explore-card {
      position: absolute;
      top: 1105px;
      left: 0;
      width: 1300px;
      height: 282px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px 24px 0 0;
      background: #252329;
    }

    .explore-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mods-list {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .back-detail {
      position: absolute;
      top: 25px;
      left: 207px;
      min-width: 162px;
      height: 61px;
      padding: 0 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px solid rgba(255, 255, 255, 0.09);
      border-radius: 31px;
      background: rgba(39, 38, 43, 0.88);
      color: #c9c7cb;
      font-size: 23px;
    }

    .back-detail:hover,
    .refresh-button:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .mods-list-header {
      position: absolute;
      top: 129px;
      left: 207px;
      width: 1300px;
      height: 93px;
      display: flex;
      align-items: flex-start;
    }

    .mods-list-title h1 {
      font-size: 36px;
      font-weight: 580;
      line-height: 48px;
    }

    .mods-list-title p {
      margin-top: 9px;
      color: #95939a;
      font-size: 21px;
    }

    .list-tools {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 17px;
    }

    .search-field {
      width: 372px;
      height: 54px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      background: rgba(35, 34, 39, 0.74);
      color: #8b8990;
    }

    .search-field input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: #dbd9dd;
      font-size: 21px;
    }

    .search-field input::placeholder {
      color: #77757b;
    }

    .refresh-button {
      height: 54px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 2px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      background: rgba(35, 34, 39, 0.74);
      color: #b2b0b5;
      font-size: 21px;
    }

    .refresh-button.is-refreshing .icon {
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .mods-grid {
      position: absolute;
      top: 247px;
      left: 207px;
      width: 1300px;
      height: 1233px;
      display: grid;
      grid-template-columns: 636px 636px;
      grid-auto-rows: 615px;
      gap: 27px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .mods-grid::-webkit-scrollbar,
    .modal-scroll::-webkit-scrollbar {
      display: none;
    }

    .mod-card {
      width: 636px;
      height: 615px;
      display: grid;
      grid-template-rows: 356px 176px 83px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      background: #242328;
      box-shadow: var(--shadow-card);
    }

    .mod-cover {
      position: relative;
      overflow: hidden;
      background: #202024;
    }

    .mod-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .placeholder-cover {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #68666c;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.025), transparent 28%),
        #202024;
    }

    .mod-copy {
      min-width: 0;
      padding: 23px 27px 18px;
    }

    .mod-copy h2 {
      overflow: hidden;
      color: #ededee;
      font-size: 25px;
      font-weight: 560;
      line-height: 34px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mod-copy p {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 11px;
      color: #a4a2a8;
      font-size: 20px;
      line-height: 28px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .mod-copy small {
      display: block;
      margin-top: 12px;
      color: #77757b;
      font-size: 16px;
      line-height: 22px;
    }

    .mod-copy strong {
      display: block;
      margin-top: 6px;
      color: #9a989e;
      font-size: 16px;
      font-weight: 400;
      line-height: 22px;
    }

    .mod-copy strong.is-installed {
      color: var(--success);
    }

    .mod-card footer {
      padding: 0 27px;
      display: flex;
      align-items: center;
      border-top: 2px solid rgba(255, 255, 255, 0.08);
    }

    .install-button {
      min-width: 130px;
      height: 49px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 25px;
      background: #f7f7f8;
      color: #151517;
      font-size: 21px;
      font-weight: 560;
    }

    .install-button:disabled {
      cursor: default;
      background: #4a484e;
      color: #b4b1b8;
    }

    .empty-list {
      grid-column: 1 / 3;
      height: 615px;
      display: grid;
      place-items: center;
      border: 2px dashed rgba(255, 255, 255, 0.09);
      border-radius: 24px;
      color: #8a888e;
      font-size: 24px;
    }

    .empty-list-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .empty-list-content button {
      height: 48px;
      padding: 0 24px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.07);
      color: #d4d2d6;
      font-size: 19px;
    }

    .empty-list-content button:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .modal-backdrop {
      position: absolute;
      z-index: 50;
      inset: 0;
      background: rgba(9, 9, 11, 0.78);
      backdrop-filter: blur(18px);
    }

    .mod-detail-modal {
      position: absolute;
      top: 118px;
      left: 359px;
      width: 1442px;
      height: 1244px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 48px;
      background:
        linear-gradient(130deg, rgba(255, 255, 255, 0.035), transparent 36%),
        rgba(40, 39, 42, 0.98);
      box-shadow: var(--shadow-modal);
    }

    .modal-header {
      position: absolute;
      z-index: 3;
      top: 0;
      right: 0;
      left: 0;
      height: 137px;
      padding: 0 56px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.08);
      background: rgba(43, 42, 45, 0.98);
    }

    .modal-header h2 {
      font-size: 36px;
      font-weight: 560;
      line-height: 48px;
    }

    .modal-close {
      width: 58px;
      height: 58px;
      margin-left: auto;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.025);
      color: #838188;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #c9c7cb;
    }

    .modal-scroll {
      position: absolute;
      top: 137px;
      right: 0;
      bottom: 130px;
      left: 0;
      overflow-y: auto;
      padding: 42px 56px 82px;
      scrollbar-width: none;
    }

    .detail-cover {
      width: 1328px;
      height: 746px;
      display: block;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 31px;
      background: #1e1d21;
    }

    .detail-placeholder {
      width: 1328px;
      height: 746px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 31px;
      background: #1e1d21;
      color: #67656b;
    }

    .section-title {
      margin-top: 48px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #9c9aa0;
      font-size: 23px;
      font-weight: 400;
    }

    .section-title::before {
      width: 24px;
      height: 2px;
      background: #525057;
      content: "";
    }

    .description-card {
      margin-top: 28px;
      padding: 30px 34px 33px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 25px;
      background:
        linear-gradient(125deg, rgba(255, 255, 255, 0.025), transparent 46%),
        rgba(44, 43, 46, 0.76);
      color: #cbc9cd;
      font-size: 25px;
      line-height: 1.62;
    }

    .description-card h4 {
      margin-top: 36px;
      color: #d6d4d8;
      font-size: 25px;
      font-weight: 430;
    }

    .description-card p + p {
      margin-top: 10px;
    }

    .description-note {
      margin-top: 34px;
      padding-top: 26px;
      border-top: 2px solid rgba(255, 255, 255, 0.07);
      color: #9b999f;
      font-size: 21px;
    }

    .modal-action-bar {
      position: absolute;
      z-index: 4;
      right: 0;
      bottom: 0;
      left: 0;
      height: 130px;
      padding: 29px 56px;
      display: flex;
      gap: 18px;
      border-top: 2px solid rgba(255, 255, 255, 0.09);
      background: rgba(43, 42, 45, 0.98);
      backdrop-filter: blur(22px);
    }

    .modal-action-bar button {
      height: 72px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      flex: 1;
      border: 0;
      border-radius: 36px;
      background: #f7f7f8;
      color: #111113;
      font-size: 24px;
      font-weight: 600;
    }

    .modal-action-bar button.secondary,
    .modal-action-bar button.danger {
      border: 2px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #d0ced2;
    }

    .modal-action-bar button.danger {
      color: #ffaaa7;
    }

    .modal-action-bar button:disabled {
      cursor: default;
      background: #545158;
      color: #c1bec5;
    }

    .task-progress {
      width: 1328px;
      margin-top: 24px;
      padding: 20px 24px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.025);
      color: #bbb9be;
      font-size: 20px;
    }

    .progress-track {
      height: 6px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.09);
    }

    .progress-track span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: #f4f4f5;
    }

    .confirm-backdrop {

      color: #aeacb2;
      font-size: 22px;
      line-height: 1.55;

    .confirm-actions {
      margin-top: 34px;
      display: flex;
      gap: 14px;
    }

    .confirm-actions button {
      height: 58px;
      flex: 1;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 29px;
      background: rgba(255, 255, 255, 0.04);
      color: #d3d1d5;
      font-size: 21px;
    }

    .confirm-actions button.confirm-danger {
      border: 0;
      background: #f7f7f8;
      color: #151517;
      font-weight: 600;
    }

    .toast-region {
      position: absolute;
      z-index: 80;
      right: 44px;
      bottom: 42px;
      pointer-events: none;
    }

    .toast {
      max-width: 560px;
      padding: 18px 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: rgba(38, 37, 42, 0.96);
      color: #d2d0d4;
      font-size: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);

    .game-detail {
      overflow-y: auto;
      scrollbar-width: none;
    }

    .game-detail::-webkit-scrollbar {
      display: none;
    }

      position: absolute;
      top: 823px;
      left: 0;
      width: 1300px;
      height: 460px;
      padding: 31px 33px 28px;

    .mods-title-row {

      align-items: center;
      gap: 12px;

    .mods-discovery-copy strong {

      font-size: 28px;
      font-weight: 560;
      line-height: 36px;

    .mods-source-badge {

      font-style: normal;
      font-weight: 400;
      line-height: 20px;

    .mods-discovery-copy .mods-subtitle {
      display: block;
      margin-top: 6px;
      color: #89878e;
      font-size: 20px;
      line-height: 26px;

    .mods-discovery-all {
      height: 50px;
      margin-left: auto;
      padding: 0 4px 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 13px;
      border: 0;
      background: transparent;
      color: #c6c4c9;
      font-size: 24px;
    }

    .mods-discovery-all:hover {
      color: #f1eff2;
    }

    .mods-discovery-count {
      padding: 8px 15px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      color: #929097;
      font-size: 20px;
      line-height: 24px;

    .mods-featured-grid {

      right: 33px;
      bottom: 28px;
      left: 33px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .featured-mod {
      height: 307px;
      min-width: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: 208px 55px 44px;
      border: 0;
      border-radius: 20px;
      background: #302f34;
      color: #d9d7da;
      text-align: left;
      transition:
        transform 150ms ease,
        background-color 150ms ease;
    }

    .featured-mod:hover {
      transform: translateY(-3px);
      background: #37363b;
    }

    .featured-cover {
      min-width: 0;
      overflow: hidden;
      display: block;
      background: #202024;
    }

    .featured-cover > .placeholder-cover {

      height: 208px;
      display: block;
      object-fit: cover;
      border-radius: 0;

      padding: 0 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .featured-mod > strong {
      padding-top: 13px;
      font-size: 22px;
      font-weight: 430;
      line-height: 30px;

    .featured-mod > span:last-child {
      padding-top: 3px;
      color: #85838a;
      font-size: 18px;
      line-height: 27px;

    .generated-cover::before,

      transform: rotate(18deg);

    .cover-stack {

      background:

    .cover-gather {
      background:
        radial-gradient(circle at 28% 24%, rgba(113, 213, 151, 0.26), transparent 30%),
        linear-gradient(145deg, #2d503e, #161d19);
    }

    .cover-night {
      background:
        radial-gradient(circle at 72% 23%, rgba(165, 132, 255, 0.28), transparent 31%),
        linear-gradient(145deg, #332d56, #171720);
    }

    .cover-archive {

    }

      top: 1332px;

    .explore-card.discovery-layout {
      top: 1421px;
    }

    .mods-tabs {

      top: 238px;
      left: 207px;

      height: 62px;
      display: flex;
      align-items: stretch;
      gap: 8px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.08);
    }

    .mods-tabs button {

      padding: 0 28px;
      border: 0;
      background: transparent;
      color: #88868d;
      font-size: 23px;
      font-weight: 430;

    .mods-tabs button:hover {
      color: #cac8cd;

    .mods-tabs button.is-active {
      color: #f1f0f2;
      font-weight: 560;
    }

    .mods-tabs button.is-active::after {
      position: absolute;
      right: 25px;
      bottom: -2px;
      left: 25px;
      height: 4px;
      border-radius: 4px 4px 0 0;
      background: #f1f0f2;
      content: "";
    }

      left: 207px;
      width: 1300px;
      height: 64px;
      display: flex;
      align-items: center;
    }

    .catalog-toolbar > p {
      color: #88868d;
      font-size: 20px;
      line-height: 28px;
    }

    .catalog-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .browse-sort-options {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #817f86;
      font-size: 18px;

      background: rgba(35, 34, 39, 0.76);

      font-size: 17px;

    .browse-sort-options button:hover {
      color: #c9c7cb;

    .browse-sort-options button.is-active {
      border-color: rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.12);
      color: #f0eff1;
    }

    .installed-filters {
      height: 48px;
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 3px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 25px;
      background: rgba(35, 34, 39, 0.76);
    }

    .installed-filters button {
      height: 36px;
      min-width: 78px;
      padding: 0 13px;
      border: 0;
      border-radius: 19px;
      background: transparent;
      color: #85838a;
      font-size: 17px;
    }

    .installed-filters button:hover {
      color: #c9c7cb;
    }

    .installed-filters button.is-active {
      background: rgba(255, 255, 255, 0.12);
      color: #f0eff1;
    }

      top: 401px;
      height: 1079px;
      grid-auto-rows: 492px;
    }

    .mod-card {
      position: relative;
      height: 492px;
      grid-template-rows: 320px 108px 64px;
      transition:
        border-color 150ms ease,
        transform 150ms ease;
    }

    .mod-card:has(.mod-card-hit-area:hover) {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .mod-card-hit-area {
      position: absolute;
      z-index: 2;
      inset: 0;
      border: 0;
      border-radius: inherit;
      background: transparent;
    }

    .mod-card-hit-area:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.86);
      outline-offset: -6px;
    }

    .mods-grid.is-installed-grid {
      grid-auto-rows: 428px;
    }

    .mod-card.is-installed-view {
      height: 428px;
      grid-template-rows: 320px 108px;
    }

    .mod-copy {
      padding: 14px 27px 9px;
    }

    .catalog-metrics {

      margin-top: 5px;
      color: #8f8d94;
      font-size: 16px;
      line-height: 21px;
    }

    .mod-copy small {
      margin-top: 5px;
      font-size: 15px;
      line-height: 20px;
    }

    .mod-copy strong.mod-state {
      margin-top: 2px;
      color: #8f8d94;
      font-size: 15px;
      line-height: 20px;
    }

    .mod-copy strong.mod-state.is-installed {
      color: var(--success);
    }

    .mod-card footer {
      position: relative;
      z-index: 3;
      padding: 0 27px;
      pointer-events: none;
    }

    .mod-card footer .install-button {
      margin-left: auto;
      pointer-events: auto;
    }

    .installed-pill {
      height: 44px;
      margin-left: auto;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 2px solid rgba(255, 255, 255, 0.09);
      border-radius: 23px;
      background: rgba(255, 255, 255, 0.035);
      color: #9c9aa0;
      font-size: 18px;
    }

    .empty-list {
      height: 492px;
    }

    .detail-metrics {
      width: 1328px;
      margin-top: 24px;
      display: grid;
      grid-template-columns: 0.9fr 1fr 0.9fr 0.8fr 1.55fr;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.025);

    .detail-metrics span {
      min-width: 0;
      height: 92px;
      padding: 17px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      border-right: 2px solid rgba(255, 255, 255, 0.07);
      color: #85838a;
      font-size: 16px;
      line-height: 22px;
    }

    .detail-metrics span:last-child {
      border-right: 0;
    }

    .detail-metrics strong {
      overflow: hidden;
      color: #d7d5d9;
      font-size: 21px;
      font-weight: 520;
      line-height: 28px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-metrics + .section-title {
      margin-top: 24px;
    }

    function derive(current) {
      const allMods = Object.values(current.mods);
      const installedMods = allMods.filter(mod => mod.installation_fact === 'installed');
      const featuredMods = allMods
        .filter(mod => mod.featured)
        .sort((a, b) => a.popularity_rank - b.popularity_rank)
        .slice(0, 3);
      const browseComparators = {
        popular: (a, b) => a.popularity_rank - b.popularity_rank,
        downloads: (a, b) => b.download_count - a.download_count,
        updated: (a, b) => b.updated_at.localeCompare(a.updated_at),
        name: (a, b) => a.name.localeCompare(b.name, 'zh-CN')
      };
      const installedRecentComparator = (a, b) =>
        (b.installed_at || '').localeCompare(a.installed_at || '')
        || a.name.localeCompare(b.name, 'zh-CN');
      const installedFilters = {
        all: () => true,
        update: mod => mod.update_fact === 'update_available'
          || activeTask(current, mod)?.task_state === 'failed'
      };
      const activeTab = current.ui.activeTab === 'installed' ? 'installed' : 'browse';
      const searchText = current.ui.searchByTab[activeTab] || '';
      const search = searchText.trim().toLowerCase();
      const sourceMods = activeTab === 'installed'
        ? installedMods
            .filter(installedFilters[current.ui.installedFilter] || installedFilters.all)
            .sort(installedRecentComparator)
        : [...allMods].sort(browseComparators[current.ui.browseSort] || browseComparators.popular);
      const visibleMods = search
        ? sourceMods.filter(mod =>
            `${mod.name} ${mod.author}`.toLowerCase().includes(search)
          )
        : sourceMods;
      const currentMod = current.ui.currentModId
        ? current.mods[current.ui.currentModId] ?? null
        : null;
      return {
        state: current,
        allMods,
        installedMods,
        featuredMods,
        visibleMods,
        currentMod,
        activeTab,
        searchText,
        catalogTotal: 128,
        catalogLoaded: allMods.length,
        installedCount: installedMods.length,
        enabledCount: allMods.filter(mod => mod.enabled_value === 'enabled').length
      };
    }

    function activeTask(next, mod) {
      if (!mod?.current_task_id) return null;
      return next.tasks[mod.current_task_id] ?? null;
    }

    function ensureTask(next, modId, operation) {
      const mod = next.mods[modId];
      if (!mod || mod.install_gate !== 'allowed') return null;
      const existing = activeTask(next, mod);
      if (existing && !['succeeded', 'cancelled'].includes(existing.task_state)) {
        return existing.task_id;
      }
      next.metrics.taskSequence += 1;
      next.metrics.taskCreateCount += 1;
      const taskId = `task-${next.device_installation_id}-${modId}-${next.metrics.taskSequence}`;
      next.tasks[taskId] = {
        task_id: taskId,
        root_mod_id: modId,
        operation,
        task_state: 'queued',
        progress_percent: 0,
        operation_attempt: 1,
        failure_code: null
      };
      mod.current_task_id = taskId;
      return taskId;
    }

    function completeTask(next, task, mod) {
      task.task_state = 'succeeded';
      task.progress_percent = 100;
      mod.installation_fact = 'installed';
      if (task.operation === 'install') mod.enabled_value = 'enabled';
      mod.installed_version = mod.latest_version;
      mod.installed_package_hash = `sha256:${mod.mod_id}:${mod.latest_version}`;
      mod.active_version_pointer = mod.latest_version;
      mod.update_fact = 'no_update';
      if (task.operation === 'install') mod.installed_at = new Date().toISOString();
      mod.current_task_id = null;
    }

    function reducer(current, action) {
      const next = clone(current);
      const modId = action.modId || action.mod_id || next.ui.currentModId;
      const mod = modId ? next.mods[modId] : null;

      switch (action.type) {
        case 'RESET':
          return createInitialState();
        case 'OPEN_MODS':
          next.ui.screen = 'mods-list';
          next.ui.activeTab = action.tab === 'installed' ? 'installed' : 'browse';
          next.ui.currentModId = null;
          next.ui.activeDialog = null;
          return next;
        case 'BACK_GAME':
          next.ui.screen = 'game-detail';
          next.ui.currentModId = null;
          next.ui.activeDialog = null;
          return next;
        case 'OPEN_DETAIL':
          if (!mod) return next;
          next.ui.screen = 'mods-list';
          next.ui.detailReturnScreen = 'mods-list';
          next.ui.currentModId = mod.mod_id;
          next.ui.activeDialog = 'mod-detail';
          next.metrics.detailRequestCount += 1;
          return next;
        case 'OPEN_FEATURED_DETAIL':
          if (!mod) return next;
          next.ui.screen = 'game-detail';
          next.ui.detailReturnScreen = 'game-detail';
          next.ui.currentModId = mod.mod_id;
          next.ui.activeDialog = 'mod-detail';
          next.metrics.detailRequestCount += 1;
          return next;
        case 'CLOSE_DETAIL':
          next.ui.currentModId = null;
          next.ui.activeDialog = null;
          return next;
        case 'SET_ACTIVE_TAB':
          next.ui.activeTab = action.value === 'installed' ? 'installed' : 'browse';
          return next;
        case 'SET_BROWSE_SORT':
          next.ui.browseSort = ['popular', 'downloads', 'updated', 'name'].includes(action.value)
            ? action.value
            : 'popular';
          return next;
        case 'SET_INSTALLED_SORT':
          next.ui.installedSort = action.value === 'name' ? 'name' : 'recent';
          return next;
        case 'SET_INSTALLED_FILTER':
          next.ui.installedFilter = ['all', 'update'].includes(action.value)
            ? action.value
            : 'all';
          next.ui.scrollTopByTab.installed = 0;
          return next;
        case 'SET_SEARCH':
          next.ui.searchByTab[next.ui.activeTab] = String(action.value || '');
          return next;
        case 'SAVE_SCROLL_TOP':
          next.ui.scrollTopByTab[action.tab === 'installed' ? 'installed' : 'browse'] =
            Math.max(0, Number(action.value) || 0);
          return next;
        case 'REFRESH_REQUESTED':
          next.ui.refreshing = true;
          return next;
        case 'REFRESH_FINISHED':
          next.ui.refreshing = false;
          return next;
        case 'INSTALL_REQUESTED':
          if (!mod || mod.installation_fact === 'installed') return next;
          ensureTask(next, mod.mod_id, 'install');
          return next;
        case 'UPDATE_REQUESTED':
          if (!mod || mod.installation_fact !== 'installed') return next;
          ensureTask(next, mod.mod_id, 'update');
          return next;
        case 'TASK_ADVANCE': {
          const task = next.tasks[action.taskId || action.task_id]
            || (mod ? activeTask(next, mod) : null);
          if (!task || !['queued', 'downloading', 'verifying', 'installing'].includes(task.task_state)) {
            return next;
          }
          const taskMod = next.mods[task.root_mod_id];
          if (!taskMod) return next;
          if (task.task_state === 'queued') {
            task.task_state = 'downloading';
            task.progress_percent = 42;
          } else if (task.task_state === 'downloading' && task.progress_percent < 80) {
            task.progress_percent = Math.min(82, task.progress_percent + 40);
          } else if (task.task_state === 'downloading') {
            task.task_state = 'verifying';
            task.progress_percent = 92;
          } else if (task.task_state === 'verifying') {
            task.task_state = 'installing';
            task.progress_percent = 97;
          } else if (task.task_state === 'installing') {
            completeTask(next, task, taskMod);
          }
          return next;
        }
        case 'ENABLE_CHANGED':
          if (!mod || mod.installation_fact !== 'installed') return next;
          mod.enabled_value = action.value === 'enabled' ? 'enabled' : 'disabled';
          return next;
        case 'UPDATE_FAILED': {
          if (!mod || mod.installation_fact !== 'installed') return next;
          const task = activeTask(next, mod);
          if (task && task.operation === 'update') {
            task.task_state = 'failed';
            task.failure_code = 'PACKAGE_HASH_MISMATCH';
          }
          mod.update_fact = 'update_available';
          return next;
        }
        case 'UNINSTALL_REQUESTED':
          if (!mod || mod.installation_fact !== 'installed') return next;
          next.ui.currentModId = mod.mod_id;
          next.ui.activeDialog = 'uninstall-confirm';
          return next;
        case 'UNINSTALL_CANCELLED':
          next.ui.activeDialog = next.ui.currentModId ? 'mod-detail' : null;
          return next;
        case 'UNINSTALL_CONFIRMED':
          if (!mod || mod.installation_fact !== 'installed') return next;
          mod.installation_fact = 'not_installed';
          mod.enabled_value = 'not_applicable';
          mod.update_fact = 'no_update';
          mod.installed_version = null;
          mod.installed_package_hash = null;
          mod.active_version_pointer = null;
          mod.current_task_id = null;
          mod.installed_at = null;
          next.ui.activeDialog = 'mod-detail';
          return next;
        default:
          return next;
      }
    }

    function dispatch(action) {
      state = reducer(state, action);
      render();
      return clone(derive(state));
    }

    function taskLabel(task) {
      if (!task) return '';
      const labels = {
        queued: '等待下载',
        downloading: `下载中 ${task.progress_percent}%`,
        verifying: '正在校验',
        installing: task.operation === 'update' ? '正在更新' : '正在安装',
        succeeded: '已完成',
        failed: task.operation === 'update' ? '更新失败，保留旧版' : '安装失败',
        cancelled: '已取消'
      };
      return labels[task.task_state] || task.task_state;
    }

    function formatDownloads(value) {
      if (value >= 10000) {
        return `${(value / 10000).toFixed(1).replace(/\.0$/, '')} 万`;
      }
      return String(value);
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
    }

    function selectOptions(options, selected) {

        ['gamepad', 'gamepad', '游戏'],
        ['grid', 'grid', '应用'],
        ['device', 'device', '设备'],
        ['search', 'search', '搜索'],
        ['download', 'download', '下载']

      return items.map(([name, glyph]) =>
        `<span class="rail-button ${name}" aria-hidden="true">${icon(glyph, name === 'back' ? 'large' : '')}</span>`
      ).join('') + `<div class="rail-avatar" aria-hidden="true">${icon('user')}</div>`;

      const installedStatus = task?.task_state === 'failed'

        : mod.update_fact === 'update_available'

      const status = viewModel.activeTab === 'installed' ? installedStatus : '';
      const showBrowseFooter = viewModel.activeTab === 'browse';

    }

    function renderUninstallConfirm(viewModel) {

      if (!mod) return '';
      return `
        <div class="confirm-backdrop">
          <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <h3 id="confirm-title">仅从当前设备卸载“${escapeHtml(mod.name)}”</h3>
            <p>存档和用户 MOD 配置不会被删除。该操作只移除当前设备上的安装文件。</p>
            <div class="confirm-actions">
              <button type="button" data-action="cancel-uninstall">取消</button>
              <button type="button" class="confirm-danger" data-action="confirm-uninstall" data-mod-id="${mod.mod_id}">确认卸载</button>
            </div>
          </section>
        </div>
      `;
    }

    function render() {
      const viewModel = derive(state);
      const focus = document.activeElement?.matches?.('[data-input="search"]')
        ? {
            selectionStart: document.activeElement.selectionStart,
            selectionEnd: document.activeElement.selectionEnd
          }
        : null;
      root.dataset.currentScreen = state.ui.screen;
      root.querySelector('[data-reference-region="side-rail"]').innerHTML = renderSideRail();
      viewRoot.innerHTML = state.ui.screen === 'mods-list'
        ? renderModsList(viewModel)
        : renderGameDetail(viewModel);
      if (state.ui.activeDialog === 'mod-detail') {
        viewRoot.insertAdjacentHTML('beforeend', renderModDetail(viewModel));
      }
      if (state.ui.activeDialog === 'uninstall-confirm') {
        viewRoot.insertAdjacentHTML('beforeend', renderModDetail(viewModel));
        viewRoot.insertAdjacentHTML('beforeend', renderUninstallConfirm(viewModel));
      }
      if (focus) {
        const input = root.querySelector('[data-input="search"]');
        if (input) {
          input.focus();
          input.setSelectionRange(focus.selectionStart, focus.selectionEnd);
        }
      }
      const listScroll = root.querySelector('[data-mods-scroll]');
      if (listScroll) {
        listScroll.scrollTop = state.ui.scrollTopByTab[state.ui.activeTab] || 0;
      }
    }

    function reset() {
      for (const timer of runnerRegistry.values()) clearTimeout(timer);
      runnerRegistry.clear();
      state = createInitialState();
      render();
      return clone(state);
    }

    function showToast(message) {
      toastRegion.innerHTML = `<div class="toast">${message}</div>`;
      setTimeout(() => {
        if (toastRegion.textContent === message) toastRegion.innerHTML = '';
      }, 2200);
    }

    function armTaskRunner(taskId) {
      if (!taskId || runnerRegistry.has(taskId)) return;
      const tick = () => {
        runnerRegistry.delete(taskId);
        const task = state.tasks[taskId];
        if (!task || !['queued', 'downloading', 'verifying', 'installing'].includes(task.task_state)) return;
        dispatch({ type: 'TASK_ADVANCE', task_id: taskId });
        const nextTask = state.tasks[taskId];
        if (nextTask && ['queued', 'downloading', 'verifying', 'installing'].includes(nextTask.task_state)) {
          const timer = setTimeout(tick, 760);
          runnerRegistry.set(taskId, timer);
        } else if (nextTask?.task_state === 'succeeded') {
          showToast(nextTask.operation === 'update' ? '更新完成，当前设备已切换到新版本。' : '安装完成，已在当前设备启用。');
        }
      };
      const timer = setTimeout(tick, 560);
      runnerRegistry.set(taskId, timer);
    }

    root.addEventListener('click', event => {
      const control = event.target.closest('[data-action]');
      if (!control) return;
      const action = control.dataset.action;
      const modId = control.dataset.modId;
      if (action === 'open-mods') dispatch({ type: 'OPEN_MODS', tab: control.dataset.tab || 'browse' });
      if (action === 'back-game') dispatch({ type: 'BACK_GAME' });
      if (action === 'open-detail') dispatch({ type: 'OPEN_DETAIL', modId });
      if (action === 'open-featured-detail') dispatch({ type: 'OPEN_FEATURED_DETAIL', modId });
      if (action === 'close-detail') dispatch({ type: 'CLOSE_DETAIL' });
      if (action === 'set-tab') {
        const scroll = root.querySelector('[data-mods-scroll]');
        if (scroll) dispatch({ type: 'SAVE_SCROLL_TOP', tab: state.ui.activeTab, value: scroll.scrollTop });
        dispatch({ type: 'SET_ACTIVE_TAB', value: control.dataset.value });
      }
      if (action === 'set-installed-filter') {
        dispatch({ type: 'SET_INSTALLED_FILTER', value: control.dataset.value });
      }
      if (action === 'set-browse-sort') {
        dispatch({ type: 'SET_BROWSE_SORT', value: control.dataset.value });
      }
      if (action === 'refresh') {
        dispatch({ type: 'REFRESH_REQUESTED' });
        setTimeout(() => {
          dispatch({ type: 'REFRESH_FINISHED' });
          showToast('列表已刷新，安装状态来自当前设备。');
        }, 720);
      }
      if (action === 'install') {
        dispatch({ type: 'INSTALL_REQUESTED', modId });
        armTaskRunner(state.mods[modId]?.current_task_id);
      }
      if (action === 'toggle-enabled') {
        const mod = state.mods[modId];
        dispatch({
          type: 'ENABLE_CHANGED',
          modId,
          value: mod?.enabled_value === 'enabled' ? 'disabled' : 'enabled'
        });
      }
      if (action === 'update') {
        dispatch({ type: 'UPDATE_REQUESTED', modId });
        armTaskRunner(state.mods[modId]?.current_task_id);
      }
      if (action === 'uninstall') dispatch({ type: 'UNINSTALL_REQUESTED', modId });
      if (action === 'cancel-uninstall') dispatch({ type: 'UNINSTALL_CANCELLED' });
      if (action === 'confirm-uninstall') {
        dispatch({ type: 'UNINSTALL_CONFIRMED', modId });
        showToast('已从当前设备卸载，存档和用户配置未删除。');
      }
    });

    root.addEventListener('click', event => {
      if (event.target.matches('[data-modal-backdrop]')) dispatch({ type: 'CLOSE_DETAIL' });
    });

    root.addEventListener('input', event => {
      if (event.target.matches('[data-input="search"]')) {
        dispatch({ type: 'SET_SEARCH', value: event.target.value });
      }
    });

    root.addEventListener('scroll', event => {
      if (event.target.matches('[data-mods-scroll]')) {
        state = reducer(state, {
          type: 'SAVE_SCROLL_TOP',
          tab: state.ui.activeTab,
          value: event.target.scrollTop
        });
      }
    }, true);

    function fitCanvas() {
      const scale = Math.min(innerWidth / 2160, innerHeight / 1480);
      root.style.setProperty('--canvas-scale', scale);
    }

    addEventListener('resize', fitCanvas);
    fitCanvas();
    render();

    window.__DST_MODS_DEMO__ = Object.freeze({
      version: DEMO_MODEL_VERSION,
      getState: () => clone(state),
      dispatch,
      derive: () => clone(derive(state)),
      reset
    });
  </script>
</body>
</html>
