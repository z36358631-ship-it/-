<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>盖世游戏 · 饥荒联机版非官方 MODS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #000000;
      --bg-card: #1a1a1a;
      --bg-elevated: #252525;
      --bg-overlay: #28202a;
      --text-primary: #ffffff;
      --text-secondary: #e6e6e6;
      --text-tertiary: #f2f2f2;
      --text-muted: #7b7b7b;
      --text-disabled: #646464;
      --brand-gold: #ffcc43;
      --brand-gold-light: #ffd98f;
      --brand-green: #33d8a4;
      --brand-blue: #338feb;
      --brand-purple: #8174fa;
      --warning: #ff9b70;
      --danger: #ff5678;
      --border-default: #353d4e;
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
      --font-number: "D-DIN-PRO", "MiSans VF", var(--font-primary);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-2xl: 20px;
      --radius-full: 100px;
      color-scheme: dark;
    }
    html, body { min-width: 1080px; min-height: 720px; }
    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: var(--font-primary);
      color: var(--text-primary);
      background:
        radial-gradient(circle at 70% -10%, rgba(51,143,235,.13), transparent 30%),
        radial-gradient(circle at 20% 110%, rgba(255,204,67,.08), transparent 32%),
        var(--bg-primary);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .46; }
    .icon { width: 18px; height: 18px; display: inline-block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

    .review-toolbar {
      position: fixed;
      z-index: 80;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border-default);
      background: rgba(13,13,14,.94);
      backdrop-filter: blur(20px);
    }
    .review-title { display: flex; align-items: center; gap: 9px; min-width: 174px; font-size: 13px; font-weight: 520; }
    .review-title .icon { color: var(--brand-gold); }
    .review-version {
      padding: 4px 7px;
      border-radius: var(--radius-sm);
      background: rgba(255,204,67,.1);
      color: var(--brand-gold-light);
      font: 600 10px/1 var(--font-number);
    }
    .review-actions { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
    .review-actions::-webkit-scrollbar { display: none; }
    .review-button {
      min-height: 32px;
      padding: 0 11px;
      flex: 0 0 auto;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .review-button:hover { border-color: #566075; background: #303039; }
    .review-button:active { transform: translateY(1px); }
    .review-button.is-danger { color: #ffc0cc; border-color: rgba(255,86,120,.32); }

    .mac-shell {
      width: calc(100vw - 40px);
      max-width: 1480px;
      height: calc(100vh - 82px);
      margin: 70px auto 12px;
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius-xl);
      background: rgba(12,12,13,.96);
      box-shadow: 0 24px 70px rgba(0,0,0,.48);
    }
    .mac-sidebar {
      width: 218px;
      flex: 0 0 218px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-default);
      background: linear-gradient(180deg, #171719 0%, #101011 100%);
    }
    .window-strip { height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 17px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .window-dot { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
    .window-dot:nth-child(2) { background: #febc2e; }
    .window-dot:nth-child(3) { background: #28c840; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 21px 18px 18px;
      font-size: 17px;
      font-weight: 520;
      letter-spacing: .02em;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--brand-gold), #d99524);
      color: #15120b;
      box-shadow: 0 6px 16px rgba(255,204,67,.18);
    }
    .brand-mark .icon { width: 20px; height: 20px; stroke-width: 2.2; }
    .side-nav { display: grid; gap: 5px; padding: 0 10px; }
    .side-nav button {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 12px;
      border: 0;
      border-radius: var(--radius-md);
      background: transparent;
      color: #a7a7a7;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .side-nav button:hover { color: var(--text-primary); background: rgba(255,255,255,.055); }
    .side-nav button.active { color: var(--text-primary); background: rgba(255,204,67,.1); }
    .side-nav button.active .icon { color: var(--brand-gold); }
    .side-note {
      margin: auto 12px 14px;
      padding: 13px;
      border: 1px solid rgba(51,216,164,.19);
      border-radius: var(--radius-lg);
      background: rgba(51,216,164,.055);
    }
    .side-note strong { display: flex; align-items: center; gap: 7px; color: var(--brand-green); font-size: 12px; font-weight: 520; }
    .side-note p { margin-top: 7px; color: var(--text-muted); font-size: 10px; line-height: 1.5; }

    .mac-content { min-width: 0; flex: 1; overflow: hidden; background: var(--bg-primary); }
    .screen { height: 100%; overflow-y: auto; scrollbar-width: none; }
    .screen::-webkit-scrollbar, .detail-scroll::-webkit-scrollbar { display: none; }
    .page-topbar {
      position: sticky;
      z-index: 15;
      top: 0;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 28px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(0,0,0,.84);
      backdrop-filter: blur(18px);
    }
    .crumbs { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 12px; }
    .crumbs strong { color: var(--text-secondary); font-weight: 380; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button, .back-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,.035);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }
    .icon-button:hover, .back-button:hover { background: var(--bg-elevated); border-color: #566075; }
    .primary-button, .secondary-button, .danger-button, .text-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 17px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 520;
      cursor: pointer;
      transition: transform .16s ease, filter .16s ease, background .16s ease;
    }
    .primary-button { border: 0; background: linear-gradient(100deg, #0086ac, #0063b5); color: white; box-shadow: 0 7px 18px rgba(0,99,181,.24); }
    .primary-button:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .primary-button:active { transform: translateY(0); }
    .secondary-button { border: 1px solid var(--border-default); background: var(--bg-elevated); color: var(--text-primary); }
    .secondary-button:hover { background: #303038; border-color: #596276; }
    .danger-button { border: 1px solid rgba(255,86,120,.38); background: rgba(255,86,120,.08); color: #ffb2c1; }
    .text-button { min-height: 34px; border: 0; background: transparent; color: var(--brand-blue); padding: 0 8px; }
    .button-small { min-height: 34px; padding: 0 12px; font-size: 12px; }

    .game-hero {
      position: relative;
      min-height: 340px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 440px;
      align-items: end;
      gap: 34px;
      padding: 44px 44px 36px;
      overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background:
        linear-gradient(90deg, rgba(0,0,0,.98) 0%, rgba(0,0,0,.78) 43%, rgba(0,0,0,.13) 100%),
        linear-gradient(145deg, #293424 0%, #1d251a 34%, #0c1210 100%);
    }
    .game-hero::before {
      content: "";
      position: absolute;
      inset: -90px -40px -100px 43%;
      opacity: .82;
      background:
        radial-gradient(circle at 70% 40%, rgba(255,204,67,.32), transparent 16%),
        radial-gradient(ellipse at 55% 60%, rgba(51,143,235,.2), transparent 35%),
        repeating-linear-gradient(125deg, transparent 0 24px, rgba(255,255,255,.025) 25px 26px);
      transform: rotate(-5deg);
    }
    .hero-copy, .hero-art { position: relative; z-index: 1; }
    .hero-copy { max-width: 690px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--brand-gold); font: 600 11px/1.4 var(--font-number); letter-spacing: .13em; }
    .eyebrow::before { content: ""; width: 18px; height: 2px; border-radius: 2px; background: var(--brand-gold); }
    .hero-copy h1 { margin-top: 11px; font-size: 38px; line-height: 1.18; font-weight: 520; letter-spacing: -.02em; }
    .hero-copy p { max-width: 620px; margin-top: 13px; color: #c8c8c8; font-size: 14px; line-height: 1.75; }
    .hero-meta { display: flex; gap: 9px; margin-top: 18px; flex-wrap: wrap; }
    .meta-chip { padding: 6px 10px; border: 1px solid rgba(255,255,255,.13); border-radius: var(--radius-full); background: rgba(0,0,0,.24); color: var(--text-secondary); font-size: 11px; }
    .hero-actions { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
    .hero-art {
      align-self: stretch;
      display: grid;
      place-items: center;
      padding-top: 18px;
    }
    .hero-art svg { width: 100%; max-width: 420px; filter: drop-shadow(0 20px 26px rgba(0,0,0,.5)); }

    .detail-sections { padding: 25px 30px 42px; }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
    .section-heading h2 { font-size: 20px; line-height: 28px; font-weight: 520; }
    .section-heading p { color: var(--text-muted); font-size: 12px; }
    .source-grid { display: grid; grid-template-columns: minmax(0, .83fr) minmax(0, 1.17fr); gap: 15px; }
    .source-card {
      min-height: 174px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      padding: 20px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, var(--bg-card), #151515);
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .source-card.mods-card { border-color: rgba(255,155,112,.28); background: linear-gradient(145deg, #1e1b19, #151515 65%); }
    .source-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      font-size: 10px;
      line-height: 1;
    }
    .source-tag.official { color: #a9d5ff; background: rgba(51,143,235,.13); border: 1px solid rgba(51,143,235,.24); }
    .source-tag.unofficial { color: #ffc8ae; background: rgba(255,155,112,.11); border: 1px solid rgba(255,155,112,.25); }
    .source-card h3 { margin-top: 13px; font-size: 19px; font-weight: 520; }
    .source-card p { margin-top: 7px; color: var(--text-muted); font-size: 12px; line-height: 1.65; }
    .source-summary { margin-top: 13px !important; color: var(--text-secondary) !important; font-size: 13px !important; }
    .source-card .card-action { align-self: end; }
    .source-visual {
      width: 130px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.035);
      overflow: hidden;
    }
    .source-visual svg { width: 112px; height: 112px; }
    .source-card.mods-card .source-visual { color: var(--warning); background: radial-gradient(circle, rgba(255,155,112,.18), transparent 68%); }
    .source-card.workshop-card .source-visual { color: var(--brand-blue); background: radial-gradient(circle, rgba(51,143,235,.18), transparent 68%); }
    .isolation-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: var(--radius-lg);
      background: rgba(255,204,67,.055);
      color: #d8d0b6;
      font-size: 11px;
      line-height: 1.6;
    }
    .isolation-note .icon { color: var(--brand-gold); margin-top: 1px; }

    .library-page { min-height: 100%; padding-bottom: 42px; }
    .library-head { padding: 26px 28px 0; }
    .library-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .library-title h1 { font-size: 30px; line-height: 40px; font-weight: 520; }
    .library-title p { margin-top: 4px; color: var(--text-muted); font-size: 12px; }
    .library-stats { display: flex; gap: 9px; }
    .stat-pill { min-width: 102px; padding: 9px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-card); }
    .stat-pill strong { display: block; color: var(--brand-gold); font: 600 18px/1.2 var(--font-number); }
    .stat-pill span { color: var(--text-muted); font-size: 10px; }
    .library-tools {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 180px;
      gap: 10px;
      margin-top: 20px;
    }
    .search-box {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-muted);
    }
    .search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text-primary); font-size: 13px; }
    .sort-select {
      height: 42px;
      padding: 0 35px 0 13px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }
    .library-tabs { display: flex; gap: 20px; margin-top: 21px; border-bottom: 1px solid var(--border-default); }
    .tab-button {
      position: relative;
      min-height: 43px;
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
    }
    .tab-button.active { color: var(--text-primary); font-weight: 520; }
    .tab-button.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--brand-gold); }
    .tab-count { margin-left: 5px; color: var(--text-muted); font: 600 11px var(--font-number); }
    .mods-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; padding: 18px 28px 0; }
    .mod-card {
      min-height: 166px;
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 15px;
      padding: 12px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      cursor: pointer;
      transition: border-color .16s ease, transform .16s ease, background .16s ease;
    }
    .mod-card:hover { transform: translateY(-2px); border-color: #566075; background: #1e1e20; }
    .mod-cover { min-height: 140px; overflow: hidden; border-radius: 9px; background: #121212; }
    .mod-cover svg { width: 100%; height: 100%; display: block; }
    .mod-copy { min-width: 0; display: flex; flex-direction: column; }
    .mod-topline { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
    .mod-category { color: var(--text-muted); font-size: 10px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-disabled); box-shadow: 0 0 0 3px rgba(100,100,100,.08); }
    .status-dot.active { background: var(--brand-green); box-shadow: 0 0 0 3px rgba(51,216,164,.09); }
    .status-dot.warning { background: var(--warning); box-shadow: 0 0 0 3px rgba(255,155,112,.09); }
    .mod-copy h3 { margin-top: 8px; overflow: hidden; color: var(--text-primary); font-size: 16px; line-height: 22px; font-weight: 520; text-overflow: ellipsis; white-space: nowrap; }
    .mod-copy > p { margin-top: 5px; display: -webkit-box; overflow: hidden; color: var(--text-muted); font-size: 11px; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .mod-meta { margin-top: 8px; color: #a7a7a7; font: 330 10px/1.5 var(--font-number); }
    .mod-footer { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 9px; }
    .mod-status { min-width: 0; color: var(--text-secondary); font-size: 10px; line-height: 1.35; }
    .mod-status b { display: block; overflow: hidden; color: var(--brand-green); font-weight: 520; text-overflow: ellipsis; white-space: nowrap; }
    .mod-status b.warn { color: var(--warning); }
    .card-open {
      height: 31px;
      flex: 0 0 auto;
      padding: 0 11px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
    }
    .card-open:hover { border-color: var(--brand-blue); color: white; }
    .task-meter { margin-top: 8px; }
    .task-meter-line { height: 4px; overflow: hidden; border-radius: 4px; background: #303038; }
    .task-meter-line span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--brand-blue), var(--brand-green)); transition: width .25s ease; }
    .task-meter-copy { display: flex; justify-content: space-between; margin-top: 4px; color: var(--text-muted); font: 330 9px var(--font-number); }
    .empty-state { grid-column: 1 / -1; display: grid; place-items: center; min-height: 260px; padding: 28px; border: 1px dashed var(--border-default); border-radius: var(--radius-xl); color: var(--text-muted); text-align: center; }
    .empty-state .icon { width: 34px; height: 34px; margin-bottom: 10px; color: var(--text-disabled); }

    .modal-layer {
      position: fixed;
      z-index: 70;
      inset: 58px 0 0;
      display: grid;
      place-items: center;
      padding: 26px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(14px);
    }
    .mod-detail {
      width: min(940px, calc(100vw - 80px));
      max-height: calc(100vh - 120px);
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius-2xl);
      background: var(--bg-overlay);
      box-shadow: 0 24px 70px rgba(0,0,0,.62);
    }
    .detail-visual { min-height: 560px; display: flex; flex-direction: column; padding: 18px; background: #121212; }
    .detail-cover { height: 270px; overflow: hidden; border-radius: var(--radius-lg); background: #0c0c0c; }
    .detail-cover svg { width: 100%; height: 100%; display: block; }
    .detail-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
    .fact-cell { padding: 11px; border-radius: var(--radius-md); background: rgba(255,255,255,.045); }
    .fact-cell span { display: block; color: var(--text-muted); font-size: 9px; }
    .fact-cell strong { display: block; margin-top: 4px; color: var(--text-secondary); font-size: 11px; font-weight: 380; }
    .local-note { margin-top: auto; padding: 12px; border: 1px solid rgba(255,155,112,.22); border-radius: var(--radius-lg); background: rgba(255,155,112,.06); color: #d6b5a6; font-size: 10px; line-height: 1.55; }
    .detail-scroll { min-width: 0; overflow-y: auto; padding: 23px 24px 22px; scrollbar-width: none; }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .detail-head h2 { margin-top: 9px; font-size: 25px; line-height: 32px; font-weight: 520; }
    .detail-close { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--border-default); border-radius: 50%; background: rgba(255,255,255,.04); color: var(--text-secondary); cursor: pointer; }
    .detail-close:hover { background: rgba(255,255,255,.1); }
    .detail-author { margin-top: 5px; color: var(--text-muted); font-size: 11px; }
    .detail-status-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 17px;
      padding: 13px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      background: rgba(0,0,0,.18);
    }
    .detail-status-panel strong { display: block; color: var(--brand-green); font-size: 12px; font-weight: 520; }
    .detail-status-panel strong.warn { color: var(--warning); }

    function createInitialState({ platform, orientation, deviceInstallationId }) {

    let state = createInitialState(DEVICE_CONFIG);
    const taskTimers = new Map();
    let toastTimer = null;

    function taskForMod(current, mod) {
      return mod?.current_task_id ? current.tasks[mod.current_task_id] ?? null : null;
    }

    function ensureInstallTask(next, modId, operation = 'install') {
      const mod = next.mods[modId];
      if (!mod) return null;
      if (mod.current_task_id && next.tasks[mod.current_task_id]) {
        const existing = next.tasks[mod.current_task_id];
        if (existing.task_state === 'failed') {
          existing.task_state = 'queued';
          existing.progress_percent = Math.min(existing.progress_percent, 30);
          existing.failure_code = null;
          existing.operation_attempt += 1;
        }
        return mod.current_task_id;
      }
      if (mod.install_gate !== 'allowed') return null;
      if (operation === 'install' && mod.installation_fact === 'installed') return null;
      if (operation === 'update' && mod.update_fact !== 'update_available') return null;

      const taskId = `task-${next.device_installation_id}-${modId}`;
      next.tasks[taskId] = {
        task_id: taskId,
        root_mod_id: modId,
        operation,
        task_state: 'queued',
        progress_percent: 0,
        downloaded_bytes: 0,
        failure_code: null,
        operation_attempt: 1,
        previous: {
          installation_fact: mod.installation_fact,
          enabled_value: mod.enabled_value,
          update_fact: mod.update_fact,
          installed_version: mod.installed_version,
          installed_package_hash: mod.installed_package_hash,
          active_version_pointer: mod.active_version_pointer
        }
      };
      mod.current_task_id = taskId;
      next.metrics.taskCreateCount += 1;
      return taskId;
    }

    function advanceTask(next, taskId) {
      const task = next.tasks[taskId];
      if (!task) return;
      const mod = next.mods[task.root_mod_id];
      if (!mod) return;
      if (task.task_state === 'queued') {
        task.task_state = 'downloading';
        task.progress_percent = 12;
        task.downloaded_bytes = 2_600_000;
      } else if (task.task_state === 'downloading' && task.progress_percent < 70) {
        task.progress_percent = Math.min(70, task.progress_percent + 22);
        task.downloaded_bytes += 6_400_000;
      } else if (task.task_state === 'downloading') {
        task.task_state = 'verifying';
        task.progress_percent = 84;
      } else if (task.task_state === 'verifying') {
        task.task_state = 'installing';
        task.progress_percent = 95;
      } else if (task.task_state === 'installing') {
        task.task_state = 'succeeded';
        task.progress_percent = 100;
        mod.installation_fact = 'installed';
        mod.enabled_value = task.operation === 'install' ? 'enabled' : task.previous.enabled_value;
        mod.update_fact = 'no_update';
        mod.installed_version = mod.latest_version;
        mod.installed_package_hash = `sha256:${mod.mod_id}-${mod.latest_version}`;
        mod.active_version_pointer = `mods/${mod.mod_id}/${mod.latest_version}`;
        mod.current_task_id = null;
        next.ui.toast = task.operation === 'update'
          ? `${mod.name} 已更新，沿用最近一次启用值`
          : `${mod.name} 已安装并默认启用`;
      }
    }

    function buildManifest(next) {
      const items = Object.values(next.mods)
        .filter(mod => mod.installation_fact === 'installed' && mod.enabled_value === 'enabled')
        .map(mod => ({
          mod_id: mod.mod_id,
          name: mod.name,
          version: mod.installed_version,
          decision: mod.launch_decision,
          reason: mod.launch_reason
        }));
      next.launch.manifestId = `manifest-${next.device_installation_id}-001`;
      next.launch.items = items;
      next.launch.evidence = [];
      next.launch.exitType = null;
      next.recovery.visible = false;
      next.recovery.selectedAction = null;
    }

    function buildEvidence(next, scenario = 'loaded_match') {
      if (!next.launch.items.length) buildManifest(next);
      const expected = next.launch.items.filter(item => item.decision !== 'skipped');
      next.launch.launchId = `launch-${next.device_installation_id}-001`;
      next.launch.evidence = expected.map((item, index) => ({
        mod_id: item.mod_id,
        name: item.name,
        version: item.version,
        result: scenario === 'loaded_match' || index > 0 ? 'loaded_match' : scenario
      }));
      if (scenario === 'unexpected_loaded') {
        next.launch.evidence.push({
          mod_id: 'dst-unplanned-local',
          name: '未纳入清单的本地目录',
          version: 'unknown',
          result: 'unexpected_loaded'
        });
      }
    }

    function reducer(current, action) {
      if (action.type === 'RESET') return createInitialState(DEVICE_CONFIG);
      const next = clone(current);
      if (action.type !== 'CLEAR_TOAST') next.ui.toast = null;

      switch (action.type) {
        case 'OPEN_MODS':
          next.ui.screen = 'mods-library';
          next.ui.activeDialog = null;
          break;
        case 'BACK_GAME':
          next.ui.screen = 'game-detail';
          next.ui.activeDialog = null;
          break;
        case 'SET_TAB':
          next.ui.tab = action.tab === 'installed' ? 'installed' : 'available';
          next.ui.activeDialog = null;
          break;
        case 'SET_SEARCH':
          next.ui.searchText = action.value ?? '';
          break;
        case 'SET_SORT':
          next.ui.sortKey = action.value ?? 'recommended';
          break;
        case 'OPEN_DETAIL':
          if (next.mods[action.mod_id]) {
            next.ui.currentModId = action.mod_id;
            next.ui.readingSectionId = 'summary';
            next.ui.detailAnchorSectionId = 'summary';
            next.ui.activeDialog = 'mod-detail';
            next.metrics.detailRequestCount += 1;
          }
          break;
        case 'CLOSE_DIALOG':
          next.ui.activeDialog = null;
          break;
        case 'INSTALL_REQUESTED': {
          const taskId = ensureInstallTask(next, action.mod_id, 'install');
          const mod = next.mods[action.mod_id];
          if (!taskId && mod?.install_gate === 'dependency_blocked') next.ui.toast = '必要依赖不可用，未创建安装任务';
          else if (!taskId && mod?.install_gate === 'space_blocked') next.ui.toast = '当前设备空间不足，未创建安装任务';
          else if (taskId) next.ui.toast = `已绑定任务 ${taskId}`;
          break;
        }
        case 'UPDATE_REQUESTED': {
          const mod = next.mods[action.mod_id];
          if (mod?.update_fact === 'source_unknown') {
            next.ui.toast = '来源状态未知，不能使用缓存地址更新';
            break;
          }
          const taskId = ensureInstallTask(next, action.mod_id, 'update');
          if (taskId) next.ui.toast = `更新任务已绑定 ${taskId}`;
          break;
        }
        case 'TASK_ADVANCE':
          advanceTask(next, action.task_id);
          break;
        case 'ENABLE_CHANGED': {
          const mod = next.mods[action.mod_id];
          if (mod?.installation_fact === 'installed') {
            mod.enabled_value = action.value ?? (mod.enabled_value === 'enabled' ? 'disabled' : 'enabled');
            next.ui.toast = `${mod.name} 已${mod.enabled_value === 'enabled' ? '启用' : '停用'} · 仅此设备`;
          }
          break;
        }
        case 'UPDATE_FAILED': {
          const mod = next.mods[action.mod_id];
          if (!mod) break;
          if (mod.installation_fact === 'installed' && mod.update_fact === 'no_update') {
            mod.update_fact = 'update_available';
          }
          const taskId = ensureInstallTask(next, action.mod_id, 'update');
          const task = taskId ? next.tasks[taskId] : null;
          if (task) {
            const previous = task.previous;
            mod.installation_fact = 'installed';
            mod.active_version_pointer = previous.active_version_pointer;
            mod.installed_version = previous.installed_version;
            mod.installed_package_hash = previous.installed_package_hash;
            mod.enabled_value = previous.enabled_value;
            mod.update_fact = 'update_available';
            task.task_state = 'failed';
            task.failure_code = 'PACKAGE_HASH_MISMATCH';
            task.progress_percent = 84;
            next.ui.toast = '更新校验失败，旧版、启用值和更新入口均已保留';
          }
          break;
        }
        case 'SOURCE_RECHECKED': {
          const mod = next.mods[action.mod_id];
          if (mod?.update_fact === 'source_unknown') {
            mod.update_fact = 'no_update';
            next.ui.toast = '来源已恢复，本机版本为最新版本';
          }
          break;
        }
        case 'UNINSTALL_REQUESTED':
          if (next.mods[action.mod_id]?.installation_fact === 'installed') {
            next.ui.currentModId = action.mod_id;
            next.ui.activeDialog = 'uninstall-confirm';
          }
          break;
        case 'UNINSTALL_CONFIRMED': {
          const mod = next.mods[action.mod_id];
          if (mod) {
            mod.installation_fact = 'not_installed';
            mod.enabled_value = 'not_applicable';
            mod.update_fact = 'no_update';
            mod.installed_version = null;
            mod.installed_package_hash = null;
            mod.active_version_pointer = null;
            mod.current_task_id = null;
            next.ui.activeDialog = null;
            next.ui.toast = `${mod.name} 已从当前设备卸载，存档与用户配置未删除`;
          }
          break;
        }
        case 'PREFLIGHT_REQUESTED':
          buildManifest(next);
          next.ui.screen = 'preflight';
          next.ui.activeDialog = null;
          break;
        case 'LAUNCH_GAME':
          buildEvidence(next, 'loaded_match');
          next.ui.screen = 'evidence';
          next.ui.activeDialog = null;
          next.ui.toast = '已读取游戏日志并生成实际加载证据';
          break;
        case 'EVIDENCE_SCENARIO_SELECTED':
          buildEvidence(next, action.scenario ?? 'loaded_match');
          next.ui.screen = 'evidence';
          next.ui.activeDialog = null;
          next.ui.toast = `证据场景：${EVIDENCE_LABELS[action.scenario] ?? EVIDENCE_LABELS.loaded_match}`;
          break;
        case 'ABNORMAL_EXIT_INJECTED':
          if (!next.launch.items.length) buildManifest(next);
          if (!next.launch.evidence.length) buildEvidence(next, 'loaded_match');
          next.launch.manifestChanged = true;
          next.launch.exitType = 'abnormal';
          next.recovery.visible = true;
          next.recovery.selectedAction = null;
          next.ui.screen = 'recovery';
          next.ui.activeDialog = null;
          break;
        case 'RECOVERY_ACTION_SELECTED':
          next.recovery.selectedAction = action.value;
          next.ui.toast = '已记录恢复选择；Demo 不会在选择前后自动改写其他状态';
          break;
        case 'REVIEW_NORMAL_INSTALL': {
          const mod = next.mods['dst-season-sound'];
          mod.installation_fact = 'not_installed';
          mod.enabled_value = 'not_applicable';
          mod.update_fact = 'no_update';
          mod.install_gate = 'allowed';
          mod.installed_version = null;
          mod.installed_package_hash = null;
          mod.active_version_pointer = null;
          mod.current_task_id = null;
          next.ui.screen = 'mods-library';
          next.ui.tab = 'available';
          next.ui.currentModId = mod.mod_id;
          next.ui.activeDialog = 'mod-detail';
          next.metrics.detailRequestCount += 1;
          break;
        }
        case 'REVIEW_DEPENDENCY_BLOCKED':
          next.ui.screen = 'mods-library';
          next.ui.currentModId = 'dst-ancient-cookbook';
          next.ui.activeDialog = 'mod-detail';
          next.metrics.detailRequestCount += 1;
          break;
        case 'REVIEW_SPACE_BLOCKED': {
          const mod = next.mods['dst-season-sound'];
          mod.install_gate = 'space_blocked';
          mod.current_task_id = null;
          next.ui.screen = 'mods-library';
          next.ui.currentModId = mod.mod_id;
          next.ui.activeDialog = 'mod-detail';
          next.metrics.detailRequestCount += 1;
          break;
        }
        case 'REVIEW_SOURCE_UNKNOWN':
          next.mods['dst-hud-plus'].update_fact = 'source_unknown';
          next.ui.screen = 'mods-library';
          next.ui.tab = 'installed';
          next.ui.currentModId = 'dst-hud-plus';
          next.ui.activeDialog = 'mod-detail';
          next.metrics.detailRequestCount += 1;
          break;
        case 'REVIEW_UPDATE_FAILED': {
          const mod = next.mods['dst-smart-stack'];
          mod.installation_fact = 'installed';
          mod.enabled_value = 'enabled';
          mod.update_fact = 'update_available';
          mod.install_gate = 'allowed';
          mod.installed_version = '2.2.1';
          mod.installed_package_hash = 'sha256:2b21-smart-stack';
          mod.active_version_pointer = 'mods/dst-smart-stack/2.2.1';
          mod.current_task_id = null;
          next.ui.screen = 'mods-library';
          next.ui.tab = 'installed';
          next.ui.currentModId = mod.mod_id;
          next.ui.activeDialog = 'mod-detail';
          next.metrics.detailRequestCount += 1;
          const taskId = ensureInstallTask(next, mod.mod_id, 'update');
          const task = next.tasks[taskId];
          task.task_state = 'failed';
          task.failure_code = 'PACKAGE_HASH_MISMATCH';
          task.progress_percent = 84;
          mod.update_fact = 'update_available';
          next.ui.toast = '已注入更新校验失败：继续使用旧版 2.2.1';
          break;
        }
        case 'SHOW_TOAST':
          next.ui.toast = action.message;
          break;
        case 'WORKSHOP_OPENED':
          next.ui.toast = '已进入官方创意工坊订阅管理；MODS 本地状态未改变';
          break;
        case 'CLEAR_TOAST':
          next.ui.toast = null;
          break;
      }
      return next;
    }

    function deriveModStatus(current, mod) {
      const task = taskForMod(current, mod);
      if (task && !['succeeded', 'cancelled'].includes(task.task_state)) {
        const isFailed = task.task_state === 'failed';
        return {
          label: isFailed && task.operation === 'update'
            ? '更新失败 · 仍在使用旧版'
            : `${TASK_LABELS[task.task_state]}${task.task_state === 'downloading' ? ` ${task.progress_percent}%` : ''}`,
          tone: isFailed ? 'warn' : '',
          dot: isFailed ? 'warning' : 'active',
          task
        };
      }
      if (mod.installation_fact === 'installed') {
        const enabled = mod.enabled_value === 'enabled';
        const badges = [];
        if (mod.update_fact === 'update_available') badges.push('有新版本');
        if (mod.update_fact === 'source_unknown') badges.push('更新状态未知');
        return {
          label: `已安装 · ${enabled ? '已启用' : '未启用'} · 仅此设备${badges.length ? ` · ${badges.join(' · ')}` : ''}`,
          tone: mod.update_fact === 'source_unknown' ? 'warn' : '',
          dot: enabled ? 'active' : '',
          task: null
        };
      }
      if (mod.install_gate === 'dependency_blocked') return { label: '缺少必要依赖', tone: 'warn', dot: 'warning', task: null };
      if (mod.install_gate === 'incompatible') return { label: '当前设备不兼容', tone: 'warn', dot: 'warning', task: null };
      if (mod.install_gate === 'space_blocked') return { label: '当前设备空间不足', tone: 'warn', dot: 'warning', task: null };
      return { label: '可安装 · 仅此设备', tone: '', dot: '', task: null };
    }

    function derivePrimaryAction(current, mod) {
      if (!mod) return { type: 'none', label: '不可用', disabled: true };
      const task = taskForMod(current, mod);
      if (task) {
        if (task.task_state === 'failed' && task.operation === 'update') {
          return { type: 'update', label: '重试更新', disabled: false };
        }
        if (task.task_state === 'failed') {
          return { type: 'install', label: '重试安装', disabled: false };
        }
        return {
          type: 'advance-task',
          label: `${TASK_LABELS[task.task_state]} ${task.progress_percent}%`,
          disabled: ['verifying', 'installing'].includes(task.task_state),
          task_id: task.task_id
        };
      }
      if (mod.installation_fact === 'not_installed') {
        if (mod.install_gate === 'allowed') {
          return {
            type: 'install',
            label: mod.dependencies.length ? `安装（含 ${mod.dependencies.length} 个必要依赖）` : '安装到此设备',
            disabled: false
          };
        }
        return {
          type: 'none',
          label: mod.install_gate === 'dependency_blocked'
            ? '必要依赖不可用'
            : mod.install_gate === 'space_blocked' ? '设备空间不足' : '当前设备不兼容',
          disabled: true
        };
      }
      if (mod.update_fact === 'update_available') return { type: 'update', label: '更新', disabled: false };
      if (mod.update_fact === 'source_unknown') return { type: 'recheck-source', label: '重新检查更新', disabled: false };
      return { type: 'toggle-enabled', label: mod.enabled_value === 'enabled' ? '停用' : '启用', disabled: false };
    }

    function derive(current) {
      const allMods = Object.values(current.mods);
      const installedMods = allMods.filter(mod => mod.installation_fact === 'installed');
      const availableMods = allMods;
      const source = current.ui.tab === 'installed' ? installedMods : availableMods;
      const keyword = current.ui.searchText.trim().toLocaleLowerCase('zh-CN');
      const filtered = keyword
        ? source.filter(mod => [mod.name, mod.author, mod.category, mod.summary].some(value => value.toLocaleLowerCase('zh-CN').includes(keyword)))
        : [...source];
      const sorters = {
        recommended: (a, b) => Number(b.installation_fact === 'installed') - Number(a.installation_fact === 'installed') || b.downloads - a.downloads,
        downloads: (a, b) => b.downloads - a.downloads,
        newest: (a, b) => b.published_at.localeCompare(a.published_at),
        name: (a, b) => a.name.localeCompare(b.name, 'zh-CN')
      };
      filtered.sort(sorters[current.ui.sortKey] ?? sorters.recommended);

      const currentMod = current.ui.currentModId ? current.mods[current.ui.currentModId] ?? null : null;
      const modStatus = Object.fromEntries(allMods.map(mod => [mod.mod_id, deriveModStatus(current, mod)]));
      const activeTask = Object.values(current.tasks).find(task => !['succeeded', 'cancelled'].includes(task.task_state)) ?? null;
      const preflightGroups = { effective: [], skipped: [], risk: [] };
      const manifestItems = current.launch.items.length
        ? current.launch.items
        : installedMods.filter(mod => mod.enabled_value === 'enabled').map(mod => ({
            mod_id: mod.mod_id,
            name: mod.name,
            version: mod.installed_version,
            decision: mod.launch_decision,
            reason: mod.launch_reason
          }));
      manifestItems.forEach(item => {
        if (preflightGroups[item.decision]) preflightGroups[item.decision].push(item);
      });

      return {
        installedCount: installedMods.length,
        enabledCount: installedMods.filter(mod => mod.enabled_value === 'enabled').length,
        activeTask,
        currentMod,
        availableMods,
        installedMods,
        visibleMods: filtered,
        modStatus,
        primaryAction: derivePrimaryAction(current, currentMod),
        preflightGroups,
        preflightLabels: {
          effective: '本次生效',
          skipped: '本次跳过',
          risk: '需确认风险'

        launchButtonLabel: preflightGroups.risk.length ? '确认风险并启动' : '启动游戏',

          { action: 'REVIEW_SPACE_BLOCKED', label: '空间不足' },
          { action: 'REVIEW_SOURCE_UNKNOWN', label: '来源状态未知' },
          { action: 'REVIEW_UPDATE_FAILED', label: '更新失败保留旧版' },
          { action: 'PREFLIGHT_REQUESTED', label: '启动检查' },

          { action: 'ABNORMAL_EXIT_INJECTED', label: '清单变化后异常退出', danger: true }

      };
    }

        { value: 'disable-change', title: '停用本次变化后重试', copy: '只停用相对最近成功清单新增或重新启用的项目。' },
        { value: 'launch-no-mod', title: '无 MOD 启动', copy: '本次使用空清单启动，不卸载任何已安装文件。' },
        { value: 'keep-current', title: '保持当前设置继续尝试', copy: '保留当前启用值并再次启动，用于排除偶发退出。' }
      ];
      return `<section class="screen flow-page" data-screen="recovery">
        <div class="page-topbar"><button class="back-button" type="button" data-action="back-game">${icon('back')}返回游戏详情</button><span class="source-tag unofficial">${icon('alert')}异常退出后的恢复建议</span></div>
        <div class="flow-body">
          <div class="flow-title"><div><span class="eyebrow">SAFE RECOVERY</span><h1>上次启动异常退出</h1><p>检测到启动清单发生变化。系统只提供建议，默认不执行，也不会自动修改启用状态。</p></div></div>
          <section class="recovery-card">
            <div class="recovery-summary"><div class="confirm-icon">${icon('alert')}</div><div><h2>变化摘要</h2><p>${escapeHtml(viewModel.changeSummary)}</p></div></div>
            <div class="recovery-options">
              ${options.map(option => `<button class="recovery-option ${selected === option.value ? 'selected' : ''}" type="button" data-action="recovery-action" data-value="${option.value}"><strong>${escapeHtml(option.title)}</strong><span>${escapeHtml(option.copy)}</span></button>`).join('')}
            </div>
            <div class="recovery-note">${selected ? `已选择：${escapeHtml(options.find(option => option.value === selected)?.title)}。此 Demo 仅记录选择，不自动删除文件或改写状态。` : '尚未选择任何动作。游戏存档、世界文件和用户配置始终不在清理范围内。'}</div>
          </section>
        </div>
      </section>`;
    }

    function renderReviewToolbar(viewModel) {
      return `<div class="review-title">${icon('wrench')}评审控制台 <span class="review-version">${DEMO_MODEL_VERSION}</span></div>
        <div class="review-actions">
          ${viewModel.reviewScenarios.map(item => `<button class="review-button ${item.danger ? 'is-danger' : ''}" type="button" data-review-action="${escapeHtml(item.action)}" ${item.scenario ? `data-scenario="${escapeHtml(item.scenario)}"` : ''}>${escapeHtml(item.label)}</button>`).join('')}
        </div>`;
    }

    function render() {
      const activeField = document.activeElement?.dataset?.field;
      const selectionStart = activeField === 'search' ? document.activeElement.selectionStart : null;
      const viewModel = derive(state);
      const screens = {
        'game-detail': () => renderGameDetail(viewModel),
        'mods-library': () => renderModsLibrary(viewModel),
        preflight: () => renderPreflight(viewModel),
        evidence: () => renderEvidence(viewModel),
        recovery: () => renderRecovery(viewModel)
      };
      document.querySelector('[data-review-toolbar]').innerHTML = renderReviewToolbar(viewModel);
      document.querySelector('[data-view-root]').innerHTML = (screens[state.ui.screen] ?? screens['game-detail'])();
      const dialog = state.ui.activeDialog === 'mod-detail'
        ? renderModDetail(viewModel.currentMod, viewModel)
        : state.ui.activeDialog === 'uninstall-confirm'
          ? renderUninstallConfirm(viewModel.currentMod)
          : '';
      document.querySelectorAll('[data-dialog-layer]').forEach(node => node.remove());
      if (dialog) document.body.insertAdjacentHTML('beforeend', dialog);
      document.querySelector('.toast-region').innerHTML = state.ui.toast
        ? `<div class="toast">${icon('info')}<span>${escapeHtml(state.ui.toast)}</span></div>`
        : '';

      if (activeField) {
        const field = document.querySelector(`[data-field="${activeField}"]`);
        if (field) {
          field.focus();
          if (activeField === 'search' && selectionStart !== null) field.setSelectionRange(selectionStart, selectionStart);
        }
      }
    }

    function stopTaskTimer(taskId) {
      const timer = taskTimers.get(taskId);
      if (timer) clearInterval(timer);
      taskTimers.delete(taskId);
    }

    function scheduleTask(taskId) {
      if (!taskId || taskTimers.has(taskId)) return;
      const task = state.tasks[taskId];
      if (!task || !['queued', 'downloading', 'verifying', 'installing'].includes(task.task_state)) return;
      const timer = setInterval(() => {
        const currentTask = state.tasks[taskId];
        if (!currentTask || !['queued', 'downloading', 'verifying', 'installing'].includes(currentTask.task_state)) {
          stopTaskTimer(taskId);
          return;
        }
        dispatch({ type: 'TASK_ADVANCE', task_id: taskId });
      }, 760);
      taskTimers.set(taskId, timer);
    }

    function dispatch(action) {
      if (action.type.startsWith('REVIEW_')) {
        taskTimers.forEach(timer => clearInterval(timer));
        taskTimers.clear();
      }
      state = reducer(state, action);
      render();

      if (['INSTALL_REQUESTED', 'UPDATE_REQUESTED'].includes(action.type)) {
        const taskId = state.mods[action.mod_id]?.current_task_id;
        scheduleTask(taskId);
      }
      if (action.type === 'TASK_ADVANCE') {
        const task = state.tasks[action.task_id];
        if (!task || ['succeeded', 'failed', 'cancelled'].includes(task.task_state)) stopTaskTimer(action.task_id);
      }
      if (action.type === 'UPDATE_FAILED' || action.type === 'REVIEW_UPDATE_FAILED') {
        const modId = action.mod_id ?? 'dst-smart-stack';
        stopTaskTimer(state.mods[modId]?.current_task_id);
      }
      if (state.ui.toast) {
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => dispatch({ type: 'CLEAR_TOAST' }), 2800);
      }
      return state;
    }

    function reset() {
      taskTimers.forEach(timer => clearInterval(timer));
      taskTimers.clear();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = null;
      state = createInitialState(DEVICE_CONFIG);
      render();
      return clone(state);
    }

    document.addEventListener('click', event => {
      const reviewTarget = event.target.closest('[data-review-action]');
      if (reviewTarget) {
        const type = reviewTarget.dataset.reviewAction;
        if (type === 'RESET') reset();
        else dispatch({ type, scenario: reviewTarget.dataset.scenario });
        return;
      }
      const target = event.target.closest('[data-action]');
      if (!target) {
        if (event.target.matches('[data-dialog-layer]')) dispatch({ type: 'CLOSE_DIALOG' });
        return;
      }
      const action = target.dataset.action;
      const modId = target.dataset.modId ?? target.closest('[data-mod-id]')?.dataset.modId;
      const actions = {
        'open-mods': () => dispatch({ type: 'OPEN_MODS' }),
        'back-game': () => dispatch({ type: 'BACK_GAME' }),
        'set-tab': () => dispatch({ type: 'SET_TAB', tab: target.dataset.tab }),
        'open-detail': () => dispatch({ type: 'OPEN_DETAIL', mod_id: modId }),
        'close-dialog': () => dispatch({ type: 'CLOSE_DIALOG' }),
        install: () => dispatch({ type: 'INSTALL_REQUESTED', mod_id: modId }),
        update: () => dispatch({ type: 'UPDATE_REQUESTED', mod_id: modId }),
        'advance-task': () => dispatch({ type: 'TASK_ADVANCE', task_id: target.dataset.taskId }),
        'toggle-enabled': () => dispatch({ type: 'ENABLE_CHANGED', mod_id: modId }),
        'recheck-source': () => dispatch({ type: 'SOURCE_RECHECKED', mod_id: modId }),
        uninstall: () => dispatch({ type: 'UNINSTALL_REQUESTED', mod_id: modId }),
        'confirm-uninstall': () => dispatch({ type: 'UNINSTALL_CONFIRMED', mod_id: modId }),
        preflight: () => dispatch({ type: 'PREFLIGHT_REQUESTED' }),
        'launch-game': () => dispatch({ type: 'LAUNCH_GAME' }),
        'evidence-scenario': () => dispatch({ type: 'EVIDENCE_SCENARIO_SELECTED', scenario: target.dataset.scenario }),
        'abnormal-exit': () => dispatch({ type: 'ABNORMAL_EXIT_INJECTED' }),
        'recovery-action': () => dispatch({ type: 'RECOVERY_ACTION_SELECTED', value: target.dataset.value }),
        'workshop-open': () => dispatch({ type: 'WORKSHOP_OPENED' }),
        'show-toast': () => dispatch({ type: 'SHOW_TOAST', message: target.dataset.message })
      };
      actions[action]?.();
    });

    document.addEventListener('input', event => {
      if (event.target.matches('[data-field="search"]')) {
        dispatch({ type: 'SET_SEARCH', value: event.target.value });
      }
    });

    document.addEventListener('change', event => {
      if (event.target.matches('[data-field="sort"]')) {
        dispatch({ type: 'SET_SORT', value: event.target.value });
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && state.ui.activeDialog) dispatch({ type: 'CLOSE_DIALOG' });
      if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.mod-card')) {
        event.preventDefault();
        dispatch({ type: 'OPEN_DETAIL', mod_id: event.target.dataset.modId });
      }
    });

    window.__DST_MODS_DEMO__ = Object.freeze({
      version: DEMO_MODEL_VERSION,
      getState: () => clone(state),
      dispatch,
      derive: () => clone(derive(state)),
      reset
    });

    render();
  </script>
</body>
</html>
