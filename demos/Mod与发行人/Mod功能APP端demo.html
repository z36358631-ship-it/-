<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盖世游戏 APP · DST MODS 离线交互 Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #000000;
      --bg-shell: #090b0e;
      --bg-card: #1a1a1a;
      --bg-card-strong: #202126;
      --bg-elevated: #252525;
      --bg-overlay: #28202a;
      --text-primary: #ffffff;
      --text-secondary: #e6e6e6;
      --text-tertiary: #b7bcc5;
      --text-muted: #7b7b7b;
      --text-disabled: #646464;
      --brand-gold: #ffcc43;
      --brand-gold-light: #ffd98f;
      --brand-green: #33d8a4;
      --brand-blue: #338feb;
      --brand-orange: #ff9b70;
      --brand-red: #ff5678;
      --border-default: #353d4e;
      --border-soft: rgba(255, 255, 255, 0.08);
      --blue-gradient: linear-gradient(135deg, #0086ac, #0063b5);
      --gold-gradient: linear-gradient(135deg, #f1d893, #d99946);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-2xl: 20px;
      --radius-full: 100px;
      --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.28);
      --shadow-dialog: 0 24px 70px rgba(0, 0, 0, 0.58);
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-number: "D-DIN-PRO", "MiSans VF", sans-serif;
      color-scheme: dark;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% -20%, rgba(51, 143, 235, 0.14), transparent 38rem),
        #020304;
      color: var(--text-primary);
      font-family: var(--font-primary);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      padding: 18px;
      overflow: auto;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .svg-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -0.18em;
    }

    .review-toolbar {
      width: min(1120px, 100%);
      margin: 0 auto 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl);
      background: rgba(13, 16, 21, 0.94);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(20px);
    }

    .review-brand {
      min-width: 190px;
      margin-right: auto;
    }

    .review-brand strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
    }

    .review-brand span {
      display: block;
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .review-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .review-button {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      background: #171a20;
      color: var(--text-tertiary);
      font-size: 12px;
      transition: 160ms ease;
    }

    .review-button:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .review-button.is-active {
      border-color: rgba(255, 204, 67, 0.5);
      background: rgba(255, 204, 67, 0.12);
      color: var(--brand-gold);
    }

    .review-button.is-danger {
      color: #ff9ea9;
    }

    .app-stage {
      min-height: calc(100vh - 112px);
      display: grid;
      place-items: start center;
    }

    .device {
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: var(--bg-primary);
      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      isolation: isolate;
    }

    .device.portrait {
      width: 390px;
      height: 844px;
      border-radius: 30px;
    }

    .device.landscape {
      width: 874px;
      height: 402px;
      border-radius: 22px;
    }

    .product-screen {
      position: absolute;
      inset: 0;
      display: flex;
      overflow: hidden;
      background: var(--bg-primary);
    }

    .portrait-shell {
      flex-direction: column;
    }

    .status-bar {
      position: relative;
      z-index: 20;
      height: 34px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      color: var(--text-secondary);
      font-family: var(--font-number);
      font-size: 11px;
      letter-spacing: 0.02em;
      background: rgba(0, 0, 0, 0.74);
      backdrop-filter: blur(18px);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-green);
      box-shadow: 0 0 0 3px rgba(51, 216, 164, 0.12);
    }

    .page-header {
      position: relative;
      z-index: 18;
      min-height: 56px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      border-bottom: 1px solid var(--border-soft);
      background: rgba(4, 5, 7, 0.94);
      backdrop-filter: blur(20px);
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.045);
      color: var(--text-secondary);
      transition: 160ms ease;
    }

    .icon-button:hover,
    .icon-button:active {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-primary);
    }

    .header-title {
      min-width: 0;
      flex: 1;
    }

    .header-title strong {
      display: block;
      overflow: hidden;
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 600;
      line-height: 24px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-title span {
      display: block;
      overflow: hidden;
      margin-top: 1px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-scroll,
    .catalog-scroll,
    .detail-scroll {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .app-scroll::-webkit-scrollbar,
    .catalog-scroll::-webkit-scrollbar,
    .detail-scroll::-webkit-scrollbar {
      display: none;
    }

    .game-page {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .game-page .app-scroll {
      flex: 1;
      padding-bottom: 82px;
    }

    .game-hero {
      position: relative;
      min-height: 282px;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 38%, rgba(255, 204, 67, 0.22), transparent 16rem),
        linear-gradient(135deg, #15201d 0%, #0c1311 42%, #1a140d 100%);
    }

    .game-hero::before,
    .game-hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(0.2px);
    }

    .game-hero::before {
      width: 260px;
      height: 260px;
      right: -40px;
      bottom: -86px;
      background:
        radial-gradient(circle at 48% 38%, #191512 0 28%, transparent 29%),
        conic-gradient(from 20deg, #3d3426, #101713, #6b5a33, #15201d, #3d3426);
      opacity: 0.78;
    }

    .game-hero::after {
      width: 130px;
      height: 230px;
      right: 32px;
      bottom: -112px;
      border-radius: 46% 46% 22% 22%;
      background: #050605;
      box-shadow: 0 -30px 70px rgba(0, 0, 0, 0.68);
      transform: rotate(-7deg);
    }

    .game-hero-fade {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.25), transparent 26%, rgba(0, 0, 0, 0.88) 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.72), transparent 78%);
    }

    .game-brand-mark {
      position: absolute;
      top: 28px;
      right: 22px;
      z-index: 3;
      color: rgba(255, 237, 188, 0.82);
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-align: right;
      text-transform: uppercase;
    }

    .game-hero-content {
      position: absolute;
      inset: auto 18px 22px;
      z-index: 5;
    }

    .eyebrow {
      color: var(--brand-gold);
      font-family: var(--font-number);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .game-hero-content h1 {
      margin-top: 8px;
      font-size: 30px;
      font-weight: 650;
      line-height: 38px;
    }

    .game-hero-content p {
      max-width: 320px;
      margin-top: 8px;
      color: var(--text-tertiary);
      font-size: 13px;
      line-height: 20px;
    }

    .tag-row {
      margin-top: 12px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .tag {
      min-height: 26px;
      padding: 4px 9px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.42);
      color: var(--text-secondary);
      font-size: 11px;
    }

    .game-actions {
      padding: 14px 16px 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      gap: 10px;
    }

    .primary-button,
    .secondary-button,
    .danger-button,
    .ghost-button {
      min-height: 44px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 600;
      transition: 160ms ease;
    }

    .primary-button {
      border: 0;
      background: var(--blue-gradient);
      color: var(--text-primary);
      box-shadow: 0 8px 18px rgba(0, 99, 181, 0.24);
    }

    .primary-button:hover,
    .primary-button:active {
      filter: brightness(1.09);
      transform: translateY(-1px);
    }

    .secondary-button,
    .ghost-button {
      border: 1px solid var(--border-default);
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .secondary-button:hover,
    .ghost-button:hover {
      border-color: rgba(255, 255, 255, 0.23);
      color: var(--text-primary);
    }

    .danger-button {
      border: 1px solid rgba(255, 86, 120, 0.4);
      background: rgba(255, 86, 120, 0.11);
      color: #ff9aac;
    }

    .content-section {
      padding: 22px 16px 0;
    }

    .section-heading {
      margin-bottom: 12px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading h2 {
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
    }

    .section-heading p {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 17px;
    }

    .official-workshop-card {
      position: relative;
      overflow: hidden;
      padding: 16px;
      border: 1px solid rgba(51, 143, 235, 0.28);
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 92% 10%, rgba(51, 143, 235, 0.2), transparent 11rem),
        linear-gradient(135deg, #171b22, #12161d);
    }

    .official-workshop-card::after {
      content: "";
      position: absolute;
      width: 86px;
      height: 86px;
      right: -18px;
      bottom: -25px;
      border: 12px dotted rgba(51, 143, 235, 0.12);
      border-radius: 50%;
    }

    .official-card-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .official-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(51, 143, 235, 0.35);
      border-radius: var(--radius-lg);
      background: rgba(51, 143, 235, 0.1);
      color: #7fc1ff;
    }

    .official-card-copy {
      min-width: 0;
      flex: 1;
    }

    .official-card-copy strong {
      display: block;
      font-size: 17px;
      font-weight: 600;
    }

    .official-card-copy span {
      display: block;
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .channel-badge,
    .source-badge,
    .status-badge,
    .gate-badge {
      min-height: 24px;
      padding: 3px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: var(--radius-sm);
      font-size: 10px;
      font-weight: 600;
      line-height: 16px;
      white-space: nowrap;
    }

    .channel-badge {
      background: rgba(51, 143, 235, 0.13);
      color: #7fc1ff;
    }

    .source-badge {
      background: rgba(255, 155, 112, 0.12);
      color: var(--brand-orange);
    }

    .status-badge {
      background: rgba(51, 216, 164, 0.11);
      color: var(--brand-green);
    }

    .gate-badge {
      background: rgba(255, 204, 67, 0.1);
      color: var(--brand-gold);
    }

    .official-workshop-card > p {
      position: relative;
      z-index: 2;
      margin-top: 13px;
      color: var(--text-tertiary);
      font-size: 13px;
      line-height: 20px;
    }

    .official-card-foot {
      position: relative;
      z-index: 2;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .bottom-nav {
      position: absolute;
      z-index: 30;
      right: 0;
      bottom: 0;
      left: 0;
      height: 72px;
      padding: 7px 12px max(8px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border-soft);
      background: rgba(8, 10, 13, 0.94);
      backdrop-filter: blur(22px);
    }

    .nav-item {
      min-width: 44px;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
    }

    .nav-item.is-active {
      color: var(--brand-gold);
    }

    .tabs {
      padding: 0 14px;
      display: flex;
      gap: 20px;
      flex: 0 0 auto;
      border-bottom: 1px solid var(--border-soft);
      background: rgba(4, 5, 7, 0.96);
    }

    .tab-button {
      position: relative;
      min-height: 46px;
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
    }

    .tab-button.is-active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .tab-button.is-active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--brand-gold);
    }

    .catalog-tools {
      padding: 12px 14px;
      display: grid;
      gap: 8px;
      flex: 0 0 auto;
      background: var(--bg-primary);
    }

    .search-field {
      min-height: 44px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      background: #111318;
      color: var(--text-muted);
    }

    .search-field:focus-within {
      border-color: rgba(255, 204, 67, 0.48);
      box-shadow: 0 0 0 3px rgba(255, 204, 67, 0.08);
    }

    .search-field input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text-primary);
      font-size: 14px;
    }

    .search-field input::placeholder {
      color: var(--text-muted);
    }

    .select-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .select-control {
      min-width: 0;
      min-height: 44px;
      padding: 0 34px 0 12px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      background: #111318;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .catalog-scroll {
      flex: 1;
      padding: 0 14px 116px;
    }

    .catalog-summary {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .catalog-summary strong {
      color: var(--text-secondary);
      font-family: var(--font-number);
      font-size: 12px;
      font-weight: 500;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-content: start;
    }

    .mod-card {
      position: relative;
      min-width: 0;
      padding: 12px;
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 12px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.025), transparent 60%),
        var(--bg-card);
      box-shadow: 0 2px 0 rgba(255, 255, 255, 0.01);
      transition: 160ms ease;
    }

    .mod-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
      box-shadow: var(--shadow-card);
    }

    .cover-art {
      position: relative;
      min-height: 94px;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, #1b2431, #0a0d12);
      isolation: isolate;
    }

    .cover-art::before,
    .cover-art::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
    }

    .cover-art::before {
      width: 92px;
      height: 92px;
      right: -22px;
      top: -24px;
      background: var(--cover-accent, #338feb);
      opacity: 0.22;
      filter: blur(2px);
    }

    .cover-art::after {
      width: 80px;
      height: 80px;
      left: -32px;
      bottom: -38px;
      border: 14px solid rgba(255, 255, 255, 0.05);
    }

    .cover-map { --cover-accent: #f4b35e; background: linear-gradient(145deg, #263027, #101713); }
    .cover-box { --cover-accent: #a87555; background: linear-gradient(145deg, #2e2722, #14100e); }
    .cover-heart { --cover-accent: #ff5678; background: linear-gradient(145deg, #2b1d25, #120b0f); }
    .cover-type { --cover-accent: #e9e1c9; background: linear-gradient(145deg, #302d29, #121110); }
    .cover-leaf { --cover-accent: #33d8a4; background: linear-gradient(145deg, #19322c, #0c1512); }
    .cover-gear { --cover-accent: #8174fa; background: linear-gradient(145deg, #25223a, #100f18); }

    .cover-symbol {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.82);
    }

    .cover-symbol .icon {
      width: 50px;
      height: 50px;
      stroke-width: 1.3;
      filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.38));
    }

    .cover-version {
      position: absolute;
      right: 6px;
      bottom: 6px;
      min-height: 22px;
      padding: 2px 6px;
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.62);
      color: var(--text-tertiary);
      font-family: var(--font-number);
      font-size: 9px;
      backdrop-filter: blur(6px);
    }

    .mod-card-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .mod-card-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .mod-card-title {
      min-width: 0;
      flex: 1;
    }

    .mod-card-title strong {
      display: block;
      overflow: hidden;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mod-card-title span {
      display: block;

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    function activeTaskForMod(current, mod) {
      if (!mod?.current_task_id) return null;
      return current.tasks[mod.current_task_id] || null;
    }

    function latestVisibleTask(current) {
      const tasks = Object.values(current.tasks)
        .filter(task => TASK_ACTIVE_STATES.includes(task.task_state) || task.task_state === 'failed')
        .sort((a, b) => b.sequence - a.sequence);
      return tasks[0] || null;
    }

    function deriveMod(current, mod) {
      const task = activeTaskForMod(current, mod);
      const installed = mod.installation_fact === 'installed';
      const enabled = mod.enabled_value === 'enabled';
      const taskActive = Boolean(task && TASK_ACTIVE_STATES.includes(task.task_state));
      const deviceLabel = installed
        ? `已安装 · ${enabled ? '已启用' : '未启用'} · 仅此设备`
        : '未安装 · 当前设备';

      let factTone = installed ? 'is-success' : '';
      let secondaryFact = '';
      if (mod.update_fact === 'update_available') secondaryFact = '有新版本';
      if (mod.update_fact === 'source_unknown') secondaryFact = '更新状态未知';
      if (mod.install_gate === 'dependency_blocked') {
        secondaryFact = '缺少必要依赖';
        factTone = 'is-error';
      }
      if (mod.compatibility === 'unknown') secondaryFact = '兼容性未知';

      let primary = { action: 'open-detail', label: '查看详情', tone: '' };
      if (!installed && mod.install_gate === 'allowed') {
        primary = {
          action: 'install',
          label: mod.dependency_count ? `安装（含 ${mod.dependency_count} 个必要依赖）` : '安装',
          tone: 'primary'
        };
      } else if (!installed && mod.install_gate === 'dependency_blocked') {
        primary = { action: 'inspect-gate', label: '查看阻塞原因', tone: 'warning' };
      } else if (installed && mod.update_fact === 'update_available') {
        primary = { action: 'update', label: task?.task_state === 'failed' ? '重试更新' : '更新', tone: 'primary' };
      } else if (installed && mod.update_fact === 'source_unknown') {
        primary = { action: 'recheck-update', label: '重新检查更新', tone: '' };
      }

      if (taskActive) {
        primary = {
          action: 'open-detail',
          label: taskStatusLabel(task),
          tone: ''
        };
      }

      return {
        mod,
        task,
        installed,
        enabled,
        taskActive,
        deviceLabel,
        secondaryFact,
        factTone,
        primary
      };
    }

    function derive(current = state) {
      const query = current.ui.search.trim().toLowerCase();
      let mods = Object.values(current.mods);

      if (current.ui.tab === 'installed') {
        mods = mods.filter(mod => mod.installation_fact === 'installed');

        if (current.ui.filter === 'update') mods = mods.filter(mod => mod.update_fact === 'update_available');
        if (current.ui.filter === 'exception') {

            const task = activeTaskForMod(current, mod);
            return mod.update_fact === 'source_unknown' || task?.task_state === 'failed';

          `${mod.name} ${mod.author} ${mod.source}`.toLowerCase().includes(query)

      mods.sort((a, b) => {
        if (current.ui.sort === 'latest') {
          return b.latest_version.localeCompare(a.latest_version, undefined, { numeric: true });
        }
        if (current.ui.sort === 'recent') return b.updated_at.localeCompare(a.updated_at);
        return b.popularity - a.popularity || b.updated_at.localeCompare(a.updated_at);
      });

      const currentMod = current.ui.currentModId ? current.mods[current.ui.currentModId] : null;
      const visibleTask = latestVisibleTask(current);
      return {
        state: current,
        mods: mods.map(mod => deriveMod(current, mod)),
        currentMod: currentMod ? deriveMod(current, currentMod) : null,
        visibleTask,
        installedCount: Object.values(current.mods).filter(mod => mod.installation_fact === 'installed').length,
        enabledCount: Object.values(current.mods).filter(mod => mod.enabled_value === 'enabled').length
      };
    }

    function taskStatusLabel(task) {
      const labels = {
        queued: '等待下载',
        downloading: task.auto_resume_waiting ? '网络异常，等待恢复' : `下载中 ${task.progress_percent}%`,
        paused_by_system: task.auto_resume_failed ? '下载已暂停' : '系统已暂停',
        verifying: '正在校验',
        installing: task.operation === 'update' ? '正在更新' : '正在安装',
        succeeded: '已完成',
        failed: task.operation === 'update' ? '更新失败，仍在使用旧版' : '安装失败',
        cancelled: '已取消'
      };
      return labels[task.task_state] || task.task_state;
    }

    function finishTask(next, task, taskMod) {
      if (task.fail_on_commit) {
        task.task_state = 'failed';
        task.failure_code = 'PACKAGE_HASH_MISMATCH';
        task.failure_stage = task.operation === 'update' ? 'update' : 'install';
        taskMod.current_task_id = task.task_id;
        if (task.operation === 'update') taskMod.update_fact = 'update_available';
        return;
      }
      task.task_state = 'succeeded';
      task.progress_percent = 100;
      taskMod.installation_fact = 'installed';
      if (task.operation === 'install') taskMod.enabled_value = 'enabled';
      taskMod.installed_version = taskMod.latest_version;
      taskMod.installed_package_hash = `sha256:${taskMod.mod_id}-${taskMod.latest_version}`;
      taskMod.active_version_pointer = taskMod.latest_version;
      taskMod.update_fact = 'no_update';
      taskMod.current_task_id = null;
    }

    function reducer(current, action) {
      const next = clone(current);
      const requestedModId = action.modId || action.mod_id || null;
      const mod = requestedModId ? next.mods[requestedModId] : null;

      switch (action.type) {
        case 'ORIENTATION_CHANGED': {
          next.orientation = action.orientation;
          if (action.listAnchorModId) next.ui.listAnchorModId = action.listAnchorModId;
          if (Number.isFinite(action.listAnchorOffset)) next.ui.listAnchorOffset = action.listAnchorOffset;
          if (action.detailAnchorSectionId) next.ui.detailAnchorSectionId = action.detailAnchorSectionId;
          if (Number.isFinite(action.detailAnchorOffset)) next.ui.detailAnchorOffset = action.detailAnchorOffset;
          return next;
        }
        case 'ANCHORS_CAPTURED': {
          if (action.listAnchorModId) next.ui.listAnchorModId = action.listAnchorModId;
          if (action.detailAnchorSectionId) next.ui.detailAnchorSectionId = action.detailAnchorSectionId;
          if (Number.isFinite(action.listAnchorOffset)) next.ui.listAnchorOffset = action.listAnchorOffset;
          if (Number.isFinite(action.detailAnchorOffset)) next.ui.detailAnchorOffset = action.detailAnchorOffset;
          return next;
        }
        case 'OPEN_MORE': {
          next.ui.activeDialog = { type: 'more' };
          return next;
        }
        case 'CLOSE_DIALOG': {
          next.ui.activeDialog = null;
          return next;
        }
        case 'OPEN_MODS':
        case 'ENTER_MODS': {
          next.ui.screen = 'mods_list';
          next.ui.activeDialog = null;
          return next;
        }
        case 'BACK_GAME':
        case 'BACK_TO_GAME': {
          next.ui.screen = 'game_detail';
          next.ui.activeDialog = null;
          return next;
        }
        case 'SET_TAB': {
          next.ui.tab = action.tab;
          next.ui.listAnchorModId = action.tab === 'installed' ? 'item-stack' : 'dst-fast-travel';
          return next;
        }
        case 'SET_SEARCH': {
          next.ui.search = action.value;
          next.ui.searchText = action.value;
          return next;
        }
        case 'SET_SORT': {
          next.ui.sort = action.value;
          next.ui.sortKey = action.value;
          return next;
        }
        case 'SET_FILTER': {
          next.ui.filter = action.value;
          next.ui.filterKey = action.value;
          return next;
        }
        case 'OPEN_DETAIL': {
          if (!mod) return next;
          next.ui.screen = 'mod_detail';
          next.ui.currentModId = requestedModId;
          next.ui.readingSection = action.keepSection ? next.ui.readingSection : 'intro';
          next.ui.readingSectionId = next.ui.readingSection;
          next.ui.detailAnchorSectionId = next.ui.readingSection;
          next.ui.listAnchorModId = requestedModId;
          next.metrics.detailRequestCount += 1;
          return next;
        }
        case 'CLOSE_DETAIL': {
          next.ui.screen = 'mods_list';
          next.ui.activeDialog = null;
          return next;
        }
        case 'SET_READING_SECTION': {
          const section = action.section || action.sectionId || 'intro';
          next.ui.readingSection = section;
          next.ui.readingSectionId = section;
          next.ui.detailAnchorSectionId = section;
          next.ui.detailAnchorOffset = 0;
          return next;
        }
        case 'SET_PREVIEW': {
          next.ui.selectedPreviewId = action.previewId;
          return next;
        }
        case 'INSTALL_REQUESTED': {
          if (!mod || mod.installation_fact === 'installed') return next;
          if (mod.install_gate !== 'allowed') {
            next.ui.activeDialog = { type: 'gate', modId: requestedModId };
            return next;
          }
          if (mod.soft_risk) {
            next.ui.activeDialog = { type: 'risk', modId: requestedModId };
            return next;
          }
          createOrReuseTask(next, requestedModId, 'install');
          return next;
        }
        case 'INSTALL_CONFIRMED': {
          if (!mod || mod.installation_fact === 'installed') return next;
          next.ui.activeDialog = null;
          createOrReuseTask(next, requestedModId, 'install');
          return next;
        }
        case 'UPDATE_REQUESTED': {
          if (!mod || mod.installation_fact !== 'installed') return next;
          if (mod.update_fact !== 'update_available') return next;
          createOrReuseTask(next, requestedModId, 'update');
          return next;
        }
        case 'ENABLE_CHANGED':
        case 'ENABLE_TOGGLED': {
          if (!mod || mod.installation_fact !== 'installed') return next;
          mod.enabled_value = action.value || (mod.enabled_value === 'enabled' ? 'disabled' : 'enabled');
          return next;
        }
        case 'UNINSTALL_REQUESTED': {
          if (!mod || mod.installation_fact !== 'installed') return next;
          next.ui.activeDialog = { type: 'uninstall', modId: action.modId };
          return next;
        }
        case 'UNINSTALL_CONFIRMED': {
          if (!mod || mod.installation_fact !== 'installed') return next;
          const task = activeTaskForMod(next, mod);
          if (task && TASK_ACTIVE_STATES.includes(task.task_state)) return next;
          mod.installation_fact = 'not_installed';
          mod.enabled_value = 'not_applicable';
          mod.installed_version = null;
          mod.installed_package_hash = null;
          mod.active_version_pointer = null;
          mod.current_task_id = null;
          mod.update_fact = 'no_update';
          next.ui.activeDialog = null;
          if (next.ui.tab === 'installed') next.ui.screen = 'mods_list';
          return next;
        }
        case 'SOURCE_RECHECKED':
        case 'RECHECK_UPDATE': {
          if (!mod || mod.installation_fact !== 'installed') return next;
          mod.update_fact = mod.latest_version === mod.installed_version ? 'no_update' : 'update_available';
          return next;
        }
        case 'TASK_ADVANCE': {
          const target = mod || next.mods[next.tasks[action.task_id]?.root_mod_id];
          const task = target ? activeTaskForMod(next, target) : next.tasks[action.task_id];
          if (!task || !TASK_ACTIVE_STATES.includes(task.task_state)) return next;
          const taskMod = next.mods[task.root_mod_id];
          if (!taskMod) return next;

          if (task.task_state === 'queued') {
            task.task_state = 'downloading';
            task.progress_percent = 40;
          } else if (task.task_state === 'downloading' && task.progress_percent < 80) {
            task.progress_percent = Math.min(80, task.progress_percent + 40);
            task.downloaded_bytes = Math.round(task.total_bytes * task.progress_percent / 100);
          } else if (task.task_state === 'downloading') {
            task.task_state = 'verifying';
            task.progress_percent = 90;
          } else if (task.task_state === 'verifying') {
            task.task_state = 'installing';
            task.progress_percent = 96;
          } else if (task.task_state === 'installing') {
            finishTask(next, task, taskMod);
          }
          task.updated_at = new Date().toISOString();
          return next;
        }
        case 'TASK_TICK': {
          const task = next.tasks[action.task_id];
          if (!task || !TASK_ACTIVE_STATES.includes(task.task_state)) return next;
          const taskMod = next.mods[task.root_mod_id];
          if (!taskMod) return next;

          if (task.task_state === 'queued') {
            task.task_state = 'downloading';
            task.progress_percent = Math.max(task.progress_percent, 6);
          } else if (task.task_state === 'downloading') {
            task.progress_percent = Math.min(100, task.progress_percent + 13);
            task.downloaded_bytes = Math.round(task.total_bytes * task.progress_percent / 100);
            if (task.progress_percent >= 100) task.task_state = 'verifying';
          } else if (task.task_state === 'verifying') {
            task.task_state = 'installing';
          } else if (task.task_state === 'installing') {
            finishTask(next, task, taskMod);
          }
          task.updated_at = new Date().toISOString();
          return next;
        }
        case 'UPDATE_FAILED': {
          if (!mod || mod.installation_fact !== 'installed') return next;
          mod.update_fact = 'update_available';
          let task = activeTaskForMod(next, mod);
          if (!task || !TASK_ACTIVE_STATES.includes(task.task_state)) {
            task = null;
            const taskId = createOrReuseTask(next, requestedModId, 'update', true);
            task = taskId ? next.tasks[taskId] : null;
          }
          if (task) {
            task.task_state = 'failed';
            task.failure_code = 'PACKAGE_HASH_MISMATCH';
            task.failure_stage = 'update';
            task.progress_percent = Math.max(84, task.progress_percent);
            mod.installation_fact = 'installed';
            mod.update_fact = 'update_available';
          }
          return next;
        }
        case 'SYSTEM_PAUSED': {
          const task = next.tasks[action.task_id] || latestVisibleTask(next);
          if (task && task.task_state === 'downloading') {
            task.task_state = 'paused_by_system';
            task.auto_resume_should_fail = Boolean(action.autoResumeShouldFail);
            task.auto_resume_failed = false;
          }
          return next;
        }
        case 'APP_BACKGROUNDED': {
          next.ui.isForeground = false;
          const task = latestVisibleTask(next);
          if (task && task.task_state === 'downloading') {
            task.task_state = 'paused_by_system';
            task.auto_resume_failed = false;
          }
          return next;
        }
        case 'APP_FOREGROUNDED': {
          next.ui.isForeground = true;
          const task = latestVisibleTask(next);
          if (task && task.task_state === 'paused_by_system' && !task.auto_resume_used) {
            task.auto_resume_used = true;
            if (task.auto_resume_should_fail) {
              task.auto_resume_failed = true;
              task.failure_code = 'DOWNLOAD_INTERRUPTED';
            } else {
              task.task_state = 'downloading';
              task.auto_resume_failed = false;
            }
          }
          return next;
        }
        case 'CONTINUE_REQUESTED': {
          const task = next.tasks[action.task_id];
          if (task && (task.task_state === 'paused_by_system' || task.task_state === 'failed')) {
            task.task_state = 'downloading';
            task.auto_resume_failed = false;
            task.failure_code = null;
          }
          return next;
        }
        case 'CANCEL_REQUESTED': {
          const task = next.tasks[action.task_id];
          if (task && ['queued', 'downloading', 'paused_by_system'].includes(task.task_state)) {
            task.task_state = 'cancelled';
            const taskMod = next.mods[task.root_mod_id];
            if (taskMod) taskMod.current_task_id = null;
          }
          return next;
        }
        case 'FAIL_ACTIVE_UPDATE': {
          let task = latestVisibleTask(next);
          if (!task || task.operation !== 'update') {
            const updateMod = Object.values(next.mods).find(item => item.update_fact === 'update_available');
            if (updateMod) {
              createOrReuseTask(next, updateMod.mod_id, 'update', true);
              task = activeTaskForMod(next, next.mods[updateMod.mod_id]);
            }
          }
          if (task && task.operation === 'update') task.fail_on_commit = true;
          return next;
        }
        case 'SET_SOURCE_UNKNOWN': {
          const target = mod || next.mods['font-patch'];
          if (target?.installation_fact === 'installed') target.update_fact = 'source_unknown';
          return next;
        }
        case 'CLEAR_FAILED_TASK': {
          const task = next.tasks[action.task_id];
          if (task?.task_state === 'failed') {
            const taskMod = next.mods[task.root_mod_id];
            if (taskMod) taskMod.current_task_id = null;
          }
          return next;
        }
        default:
          return next;
      }
    }

    function createOrReuseTask(next, modId, operation, failOnCommit = false) {
      const mod = next.mods[modId];
      if (!mod) return null;
      const existing = activeTaskForMod(next, mod);
      if (existing && TASK_ACTIVE_STATES.includes(existing.task_state)) return existing.task_id;

      next.metrics.taskSequence += 1;
      next.metrics.taskCreateCount += 1;
      const task_id = `task-app-${String(next.metrics.taskSequence).padStart(3, '0')}-${modId}`;
      next.tasks[task_id] = {
        task_id,
        root_mod_id: modId,
        operation,
        idempotency_key: `${next.device_installation_id}:${next.game_id}:${modId}`,
        task_state: 'queued',
        progress_percent: 0,
        downloaded_bytes: 0,
        total_bytes: operation === 'update' ? 9437184 : 12582912,
        failure_code: null,
        failure_stage: null,
        operation_attempt: 1,
        auto_resume_used: false,
        auto_resume_failed: false,
        auto_resume_should_fail: false,
        fail_on_commit: failOnCommit,
        sequence: next.metrics.taskSequence,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };
      mod.current_task_id = task_id;
      return task_id;
    }

    function dispatch(action) {
      if (!action || typeof action.type !== 'string') return getState();
      const previous = state;
      state = reducer(state, action);
      render();
      handleTaskSideEffects(previous, state, action);
      return getState();
    }

    function handleTaskSideEffects(previous, current, action) {
      const startable = new Set([
        'INSTALL_REQUESTED',
        'INSTALL_CONFIRMED',
        'UPDATE_REQUESTED',
        'CONTINUE_REQUESTED',
        'APP_FOREGROUNDED',
        'TASK_TICK',
        'FAIL_ACTIVE_UPDATE'
      ]);

      if (action.type === 'SYSTEM_PAUSED' || action.type === 'APP_BACKGROUNDED' || action.type === 'CANCEL_REQUESTED') {
        for (const [taskId, timer] of runnerRegistry.entries()) {
          const task = current.tasks[taskId];
          if (!task || task.task_state === 'paused_by_system' || task.task_state === 'cancelled') {
            clearTimeout(timer);
            runnerRegistry.delete(taskId);
          }
        }
      }

      if (!startable.has(action.type)) return;
      for (const task of Object.values(current.tasks)) {
        if (['queued', 'downloading', 'verifying', 'installing'].includes(task.task_state)) {
          armTaskRunner(task.task_id);
        }
      }
    }

    function armTaskRunner(taskId) {
      if (runnerRegistry.has(taskId)) return;
      const task = state.tasks[taskId];
      if (!task || !['queued', 'downloading', 'verifying', 'installing'].includes(task.task_state)) return;
      const delay = task.task_state === 'downloading' ? 760 : 920;
      const timer = setTimeout(() => {
        runnerRegistry.delete(taskId);
        dispatch({ type: 'TASK_TICK', task_id: taskId });
      }, delay);
      runnerRegistry.set(taskId, timer);
    }

    function reset() {
      for (const timer of runnerRegistry.values()) clearTimeout(timer);
      runnerRegistry.clear();
      state = createInitialState();
      shouldRestoreAnchors = false;
      render();
      showToast('<strong>Demo 已重置</strong>，已恢复 DST 游戏详情。');
      return getState();
    }

    function getState() {
      return clone(state);
    }

    function render() {
      const viewModel = derive(state);
      const focusSnapshot = captureFocus();
      root.dataset.orientation = state.orientation;
      root.className = `device ${state.orientation}`;
      root.innerHTML = state.orientation === 'portrait'
        ? renderPortrait(viewModel)
        : renderLandscape(viewModel);
      updateReviewToolbar();
      restoreFocus(focusSnapshot);
      if (shouldRestoreAnchors) {
        restoreAnchors(state.ui);
        shouldRestoreAnchors = false;
      }
    }

    function renderPortrait(vm) {
      const content = vm.state.ui.screen === 'game_detail'
        ? renderPortraitGame(vm)
        : vm.state.ui.screen === 'mod_detail'

    function renderLandscape(vm) {

    function renderBottomNav() {

    function captureFocus() {
      const active = document.activeElement;
      if (!active || !root.contains(active)) return null;
      const key = active.dataset.input;
      if (!key) return null;
      return {
        key,
        selectionStart: typeof active.selectionStart === 'number' ? active.selectionStart : null
      };
    }

    function restoreFocus(snapshot) {
      if (!snapshot) return;
      const target = root.querySelector(`[data-input="${snapshot.key}"]`);
      if (!target) return;
      target.focus({ preventScroll: true });
      if (snapshot.selectionStart !== null && typeof target.setSelectionRange === 'function') {
        target.setSelectionRange(snapshot.selectionStart, snapshot.selectionStart);
      }
    }

    function captureAnchors() {
      const listContainer = root.querySelector('[data-scroll-container="list"]');
      const detailContainer = root.querySelector('[data-scroll-container="detail"]');
      const listAnchor = nearestVisible(listContainer, '[data-list-anchor]');
      let detailAnchor = null;
      const selectedSection = detailContainer?.querySelector(
        `[data-detail-section="${state.ui.readingSectionId}"]`
      );
      if (selectedSection) {
        const bounds = detailContainer.getBoundingClientRect();
        const rect = selectedSection.getBoundingClientRect();
        if (rect.bottom > bounds.top + 8 && rect.top < bounds.bottom - 8) {
          const offset = Math.round(rect.top - bounds.top);
          const offsetDelta = offset - (state.ui.detailAnchorOffset || 0);
          const maxScrollTop = detailContainer.scrollHeight - detailContainer.clientHeight;
          const blockedByEnd = offsetDelta > 1 && detailContainer.scrollTop >= maxScrollTop - 1;
          const blockedByStart = offsetDelta < -1 && detailContainer.scrollTop <= 1;
          if (!blockedByEnd && !blockedByStart) {
            detailAnchor = { element: selectedSection, offset };
          }
        }
      }
      if (!detailAnchor && state.ui.detailAnchorSectionId !== state.ui.readingSectionId) {
        detailAnchor = nearestVisible(detailContainer, '[data-detail-section]');
      }
      return {
        listAnchorModId: listAnchor?.element.dataset.listAnchor ?? state.ui.listAnchorModId,
        listAnchorOffset: listAnchor?.offset ?? state.ui.listAnchorOffset,
        detailAnchorSectionId: detailAnchor?.element.dataset.detailSection ?? state.ui.detailAnchorSectionId,
        detailAnchorOffset: detailAnchor?.offset ?? state.ui.detailAnchorOffset
      };
    }

    function nearestVisible(container, selector) {
      if (!container) return null;
      if (container.scrollHeight <= container.clientHeight + 1) return null;
      const bounds = container.getBoundingClientRect();
      const items = [...container.querySelectorAll(selector)];
      const element = items
        .filter(item => item.getBoundingClientRect().bottom > bounds.top + 8)
        .sort((a, b) => Math.abs(a.getBoundingClientRect().top - bounds.top) - Math.abs(b.getBoundingClientRect().top - bounds.top))[0] || null;
      return element
        ? { element, offset: Math.round(element.getBoundingClientRect().top - bounds.top) }
        : null;
    }

    function restoreAnchors(ui) {
      if (ui.screen === 'mods_list' && ui.listAnchorModId) {
        const target = root.querySelector(`[data-list-anchor="${ui.listAnchorModId}"]`);
        const container = root.querySelector('[data-scroll-container="list"]');
        if (target && container) {
          const delta = target.getBoundingClientRect().top
            - container.getBoundingClientRect().top
            - (ui.listAnchorOffset || 0);
          container.scrollTop += delta;
        }
      }
      if (ui.screen === 'mod_detail' && ui.detailAnchorSectionId) {
        const target = root.querySelector(`[data-detail-section="${ui.detailAnchorSectionId}"]`);
        const container = root.querySelector('[data-scroll-container="detail"]');
        if (target && container) {
          const delta = target.getBoundingClientRect().top
            - container.getBoundingClientRect().top
            - (ui.detailAnchorOffset || 0);
          container.scrollTop += delta;
        }
      }
    }

    function changeOrientation(orientation) {
      if (!['portrait', 'landscape'].includes(orientation) || orientation === state.orientation) return;
      const anchors = captureAnchors();
      shouldRestoreAnchors = true;
      dispatch({ type: 'ORIENTATION_CHANGED', orientation, ...anchors });
      showToast(`<strong>${orientation === 'portrait' ? '已切换竖屏' : '已切换横屏'}</strong>，页面、任务与详情请求计数保持不变。`);
    }

    function updateReviewToolbar() {
      toolbar.querySelectorAll('[data-review-action="portrait"], [data-review-action="landscape"]').forEach(button => {
        button.classList.toggle('is-active', button.dataset.reviewAction === state.orientation);
      });
    }

    function showToast(html) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = html;
      toastRegion.appendChild(toast);
      setTimeout(() => toast.remove(), 3600);
    }

    root.addEventListener('click', event => {
      const control = event.target.closest('[data-action]');
      if (!control) return;
      const action = control.dataset.action;
      const modId = control.dataset.modId;
      const taskId = control.dataset.taskId;

      if (action === 'open-more') dispatch({ type: 'OPEN_MORE' });
      if (action === 'close-dialog') dispatch({ type: 'CLOSE_DIALOG' });
      if (action === 'enter-mods') dispatch({ type: 'ENTER_MODS' });
      if (action === 'back-game') dispatch({ type: 'BACK_TO_GAME' });
      if (action === 'set-tab') dispatch({ type: 'SET_TAB', tab: control.dataset.tab });
      if (action === 'open-detail') dispatch({ type: 'OPEN_DETAIL', modId });
      if (action === 'close-detail') dispatch({ type: 'CLOSE_DETAIL' });
      if (action === 'install') dispatch({ type: 'INSTALL_REQUESTED', modId });
      if (action === 'confirm-install') dispatch({ type: 'INSTALL_CONFIRMED', modId });
      if (action === 'update') dispatch({ type: 'UPDATE_REQUESTED', modId });
      if (action === 'toggle-enable') {
        dispatch({ type: 'ENABLE_TOGGLED', modId });
        showToast('<strong>本机启用值已更新</strong>，进行中的更新任务不受影响。');
      }
      if (action === 'uninstall') dispatch({ type: 'UNINSTALL_REQUESTED', modId });
      if (action === 'confirm-uninstall') {
        dispatch({ type: 'UNINSTALL_CONFIRMED', modId });
        showToast('<strong>已从当前设备卸载</strong>，存档和用户配置未修改。');
      }
      if (action === 'recheck-update') {
        dispatch({ type: 'RECHECK_UPDATE', modId });
        showToast('<strong>更新状态已重新检查</strong>，未使用缓存版本执行更新。');
      }
      if (action === 'inspect-gate') dispatch({ type: 'INSTALL_REQUESTED', modId });
      if (action === 'reading-section') {
        shouldRestoreAnchors = true;
        dispatch({ type: 'SET_READING_SECTION', section: control.dataset.section });
      }
      if (action === 'set-preview') dispatch({ type: 'SET_PREVIEW', previewId: control.dataset.previewId });
      if (action === 'continue-task') {
        dispatch({ type: 'CONTINUE_REQUESTED', task_id: taskId });
        showToast('<strong>继续原任务</strong>，task_id 与已下载字节保持不变。');
      }
      if (action === 'cancel-task') {
        dispatch({ type: 'CANCEL_REQUESTED', task_id: taskId });
        showToast('<strong>任务已取消</strong>，已安装旧版与启用值未改变。');
      }
      if (action === 'clear-failed') dispatch({ type: 'CLEAR_FAILED_TASK', task_id: taskId });
    });

    root.addEventListener('input', event => {
      if (event.target.matches('[data-input="search"]')) {
        dispatch({ type: 'SET_SEARCH', value: event.target.value });
      }
    });

    root.addEventListener('change', event => {
      if (event.target.matches('[data-input="sort"]')) dispatch({ type: 'SET_SORT', value: event.target.value });
      if (event.target.matches('[data-input="filter"]')) dispatch({ type: 'SET_FILTER', value: event.target.value });
    });

    toolbar.addEventListener('click', event => {
      const control = event.target.closest('[data-review-action]');
      if (!control) return;
      const action = control.dataset.reviewAction;

      if (action === 'portrait' || action === 'landscape') changeOrientation(action);
      if (action === 'open-entry') {
        if (state.ui.screen !== 'game_detail') dispatch({ type: 'BACK_TO_GAME' });
        dispatch({ type: 'OPEN_MORE' });
      }
      if (action === 'pause' || action === 'pause-fail') {
        const task = latestVisibleTask(state);
        if (!task || task.task_state !== 'downloading') {
          showToast('请先开始一个安装或更新任务，等待进入下载状态后再暂停。');
        } else {
          dispatch({ type: 'SYSTEM_PAUSED', task_id: task.task_id, autoResumeShouldFail: action === 'pause-fail' });
          showToast(`<strong>系统已暂停下载</strong>${action === 'pause-fail' ? '，下一次前台自动续传将失败。' : '。'}`);
        }
      }
      if (action === 'foreground') {
        dispatch({ type: 'APP_FOREGROUNDED' });
        const task = latestVisibleTask(state);
        showToast(task?.auto_resume_failed
          ? '<strong>自动续传已尝试一次并失败</strong>，请使用“继续”或“取消”。'
          : '<strong>已回到前台</strong>，暂停任务只自动续传一次。'
        );
      }
      if (action === 'update-fail') {
        dispatch({ type: 'FAIL_ACTIVE_UPDATE' });
        showToast('<strong>已设置更新失败</strong>，旧版指针、启用值与“有新版本”将保留。');
      }
      if (action === 'source-unknown') {
        dispatch({ type: 'SET_SOURCE_UNKNOWN', modId: 'font-patch' });
        dispatch({ type: 'SET_TAB', tab: 'installed' });
        if (state.ui.screen === 'game_detail') dispatch({ type: 'ENTER_MODS' });
        showToast('<strong>更新状态未知</strong>，不会展示可执行更新入口。');
      }
      if (action === 'reset') reset();
    });

    window.__DST_MODS_DEMO__ = {
      version: DEMO_MODEL_VERSION,
      getState,
      dispatch,
      derive: () => clone(derive(state)),
      reset
    };

    render();
  </script>
</body>
</html>
