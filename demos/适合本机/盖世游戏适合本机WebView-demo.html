<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>盖世游戏｜适合本机</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #000000;
      --bg-card: #1a1a1a;
      --bg-elevated: #252525;
      --bg-overlay: #28202a;
      --text-primary: #ffffff;
      --text-secondary: #e6e6e6;
      --text-tertiary: #f2f2f2;
      --text-muted: #7b7b7b;
      --text-disabled: #646464;
      --brand-gold: #ffcc43;
      --brand-gold-light: #ffd98f;
      --brand-green: #33d8a4;
      --brand-blue: #338feb;
      --brand-purple: #8174fa;
      --warning: #ff9b70;
      --danger: #ff667f;
      --border-default: #353d4e;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 100px;
      --font-primary: 'MiSans VF', 'MiSans', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-number: 'D-DIN-PRO', 'MiSans VF', sans-serif;
    }
    html, body { min-height: 100%; }
    body {
      min-width: 320px;
      font-family: var(--font-primary);
      color: var(--text-primary);
      background: #101113;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    button { color: inherit; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 2px;
    }
    .demo-workbench {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background:
        radial-gradient(circle at 22% 20%, rgba(255, 204, 67, .08), transparent 26%),
        radial-gradient(circle at 82% 78%, rgba(51, 143, 235, .09), transparent 28%),
        #101113;
    }
    .demo-toolbar {
      width: min(874px, calc(100vw - 32px));
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px 8px 14px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius-lg);
      background: rgba(30,31,34,.88);
      backdrop-filter: blur(20px);
    }
    .demo-title { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 520; }
    .demo-mark {
      width: 24px; height: 24px; display: grid; place-items: center;
      border-radius: 7px; color: #171717; background: var(--brand-gold);
      font-size: 12px; font-weight: 700;
    }
    .demo-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .control-group { display: flex; padding: 3px; gap: 2px; border-radius: 9px; background: #111214; }
    .control-btn {
      height: 30px; padding: 0 10px; border-radius: 7px; color: #9ea0a4;
      background: transparent; font-size: 12px; transition: .15s ease;
    }
    .control-btn:hover { color: #fff; background: #2a2c30; }
    .control-btn.is-active { color: #161616; background: var(--brand-gold); font-weight: 520; }
    .preview-frame {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: var(--bg-primary);
      box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.09);
      transition: width .25s ease, height .25s ease;
    }
    .preview-frame[data-orientation="portrait"] { width: 390px; height: 844px; }
    .preview-frame[data-orientation="landscape"] { width: 874px; height: 402px; }
    .app-shell {
      width: 100%; height: 100%; position: relative; overflow: hidden;
      background: var(--bg-primary); container: app / inline-size;
    }
    .view { display: none; width: 100%; height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .view::-webkit-scrollbar { display: none; }
    .view.is-active { display: block; }
    .safe-page { min-height: 100%; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); }
    .topbar {
      position: sticky; top: 0; z-index: 12; min-height: 44px;
      display: grid; grid-template-columns: 40px 1fr 40px; align-items: center;
      margin: -14px -16px 6px; padding: 10px 16px 4px;
      background: linear-gradient(#000 76%, rgba(0,0,0,0));
    }
    .topbar-title { text-align: center; font-size: 20px; line-height: 28px; font-weight: 520; }
    .icon-btn {
      width: 36px; height: 36px; display: grid; place-items: center;
      border-radius: 10px; background: transparent; color: #fff;
    }
    .icon-btn:hover { background: var(--bg-elevated); }
    .icon-btn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .search-wrap { position: relative; margin-top: 8px; }
    .search-icon {
      position: absolute; left: 13px; top: 50%; width: 18px; height: 18px;
      transform: translateY(-50%); pointer-events: none; stroke: #8c8e92; fill: none; stroke-width: 1.8;
    }
    .search-input {
      width: 100%; height: 44px; padding: 0 42px 0 40px;
      border: 1px solid transparent; border-radius: var(--radius-lg);
      color: #fff; caret-color: var(--brand-gold); background: var(--bg-card); font-size: 14px;
    }
    .search-input::placeholder { color: #77797e; }
    .search-input:focus { border-color: rgba(255,204,67,.48); background: #202020; }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; display: none; place-items: center;
      border-radius: 50%; color: #a2a4a8; background: #303236; font-size: 17px;
    }
    .search-wrap.has-value .search-clear { display: grid; }
    .device-card {
      position: relative;
      margin-top: 12px; padding: 13px 14px; border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--radius-lg); background:
        linear-gradient(115deg, rgba(255,204,67,.09), transparent 42%), var(--bg-card);
    }
    .device-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .device-copy { min-width: 0; }
    .eyebrow { color: var(--text-muted); font-size: 11px; line-height: 16px; }
    .device-name { margin-top: 2px; font-size: 15px; line-height: 22px; font-weight: 520; }
    .device-summary { margin-top: 2px; color: #a7a7a7; font-size: 12px; line-height: 17px; }
    .device-toggle {
      flex: 0 0 auto; display: flex; align-items: center; gap: 4px;
      padding: 6px 8px; border-radius: 7px; color: #c7c7c7; background: #262626; font-size: 11px;
    }
    .chevron { width: 14px; height: 14px; transition: .18s ease; stroke: currentColor; fill: none; stroke-width: 2; }
    .device-card.is-expanded .chevron { transform: rotate(180deg); }
    .device-details {
      display: none; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px 14px;
      margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08);
    }
    .device-card.is-expanded .device-details { display: grid; }
    .detail-pair span { display: block; color: var(--text-muted); font-size: 10px; line-height: 14px; }
    .detail-pair strong { display: block; margin-top: 2px; color: #dedede; font-size: 12px; line-height: 17px; font-weight: 380; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 22px 0 11px; }
    .section-title { font-size: 18px; line-height: 26px; font-weight: 520; }
    .section-sub { margin-top: 2px; color: var(--text-muted); font-size: 11px; line-height: 16px; }
    .result-count { color: #9d9fa3; font-family: var(--font-number); font-size: 12px; white-space: nowrap; }
    .game-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 10px; }
    .game-card { min-width: 0; text-align: left; background: transparent; border-radius: var(--radius-lg); }
    .game-card:active .cover { transform: scale(.98); }
    .cover {
      position: relative; aspect-ratio: 3 / 4; overflow: hidden;
      border-radius: var(--radius-lg); background: var(--cover); box-shadow: 0 4px 12px rgba(0,0,0,.3);
      transition: transform .12s ease;
    }
    .cover::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 74% 19%, rgba(255,255,255,.26), transparent 19%), linear-gradient(transparent 54%, rgba(0,0,0,.82));
    }
    .cover::after {
      content: ''; position: absolute; width: 90%; height: 52%; left: -32%; top: 10%;
      border: 1px solid rgba(255,255,255,.17); transform: rotate(-28deg); border-radius: 50%;
    }
    .cover-symbol {
      position: absolute; inset: 0; display: grid; place-items: center; padding-bottom: 28%;
      color: rgba(255,255,255,.92); font-size: 41px; font-weight: 700; text-shadow: 0 4px 20px rgba(0,0,0,.45);
    }
    .store-chip {
      position: absolute; top: 8px; left: 8px; padding: 3px 6px;
      border-radius: 4px; color: rgba(255,255,255,.88); background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
      font-size: 9px; line-height: 13px;
    }
    .cover-status {
      position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px);
      padding: 4px 7px; overflow: hidden; border-radius: 5px; white-space: nowrap; text-overflow: ellipsis;
      font-size: 10px; line-height: 14px; font-weight: 520; backdrop-filter: blur(8px);
    }
    .status-direct { color: #b6ffe7; background: rgba(15,108,82,.78); }
    .status-adjusted { color: #ffecad; background: rgba(123,88,0,.82); }
    .status-not_recommended { color: #ffd0d7; background: rgba(126,36,51,.82); }
    .status-unknown { color: #e0e0e0; background: rgba(72,72,76,.86); }
    .game-info { padding: 8px 2px 0; }
    .game-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; line-height: 20px; font-weight: 520; }
    .game-meta { margin-top: 3px; color: #97999d; font-family: var(--font-number); font-size: 10px; line-height: 15px; }
    .evidence-line { margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #73757a; font-size: 10px; line-height: 14px; }
    .state-panel {
      min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 28px; text-align: center;
    }
    .state-orb { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 18px; background: var(--bg-card); color: var(--brand-gold); }
    .state-orb svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .state-title { font-size: 16px; line-height: 23px; font-weight: 520; }
    .state-copy { max-width: 280px; color: var(--text-muted); font-size: 12px; line-height: 18px; }
    .secondary-btn { min-height: 36px; padding: 0 14px; border-radius: var(--radius-md); color: #f2f2f2; background: var(--bg-elevated); font-size: 12px; }
    .secondary-btn:hover { background: #303033; }
    .skeleton { overflow: hidden; position: relative; background: #1b1b1b; }
    .skeleton::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent); animation: shine 1.4s infinite; }
    @keyframes shine { to { transform: translateX(100%); } }
    .detail-page { min-height: 100%; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    .detail-topbar {
      position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 44px 1fr 44px;
      align-items: center; min-height: 54px; padding: 8px 12px 6px; background: rgba(0,0,0,.88); backdrop-filter: blur(18px);
    }
    .detail-topbar .title { overflow: hidden; text-align: center; white-space: nowrap; text-overflow: ellipsis; font-size: 16px; font-weight: 520; }
    .detail-content { padding: 8px 16px 20px; }
    .hero { display: grid; grid-template-columns: 104px minmax(0,1fr); gap: 14px; align-items: start; }
    .hero-cover { width: 104px; aspect-ratio: 3/4; border-radius: var(--radius-lg); }
    .hero-copy { min-width: 0; padding-top: 2px; }
    .hero-name { font-size: 20px; line-height: 28px; font-weight: 520; }
    .hero-store { margin-top: 3px; color: var(--text-muted); font-size: 11px; line-height: 16px; }
    .decision-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .decision-badge, .proof-badge { padding: 5px 8px; border-radius: 6px; font-size: 10px; line-height: 14px; font-weight: 520; }
    .proof-badge { color: #d2d3d5; background: var(--bg-elevated); }
    .decision-reason { margin-top: 9px; color: #c7c7c7; font-size: 12px; line-height: 18px; }
    .performance-strip {
      display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 1px; overflow: hidden;
      margin-top: 16px; border-radius: var(--radius-lg); background: #2b2b2e;
    }
    .metric { min-width: 0; padding: 11px 8px; text-align: center; background: var(--bg-card); }
    .metric strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: var(--font-number); font-size: 14px; line-height: 19px; font-weight: 600; }
    .metric span { display: block; margin-top: 2px; color: var(--text-muted); font-size: 9px; line-height: 13px; }
    .module { margin-top: 16px; padding: 14px; border-radius: var(--radius-lg); background: var(--bg-card); }
    .module-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .module-title { font-size: 15px; line-height: 22px; font-weight: 520; }
    .module-caption { margin-top: 2px; color: var(--text-muted); font-size: 10px; line-height: 15px; }
    .version-tag { flex: 0 0 auto; padding: 4px 7px; border-radius: 5px; color: #b9b9bc; background: #29292c; font-family: var(--font-number); font-size: 9px; }
    .plan-result { margin-top: 12px; padding: 10px 11px; border-left: 3px solid var(--brand-gold); border-radius: 0 7px 7px 0; background: rgba(255,204,67,.07); }
    .plan-result span { display: block; color: #948c70; font-size: 9px; line-height: 13px; }
    .plan-result strong { display: block; margin-top: 2px; color: #fff1c2; font-size: 12px; line-height: 18px; font-weight: 520; }
    .plan-notes { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-top: 10px; }
    .plan-note { min-width: 0; padding: 9px 10px; border-radius: 8px; background: #242426; }
    .plan-note span { display: block; color: var(--text-muted); font-size: 9px; line-height: 13px; }
    .plan-note strong { display: block; margin-top: 3px; color: #d5d5d6; font-size: 10px; line-height: 15px; font-weight: 380; }
    .steps { list-style: none; margin-top: 12px; }
    .step { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 9px; padding: 7px 0; }
    .step + .step { border-top: 1px solid rgba(255,255,255,.06); }
    .step-index { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: #171717; background: var(--brand-gold); font-family: var(--font-number); font-size: 10px; font-weight: 700; }
    .step strong { display: block; font-size: 12px; line-height: 18px; font-weight: 520; }
    .step p { margin-top: 2px; color: #8f9195; font-size: 10px; line-height: 16px; }
    .primary-action {
      width: 100%; min-height: 44px; margin-top: 13px; padding: 0 14px;
      border-radius: 10px; color: #181510; background: linear-gradient(135deg,#ffe17d,var(--brand-gold));
      box-shadow: 0 5px 16px rgba(255,204,67,.16); font-size: 14px; font-weight: 600;
    }
    .primary-action:active { transform: scale(.99); }
    .primary-action.is-done { color: #ccffeF; background: #125b47; box-shadow: none; }
    .primary-action.is-neutral { color: #f0f0f0; background: #303033; box-shadow: none; }
    .primary-action.is-loading { color: #766326; background: #cbb052; box-shadow: none; cursor: wait; }
    .primary-action.is-error { color: #ffdce2; background: #7d2837; box-shadow: none; }
    .data-row { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-top: 12px; }
    .data-cell { padding: 10px 8px; border-radius: 8px; background: #242426; text-align: center; }
    .data-cell strong { display: block; font-family: var(--font-number); font-size: 14px; line-height: 18px; }
    .data-cell span { display: block; margin-top: 3px; color: var(--text-muted); font-size: 9px; line-height: 13px; }
    .issue-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .issue-chip { min-height: 31px; padding: 0 10px; border-radius: var(--radius-full); color: #b8b9bc; background: #27272a; font-size: 10px; }
    .issue-chip.is-active { color: #171717; background: var(--brand-gold); font-weight: 520; }
    .issue-body { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.07); }
    .issue-body.is-visible { display: block; }
    .issue-body-title { font-size: 12px; line-height: 18px; font-weight: 520; }
    .issue-steps { margin: 7px 0 0 18px; color: #a9aaad; font-size: 10px; line-height: 17px; }
    .issue-note { margin-top: 8px; color: #8d8061; font-size: 9px; line-height: 14px; }
    details.module { padding: 0; }
    details.module summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; cursor: pointer; }
    details.module summary::-webkit-details-marker { display: none; }
    details.module[open] summary .chevron { transform: rotate(180deg); }
    .details-body { padding: 0 14px 14px; }
    .review { padding: 10px 0; }
    .review + .review { border-top: 1px solid rgba(255,255,255,.06); }
    .review-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .review-user { font-size: 11px; line-height: 16px; }
    .review-score { color: var(--brand-gold); font-size: 9px; letter-spacing: 1px; }
    .review p { margin-top: 5px; color: #999b9f; font-size: 10px; line-height: 16px; }
    .config-table { width: 100%; border-collapse: collapse; font-size: 10px; }
    .config-table td { padding: 8px 0; border-top: 1px solid rgba(255,255,255,.06); vertical-align: top; }
    .config-table tr:first-child td { border-top: 0; }
    .config-table td:first-child { width: 42%; color: var(--text-muted); }
    .config-table td:last-child { color: #d1d1d2; text-align: right; word-break: break-word; }
    .detail-column { min-width: 0; }
    .detail-empty { padding: 40px 16px; text-align: center; color: var(--text-muted); }
    @container app (min-width: 600px) {
      .safe-page { padding: 10px max(28px, env(safe-area-inset-left)) 22px max(28px, env(safe-area-inset-right)); }
      .topbar { position: static; grid-template-columns: 40px 1fr 40px; margin: -4px 0 0; padding: 0; background: transparent; }
      .topbar-title { text-align: left; padding-left: 2px; }
      .discovery-tools { display: grid; grid-template-columns: minmax(280px,.95fr) minmax(300px,1.05fr); gap: 12px; align-items: stretch; margin-top: 4px; }
      .search-wrap, .device-card { margin-top: 0; }
      .device-card { padding: 8px 12px; }
      .device-summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .device-details { position: absolute; z-index: 30; right: 28px; width: 340px; padding: 12px; border: 1px solid var(--border-default); border-radius: 10px; background: var(--bg-overlay); box-shadow: 0 12px 34px rgba(0,0,0,.5); }
      .section-head { margin: 12px 0 8px; }
      .section-title { font-size: 16px; line-height: 22px; }
      .game-grid { grid-template-columns: repeat(6,minmax(0,1fr)); gap: 10px; }
      .game-info { padding-top: 5px; }
      .game-name { font-size: 11px; line-height: 16px; }
      .game-meta, .evidence-line { font-size: 8px; line-height: 12px; }
      .store-chip { top: 6px; left: 6px; }
      .cover-status { left: 6px; bottom: 6px; max-width: calc(100% - 12px); padding: 3px 5px; font-size: 8px; line-height: 11px; }
      .cover-symbol { font-size: 30px; }
      .detail-content { padding: 8px max(28px, env(safe-area-inset-left)) 18px max(28px, env(safe-area-inset-right)); display: grid; grid-template-columns: minmax(250px,.82fr) minmax(0,1.7fr); gap: 18px; }
      .detail-column:first-child { position: sticky; top: 54px; align-self: start; }
      .detail-topbar { min-height: 48px; padding: 4px max(24px, env(safe-area-inset-left)); }
      .detail-topbar .title { text-align: left; }
      .hero { grid-template-columns: 96px minmax(0,1fr); gap: 12px; }
      .hero-cover { width: 96px; }
      .hero-name { font-size: 18px; line-height: 24px; }
      .decision-row { margin-top: 7px; }
      .decision-reason { margin-top: 6px; }
      .performance-strip { margin-top: 10px; }
      .metric { padding: 8px 6px; }
      .module { margin-top: 10px; padding: 11px 12px; }
      .detail-column > .module:first-child { margin-top: 0; }
      .plan-layout { display: grid; grid-template-columns: minmax(0,1fr) 160px; gap: 12px; }
      .plan-result { margin-top: 9px; }
      .steps { margin-top: 7px; }
      .step { padding: 5px 0; }
      .primary-action { margin-top: 8px; min-height: 38px; }
      .data-row { margin-top: 8px; }
      .issue-list { margin-top: 8px; }
      details.module summary { min-height: 44px; }
    }
    @media (max-width: 920px) {
      .demo-workbench { justify-content: flex-start; padding: 12px; }
      .demo-toolbar { width: 100%; }
      .preview-frame[data-orientation="landscape"] { width: min(874px, calc(100vw - 24px)); height: min(402px, calc((100vw - 24px) * .46)); min-height: 360px; }
    }
    @media (max-width: 470px) {
      .demo-workbench { padding: 0; gap: 0; background: #000; }
      .demo-toolbar { position: fixed; z-index: 100; left: 8px; right: 8px; bottom: 8px; width: auto; min-height: 42px; border-radius: 12px; opacity: .94; }
      .demo-title { display: none; }

          || (b.evidence.validUsers - a.evidence.validUsers)
          || String(b.evidence.updatedAt).localeCompare(String(a.evidence.updatedAt));
      });
    }
    function renderDeviceCard() {
      const context = state.context;
      return `<article id="device-card" class="device-card ${state.expanded.device ? 'is-expanded' : ''}">
        <div class="device-main">
          <div class="device-copy"><div class="eyebrow">当前设备</div><div class="device-name">${escapeHtml(context.deviceName)}</div><div class="device-summary">${escapeHtml(context.gpu)} · Android ${escapeHtml(context.androidVersion)}</div></div>
          <button class="device-toggle" data-action="toggle-device" aria-expanded="${state.expanded.device}">设备信息 ${icon('chevron')}</button>
        </div>
        <div class="device-details">
          <div class="detail-pair"><span>设备型号</span><strong>${escapeHtml(context.model)}</strong></div>
          <div class="detail-pair"><span>GPU</span><strong>${escapeHtml(context.gpu)}</strong></div>
          <div class="detail-pair"><span>Android</span><strong>${escapeHtml(context.androidVersion)}</strong></div>
          <div class="detail-pair"><span>盖世版本</span><strong>${escapeHtml(context.appVersion)}</strong></div>
          <div class="detail-pair"><span>运行内核</span><strong>${escapeHtml(context.kernelVersion)}</strong></div>
        </div>
      </article>`;
    }
    function renderGameCard(game) {
      const status = gameStatus(game);
      return `<button class="game-card" data-game-id="${escapeHtml(game.id)}" aria-label="查看${escapeHtml(game.name)}运行详情">
        <div class="cover" style="--cover:${coverStyle(game)}">
          <span class="cover-symbol">${escapeHtml(game.symbol)}</span><span class="store-chip">${escapeHtml(game.store)}</span>
          <span class="cover-status ${status.className}">${status.label}</span>
        </div>
        <div class="game-info"><div class="game-name">${escapeHtml(game.name)}</div><div class="game-meta">${formatFps(game)} · ${game.evidence.validRuns} 次有效运行</div><div class="evidence-line">${evidenceMap[game.evidence.level]}</div></div>
      </button>`;
    }
    function renderContextState() {
      if (state.context?.status === 'loading') {
        return `<div class="safe-page"><header class="topbar"><span></span><h1 class="topbar-title">适合本机</h1><span></span></header>
          <div class="state-panel"><div class="state-orb skeleton">${icon('device')}</div><div class="state-title">正在识别当前设备</div><div class="state-copy">获取设备和运行环境后，为你匹配可以玩的游戏。</div></div></div>`;
      }
      return `<div class="safe-page"><header class="topbar"><span></span><h1 class="topbar-title">适合本机</h1><span></span></header>
        <div class="state-panel"><div class="state-orb">${icon('alert')}</div><div class="state-title">暂时无法识别设备</div><div class="state-copy">未识别设备前不会生成兼容结论，请检查后重试。</div><button class="secondary-btn" data-action="retry-context">重新识别</button></div></div>`;
    }
    function renderDiscovery() {
      const root = document.getElementById('discovery-view');
      if (!state.context || state.context.status !== 'ready') {
        root.innerHTML = renderContextState();
        return;
      }
      const games = filteredGames();
      const searching = Boolean(state.query.trim());
      let listContent = '';
      if (state.dataStatus === 'loading') {
        listContent = `<div id="game-grid" class="state-panel"><div class="state-orb skeleton">${icon('search')}</div><div class="state-title">正在加载兼容数据</div><div class="state-copy">正在匹配当前设备的真实运行记录。</div></div>`;
      } else if (state.dataStatus === 'error') {
        listContent = `<div id="game-grid" class="state-panel"><div class="state-orb">${icon('alert')}</div><div class="state-title">兼容数据加载失败</div><div class="state-copy">设备已识别，但暂时没有获取到游戏数据。</div><button class="secondary-btn" data-action="retry-games">重新加载</button></div>`;
      } else if (games.length) {
        listContent = `<div id="game-grid" class="game-grid">${games.map(renderGameCard).join('')}</div>`;
      } else if (searching) {
        listContent = `<div id="game-grid" class="state-panel"><div class="state-orb">${icon('search')}</div><div class="state-title">没有找到这款游戏</div><div class="state-copy">可以尝试中文名、英文名或常用别名。</div><button class="secondary-btn" data-action="clear-search">清空搜索</button></div>`;
      } else {
        listContent = `<div id="game-grid" class="state-panel"><div class="state-orb">${icon('device')}</div><div class="state-title">暂无当前设备兼容数据</div><div class="state-copy">不是设备不兼容，只是暂时没有可用于判断的记录。</div><button class="secondary-btn" data-action="retry-games">重新加载</button></div>`;
      }
      root.innerHTML = `<div class="safe-page">
        <header class="topbar"><span></span><h1 class="topbar-title">适合本机</h1><span></span></header>
        <div class="discovery-tools">
          <div class="search-wrap ${searching ? 'has-value' : ''}">${icon('search').replace('<svg','<svg class="search-icon"')}<input id="game-search" class="search-input" value="${escapeHtml(state.query)}" placeholder="搜索想玩的游戏" autocomplete="off"><button class="search-clear" data-action="clear-search" aria-label="清空搜索">×</button></div>
          ${renderDeviceCard()}
        </div>
        <div class="section-head"><div><h2 class="section-title">${searching ? '搜索结果' : '这台设备可以玩的游戏'}</h2><p class="section-sub">${searching ? '按当前设备匹配程度排序' : '来自真实运行数据与玩家验证'}</p></div><span class="result-count">${games.length} 款</span></div>
        ${listContent}
      </div>`;
    }
    function renderHeroCover(game) {
      return `<div class="cover hero-cover" style="--cover:${coverStyle(game)}"><span class="cover-symbol">${escapeHtml(game.symbol)}</span><span class="store-chip">${escapeHtml(game.store)}</span></div>`;
    }
    function renderPlan(game) {
      const plan = game.plan;
      const recommendedSettings = plan.fullConfig.slice(0,3).map(([key,value]) => `${key} ${value}`).join(' · ') || '使用当前方案默认设置';
      const knownIssues = plan.knownIssues.length ? plan.knownIssues.join('；') : '暂无影响游玩的已知问题';
      const steps = plan.steps.length
        ? `<ol class="steps">${plan.steps.slice(0,3).map((step,index) => `<li class="step"><span class="step-index">${index + 1}</span><div><strong>${escapeHtml(step.title)}</strong><p>${escapeHtml(step.description)}</p></div></li>`).join('')}</ol>`
        : `<p class="issue-note">当前没有可承诺成功的运行步骤。</p>`;
      return `<section class="module">
        <div class="module-head"><div><h2 class="module-title">推荐运行方案</h2><p class="module-caption">适用于 ${escapeHtml(plan.applicableTo || '当前环境')}</p></div><span class="version-tag">v${escapeHtml(plan.version || '—')}</span></div>
        <div class="plan-layout"><div><div class="plan-result"><span>预计结果</span><strong>${escapeHtml(plan.expectedResult || '暂无可靠预估')}</strong></div><div class="plan-notes"><div class="plan-note"><span>推荐设置</span><strong>${escapeHtml(recommendedSettings)}</strong></div><div class="plan-note"><span>已知问题</span><strong>${escapeHtml(knownIssues)}</strong></div></div>${steps}</div>
        <div><div class="data-row"><div class="data-cell"><strong>${plan.verifiedUsers || 0}</strong><span>有效验证人数</span></div><div class="data-cell"><strong>${game.evidence.validRuns}</strong><span>有效运行</span></div><div class="data-cell"><strong>${game.evidence.reviewCount}</strong><span>玩家评价</span></div></div>
        <button id="primary-action" class="primary-action ${['not_recommended','unknown'].includes(game.result.status) ? 'is-neutral' : ''} ${state.actionState === 'done' ? 'is-done' : ''} ${state.actionState === 'loading' ? 'is-loading' : ''} ${state.actionState === 'error' ? 'is-error' : ''}" data-action="primary" ${state.actionState === 'loading' ? 'disabled' : ''}>${escapeHtml(primaryButtonText(game))}</button></div></div>
      </section>`;
    }
    function primaryButtonText(game) {
      if (state.actionState !== 'idle' && state.actionMessage) return state.actionMessage;
      return resolvePrimaryAction(game);
    }
    function renderTroubleshooting(game) {
      const issueKey = state.issueKey;
      const steps = issueKey ? (game.troubleshooting[issueKey] || ['确认游戏文件和当前方案版本一致。','关闭游戏后重新载入推荐方案。']) : [];
      const fallback = issueKey && !game.troubleshooting[issueKey];
      return `<section id="troubleshooting" class="module"><div class="module-head"><div><h2 class="module-title">没有成功运行？</h2><p class="module-caption">选择遇到的问题，按顺序检查</p></div></div>
        <div class="issue-list">${Object.entries(issueLabels).map(([key,label]) => `<button class="issue-chip ${issueKey === key ? 'is-active' : ''}" data-issue-key="${key}">${label}</button>`).join('')}</div>
        <div class="issue-body ${issueKey ? 'is-visible' : ''}">${issueKey ? `<div class="issue-body-title">${issueLabels[issueKey]}处理步骤</div><ol class="issue-steps">${steps.map((step) => `<li>${escapeHtml(step)}</li>`).join('')}</ol>${fallback ? '<p class="issue-note">暂无针对当前设备的验证结果</p>' : ''}` : ''}</div>
      </section>`;
    }
    function renderReviews(game) {
      return `<details class="module" ${state.expanded.reviews ? 'open' : ''} data-details-key="reviews"><summary><div><div class="module-title">玩家评价</div><div class="module-caption">${game.reviews.length} 条与当前环境相关</div></div>${icon('chevron')}</summary>
        <div class="details-body">${game.reviews.length ? game.reviews.map((review) => `<article class="review"><div class="review-head"><span class="review-user">${escapeHtml(review.user)} · ${escapeHtml(review.duration)}</span><span class="review-score">${'★'.repeat(review.score)}${'☆'.repeat(5-review.score)}</span></div><p>${escapeHtml(review.text)}</p></article>`).join('') : '<p class="state-copy">暂无玩家评价</p>'}</div></details>`;
    }
    function renderConfig(game) {
      return `<details class="module" ${state.expanded.config ? 'open' : ''} data-details-key="config"><summary><div><div class="module-title">完整配置</div><div class="module-caption">用于验证和复现，默认收起</div></div>${icon('chevron')}</summary><div class="details-body"><table class="config-table"><tbody>${game.plan.fullConfig.map(([key,value]) => `<tr><td>${escapeHtml(key)}</td><td>${escapeHtml(value)}</td></tr>`).join('')}<tr><td>方案内核</td><td>${escapeHtml(game.plan.kernelVersion || '未确认')}</td></tr><tr><td>游戏版本</td><td>${escapeHtml(game.gameVersion)}</td></tr></tbody></table></div></details>`;
    }
    function renderDetail() {
      const root = document.getElementById('detail-view');
      const game = state.games.find((item) => item.id === state.selectedGameId);
      if (!game) {
        root.innerHTML = `<div class="detail-page"><header class="detail-topbar"><button class="icon-btn" data-action="back" aria-label="返回">${icon('back')}</button><div class="title">运行详情</div><span></span></header><div class="state-panel"><div class="state-orb">${icon('alert')}</div><div class="state-title">游戏数据已失效</div><div class="state-copy">游戏可能已下架或数据刚刚更新，请返回重新查找。</div><button class="secondary-btn" data-action="back">返回适合本机</button></div></div>`;
        return;
      }
      const status = gameStatus(game);
      const realDataCells = game.result.status === 'not_recommended'
        ? `<div class="data-cell"><strong>${game.evidence.validUsers}</strong><span>问题样本用户</span></div><div class="data-cell"><strong>${game.evidence.attempts}</strong><span>启动尝试</span></div><div class="data-cell"><strong>${game.evidence.launchFailureRate}%</strong><span>启动失败率</span></div>`
        : `<div class="data-cell"><strong>${game.evidence.validUsers}</strong><span>有效玩家</span></div><div class="data-cell"><strong>${game.evidence.validRuns}</strong><span>有效运行</span></div><div class="data-cell"><strong>${game.performance.medianFps || '—'}</strong><span>FPS 中位数</span></div>`;
      root.innerHTML = `<div class="detail-page"><header class="detail-topbar"><button class="icon-btn" data-action="back" aria-label="返回">${icon('back')}</button><div class="title">运行详情</div><span></span></header>
        <div class="detail-content">
          <div class="detail-column"><section class="hero">${renderHeroCover(game)}<div class="hero-copy"><h1 class="hero-name">${escapeHtml(game.name)}</h1><div class="hero-store">${escapeHtml(game.store)} · ${escapeHtml(game.gameVersion)}</div><div class="decision-row"><span class="decision-badge ${status.className}">${status.label}</span><span class="proof-badge">${evidenceMap[game.evidence.level]}</span></div><p class="decision-reason">${escapeHtml(game.result.reason)}</p></div></section>
            <div class="performance-strip"><div class="metric"><strong>${formatFps(game)}</strong><span>预计表现</span></div><div class="metric"><strong>${game.performance.medianSessionMinutes ? `${game.performance.medianSessionMinutes} 分钟` : '暂无'}</strong><span>${game.result.status === 'not_recommended' ? '失败记录时长中位数' : '运行时长中位数'}</span></div><div class="metric"><strong>${formatDate(game.evidence.updatedAt)}</strong><span>数据更新</span></div></div>
            <section class="module"><div class="module-head"><div><h2 class="module-title">真实运行数据</h2><p class="module-caption">有效运行已过滤超短会话；失败记录单独统计</p></div></div><div class="data-row">${realDataCells}</div></section>
          </div>
          <div class="detail-column">${renderPlan(game)}${renderTroubleshooting(game)}${renderReviews(game)}${renderConfig(game)}</div>
        </div></div>`;
    }
    function render() {
      const discovery = document.getElementById('discovery-view');
      const detail = document.getElementById('detail-view');
      discovery.classList.toggle('is-active', state.view === 'discovery');
      detail.classList.toggle('is-active', state.view === 'detail');
      if (state.view === 'discovery') renderDiscovery(); else renderDetail();
    }
    function openSelectedGame(gameId) {
      if (state.context?.status !== 'ready') { state.view = 'discovery'; render(); return; }
      if (!state.games.some((game) => game.id === gameId)) return;
      state.selectedGameId = gameId; state.view = 'detail'; state.issueKey = null; state.actionState = 'idle';
      render(); document.getElementById('detail-view').scrollTop = 0;
    }
    function setActionState(actionState, actionMessage) {
      state.actionState = actionState; state.actionMessage = actionMessage; renderDetail();
    }
    async function runBridgeAction(methodName, payload, loadingMessage, successMessage, fallbackMessage) {
      clearTimeout(actionTimer);
      setActionState('loading', loadingMessage);
      const method = window.GameHubBridge?.[methodName];
      if (typeof method !== 'function') {
        actionTimer = setTimeout(() => setActionState('done', fallbackMessage), 550);
        return;
      }
      try {
        const result = method(payload);
        if (result && typeof result.then === 'function') {
          await Promise.race([result, new Promise((_, reject) => { actionTimer = setTimeout(() => reject(new Error('timeout')), 8000); })]);
          clearTimeout(actionTimer);
          setActionState('done', successMessage);
        } else {
          actionTimer = setTimeout(() => setActionState('error', '操作超时，点击重试'), 8000);
        }
      } catch (error) {
        clearTimeout(actionTimer);
        setActionState('error', '操作失败，点击重试');
      }
    }
    async function performPrimaryAction(game) {
      const label = resolvePrimaryAction(game);
      if (label === '查看其他可玩游戏') { state.view = 'discovery'; state.query = ''; render(); return; }
      if (label === '查看已有记录') {
        state.expanded.reviews = true; state.actionState = 'done'; state.actionMessage = '已展开现有记录'; render();
        requestAnimationFrame(() => document.querySelector('[data-details-key="reviews"]')?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
        return;
      }
      if (label === '使用方案并启动') {
        await runBridgeAction('applyPlanAndLaunch', { gameId: game.id, planId: game.plan.id }, '正在应用方案…', '已提交给 App，正在启动', '方案已载入，可启动游戏');
      } else if (label === '使用方案并下载') {
        await runBridgeAction('applyPlanAndDownload', { gameId: game.id, planId: game.plan.id }, '正在应用方案…', '已提交给 App 下载', '方案已载入，模拟下载中');
      } else {
        await runBridgeAction('openGameDetail', { gameId: game.id, store: game.store }, '正在打开详情…', '已提交给 App', '已模拟打开游戏详情');
      }
    }

    window.GameHubCompatibility = {
      setContext(context) { state.context = normalizeContext(context); render(); },
      setGames(games) {
        state.games = Array.isArray(games) ? games.map(normalizeGame) : [];
        state.dataStatus = 'ready';
        if (state.view === 'detail' && !state.games.some((game) => game.id === state.selectedGameId)) { state.view = 'discovery'; state.selectedGameId = null; }
        render();
      },
      setGamesLoading() { state.dataStatus = 'loading'; state.view = 'discovery'; render(); },
      setGamesError() { state.dataStatus = 'error'; state.view = 'discovery'; render(); },
      openGame(gameId) { openSelectedGame(gameId); },
      setContextUnavailable() { state.context = { status: 'unavailable' }; state.view = 'discovery'; render(); },
      setActionResult(result = {}) {
        clearTimeout(actionTimer);
        if (result.status === 'error') setActionState('error', safeString(result.message, '操作失败，点击重试'));
        else setActionState('done', safeString(result.message, '操作已完成'));
      }
    };

    document.addEventListener('input', (event) => {
      if (event.target.id !== 'game-search') return;
      state.query = event.target.value; renderDiscovery();
      const input = document.getElementById('game-search'); input.focus(); input.setSelectionRange(input.value.length, input.value.length);
    });
    document.addEventListener('toggle', (event) => {
      const key = event.target.dataset?.detailsKey;
      if (key) state.expanded[key] = event.target.open;
    }, true);
    document.addEventListener('click', (event) => {
      const gameCard = event.target.closest('[data-game-id]');
      if (gameCard) { openSelectedGame(gameCard.dataset.gameId); return; }
      const issue = event.target.closest('[data-issue-key]');
      if (issue) { state.issueKey = issue.dataset.issueKey; renderDetail(); return; }
      const orientation = event.target.closest('[data-orientation-value]');
      if (orientation) {
        state.orientation = orientation.dataset.orientationValue;
        document.querySelector('.preview-frame').dataset.orientation = state.orientation;
        document.querySelector('.app-shell').dataset.orientation = state.orientation;
        document.querySelectorAll('[data-orientation-value]').forEach((button) => button.classList.toggle('is-active', button.dataset.orientationValue === state.orientation));
        return;
      }
      const contextButton = event.target.closest('[data-context-state]');
      if (contextButton) {
        const status = contextButton.dataset.contextState;
        state.context = status === 'ready' ? { ...readyContext } : { status };
        state.view = 'discovery';
        document.querySelectorAll('[data-context-state]').forEach((button) => button.classList.toggle('is-active', button.dataset.contextState === status));
        render(); return;
      }
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (!action) return;
      if (action === 'toggle-device') { state.expanded.device = !state.expanded.device; renderDiscovery(); }
      if (action === 'clear-search') { state.query = ''; renderDiscovery(); }
      if (action === 'retry-context') { state.context = { status: 'loading' }; render(); setTimeout(() => { state.context = { ...readyContext }; render(); }, 700); }
      if (action === 'retry-games') {
        state.dataStatus = 'loading'; renderDiscovery();
        if (typeof window.GameHubBridge?.reloadCompatibility === 'function') window.GameHubBridge.reloadCompatibility();
        else setTimeout(() => { state.games = mockGames.map(normalizeGame); state.dataStatus = 'ready'; renderDiscovery(); }, 700);
      }
      if (action === 'back') { state.view = 'discovery'; state.actionState = 'idle'; render(); }
      if (action === 'primary') {
        const game = state.games.find((item) => item.id === state.selectedGameId);
        if (game) performPrimaryAction(game);
      }
    });

    const requestedGame = new URLSearchParams(location.search).get('game_id');
    state.games = state.games.map(normalizeGame);
    if (requestedGame && state.games.some((game) => game.id === requestedGame)) openSelectedGame(requestedGame); else render();
  </script>
</body>
</html>
