<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>盖世游戏｜游戏兼容性</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #000000;
      --bg-card: #1a1a1a;
      --bg-elevated: #252525;
      --bg-overlay: #28202a;
      --text-primary: #ffffff;
      --text-secondary: #e6e6e6;
      --text-tertiary: #f2f2f2;
      --text-muted: #7b7b7b;
      --text-disabled: #646464;
      --brand-gold: #ffcc43;
      --brand-gold-light: #ffd98f;
      --brand-green: #33d8a4;
      --brand-blue: #338feb;
      --border-default: #353d4e;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-2xl: 20px;
      --radius-full: 100px;
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-number: "D-DIN-PRO", "MiSans VF", sans-serif;
    }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-primary);
      background:
        radial-gradient(circle at 24% 0%, rgba(255, 204, 67, .08), transparent 26rem),
        #0d0e10;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button {
      border: 0;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 2px;
    }
    img { display: block; }
    .workbench {
      min-height: 100vh;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 12px;
      padding: 20px;
    }
    .demo-bar {
      width: min(1120px, calc(100vw - 40px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #c7c8cc;
      font-size: 13px;
    }
    .demo-name, .demo-toolbar, .demo-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo-toolbar { flex-wrap: wrap; justify-content: flex-end; }
    .demo-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: var(--brand-gold);
      color: #17130a;
      font-weight: 760;
      letter-spacing: -.4px;
    }
    .demo-controls {
      padding: 3px;
      border: 1px solid #2e3035;
      border-radius: 10px;
      background: rgba(24, 25, 28, .92);
    }
    .control {
      min-width: 66px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 7px;
      background: transparent;
      color: #8f9198;
      font-size: 12px;
      transition: background .18s ease, color .18s ease;
    }
    .control:hover { color: #fff; }
    .control.active {
      background: #32343a;
      color: var(--brand-gold);
    }
    .frame {
      position: relative;
      width: min(1120px, calc(100vw - 40px));
      height: min(810px, calc(100vh - 92px));
      overflow: hidden;
      border: 1px solid #303238;
      border-radius: var(--radius-2xl);
      background: var(--bg-primary);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .48);
      transition: width .22s ease, height .22s ease, border-radius .22s ease;
    }
    .frame[data-preview="mobile"] {
      width: 390px;
      height: 844px;
      max-width: calc(100vw - 28px);
      max-height: calc(100vh - 86px);
    }
    .app {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      background:
        radial-gradient(circle at 90% -8%, rgba(255, 204, 67, .12), transparent 19rem),
        var(--bg-primary);
      scrollbar-width: none;
    }
    .app::-webkit-scrollbar { display: none; }
    .page {
      width: min(100%, 1120px);
      min-height: 100%;
      margin: 0 auto;
      padding: 28px;
    }
    .page-header { position: relative; padding-bottom: 22px; }
    .header-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .back-button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 10px 0 0;
      background: transparent;
      color: var(--text-secondary);
      text-align: left;
      font-size: 14px;
    }
    .back-button:hover { color: var(--brand-gold); }
    .platform-pill, .platform-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 11px;
      border: 1px solid rgba(255, 204, 67, .34);
      border-radius: var(--radius-full);
      background: rgba(255, 204, 67, .1);
      color: var(--brand-gold-light);
      font-size: 12px;
      font-weight: 520;
      letter-spacing: .2px;
    }
    .page-header h1 {
      font-size: 32px;
      font-weight: 620;
      line-height: 42px;
      letter-spacing: -.8px;
    }
    .page-header > p {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 20px;
    }
    .filter-panel {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid var(--border-default);
      border-radius: 22px;
      background: var(--bg-card);
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .filter-select { position: relative; min-width: 0; }
    .filter-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .filter-control { position: relative; display: flex; }
    .filter-control > [data-filter-trigger] {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 44px 0 14px;
      border: 1px solid var(--border-default);
      border-radius: 14px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      text-align: left;
    }
    .filter-control > [data-filter-trigger] strong {
      min-width: 0;
      overflow: hidden;
      font-weight: 520;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .filter-chevron {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: #a8acb4;
      transition: transform 160ms ease, color 160ms ease;
    }
    .filter-select.open .filter-chevron { transform: rotate(180deg); color: #e0e2e6; }
    .filter-control:not(.has-selection) > [data-filter-trigger] { padding-right: 14px; }
    .filter-clear {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
    }
    .filter-menu {
      position: absolute;
      z-index: 30;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      padding: 10px;
      border: 1px solid var(--border-default);
      border-radius: 16px;
      background: #171717;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    }
    .filter-menu input {
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      border: 1px solid var(--border-default);
      border-radius: 12px;
      background: #0f0f0f;
      color: var(--text-primary);
    }
    .filter-options { max-height: 280px; margin-top: 8px; overflow-y: auto; }
    .filter-option {
      width: 100%;
      min-height: 54px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text-primary);
      text-align: left;
    }
    .filter-option:hover, .filter-option:focus-visible { background: rgba(255, 255, 255, .06); }
    .filter-option span { min-width: 0; display: grid; gap: 3px; }
    .filter-option small, .filter-option em {
      color: var(--text-muted);
      font-size: 12px;
      font-style: normal;
    }
    .filter-option-cover { width: 42px; height: 56px; object-fit: cover; border-radius: 7px; }
    .filter-empty { padding: 18px 8px; color: var(--text-muted); text-align: center; }
    .filter-summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .filter-summary button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 8px;
      background: transparent;
      color: var(--brand-gold);
      font-size: 12px;
    }
    .query-prompt, .no-results {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 230px;
      margin-top: 16px;
      padding: 30px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      text-align: center;
    }
    .query-prompt h2, .no-results h2 {
      font-size: 20px;
      font-weight: 560;
      line-height: 28px;
    }
    .query-prompt p, .no-results p {
      max-width: 440px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 20px;
    }
    .no-results button {
      min-height: 44px;
      margin-top: 8px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      background: var(--brand-gold);
      color: #16120a;
      font-size: 13px;
      font-weight: 620;
    }
    .record-results { margin-top: 16px; }
    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .result-heading h2 { font-size: 20px; font-weight: 560; line-height: 28px; }
    .result-heading strong {
      color: var(--brand-gold-light);
      font-size: 13px;
      font-weight: 520;
      white-space: nowrap;
    }
    .record-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-default);
      border-radius: 18px;
      background: var(--bg-card);
    }
    .record-table {
      width: 100%;
      min-width: 1180px;
      border-collapse: collapse;
      font-size: 12px;
    }
    .record-table th, .record-table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-default);
      vertical-align: top;
      text-align: left;
    }
    .record-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #181818;
      color: var(--text-muted);
      font-weight: 520;
      white-space: nowrap;
    }
    .record-table tbody tr:last-child td { border-bottom: 0; }
    .record-table th button {
      min-width: 44px;
      min-height: 44px;
      margin: -12px -10px;
      padding: 0 10px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 520;
    }
    .record-table th button:hover { color: var(--brand-gold); }
    .record-table th:last-child, .record-table td:last-child {
      position: sticky;
      right: 0;
      min-width: 64px;
      background: #181818;
      box-shadow: -10px 0 18px rgba(0, 0, 0, .28);
    }
    .record-table th:last-child { z-index: 3; }
    .record-table td:last-child { z-index: 2; background: var(--bg-card); }
    .record-game {
      min-width: 170px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .record-cover {
      width: 44px;
      height: 60px;
      flex: 0 0 auto;
      border-radius: 8px;
      object-fit: cover;
    }
    .record-game span { min-width: 0; display: grid; gap: 4px; }
    .record-game strong { font-weight: 560; line-height: 18px; }
    .record-game small {
      overflow: hidden;
      color: var(--text-muted);
      line-height: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rating { white-space: nowrap; color: var(--brand-gold); letter-spacing: 1px; }
    .rating i { color: #454545; font-style: normal; }
    .record-tag {
      display: inline-flex;
      margin: 0 4px 4px 0;
      padding: 4px 7px;
      border-radius: var(--radius-full);
      background: rgba(255, 204, 67, .12);
      color: var(--brand-gold);
      line-height: 16px;
      white-space: nowrap;
    }
    .record-notes { min-width: 150px; color: var(--text-secondary); line-height: 18px; }
    .record-cards { display: none; gap: 12px; }
    .record-card {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--border-default);
      border-radius: 18px;
      background: var(--bg-card);
    }
    .record-card-head, .record-primary, .record-card footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .record-card-head { align-items: flex-start; }
    .record-card .record-game { min-width: 0; flex: 1 1 auto; }
    .record-primary {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-default);
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 19px;
    }
    .record-primary > span { min-width: 0; }
    .record-primary > strong { flex: 0 0 auto; color: var(--brand-gold); }
    .record-card dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .record-card dl div { min-width: 0; padding: 9px; border-radius: 10px; background: var(--bg-elevated); }
    .record-card dt { color: var(--text-muted); font-size: 11px; line-height: 16px; }
    .record-card dd {
      margin: 4px 0 0;
      overflow-wrap: anywhere;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 18px;
    }
    .record-tags { margin-top: 12px; }
    .record-card > p { margin-top: 7px; color: var(--text-secondary); font-size: 12px; line-height: 18px; }
    .record-card footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-default);
      color: var(--text-muted);
      font-size: 11px;
    }
    [data-config-open] {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid rgba(255, 204, 67, .34);
      border-radius: var(--radius-md);
      background: rgba(255, 204, 67, .1);
      color: var(--brand-gold-light);
      font-size: 12px;
      white-space: nowrap;
    }
    .no-config { color: var(--text-disabled); white-space: nowrap; }
    .config-viewer-backdrop {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .72);
    }
    .config-viewer-panel {
      width: min(760px, 100%);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-default);
      border-radius: 24px;
      background: #151515;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .6);
    }
    .config-viewer-panel > header {
      min-height: 72px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-default);
    }
    .config-viewer-panel > header button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 20px;
    }
    .config-viewer-panel > header button:hover { color: var(--brand-gold); }
    .config-viewer-panel > header div { min-width: 0; }
    .config-viewer-panel > header span { color: var(--brand-gold); font-size: 12px; }
    .config-viewer-panel > header h2 {
      margin: 3px 0 0;
      overflow: hidden;
      font-size: 20px;
      font-weight: 560;
      line-height: 27px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .config-choice-list {
      display: flex;
      max-width: 100%;
      gap: 8px;
      padding: 12px 16px 0;
      overflow-x: auto;
    }
    .config-choice-list button {
      min-height: 44px;
      flex: 0 0 auto;
      padding: 0 14px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-full);
      background: var(--bg-elevated);
      color: var(--text-muted);
    }
    .config-choice-list button.active { border-color: var(--brand-gold); color: var(--brand-gold); }
    .config-viewer-body { min-height: 0; padding: 16px; overflow-y: auto; }
    .config-viewer-body .config-detail { padding: 0; border-top: 0; }
    .config-detail {
      padding: 0 14px 14px;
      border-top: 1px solid #2e2f33;
    }
    .config-summary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
    }
    .config-summary strong {
      color: var(--brand-gold-light);
      font-size: 14px;
      line-height: 20px;
    }
    .config-summary span { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
    .config-applicability {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 204, 67, .14);
      border-radius: var(--radius-md);
      background: rgba(255, 204, 67, .045);
    }
    .config-applicability > strong {
      display: block;
      margin-bottom: 9px;
      color: var(--brand-gold-light);
      font-size: 12px;
      font-weight: 520;
    }
    .config-applicability-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .config-applicability-grid div { display: grid; gap: 4px; min-width: 0; }
    .config-applicability-grid span { color: var(--text-muted); font-size: 10px; line-height: 14px; }
    .config-applicability-grid b {
      overflow-wrap: anywhere;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 520;
      line-height: 17px;
    }
    .config-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .config-field {
      display: grid;
      gap: 5px;
      min-height: 68px;
      padding: 11px 12px;
      border-radius: var(--radius-md);
      background: #242426;
    }
    .config-field strong {
      overflow-wrap: anywhere;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 520;
      line-height: 18px;
    }
    .config-meta {
      margin: 12px 0;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 16px;
    }
    .download-button {
      width: 100%;
      min-height: 48px;
      border-radius: var(--radius-md);
      background: var(--brand-gold);
      color: #16120a;
      font-size: 14px;
      font-weight: 620;
      box-shadow: 0 8px 20px rgba(255, 204, 67, .15);
    }
    .download-button:hover { background: #ffd45f; }
    .download-button:active { transform: translateY(1px); }
    .download-message {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      font-size: 12px;
      line-height: 17px;
    }
    .download-message.pending { background: rgba(51, 143, 235, .12); color: #7fc1ff; }
    .download-message.success { background: rgba(51, 216, 164, .1); color: var(--brand-green); }
    .download-message.error { background: rgba(255, 86, 120, .1); color: #ff8ba2; }
    .state-card {
      display: grid;
      place-items: center;
      min-height: 220px;
      margin-top: 18px;
      padding: 32px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      text-align: center;
    }
    .state-card h2, .state-card h3 { font-size: 20px; font-weight: 520; }
    .state-card p {
      max-width: 360px;
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 19px;
    }
    .state-card button {
      min-height: 44px;
      margin-top: 16px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      background: var(--brand-gold);
      color: #16120a;
      font-size: 13px;
      font-weight: 620;
    }
    .empty-subcard {
      padding: 24px 18px;
      border: 1px solid #303136;
      border-radius: var(--radius-lg);
      background: #1b1b1d;
      text-align: center;
    }
    .empty-subcard h3 { font-size: 16px; font-weight: 520; }
    .empty-subcard p { margin-top: 5px; color: var(--text-muted); font-size: 12px; line-height: 17px; }
    .cover-fallback {
      display: grid;
      place-items: center;
      background: #252528;
      color: var(--brand-gold);
      font-size: 11px;
      text-align: center;
    }
    .record-table tbody tr[data-record-open] { cursor: pointer; }
    .record-table tbody tr[data-record-open]:hover { background: rgba(255, 255, 255, .025); }
    .compatibility-status {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 560;
      line-height: 20px;
      white-space: nowrap;
    }

          recordId: "mac_starfield",
          name: "M4 Max 实验方案",
          version: "0.9",
          shareCode: "MjQ4OTg=",
          fileName: "starfield-mac-m4max.gamehub.json",
          fileSize: "16 KB",
          downloadCount: 86,
          updatedAt: "2026-08-07",
          summary: "Apple M4 Max · 24～32 FPS",
          applicability: {
            gameVersion: "1.15.216",
            hardware: "Apple M4 Max",
            systemRange: "macOS 15～26"
          },
          fields: [
            ["显示模式", "1728 × 1117"],
            ["画质", "低"],
            ["兼容层", "Game Porting Toolkit 2"],
            ["帧率上限", "30 FPS"]
          ]
        }
      ]
    };

    let catalog = { games: [], hardware: [], records: [], configs: [] };
    let copyFeedbackTimer = 0;
    let viewerReturnFocusRecordId = null;
    let viewerScrollTop = 0;

    function text(value, max = 100) {
      return String(value == null ? "" : value).trim().slice(0, max);
    }

    function esc(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function number(value, min = 0, max = Number.MAX_SAFE_INTEGER) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return min;
      return Math.min(max, Math.max(min, parsed));
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("zh-CN").format(number(value));
    }

    function normalizePlatform(value) {
      const normalized = text(value, 16).toLowerCase();
      return normalized === "android" || normalized === "mac" ? normalized : null;
    }

    function containsCrossPlatformConfig(platform, values) {
      const joined = values.flat(Infinity).map((value) => text(value, 120)).join(" ");
      const forbidden = platform === "android"
        ? /macOS|Apple|MacBook|Mac mini|Mac Studio|Game Porting Toolkit/i
        : /Android|Adreno|骁龙|Snapdragon|手机|Wine/i;
      return forbidden.test(joined);
    }

    function queryPlatform() {
      return normalizePlatform(new URLSearchParams(location.search).get("platform"));
    }

    function resolvePlatform(context) {
      const bridgePlatform = normalizePlatform(context && context.platform);
      if (bridgePlatform) return { platform: bridgePlatform, source: "bridge" };
      const queryValue = queryPlatform();
      if (queryValue) return { platform: queryValue, source: "query" };
      return { platform: "android", source: "demo" };
    }

    function uniqueById(items) {
      const seen = new Set();
      return items.filter((item) => {
        if (!item || !item.id || seen.has(item.id)) return false;
        seen.add(item.id);
        return true;
      });
    }

    function normalizeSettingItems(items, allowChildren = true) {
      return (Array.isArray(items) ? items : []).map((item) => {
        if (!item || typeof item !== "object") return null;
        const label = text(item.label, 80);
        const value = text(item.value, 160);
        if (!label || !value) return null;
        return {
          label,
          description: text(item.description, 160),
          value,
          children: allowChildren ? normalizeSettingItems(item.children, false).slice(0, 20) : []
        };
      }).filter(Boolean).slice(0, 24);
    }

    function normalizeSettingSections(sections) {
      return (Array.isArray(sections) ? sections : []).map((section) => {
        if (!section || typeof section !== "object") return null;
        const title = text(section.title, 30);
        const items = normalizeSettingItems(section.items);
        return title && items.length ? { title, items } : null;
      }).filter(Boolean).slice(0, 6);
    }

    function normalizeCatalog(raw = {}) {
      const games = uniqueById((Array.isArray(raw.games) ? raw.games : []).map((item) => {
        if (!item || typeof item !== "object") return null;
        const id = text(item.id, 60);
        const name = text(item.name, 60);
        const platforms = [...new Set((Array.isArray(item.platforms) ? item.platforms : [])
          .map(normalizePlatform).filter(Boolean))];
        if (!id || !name || platforms.length === 0) return null;
        const coverKey = text(item.coverKey, 80);
        return {
          id,
          name,
          englishName: text(item.englishName, 80),
          aliases: (Array.isArray(item.aliases) ? item.aliases : [])
            .map((value) => text(value, 50)).filter(Boolean),
          coverKey: allowedCovers.has(coverKey) ? coverKey : "",
          platforms,
          popularOn: (Array.isArray(item.popularOn) ? item.popularOn : [])
            .map(normalizePlatform).filter((platform) => platforms.includes(platform))
        };
      }).filter(Boolean));

      const hardware = uniqueById((Array.isArray(raw.hardware) ? raw.hardware : []).map((item) => {
        if (!item || typeof item !== "object") return null;
        const id = text(item.id, 60);
        const platform = normalizePlatform(item.platform);
        const type = text(item.type, 16);
        const displayName = text(item.displayName, 80);
        if (!id || !platform || !["device", "gpu", "model", "chip"].includes(type) || !displayName) {
          return null;
        }
        return {
          id,
          platform,
          type,
          displayName,
          aliases: (Array.isArray(item.aliases) ? item.aliases : [])
            .map((value) => text(value, 60)).filter(Boolean),
          subtitle: text(item.subtitle, 100)
        };
      }).filter(Boolean));

      const hardwareById = new Map(hardware.map((item) => [item.id, item]));
      const gameIds = new Set(games.map((game) => game.id));
      const records = uniqueById((Array.isArray(raw.records) ? raw.records : []).map((item) => {
        if (!item || typeof item !== "object") return null;
        const platform = normalizePlatform(item.platform);
        const gameId = text(item.gameId, 60);
        if (!platform || !gameIds.has(gameId)) return null;
        const game = games.find((candidate) => candidate.id === gameId);
        if (!game.platforms.includes(platform)) return null;
        const hardwareIds = [...new Set((Array.isArray(item.hardwareIds) ? item.hardwareIds : [])
          .map((value) => text(value, 60))
          .filter((id) => hardwareById.get(id)?.platform === platform))];
        if (hardwareIds.length === 0) return null;
        const source = item.environment && typeof item.environment === "object" ? item.environment : {};
        const environment = platform === "android"
          ? {
              deviceModel: text(source.deviceModel),
              soc: text(source.soc),
              mobileGpu: text(source.mobileGpu),
              androidVersion: text(source.androidVersion),
              appVersion: text(source.appVersion)
            }
          : {
              macModel: text(source.macModel),
              appleChip: text(source.appleChip),
              macosVersion: text(source.macosVersion),
              appVersion: text(source.appVersion),
              compatibilityLayer: text(source.compatibilityLayer),
              displayMode: text(source.displayMode)
            };
        const rating = number(item.rating, 1, 5);
        const compatibilityStatus = COMPATIBILITY_STATUSES.includes(text(item.compatibilityStatus, 20))
          ? text(item.compatibilityStatus, 20)
          : rating >= 5 ? "完美兼容" : rating >= 3 ? "基本可玩" : "不可玩";
        return {
          id: text(item.id, 60),
          platform,
          gameId,
          hardwareIds,
          gameVersion: text(item.gameVersion, 40) || "未记录",
          verdict: text(item.verdict, 40),
          rating,
          compatibilityStatus,
          avgFps: number(item.avgFps, 0, 240),
          verifiedAt: /^\d{4}-\d{2}-\d{2}$/.test(text(item.verifiedAt, 10))
            ? text(item.verifiedAt, 10) : "未记录",
          tags: (Array.isArray(item.tags) ? item.tags : [])
            .map((value) => text(value, 30)).filter(Boolean).slice(0, 4),
          notes: text(item.notes, 180) || "—",
          configIds: (Array.isArray(item.configIds) ? item.configIds : [])
            .map((value) => text(value, 60)).filter(Boolean),
          environment
        };
      }).filter(Boolean));

      const recordById = new Map(records.map((record) => [record.id, record]));
      const configs = uniqueById((Array.isArray(raw.configs) ? raw.configs : []).map((item) => {
        if (!item || typeof item !== "object") return null;
        const platform = normalizePlatform(item.platform);
        const gameId = text(item.gameId, 60);
        if (!platform || !gameIds.has(gameId)) return null;
        const game = games.find((candidate) => candidate.id === gameId);
        if (!game.platforms.includes(platform)) return null;
        const id = text(item.id, 60);
        if (!id) return null;
        const shareCode = text(item.shareCode, 200);
        if (!shareCode) return null;
        const recordId = text(item.recordId, 60);
        const record = recordById.get(recordId);
        if (!record || record.platform !== platform || record.gameId !== gameId) return null;
        const fields = (Array.isArray(item.fields) ? item.fields : [])
          .filter((pair) => Array.isArray(pair) && pair.length === 2)
          .map(([label, value]) => [text(label, 30), text(value, 80)])
          .filter(([label, value]) => label && value)
          .slice(0, 6);
        const settingSections = normalizeSettingSections(item.settingSections);
        const sourceApplicability = item.applicability && typeof item.applicability === "object"
          ? item.applicability : {};
        const applicability = {
          gameVersion: text(sourceApplicability.gameVersion, 40) || "未记录",
          hardware: text(sourceApplicability.hardware, 60) || "未记录",
          systemRange: text(sourceApplicability.systemRange, 60) || "未记录"
        };
        const summary = text(item.summary, 120);
        if (containsCrossPlatformConfig(
          platform,
          [summary, ...Object.values(applicability), ...fields.flat(), ...settingSections.flatMap((section) =>
            section.items.flatMap((setting) => [
              setting.label,
              setting.description,
              setting.value,
              ...setting.children.flatMap((child) => [child.label, child.description, child.value])
            ])
          )]
        )) return null;
        return {
          id,
          platform,
          gameId,
          recordId,
          name: text(item.name, 80),
          version: text(item.version, 30),
          shareCode,
          fileName: text(item.fileName, 100),
          fileSize: text(item.fileSize, 30),
          downloadCount: number(item.downloadCount),
          updatedAt: text(item.updatedAt, 10),
          summary,
          applicability,
          fields,
          settingSections
        };
      }).filter(Boolean));

      const validConfigs = configs.filter((config) =>
        recordById.get(config.recordId)?.configIds.includes(config.id)
      );
      const configsByRecord = new Map();
      validConfigs.forEach((config) => {
        const list = configsByRecord.get(config.recordId) || [];
        list.push(config.id);
        configsByRecord.set(config.recordId, list);
      });
      const recordsWithConfigs = records.map((record) => ({
        ...record,
        configIds: (configsByRecord.get(record.id) || []).filter((id) => record.configIds.includes(id))
      })).filter((record) => record.configIds.length > 0);
      const validRecordIds = new Set(recordsWithConfigs.map((record) => record.id));
      return {
        games,
        hardware,
        records: recordsWithConfigs,
        configs: validConfigs.filter((config) => validRecordIds.has(config.recordId))
      };
    }

    function activeCatalog() {
      return {
        games: catalog.games.filter((game) => game.platforms.includes(state.platform)),
        hardware: catalog.hardware.filter((item) => item.platform === state.platform),
        records: catalog.records.filter((record) => record.platform === state.platform),
        configs: catalog.configs.filter((config) => config.platform === state.platform)
      };
    }

    function sortRecords(records) {
      const direction = state.sort.direction === "asc" ? 1 : -1;
      return [...records].sort((left, right) => {
        const primary = state.sort.field === "verifiedAt"
          ? left.verifiedAt.localeCompare(right.verifiedAt)
          : left.rating - right.rating;
        if (primary !== 0) return primary * direction;
        return right.verifiedAt.localeCompare(left.verifiedAt);
      });
    }

    function filterRecords() {
      const { records } = activeCatalog();
      return sortRecords(records.filter((record) => {
        if (state.filters.gameId && record.gameId !== state.filters.gameId) return false;
        if (state.filters.hardwareId && !record.hardwareIds.includes(state.filters.hardwareId)) return false;
        if (state.filters.ratingMin != null && record.rating < state.filters.ratingMin) return false;
        return true;
      }));
    }

    function hasActiveFilters() {
      return Boolean(state.filters.gameId || state.filters.hardwareId || state.filters.ratingMin != null);
    }

    function hotRecords() {
      const current = activeCatalog();
      const popularGameIds = new Set(current.games
        .filter((game) => game.popularOn.includes(state.platform))
        .map((game) => game.id));
      const bestByGame = new Map();
      sortRecords(current.records).forEach((record) => {
        if (popularGameIds.has(record.gameId) && !bestByGame.has(record.gameId)) {
          bestByGame.set(record.gameId, record);
        }
      });
      return [...bestByGame.values()].slice(0, 6);
    }

    function resultRecords() {
      return hasActiveFilters() ? filterRecords() : hotRecords();
    }

    function filterDefinitions() {
      return [
        { key: "game", label: "游戏", placeholder: "搜索游戏名称" },
        {
          key: "hardware",
          label: "机型",
          placeholder: "搜索机型"
        },
        { key: "rating", label: "评级", placeholder: "搜索评级" }
      ];
    }

    function includesQuery(values, query) {
      const normalized = text(query, 80).toLocaleLowerCase("zh-CN");
      if (!normalized) return true;
      return values.some((value) => text(value, 100).toLocaleLowerCase("zh-CN").includes(normalized));
    }

    function filterOptions(key) {
      const current = activeCatalog();
      if (key === "game") {
        return current.games.filter((game) => includesQuery(
          [game.name, game.englishName, ...game.aliases],
          state.queries.game
        )).map((game) => ({
          value: game.id,
          label: game.name,
          subtitle: game.englishName,
          game
        }));
      }
      if (key === "hardware") {
        const modelType = state.platform === "android" ? "device" : "model";
        return current.hardware.filter((item) => item.type === modelType)
          .filter((item) => includesQuery(
            [item.displayName, ...item.aliases],
            state.queries.hardware
          )).map((item) => ({
          value: item.id,
          label: item.displayName,
          subtitle: item.subtitle
        }));
      }
      return ratingOptions.filter((item) => includesQuery(
        [item.label, item.value == null ? "全部" : String(item.value)],
        state.queries.rating
      ));
    }

    function selectedFilterLabel(key) {
      const current = activeCatalog();
      if (key === "game") {
        return current.games.find((game) => game.id === state.filters.gameId)?.name || "全部游戏";
      }
      if (key === "hardware") {
        return current.hardware.find((item) => item.id === state.filters.hardwareId)?.displayName ||
          "机型";
      }
      return state.filters.ratingMin == null ? "评级" : "≥" + state.filters.ratingMin + " 分";
    }

    function renderFilterOption(key, option) {
      const cover = key === "game" ? renderCover(option.game, "filter-option-cover") : "";
      const selectedValue = key === "game" ? state.filters.gameId
        : key === "hardware" ? state.filters.hardwareId
        : state.filters.ratingMin;
      return '<button class="filter-option" data-filter-option="' + esc(key) +
        '" data-option-value="' + esc(option.value == null ? "all" : option.value) +
        '" type="button" role="option" aria-selected="' + (selectedValue === option.value) + '">' +
          cover + '<span><strong>' + esc(option.label) + '</strong>' +
          (option.subtitle ? '<small>' + esc(option.subtitle) + '</small>' : '') + '</span>' +
        '</button>';
    }

    function filterChevronIcon() {
      return '<svg class="filter-chevron" viewBox="0 0 16 16" aria-hidden="true">' +
        '<path d="m4.75 6.25 3.25 3.5 3.25-3.5"/></svg>';
    }

    function renderSearchableFilter(definition) {
      const key = definition.key;
      const isOpen = state.openFilter === key;
      const options = filterOptions(key);
      const hasSelection = key === "game" ? state.filters.gameId
        : key === "hardware" ? state.filters.hardwareId
        : state.filters.ratingMin != null;
      const selectAttribute = key === "game" ? ' data-filter-select="game"'
        : key === "hardware" ? ' data-filter-select="hardware"'
        : ' data-filter-select="rating"';
      return '<section class="filter-select' + (isOpen ? ' open' : '') + '"' + selectAttribute + '>' +
          '<span class="filter-label">' + esc(definition.label) + '</span>' +
          '<div class="filter-control' + (hasSelection ? ' has-selection' : '') + '">' +
            '<button data-filter-trigger="' + esc(key) + '" type="button" aria-haspopup="listbox"' +
              ' aria-expanded="' + isOpen + '" aria-label="' + esc(
                definition.label + "：" + selectedFilterLabel(key)
              ) + '">' +
              '<strong>' + esc(selectedFilterLabel(key)) + '</strong>' +
              (hasSelection ? '' : filterChevronIcon()) +
            '</button>' +
            (hasSelection ? '<button class="filter-clear" data-filter-clear="' + esc(key) +
              '" type="button" aria-label="清除' + esc(definition.label) + '">×</button>' : '') +
          '</div>' +
          (isOpen ? '<div class="filter-menu">' +
            '<input data-filter-query="' + esc(key) + '" value="' + esc(state.queries[key]) +
              '" aria-label="' + esc(definition.label) +
              '" placeholder="' + esc(definition.placeholder) + '" autocomplete="off">' +
            '<div class="filter-options" role="listbox" aria-label="' +
              esc(definition.label + "选项") + '">' +
              (options.length ? options.map((option) => renderFilterOption(key, option)).join("")
                : '<p class="filter-empty">暂无匹配选项</p>') +
            '</div></div>' : '') +
        '</section>';
    }

    function renderSearchableSelect(definition) {
      return renderSearchableFilter(definition);
    }

    function renderFilterBar() {
      const selectedCount = [state.filters.gameId, state.filters.hardwareId, state.filters.ratingMin]
        .filter((value) => value != null).length;
      return '<section class="filter-panel">' +
        '<div class="filter-grid">' +
          filterDefinitions().map(renderSearchableSelect).join("") +
        '</div>' +
        (selectedCount ? '<div class="filter-summary"><span>已选 ' + selectedCount + ' 项</span>' +
          '<button data-clear-filters type="button">清空</button></div>' : '') +
        '</section>';
    }

    function platformLabel() {
      return state.platform === "mac" ? "Mac" : "Android";
    }

    function coverUrl(game) {
      return game && game.coverKey
        ? "assets/compatibility/" + encodeURIComponent(game.coverKey)
        : "";
    }

    function renderCover(game, className) {
      const src = coverUrl(game);
      if (!src) {
        return '<div class="' + esc(className) + ' cover-fallback" aria-label="封面占位">GH</div>';
      }
      return '<img class="' + esc(className) + '" data-cover-image src="' + esc(src) +
        '" alt="' + esc(game.name + "封面") + '">';
    }

    function recordGame(record) {
      return activeCatalog().games.find((game) => game.id === record.gameId);
    }

    function recordHardware(record) {
      const items = activeCatalog().hardware.filter((item) => record.hardwareIds.includes(item.id));
      const primaryTypes = state.platform === "android" ? ["device", "gpu"] : ["model", "chip"];
      return primaryTypes.map((type) => items.find((item) => item.type === type)).filter(Boolean);
    }

    function ratingStars(rating) {
      const score = Math.round(number(rating, 1, 5));
      return '<span class="rating" aria-label="' + score + ' 分">' + '★'.repeat(score) +
        '<i>' + '★'.repeat(5 - score) + '</i></span>';
    }

    function formatRating(rating) {
      return number(rating, 1, 5).toFixed(1);
    }

    function compatibilityStatusClass(status) {
      return status === "完美兼容" ? "perfect"
        : status === "基本可玩" ? "basic"
        : status === "有部分问题" ? "issues"
        : "unplayable";
    }

    function renderCompatibilityStatus(record) {
      return '<span class="compatibility-status ' + compatibilityStatusClass(record.compatibilityStatus) +
        '" data-compatibility-status="' + esc(record.compatibilityStatus) + '">' +
        esc(record.compatibilityStatus) + '</span>';
    }

    function copyIcon() {
      return '<svg viewBox="0 0 20 20" aria-hidden="true">' +
        '<rect x="6.5" y="6.5" width="9" height="9" rx="1.5"/>' +
        '<path d="M4.5 12.5h-1v-9h9v1"/></svg>';
    }

    function copySuccessIcon() {
      return '<svg viewBox="0 0 20 20" aria-hidden="true">' +
        '<path d="m4.5 10.5 3.2 3.2 7.8-8"/></svg>';
    }

    function copyFeedbackLabel(status, detail, defaultLabel) {
      if (status === "pending") return detail ? "复制中…" : "正在复制分享码";
      if (status === "success") return detail ? "✓ 已复制" : "已复制分享码";
      if (status === "error") return detail ? "复制失败，点击重试" : "复制失败，请重试";
      return defaultLabel;
    }

    function configCopyAction(record) {
      const config = recordConfigs(record.id)[0];
      if (!config) {
        return '<button class="record-copy-action" type="button" disabled aria-label="暂无分享码">' +
          copyIcon() + '</button>';
      }
      const status = state.copy.configId === config.id ? state.copy.status : "idle";
      const defaultLabel = "复制" + recordGame(record).name + "分享码";
      const stateClass = status === "idle" ? "" : " copy-" + status;
      return '<button class="record-copy-action' + stateClass + '" data-config-copy="' + esc(config.id) +
        '" data-copy-default-label="' + esc(defaultLabel) + '" type="button" aria-live="polite"' +
        ' aria-label="' + esc(copyFeedbackLabel(status, false, defaultLabel)) + '"' +
        (status === "pending" ? ' aria-disabled="true"' : '') + '>' +
        (status === "success" ? copySuccessIcon() : copyIcon()) + '</button>';
    }

    function recordConfigs(recordId) {
      const record = activeCatalog().records.find((item) => item.id === recordId);
      if (!record) return [];
      return activeCatalog().configs.filter((config) =>
        record.configIds.includes(config.id) && config.recordId === record.id
      );
    }

    function recordCells(record) {
      const game = recordGame(record);
      const hardware = recordHardware(record);
      const environment = record.environment;
      return {
        game: renderCover(game, "record-cover") + '<span><strong>' + esc(game.name) +
          '</strong><small>' + esc(game.englishName) + '</small></span>',
        hardware: hardware.map((item) => esc(item.displayName)).join('<small> / </small>'),
        gameVersion: esc(record.gameVersion),
        os: esc(state.platform === "android" ? environment.androidVersion : environment.macosVersion),
        runtime: esc(state.platform === "android" ? "—" : environment.compatibilityLayer),
        appVersion: esc(environment.appVersion),
        rating: ratingStars(record.rating),
        ratingNumber: formatRating(record.rating),
        fps: '<strong>' + formatNumber(record.avgFps) + '</strong> FPS',
        status: renderCompatibilityStatus(record),
        notes: esc(record.notes),
        config: configCopyAction(record),
        verifiedAt: esc(record.verifiedAt)
      };
    }

    function recordHardwareSummary(record) {
      const environment = record.environment;
      return state.platform === "android"
        ? [environment.deviceModel, environment.soc, environment.mobileGpu].filter(Boolean).join(" / ")
        : [environment.macModel, environment.appleChip].filter(Boolean).join(" / ");
    }

    function recordEnvironmentSummary(record) {
      const environment = record.environment;
      return state.platform === "android"
        ? environment.androidVersion
        : environment.macosVersion;
    }

    function renderRecordTable(records) {
      const ratingDirection = state.sort.field === "rating"
        ? (state.sort.direction === "desc" ? " ↓" : " ↑") : "";
      const verifiedDirection = state.sort.field === "verifiedAt"
        ? (state.sort.direction === "desc" ? " ↓" : " ↑") : "";
      return '<div class="record-table-wrap" data-record-table><table class="record-table">' +
        '<thead><tr><th>游戏</th><th>机型 / 硬件</th>' +

            '<td>' + cell.appVersion + '</td><td>' + cell.rating + '</td><td>' + cell.fps + '</td>' +
            '<td>' + cell.status + '</td><td class="record-notes">' + cell.notes + '</td>' +
            '<td>' + cell.verifiedAt + '</td><td>' + cell.config + '</td></tr>';
        }).join("") + '</tbody></table></div>';

    function renderCompactRecord(record) {

            '<span>' + esc(recordEnvironmentSummary(record)) + '</span>' +

          '<div class="record-side"><strong>' + formatRating(record.rating) + '</strong>' +
            configCopyAction(record) + '</div>' +
        '</article>';

    function renderDetailedRecord(record) {
      const game = recordGame(record);
      const environment = record.environment;
      return '<article class="record-card detailed" data-record-row="' + esc(record.id) +
        '" data-record-open="' + esc(record.id) + '" tabindex="0" role="button"' +
        ' aria-label="查看' + esc(game.name) + '兼容性评价">' +
          '<header>' + renderCover(game, "record-cover") + '<div><strong>' + esc(game.name) +

            esc(recordEnvironmentSummary(record)) + '</span><span>游戏版本 ' + esc(record.gameVersion) +

          '<div class="detailed-footer"><div class="record-status-line">' +

            formatNumber(record.avgFps) + '</span></div>' + configCopyAction(record) + '</div>' +

    function renderRecordCards(records) {

      return '<div class="record-cards ' + esc(state.viewMode) + '" data-record-cards>' +

    function renderViewModeSwitch() {
      return '<div class="view-mode-switch" aria-label="结果视图">' +
        '<button data-view-mode="list" type="button" aria-label="列表视图" aria-pressed="' +

          '><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10"/></svg></button>' +
        '<button data-view-mode="grid" type="button" aria-label="平铺视图" aria-pressed="' +
          (state.viewMode === "grid") + '"' + (state.viewMode === "grid" ? ' class="active"' : '') +
          '><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4" height="4"/>' +
          '<rect x="9.5" y="2.5" width="4" height="4"/><rect x="2.5" y="9.5" width="4" height="4"/>' +
          '<rect x="9.5" y="9.5" width="4" height="4"/></svg></button></div>';

    function renderRecordResults() {
      const records = resultRecords();
      if (!records.length) {
        return '<section class="no-results"><h2>暂无符合条件的兼容记录</h2>' +
          '<p>当前筛选条件会继续保留。</p><button data-clear-filters type="button">清空筛选</button></section>';
      }

        '<div><h2>' + (hasActiveFilters() ? '兼容记录' : '热门兼容记录') +

        renderViewModeSwitch() + '</div>' +
        renderRecordTable(records) + renderRecordCards(records) + '</section>';

    function clearCopyFeedbackTimer() {
      if (copyFeedbackTimer) window.clearTimeout(copyFeedbackTimer);
      copyFeedbackTimer = 0;
    }

    function clearCopyState() {
      clearCopyFeedbackTimer();
      state.copy = { requestId: null, configId: null, status: "idle", message: "" };
    }

    function syncCopyFeedback(configId) {
      document.querySelectorAll("[data-config-copy]").forEach((button) => {
        if (button.dataset.configCopy !== configId) return;
        const status = state.copy.configId === configId ? state.copy.status : "idle";
        const detail = button.classList.contains("copy-button");
        const defaultLabel = button.dataset.copyDefaultLabel || "复制分享码";
        button.classList.toggle("copy-pending", status === "pending");
        button.classList.toggle("copy-success", status === "success");
        button.classList.toggle("copy-error", status === "error");
        if (status === "pending") button.setAttribute("aria-disabled", "true");
        else button.removeAttribute("aria-disabled");
        const label = copyFeedbackLabel(status, detail, defaultLabel);
        button.setAttribute("aria-label", label);
        if (detail) button.textContent = label;
        else button.innerHTML = status === "success" ? copySuccessIcon() : copyIcon();
      });
    }

    function scheduleCopyFeedbackReset(requestId, configId) {
      clearCopyFeedbackTimer();
      copyFeedbackTimer = window.setTimeout(() => {
        if (state.copy.requestId !== requestId || state.copy.configId !== configId ||
            state.copy.status === "pending") return;
        state.copy = { requestId: null, configId: null, status: "idle", message: "" };
        syncCopyFeedback(configId);
        copyFeedbackTimer = 0;
      }, 2000);
    }

    function visibleRecordTrigger(recordId) {
      return [...document.querySelectorAll("[data-record-open]")].find((element) =>
        element.dataset.recordOpen === recordId && element.getClientRects().length > 0
      );
    }

    function viewerFocusableControls() {
      const viewer = document.querySelector("[data-config-viewer]");
      if (!viewer) return [];
      const selector = [
        "button:not([disabled])",
        "[href]",
        "input:not([disabled])",
        "select:not([disabled])",
        "textarea:not([disabled])",
        '[tabindex]:not([tabindex="-1"])'
      ].join(",");
      return [...viewer.querySelectorAll(selector)].filter((element) => {
        const style = window.getComputedStyle(element);
        return element.getClientRects().length > 0 && style.visibility !== "hidden" && style.display !== "none";
      });
    }

    function openEvaluationViewer(recordId) {
      const record = activeCatalog().records.find((item) => item.id === recordId);
      if (!record) return false;
      const configs = recordConfigs(recordId);
      const app = document.getElementById("compatibility-app");
      viewerReturnFocusRecordId = recordId;
      viewerScrollTop = app ? app.scrollTop : 0;
      state.viewer = { recordId, configId: configs[0]?.id || null };
      state.openFilter = null;
      clearCopyState();
      render();
      document.getElementById("compatibility-app").scrollTop = 0;
      document.querySelector("[data-config-close]")?.focus({ preventScroll: true });
      return true;
    }

    function closeConfigViewer() {
      if (!state.viewer.recordId) return false;
      const recordId = viewerReturnFocusRecordId || state.viewer.recordId;
      const scrollTop = viewerScrollTop;
      state.viewer = { recordId: null, configId: null };
      clearCopyState();
      render();
      const app = document.getElementById("compatibility-app");
      if (app) app.scrollTop = scrollTop;
      const trigger = visibleRecordTrigger(recordId);
      if (trigger) trigger.focus({ preventScroll: true });
      if (app) app.scrollTop = scrollTop;
      viewerReturnFocusRecordId = null;
      viewerScrollTop = 0;
      return true;
    }

    function resetQueryState() {
      state.filters = { gameId: null, hardwareId: null, ratingMin: null };
      state.queries = { game: "", hardware: "", rating: "" };
      state.openFilter = null;
      state.sort = { field: "rating", direction: "desc" };
      state.viewer = { recordId: null, configId: null };
      viewerReturnFocusRecordId = null;
      viewerScrollTop = 0;
      clearCopyState();
    }

    function applyPlatform(platform, source) {
      const nextPlatform = normalizePlatform(platform) || "android";
      const changed = state.platform !== nextPlatform || state.platformSource !== source;
      state.platform = nextPlatform;
      state.platformSource = source;
      if (changed) resetQueryState();
      render();
    }

    function filteredCatalog() {
      const games = catalog.games.filter((game) => game.platforms.includes(state.platform));
      const gameIds = new Set(games.map((game) => game.id));
      return {
        games,
        records: catalog.records.filter((record) =>
          record.platform === state.platform && gameIds.has(record.gameId)),
        configs: catalog.configs.filter((config) =>
          config.platform === state.platform && gameIds.has(config.gameId))
      };
    }

    function setCatalog(raw) {
      catalog = normalizeCatalog(raw);
      state.catalogStatus = "ready";
      const current = activeCatalog();
      if (!current.games.some((game) => game.id === state.filters.gameId)) state.filters.gameId = null;
      if (!current.hardware.some((item) => item.id === state.filters.hardwareId)) {
        state.filters.hardwareId = null;
      }
      state.openFilter = null;
      if (!current.records.some((record) => record.id === state.viewer.recordId)) {
        state.viewer = { recordId: null, configId: null };
        viewerReturnFocusRecordId = null;
        viewerScrollTop = 0;
      }
      clearCopyState();
      render();
    }

    function configSettingSections(config) {
      if (config.settingSections.length) return config.settingSections;
      return [{
        title: "系统设置",
        items: config.fields.map(([label, value]) => ({ label, description: "", value, children: [] }))
      }];
    }

    function renderSettingItem(setting, nested = false) {
      return '<div class="setting-row' + (nested ? ' nested' : '') + '">' +
        '<div><strong>' + esc(setting.label) + '</strong>' +
          (setting.description ? '<p>' + esc(setting.description) + '</p>' : '') + '</div>' +
        '<span>' + esc(setting.value) + '</span>' +
        (setting.children.length ? '<div class="setting-children">' +
          setting.children.map((child) => renderSettingItem(child, true)).join("") + '</div>' : '') +
      '</div>';
    }

    function renderConfigDetail(config) {
      if (!config) {
        return '<section class="evaluation-empty"><h3>暂无启动配置</h3>' +
          '<p>当前兼容记录可正常查看，但暂未提供可复制的分享码。</p></section>';
      }
      const copyStatus = state.copy.configId === config.id ? state.copy.status : "idle";
      const copyStateClass = copyStatus === "idle" ? "" : " copy-" + copyStatus;
      const copyLabel = copyFeedbackLabel(copyStatus, true, "复制分享码");
      return '<div class="config-detail" data-config-detail="' + esc(config.id) + '">' +
        '<div class="config-applicability" data-config-applicability>' +
          '<strong>适用范围</strong>' +
          '<div class="config-applicability-grid">' +
            '<div><span>游戏版本</span><b>' + esc(config.applicability.gameVersion) + '</b></div>' +
            '<div><span>' + (state.platform === "android" ? "适用 GPU" : "适用芯片") + '</span>' +
              '<b>' + esc(config.applicability.hardware) + '</b></div>' +
            '<div><span>系统范围</span><b>' + esc(config.applicability.systemRange) + '</b></div>' +
          '</div>' +
        '</div>' +
        '<h3 class="settings-title">系统智能设置方案</h3>' +
        configSettingSections(config).map((section) =>
          '<section class="setting-section"><h4>' + esc(section.title) + '</h4><div class="setting-list">' +
            section.items.map((setting) => renderSettingItem(setting)).join("") + '</div></section>'
        ).join("") +
        '<div class="config-meta">更新于 ' + esc(config.updatedAt) + ' · ' +
          formatNumber(config.downloadCount) + ' 次下载</div>' +
        '<button class="copy-button' + copyStateClass + '" data-config-copy="' + esc(config.id) +
          '" data-copy-default-label="复制分享码" type="button" aria-live="polite" aria-label="' +
          esc(copyLabel) + '"' + (copyStatus === "pending" ? ' aria-disabled="true"' : '') + '>' +
          esc(copyLabel) + '</button>' +
      '</div>';
    }

    function renderConfigChoice(config, selectedId) {
      return '<button data-config-choice="' + esc(config.id) + '" type="button" aria-pressed="' +
        (config.id === selectedId) + '"' + (config.id === selectedId ? ' class="active"' : '') + '>' +
        esc(config.name) + '</button>';
    }

    function renderConfigViewer() {
      const record = activeCatalog().records.find((item) => item.id === state.viewer.recordId);
      if (!record) return "";
      const configs = recordConfigs(state.viewer.recordId);
      const selected = configs.find((config) => config.id === state.viewer.configId) || configs[0] || null;
      const game = recordGame(record);
      return '<div class="config-viewer-backdrop" data-config-viewer data-evaluation-viewer role="dialog" aria-modal="true"' +
        ' aria-labelledby="config-viewer-title">' +
        '<section class="config-viewer-panel">' +
          '<header><button data-config-close type="button" aria-label="返回兼容记录">←</button>' +
            '<div><h2 id="config-viewer-title">兼容性评价</h2></div>' +
            '<button data-config-close type="button" aria-label="关闭兼容性评价">×</button></header>' +
          '<div class="evaluation-summary">' + renderCover(game, "evaluation-cover") +
            '<div><h3>' + esc(game.name) + '</h3><p>' + esc(recordHardwareSummary(record)) + '</p>' +
              '<div class="record-status-line">' + renderCompatibilityStatus(record) +
                '<span class="average-fps">平均帧率 ' + formatNumber(record.avgFps) + '</span></div></div>' +
            '<div class="evaluation-score"><strong>' + formatRating(record.rating) + '</strong></div></div>' +
          '<section class="evaluation-verdict"><h3>兼容性结论</h3><p>' + esc(record.notes) + '</p></section>' +
          (configs.length > 1 ? '<nav class="config-choice-list" aria-label="配置方案">' +
            configs.map((config) => renderConfigChoice(config, selected.id)).join("") + '</nav>' : '') +
          '<div class="config-viewer-body">' + renderConfigDetail(selected) + '</div>' +
        '</section></div>';
    }

    function renderState(title, copy, action) {
      return '<section class="state-card"><h2>' + esc(title) + '</h2>' +
        '<p>' + esc(copy) + '</p>' +
        (action
          ? '<button data-state-action="' + esc(action) + '" type="button">重新加载</button>'
          : '') +
      '</section>';
    }

    function render() {
      let content = "";
      if (state.catalogStatus === "loading") {
        content = renderState("正在加载兼容数据", "正在获取游戏、兼容记录和配置。", "");
      } else if (state.catalogStatus === "error") {
        content = renderState("兼容数据加载失败", "暂时无法获取数据，请重试。", "reload");
      } else if (activeCatalog().records.length === 0) {
        content = renderState(
          "当前" + platformLabel() + "暂无兼容数据",
          "当前平台暂时没有可展示的兼容记录，请重新加载。",
          "reload"
        );
      } else {
        content = renderFilterBar() + renderRecordResults();
      }
      const viewer = state.catalogStatus === "ready" ? renderConfigViewer() : "";
      const pageAccessibility = viewer ? ' inert aria-hidden="true"' : "";
      document.getElementById("compatibility-app").innerHTML =
        '<div class="page"' + pageAccessibility + '><header class="page-header">' +
          '<div class="header-topline">' +
            '<button class="back-button" data-back type="button" aria-label="返回">←</button>' +
            '<h1>兼容性查询</h1>' +
          '</div>' +
          '<p>查看当前平台的运行表现与启动配置</p>' +
        '</header>' + content + '</div>' + viewer;
      document.querySelectorAll("[data-demo-platform]").forEach((button) => {
        button.classList.toggle("active", button.dataset.demoPlatform === state.platform);
        button.disabled = state.platformSource === "bridge";
      });
    }

    function setCopyResult(requestId, configId, ok) {
      if (state.copy.requestId !== requestId || state.copy.configId !== configId ||
          state.copy.status !== "pending") return false;
      state.copy = {
        requestId,
        configId,
        status: ok ? "success" : "error",
        message: ok ? "已复制分享码" : "复制失败，请重试"
      };
      syncCopyFeedback(configId);
      scheduleCopyFeedbackReset(requestId, configId);
      return ok;
    }

    function configShareText(config, record) {
      const game = recordGame(record);
      const gpu = record.environment.mobileGpu || record.environment.appleChip || "未记录";
      return "复制打开盖世游戏导入PC引擎设置方案：[" + game.name +
        "][系统智能设置方案][GPU:" + gpu + "]SCFG##" + config.shareCode;
    }

    function fallbackCopyText(value) {
      const textarea = document.createElement("textarea");
      textarea.value = value;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();
      return copied;
    }

    function bridgeCopySucceeded(result) {
      return result !== false && !(result && typeof result === "object" && result.ok === false);
    }

    async function copyWithBridge(value) {
      const bridge = window.GameHubBridge;
      if (!bridge || typeof bridge.copyConfig !== "function") return false;
      try {
        const result = bridge.copyConfig(value);
        if (!result || typeof result.then !== "function") return bridgeCopySucceeded(result);
        const resolved = await Promise.race([
          result,
          new Promise((resolve) => window.setTimeout(() => resolve({ ok: false }), COPY_TIMEOUT_MS))
        ]);
        return bridgeCopySucceeded(resolved);
      } catch (error) {
        return false;
      }
    }

    async function copyWithClipboard(value) {
      if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") return false;
      try {
        await navigator.clipboard.writeText(value);
        return true;
      } catch (error) {
        return false;
      }
    }

    async function copyConfig(configId) {
      if (state.copy.status === "pending") return false;
      const requestId = "copy-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
      const current = activeCatalog();
      const config = current.configs.find((item) => item.id === configId);
      const record = current.records.find((item) => item.id === config?.recordId);
      if (!config || !record || config.recordId !== record.id || config.platform !== record.platform ||
          config.gameId !== record.gameId || !record.configIds.includes(config.id)) {
        state.copy = { requestId, configId, status: "error", message: "复制失败，请重试" };
        syncCopyFeedback(configId);
        scheduleCopyFeedbackReset(requestId, configId);
        return false;
      }
      const payload = configShareText(config, record);
      clearCopyFeedbackTimer();
      state.copy = { requestId, configId, status: "pending", message: "复制中…" };
      syncCopyFeedback(configId);
      try {
        const copied = await copyWithBridge(payload) || await copyWithClipboard(payload) ||
          fallbackCopyText(payload);
        return setCopyResult(requestId, configId, copied);
      } catch (error) {
        return setCopyResult(requestId, configId, false);
      }
    }

    document.addEventListener("error", (event) => {
      const image = event.target;
      if (!(image instanceof HTMLImageElement) || !image.matches("[data-cover-image]")) return;
      const fallback = document.createElement("div");
      fallback.className = image.className + " cover-fallback";
      fallback.setAttribute("aria-label", "封面加载失败");
      fallback.textContent = "GH";
      image.replaceWith(fallback);
    }, true);

    function clearFilter(key) {
      if (!(key in state.queries)) return;
      if (key === "game") state.filters.gameId = null;
      if (key === "hardware") state.filters.hardwareId = null;
      if (key === "rating") state.filters.ratingMin = null;
      state.queries[key] = "";
      state.openFilter = null;
      state.viewer = { recordId: null, configId: null };
      clearCopyState();
    }

    document.addEventListener("input", (event) => {
      const key = event.target.dataset.filterQuery;
      if (!key || !(key in state.queries)) return;
      state.queries[key] = event.target.value;
      render();
      const filterInput = document.querySelector('[data-filter-query="' + key + '"]');
      if (filterInput) {
        filterInput.focus();
        filterInput.setSelectionRange(state.queries[key].length, state.queries[key].length);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (state.viewer.recordId) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeConfigViewer();
          return;
        }
        if (event.key === "Tab") {
          const controls = viewerFocusableControls();
          if (!controls.length) {
            event.preventDefault();
            return;
          }
          const first = controls[0];
          const last = controls[controls.length - 1];
          const active = document.activeElement;
          if (event.shiftKey && (active === first || !active?.closest?.("[data-config-viewer]"))) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && (active === last || !active?.closest?.("[data-config-viewer]"))) {
            event.preventDefault();
            first.focus();
          }
        }
        return;
      }
      const recordOpen = event.target.closest?.("[data-record-open]");
      const interactiveTarget = event.target.closest?.("button, a, input, select, textarea");
      if (recordOpen && !interactiveTarget && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openEvaluationViewer(recordOpen.dataset.recordOpen);
        return;
      }
      if (event.key !== "Escape") return;
      if (!state.openFilter) return;
      const key = state.openFilter;
      state.openFilter = null;
      render();
      document.querySelector('[data-filter-trigger="' + key + '"]')?.focus();
    });

    document.addEventListener("click", (event) => {
      const closedFilterFromOutside = Boolean(
        state.openFilter && !event.target.closest("[data-filter-select]")
      );
      if (closedFilterFromOutside) state.openFilter = null;

      const preview = event.target.closest(".demo-controls [data-preview]");
      if (preview) {
        document.querySelector(".frame").dataset.preview = preview.dataset.preview;
        document.querySelectorAll("[data-preview]").forEach((button) => {
          button.classList.toggle("active", button === preview);
        });
        if (closedFilterFromOutside) render();
        return;
      }

      const sortButton = event.target.closest("[data-sort-field]");
      if (sortButton) {
        const field = sortButton.dataset.sortField;
        if (!['rating', 'verifiedAt'].includes(field)) return;
        if (state.sort.field === field) {
          state.sort.direction = state.sort.direction === "desc" ? "asc" : "desc";
        } else {
          state.sort = { field, direction: "desc" };
        }
        render();
        return;
      }

      const viewMode = event.target.closest("[data-view-mode]");
      if (viewMode) {
        const mode = viewMode.dataset.viewMode;
        if (mode === "list" || mode === "grid") {
          state.viewMode = mode;
          render();
          document.querySelector('[data-view-mode="' + mode + '"]')?.focus({ preventScroll: true });
        }
        return;
      }

      const demoPlatform = event.target.closest("[data-demo-platform]");
      if (demoPlatform) {
        if (state.platformSource !== "bridge") {
          applyPlatform(normalizePlatform(demoPlatform.dataset.demoPlatform), "demo");
        } else if (closedFilterFromOutside) {
          render();
        }
        return;
      }

      const trigger = event.target.closest("[data-filter-trigger]");
      if (trigger) {
        const key = trigger.dataset.filterTrigger;
        if (!(key in state.queries)) return;
        state.openFilter = state.openFilter === key ? null : key;
        render();
        document.querySelector('[data-filter-query="' + key + '"]')?.focus();
        return;
      }

      const option = event.target.closest("[data-filter-option]");
      if (option) {
        const key = option.dataset.filterOption;
        const value = option.dataset.optionValue;
        if (!(key in state.queries)) return;
        if (key === "game") state.filters.gameId = value;
        if (key === "hardware") state.filters.hardwareId = value;
        if (key === "rating") state.filters.ratingMin = value === "all" ? null : Number(value);
        state.queries[key] = "";
        state.openFilter = null;
        state.viewer = { recordId: null, configId: null };
        clearCopyState();
        render();
        return;
      }

      const clear = event.target.closest("[data-filter-clear]");
      if (clear) {
        clearFilter(clear.dataset.filterClear);
        render();
        return;
      }

      if (event.target.closest("[data-clear-filters]")) {
        state.filters = { gameId: null, hardwareId: null, ratingMin: null };
        state.queries = { game: "", hardware: "", rating: "" };
        state.openFilter = null;
        state.viewer = { recordId: null, configId: null };
        clearCopyState();
        render();
        return;
      }

      const configCopy = event.target.closest("[data-config-copy]");
      if (configCopy) {
        event.preventDefault();
        event.stopPropagation();
        copyConfig(configCopy.dataset.configCopy);
        return;
      }

      const recordOpen = event.target.closest("[data-record-open]");
      if (recordOpen) {
        openEvaluationViewer(recordOpen.dataset.recordOpen);
        return;
      }

      const configChoice = event.target.closest("[data-config-choice]");
      if (configChoice) {
        const configId = configChoice.dataset.configChoice;
        if (recordConfigs(state.viewer.recordId).some((config) => config.id === configId)) {
          state.viewer.configId = configId;
          clearCopyState();
          render();
          document.getElementById("compatibility-app").scrollTop = 0;
          document.querySelector('[data-config-choice="' + configId + '"]')?.focus({ preventScroll: true });
        }
        return;
      }

      if (event.target.closest("[data-config-close]") ||
          (event.target.matches("[data-config-viewer]") && !event.target.closest(".config-viewer-panel"))) {
        closeConfigViewer();
        return;
      }

      const stateAction = event.target.closest("[data-state-action]");
      if (stateAction && stateAction.dataset.stateAction === "reload") {
        state.catalogStatus = "loading";
        render();
        window.setTimeout(() => setCatalog(mockCatalog), 400);
        return;
      }

      if (event.target.closest("[data-back]")) {
        if (window.GameHubBridge && typeof window.GameHubBridge.goBack === "function") {
          window.GameHubBridge.goBack();
        } else if (history.length > 1) {
          history.back();
        }
        return;
      }

      if (closedFilterFromOutside) render();
    });

    window.GameHubCompatibility = {
      setContext(context) {
        const resolved = resolvePlatform(context);
        applyPlatform(resolved.platform, resolved.source);
      },
      setCatalog(catalog) {
        setCatalog(catalog);
      },
      setCatalogLoading() {
        state.catalogStatus = "loading";
        render();
      },
      setCatalogError() {
        state.catalogStatus = "error";
        render();
      }
    };

    const initialPlatform = resolvePlatform(null);
    state.platform = initialPlatform.platform;
    state.platformSource = initialPlatform.source;
    setCatalog(mockCatalog);
  </script>
</body>
</html>
