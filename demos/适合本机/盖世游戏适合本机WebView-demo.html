    function renderConfig(){const root=document.getElementById('config-view'),c=configBy(state.selectedConfigId);if(!c){root.innerHTML=`<div class="detail-page">${nav('配置详情')}${statePanel('配置已失效','请返回重新选择配置','back','返回')}</div>`;return}const g=gameBy(c.gameId),gpu=gpuBy(c.gpuId),r=recordFor(c.gameId,c.gpuId),s=statusOf(r);root.innerHTML=`<div class="detail-page">${nav('配置详情')}<div class="detail-body config-detail-body"><div class="detail-left"><section class="config-hero"><h2>${esc(c.name)}</h2><p>${esc(g?.name)} · ${esc(gpu?.name)} · v${esc(c.version)}</p><div class="badges"><span class="badge ${s.className}">${s.label}</span><span class="badge evidence">${evidenceMap[r?.evidenceLevel]||'样本较少'}</span></div><div class="result-box"><span>预计表现</span><strong>${esc(c.expectedResult)}</strong></div><div class="env-grid"><div class="env"><span>游戏版本</span><strong>${esc(c.gameVersion)}</strong></div><div class="env"><span>适用 GPU</span><strong>${esc(gpu?.name)}</strong></div><div class="env"><span>Android</span><strong>${esc(c.androidVersion)}</strong></div><div class="env"><span>盖世版本</span><strong>${esc(c.appVersion)}</strong></div><div class="env"><span>运行内核</span><strong>${esc(c.kernelVersion)}</strong></div><div class="env"><span>配置文件</span><strong>${esc(c.fileSize)} · ${c.downloads} 次下载</strong></div></div></section></div><div class="detail-right"><section class="module"><h3>推荐设置</h3><div class="settings">${c.settings.map(([k,v])=>`<div class="setting"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div></section><section class="module"><h3>使用说明</h3><ol class="steps">${c.steps.map((x,i)=>`<li class="step"><span class="step-index">${i+1}</span><div><strong>${esc(x.title)}</strong><p>${esc(x.description)}</p></div></li>`).join('')}</ol></section><section class="module"><h3>已知问题与处理</h3>${c.knownIssues.length?c.knownIssues.map(x=>`<div class="issue"><strong>${esc(x)}</strong><p>如遇该问题，请恢复本配置并重新启动；仍未解决时查看游戏运行记录。</p></div>`).join(''):'<p class="caption" style="margin-top:8px">暂无影响游玩的已知问题</p>'}</section><section class="module"><h3>完整配置</h3><table class="config-table"><tbody>${[...c.settings,...c.fullConfig].map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table></section></div></div></div>`}
    function render(){['catalog','game','gpu','config'].forEach(v=>document.getElementById(`${v}-view`).classList.toggle('active',state.view===v));if(state.view==='catalog')renderCatalog();if(state.view==='game')renderGame();if(state.view==='gpu')renderGpu();if(state.view==='config')renderConfig()}
    function openGame(gameId,gpuId,from='catalog'){if(!gameBy(gameId))return;state.selectedGameId=gameId;state.selectedGpuId=gpuId&&recordFor(gameId,gpuId)?gpuId:(recordFor(gameId,state.context?.gpuId)?.gpuId||recordsForGame(gameId)[0]?.gpuId||null);state.gameReturnView=from;state.view='game';state.detailFamily='all';resetAction();render();document.getElementById('game-view').scrollTop=0}
    function openGpu(gpuId){if(!gpuBy(gpuId))return;state.selectedGpuId=gpuId;state.view='gpu';resetAction();render();document.getElementById('gpu-view').scrollTop=0}
    function openConfig(configId,from='game'){const c=configBy(configId);if(!c)return;state.selectedConfigId=configId;state.returnView=from;state.view='config';resetAction();render();document.getElementById('config-view').scrollTop=0}
    function resetAction(){clearTimeout(actionTimer);state.actionState='idle';state.actionMessage='';state.actionConfigId=null;state.activeRequestId=null}
    function actionUpdate(kind,message){state.actionState=kind;state.actionMessage=message;render()}
    function finishAction(requestId,configId,kind,message){if(state.activeRequestId!==requestId||state.actionConfigId!==configId)return false;clearTimeout(actionTimer);state.activeRequestId=null;actionUpdate(kind,message);return true}
    async function runConfigAction(id){const c=configBy(id);if(!c)return;clearTimeout(actionTimer);const requestId=`compat_${Date.now()}_${++requestSequence}`;state.actionConfigId=id;state.activeRequestId=requestId;actionUpdate('loading','正在下载配置…');const match=isMatch(c),methodName=match?'downloadAndApplyConfig':'downloadConfig',method=window.GameHubBridge?.[methodName],success=match?'配置已应用':'已保存到配置库',payload={requestId,configId:c.id,gameId:c.gameId,gpuId:c.gpuId};if(typeof method!=='function'){actionTimer=setTimeout(()=>finishAction(requestId,c.id,'success',success),650);return}try{const result=method(payload);if(result&&typeof result.then==='function'){await Promise.race([result,new Promise((_,reject)=>{actionTimer=setTimeout(()=>reject(new Error('timeout')),8000)})]);finishAction(requestId,c.id,'success',success)}else actionTimer=setTimeout(()=>finishAction(requestId,c.id,'error','操作超时，点击重试'),8000)}catch(e){finishAction(requestId,c.id,'error','操作失败，点击重试')}}
    function reconcileFilters(){const gpuIds=new Set(state.gpus.map(g=>g.id)),stores=new Set(state.games.map(g=>g.store)),vendors=new Set(state.gpus.map(g=>g.vendor)),families=new Set(state.gpus.map(g=>g.family));state.gameFilters.gpuIds=state.gameFilters.gpuIds.filter(id=>gpuIds.has(id));state.gameFilters.stores=state.gameFilters.stores.filter(value=>stores.has(value));state.gpuFilters.vendors=state.gpuFilters.vendors.filter(value=>vendors.has(value));state.gpuFilters.families=state.gpuFilters.families.filter(value=>families.has(value));if(!activeGameGpuIds().length)state.gameFilters.statuses=[]}
    function setCatalog(raw){resetAction();const c=normalizeCatalog(raw);state.games=c.games;state.gpus=c.gpus;state.records=c.records;state.configs=c.configs;reconcileFilters();state.catalogStatus='ready';if(state.view==='game'&&!gameBy(state.selectedGameId))state.view='catalog';if(state.view==='gpu'&&!gpuBy(state.selectedGpuId))state.view='catalog';if(state.view==='config'&&!configBy(state.selectedConfigId))state.view='catalog';render()}
    window.GameHubCompatibility={setContext(context){resetAction();state.context=context&&typeof context==='object'?{...readyContext,...context,status:context.status||'ready'}:{status:'unavailable'};if(state.context.status!=='ready')state.localOnly=false;if(!activeGameGpuIds().length)state.gameFilters.statuses=[];render()},setCatalog(catalog){setCatalog(catalog)},setCatalogLoading(){resetAction();state.catalogStatus='loading';state.view='catalog';render()},setCatalogError(){resetAction();state.catalogStatus='error';state.view='catalog';render()},openGame(gameId,gpuId){openGame(gameId,gpuId)},openGpu(gpuId){openGpu(gpuId)},openConfig(configId){openConfig(configId)},setActionResult(result={}){if(!['success','error'].includes(result.status))return false;return finishAction(str(result.requestId),str(result.configId),result.status,str(result.message,result.status==='error'?'操作失败，点击重试':'操作已完成'))}};
    document.addEventListener('input',e=>{if(e.target.id!=='catalog-search')return;state.query=e.target.value;renderCatalog();const input=document.getElementById('catalog-search');input.focus();input.setSelectionRange(input.value.length,input.value.length)});
    document.addEventListener('click',e=>{const reload=e.target.closest('[data-action="reload"]');if(!reload)return;e.stopPropagation();state.catalogStatus='loading';renderCatalog();if(typeof window.GameHubBridge?.reloadCompatibilityCatalog==='function')window.GameHubBridge.reloadCompatibilityCatalog();else setTimeout(()=>setCatalog(mockCatalog),650)},true);
    document.addEventListener('click',e=>{const back=e.target.closest('[data-back],[data-action="back"]');if(back){if(state.view==='config')state.view=state.returnView;else if(state.view==='game'&&state.gameReturnView==='gpu')state.view='gpu';else state.view='catalog';resetAction();render();return}const filterAction=e.target.closest('[data-filter-action]')?.dataset.filterAction;if(filterAction){if(filterAction==='open')state.filterOpen=true;if(filterAction==='close')state.filterOpen=false;if(filterAction==='clear-all')clearFilters();if(filterAction==='clear-group'){const key=state.filterGroupByMode[state.mode];activeFilters()[key]=[]}renderCatalog();return}const filterGroup=e.target.closest('[data-filter-group]');if(filterGroup){state.filterGroupByMode[state.mode]=filterGroup.dataset.filterGroup;state.filterOpen=true;renderCatalog();return}const filterOption=e.target.closest('[data-filter-option]');if(filterOption){const filterKey=filterOption.dataset.filterKey||state.filterGroupByMode[state.mode],group=filterGroups().find(item=>item.key===filterKey);if(!group||group.disabled||!group.options.some(option=>option.value===filterOption.dataset.filterOption))return;state.filterGroupByMode[state.mode]=group.key;const filters=activeFilters();filters[group.key]=toggleValue(filters[group.key],filterOption.dataset.filterOption);if(state.mode==='game'&&group.key==='gpuIds'&&!activeGameGpuIds().length)filters.statuses=[];renderCatalog();return}const mode=e.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;state.query='';state.filterOpen=false;renderCatalog();return}const detailFamily=e.target.closest('[data-detail-family]');if(detailFamily){state.detailFamily=detailFamily.dataset.detailFamily;renderGame();return}const game=e.target.closest('[data-game]');if(game){openGame(game.dataset.game);return}const gpu=e.target.closest('[data-gpu]');if(gpu){openGpu(gpu.dataset.gpu);return}const record=e.target.closest('[data-record-gpu]');if(record){state.selectedGpuId=record.dataset.recordGpu;resetAction();renderGame();return}const gpuGame=e.target.closest('[data-gpu-game]');if(gpuGame){openGame(gpuGame.dataset.gpuGame,gpuGame.dataset.fromGpu,'gpu');return}const configLink=e.target.closest('[data-config]');if(configLink){openConfig(configLink.dataset.config,state.view);return}const apply=e.target.closest('[data-apply-config]');if(apply){runConfigAction(apply.dataset.applyConfig);return}const orientation=e.target.closest('[data-orientation]');if(orientation){document.querySelector('.frame').dataset.orientation=orientation.dataset.orientation;document.querySelectorAll('[data-orientation]').forEach(b=>b.classList.toggle('active',b===orientation));return}const demoContext=e.target.closest('[data-demo-context]');if(demoContext){state.context=demoContext.dataset.demoContext==='ready'?{...readyContext}:{status:'unavailable'};if(state.context.status!=='ready')state.localOnly=false;if(!activeGameGpuIds().length)state.gameFilters.statuses=[];document.querySelectorAll('[data-demo-context]').forEach(b=>b.classList.toggle('active',b===demoContext));render();return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='clear'){state.query='';renderCatalog()}if(action==='clear-filters'){state.query='';clearFilters();renderCatalog()}if(action==='local'){state.localOnly=!state.localOnly;if(!activeGameGpuIds().length)state.gameFilters.statuses=[];renderCatalog()}if(action==='reload'){state.catalogStatus='loading';renderCatalog();if(typeof window.GameHubBridge?.reloadCompatibilityCatalog==='function')window.GameHubBridge.reloadCompatibilityCatalog();else location.reload()}});
    setCatalog(mockCatalog);
    const params=new URLSearchParams(location.search);if(params.get('config_id'))openConfig(params.get('config_id'));else if(params.get('gpu_id'))openGpu(params.get('gpu_id'));else if(params.get('game_id'))openGame(params.get('game_id'),params.get('gpu'));
  </script>
