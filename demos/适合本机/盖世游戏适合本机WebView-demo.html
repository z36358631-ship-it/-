<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>盖世游戏｜游戏兼容性</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #050505;
      --bg-card: #141414;
      --bg-elevated: #1d1d1f;
      --bg-workbench: #0d0e10;
      --border-default: #343434;
      --text-primary: #ffffff;
      --text-secondary: #d8d8dc;
      --text-muted: #85878c;
      --brand-gold: #ffcc43;
      --brand-gold-light: #ffd98f;
      --brand-green: #33d8a4;
      --brand-orange: #ffb54a;
      --brand-red: #ff667f;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-2xl: 20px;
      --radius-full: 100px;
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-number: "D-DIN-PRO", "MiSans VF", sans-serif;
    }

    html { color-scheme: dark; }
    body {
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-primary);
      background: var(--bg-workbench);
      font-family: var(--font-primary);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { border: 0; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 2px;
    }

    .workbench {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-workbench);
    }

    .demo-bar {
      width: min(1150px, calc(100vw - 48px));
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      padding: 7px 10px 7px 14px;
      border: 1px solid #2e2e31;
      border-radius: var(--radius-lg);
      background: #17181b;
    }

    .demo-name, .demo-controls { display: flex; align-items: center; gap: 8px; }
    .demo-name { font-size: 14px; }
    .demo-mark {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 7px;
      color: #171717;
      background: var(--brand-gold);
      font-size: 11px;
      font-weight: 700;
    }

    .control {
      min-height: 32px;
      padding: 0 11px;
      border-radius: var(--radius-md);
      color: #9b9da2;
      background: transparent;
    }
    .control:hover { color: var(--text-primary); background: #242529; }
    .control.active { color: #171717; background: var(--brand-gold); font-weight: 650; }

    .frame {
      width: min(1150px, calc(100vw - 48px));
      height: min(780px, calc(100vh - 116px));
      min-height: 560px;
      overflow: hidden;
      border: 1px solid #2e2e31;
      border-radius: var(--radius-2xl);
      background: var(--bg-primary);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
      transition: width .2s ease, height .2s ease;
    }
    .frame[data-preview="mobile"] { width: 390px; height: 844px; min-height: 0; }

    .app {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg-primary);
      scrollbar-width: thin;
      scrollbar-color: #3b3b3e transparent;
    }

    .page {
      width: min(100%, 1150px);
      min-height: 100%;
      margin: auto;
      padding: 24px 28px 40px;
    }

    .page-header { padding: 8px 0 24px; }
    .back-button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      color: var(--brand-gold);
      background: transparent;
      font-size: 14px;
    }
    .back-button:hover { color: var(--brand-gold-light); }
    .page-header h1 { font-size: 32px; font-weight: 520; line-height: 42px; }
    .page-header p { margin-top: 6px; color: var(--text-muted); font-size: 14px; line-height: 20px; }

    .filter-card, .result-card {
      border: 1px solid var(--border-default);
      border-radius: 14px;
      background: rgba(20, 20, 20, .96);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      padding: 20px;
    }
    .filter-field { position: relative; min-width: 0; }
    .filter-field label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 330;
      line-height: 17px;
    }
    .select-trigger, .filter-field select {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--border-default);
      border-radius: 9px;
      color: var(--text-muted);
      background: #0d0d0e;
      text-align: left;
    }
    .select-trigger:hover, .filter-field select:hover { border-color: #555559; }
    .select-trigger.selected { color: var(--text-primary); }
    .select-trigger > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .select-chevron { color: var(--text-muted); font-size: 16px; transition: transform .16s ease; }
    .select-trigger[aria-expanded="true"] .select-chevron { transform: rotate(180deg); }
    .filter-field select { appearance: none; cursor: pointer; }
    .rating-wrap { position: relative; }
    .rating-wrap::after {
      content: "⌄";
      position: absolute;
      top: 50%;
      right: 12px;
      color: var(--text-muted);
      pointer-events: none;
      transform: translateY(-54%);
    }
    .field-clear {
      min-height: 25px;
      display: block;
      margin: 5px 0 -5px auto;
      padding: 0 2px;
      color: var(--text-muted);
      background: transparent;
      font-size: 11px;
    }
    .field-clear:hover { color: var(--brand-gold); }

    .picker {
      position: absolute;
      z-index: 30;
      top: 76px;
      left: 0;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-default);
      border-radius: 10px;
      background: #171719;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
    }
    .picker input {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--border-default);
      border-radius: 7px;
      color: var(--text-primary);
      background: #0d0d0e;
    }
    .picker input::placeholder { color: #6d6f74; }
    .picker-list {
      max-height: 280px;
      margin-top: 7px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #3b3b3e transparent;
    }
    .picker-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px;
      border-radius: 7px;
      background: transparent;
      text-align: left;
    }
    .picker-option:hover { background: var(--bg-elevated); }
    .picker-cover {
      position: relative;
      width: 32px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 5px;
      color: var(--brand-gold);
      background: #27272a;
      font-size: 9px;
      font-weight: 700;
    }
    .picker-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .picker-option > span:last-child, .picker-option strong, .picker-option small { min-width: 0; display: block; }
    .picker-option strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .picker-option small { margin-top: 3px; color: var(--text-muted); font-size: 10px; line-height: 14px; }
    .picker-empty { padding: 18px; text-align: center; color: var(--text-muted); font-size: 12px; }

    .popular-section, .result-section { margin-top: 18px; padding: 20px; }
    .section-head, .result-summary {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-head h2, .result-summary h2 { font-size: 20px; font-weight: 520; line-height: 28px; }
    .section-head p, .result-summary p { margin-top: 3px; color: var(--text-muted); font-size: 12px; line-height: 17px; }
    .popular-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
    .popular-game { min-width: 0; padding: 0; background: transparent; text-align: left; }
    .popular-game:hover .game-cover { border-color: rgba(255, 204, 67, .72); transform: translateY(-2px); }
    .popular-game:active .game-cover { transform: translateY(0); }
    .game-cover {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 2 / 3;
      border: 1px solid #303034;
      border-radius: 10px;
      background: var(--bg-elevated);
      transition: transform .16s ease, border-color .16s ease;
    }
    .game-cover img { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
    .cover-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--brand-gold); font-weight: 700; }
    .popular-game strong {
      display: block;
      margin-top: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 520;
      line-height: 20px;
    }
    .popular-game > span:last-child { display: block; margin-top: 2px; color: var(--text-muted); font-size: 10px; line-height: 14px; }

    .result-summary > button, .state-panel button {
      min-height: 34px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      color: #171717;
      background: var(--brand-gold);
      font-size: 11px;
      font-weight: 650;
    }
    .result-summary > button:hover, .state-panel button:hover { background: var(--brand-gold-light); }
    .result-desktop { overflow-x: auto; }
    .result-mobile { display: none; }
    .result-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .result-table th, .result-table td {
      padding: 12px 9px;
      border-bottom: 1px solid #29292c;
      text-align: left;
      vertical-align: top;
      line-height: 1.5;
    }
    .result-table tbody tr:last-child td { border-bottom: 0; }
    .result-table tbody tr:hover { background: rgba(255, 255, 255, .025); }
    .result-table th { color: #bbbcc0; font-weight: 600; white-space: nowrap; }
    .result-table th button { display: inline-flex; align-items: center; gap: 4px; color: inherit; background: transparent; }
    .result-table th button:hover { color: var(--brand-gold); }
    .result-table small { display: block; margin-top: 3px; color: var(--text-muted); }
    .game-cell { min-width: 128px; display: flex; align-items: center; gap: 8px; }
    .cell-cover {
      position: relative;
      width: 34px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 5px;
      color: var(--brand-gold);
      background: var(--bg-elevated);
      font-size: 9px;
      font-weight: 700;
    }
    .cell-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .game-cell > span, .game-cell strong { min-width: 0; display: block; }
    .rating { color: var(--brand-gold); white-space: nowrap; letter-spacing: 1px; }
    .fps { color: var(--text-primary); font-family: var(--font-number); font-weight: 600; white-space: nowrap; }
    .tag {
      display: inline-flex;
      margin: 0 4px 4px 0;
      padding: 3px 6px;
      border-radius: var(--radius-full);
      color: #ffd977;
      background: rgba(255, 204, 67, .1);
      white-space: nowrap;
    }

    .mobile-run { padding: 13px; border: 1px solid #303034; border-radius: 11px; background: #18181a; }
    .mobile-run-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .mobile-run-head > div:last-child { flex: 0 0 auto; text-align: right; }
    .mobile-run-head > div:last-child strong { display: block; margin-top: 4px; font-family: var(--font-number); }
    .mobile-run dl { margin-top: 12px; }
    .mobile-run dl > div { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid #29292c; }
    .mobile-run dt { color: var(--text-muted); font-size: 10px; line-height: 14px; }
    .mobile-run dd { min-width: 0; color: var(--text-secondary); font-size: 10px; line-height: 1.5; overflow-wrap: anywhere; }

    .state-panel {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 28px;
      text-align: center;
    }
    .state-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin-bottom: 12px;
      border: 1px solid #38383b;
      border-radius: 50%;
      color: var(--brand-gold);
      background: var(--bg-elevated);
      font-size: 18px;
    }
    .state-panel h2 { font-size: 20px; font-weight: 520; line-height: 28px; }
    .state-panel p { max-width: 360px; margin: 7px 0 14px; color: var(--text-muted); font-size: 12px; line-height: 1.6; }
    .loading-dot { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.9); } }

    .frame[data-preview="mobile"] .page { padding: 16px 14px 28px; }
    .frame[data-preview="mobile"] .page-header { padding-bottom: 18px; }
    .frame[data-preview="mobile"] .page-header h1 { font-size: 26px; line-height: 34px; }
    .frame[data-preview="mobile"] .page-header p { font-size: 12px; line-height: 17px; }
    .frame[data-preview="mobile"] .back-button { margin-bottom: 12px; }
    .frame[data-preview="mobile"] .filter-grid { grid-template-columns: 1fr; padding: 16px; }
    .frame[data-preview="mobile"] .picker { position: absolute; top: 76px; right: 0; left: 0; width: auto; }
    .frame[data-preview="mobile"] .popular-section, .frame[data-preview="mobile"] .result-section { padding: 15px; }
    .frame[data-preview="mobile"] .popular-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .frame[data-preview="mobile"] .result-desktop { display: none; }
    .frame[data-preview="mobile"] .result-mobile { display: grid; gap: 10px; }

    @media (max-width: 520px) {
      .workbench { display: block; padding: 0; }
      .demo-bar {
        position: fixed;
        z-index: 80;
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        width: auto;
        min-height: 40px;
        margin: 0;
        padding: 4px;
        border-radius: 10px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, .55);
      }
      .demo-name { display: none; }
      .frame, .frame[data-preview="desktop"], .frame[data-preview="mobile"] { width: 100vw; height: 100vh; min-height: 0; border: 0; border-radius: 0; }
      .frame .page { padding: 16px 14px 84px; }
      .frame .page-header { padding-bottom: 18px; }
      .frame .page-header h1 { font-size: 26px; line-height: 34px; }
      .frame .page-header p { font-size: 12px; line-height: 17px; }
      .frame .back-button { margin-bottom: 12px; }
      .frame .filter-grid { grid-template-columns: 1fr; padding: 16px; }
      .frame .picker { position: fixed; top: 78px; right: 12px; left: 12px; width: auto; }
      .frame .popular-section, .frame .result-section { padding: 15px; }
      .frame .popular-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .frame .result-desktop { display: none; }
      .frame .result-mobile { display: grid; gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

        { id: "run_sekiro_13", gameId: "steam_814380", targetId: "oneplus_13", gpu: "Adreno 830", androidVersion: "15", appVersion: "6.1.0", kernelVersion: "Wine 9.2 · GS3", rating: 5, avgFps: 52, tags: ["基本流畅"], notes: "过场动画可能短暂掉帧。", sampleCount: 64, verifiedAt: "2026-08-01" },
        { id: "run_sekiro_14", gameId: "steam_814380", targetId: "xiaomi_14", gpu: "Adreno 750", androidVersion: "15", appVersion: "6.1.0", kernelVersion: "Wine 9.2 · GS3", rating: 4, avgFps: 46, tags: ["基本流畅"], notes: "建议中画质。", sampleCount: 48, verifiedAt: "2026-07-31" },
        { id: "run_cp_13", gameId: "gog_1091500", targetId: "oneplus_13", gpu: "Adreno 830", androidVersion: "15", appVersion: "6.1.0", kernelVersion: "Wine 9.2 · GS3", rating: 3, avgFps: 31, tags: ["可运行", "波动明显"], notes: "市中心驾驶场景可能降至 25 FPS。", sampleCount: 41, verifiedAt: "2026-07-31" },
        { id: "run_cp_14", gameId: "gog_1091500", targetId: "xiaomi_14", gpu: "Adreno 750", androidVersion: "15", appVersion: "6.1.0", kernelVersion: "Wine 9.2 · GS3", rating: 2, avgFps: 22, tags: ["不建议"], notes: "当前体验不稳定。", sampleCount: 22, verifiedAt: "2026-07-28" },
        { id: "run_star_13", gameId: "steam_1716740", targetId: "oneplus_13", gpu: "Adreno 830", androidVersion: "15", appVersion: "6.1.0", kernelVersion: "Wine 9.2 · GS3", rating: 2, avgFps: 19, tags: ["样本较少"], notes: "仅完成启动与短时测试。", sampleCount: 2, verifiedAt: "2026-07-26" },
        { id: "run_hades_mali", gameId: "steam_1145360", targetId: "mali_g720", gpu: "Mali-G720", androidVersion: "14", appVersion: "6.1.0", kernelVersion: "Wine 9.1 · GS3", rating: 4, avgFps: 55, tags: ["基本流畅"], notes: "个别房间切换会短暂卡顿。", sampleCount: 34, verifiedAt: "2026-07-29" }
      ]
    };

    const esc = value => String(value ?? "").replace(/[&<>'"]/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;"
    })[character]);
    const text = (value, fallback = "") => (typeof value === "string" || typeof value === "number")
      ? String(value).slice(0, 240)
      : fallback;
    const list = value => Array.isArray(value) ? value : [];
    const uniqueBy = (items, keyOf) => {
      const seen = new Set();
      return items.filter(item => {
        const key = keyOf(item);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    };
    const finiteNumber = value => {
      if (value === "" || value == null) return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    };

    function normalizeCatalog(raw = {}) {
      raw = raw && typeof raw === "object" ? raw : {};

      const games = uniqueBy(list(raw.games).filter(Boolean).map(item => ({
        id: text(item.id).trim(),
        name: text(item.name).trim(),
        aliases: list(item.aliases).slice(0, 10).map(value => text(value).trim()).filter(Boolean),
        version: text(item.version, "未记录").trim() || "未记录",
        coverKey: Object.prototype.hasOwnProperty.call(coverMap, item.coverKey) ? item.coverKey : "",
        popular: Math.min(999, Math.max(1, finiteNumber(item.popular) ?? 999))
      })).filter(item => item.id && item.name), item => item.id);

      const targets = uniqueBy(list(raw.targets).filter(Boolean).map(item => ({
        id: text(item.id).trim(),
        type: ["device", "gpu"].includes(item.type) ? item.type : "gpu",
        displayName: text(item.displayName).trim(),
        aliases: list(item.aliases).slice(0, 10).map(value => text(value).trim()).filter(Boolean),
        deviceModel: text(item.deviceModel, "未记录").trim() || "未记录",
        soc: text(item.soc, "未记录").trim() || "未记录",
        gpu: text(item.gpu, "未记录").trim() || "未记录"
      })).filter(item => item.id && item.displayName), item => item.id);

      const gameIds = new Set(games.map(item => item.id));
      const targetIds = new Set(targets.map(item => item.id));
      const runs = uniqueBy(list(raw.runs).filter(Boolean).map(item => {
        const rating = finiteNumber(item.rating);
        const fps = finiteNumber(item.avgFps);
        return {
          id: text(item.id).trim(),
          gameId: text(item.gameId).trim(),
          targetId: text(item.targetId).trim(),
          gpu: text(item.gpu, "未记录").trim() || "未记录",
          androidVersion: text(item.androidVersion, "未记录").trim() || "未记录",
          appVersion: text(item.appVersion, "未记录").trim() || "未记录",
          kernelVersion: text(item.kernelVersion, "未记录").trim() || "未记录",
          rating: rating == null ? null : Math.min(5, Math.max(1, rating)),
          avgFps: fps == null ? null : Math.min(240, Math.max(0, fps)),
          tags: list(item.tags).slice(0, 5).map(value => text(value).trim()).filter(Boolean),
          notes: text(item.notes, "—").trim() || "—",
          sampleCount: Math.min(1000000, Math.max(0, finiteNumber(item.sampleCount) ?? 0)),
          verifiedAt: /^\d{4}-\d{2}-\d{2}$/.test(text(item.verifiedAt)) ? text(item.verifiedAt) : "未记录"
        };
      }).filter(item => item.id && gameIds.has(item.gameId) && targetIds.has(item.targetId) && item.rating != null), item => item.id);

      return { games, targets, runs };
    }

    const gameBy = id => state.games.find(item => item.id === id);
    const targetBy = id => state.targets.find(item => item.id === id);
    const coverFor = game => coverMap[game?.coverKey] || "";
    const normalizeQuery = value => String(value || "").toLocaleLowerCase().replace(/\s+/g, " ").trim();
    const matches = (query, values) => !query || values.some(value => normalizeQuery(value).includes(query));

    function coverMarkup(game, className, alternative = "") {
      const source = coverFor(game);
      return `<span class="${className}"><span aria-hidden="true">GH</span>${source ? `<img src="${esc(source)}" alt="${esc(alternative)}">` : ""}</span>`;
    }

    function selector({ id, label, placeholder, value, query, items, type }) {
      const open = state.openPicker === type;
      const triggerIdentity = type === "game" ? 'id="game-select"' : 'id="target-select"';
      const options = items.map(item => {
        const name = type === "game" ? item.name : item.displayName;
        const details = type === "target" ? `${item.deviceModel} · ${item.soc} · ${item.gpu}` : "";
        return `<button class="picker-option" data-select-${type}="${esc(item.id)}" type="button">${type === "game" ? coverMarkup(item, "picker-cover", "") : ""}<span><strong>${esc(name)}</strong>${details ? `<small>${esc(details)}</small>` : ""}</span></button>`;
      }).join("") || `<p class="picker-empty">没有匹配项</p>`;

      return `<div class="filter-field"><label id="${id}-label" for="${id}">${label}</label><button ${triggerIdentity} class="select-trigger ${value ? "selected" : ""}" data-open-picker="${type}" aria-expanded="${open}" aria-labelledby="${id}-label ${id}" type="button"><span>${esc(value || placeholder)}</span><span class="select-chevron" aria-hidden="true">⌄</span></button>${open ? `<div class="picker"><input data-picker-input="${type}" value="${esc(query)}" placeholder="搜索${esc(label)}" aria-label="搜索${esc(label)}"><div class="picker-list">${options}</div></div>` : ""}${value ? `<button class="field-clear" data-clear-field="${type}" type="button">清除</button>` : ""}</div>`;
    }

    function renderFilters() {
      const gameQuery = normalizeQuery(state.gameQuery);
      const targetQuery = normalizeQuery(state.targetQuery);
      const games = state.games.filter(game => matches(gameQuery, [game.name, ...game.aliases]));
      const targets = state.targets.filter(target => matches(targetQuery, [
        target.displayName, target.deviceModel, target.soc, target.gpu, ...target.aliases
      ]));

      return `<div class="filter-grid">${selector({
        id: "game-select",
        label: "选择游戏",
        placeholder: "搜索游戏名称",
        value: gameBy(state.gameId)?.name,
        query: state.gameQuery,
        items: games,
        type: "game"
      })}${selector({
        id: "target-select",
        label: "设备 / GPU",
        placeholder: "搜索手机型号或 GPU",
        value: targetBy(state.targetId)?.displayName,
        query: state.targetQuery,
        items: targets,
        type: "target"
      })}<div class="filter-field"><label for="rating-select">最低评价（可选）</label><div class="rating-wrap"><select id="rating-select" aria-label="最低评价"><option value="">全部评价</option><option value="5">5 分</option><option value="4">4 分及以上</option><option value="3">3 分及以上</option><option value="2">2 分及以上</option><option value="1">1 分及以上</option></select></div>${state.ratingMin ? `<button class="field-clear" data-clear-field="rating" type="button">清除</button>` : ""}</div></div>`;
    }

    function hasFilters() {
      return Boolean(state.gameId || state.targetId || state.ratingMin);
    }

    function filteredRuns() {
      const direction = state.sortDirection === "asc" ? 1 : -1;
      const selectedTarget = targetBy(state.targetId);
      return state.runs
        .filter(run => !state.gameId || run.gameId === state.gameId)
        .filter(run => {
          if (!selectedTarget) return true;
          return selectedTarget.type === "gpu"
            ? normalizeQuery(run.gpu) === normalizeQuery(selectedTarget.gpu)
            : run.targetId === selectedTarget.id;
        })
        .filter(run => state.ratingMin == null || run.rating >= state.ratingMin)
        .sort((left, right) => {
          const primary = state.sortField === "verifiedAt"
            ? String(left.verifiedAt).localeCompare(String(right.verifiedAt))
            : left.rating - right.rating;
          if (primary) return primary * direction;
          return String(right.verifiedAt).localeCompare(String(left.verifiedAt));
        });
    }

    function renderPopularGames() {
      const popular = [...state.games].sort((left, right) => left.popular - right.popular).slice(0, 6);
      return `<section class="result-card popular-section"><div class="section-head"><div><h2>热门游戏</h2><p>选择游戏，立即查看已验证的设备表现</p></div></div><div class="popular-grid">${popular.map(game => `<button class="popular-game" data-popular-game="${esc(game.id)}" type="button">${coverMarkup(game, "game-cover", `${game.name}封面`)}<strong>${esc(game.name)}</strong><span>查看兼容性</span></button>`).join("")}</div></section>`;
    }

    const stars = rating => `<span class="rating" aria-label="${rating} 分">${"★".repeat(rating)}${"☆".repeat(5 - rating)}</span>`;
    const environment = run => `Android ${run.androidVersion} · 盖世 ${run.appVersion} · ${run.kernelVersion}`;
    const gameCell = game => `<div class="game-cell">${coverMarkup(game, "cell-cover", "")}<span><strong>${esc(game?.name || "未知游戏")}</strong><small>v${esc(game?.version || "未记录")}</small></span></div>`;

    function desktopRow(run) {
      const game = gameBy(run.gameId);
      const target = targetBy(run.targetId);
      return `<tr data-result-row="${esc(run.id)}"><td>${gameCell(game)}</td><td><strong>${esc(target?.displayName || "未知设备 / GPU")}</strong><small>${esc(run.gpu)}</small></td><td>${esc(environment(run))}</td><td>${stars(run.rating)}</td><td><span class="fps">${run.avgFps == null ? "—" : `${run.avgFps} FPS`}</span></td><td>${run.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join("") || "—"}</td><td>${esc(run.notes)}</td><td>${run.sampleCount} 个样本<br><small>${esc(run.verifiedAt)}</small></td></tr>`;
    }

    function mobileCard(run) {
      const game = gameBy(run.gameId);
      const target = targetBy(run.targetId);
      return `<article class="mobile-run" data-result-card="${esc(run.id)}"><div class="mobile-run-head">${gameCell(game)}<div>${stars(run.rating)}<strong>${run.avgFps == null ? "—" : `${run.avgFps} FPS`}</strong></div></div><dl><div><dt>设备 / GPU</dt><dd>${esc(target?.displayName || "未知设备 / GPU")} · ${esc(run.gpu)}</dd></div><div><dt>运行环境</dt><dd>${esc(environment(run))}</dd></div><div><dt>问题与备注</dt><dd>${run.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join("") || "—"} ${esc(run.notes)}</dd></div><div><dt>验证信息</dt><dd>${run.sampleCount} 个样本 · ${esc(run.verifiedAt)}</dd></div></dl></article>`;
    }

    function renderResults() {
      const runs = filteredRuns();
      if (!runs.length) return statePanel("暂无符合条件的兼容记录", "可以调整条件或清空筛选后重新查看。", "clear");
      const head = field => {
        const sortAttribute = field === "rating" ? 'data-sort-field="rating"' : 'data-sort-field="verifiedAt"';
        return `<button ${sortAttribute} type="button">${field === "rating" ? "兼容评价" : "验证时间"}${state.sortField === field ? (state.sortDirection === "desc" ? " ↓" : " ↑") : ""}</button>`;
      };
      return `<section class="result-card result-section"><div class="result-summary"><div><h2>兼容结果</h2><p>共 ${runs.length} 条已验证记录</p></div><button data-clear-all type="button">清空筛选</button></div><div class="result-desktop"><table class="result-table"><thead><tr><th>游戏</th><th>设备 / GPU</th><th>运行环境</th><th>${head("rating")}</th><th>平均 FPS</th><th>问题标签</th><th>备注</th><th>${head("verifiedAt")}</th></tr></thead><tbody>${runs.map(desktopRow).join("")}</tbody></table></div><div class="result-mobile">${runs.map(mobileCard).join("")}</div></section>`;
    }

    function statePanel(title, copy, action = "") {
      const loading = state.catalogStatus === "loading";
      const icon = loading ? "…" : action === "reload" ? "↻" : "—";
      const label = action === "reload" ? "重新加载" : "清空筛选";
      return `<section class="result-card state-panel"><span class="state-icon ${loading ? "loading-dot" : ""}" aria-hidden="true">${icon}</span><h2>${esc(title)}</h2><p>${esc(copy)}</p>${action ? `<button data-state-action="${action}" type="button">${label}</button>` : ""}</section>`;
    }

    function render() {
      let content = "";
      if (state.catalogStatus === "loading") {
        content = statePanel("正在加载兼容数据", "正在获取游戏、设备和验证记录。");
      } else if (state.catalogStatus === "error") {
        content = statePanel("兼容数据加载失败", "暂时无法获取兼容记录，请稍后重试。", "reload");
      } else if (!state.games.length || !state.targets.length) {
        content = statePanel("暂无兼容数据", "当前没有可展示的游戏或设备记录。", "reload");
      } else {
        content = hasFilters() ? renderResults() : renderPopularGames();
      }

      document.getElementById("compatibility-app").innerHTML = `<div class="page"><header class="page-header"><button class="back-button" data-back type="button" aria-label="返回">← 返回</button><h1>游戏兼容性</h1><p>查看你的游戏能否在当前设备上流畅运行</p></header><section class="filter-card">${renderFilters()}</section>${content}</div>`;
      const rating = document.getElementById("rating-select");
      if (rating) rating.value = state.ratingMin == null ? "" : String(state.ratingMin);
    }

    function reconcile() {
      if (state.gameId && !gameBy(state.gameId)) state.gameId = null;
      if (state.targetId && !targetBy(state.targetId)) {
        state.targetId = null;
        state.targetType = null;
      }
    }

    function setCatalog(raw) {
      const catalog = normalizeCatalog(raw);
      state.games = catalog.games;
      state.targets = catalog.targets;
      state.runs = catalog.runs;
      state.catalogStatus = "ready";
      reconcile();
      render();
    }

    function clearAllFilters() {
      Object.assign(state, {
        gameId: null,
        targetType: null,
        targetId: null,
        ratingMin: null,
        openPicker: null,
        gameQuery: "",
        targetQuery: ""
      });
      render();
    }

    document.addEventListener("input", event => {
      if (event.target.matches('[data-picker-input="game"]')) state.gameQuery = event.target.value;
      else if (event.target.matches('[data-picker-input="target"]')) state.targetQuery = event.target.value;
      else return;
      render();
      const input = document.querySelector(`[data-picker-input="${state.openPicker}"]`);
      input?.focus();
      input?.setSelectionRange(input.value.length, input.value.length);
    });

    document.addEventListener("change", event => {
      if (event.target.id !== "rating-select") return;
      state.ratingMin = event.target.value ? Number(event.target.value) : null;
      render();
    });

    document.addEventListener("click", event => {
      const preview = event.target.closest(".demo-controls [data-preview]");
      if (preview) {
        document.querySelector(".frame").dataset.preview = preview.dataset.preview;
        document.querySelectorAll(".demo-controls [data-preview]").forEach(button => {
          button.classList.toggle("active", button === preview);
        });
        return;
      }

      const popular = event.target.closest("[data-popular-game]");
      if (popular) {
        state.gameId = popular.dataset.popularGame;
        state.openPicker = null;
        render();
        return;
      }

      const open = event.target.closest("[data-open-picker]");
      if (open) {
        state.openPicker = state.openPicker === open.dataset.openPicker ? null : open.dataset.openPicker;
        render();
        if (state.openPicker) requestAnimationFrame(() => document.querySelector(`[data-picker-input="${state.openPicker}"]`)?.focus());
        return;
      }

      const game = event.target.closest("[data-select-game]");
      if (game) {
        state.gameId = game.dataset.selectGame;
        state.gameQuery = "";
        state.openPicker = null;
        render();
        return;
      }

      const target = event.target.closest("[data-select-target]");
      if (target) {
        state.targetId = target.dataset.selectTarget;
        state.targetType = targetBy(state.targetId)?.type || null;
        state.targetQuery = "";
        state.openPicker = null;
        render();
        return;
      }

      const clear = event.target.closest("[data-clear-field]");
      if (clear) {
        if (clear.dataset.clearField === "game") state.gameId = null;
        if (clear.dataset.clearField === "target") {
          state.targetId = null;
          state.targetType = null;
        }
        if (clear.dataset.clearField === "rating") state.ratingMin = null;
        render();
        return;
      }

      if (event.target.closest("[data-clear-all]")) {
        clearAllFilters();
        return;
      }

      const sort = event.target.closest("[data-sort-field]");
      if (sort) {
        const field = sort.dataset.sortField;
        if (state.sortField === field) state.sortDirection = state.sortDirection === "desc" ? "asc" : "desc";
        else {
          state.sortField = field;
          state.sortDirection = "desc";
        }
        render();
        return;
      }

      const stateAction = event.target.closest("[data-state-action]");
      if (stateAction?.dataset.stateAction === "clear") {
        clearAllFilters();
        return;
      }
      if (stateAction?.dataset.stateAction === "reload") {
        state.catalogStatus = "loading";
        render();
        if (typeof window.GameHubBridge?.reloadCompatibilityCatalog === "function") {
          window.GameHubBridge.reloadCompatibilityCatalog();
        } else {
          setTimeout(() => setCatalog(mockCatalog), 500);
        }
        return;
      }

      if (event.target.closest("[data-back]")) {
        window.history.back();
        return;
      }

      if (state.openPicker && !event.target.closest(".picker")) {
        state.openPicker = null;
        render();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape" || !state.openPicker) return;
      const picker = state.openPicker;
      state.openPicker = null;
      render();
      document.querySelector(`[data-open-picker="${picker}"]`)?.focus();
    });

    window.GameHubCompatibility = {
      setContext(context) {
        state.context = context && typeof context === "object" ? context : null;
        const targetId = text(context?.targetId).trim();
        if (targetId && targetBy(targetId)) {
          state.targetId = targetId;
          state.targetType = targetBy(targetId).type;
        }
        render();
      },
      setCatalog(catalog) { setCatalog(catalog); },
      setCatalogLoading() {
        state.catalogStatus = "loading";
        render();
      },
      setCatalogError() {
        state.catalogStatus = "error";
        render();
      }
    };

    setCatalog(mockCatalog);
  </script>
</body>
</html>
