<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>盖世游戏｜游戏兼容性</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #000000;
      --bg-card: #1a1a1a;
      --bg-elevated: #252525;
      --bg-overlay: #28202a;
      --text-primary: #ffffff;
      --text-secondary: #e6e6e6;
      --text-tertiary: #f2f2f2;
      --text-muted: #7b7b7b;
      --text-disabled: #646464;
      --brand-gold: #ffcc43;
      --brand-gold-light: #ffd98f;
      --brand-green: #33d8a4;
      --brand-blue: #338feb;
      --border-default: #353d4e;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-2xl: 20px;
      --radius-full: 100px;
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-number: "D-DIN-PRO", "MiSans VF", sans-serif;
    }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-primary);
      background:
        radial-gradient(circle at 24% 0%, rgba(255, 204, 67, .08), transparent 26rem),
        #0d0e10;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button {
      border: 0;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 2px;
    }
    img { display: block; }
    .workbench {
      min-height: 100vh;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 12px;
      padding: 20px;
    }
    .demo-bar {
      width: min(1120px, calc(100vw - 40px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #c7c8cc;
      font-size: 13px;
    }
    .demo-name, .demo-toolbar, .demo-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo-toolbar { flex-wrap: wrap; justify-content: flex-end; }
    .demo-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: var(--brand-gold);
      color: #17130a;
      font-weight: 760;
      letter-spacing: -.4px;
    }
    .demo-controls {
      padding: 3px;
      border: 1px solid #2e3035;
      border-radius: 10px;
      background: rgba(24, 25, 28, .92);
    }
    .control {
      min-width: 66px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 7px;
      background: transparent;
      color: #8f9198;
      font-size: 12px;
      transition: background .18s ease, color .18s ease;
    }
    .control:hover { color: #fff; }
    .control.active {
      background: #32343a;
      color: var(--brand-gold);
    }
    .frame {
      width: min(1120px, calc(100vw - 40px));
      height: min(810px, calc(100vh - 92px));
      overflow: hidden;
      border: 1px solid #303238;
      border-radius: var(--radius-2xl);
      background: var(--bg-primary);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .48);
      transition: width .22s ease, height .22s ease, border-radius .22s ease;
    }
    .frame[data-preview="mobile"] {
      width: 390px;
      height: 844px;
      max-width: calc(100vw - 28px);
      max-height: calc(100vh - 86px);
    }
    .app {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      background:
        radial-gradient(circle at 90% -8%, rgba(255, 204, 67, .12), transparent 19rem),
        var(--bg-primary);
      scrollbar-width: none;
    }
    .app::-webkit-scrollbar { display: none; }
    .page {
      width: min(100%, 1120px);
      min-height: 100%;
      margin: 0 auto;
      padding: 28px;
    }
    .page-header { position: relative; padding-bottom: 22px; }
    .header-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .back-button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 10px 0 0;
      background: transparent;
      color: var(--text-secondary);
      text-align: left;
      font-size: 14px;
    }
    .back-button:hover { color: var(--brand-gold); }
    .platform-pill, .platform-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 11px;
      border: 1px solid rgba(255, 204, 67, .34);
      border-radius: var(--radius-full);
      background: rgba(255, 204, 67, .1);
      color: var(--brand-gold-light);
      font-size: 12px;
      font-weight: 520;
      letter-spacing: .2px;
    }
    .page-header h1 {
      font-size: 32px;
      font-weight: 620;
      line-height: 42px;
      letter-spacing: -.8px;
    }
    .page-header > p {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 20px;
    }
    .search-section { position: relative; z-index: 4; }
    .search-box {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      min-height: 58px;
      padding: 0 12px 0 16px;
      border: 1px solid #3a3b3f;
      border-radius: var(--radius-xl);
      background: rgba(27, 27, 29, .94);
      box-shadow: inset 0 1px rgba(255, 255, 255, .035), 0 12px 30px rgba(0, 0, 0, .24);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .search-box:focus-within {
      border-color: rgba(255, 204, 67, .72);
      box-shadow: 0 0 0 3px rgba(255, 204, 67, .09), 0 16px 36px rgba(0, 0, 0, .28);
    }
    .search-icon {
      color: var(--brand-gold);
      font-size: 23px;
      line-height: 1;
      transform: rotate(-18deg);
    }
    .search-box input {
      width: 100%;
      min-height: 56px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
    }
    .search-box input::placeholder { color: #777980; }
    .clear-search {
      width: 44px;
      min-height: 44px;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-muted);
      font-size: 22px;
    }
    .clear-search:hover { color: #fff; }
    .search-results {
      display: grid;
      gap: 2px;
      margin-top: 8px;
      padding: 6px;
      border: 1px solid #37383d;
      border-radius: var(--radius-xl);
      background: rgba(26, 26, 28, .98);
      box-shadow: 0 18px 44px rgba(0, 0, 0, .46);
    }
    .search-result {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      min-height: 70px;
      gap: 12px;
      padding: 8px;
      border-radius: 11px;
      background: transparent;
      text-align: left;
    }
    .search-result:hover, .search-result:active { background: var(--bg-elevated); }
    .search-result .game-cover { width: 48px; height: 54px; }
    .search-result-copy { min-width: 0; display: grid; gap: 3px; }
    .search-result-copy strong, .popular-copy strong {
      overflow: hidden;
      color: #fff;
      font-size: 15px;
      font-weight: 520;
      line-height: 21px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-result-copy small, .popular-copy small {
      overflow: hidden;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 17px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .candidate-platform {
      padding: 4px 8px;
      border-radius: var(--radius-full);
      background: rgba(51, 216, 164, .1);
      color: var(--brand-green);
      font-size: 10px;
    }
    .empty-inline {
      padding: 24px 16px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }
    .popular-section, .compatibility-result, .state-card {
      margin-top: 18px;
      border: 1px solid #2f3034;
      border-radius: var(--radius-xl);
      background: rgba(20, 20, 21, .92);
      box-shadow: inset 0 1px rgba(255, 255, 255, .025);
    }
    .popular-section { padding: 18px; }
    .section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }
    .section-heading h2 {
      font-size: 20px;
      font-weight: 520;
      line-height: 28px;
    }
    .section-heading p {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 17px;
    }
    .section-kicker {
      padding: 5px 9px;
      border-radius: var(--radius-full);
      background: rgba(255, 204, 67, .1);
      color: var(--brand-gold);
      font-size: 10px;
      white-space: nowrap;
    }
    .popular-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .popular-game {
      overflow: hidden;
      border: 1px solid #303136;
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      text-align: left;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .popular-game:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 204, 67, .42);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .3);
    }
    .popular-game > img, .popular-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      object-position: center 28%;
      background:
        linear-gradient(135deg, rgba(255, 204, 67, .18), transparent),
        var(--bg-elevated);
    }
    .popular-copy { display: grid; gap: 2px; padding: 11px 12px 12px; }
    .compatibility-result { padding: 18px; }
    .result-back {
      min-height: 44px;
      margin-bottom: 10px;
      background: transparent;
      color: var(--brand-gold);
      font-size: 13px;
    }
    .result-hero {
      display: grid;
      grid-template-columns: 112px 1fr;
      align-items: end;
      gap: 18px;
      min-height: 190px;
      padding: 18px;
      overflow: hidden;
      border-radius: var(--radius-xl);
      background:
        linear-gradient(110deg, rgba(255, 204, 67, .15), transparent 48%),
        linear-gradient(180deg, #2a281e, #151516);
      box-shadow: inset 0 1px rgba(255, 255, 255, .055);
    }
    .hero-cover {
      width: 112px;
      height: 156px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      box-shadow: 0 14px 28px rgba(0, 0, 0, .42);
      background: var(--bg-elevated);
    }
    .result-hero-copy { min-width: 0; padding-bottom: 4px; }
    .result-hero h2 {
      margin-top: 12px;
      font-size: 26px;
      font-weight: 620;
      line-height: 34px;
    }
    .result-hero p {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 18px;
    }
    .verdict-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      margin-top: 14px;
      padding: 17px 18px;
      border: 1px solid rgba(255, 204, 67, .19);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(100deg, rgba(255, 204, 67, .14), rgba(255, 204, 67, .025)),
        #1b1a18;
    }
    .verdict-copy { display: grid; gap: 5px; }
    .verdict-copy > span, .metric-row > span, .config-field span {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 17px;
    }
    .verdict-copy strong { font-size: 19px; font-weight: 620; }
    .verdict-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .verdict-tags span {
      padding: 4px 7px;
      border-radius: var(--radius-sm);
      background: rgba(51, 216, 164, .1);
      color: var(--brand-green);
      font-size: 10px;
    }
    .fps {
      display: flex;
      align-items: baseline;
      gap: 4px;
      color: var(--brand-gold);
    }
    .fps strong { font: 700 34px/1 var(--font-number); }
    .fps span { font-size: 11px; }
    .environment-card {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid #303136;
      border-radius: var(--radius-lg);
      background: #303136;
    }
    .metric-row {
      display: grid;
      gap: 6px;
      min-height: 72px;
      padding: 13px 15px;
      background: #1b1b1d;
    }
    .metric-row strong {
      overflow-wrap: anywhere;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 520;
      line-height: 20px;
    }
    .metric-row-wide { grid-column: 1 / -1; }
    .config-section { margin-top: 24px; }
    .config-card {
      overflow: hidden;
      border: 1px solid #313238;
      border-radius: var(--radius-lg);
      background: #19191b;
    }
    .config-card + .config-card { margin-top: 10px; }
    .config-toggle {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      width: 100%;
      min-height: 72px;
      gap: 14px;
      padding: 12px 14px;
      background: transparent;
      text-align: left;
    }
    .config-toggle:hover { background: rgba(255, 255, 255, .025); }
    .config-toggle-copy { display: grid; gap: 4px; min-width: 0; }
    .config-toggle-copy strong { font-size: 15px; font-weight: 520; }
    .config-toggle-copy small {
      overflow: hidden;
      color: var(--text-muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .config-toggle-state { color: var(--brand-gold); font-size: 12px; }
    .config-detail {
      padding: 0 14px 14px;
      border-top: 1px solid #2e2f33;
    }
    .config-summary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
    }
    .config-summary strong {
      color: var(--brand-gold-light);
      font-size: 14px;
      line-height: 20px;
    }
    .config-summary span { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
    .config-applicability {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 204, 67, .14);
      border-radius: var(--radius-md);
      background: rgba(255, 204, 67, .045);
    }
    .config-applicability > strong {
      display: block;
      margin-bottom: 9px;
      color: var(--brand-gold-light);
      font-size: 12px;
      font-weight: 520;
    }
    .config-applicability-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .config-applicability-grid div { display: grid; gap: 4px; min-width: 0; }
    .config-applicability-grid span { color: var(--text-muted); font-size: 10px; line-height: 14px; }
    .config-applicability-grid b {
      overflow-wrap: anywhere;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 520;
      line-height: 17px;
    }
    .config-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .config-field {
      display: grid;
      gap: 5px;
      min-height: 68px;
      padding: 11px 12px;
      border-radius: var(--radius-md);
      background: #242426;
    }
    .config-field strong {
      overflow-wrap: anywhere;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 520;
      line-height: 18px;
    }
    .config-meta {
      margin: 12px 0;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 16px;
    }
    .download-button {
      width: 100%;
      min-height: 48px;
      border-radius: var(--radius-md);
      background: var(--brand-gold);
      color: #16120a;
      font-size: 14px;
      font-weight: 620;
      box-shadow: 0 8px 20px rgba(255, 204, 67, .15);
    }
    .download-button:hover { background: #ffd45f; }
    .download-button:active { transform: translateY(1px); }
    .download-message {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      font-size: 12px;
      line-height: 17px;
    }
    .download-message.pending { background: rgba(51, 143, 235, .12); color: #7fc1ff; }
    .download-message.success { background: rgba(51, 216, 164, .1); color: var(--brand-green); }
    .download-message.error { background: rgba(255, 86, 120, .1); color: #ff8ba2; }
    .state-card {
      display: grid;
      place-items: center;
      min-height: 220px;
      padding: 32px;
      text-align: center;
    }
    .state-card h2, .state-card h3 { font-size: 20px; font-weight: 520; }
    .state-card p {
      max-width: 360px;
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 19px;
    }
    .state-card button {
      min-height: 44px;
      margin-top: 16px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      background: var(--brand-gold);
      color: #16120a;
      font-size: 13px;
      font-weight: 620;
    }
    .empty-subcard {
      padding: 24px 18px;
      border: 1px solid #303136;
      border-radius: var(--radius-lg);
      background: #1b1b1d;
      text-align: center;
    }
    .empty-subcard h3 { font-size: 16px; font-weight: 520; }
    .empty-subcard p { margin-top: 5px; color: var(--text-muted); font-size: 12px; line-height: 17px; }
    .cover-fallback {
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(255, 204, 67, .22), transparent),
        var(--bg-elevated);
      color: var(--brand-gold);
      font-size: 11px;
      text-align: center;
    }
    @media (max-width: 720px) {
      .workbench { padding: 0; display: block; }
      .demo-bar { display: none; }
      .frame, .frame[data-preview="desktop"], .frame[data-preview="mobile"] {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        border: 0;
        border-radius: 0;
      }
    }
    .frame[data-preview="mobile"] .page { padding: 16px 14px 30px; }
    .frame[data-preview="mobile"] .page-header { padding-bottom: 18px; }
    .frame[data-preview="mobile"] .header-topline { margin-bottom: 14px; }
    .frame[data-preview="mobile"] .page-header h1 { font-size: 28px; line-height: 36px; }
    .frame[data-preview="mobile"] .page-header > p { font-size: 12px; line-height: 17px; }
    .frame[data-preview="mobile"] .search-box { min-height: 56px; }
    .frame[data-preview="mobile"] .popular-section,
    .frame[data-preview="mobile"] .compatibility-result { padding: 14px; margin-top: 14px; }
    .frame[data-preview="mobile"] .popular-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .frame[data-preview="mobile"] .popular-game > img,
    .frame[data-preview="mobile"] .popular-cover { aspect-ratio: 16 / 10; }
    .frame[data-preview="mobile"] .result-hero {
      grid-template-columns: 86px 1fr;
      min-height: 154px;
      gap: 14px;
      padding: 14px;
    }
    .frame[data-preview="mobile"] .hero-cover { width: 86px; height: 124px; }
    .frame[data-preview="mobile"] .result-hero h2 { margin-top: 9px; font-size: 21px; line-height: 28px; }
    .frame[data-preview="mobile"] .verdict-card { padding: 14px; }
    .frame[data-preview="mobile"] .fps strong { font-size: 30px; }
    .frame[data-preview="mobile"] .environment-card { grid-template-columns: 1fr 1fr; }
    .frame[data-preview="mobile"] .metric-row { min-height: 68px; padding: 11px 12px; }
    .frame[data-preview="mobile"] .config-section { margin-top: 20px; }
    .frame[data-preview="mobile"] .config-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="workbench">
    <div class="demo-bar">
      <div class="demo-name">
        <span class="demo-mark">GH</span>
        <span>跨平台兼容性 · H5 Demo</span>
      </div>
      <div class="demo-toolbar">
        <div class="demo-controls" aria-label="预览平台">
          <button class="control active" data-demo-platform="android" type="button">Android</button>
          <button class="control" data-demo-platform="mac" type="button">Mac</button>
        </div>
        <div class="demo-controls" aria-label="预览尺寸">
          <button class="control" data-preview="desktop" type="button">网页</button>
          <button class="control active" data-preview="mobile" type="button">竖屏</button>
        </div>
      </div>
    </div>
    <div class="frame" data-preview="mobile">
      <main id="compatibility-app" class="app"></main>
    </div>
  </div>

  <script>
    "use strict";

    const PLATFORM_PRIORITY = "Bridge > query > Demo";
    const DOWNLOAD_TIMEOUT_MS = 3000;
    const allowedCovers = new Set([
      "black-myth-wukong.jpg",
      "elden-ring.jpg",
      "hades.jpg",
      "sekiro.jpg",
      "cyberpunk-2077.jpg",
      "starfield.jpg"
    ]);

    const state = {
      platform: "android",
      platformSource: "demo",
      gameQuery: "",
      selectedGameId: null,
      expandedConfigId: null,
      catalogStatus: "ready",
      download: {
        requestId: null,
        configId: null,
        status: "idle",
        message: ""

    let catalog = { games: [], records: [], configs: [] };
    let downloadTimer = 0;

    function text(value, max = 100) {
      return String(value == null ? "" : value).trim().slice(0, max);
    }

    function esc(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function number(value, min = 0, max = Number.MAX_SAFE_INTEGER) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return min;
      return Math.min(max, Math.max(min, parsed));
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("zh-CN").format(number(value));
    }

    function normalizePlatform(value) {
      const normalized = text(value, 16).toLowerCase();
      return normalized === "android" || normalized === "mac" ? normalized : null;
    }

    function containsCrossPlatformConfig(platform, values) {
      const joined = values.flat(Infinity).map((value) => text(value, 120)).join(" ");
      const forbidden = platform === "android"
        ? /macOS|Apple|MacBook|Mac mini|Mac Studio|Game Porting Toolkit/i
        : /Android|Adreno|骁龙|Snapdragon|手机|Wine/i;
      return forbidden.test(joined);
    }

    function queryPlatform() {
      return normalizePlatform(new URLSearchParams(location.search).get("platform"));
    }

    function resolvePlatform(context) {
      const bridgePlatform = normalizePlatform(context && context.platform);
      if (bridgePlatform) return { platform: bridgePlatform, source: "bridge" };
      const queryValue = queryPlatform();
      if (queryValue) return { platform: queryValue, source: "query" };
      return { platform: "android", source: "demo" };
    }

    function uniqueById(items) {
      const seen = new Set();
      return items.filter((item) => {
        if (!item || !item.id || seen.has(item.id)) return false;
        seen.add(item.id);
        return true;
      });
    }

    function normalizeCatalog(raw = {}) {
      const games = uniqueById((Array.isArray(raw.games) ? raw.games : []).map((item) => {
        if (!item || typeof item !== "object") return null;
        const id = text(item.id, 60);
        const name = text(item.name, 60);
        const platforms = [...new Set((Array.isArray(item.platforms) ? item.platforms : [])
          .map(normalizePlatform).filter(Boolean))];
        if (!id || !name || platforms.length === 0) return null;
        const coverKey = text(item.coverKey, 80);
        return {
          id,
          name,
          englishName: text(item.englishName, 80),
          aliases: (Array.isArray(item.aliases) ? item.aliases : [])
            .map((value) => text(value, 50)).filter(Boolean),
          coverKey: allowedCovers.has(coverKey) ? coverKey : "",
          platforms,
          popularOn: (Array.isArray(item.popularOn) ? item.popularOn : [])
            .map(normalizePlatform).filter((platform) => platforms.includes(platform))
        };
      }).filter(Boolean));

      const gameIds = new Set(games.map((game) => game.id));
      const records = uniqueById((Array.isArray(raw.records) ? raw.records : []).map((item) => {
        if (!item || typeof item !== "object") return null;
        const platform = normalizePlatform(item.platform);
        const gameId = text(item.gameId, 60);
        if (!platform || !gameIds.has(gameId)) return null;
        const game = games.find((candidate) => candidate.id === gameId);
        if (!game.platforms.includes(platform)) return null;
        const source = item.environment && typeof item.environment === "object" ? item.environment : {};
        const environment = platform === "android"
          ? {
              deviceModel: text(source.deviceModel),
              soc: text(source.soc),
              mobileGpu: text(source.mobileGpu),
              androidVersion: text(source.androidVersion),
              appVersion: text(source.appVersion),
              runtime: text(source.runtime)
            }
          : {
              macModel: text(source.macModel),
              appleChip: text(source.appleChip),
              macosVersion: text(source.macosVersion),
              appVersion: text(source.appVersion),
              compatibilityLayer: text(source.compatibilityLayer),
              displayMode: text(source.displayMode)
            };
        return {
          id: text(item.id, 60),
          platform,
          gameId,
          verdict: text(item.verdict, 40),
          rating: number(item.rating, 1, 5),
          avgFps: number(item.avgFps, 0, 240),
          verifiedAt: /^\d{4}-\d{2}-\d{2}$/.test(text(item.verifiedAt, 10))
            ? text(item.verifiedAt, 10) : "未记录",
          tags: (Array.isArray(item.tags) ? item.tags : [])
            .map((value) => text(value, 30)).filter(Boolean).slice(0, 4),
          environment
        };
      }).filter(Boolean));

      const configs = uniqueById((Array.isArray(raw.configs) ? raw.configs : []).map((item) => {
        if (!item || typeof item !== "object") return null;
        const platform = normalizePlatform(item.platform);
        const gameId = text(item.gameId, 60);
        if (!platform || !gameIds.has(gameId)) return null;
        const game = games.find((candidate) => candidate.id === gameId);
        if (!game.platforms.includes(platform)) return null;
        const id = text(item.id, 60);
        if (!id) return null;
        const fields = (Array.isArray(item.fields) ? item.fields : [])
          .filter((pair) => Array.isArray(pair) && pair.length === 2)
          .map(([label, value]) => [text(label, 30), text(value, 80)])
          .filter(([label, value]) => label && value)
          .slice(0, 6);
        const sourceApplicability = item.applicability && typeof item.applicability === "object"
          ? item.applicability : {};
        const applicability = {
          gameVersion: text(sourceApplicability.gameVersion, 40) || "未记录",
          hardware: text(sourceApplicability.hardware, 60) || "未记录",
          systemRange: text(sourceApplicability.systemRange, 60) || "未记录"
        };
        const summary = text(item.summary, 80) || "适用于当前平台";
        if (containsCrossPlatformConfig(
          platform,
          [summary, ...Object.values(applicability), ...fields.flat()]
        )) return null;
        const rawFileName = text(item.fileName, 100).replace(/[^a-zA-Z0-9._-]/g, "-");
        return {
          id,
          platform,
          gameId,
          name: text(item.name, 60) || "启动配置",
          version: text(item.version, 20) || "1.0",
          fileName: rawFileName || (id + ".gamehub.json"),
          fileSize: text(item.fileSize, 20) || "未记录",
          downloadCount: number(item.downloadCount, 0),
          updatedAt: text(item.updatedAt, 10) || "未记录",
          summary,
          applicability,
          fields
        };
      }).filter(Boolean));

      return { games, records, configs };
    }

    function platformLabel() {
      return state.platform === "mac" ? "Mac" : "Android";

    function coverUrl(game) {
      return game && game.coverKey
        ? "assets/compatibility/" + encodeURIComponent(game.coverKey)
        : "";

    function renderCover(game, className) {
      const src = coverUrl(game);
      if (!src) {
        return '<div class="' + esc(className) + ' cover-fallback" aria-label="封面占位">GH</div>';
      }
      return '<img class="' + esc(className) + '" data-cover-image src="' + esc(src) +
        '" alt="' + esc(game.name + "封面") + '">';

    function clearDownloadTimer() {
      if (downloadTimer) window.clearTimeout(downloadTimer);
      downloadTimer = 0;

    function clearDownloadState() {
      clearDownloadTimer();
      state.download = {
        requestId: null,
        configId: null,
        status: "idle",
        message: ""
      };

    function applyPlatform(next, source) {
      if (!normalizePlatform(next)) return;
      if (next === state.platform && source === state.platformSource) return;
      state.platform = next;
      state.platformSource = source;
      state.gameQuery = "";
      state.selectedGameId = null;
      state.expandedConfigId = null;
      clearDownloadState();
      render();
    }

    function filteredCatalog() {
      const games = catalog.games.filter((game) => game.platforms.includes(state.platform));
      const gameIds = new Set(games.map((game) => game.id));
      return {
        games,
        records: catalog.records.filter((record) =>
          record.platform === state.platform && gameIds.has(record.gameId)),
        configs: catalog.configs.filter((config) =>
          config.platform === state.platform && gameIds.has(config.gameId))
      };
    }

    function setCatalog(raw) {
      catalog = normalizeCatalog(raw);
      state.catalogStatus = "ready";
      if (!filteredCatalog().games.some((game) => game.id === state.selectedGameId)) {
        state.selectedGameId = null;
        state.expandedConfigId = null;
        clearDownloadState();
      }
      render();
    }

    function matchingGames() {
      const { games } = filteredCatalog();
      const query = state.gameQuery.trim().toLowerCase();
      if (!query) return [];
      return games.filter((game) => {
        return [game.name, game.englishName, ...game.aliases]
          .join(" ").toLowerCase().includes(query);
      }).slice(0, 6);

        '</div>' +
        '<div class="config-applicability" data-config-applicability>' +
          '<strong>适用范围</strong>' +
          '<div class="config-applicability-grid">' +
            '<div><span>游戏版本</span><b>' + esc(config.applicability.gameVersion) + '</b></div>' +
            '<div><span>' + (state.platform === "android" ? "适用 GPU" : "适用芯片") + '</span>' +
              '<b>' + esc(config.applicability.hardware) + '</b></div>' +
            '<div><span>系统范围</span><b>' + esc(config.applicability.systemRange) + '</b></div>' +
          '</div>' +
        '</div>' +
        '<div class="config-fields">' +
          config.fields.map(([label, value]) =>
            '<div class="config-field"><span>' + esc(label) + '</span>' +
              '<strong>' + esc(value) + '</strong></div>'
          ).join("") +
        '</div>' +
        '<div class="config-meta">更新于 ' + esc(config.updatedAt) + ' · ' +
          formatNumber(config.downloadCount) + ' 次下载</div>' +
        '<button class="download-button" data-config-download="' + esc(config.id) + '" type="button"' +
          (download && download.status === "pending" ? ' disabled' : '') + '>' +
          (download && download.status === "pending" ? "正在下载…" : "下载配置") +
        '</button>' +
        (download && download.message
          ? '<p class="download-message ' + esc(download.status) + '" role="status">' +
              esc(download.message) + '</p>' : '') +
      '</div>';
    }

    function renderCompatibilityResult() {
      const { games, records, configs } = filteredCatalog();
      const game = games.find((item) => item.id === state.selectedGameId);
      if (!game) return renderPopularGames();
      const record = records.find((item) => item.gameId === game.id);
      const gameConfigs = configs.filter((item) => item.gameId === game.id);
      let recordHtml = '<div class="empty-subcard"><h3>暂无验证记录</h3>' +
        '<p>当前平台还没有可靠的运行数据。</p></div>';
      if (record) {
        recordHtml = '<div class="verdict-card">' +
          '<div class="verdict-copy"><span>兼容结论 · 验证于 ' + esc(record.verifiedAt) + '</span>' +
            '<strong>' + esc(record.verdict) + '</strong>' +
            '<div class="verdict-tags">' +
              record.tags.map((tag) => '<span>' + esc(tag) + '</span>').join("") +
            '</div>' +
          '</div>' +
          '<div class="fps"><strong>' + formatNumber(record.avgFps) + '</strong><span>FPS</span></div>' +
        '</div>' +
        '<div class="environment-card">' + renderEnvironment(record) + '</div>';
      }
      const configHtml = gameConfigs.length
        ? gameConfigs.map((config) =>
            '<article class="config-card">' +
              '<button class="config-toggle" data-config-toggle="' + esc(config.id) + '" type="button">' +
                '<span class="config-toggle-copy"><strong>' + esc(config.name) + '</strong>' +
                  '<small>' + esc(config.summary) + '</small></span>' +
                '<span class="config-toggle-state">' +
                  (state.expandedConfigId === config.id ? "收起" : "查看") + '</span>' +
              '</button>' +
              (state.expandedConfigId === config.id ? renderConfigDetail(config) : '') +
            '</article>'
          ).join("")
        : '<div class="empty-subcard"><h3>暂无可下载配置</h3>' +
            '<p>当前平台未提供已验证配置。</p></div>';
      return '<section class="compatibility-result" data-compatibility-result="' + esc(game.id) + '">' +
        '<button class="result-back" data-result-back type="button">← 返回' + platformLabel() + '游戏</button>' +
        '<div class="result-hero">' +
          renderCover(game, "hero-cover") +
          '<div class="result-hero-copy"><span class="platform-badge">' + platformLabel() + '</span>' +
            '<h2>' + esc(game.name) + '</h2><p>' + esc(game.englishName) + '</p></div>' +
        '</div>' +
        recordHtml +
        '<div class="config-section"><div class="section-heading">' +
          '<div><h2>启动配置</h2><p>确认适用环境后再下载</p></div>' +
          '<span class="section-kicker">' + gameConfigs.length + ' 个方案</span>' +
        '</div>' + configHtml + '</div>' +
      '</section>';
    }

    function renderState(title, copy, action) {
      return '<section class="state-card"><h2>' + esc(title) + '</h2>' +
        '<p>' + esc(copy) + '</p>' +
        (action
          ? '<button data-state-action="' + esc(action) + '" type="button">重新加载</button>'
          : '') +
      '</section>';
    }

    function render() {
      let content = "";
      if (state.catalogStatus === "loading") {
        content = renderState("正在加载兼容数据", "正在获取游戏、兼容记录和配置。", "");
      } else if (state.catalogStatus === "error") {
        content = renderState("兼容数据加载失败", "暂时无法获取数据，请重试。", "reload");
      } else if (filteredCatalog().games.length === 0) {
        content = renderState(
          "当前" + platformLabel() + "暂无兼容数据",
          "当前平台暂时没有可展示的游戏，请重新加载。",
          "reload"
        );
      } else if (state.selectedGameId) {
        content = renderCompatibilityResult();
      } else {
        content = renderSearchPanel() + renderPopularGames();
      }
      document.getElementById("compatibility-app").innerHTML =
        '<div class="page"><header class="page-header">' +
          '<div class="header-topline">' +
            '<button class="back-button" data-back type="button" aria-label="返回">← 返回</button>' +
            '<span class="platform-pill" data-platform-badge>' + platformLabel() + '</span>' +
          '</div>' +
          '<h1>游戏兼容性</h1>' +
          '<p>查看当前平台的运行表现与启动配置</p>' +
        '</header>' + content + '</div>';
      document.querySelectorAll("[data-demo-platform]").forEach((button) => {
        button.classList.toggle("active", button.dataset.demoPlatform === state.platform);
        button.disabled = state.platformSource === "bridge";
      });
    }

    function setDownloadResult(requestId, ok, message) {
      if (!requestId ||
          requestId !== state.download.requestId ||
          state.download.status !== "pending") return false;
      clearDownloadTimer();
      state.download.status = ok ? "success" : "error";
      state.download.message = text(message) ||
        (ok ? "配置已开始下载" : "下载失败，请重试");
      render();
      return true;
    }

    function webDownload(config, requestId) {
      const payload = {
        demo: true,
        platform: config.platform,
        gameId: config.gameId,
        configId: config.id,
        version: config.version,
        fields: Object.fromEntries(config.fields)
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = config.fileName;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
      setDownloadResult(
        requestId,
        true,
        "已发起下载，请查看浏览器下载列表；若未出现文件，请重试"
      );
    }

    function startDownload(configId) {
      if (state.download.status === "pending") return;
      const config = filteredCatalog().configs.find((item) => item.id === configId);
      if (!config ||
          config.platform !== state.platform ||
          config.gameId !== state.selectedGameId) {
        state.download = {
          requestId: null,
          configId,
          status: "error",
          message: "配置与当前平台不一致，请重新选择"
        };
        render();
        return;
      }

      const requestId = "download-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
      state.download = {
        requestId,
        configId,
        status: "pending",
        message: "正在准备配置…"
      };
      render();

      const bridge = window.GameHubBridge;
      if (!bridge || typeof bridge.downloadConfig !== "function") {
        if (state.platformSource === "bridge") {
          setDownloadResult(requestId, false, "App 连接不可用，请重试");
          return;
        }
        try {
          webDownload(config, requestId);
        } catch (error) {
          setDownloadResult(requestId, false, "浏览器未能下载配置，请重试");
        }
        return;
      }

      downloadTimer = window.setTimeout(() => {
        setDownloadResult(requestId, false, "App 响应超时，请重试");
      }, DOWNLOAD_TIMEOUT_MS);

      const payload = JSON.stringify({
        requestId,
        platform: state.platform,
        gameId: config.gameId,
        configId: config.id,
        fileName: config.fileName
      });

      try {
        const result = window.GameHubBridge.downloadConfig(payload);
        if (result && typeof result.then === "function") {
          result.then((value) => {
            if (value && typeof value === "object") {
              setDownloadResult(requestId, value.ok !== false, value.message);
            }
          }).catch(() => {
            setDownloadResult(requestId, false, "App 下载失败，请重试");
          });
        } else if (result && typeof result === "object") {
          setDownloadResult(requestId, result.ok !== false, result.message);
        }
      } catch (error) {
        setDownloadResult(requestId, false, "App 连接不可用，请重试");
      }
    }

    document.addEventListener("error", (event) => {
      const image = event.target;
      if (!(image instanceof HTMLImageElement) || !image.matches("[data-cover-image]")) return;
      const fallback = document.createElement("div");
      fallback.className = image.className + " cover-fallback";
      fallback.setAttribute("aria-label", "封面加载失败");
      fallback.textContent = "GH";
      image.replaceWith(fallback);
    }, true);

    document.addEventListener("input", (event) => {
      if (event.target.id !== "game-search") return;
      state.gameQuery = event.target.value;
      render();
      const input = document.getElementById("game-search");
      if (input) {
        input.focus();
        input.setSelectionRange(state.gameQuery.length, state.gameQuery.length);
      }
    });

    document.addEventListener("click", (event) => {
      const preview = event.target.closest(".demo-controls [data-preview]");
      if (preview) {
        document.querySelector(".frame").dataset.preview = preview.dataset.preview;
        document.querySelectorAll("[data-preview]").forEach((button) => {
          button.classList.toggle("active", button === preview);
        });
        return;
      }

      const demoPlatform = event.target.closest("[data-demo-platform]");
      if (demoPlatform) {
        if (state.platformSource !== "bridge") {
          applyPlatform(normalizePlatform(demoPlatform.dataset.demoPlatform), "demo");
        }
        return;
      }

      const selected = event.target.closest("[data-popular-game], [data-search-result]");
      if (selected) {
        state.selectedGameId = selected.dataset.popularGame || selected.dataset.searchResult;
        state.gameQuery = "";
        state.expandedConfigId = null;
        clearDownloadState();
        render();
        return;
      }

      if (event.target.closest("[data-clear-search]")) {
        state.gameQuery = "";
        render();
        return;
      }

      if (event.target.closest("[data-result-back]")) {
        state.selectedGameId = null;
        state.expandedConfigId = null;
        clearDownloadState();
        render();
        return;
      }

      const configToggle = event.target.closest("[data-config-toggle]");
      if (configToggle) {
        const configId = configToggle.dataset.configToggle;
        state.expandedConfigId = state.expandedConfigId === configId ? null : configId;
        clearDownloadState();
        render();
        return;
      }

      const configDownload = event.target.closest("[data-config-download]");
      if (configDownload) {
        startDownload(configDownload.dataset.configDownload);
        return;
      }

      const stateAction = event.target.closest("[data-state-action]");
      if (stateAction && stateAction.dataset.stateAction === "reload") {
        state.catalogStatus = "loading";
        render();
        window.setTimeout(() => setCatalog(mockCatalog), 400);
        return;
      }

      if (event.target.closest("[data-back]")) {
        if (state.selectedGameId) {
          state.selectedGameId = null;
          state.expandedConfigId = null;
          clearDownloadState();
          render();
        } else if (window.GameHubBridge && typeof window.GameHubBridge.goBack === "function") {
          window.GameHubBridge.goBack();
        } else if (history.length > 1) {
          history.back();
        }
      }
    });

    window.GameHubCompatibility = {
      setContext(context) {
        const resolved = resolvePlatform(context);
        applyPlatform(resolved.platform, resolved.source);
      },
      setCatalog(catalog) {
        setCatalog(catalog);
      },
      setCatalogLoading() {
        state.catalogStatus = "loading";
        render();
      },
      setCatalogError() {
        state.catalogStatus = "error";
        render();
      },
      onDownloadResult(result) {
        if (!result || typeof result !== "object") return false;
        return setDownloadResult(text(result.requestId), result.ok === true, result.message);
      }
    };

    const initialPlatform = resolvePlatform(null);
    state.platform = initialPlatform.platform;
    state.platformSource = initialPlatform.source;
    setCatalog(mockCatalog);
  </script>
</body>
</html>
