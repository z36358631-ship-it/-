<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品经理全生命周期工作台</title>
<style>
:root{
  --primary:#2563eb;--primary-dark:#1e40af;--primary-light:#eff6ff;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;
  --bg:#f8fafc;--surface:#fff;--text:#0f172a;--text-2:#475569;--text-3:#64748b;
  --border:#e2e8f0;--line:#f1f5f9;--radius:12px;
  --shadow:0 1px 3px rgba(15,23,42,.06);--shadow-md:0 8px 24px rgba(15,23,42,.10);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","MiSans","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"DIN Alternate","D-DIN-PRO","Roboto Mono",Menlo,monospace
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button,[role=button],.clickable{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid rgba(59,130,246,.32);outline-offset:2px}
.skip-link{position:fixed;left:12px;top:-48px;z-index:1000;padding:8px 12px;border-radius:8px;background:var(--text);color:#fff;text-decoration:none}
.skip-link:focus{top:12px}
.layout{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;z-index:30;width:220px;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;color:var(--primary);font-size:15px;font-weight:750}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;font-weight:800}
.nav{flex:1;padding:0 8px;overflow-y:auto}
.nav-title{padding:10px 12px 6px;color:var(--text-3);font-size:11px;font-weight:700;letter-spacing:.5px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;margin:2px 0;padding:9px 12px;border:0;border-radius:8px;background:transparent;color:var(--text-2);text-align:left;transition:background .16s,color .16s,box-shadow .16s}
.nav-item svg{width:17px;height:17px;flex:0 0 17px}
.nav-item:hover{background:var(--primary-light);color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(59,130,246,.28)}
.profile{display:flex;align-items:center;gap:10px;padding:16px;border-top:1px solid var(--border)}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;font-weight:700}
.profile small{display:block;color:var(--text-3)}
.main{min-width:0;width:calc(100% - 220px);margin-left:220px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 24px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.breadcrumb{color:var(--text-3);font-size:12px;white-space:nowrap}
.global-search{position:relative;flex:1;max-width:520px;margin-left:auto}
.global-search svg{position:absolute;left:11px;top:10px;color:var(--text-3)}
.global-search input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-2);white-space:nowrap;transition:border-color .16s,color .16s,background .16s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{border-color:var(--primary);background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{border-color:#fecaca;color:#b91c1c;background:#fef2f2}
.content{padding:20px 24px 44px}
.page{display:none;min-width:0}.page.active{display:block}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-head h1,.page-head h2{margin:0 0 4px;font-size:22px;line-height:1.3}
.page-head p{margin:0;color:var(--text-3)}
.metric-grid,.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.metric{position:relative;padding:17px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.metric:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--metric-color,var(--primary))}
.metric-label{display:flex;align-items:center;gap:7px;color:var(--text-3);font-size:12px}
.metric-value{margin-top:7px;font:750 27px/1.1 var(--mono)}
.metric-note{margin-top:8px;color:var(--text-2);font-size:12px}
.grid-2-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:12px}
.grid-1-1{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{min-width:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.panel-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.panel-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.panel-body{padding:16px 18px}
.table-wrap{max-width:100%;overflow:auto}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg);color:var(--text-3);text-align:left;font-weight:650;white-space:nowrap}
.data-table td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--text-2);vertical-align:middle}
.data-table tbody tr:hover td{background:#f8fafc}
.data-table strong{color:var(--text);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.critical,.tag.P0{color:#b91c1c;background:#fef2f2}
.tag.high,.tag.P1{color:#b45309;background:#fffbeb}
.tag.medium,.tag.P2{color:#1d4ed8;background:#eff6ff}
.tag.success{color:#047857;background:#ecfdf5}
.tag.purple{color:#6d28d9;background:#f5f3ff}
.muted{color:var(--text-3);font-size:12px}
.list{display:grid;gap:10px}
.list-item{padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.list-item strong{display:block;margin-bottom:3px}
.list-item.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.section-gap{margin-top:12px}
.tabs{display:inline-flex;gap:4px;margin-bottom:16px;padding:4px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.tab{min-height:32px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--text-2)}
.tab.active{background:var(--primary);color:#fff}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar select,.toolbar input{min-height:34px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text-2)}
.toolbar .spacer{flex:1}
.release-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.capacity{height:8px;margin:11px 0 7px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.capacity span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#60a5fa)}
.capacity.over span{background:linear-gradient(90deg,var(--warning),var(--danger))}
.requirement-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.requirement-card{min-width:0;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);text-align:left;transition:border-color .16s,box-shadow .16s,transform .16s}
.requirement-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.requirement-card h2{margin:14px 0 7px;font-size:16px}
.requirement-card p{min-height:42px;margin:0;color:var(--text-2)}
.card-top,.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-foot{margin-top:15px;color:var(--text-3);font-size:12px}
.detail-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:12px}
.stage-track{display:flex;max-width:100%;padding:8px 0 2px;overflow-x:auto}
.stage-step{position:relative;min-width:104px;padding:11px 9px 5px;border-top:3px solid var(--border);color:var(--text-3);font-size:11px}
.stage-step:before{content:"";position:absolute;left:8px;top:-6px;width:9px;height:9px;border:2px solid var(--surface);border-radius:50%;background:var(--border)}
.stage-step.done{border-color:var(--success);color:#047857}.stage-step.done:before{background:var(--success)}
.stage-step.current{border-color:var(--primary);color:var(--primary);font-weight:700}.stage-step.current:before{background:var(--primary)}
.flow-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.flow-step{position:relative;padding:11px;border:1px solid var(--border);border-radius:8px;background:#fafcff}
.flow-step b{display:block;margin-bottom:3px}.flow-step small{color:var(--text-3)}
.artifact{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--border);border-radius:8px}
.artifact-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--primary-light);color:var(--primary);font-weight:800}
.artifact-main{flex:1;min-width:0}.artifact-main strong,.artifact-main span{display:block}.artifact-main span{overflow:hidden;color:var(--text-3);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.decision-gate{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.decision-gate:last-child{border:0}
.empty{padding:28px;color:var(--text-3);text-align:center}
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.48)}
.dialog{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:16px;background:var(--surface);box-shadow:0 24px 60px rgba(15,23,42,.25)}
.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.dialog-head strong{font-size:16px}.dialog-body{padding:18px}.dialog-foot{justify-content:flex-end;border-top:1px solid var(--border);border-bottom:0}
.form-grid{display:grid;gap:13px}.form-grid label{display:grid;gap:5px;color:var(--text-2);font-size:12px;font-weight:650}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-weight:400}
.form-grid textarea{resize:vertical}
.form-grid.two-column{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
.form-error{display:none;margin:0;padding:9px 10px;border-radius:7px;background:#fef2f2;color:#b91c1c;font-size:12px}
.form-error.visible{display:block}
.search-result{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:#fff;text-align:left}
.search-result:hover{border-color:var(--primary);background:var(--primary-light)}
.audit{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:12px}
.audit:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}
.release-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.release-item{padding:4px 7px;border-radius:6px;background:var(--primary-light);color:var(--primary-dark);font-size:11px}
.stage-hint{margin-top:7px;color:var(--text-3);font-size:11px;text-align:right}
@media(max-width:1200px){
  .metric-grid,.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2-1,.detail-grid{grid-template-columns:1fr}
  .requirement-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1024px){
  .sidebar{width:176px}.brand{padding:18px 14px}.profile{display:none}
  .nav-item{padding:10px}.main{width:calc(100% - 176px);margin-left:176px}
  .content{padding:18px}.topbar{padding:8px 16px}
}
@media(max-width:720px){
  .layout{display:block}
  .sidebar{inset:auto 0 0;width:100%;height:66px;border-top:1px solid var(--border);border-right:0}
  .brand,.nav-title,.profile{display:none}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:4px;overflow:visible}
  .nav-item{flex-direction:column;justify-content:center;gap:2px;min-height:56px;margin:0;padding:3px 1px;font-size:9px;text-align:center}
  .nav-item svg{width:18px;height:18px}
  .main{width:100%;margin-left:0;padding-bottom:66px}
  .topbar{flex-wrap:wrap;padding:8px 10px}.breadcrumb{display:none}
  .global-search{order:3;flex-basis:100%;max-width:none}
  .content{padding:14px 10px 30px}.page-head{display:block}.page-head .btn{margin-top:10px}
  .release-grid,.requirement-grid,.grid-1-1,.flow-list,.form-grid.two-column{grid-template-columns:1fr}
  .btn,.tab,.toolbar select,.toolbar input{min-height:44px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>

function clone(value){return JSON.parse(JSON.stringify(value))}
function isValidState(value){

    &&Array.isArray(value.releases)&&value.releases.every(item=>item&&typeof item.id==='string'&&Number.isFinite(item.baseUsed)&&Number.isFinite(item.capacity))
    &&Array.isArray(value.requirements)&&value.requirements.every(item=>item&&typeof item.id==='string'&&Array.isArray(item.releaseIds)&&Array.isArray(item.artifacts)&&Array.isArray(item.decisionGates))
    &&Array.isArray(value.inbox)&&Array.isArray(value.tasks)&&Array.isArray(value.reviews)
    &&Array.isArray(value.insertionRecords)&&Array.isArray(value.activity));
}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY),parsed=raw?JSON.parse(raw):null;return isValidState(parsed)?parsed:clone(seedState)}catch{return clone(seedState)}}

function requirementById(id){return state.requirements.find(item=>item.id===id)}
function releaseById(id){return state.releases.find(item=>item.id===id)}
function releaseRequirements(id){return state.requirements.filter(item=>item.releaseIds.includes(id))}
function releaseUsage(release){return release.baseUsed+releaseRequirements(release.id).reduce((sum,item)=>sum+item.effort,0)}

function approveInbox(id){
  const item=state.inbox.find(entry=>entry.id===id),req=requirementById(item.requirementId),decision=document.getElementById('inboxDecision').value.trim();
  if(!decision){showFormError('inboxError','请先写明产品结论，结论会随需求留痕。');return}
  const task=item.taskId&&state.tasks.find(entry=>entry.id===item.taskId);
  if(task){task.state='已确认';task.approvalDecision=decision}
  const review=item.reviewId&&state.reviews.find(entry=>entry.id===item.reviewId);
  if(review){review.state='已决策';review.decision=decision;review.reason=decision}
  req.stage=item.resultStage;req.status='已流转';req.owner=item.nextOwner;req.nextOwner=item.afterNextOwner||item.nextOwner;
  state.tasks.unshift({id:`TASK-FLOW-${item.id}`,requirementId:req.id,title:`落实决策：${item.title}`,assignee:item.nextOwner,kind:'人工',state:'待执行',due:item.due,deliverable:decision,inputMaterials:`${req.id}需求与${item.id}决策记录`,authorizationScope:'仅执行已审批结论',acceptanceCriteria:'完成后回传证据并进入待我处理',approver:req.approver});

}
function openInsertionImpact(id){
  const req=requirementById(id),release=releaseById('REL-APP-0826'),before=releaseUsage(release),projected=before+(req.releaseIds.includes(release.id)?0:req.effort),overflow=Math.max(projected-release.capacity,0);

function confirmInsertion(id){
  const req=requirementById(id),release=releaseById('REL-APP-0826'),reason=document.getElementById('insertionReason').value.trim(),evidence=document.getElementById('insertionEvidence').value.trim();
  if(!reason||!evidence){showFormError('insertionError','请补全审批理由和决策证据。');return}
  if(!req.releaseIds.includes(release.id)){
    const before=releaseUsage(release);req.releaseIds=[...req.releaseIds,release.id];const after=releaseUsage(release);
    req.stage='已规划';req.status='已流转';req.owner='高级项目经理';req.nextOwner='产品负责人';
    const gate=req.decisionGates.find(item=>item.code==='G1');if(gate)gate.state='已通过';
    state.insertionRecords.unshift({id:`INSERT-${Date.now()}`,requirementId:id,releaseId:release.id,releaseCode:release.code,before,after,capacity:release.capacity,approver:req.approver,reason,evidence,impact:'挤出新手登录微调，Android广告验收延后1个工作日',time:new Date().toLocaleString('zh-CN')});
    state.activity.unshift({type:'插单决策',requirementId:id,releaseId:release.id,decision:reason,approver:req.approver,time:new Date().toLocaleString('zh-CN')});
    state.inbox=state.inbox.filter(item=>!(item.requirementId===id&&item.type==='插单审批'));
  }
  state.planningView='releases';
  saveState();closeOverlay();renderApp();
}

  const searchResult=event.target.closest('[data-search-result]');if(searchResult){state.selectedRequirementId=searchResult.dataset.id;closeOverlay();setPage('requirements');return}
  if(event.target.closest('[data-action="create-requirement"]')){createRequirement();return}
  if(event.target.closest('[data-action="close-overlay"]')||event.target.classList.contains('overlay')){closeOverlay()}
});
document.addEventListener('change',event=>{
  const filter=event.target.closest('[data-requirement-filter]');if(!filter)return;
  state.requirementFilters[filter.dataset.requirementFilter]=filter.value;saveState();renderRequirements();
});
document.getElementById('globalSearch').addEventListener('keydown',event=>{if(event.key==='Enter'&&event.currentTarget.value.trim())openSearch(event.currentTarget.value)});
document.addEventListener('keydown',event=>{
  const dialog=document.querySelector('[role="dialog"]');if(!dialog)return;
  if(event.key === 'Escape'){closeOverlay();return}
  if(event.key==='Tab'){
    const focusable=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[href],[tabindex]:not([tabindex="-1"])')];
    if(!focusable.length){event.preventDefault();dialog.focus();return}
    const first=focusable[0],last=focusable[focusable.length-1];
    if(event.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){event.preventDefault();last.focus()}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
  }
});
window.WorkbenchDemo={getState:()=>clone(state),getReleaseUsage:id=>releaseUsage(releaseById(id)),reset:resetDemo,setPage};
renderApp();
</script>
</body>
