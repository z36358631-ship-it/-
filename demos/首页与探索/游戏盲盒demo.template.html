const candidates=[{gameId:"hades",name:"哈迪斯",asset:"hades",rating:9.4,tagKeys:["tagAction","tagRogue"],source:"local",launchable:true,instant:false,daysSincePlay:46,compatible:true,available:true},{gameId:"silksong",name:"空洞骑士：丝之歌",asset:"silksong",rating:9.2,tagKeys:["tagAction","tagAdventure"],source:"instant",launchable:true,instant:true,daysSincePlay:null,compatible:true,available:true},{gameId:"beamng",name:"车辆模拟器 - BeamNG.drive",asset:"beamng",rating:8.7,tagKeys:["tagSimulation","tagDriving"],source:"local",launchable:true,instant:false,daysSincePlay:3,compatible:true,available:true},{gameId:"re4",name:"生化危机4重制版",asset:"re4",rating:9.3,tagKeys:["tagAction","tagHorror"],source:"steam",launchable:false,instant:false,daysSincePlay:null,compatible:true,available:true},{gameId:"hades",name:"哈迪斯",asset:"hades",rating:9.4,tagKeys:["tagAction","tagRogue"],source:"steam",launchable:false,instant:false,daysSincePlay:null,compatible:true,available:true}];
const state={orientation:"portrait",locale:"zh-CN",page:"library",modalOpen:false,phase:"idle",history:[],result:null,preview:null,pending:null,networkOk:true,poolMode:"full",reducedMotion:false,forceResult:null};
const icon=id=>`<svg class="icon" aria-hidden="true"><use href="#${id}"></use></svg>`,t=key=>copy[state.locale][key]||copy["zh-CN"][key]||key,cover=game=>`background-image:url('${ASSETS[game.asset]}')`;
function dedupePool(){const source=state.poolMode==="small"?candidates.slice(0,1):candidates,map=new Map();source.filter(g=>g.compatible&&g.available).forEach(game=>{const old=map.get(game.gameId);if(!old||(!old.launchable&&game.launchable))map.set(game.gameId,game)});return [...map.values()]}
function weight(game){if(!game.launchable)return 1;return game.daysSincePlay===null||game.daysSincePlay>30?2:1}function weightedPick(list){const total=list.reduce((sum,g)=>sum+weight(g),0);let cursor=Math.random()*total;for(const game of list){cursor-=weight(game);if(cursor<=0)return game}return list.at(-1)}
function pickNext(){let pool=dedupePool().filter(g=>!state.history.includes(g.gameId));if(!pool.length){state.history=[];pool=dedupePool()}if(state.forceResult){const forced=pool.find(g=>state.forceResult==="uninstalled"?!g.launchable:g.launchable);state.forceResult=null;if(forced)return forced}const ready=pool.filter(g=>g.launchable),download=pool.filter(g=>!g.launchable);if(!ready.length)return weightedPick(download);if(!download.length)return weightedPick(ready);const readyWeight=ready.reduce((s,g)=>s+weight(g),0),downloadShare=Math.min(.3,download.length/(download.length+readyWeight));return Math.random()<downloadShare?weightedPick(download):weightedPick(ready)}
function statusFor(game){return game.launchable?(game.instant?t("instant"):t("installed")):t("notInstalled")}function logo(type){return `<img src="${ASSETS[type+"Logo"]}" alt="">`}
function navPortrait(){return `<nav class="p-nav"><button>${icon("i-home")}<span>${t("home")}</span></button><button>${icon("i-game")}<span>${t("play")}</span></button><button>${icon("i-rank")}<span>${t("rank")}</span></button><button class="active"><span class="grid-symbol"><i></i><i></i><i></i><i></i></span><span>${t("library")}</span></button><button>${icon("i-user")}<span>${t("profile")}</span></button></nav>`}
function quickCard(kind,label,click=""){const media=kind==="steam"||kind==="epic"?logo(kind):icon("i-plus");return `<button class="quick-card" ${click?`onclick="${click}"`:""}>${media}<span>${label}</span></button>`}
function portraitGame(game){return `<article class="p-game"><div class="p-game-cover" style="${cover(game)}"></div><div class="p-game-info"><div class="p-game-name">${game.name}</div><div class="p-game-meta">${statusFor(game)}</div></div></article>`}
function blindCollage(){const unique=[...new Map(candidates.map(game=>[game.gameId,game])).values()].slice(0,4);return `<div class="blind-collage"><div class="blind-collage-grid">${unique.map(game=>`<span class="blind-collage-tile" style="${cover(game)}"></span>`).join("")}</div><span class="blind-collage-overlay"></span><span class="blind-collage-mark">${icon("i-box")}</span><span class="blind-collage-title">${t("blind")}</span></div>`}
function portraitBlindCard(){return `<button class="p-game blind-game-card" data-testid="blind-entry" onclick="openBlindBox()"><div class="p-game-cover">${blindCollage()}</div><div class="p-game-info"><div class="p-game-name">${t("blind")}</div><div class="p-game-meta">${t("blindSubtitle")}</div></div></button>`}
function landscapeBlindCard(){return `<button class="l-game-cover l-blind-card" data-testid="blind-entry" onclick="openBlindBox()">${blindCollage()}</button>`}
function renderPortraitLibrary(pool){return `<section class="p-shell"><header class="p-top"><button class="p-tab active">${t("pc")}</button><button class="p-tab">${t("retro")}</button><button class="p-device">${icon("i-device")}</button></header><main class="p-content"><div class="quick-grid">${quickCard("steam",t("steam"))}${quickCard("epic",t("epic"))}${quickCard("import",t("import"))}</div><div class="library-head"><div class="library-head-copy"><strong class="library-title">${t("mine")}</strong><span class="library-count">${pool.length} ${t("games")}</span></div><div class="library-tools"><button class="tool-btn">${icon("i-search")}</button><button class="tool-btn">${icon("i-grid")}</button><button class="tool-btn sort-btn">${icon("i-sort")}<span>${t("recent")}</span></button><button class="tool-btn">${icon("i-filter")}</button></div></div><div class="p-games">${pool.length>=2?portraitBlindCard():""}${pool.map(portraitGame).join("")}</div></main>${navPortrait()}</section>`}
function renderLandscapeLibrary(pool){const hero=pool[0]||candidates[0],second=pool[1]||hero;return `<section class="l-shell" style="${cover(hero)}"><header class="l-nav"><div class="l-title">${icon("i-grid")}<span>${t("library")}</span></div><button class="l-nav-btn">${icon("i-game")}</button><button class="l-nav-btn">${icon("i-rank")}</button><button class="l-nav-btn">${icon("i-user")}</button><div class="l-spacer"></div><div class="l-status">${icon("i-device")}${icon("i-game")}<span>17:46</span>${icon("i-wifi")}<span>85%</span></div></header><div class="l-summary"><div class="l-game-strip">${pool.length>=2?landscapeBlindCard():""}<div class="l-game-cover" style="${cover(hero)}"></div><div class="l-game-cover secondary" style="${cover(second)}"></div></div><div class="l-selected-name">${hero.name}</div><div class="l-summary-actions"><button class="l-detail-btn" onclick="openLibraryGameDetails()">${t("details")}</button><button class="l-menu-btn">${icon("i-menu")}</button></div></div><div class="l-quick">${quickCard("mine",t("mine"))}${quickCard("steam",t("steam"))}${quickCard("epic",t("epic"))}${quickCard("import",t("import"))}</div></section>`}
function ratingText(game){return Number.isFinite(game.rating)?`★ ${game.rating.toFixed(1)}`:t("noRating")}function tagMarkup(game){return (game.tagKeys||[]).slice(0,2).map(key=>`<span class="type-chip">${t(key)}</span>`).join("")}
function modalSlot(){if(state.phase==="error")return `<div class="slot"><div class="slot-card"><div class="slot-error" data-testid="network-error"><span class="error-icon">${icon("i-alert")}</span><h3>${t("error")}</h3><p>${t("errorSub")}</p></div></div></div>`;const game=state.phase==="drawing"?state.preview:state.result;if(!game)return "";const drawing=state.phase==="drawing";return `<div class="slot" ${drawing?'data-testid="drawing"':'data-testid="result"'} data-preview-game="${game.gameId}"><div class="slot-card"><div class="slot-cover" style="${cover(game)}"></div><div class="slot-info"><div class="slot-name">${game.name}</div><div class="slot-meta"><span class="rating-chip">${ratingText(game)}</span>${tagMarkup(game)}</div></div></div></div>`}
function renderBlindModal(){if(!state.modalOpen)return "";return `<div class="modal-mask" data-testid="blind-modal"><section class="blind-modal" role="dialog" aria-modal="true" aria-label="${t("blind")}"><header class="modal-head"><strong class="modal-title">${t("blind")}</strong><span class="modal-progress">${state.phase==="drawing"?t("drawing"):""}</span><button class="close-modal" data-testid="close-modal" onclick="closeBlindBox()" aria-label="${t("close")}">${icon("i-close")}</button></header>${modalSlot()}<footer class="modal-actions"><button class="modal-action" data-testid="view-details" onclick="openDetails()" ${state.phase!=="result"?"disabled":""}>${t("details")}</button><button class="modal-action primary" data-testid="draw-again" onclick="drawAgain()" ${state.phase==="drawing"?"disabled":""}>${t("again")}</button></footer></section></div>`}
function renderLibrary(){const pool=dedupePool(),shell=state.orientation==="portrait"?renderPortraitLibrary(pool):renderLandscapeLibrary(pool);return shell+renderBlindModal()}function renderDetails(){const game=state.result||dedupePool()[0];return `<section class="detail-page" data-testid="detail-page"><div class="detail-hero" style="${cover(game)}"><button class="detail-back" onclick="backFromDetails()">${icon("i-back")}</button></div><div class="detail-copy"><h1>${game.name}</h1><p>${t("detailText")}</p><button class="detail-primary">${t("acquire")}</button></div></section>`}
function currentDemoState(){if(state.poolMode==="small")return "small-pool";if(!state.modalOpen)return "library";if(state.phase==="drawing")return "drawing";if(state.phase==="error")return "network-error";if(state.result&&!state.result.launchable)return "uninstalled-result";return "result"}function syncDemoControls(){document.querySelectorAll("[data-orientation]").forEach(b=>b.classList.toggle("active",b.dataset.orientation===state.orientation));document.querySelectorAll("[data-demo-state]").forEach(b=>b.classList.toggle("active",b.dataset.demoState===currentDemoState()))}function render(){document.documentElement.lang=state.locale;document.body.classList.toggle("reduce-motion",state.reducedMotion);device.className=`device ${state.orientation}`;app.innerHTML=state.page==="details"?renderDetails():renderLibrary();syncDemoControls()}
function updateSlotGame(game,animate=false,settle=false){const slot=document.querySelector(".slot[data-preview-game]"),coverNode=slot?.querySelector(".slot-cover"),infoNode=slot?.querySelector(".slot-info");if(!slot||!coverNode||!infoNode)return false;slot.dataset.previewGame=game.gameId;coverNode.setAttribute("style",cover(game));infoNode.querySelector(".slot-name").textContent=game.name;infoNode.querySelector(".slot-meta").innerHTML=`<span class="rating-chip">${ratingText(game)}</span>${tagMarkup(game)}`;const reduced=state.reducedMotion||matchMedia("(prefers-reduced-motion: reduce)").matches;if(animate&&!reduced){[coverNode,infoNode].forEach(node=>node.getAnimations().forEach(animation=>animation.cancel()));const duration=settle?190:86;coverNode.animate(settle?[{opacity:.5,transform:"scale(.975)",filter:"brightness(1.18)"},{opacity:1,transform:"none",filter:"none"}]:[{opacity:.38,transform:"translateX(7px) scale(1.015)",filter:"brightness(1.16)"},{opacity:1,transform:"none",filter:"none"}],{duration,easing:settle?"cubic-bezier(.2,.8,.2,1)":"ease-out"});infoNode.animate(settle?[{opacity:.45,transform:"translateY(6px)"},{opacity:1,transform:"none"}]:[{opacity:.3,transform:"translateX(-6px)"},{opacity:1,transform:"none"}],{duration,easing:"ease-out"})}return true}
function syncModalPhase(){const slot=document.querySelector(".slot[data-preview-game]");if(!slot)return false;slot.setAttribute("data-testid",state.phase==="drawing"?"drawing":"result");const progress=document.querySelector(".modal-progress"),details=document.querySelector('[data-testid="view-details"]'),again=document.querySelector('[data-testid="draw-again"]');if(progress)progress.textContent=state.phase==="drawing"?t("drawing"):"";if(details)details.disabled=state.phase!=="result";if(again)again.disabled=state.phase==="drawing";syncDemoControls();return true}
const DRAW_TIMING={cycleMs:100,totalMs:1200,testCycleMs:40,testTotalMs:280,reducedTotalMs:180};
let drawTimer=null,cycleTimer=null;function stopDrawTimers(){clearTimeout(drawTimer);clearInterval(cycleTimer);drawTimer=null;cycleTimer=null}function finishDraw(){stopDrawTimers();if(!state.pending)return;state.result=state.pending;state.history.push(state.result.gameId);state.preview=state.result;state.pending=null;state.phase="result";if(!updateSlotGame(state.result,true,true)||!syncModalPhase())render()}
function startDraw(){stopDrawTimers();const pool=dedupePool();if(pool.length<2){state.modalOpen=false;state.phase="idle";render();return}const reusable=!!document.querySelector('[data-testid="blind-modal"] .slot-cover');state.modalOpen=true;state.page="library";if(!state.networkOk){state.phase="error";state.result=null;state.preview=null;render();return}state.phase="drawing";state.result=null;state.pending=pickNext();let index=0;state.preview=pool[index];if(reusable){syncModalPhase();updateSlotGame(state.preview,false)}else render();const testMode=new URLSearchParams(location.search).has("test"),reduced=state.reducedMotion||matchMedia("(prefers-reduced-motion: reduce)").matches,interval=reduced?DRAW_TIMING.reducedTotalMs:(testMode?DRAW_TIMING.testCycleMs:DRAW_TIMING.cycleMs),duration=reduced?DRAW_TIMING.reducedTotalMs:(testMode?DRAW_TIMING.testTotalMs:DRAW_TIMING.totalMs);cycleTimer=setInterval(()=>{index=(index+1)%pool.length;state.preview=pool[index];updateSlotGame(state.preview,true)},interval);drawTimer=setTimeout(finishDraw,duration)}
function openBlindBox(){state.history=[];startDraw()}function drawAgain(){if(state.phase==="error")state.networkOk=true;if(state.phase!=="drawing")startDraw()}function closeBlindBox(){stopDrawTimers();state.modalOpen=false;state.phase="idle";state.pending=null;render();setTimeout(()=>document.querySelector('[data-testid="blind-entry"]')?.focus(),0)}function openDetails(){if(state.phase!=="result"||!state.result)return;state.page="details";state.modalOpen=false;render()}function backFromDetails(){state.page="library";state.modalOpen=true;state.phase="result";render()}function openLibraryGameDetails(){state.result=dedupePool()[0];state.page="details";render()}function setOrientation(value){state.orientation=value;render()}function setLocale(value){state.locale=value;render()}
function setDemoState(value){stopDrawTimers();state.networkOk=true;state.poolMode="full";state.page="library";state.modalOpen=false;state.phase="idle";state.history=[];state.result=null;state.preview=null;state.pending=null;if(value==="small-pool"){state.poolMode="small"}else if(value==="drawing"){startDraw();return}else if(value==="network-error"){state.modalOpen=true;state.phase="error";state.networkOk=false}else if(value==="result"||value==="uninstalled-result"){state.modalOpen=true;state.phase="result";state.forceResult=value==="uninstalled-result"?"uninstalled":"ready";state.result=pickNext();state.history=[state.result.gameId]}render()}
portraitBtn.onclick=()=>setOrientation("portrait");landscapeBtn.onclick=()=>setOrientation("landscape");localeSelect.onchange=e=>setLocale(e.target.value);motionSwitch.onchange=e=>{state.reducedMotion=e.target.checked;render()};document.querySelectorAll("[data-demo-state]").forEach(button=>button.onclick=()=>setDemoState(button.dataset.demoState));document.addEventListener("keydown",event=>{if(event.key==="Escape"&&state.modalOpen)closeBlindBox()});window.demo={state,candidates,drawTiming:DRAW_TIMING,dedupePool,weight,pickNext,setOrientation,setLocale,setDemoState,startDraw,finishDraw,closeBlindBox};render();
