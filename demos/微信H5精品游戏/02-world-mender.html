<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#171b2a">
  <link rel="icon" href="data:,">
  <title>世界缝补师</title>
  <style>
    :root{color-scheme:dark;--gold:#ffd77a;--ink:#171b2a;--panel:#20263a;--cream:#fff4d6;--red:#ff6c70}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1020;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--cream);touch-action:none}
    body{display:grid;place-items:center}
    #app{position:relative;width:min(100vw,calc(100vh * 390 / 844));height:min(100vh,calc(100vw * 844 / 390));max-width:430px;max-height:932px;overflow:hidden;background:#171b2a;box-shadow:0 0 60px #0009}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .top-actions{position:absolute;z-index:5;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;gap:7px}
    button{border:1px solid #fff2;border-radius:14px;background:#1b2034dd;color:#fff4d6;font:700 13px/1 "PingFang SC","Microsoft YaHei",sans-serif;min-width:44px;min-height:44px;padding:0 12px;box-shadow:0 5px 14px #06081266;cursor:pointer}
    button:active{transform:translateY(1px);background:#2d3551}
    #undoBtn{position:absolute;z-index:5;left:14px;bottom:max(18px,env(safe-area-inset-bottom));min-width:94px;background:#533f2cdd;border-color:#ffd77a55;color:#ffe8a8}
    #undoBtn:disabled{opacity:.42}
    .overlay{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#101427c9,#090b17ed);backdrop-filter:blur(5px)}
    .overlay[hidden]{display:none}
    .card{width:min(342px,100%);border:1px solid #ffd77a3a;border-radius:28px;padding:25px 22px 22px;text-align:center;background:linear-gradient(145deg,#272e43f5,#171b2af5);box-shadow:0 20px 70px #000a,inset 0 1px #fff1}
    .emblem{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle,#ffe6a3 0 17%,#c99045 18% 25%,#2f3549 26%);box-shadow:0 0 35px #ffd77a40}
    h1,h2{margin:0 0 8px;letter-spacing:.08em}
    h1{font-size:30px}.eyebrow{margin:0 0 6px;color:#e5b969;font-size:12px;letter-spacing:.22em}.desc{margin:0 auto 20px;max-width:280px;color:#c9ccda;font-size:14px;line-height:1.75}
    .primary{width:100%;min-height:50px;border-radius:17px;background:linear-gradient(135deg,#ffd97f,#d9943e);color:#282010;border:0;font-size:16px;box-shadow:0 10px 25px #c57e2940}
    .tips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 18px;text-align:left}
    .tip{border-radius:13px;padding:10px;background:#ffffff08;border:1px dashed #ffffff20;color:#d8d9df;font-size:12px;line-height:1.5}
    .tip b{display:block;color:#ffe29b;margin-bottom:2px}
    .score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 18px}
    .score div{padding:12px 4px;border-radius:13px;background:#ffffff08}.score strong{display:block;font-size:22px;color:#ffe297}.score span{font-size:11px;color:#aeb3c3}
    #continueBtn{margin-top:12px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<main id="app" aria-label="世界缝补师游戏">
  <canvas id="game" width="390" height="844" aria-label="布艺微缩世界游戏区域"></canvas>
  <div class="top-actions">
    <button id="muteBtn" aria-label="切换声音">声音</button>
    <button id="motionBtn" aria-label="减少动态效果">动效</button>
    <button id="pauseBtn" aria-label="暂停游戏">暂停</button>
  </div>
  <button id="undoBtn" disabled aria-label="撤销最近一针">↶ 撤销一针</button>

  <section id="intro" class="overlay">
    <div class="card">
      <div class="emblem" aria-hidden="true">✦</div>
      <p class="eyebrow">A STITCH OF HOPE</p>
      <h1>世界缝补师</h1>
      <p class="desc">拖住发光锚点，拉到与它匹配的锚点。用有限的金线架桥、挡住风沙，把小生命送回中心花园。</p>
      <div class="tips">
        <div class="tip"><b>桥梁针脚 ═</b>跨过撕裂的地面</div>
        <div class="tip"><b>屏障针脚 ╳</b>安全穿过风沙</div>
      </div>
      <button id="startBtn" class="primary">拿起金针</button>
    </div>
  </section>

  <section id="pauseOverlay" class="overlay" hidden>
    <div class="card">
      <div class="emblem" aria-hidden="true">Ⅱ</div>
      <h2>针线暂歇</h2>
      <p class="desc">世界、生命和倒计时都已暂停。</p>
      <button id="continueBtn" class="primary">继续缝补</button>
    </div>
  </section>

  <section id="result" class="overlay" hidden>
    <div class="card">
      <div id="resultEmblem" class="emblem" aria-hidden="true">✦</div>
      <p id="resultEyebrow" class="eyebrow">THE WORLD REMEMBERS</p>
      <h2 id="resultTitle">世界重新有了颜色</h2>
      <p id="resultDesc" class="desc"></p>
      <div class="score">
        <div><strong id="savedScore">0</strong><span>获救生命</span></div>
        <div><strong id="lostScore">0</strong><span>未能抵达</span></div>
        <div><strong id="threadScore">0</strong><span>剩余线长</span></div>
      </div>
      <button id="replayBtn" class="primary">换一块世界重玩</button>
    </div>
  </section>
  <div id="liveStatus" class="sr-only" aria-live="polite"></div>
</main>

<script>
(() => {
  "use strict";
  const W=390,H=844,GAME_ID="world-mender", SOURCE="wechat-h5-premium-games";
  const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search);
  const TEST=params.get("test")==="1", SPEED=Math.max(1,Math.min(30,Number(params.get("speed"))||1));
  const forcedMute=params.get("mute")==="1";
  let seed=(Number(params.get("seed"))||Date.now())>>>0;
  const initialSeed=seed;
  function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
  const prefersReduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  const state={
    phase:"intro",runId:"",elapsed:0,thread:345,maxThread:345,stitches:[],lives:[],saved:0,lost:0,
    paused:false,pauseReason:"",drag:null,feedback:[],particles:[],cameraShake:0,
    firstInput:false,bridgeRevealed:false,barrierRevealed:false,gardenConnected:false,
    mute:forcedMute||false,reducedMotion:prefersReduce,lastTs:0,acc:0,layoutVariant:0
  };

  const anchors=[
    {id:"w1",x:39,y:342,type:"bridge",label:"苔原左岸"},{id:"w2",x:125,y:342,type:"bridge",label:"苔原右岸"},
    {id:"n1",x:184,y:206,type:"barrier",label:"北风扣"},{id:"n2",x:264,y:206,type:"barrier",label:"北风扣"},
    {id:"e1",x:270,y:397,type:"bridge",label:"石径左岸"},{id:"e2",x:358,y:397,type:"bridge",label:"石径右岸"},
    {id:"s1",x:175,y:578,type:"barrier",label:"南风扣"},{id:"s2",x:269,y:578,type:"barrier",label:"南风扣"},
    {id:"g1",x:195,y:518,type:"garden",label:"花园门"},{id:"g2",x:195,y:448,type:"garden",label:"花园心"}
  ];
  const anchorById=Object.fromEntries(anchors.map(a=>[a.id,a]));
  const edges=[
    {id:"west_bridge",a:"w1",b:"w2",cost:72,role:"bridge",name:"苔原桥",color:"#77d9b1"},
    {id:"north_barrier",a:"n1",b:"n2",cost:80,role:"barrier",name:"北风屏障",color:"#74cbe4"},
    {id:"east_bridge",a:"e1",b:"e2",cost:88,role:"bridge",name:"石径桥",color:"#f19b70"},
    {id:"south_barrier",a:"s1",b:"s2",cost:94,role:"barrier",name:"南风屏障",color:"#bd9be8"},
    {id:"garden_gate",a:"g1",b:"g2",cost:76,role:"garden",name:"花园回路",color:"#ffd66b"}
  ];
  const edgeByPair=new Map(edges.flatMap(e=>[[e.a+"|"+e.b,e],[e.b+"|"+e.a,e]]));
  const routes=[
    {edge:"west_bridge",spawn:1,origin:{x:24,y:342},pre:{x:43,y:342},post:{x:127,y:342},garden:{x:182,y:477},color:"#79dab0",glyph:"●",name:"苔团"},
    {edge:"north_barrier",spawn:12,origin:{x:218,y:146},pre:{x:218,y:198},post:{x:218,y:232},garden:{x:197,y:452},color:"#72cae2",glyph:"◆",name:"云兔"},
    {edge:"east_bridge",spawn:24,origin:{x:378,y:397},pre:{x:353,y:397},post:{x:268,y:397},garden:{x:212,y:464},color:"#f09a6c",glyph:"▲",name:"陶鸟"},
    {edge:"south_barrier",spawn:36,origin:{x:222,y:650},pre:{x:222,y:588},post:{x:222,y:552},garden:{x:205,y:490},color:"#bc98e5",glyph:"■",name:"绒鹿"}
  ];

  function createEvent(event,payload={}){
    return {source:SOURCE,version:1,gameId:GAME_ID,runId:state.runId,event,ts:Date.now(),payload};
  }
  const GamePlatform=window.GamePlatform={
    getEnv(){return window.__wxjs_environment==="miniprogram"?"miniprogram":"web"},
    emit(event,payload={}){
      const message=createEvent(event,payload);
      try{if(parent&&parent!==window)parent.postMessage(message,"*")}catch(_){}
      try{if(opener&&!opener.closed)opener.postMessage(message,"*")}catch(_){}
      window.dispatchEvent(new CustomEvent("gameplatform",{detail:message}));
      return message;
    },
    saveLocal(key,value){try{localStorage.setItem(`premium-h5:${GAME_ID}:${key}`,JSON.stringify(value))}catch(_){}},
    loadLocal(key,fallback){try{const raw=localStorage.getItem(`premium-h5:${GAME_ID}:${key}`);return raw===null?fallback:JSON.parse(raw)}catch(_){return fallback}},
    pause(reason="platform"){pauseGame(reason)},
    resume(){showResume()},
    requestShare(){return Promise.resolve({supported:false})}
  };

  function freshRunId(){return "wm-"+Date.now().toString(36)+"-"+Math.floor(rand()*1e6).toString(36)}
  function resetRun(isReplay=false){
    state.phase="intro";state.runId=freshRunId();state.elapsed=0;state.thread=state.maxThread;state.stitches=[];
    state.lives=[];state.saved=0;state.lost=0;state.paused=false;state.pauseReason="";state.drag=null;
    state.feedback=[];state.particles=[];state.cameraShake=0;state.firstInput=false;state.bridgeRevealed=false;
    state.barrierRevealed=false;state.gardenConnected=false;state.lastTs=performance.now();state.acc=0;
    state.layoutVariant=Math.floor(rand()*3);
    $("intro").hidden=false;$("pauseOverlay").hidden=true;$("result").hidden=true;$("undoBtn").disabled=true;
    if(isReplay)GamePlatform.emit("replay_start",{seed:initialSeed});
  }
  function startRun(){
    if(state.phase!=="intro")return;
    state.phase="playing";state.lastTs=performance.now();$("intro").hidden=true;
    const payload={env:GamePlatform.getEnv(),seed:initialSeed,test:TEST};
    GamePlatform.emit("game_start",payload);
    GamePlatform.emit("run_start",payload);
    announce("开始缝补。拖动发光锚点连接道路。");
  }
  function pauseGame(reason="manual"){
    if(state.phase!=="playing"||state.paused)return;
    state.paused=true;state.pauseReason=reason;state.drag=null;$("pauseOverlay").hidden=false;
    GamePlatform.emit("lifecycle_pause",{reason,elapsed:+state.elapsed.toFixed(2)});
    GamePlatform.emit("pause",{reason,elapsed:+state.elapsed.toFixed(2)});
  }
  function showResume(){if(state.phase==="playing"&&state.paused)$("pauseOverlay").hidden=false}
  function resumeGame(){
    if(state.phase!=="playing"||!state.paused)return;
    state.paused=false;state.pauseReason="";state.lastTs=performance.now();$("pauseOverlay").hidden=true;
    GamePlatform.emit("lifecycle_resume",{elapsed:+state.elapsed.toFixed(2)});
    GamePlatform.emit("resume",{elapsed:+state.elapsed.toFixed(2)});
  }
  function announce(text){$("liveStatus").textContent=text}
  function isStitched(id){return state.stitches.some(s=>s.id===id)}

  function spawnLife(routeIndex,slot){
    const r=routes[routeIndex],j=(slot-1)*10;
    state.lives.push({id:`life-${routeIndex}-${slot}`,route:routeIndex,slot,status:"moving",segment:0,
      x:r.origin.x+(routeIndex%2?j-10:0),y:r.origin.y+(routeIndex%2?0:j-10),wait:0,age:0,speed:16+slot*1.4});
  }
  function spawnScheduled(){
    routes.forEach((r,ri)=>{
      [0,1.6,3.2].forEach((offset,slot)=>{
        const id=`life-${ri}-${slot}`;
        if(state.elapsed>=r.spawn+offset&&!state.lives.some(l=>l.id===id))spawnLife(ri,slot);
      });
    });
  }
  function moveToward(l,target,dt){
    const dx=target.x-l.x,dy=target.y-l.y,d=Math.hypot(dx,dy);
    if(d<1.4){l.x=target.x;l.y=target.y;return true}
    const m=Math.min(d,l.speed*dt);l.x+=dx/d*m;l.y+=dy/d*m;return false;
  }
  function updateLife(l,dt){
    if(l.status!=="moving"&&l.status!=="waiting")return;
    const r=routes[l.route],offset=(l.slot-1)*6;
    l.age+=dt;
    const tweak=(p)=>({x:p.x+(l.route%2?offset:0),y:p.y+(l.route%2?0:offset)});
    if(l.segment===0){
      if(moveToward(l,tweak(r.pre),dt))l.segment=1;
    }else if(l.segment===1){
      if(!isStitched(r.edge)){
        l.status="waiting";l.wait+=dt;
        if(l.wait>32){loseLife(l,"route")}
      }else{l.status="moving";l.segment=2;l.wait=0}
    }else if(l.segment===2){
      if(moveToward(l,tweak(r.post),dt))l.segment=3;
    }else if(l.segment===3){
      if(moveToward(l,tweak(r.garden),dt))l.segment=4;
    }else if(l.segment===4){
      if(!state.gardenConnected){
        l.status="waiting";l.wait+=dt;
        if(l.wait>40)loseLife(l,"garden")
      }else{l.status="moving";l.segment=5;l.wait=0}
    }else if(l.segment===5){
      if(moveToward(l,{x:195+(l.slot-1)*8,y:427+(l.route-1.5)*5},dt))saveLife(l)
    }
  }
  function saveLife(l){
    l.status="saved";state.saved++;burst(l.x,l.y,routes[l.route].color,12);
    announce(`${routes[l.route].name}抵达花园，已获救 ${state.saved} 个生命`);
    GamePlatform.emit("life_saved",{id:l.id,route:routes[l.route].edge,saved:state.saved});
  }
  function loseLife(l,reason){
    l.status="lost";state.lost++;burst(l.x,l.y,"#8c8793",7);
    GamePlatform.emit("life_lost",{id:l.id,reason,lost:state.lost});
  }
  function burst(x,y,color,count){
    const n=state.reducedMotion?Math.min(3,count):count;
    for(let i=0;i<n;i++){const a=rand()*Math.PI*2,s=12+rand()*24;state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-8,life:.8+rand()*.5,color})}
  }
  function stitch(from,to){
    const edge=edgeByPair.get(from+"|"+to);
    if(!edge||isStitched(edge.id)){invalidFeedback(from,to,edge?"这一针已经缝好了":"锚点不匹配");return false}
    if(state.thread<edge.cost){invalidFeedback(from,to,"金线不够");return false}
    state.thread-=edge.cost;state.stitches.push({...edge,stitchedAt:state.elapsed});
    if(edge.role==="garden")state.gardenConnected=true;
    burst(anchorById[edge.a].x,anchorById[edge.a].y,edge.color,8);
    burst(anchorById[edge.b].x,anchorById[edge.b].y,edge.color,8);
    state.cameraShake=state.reducedMotion?0:5;$("undoBtn").disabled=false;
    if(!state.firstInput){state.firstInput=true;GamePlatform.emit("first_input",{action:"stitch",edgeId:edge.id})}
    if(edge.role==="bridge"&&!state.bridgeRevealed){state.bridgeRevealed=true;GamePlatform.emit("mechanic_reveal",{mechanic:"bridge",edgeId:edge.id})}
    if(edge.role==="barrier"&&!state.barrierRevealed){state.barrierRevealed=true;GamePlatform.emit("phase_change",{phase:"sand_barrier",edgeId:edge.id})}
    if(edge.role==="garden")GamePlatform.emit("phase_change",{phase:"garden_connected"});
    state.feedback.push({text:`${edge.name} 完成  −${edge.cost}`,x:(anchorById[edge.a].x+anchorById[edge.b].x)/2,y:(anchorById[edge.a].y+anchorById[edge.b].y)/2-18,life:1.5,color:edge.color});
    announce(`${edge.name}完成，消耗 ${edge.cost} 线长`);
    GamePlatform.emit("stitch_complete",{edgeId:edge.id,role:edge.role,cost:edge.cost,thread:state.thread});
    return true;
  }
  function invalidFeedback(from,to,reason){
    const a=anchorById[from],b=anchorById[to]||a||{x:195,y:400};
    state.feedback.push({text:`× ${reason} · 不消耗线`,x:b.x,y:b.y-24,life:1.3,color:"#ff7378"});
    state.cameraShake=state.reducedMotion?0:8;announce(`${reason}，没有消耗金线`);
    GamePlatform.emit("invalid_stitch",{from,to:to||null,reason,thread:state.thread});
  }
  function undo(){
    if(state.phase!=="playing"||state.paused||!state.stitches.length)return false;
    const edge=state.stitches.pop();state.thread+=edge.cost;
    if(edge.role==="garden")state.gardenConnected=false;
    $("undoBtn").disabled=!state.stitches.length;
    state.feedback.push({text:`撤回 ${edge.name}  +${edge.cost}`,x:195,y:690,life:1.35,color:"#ffe09a"});
    GamePlatform.emit("undo",{edgeId:edge.id,refund:edge.cost,thread:state.thread});
    announce(`已撤销${edge.name}，返还 ${edge.cost} 线长`);
    return true;
  }
  function finish(won,reason){
    if(state.phase!=="playing")return;
    state.phase=won?"won":"lost";state.paused=false;state.drag=null;
    $("pauseOverlay").hidden=true;$("result").hidden=false;$("undoBtn").disabled=true;
    $("resultEmblem").textContent=won?"✦":"⌁";$("resultEyebrow").textContent=won?"THE WORLD REMEMBERS":"THE THREAD RESTS";
    $("resultTitle").textContent=won?"世界重新有了颜色":"还有裂口等待下一针";
    $("resultDesc").textContent=won?`你用桥梁与屏障护送了 ${state.saved} 个小生命。每一道针脚都成了归途。`:`本次救回 ${state.saved} 个生命。撤销错误选择，先保证三条安全路线和花园回路。`;
    $("savedScore").textContent=state.saved;$("lostScore").textContent=12-state.saved;$("threadScore").textContent=state.thread;
    if(won)GamePlatform.emit("core_payoff",{saved:state.saved,thread:state.thread,elapsed:+state.elapsed.toFixed(2)});
    GamePlatform.emit("run_end",{result:won?"won":"lost",reason,saved:state.saved,lost:12-state.saved,thread:state.thread,
      elapsed:+state.elapsed.toFixed(2),roles:[...new Set(state.stitches.map(s=>s.role))]});
    const best=GamePlatform.loadLocal("best",0);if(state.saved>best)GamePlatform.saveLocal("best",state.saved);
  }
  function checkEnd(){
    const resolved=state.saved+state.lost;
    if(state.saved>=9&&state.gardenConnected&&resolved===12){finish(true,"all_resolved");return}
    if(state.elapsed>=180){
      state.lives.forEach(l=>{if(l.status!=="saved"&&l.status!=="lost")loseLife(l,"timeout")});
      finish(state.saved>=9&&state.gardenConnected,state.gardenConnected?"time":"garden_unconnected");
    }else if(resolved===12&&state.saved<9)finish(false,"insufficient_rescue");
  }
  function update(dt){
    state.elapsed=Math.min(180,state.elapsed+dt);spawnScheduled();
    state.lives.forEach(l=>updateLife(l,dt));
    state.feedback.forEach(f=>f.life-=dt);state.feedback=state.feedback.filter(f=>f.life>0);
    state.particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=25*dt});state.particles=state.particles.filter(p=>p.life>0);
    state.cameraShake=Math.max(0,state.cameraShake-dt*22);checkEnd();
  }

  function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
  function line(x1,y1,x2,y2,color,width=2,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
  function drawFabric(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#20263a");g.addColorStop(.6,"#151a2b");g.addColorStop(1,"#101421");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.07;ctx.strokeStyle="#cbd4e7";ctx.lineWidth=1;
    for(let y=0;y<H;y+=6){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+2);ctx.stroke()}
    for(let x=0;x<W;x+=7){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+3,H);ctx.stroke()}ctx.globalAlpha=1;
  }
  function drawHud(){
    ctx.fillStyle="#101525dd";rr(12,14,366,118,22);ctx.fill();ctx.strokeStyle="#ffffff12";ctx.stroke();
    ctx.fillStyle="#aeb7cc";ctx.font="600 11px sans-serif";ctx.fillText("剩余金线",25,38);
    ctx.fillStyle="#fff1c5";ctx.font="800 25px sans-serif";ctx.fillText(Math.ceil(state.thread)+" cm",25,65);
    ctx.fillStyle="#aeb7cc";ctx.font="600 11px sans-serif";ctx.fillText("归园生命",25,92);ctx.fillText("剩余时间",205,92);
    ctx.fillStyle="#fff1c5";ctx.font="800 18px sans-serif";ctx.fillText(`${state.saved} / 12`,88,92);
    const remain=Math.max(0,180-state.elapsed),m=Math.floor(remain/60),s=Math.floor(remain%60);
    ctx.textAlign="right";ctx.fillStyle=remain<30?"#ff8a82":"#c8cede";ctx.font="800 18px monospace";ctx.fillText(`${m}:${String(s).padStart(2,"0")}`,360,92);ctx.textAlign="left";
    const tg=ctx.createLinearGradient(25,0,360,0);tg.addColorStop(0,"#ef9b4e");tg.addColorStop(.55,"#ffe19a");tg.addColorStop(1,"#72d9b0");
    ctx.fillStyle=tg;rr(25,108,335*(state.thread/state.maxThread),8,4);ctx.fill();
    ctx.fillStyle="#343b51";rr(25,108,335,8,4);ctx.fill();
    ctx.fillStyle=tg;rr(25,108,335*(state.thread/state.maxThread),8,4);ctx.fill();
    ctx.fillStyle="#858da2";ctx.font="500 10px sans-serif";ctx.fillText("拖动匹配锚点 · 错误连接不耗线",25,128);
  }
  function drawWorld(){
    const repaired=state.stitches.length/edges.length,bright=Math.min(1,repaired*1.1);
    ctx.save();ctx.shadowColor="#0008";ctx.shadowBlur=18;ctx.fillStyle=`hsl(${116+state.layoutVariant*4} ${16+bright*33}% ${21+bright*18}%)`;
    ctx.beginPath();ctx.moveTo(25,307);ctx.bezierCurveTo(55,188,128,133,206,143);ctx.bezierCurveTo(304,135,370,226,367,336);
    ctx.bezierCurveTo(382,478,328,661,220,690);ctx.bezierCurveTo(108,710,26,593,27,458);ctx.closePath();ctx.fill();ctx.restore();
    // patchwork fields
    const patches=[
      [47,255,112,126,"#467258",isStitched("west_bridge")],[151,164,133,111,"#537d87",isStitched("north_barrier")],
      [258,301,105,149,"#90594d",isStitched("east_bridge")],[143,533,140,125,"#65517d",isStitched("south_barrier")]
    ];
    patches.forEach(([x,y,w,h,c,on])=>{
      ctx.save();ctx.globalAlpha=on?.9:.22;ctx.fillStyle=on?c:"#393c46";rr(x,y,w,h,26);ctx.fill();
      ctx.strokeStyle=on?"#f4e3ba33":"#aaa3a31f";ctx.setLineDash([4,5]);ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    });
    // cracks and storm zones
    drawHazard("west_bridge",46,330,74,24,"crack");drawHazard("east_bridge",279,385,70,24,"crack");
    drawHazard("north_barrier",176,177,100,58,"sand");drawHazard("south_barrier",167,548,110,62,"sand");
    drawGarden();
  }
  function drawHazard(id,x,y,w,h,type){
    const fixed=isStitched(id);ctx.save();
    if(type==="crack"){
      ctx.strokeStyle=fixed?"#4b8065":"#070a12";ctx.lineWidth=fixed?3:9;ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x+18,y+4);ctx.lineTo(x+35,y+h-4);ctx.lineTo(x+52,y+5);ctx.lineTo(x+w,y+h/2);ctx.stroke();
    }else{
      ctx.fillStyle=fixed?"#77cfe218":"#b99a6050";rr(x,y,w,h,18);ctx.fill();ctx.strokeStyle=fixed?"#94e3ec55":"#e7bf7260";ctx.setLineDash([3,7]);
      for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(x+5,y+12+i*11);ctx.quadraticCurveTo(x+w/2,y+4+i*13,x+w-5,y+11+i*11);ctx.stroke()}
    }ctx.restore();
  }
  function drawGarden(){
    const glow=state.gardenConnected?1:.25;ctx.save();ctx.shadowColor="#ffd969";ctx.shadowBlur=state.gardenConnected?28:0;
    ctx.fillStyle=state.gardenConnected?"#4d7a50":"#343944";ctx.beginPath();ctx.arc(195,419,51,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(255,222,139,${glow})`;ctx.lineWidth=3;ctx.setLineDash([3,6]);ctx.stroke();
    for(let i=0;i<8;i++){const a=i*Math.PI/4,r=25;ctx.fillStyle=state.gardenConnected?["#ffd46c","#f39e93","#9bd7a6"][i%3]:"#6d6c70";ctx.beginPath();ctx.arc(195+Math.cos(a)*r,419+Math.sin(a)*r,6,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle=state.gardenConnected?"#fff3b8":"#777985";ctx.font="900 18px serif";ctx.textAlign="center";ctx.fillText("✦",195,425);ctx.font="700 10px sans-serif";ctx.fillText(state.gardenConnected?"中心花园 · 已连接":"中心花园 · 待连接",195,488);ctx.textAlign="left";ctx.restore();
  }
  function drawGuideEdges(){
    edges.forEach(e=>{
      const a=anchorById[e.a],b=anchorById[e.b];if(isStitched(e.id))return;
      line(a.x,a.y,b.x,b.y,"#fff2",1.5,[3,7]);
      ctx.fillStyle="#bbb8b6";ctx.font="700 9px sans-serif";ctx.textAlign="center";
      ctx.fillText(`${e.cost}`,(a.x+b.x)/2,(a.y+b.y)/2-7);ctx.textAlign="left";
    });
  }
  function drawStitches(){
    state.stitches.forEach(e=>{
      const a=anchorById[e.a],b=anchorById[e.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),nx=-dy/d,ny=dx/d;
      ctx.save();ctx.shadowColor=e.color;ctx.shadowBlur=10;ctx.strokeStyle="#3b2b16";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.shadowBlur=4;ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      const count=Math.max(3,Math.floor(d/13));for(let i=1;i<count;i++){const t=i/count,x=a.x+dx*t,y=a.y+dy*t;line(x-nx*5,y-ny*5,x+nx*5,y+ny*5,"#fff0bd",1.5)}
      ctx.restore();
    });
    if(state.drag){
      const a=anchorById[state.drag.from],p=state.drag,ok=p.hover&&edgeByPair.has(state.drag.from+"|"+p.hover);
      line(a.x,a.y,p.x,p.y,ok?"#ffe490":"#ff7b7e",3,[5,4]);
    }
  }
  function drawAnchors(){
    anchors.forEach(a=>{
      const used=edges.some(e=>isStitched(e.id)&&(e.a===a.id||e.b===a.id)),hover=state.drag?.hover===a.id;
      ctx.save();ctx.shadowColor=hover?"#fff4b0":used?"#e9ba62":"#ffffff55";ctx.shadowBlur=hover?18:8;
      ctx.fillStyle=used?"#d49b48":"#242b3e";ctx.strokeStyle=hover?"#fff6c5":"#f1c977";ctx.lineWidth=hover?4:2;
      ctx.beginPath();ctx.arc(a.x,a.y,hover?10:8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#fff2c8";ctx.beginPath();ctx.arc(a.x,a.y,2.4,0,Math.PI*2);ctx.fill();ctx.restore();
    });
  }
  function drawLives(){
    state.lives.forEach(l=>{
      if(l.status==="lost")return;const r=routes[l.route];
      ctx.save();ctx.translate(l.x,l.y);if(l.status==="waiting"&&!state.reducedMotion)ctx.translate(0,Math.sin(state.elapsed*7+l.slot)*2);
      ctx.shadowColor=r.color;ctx.shadowBlur=l.status==="saved"?12:7;ctx.fillStyle=r.color;ctx.strokeStyle="#fff9e5";ctx.lineWidth=1.4;
      if(r.glyph==="●"){ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();ctx.stroke()}
      else if(r.glyph==="◆"){ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(7,0);ctx.lineTo(0,7);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();ctx.stroke()}
      else if(r.glyph==="▲"){ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(7,6);ctx.lineTo(-7,6);ctx.closePath();ctx.fill();ctx.stroke()}
      else{ctx.fillRect(-5,-5,10,10);ctx.strokeRect(-5,-5,10,10)}
      ctx.fillStyle="#161b29";ctx.beginPath();ctx.arc(-2,-1,1,0,7);ctx.arc(2,-1,1,0,7);ctx.fill();ctx.restore();
      if(l.status==="waiting"){
        ctx.fillStyle="#ffefc1";ctx.font="800 10px sans-serif";ctx.textAlign="center";ctx.fillText("!",l.x,l.y-13);ctx.textAlign="left";
      }
    });
  }
  function drawLegend(){
    ctx.fillStyle="#121726dd";rr(119,704,252,60,17);ctx.fill();ctx.strokeStyle="#ffffff12";ctx.stroke();
    ctx.font="700 10px sans-serif";ctx.fillStyle="#c6cbd8";ctx.fillText("路线",136,725);
    routes.forEach((r,i)=>{ctx.fillStyle=r.color;ctx.fillText(r.glyph,136+i*53,746);ctx.fillStyle="#989fb2";ctx.font="600 9px sans-serif";ctx.fillText(r.name,149+i*53,746)});
  }
  function render(){
    const sx=state.cameraShake?(rand()-.5)*state.cameraShake:0,sy=state.cameraShake?(rand()-.5)*state.cameraShake:0;
    ctx.save();ctx.translate(sx,sy);drawFabric();drawWorld();drawGuideEdges();drawStitches();drawLives();drawAnchors();
    state.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,2.5,2.5)});ctx.globalAlpha=1;
    state.feedback.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.color;ctx.font="800 12px sans-serif";ctx.textAlign="center";ctx.fillText(f.text,f.x,f.y-(1.3-f.life)*12);ctx.textAlign="left"});ctx.globalAlpha=1;
    drawHud();drawLegend();ctx.restore();
  }
  function frame(ts){
    const raw=Math.min(.1,(ts-state.lastTs)/1000||0);state.lastTs=ts;
    if(state.phase==="playing"&&!state.paused){
      state.acc+=raw*SPEED;let steps=0;
      while(state.acc>=1/60&&steps<360){update(1/60);state.acc-=1/60;steps++}
    }
    render();requestAnimationFrame(frame);
  }
  function resize(){
    const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
    canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
    ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
  }
  function point(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
  function hitAnchor(p,exclude=null){
    let best=null,dist=26;
    anchors.forEach(a=>{if(a.id===exclude)return;const d=Math.hypot(p.x-a.x,p.y-a.y);if(d<dist){dist=d;best=a}});
    return best;
  }
  canvas.addEventListener("pointerdown",ev=>{
    if(state.phase!=="playing"||state.paused)return;const p=point(ev),a=hitAnchor(p);
    if(!a)return;canvas.setPointerCapture?.(ev.pointerId);state.drag={from:a.id,x:p.x,y:p.y,hover:null,pointerId:ev.pointerId};
  });
  canvas.addEventListener("pointermove",ev=>{
    if(!state.drag||state.drag.pointerId!==ev.pointerId)return;const p=point(ev),a=hitAnchor(p,state.drag.from);
    state.drag.x=p.x;state.drag.y=p.y;state.drag.hover=a?.id||null;
  });
  function endDrag(ev){
    if(!state.drag||state.drag.pointerId!==ev.pointerId)return;const d=state.drag,p=point(ev),to=hitAnchor(p,d.from);
    state.drag=null;if(to)stitch(d.from,to.id);else invalidFeedback(d.from,null,"没有落在锚点上");
  }
  canvas.addEventListener("pointerup",endDrag);canvas.addEventListener("pointercancel",()=>{state.drag=null});

  $("startBtn").addEventListener("click",startRun);
  $("pauseBtn").addEventListener("click",()=>state.paused?showResume():pauseGame("manual"));
  $("continueBtn").addEventListener("click",resumeGame);
  $("undoBtn").addEventListener("click",undo);
  $("replayBtn").addEventListener("click",()=>{resetRun(true);startRun()});
  $("muteBtn").addEventListener("click",()=>{
    state.mute=!state.mute;$("muteBtn").textContent=state.mute?"静音":"声音";GamePlatform.saveLocal("mute",state.mute);
  });
  $("motionBtn").addEventListener("click",()=>{
    state.reducedMotion=!state.reducedMotion;$("motionBtn").textContent=state.reducedMotion?"简动":"动效";GamePlatform.saveLocal("reducedMotion",state.reducedMotion);
  });
  document.addEventListener("visibilitychange",()=>{if(document.hidden)pauseGame("hidden");else showResume()});
  window.addEventListener("blur",()=>{if(!TEST)pauseGame("blur")});
  new ResizeObserver(resize).observe(canvas);

  function publicState(){
    return {
      gameId:GAME_ID,phase:state.phase,runId:state.runId,elapsed:+state.elapsed.toFixed(3),timeRemaining:+Math.max(0,180-state.elapsed).toFixed(3),
      paused:state.paused,pauseReason:state.pauseReason,thread:state.thread,maxThread:state.maxThread,
      stitchedEdges:state.stitches.map(s=>s.id),stitches:state.stitches.map(s=>({id:s.id,role:s.role,cost:s.cost})),
      saved:state.saved,lost:state.lost,spawned:state.lives.length,gardenConnected:state.gardenConnected,
      bridgeBuilt:state.stitches.some(s=>s.role==="bridge"),barrierBuilt:state.stitches.some(s=>s.role==="barrier"),
      mechanics:{firstInput:state.firstInput,bridge:state.bridgeRevealed,barrier:state.barrierRevealed},
      anchors:anchors.map(a=>({id:a.id,x:a.x,y:a.y,type:a.type})),
      availableEdges:edges.map(e=>({id:e.id,a:e.a,b:e.b,cost:e.cost,role:e.role,stitched:isStitched(e.id)}))
    };
  }
  window.__GAME_TEST__={
    getState:()=>JSON.parse(JSON.stringify(publicState())),
    reset:()=>{seed=initialSeed;resetRun(false);return publicState()},
    start:()=>{startRun();return publicState()},
    stitch:(from,to)=>{if(state.phase==="intro")startRun();return {ok:stitch(from,to),state:publicState()}},
    connect:(from,to)=>{if(state.phase==="intro")startRun();return {ok:stitch(from,to),state:publicState()}},
    undo:()=>({ok:undo(),state:publicState()}),
    resume:()=>{resumeGame();return publicState()},
    pause:()=>{pauseGame("test");return publicState()},
    advance:(seconds)=>{
      if(state.phase==="intro")startRun();const total=Math.max(0,Math.min(180,Number(seconds)||0)),n=Math.ceil(total*60);
      for(let i=0;i<n&&state.phase==="playing";i++)update(1/60);render();return publicState();
    },
    finish:()=>{if(state.phase==="intro")startRun();window.__GAME_TEST__.advance(180);return publicState()}
  };

  state.mute=forcedMute||GamePlatform.loadLocal("mute",false);
  state.reducedMotion=prefersReduce||GamePlatform.loadLocal("reducedMotion",false);
  $("muteBtn").textContent=state.mute?"静音":"声音";$("motionBtn").textContent=state.reducedMotion?"简动":"动效";
  resetRun(false);resize();requestAnimationFrame(frame);
})();
</script>
</body>
