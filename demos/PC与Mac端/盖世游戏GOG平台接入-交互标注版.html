<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盖世游戏 GOG 平台接入 · 真实页面交互标注</title>
  <style>
    :root {
      color-scheme:dark;
      --shell:#14161e; --nav:#1e2235; --panel:#1a1e2a; --canvas:#0f1118;
      --app:#0d0f15; --card:#1a1a1a; --elevated:#252525; --line:rgba(255,255,255,.1);
      --text:#fff; --sub:#e6e6e6; --muted:#7b7b7b; --gold:#ffcc43; --blue:#338feb;
      --purple:#8174fa; --green:#33d8a4; --nav-width:220px; --anno-width:400px;
      --font:'MiSans VF','MiSans','PingFang SC','Microsoft YaHei',sans-serif;
    }
    *{box-sizing:border-box}
    html,body{width:100%;min-width:1080px;height:100%;margin:0;overflow:hidden;background:var(--shell);color:var(--text);font-family:var(--font)}
    button,select,input{font:inherit;color:inherit}button{cursor:pointer}
    .gog-demo-shell{display:flex;width:100%;height:100%;background:var(--shell)}
    .left-nav{width:var(--nav-width);flex:0 0 var(--nav-width);padding:22px 14px;overflow:auto;border-right:1px solid var(--line);background:var(--nav)}
    .brand{display:flex;align-items:center;gap:10px;padding:0 10px 20px;border-bottom:1px solid var(--line)}
    .brand-mark{display:grid;width:36px;height:36px;place-items:center;border-radius:11px;background:linear-gradient(145deg,#9b79ff,#5d36d7);font-weight:800}
    .brand strong,.brand small{display:block}.brand strong{font-size:14px}.brand small{margin-top:3px;color:#8f98ad;font-size:11px}
    .nav-group{margin-top:20px}.nav-group-title{margin:0 10px 7px;color:#7f899f;font-size:11px;letter-spacing:.08em}
    .nav-item{display:flex;width:100%;align-items:center;gap:9px;padding:9px 11px;border:0;border-radius:9px;background:transparent;color:#b8c0d1;text-align:left;font-size:12px}
    .nav-item:hover{background:rgba(255,255,255,.05)}.nav-item.active{background:rgba(132,94,247,.16);color:#eee8ff}
    .nav-dot{width:7px;height:7px;border-radius:50%;background:#596177}.nav-item.active .nav-dot{background:#9b79ff}
    .demo-stage{position:relative;display:flex;min-width:0;flex:1;flex-direction:column}
    .stage-toolbar{display:flex;min-height:64px;align-items:center;justify-content:space-between;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line)}
    .stage-heading h1{margin:0;font-size:15px}.stage-heading p{margin:4px 0 0;color:#8f98ad;font-size:12px}
    .simulation-control{display:flex;align-items:center;gap:8px;color:#8f98ad;font-size:12px}.simulation-control select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#202536}
    .demo-canvas{display:grid;min-height:0;flex:1;overflow:auto;place-items:center;padding:28px;background:radial-gradient(circle at 50% 38%,rgba(132,94,247,.08),transparent 34%),var(--canvas)}
    .panel-restore{position:absolute;z-index:4;top:14px;right:18px;display:none;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#202536}
    .gog-demo-shell.panel-hidden .panel-restore{display:block}.gog-demo-shell.panel-hidden .stage-toolbar{padding-right:132px}
    .anno-panel{display:flex;width:var(--anno-width);flex:0 0 var(--anno-width);flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
    .gog-demo-shell.panel-hidden .anno-panel{display:none}
    .anno-header{display:flex;min-height:64px;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}.anno-header h2{flex:1;margin:0;font-size:15px}
    .anno-header button,.anno-tabs button{height:32px;border:1px solid var(--line);border-radius:8px;background:transparent;color:#aab3c5;font-size:11px}
    .anno-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px 0}.anno-tabs button{height:38px}.anno-tabs button.active{background:rgba(132,94,247,.16);color:#eee8ff}
    .anno-scroll{min-height:0;flex:1;overflow:auto;padding:18px}.anno-context{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035)}
    .anno-context small{color:#a991ff;font-weight:700}.anno-context h3{margin:9px 0 8px;font-size:16px}.anno-context p{margin:0;color:#8f98ad;font-size:12px;line-height:1.65}
    .app-viewport{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:var(--app);color:#f5f7fb;box-shadow:0 30px 80px rgba(0,0,0,.45)}
    .app-viewport[data-orientation="portrait"]{width:402px;height:874px}.app-viewport[data-orientation="landscape"]{width:874px;height:402px}
    .app-scroll{height:100%;overflow:auto;scrollbar-width:none}.app-scroll::-webkit-scrollbar{display:none}.portrait-layout,.landscape-layout{min-height:100%;background:var(--app)}
    .stub-page{display:grid;height:100%;place-items:center;padding:24px;text-align:center}.stub-page div{max-width:320px}.stub-page h2{margin:12px 0;font-size:22px}.stub-page p{color:var(--muted);line-height:1.6}
    [data-annotation-ref]{position:relative}.annotation-flash{outline:2px solid #faad14;outline-offset:3px}
    @media(max-height:820px){.demo-canvas{padding:18px}}
  </style>
</head>
<body>
  <main class="gog-demo-shell" id="gogDemoShell">
    <aside class="left-nav" id="leftNav"></aside>
    <section class="demo-stage">
      <div class="stage-toolbar" id="stageToolbar"></div>
      <div class="demo-canvas" id="demoCanvas"></div>
      <button class="panel-restore" id="panelRestore" data-action="toggle-panel">展开标注</button>
    </section>
    <aside class="anno-panel" id="annoPanel">
      <header class="anno-header"><h2>交互标注</h2><button id="toggleMarkers" data-action="toggle-markers">显示标号</button><button id="togglePanel" data-action="toggle-panel">收起</button></header>
      <nav class="anno-tabs"><button id="interactionTab" data-action="anno-tab" data-value="interaction">交互说明</button><button id="edgeTab" data-action="anno-tab" data-value="edge">异常&amp;边界</button></nav>
      <div class="anno-scroll" id="annoScroll"></div>
    </aside>
  </main>
  <script>
    const PLATFORM_PRIORITY = ['steam','epic','gog'];
    const PLATFORM_GAME_KEY = ['gameId','platformAppId'];
    const GOG_ACCOUNT = {
      platform:'gog', supportsAccountValue:false, accountValue:null,
      username:'GalaxyRider', gogId:'gog_20876491', avatar:'G',
      gameCount:126, totalPlaytime:'438 小时', lastSyncedAt:'今天 14:32',
    };
    const FLOW = [
      { id:'profile-portrait', group:'我的页', label:'我的 · 竖屏', orientation:'portrait' },
      { id:'gog-login', group:'我的页', label:'GOG 官方授权', orientation:'portrait' },
      { id:'library-home-portrait', group:'游戏库', label:'首页 · 竖屏', orientation:'portrait' },
      { id:'library-home-landscape', group:'游戏库', label:'首页 · 横屏', orientation:'landscape' },
      { id:'gog-library-portrait', group:'游戏库', label:'GOG 账号库 · 竖屏', orientation:'portrait' },
      { id:'gog-library-landscape', group:'游戏库', label:'GOG 账号库 · 横屏', orientation:'landscape' },
      { id:'search-portrait', group:'搜索', label:'搜索 · 竖屏', orientation:'portrait' },
      { id:'search-landscape', group:'搜索', label:'搜索 · 横屏', orientation:'landscape' },
      { id:'detail-portrait', group:'详情', label:'详情 · 竖屏', orientation:'portrait' },
      { id:'detail-landscape', group:'详情', label:'详情 · 横屏', orientation:'landscape' },
    ];
    const SIMULATIONS = ['normal','loading','empty','error','expired','cancelled','cached'];
    const SIMULATION_LABELS = { normal:'正常',loading:'加载中',empty:'空数据',error:'加载失败',expired:'授权过期',cancelled:'用户取消',cached:'缓存降级' };
    const state = {
      screen:'profile-portrait', orientation:'portrait', annotationTab:'interaction', showMarkers:false, panelHidden:false,
      simulation:'normal', platformSwitchOpen:false, profilePlatform:'gog', sourcePlatform:null, selectedPlatform:'gog', selectedGame:null,
      loginOrigin:null, loginOrientation:null, authorizationMode:null, loginError:null, gogRefreshInFlight:false, gogRefreshRequestCount:0,
      ownedPlatforms:['steam','epic','gog'], lowConfidenceNoMerge:true,
      accountByPlatform:{
        steam:{ bindStatus:'bound', tokenStatus:'valid' }, epic:{ bindStatus:'bound', tokenStatus:'valid' },
        gog:{ bindStatus:'bound', tokenStatus:'valid', account:{ ...GOG_ACCOUNT } },
      },
    };
    function resolveSelectedPlatform({ sourcePlatform, ownedPlatforms, accountByPlatform }) {
      if (sourcePlatform) return sourcePlatform;
      return PLATFORM_PRIORITY.find(platform => ownedPlatforms.includes(platform) && accountByPlatform[platform]?.bindStatus === 'bound' && accountByPlatform[platform]?.tokenStatus === 'valid') || null;
    }
    function currentPage(){return FLOW.find(page=>page.id===state.screen)||FLOW[0]}
    function selectPage(pageId){const next=FLOW.find(page=>page.id===pageId);if(!next)throw new Error(`Unknown page: ${pageId}`);state.screen=next.id;state.orientation=next.orientation;state.platformSwitchOpen=false;render()}
    function renderNavigation(){
      const groups=FLOW.reduce((result,page)=>{(result[page.group]||=[]).push(page);return result},{});
      leftNav.innerHTML=`<div class="brand"><span class="brand-mark">G</span><span><strong>GOG 接入</strong><small>真实页面交互标注</small></span></div>${Object.entries(groups).map(([group,pages])=>`<section class="nav-group"><h2 class="nav-group-title">${group}</h2>${pages.map(page=>`<button class="nav-item${page.id===state.screen?' active':''}" data-page="${page.id}"><span class="nav-dot"></span><span>${page.label}</span></button>`).join('')}</section>`).join('')}`;
    }
    function renderToolbar(page){stageToolbar.innerHTML=`<div class="stage-heading"><h1>${page.group} / ${page.label}</h1><p>${page.orientation==='landscape'?'横屏 874 × 402':'竖屏 402 × 874'} · 真实 DOM</p></div><label class="simulation-control">状态模拟<select data-action="simulation">${SIMULATIONS.map(item=>`<option value="${item}"${state.simulation===item?' selected':''}>${SIMULATION_LABELS[item]}</option>`).join('')}</select></label>`}
    function renderStub(screen,orientation,title,ref='stub-target'){return `<section class="app-viewport" data-screen="${screen}" data-orientation="${orientation}"><div class="stub-page"><div data-annotation-ref="${ref}"><strong>${orientation==='landscape'?'横屏独立布局':'竖屏独立布局'}</strong><h2>${title}</h2><p>正在基于现行页面重建，不使用截图底图或整体缩放。</p></div></div></section>`}
    function renderProfilePortrait(){return renderStub('profile-portrait','portrait','我的','account-summary')}
    function renderGogLogin(){return `<section class="app-viewport" data-screen="gog-login" data-orientation="portrait"><div class="stub-page"><div data-annotation-ref="official-login"><h2>GOG 官方登录</h2><p>盖世游戏只接收授权结果，不读取、不保存邮箱或密码。</p></div></div></section>`}
    function renderLibraryHomePortrait(){return renderStub('library-home-portrait','portrait','游戏库首页','gog-entry')}
    function renderLibraryHomeLandscape(){return renderStub('library-home-landscape','landscape','游戏库首页','gog-entry')}
    function renderGogLibraryPortrait(){return renderStub('gog-library-portrait','portrait','GOG 账号游戏库','account-summary')}
    function renderGogLibraryLandscape(){return renderStub('gog-library-landscape','landscape','GOG 账号游戏库','account-summary')}
    function renderSearchPortrait(){return renderStub('search-portrait','portrait','搜索','search-results')}
    function renderSearchLandscape(){return renderStub('search-landscape','landscape','搜索','search-results')}
    function renderDetailPortrait(){return renderStub('detail-portrait','portrait','游戏详情','detail-context')}
    function renderDetailLandscape(){return renderStub('detail-landscape','landscape','游戏详情','detail-context')}
    function renderRealPage(page){const renderers={'profile-portrait':renderProfilePortrait,'gog-login':renderGogLogin,'library-home-portrait':renderLibraryHomePortrait,'library-home-landscape':renderLibraryHomeLandscape,'gog-library-portrait':renderGogLibraryPortrait,'gog-library-landscape':renderGogLibraryLandscape,'search-portrait':renderSearchPortrait,'search-landscape':renderSearchLandscape,'detail-portrait':renderDetailPortrait,'detail-landscape':renderDetailLandscape};const renderer=renderers[page.id];if(!renderer)throw new Error(`Missing renderer: ${page.id}`);return renderer()}
    function renderAnnotations(page){interactionTab.classList.toggle('active',state.annotationTab==='interaction');edgeTab.classList.toggle('active',state.annotationTab==='edge');toggleMarkers.textContent=state.showMarkers?'隐藏标号':'显示标号';annoScroll.innerHTML=`<section class="anno-context"><small>${state.annotationTab==='interaction'?'INTERACTION':'EDGE CASE'}</small><h3>${page.label}</h3><p>页面标注将随真实 DOM 分阶段对齐。</p></section>`}
    function render(){const page=currentPage();state.orientation=page.orientation;gogDemoShell.classList.toggle('panel-hidden',state.panelHidden);renderNavigation();renderToolbar(page);demoCanvas.innerHTML=renderRealPage(page);renderAnnotations(page)}
    document.addEventListener('click',event=>{const pageButton=event.target.closest('.nav-item[data-page]');if(pageButton){selectPage(pageButton.dataset.page);return}const action=event.target.closest('[data-action]');if(!action)return;if(action.dataset.action==='toggle-panel')state.panelHidden=!state.panelHidden;else if(action.dataset.action==='toggle-markers')state.showMarkers=!state.showMarkers;else if(action.dataset.action==='anno-tab')state.annotationTab=action.dataset.value;else return;render()});
    document.addEventListener('change',event=>{if(event.target.matches('[data-action="simulation"]')){state.simulation=event.target.value;render()}});
    window.GogDemoApp={state,GOG_ACCOUNT,resolveSelectedPlatform,selectPage,render};
    render();
  </script>
</body>
</html>
