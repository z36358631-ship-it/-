    function renderGogLibraryLandscape(){return renderPlatformLibrary({orientation:'landscape',screen:'gog-library-landscape'})}
    function convertEpicScore(score){return Math.min(10,Math.max(0,Math.round(Number(score)*20)/10))}
    function renderSearchRows(){return SEARCH_RESULTS.map(result=>`<button type="button" class="search-result" data-search-result data-game-id="${result.gameId}" data-platform-app-id="${result.platformAppId}" data-platform="${result.platform}"><span class="search-result__cover-wrap"><img class="search-result__cover" src="${result.cover}" alt=""><span class="search-result__platform">${result.platform.toUpperCase()}</span></span><span class="search-result__body"><strong>${result.name}</strong>${result.platform==='epic'&&result.rawScore!=null?`<span class="search-result__score" data-score>★ ${convertEpicScore(result.rawScore).toFixed(1)}</span>`:'<span class="search-result__no-score">暂无评分</span>'}</span></button>`).join('')}
    function renderSearchLayout({orientation,screen}){const top=`<section class="search-top">${orientation==='portrait'?renderPortraitStatus():''}<label class="search-box"><span>⌕</span><input value="赛博朋克" readonly aria-label="搜索词"></label><nav class="search-tabs"><button type="button" class="active">搜索结果</button><button type="button">热游推荐</button></nav></section>`;if(orientation==='portrait')return `<section class="app-viewport search-page search-page--portrait" data-screen="${screen}" data-orientation="portrait"><main class="app-scroll search-page__content">${top}<section class="search-results" data-annotation-ref="search-results">${renderSearchRows()}</section></main>${renderPortraitBottomNav('play')}</section>`;return `<section class="app-viewport search-page search-page--landscape" data-screen="${screen}" data-orientation="landscape"><main class="app-scroll search-page__content">${top}<div class="landscape-search-body"><section class="hot-search"><h2>热门搜索</h2><ol>${['生化危机7','侠盗猎车5','漫威蜘蛛侠：重制版','我的世界：地下城','千恋 * 万花'].map(item=>`<li>${item}</li>`).join('')}</ol></section><section class="search-results" data-annotation-ref="search-results">${renderSearchRows()}</section></div></main></section>`}
    function renderSearchPortrait(){return renderSearchLayout({orientation:'portrait',screen:'search-portrait'})}
    function renderSearchLandscape(){return renderSearchLayout({orientation:'landscape',screen:'search-landscape'})}
    function isPlatformAvailable(platform){const account=state.accountByPlatform[platform];return account?.bindStatus==='bound'&&account?.tokenStatus==='valid'}
    function getSelectedGameName(){const game=state.selectedGame;return SEARCH_RESULTS.find(item=>item.gameId===game?.gameId)?.name||GOG_GAMES.find(item=>item.gameId===game?.gameId)?.name||'赛博朋克 2077'}
    function getSelectedGameId(){return state.selectedGame?.gameId||'cyberpunk-2077'}
    function getPlatformVersion(gameId,platform){return GAME_PLATFORM_VERSIONS.find(item=>item.gameId===gameId&&item.platform===platform)||null}
    function availablePlatformsForGame(gameId){return PLATFORM_PRIORITY.filter(platform=>state.ownedPlatforms.includes(platform)&&getPlatformVersion(gameId,platform)&&isPlatformAvailable(platform))}
    function resolveDetailContext(){const gameId=getSelectedGameId();const fallback=resolveSelectedPlatform({sourcePlatform:state.sourcePlatform,ownedPlatforms:availablePlatformsForGame(gameId),accountByPlatform:state.accountByPlatform})||'steam';const platform=state.selectedPlatform||fallback;const detail=getPlatformVersion(gameId,platform)||DETAIL_BY_PLATFORM[platform];return {gameId,platform,detail,available:Boolean(getPlatformVersion(gameId,platform)&&isPlatformAvailable(platform))}}
    function renderPlatformIcon(platform){const labels={steam:'S',epic:'E',gog:'G'};return `<span class="launch-platform-icon" aria-hidden="true">${labels[platform]}</span>`}
    function renderObtainPlatforms(){return `<div class="obtain-platforms" data-obtain-platforms>${PLATFORM_PRIORITY.map(platform=>`<span data-obtain-platform="${platform}">${DETAIL_BY_PLATFORM[platform].label}</span>`).join('')}</div>`}
    function renderPlatformSwitch(){const platforms=availablePlatformsForGame(getSelectedGameId());return `<section class="platform-switch" data-platform-switch data-annotation-ref="platform-switch"><header><strong>选择启动平台</strong><button type="button" data-action="close-platform-switch">关闭</button></header><div class="platform-switch__options">${platforms.map(platform=>`<button type="button" data-action="select-detail-platform" data-platform="${platform}" class="${platform===state.selectedPlatform?'active':''}">${DETAIL_BY_PLATFORM[platform].label}</button>`).join('')}</div></section>`}
    function renderDetailPortrait(){const {platform,detail,available}=resolveDetailContext();const cloud=detail.cloud||'未获取';return `<section class="app-viewport detail-page detail-page--portrait" data-screen="detail-portrait" data-orientation="portrait">${renderPortraitTopBar('游戏详情')}<main class="app-scroll detail-page__content"><section class="detail-hero" aria-label="${getSelectedGameName()}"><img src="${DETAIL_MEDIA.cover}" alt=""></section><section class="detail-summary" data-annotation-ref="detail-context"><div class="detail-title-row"><h1>${getSelectedGameName()}</h1><span>8.8</span></div><p>奖项无数的开放世界，以极致视觉与自由选择呈现沉浸体验。</p><div class="detail-tags"><span>动作</span><span>角色扮演</span></div><section class="detail-engine"><div class="detail-engine__heading"><strong>PC游戏引擎</strong><button type="button" class="detail-platform-button" data-action="open-platform-switch" data-detail-platform-logo>${renderPlatformIcon(platform)}${detail.label}</button></div><dl><div><dt>游戏时长</dt><dd data-detail-hours>${detail.hours}</dd></div><div><dt>云存档</dt><dd data-detail-cloud>${cloud}</dd></div></dl>${renderObtainPlatforms()}${available?'':`<div class="source-unavailable" data-source-unavailable>当前 ${detail.label} 来源不可用，请重新登录 ${detail.label} 或手动切换平台；不会静默改用其他平台。</div>`}</section><section class="detail-copy"><h2>游戏介绍</h2><p>欢迎来到未来都市。你将在不同势力与选择中定义自己的故事，探索一个充满细节的开放世界。</p></section></section></main><div class="detail-actions"><button type="button" data-action="noop">秒玩</button><button type="button" class="detail-launch" data-launch-platform data-action="${available?'launch-selected':'reauthorize-source'}">${renderPlatformIcon(platform)}${available?detail.launch:`重新登录 ${detail.label}`}</button></div>${state.platformSwitchOpen?renderPlatformSwitch():''}</section>`}
    function renderDetailLandscape(){const {platform,detail,available}=resolveDetailContext();const cloud=detail.cloud||'未获取';return `<section class="app-viewport detail-page detail-page--landscape" data-screen="detail-landscape" data-orientation="landscape"><img class="landscape-detail-art" src="${DETAIL_MEDIA.backdrop}" alt=""><div class="landscape-detail-shade"></div><main class="landscape-detail-content" data-annotation-ref="detail-context"><button type="button" class="landscape-back" data-action="noop">‹</button><h1>${getSelectedGameName()}</h1><p>奖项无数的开放世界，以极致帧率呈现沉浸体验。</p><div class="detail-tags"><span>动作</span><span>角色扮演</span></div><div class="landscape-detail-actions"><button type="button" data-action="noop">秒玩</button><button type="button" class="detail-launch" data-launch-platform data-action="${available?'launch-selected':'reauthorize-source'}">${renderPlatformIcon(platform)}${available?detail.launch:`重新登录 ${detail.label}`}</button><button type="button" data-action="open-platform-switch" data-detail-platform-logo>${detail.label}</button></div>${renderObtainPlatforms()}${available?'':`<div class="source-unavailable" data-source-unavailable>请重新登录 ${detail.label} 或手动切换平台，不会静默改用其他平台。</div>`}</main><section class="landscape-metrics"><div><span>兼容性评价</span><strong>3.8 ★★★★</strong></div><div><span>云存档</span><strong data-detail-cloud>${cloud}</strong></div><div><span>游戏时长</span><strong data-detail-hours>${detail.hours}</strong></div><div><span>玩家评分</span><strong>8.8 特别好评</strong></div></section>${state.platformSwitchOpen?renderPlatformSwitch():''}</section>`}
    function renderRealPage(page){const renderers={'profile-portrait':renderProfilePortrait,'gog-login':renderGogLogin,'library-home-portrait':renderLibraryHomePortrait,'library-home-landscape':renderLibraryHomeLandscape,'gog-library-portrait':renderGogLibraryPortrait,'gog-library-landscape':renderGogLibraryLandscape,'search-portrait':renderSearchPortrait,'search-landscape':renderSearchLandscape,'detail-portrait':renderDetailPortrait,'detail-landscape':renderDetailLandscape};const renderer=renderers[page.id];if(!renderer)throw new Error(`Missing renderer: ${page.id}`);return renderer()}
    function beginAuthorization(mode){state.loginOrigin=state.screen;state.loginOrientation=state.orientation;state.authorizationMode=mode;state.loginError=null;selectPage('gog-login')}
    function openLibraryEntry(entryId){if(entryId!=='gog')return;const suffix=state.orientation==='landscape'?'landscape':'portrait';const gog=state.accountByPlatform.gog;if(gog.bindStatus!=='bound'||gog.tokenStatus!=='valid'){beginAuthorization('bind');return}selectPage(`gog-library-${suffix}`)}
    function openPlatformGame(card){state.selectedGame={gameId:card.dataset.gameId,platformAppId:card.dataset.platformAppId,platform:card.dataset.platform};state.sourcePlatform=card.dataset.platform;state.selectedPlatform=card.dataset.platform;const suffix=state.orientation==='landscape'?'landscape':'portrait';selectPage(`detail-${suffix}`)}
    function returnToLoginOrigin(){const origin=state.loginOrigin||'profile-portrait';state.authorizationMode=null;state.loginError=null;state.loginOrigin=null;state.loginOrientation=null;selectPage(origin)}
    function completeGogAuthorization(){const account=state.authorizationMode==='switch'?SWITCHED_GOG_ACCOUNT:GOG_ACCOUNT;state.accountByPlatform.gog={bindStatus:'bound',tokenStatus:'valid',account:{...account}};returnToLoginOrigin()}
    function closeAccountMenu(){state.accountMenuOpen=false}
    function selectProfilePlatform(platform){if(!PLATFORM_CAPABILITIES[platform])return;state.profilePlatform=platform;closeAccountMenu();state.showLogoutConfirm=false;render()}
    function refreshCurrentPlatform(){if(state.accountRefreshInFlight)return;state.accountRefreshInFlight=true;state.accountRefreshRequestCount+=1;closeAccountMenu();render();setTimeout(()=>{state.accountRefreshInFlight=false;const account=state.accountByPlatform[state.profilePlatform]?.account;if(account)account.lastSyncedAt='刚刚';render()},120)}
    function launchSelectedPlatform(){const gameId=getSelectedGameId();const version=getPlatformVersion(gameId,state.selectedPlatform);if(!version||!isPlatformAvailable(state.selectedPlatform))return;state.lastLaunchRequest={gameId,platform:state.selectedPlatform,platformAppId:version.platformAppId}}
    function openPlatformSwitch(){state.platformSwitchOpen=true;render()}
    function closePlatformSwitch(){state.platformSwitchOpen=false;render()}
    function selectDetailPlatform(platform){state.selectedPlatform=platform;state.platformSwitchOpen=false;render()}
    function renderStateFrame(page,kind,title,copy,action,extra=''){return `<section class="app-viewport state-page state-page--${kind}" data-screen="${page.id}" data-orientation="${page.orientation}" data-simulation-state="${kind}"><main class="state-page__body" data-annotation-ref="simulation-recovery">${extra}<span class="state-page__icon" aria-hidden="true">${kind==='empty'?'0':kind==='error'?'!':kind==='expired'?'⌛':kind==='cancelled'?'←':kind==='cached'?'C':'…'}</span><h2>${title}</h2><p>${copy}</p>${action?`<button type="button" data-action="${action.id}">${action.label}</button>`:''}</main></section>`}
    function renderLoadingState(page){return renderStateFrame(page,'loading','正在同步 GOG 数据','请稍候，当前操作不可重复提交。',null,'<div class="state-skeletons"><span class="state-skeleton"></span><span class="state-skeleton"></span><span class="state-skeleton"></span></div>')}
    function renderEmptyState(page){return renderStateFrame(page,'empty','暂无 GOG 游戏','账号已绑定，可重新同步游戏库。',{id:'simulation-refresh',label:'重新同步'})}
    function renderErrorState(page){return renderStateFrame(page,'error','GOG 数据加载失败','当前无可用缓存；绑定状态和其他平台数据均已保留。',{id:'simulation-retry',label:'重试'})}
    function renderExpiredState(page){return renderStateFrame(page,'expired','GOG 授权已过期','重新登录后返回当前页面。',{id:'simulation-reauthorize',label:'重新登录 GOG'})}
    function renderCancelledState(page){return renderStateFrame(page,'cancelled','已取消 GOG 授权','未写入新的绑定记录。',{id:'simulation-return',label:'返回原页面'})}
    function renderCachedState(page){const cache=`<div class="state-cache" data-cached-content>${GOG_GAMES.slice(0,2).map(game=>`<span><strong>${game.name}</strong><em>${game.hours}h</em></span>`).join('')}<p class="cache-timestamp" data-cache-timestamp>缓存时间：今天 14:32</p></div>`;return renderStateFrame(page,'cached','正在展示缓存内容','网络恢复后可重新同步。',{id:'simulation-retry',label:'重新同步'},cache)}
    function renderSimulationState(page){const renderer={loading:renderLoadingState,empty:renderEmptyState,error:renderErrorState,expired:renderExpiredState,cancelled:renderCancelledState,cached:renderCachedState}[state.simulation];return renderer?renderer(page):renderRealPage(page)}
    function annotationClass(id){return id==='G'?' global':id.startsWith('E')?' edge':''}
    function renderAnnotationMarkers(page){document.querySelectorAll('.annotation-marker').forEach(marker=>marker.remove());const groups=ANNOTATIONS[page.id]||{interaction:[],edge:[]};[...groups.interaction,...groups.edge].forEach(annotation=>{const target=document.querySelector(`[data-annotation-ref="${annotation.ref}"]`);if(!target)return;const marker=document.createElement('span');marker.className=`annotation-marker${annotationClass(annotation.id)}`;marker.textContent=annotation.id;marker.dataset.markerId=annotation.id;marker.dataset.ref=annotation.ref;target.appendChild(marker)})}
    function renderAnnotations(page){const items=ANNOTATIONS[page.id]?.[state.annotationTab]||[];interactionTab.classList.toggle('active',state.annotationTab==='interaction');edgeTab.classList.toggle('active',state.annotationTab==='edge');toggleMarkers.textContent=state.showMarkers?'隐藏标号':'显示标号';annoScroll.innerHTML=`<section class="anno-context"><small>${state.annotationTab==='interaction'?'INTERACTION':'EDGE CASE'}</small><h3>${page.label}</h3><p>${state.annotationTab==='interaction'?'当前页操作与跨页平台规则。':'异常、降级与恢复边界。'}</p><div class="anno-list">${items.map(item=>`<div class="anno-item" data-annotation-item data-page="${page.id}" data-id="${item.id}" data-ref="${item.ref}" role="button" tabindex="0"><div class="anno-head"><span class="anno-badge${annotationClass(item.id)}">${item.id}</span><span class="anno-title">${item.title}</span></div><div class="anno-body"><span><strong>触发：</strong>${item.trigger}</span><span><strong>展示：</strong>${item.display}</span><span><strong>交互：</strong>${item.interaction}</span></div></div>`).join('')}</div></section>`;renderAnnotationMarkers(page)}
    function flashAnnotationTarget(ref){const target=document.querySelector(`[data-annotation-ref="${ref}"]`);if(!target)return;target.classList.remove('annotation-flash');void target.offsetWidth;target.classList.add('annotation-flash');target.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});setTimeout(()=>target.classList.remove('annotation-flash'),760)}
    function recoverSimulation(){state.simulation='loading';render();setTimeout(()=>{state.simulation='normal';render()},120)}
    function render(){const page=currentPage();state.orientation=page.orientation;gogDemoShell.classList.toggle('panel-hidden',state.panelHidden);gogDemoShell.classList.toggle('markers-visible',state.showMarkers);renderNavigation();renderToolbar(page);demoCanvas.innerHTML=renderSimulationState(page);renderAnnotations(page)}
    document.addEventListener('click',event=>{
      const accountMenuClick=event.target.closest('[data-account-menu],[data-action="toggle-account-menu"]');
      if(state.accountMenuOpen&&!accountMenuClick){state.accountMenuOpen=false;render()}
      const platformSwitchClick=event.target.closest('[data-platform-switch],[data-action="open-platform-switch"]');
      if(state.platformSwitchOpen&&!platformSwitchClick){state.platformSwitchOpen=false;const interactive=event.target.closest('[data-action],[data-game-card],[data-search-result],[data-annotation-item],.nav-item[data-page]');if(!interactive){render();return}}
      const annotation=event.target.closest('[data-annotation-item]');if(annotation){flashAnnotationTarget(annotation.dataset.ref);return}
      const pageButton=event.target.closest('.nav-item[data-page]');if(pageButton){selectPage(pageButton.dataset.page);return}
      const gameCard=event.target.closest('[data-game-card],[data-search-result]');if(gameCard){openPlatformGame(gameCard);return}
      const action=event.target.closest('[data-action]');if(!action)return;
      const name=action.dataset.action;
      if(name==='open-library-entry'){openLibraryEntry(action.dataset.libraryEntry);return}
      if(name==='select-profile-platform'){selectProfilePlatform(action.dataset.profilePlatform);return}
      if(name==='toggle-account-menu'){state.accountMenuOpen=!state.accountMenuOpen;render();return}
      if(name==='refresh-platform'){refreshCurrentPlatform();return}
      if(name==='switch-platform'){closeAccountMenu();if(state.profilePlatform==='gog')beginAuthorization('switch');return}
      if(name==='logout-platform'){closeAccountMenu();state.showLogoutConfirm=true;render();return}
      if(name==='open-free-games'){state.lastExternalAction={type:'epic-free-games',url:'https://store.epicgames.com/zh-CN/free-games'};return}
      if(name==='bind-platform'){if(state.profilePlatform==='gog')beginAuthorization('bind');return}
      if(name==='bind-gog'){beginAuthorization('bind');return}
      if(name==='switch-gog'){beginAuthorization('switch');return}
      if(name==='gog-authorize-success'){completeGogAuthorization();return}
      if(name==='gog-authorize-cancel'){returnToLoginOrigin();return}
      if(name==='gog-authorize-failure'){state.loginError=state.authorizationMode==='switch'?'授权失败，旧账号 GalaxyRider 已保留。':'授权失败，未写入绑定记录。';render();return}
      if(name==='logout-gog'){state.showLogoutConfirm=true;render();return}
      if(name==='cancel-logout-gog'){state.showLogoutConfirm=false;render();return}
      if(name==='confirm-logout-gog'){const platform=state.screen.startsWith('gog-library')?'gog':state.profilePlatform;state.accountByPlatform[platform]={bindStatus:'unbound',tokenStatus:'none',account:null};state.showLogoutConfirm=false;render();return}
      if(name==='open-platform-switch'){openPlatformSwitch();return}
      if(name==='close-platform-switch'){closePlatformSwitch();return}
      if(name==='select-detail-platform'){selectDetailPlatform(action.dataset.platform);return}
      if(name==='reauthorize-source'){beginAuthorization('bind');return}
      if(name==='open-search'){selectPage(`search-${state.orientation}`);return}
      if(name==='simulation-refresh'||name==='simulation-retry'){recoverSimulation();return}
      if(name==='simulation-return'){state.simulation='normal';render();return}
      if(name==='simulation-reauthorize'){state.simulation='normal';beginAuthorization('bind');return}
      if(name==='launch-selected'){launchSelectedPlatform();return}
      if(name==='noop')return;
      if(name==='toggle-panel')state.panelHidden=!state.panelHidden;
      else if(name==='toggle-markers')state.showMarkers=!state.showMarkers;
      else if(name==='anno-tab')state.annotationTab=action.dataset.value;
      else return;
      render();
    });
    document.addEventListener('change',event=>{if(event.target.matches('[data-action="simulation"]')){state.simulation=event.target.value;render()}});
    document.addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;const annotation=event.target.closest('[data-annotation-item]');if(!annotation)return;event.preventDefault();flashAnnotationTarget(annotation.dataset.ref)});
    window.GogDemoApp={state,GOG_ACCOUNT,GOG_GAMES,SEARCH_RESULTS,DETAIL_BY_PLATFORM,GAME_PLATFORM_VERSIONS,convertEpicScore,normalizeGameName,matchGameCandidate,resolveSelectedPlatform,getPlatformVersion,availablePlatformsForGame,selectProfilePlatform,refreshCurrentPlatform,launchSelectedPlatform,selectPage,openPlatformGame,render};
    render();
  </script>
</body>
</html>
