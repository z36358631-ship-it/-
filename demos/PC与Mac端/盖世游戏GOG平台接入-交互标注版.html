<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盖世游戏 GOG 平台接入 · 真实页面交互标注</title>
  <style>
    :root {
      color-scheme:dark;
      --shell:#14161e; --nav:#1e2235; --panel:#1a1e2a; --canvas:#0f1118;
      --app:#0d0f15; --card:#1a1a1a; --elevated:#252525; --line:rgba(255,255,255,.1);
      --text:#fff; --sub:#e6e6e6; --muted:#7b7b7b; --gold:#ffcc43; --blue:#338feb;
      --purple:#8174fa; --green:#33d8a4; --nav-width:220px; --anno-width:400px;
      --font:'MiSans VF','MiSans','PingFang SC','Microsoft YaHei',sans-serif;
    }
    *{box-sizing:border-box}
    html,body{width:100%;min-width:1080px;height:100%;margin:0;overflow:hidden;background:var(--shell);color:var(--text);font-family:var(--font)}
    button,select,input{font:inherit;color:inherit}button{cursor:pointer}
    .gog-demo-shell{display:flex;width:100%;height:100%;background:var(--shell)}
    .left-nav{width:var(--nav-width);flex:0 0 var(--nav-width);padding:22px 14px;overflow:auto;border-right:1px solid var(--line);background:var(--nav)}
    .brand{display:flex;align-items:center;gap:10px;padding:0 10px 20px;border-bottom:1px solid var(--line)}
    .brand-mark{display:grid;width:36px;height:36px;place-items:center;border-radius:11px;background:linear-gradient(145deg,#9b79ff,#5d36d7);font-weight:800}
    .brand strong,.brand small{display:block}.brand strong{font-size:14px}.brand small{margin-top:3px;color:#8f98ad;font-size:11px}
    .nav-group{margin-top:20px}.nav-group-title{margin:0 10px 7px;color:#7f899f;font-size:11px;letter-spacing:.08em}
    .nav-item{display:flex;width:100%;align-items:center;gap:9px;padding:9px 11px;border:0;border-radius:9px;background:transparent;color:#b8c0d1;text-align:left;font-size:12px}
    .nav-item:hover{background:rgba(255,255,255,.05)}.nav-item.active{background:rgba(132,94,247,.16);color:#eee8ff}
    .nav-dot{width:7px;height:7px;border-radius:50%;background:#596177}.nav-item.active .nav-dot{background:#9b79ff}
    .demo-stage{position:relative;display:flex;min-width:0;flex:1;flex-direction:column}
    .stage-toolbar{display:flex;min-height:64px;align-items:center;justify-content:space-between;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line)}
    .stage-heading h1{margin:0;font-size:15px}.stage-heading p{margin:4px 0 0;color:#8f98ad;font-size:12px}
    .simulation-control{display:flex;align-items:center;gap:8px;color:#8f98ad;font-size:12px}.simulation-control select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#202536}
    .demo-canvas{display:grid;min-height:0;flex:1;overflow:auto;place-items:center;padding:28px;background:radial-gradient(circle at 50% 38%,rgba(132,94,247,.08),transparent 34%),var(--canvas)}
    .panel-restore{position:absolute;z-index:4;top:14px;right:18px;display:none;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#202536}
    .gog-demo-shell.panel-hidden .panel-restore{display:block}.gog-demo-shell.panel-hidden .stage-toolbar{padding-right:132px}
    .anno-panel{display:flex;width:var(--anno-width);flex:0 0 var(--anno-width);flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
    .gog-demo-shell.panel-hidden .anno-panel{display:none}
    .anno-header{display:flex;min-height:64px;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}.anno-header h2{flex:1;margin:0;font-size:15px}
    .anno-header button,.anno-tabs button{height:32px;border:1px solid var(--line);border-radius:8px;background:transparent;color:#aab3c5;font-size:11px}
    .anno-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px 0}.anno-tabs button{height:38px}.anno-tabs button.active{background:rgba(132,94,247,.16);color:#eee8ff}
    .anno-scroll{min-height:0;flex:1;overflow:auto;padding:18px}.anno-context{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035)}
    .anno-context small{color:#a991ff;font-weight:700}.anno-context h3{margin:9px 0 8px;font-size:16px}.anno-context p{margin:0;color:#8f98ad;font-size:12px;line-height:1.65}
    .app-viewport{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:var(--app);color:#f5f7fb;box-shadow:0 30px 80px rgba(0,0,0,.45)}
    .app-viewport[data-orientation="portrait"]{width:402px;height:874px}.app-viewport[data-orientation="landscape"]{width:874px;height:402px}
    .app-scroll{height:100%;overflow:auto;scrollbar-width:none}.app-scroll::-webkit-scrollbar{display:none}.portrait-layout,.landscape-layout{min-height:100%;background:var(--app)}
    .stub-page{display:grid;height:100%;place-items:center;padding:24px;text-align:center}.stub-page div{max-width:320px}.stub-page h2{margin:12px 0;font-size:22px}.stub-page p{color:var(--muted);line-height:1.6}
    [data-annotation-ref]{position:relative}.annotation-flash{outline:2px solid #faad14;outline-offset:3px}
    .app-viewport button{border:0;background:none}.portrait-status{display:flex;height:36px;align-items:center;justify-content:space-between;padding:0 18px;color:#f5f5f5;font-size:12px;font-weight:700}
    .mobile-topbar{display:flex;height:50px;align-items:center;gap:12px;padding:0 17px}.mobile-topbar h1{flex:1;margin:0;font-size:20px;font-weight:520}.mobile-topbar button{width:32px;height:32px;color:#f5f5f5;font-size:24px}
    .handheld-topbar{display:flex;height:54px;align-items:center;justify-content:space-between;padding:0 22px}.handheld-topbar h1{margin:0;font-size:18px}.handheld-topbar button{width:34px;height:34px;font-size:22px}
    .mobile-bottom-nav{position:absolute;z-index:4;right:0;bottom:0;left:0;display:grid;height:74px;grid-template-columns:repeat(5,1fr);border-top:1px solid rgba(255,255,255,.05);background:rgba(12,13,17,.96);backdrop-filter:blur(18px)}
    .mobile-bottom-nav button{display:grid;place-content:center;gap:4px;color:#9b9b9f;font-size:11px}.mobile-bottom-nav button::before{display:block;font-size:20px;content:attr(data-icon)}.mobile-bottom-nav button.active{color:#fff}.mobile-bottom-nav button.active::after{display:block;width:24px;height:3px;margin:2px auto 0;border-radius:3px;background:#fff;content:""}
    .handheld-nav{display:flex;height:46px;align-items:center;gap:24px;padding:0 20px;background:linear-gradient(180deg,rgba(10,10,14,.72),transparent);font-size:11px}.handheld-nav strong{font-size:14px}.handheld-nav span{color:#96969d}.handheld-nav .active{color:#fff}
    .library-home{position:relative;background:radial-gradient(circle at 100% 0,rgba(95,39,113,.34),transparent 34%),linear-gradient(145deg,#101214,#08090c)}
    .library-tabs{display:flex;height:54px;align-items:center;gap:26px;padding:0 18px}.library-tabs button{position:relative;color:#73757b;font-size:15px;font-weight:520}.library-tabs button.active{color:#fff}.library-tabs button.active::after{position:absolute;right:36%;bottom:-10px;left:36%;height:3px;border-radius:3px;background:#fff;content:""}.library-tabs .scan{margin-left:auto;color:#c8cbd2;font-size:21px}
    .library-entry-row{display:grid;gap:8px;padding:0 16px}.library-home--portrait .library-entry-row{grid-template-columns:repeat(4,1fr)}
    .library-entry{display:flex;min-width:0;align-items:center;border:1px solid rgba(255,255,255,.05)!important;border-radius:14px!important;background:linear-gradient(145deg,#26272a,#1c1d20)!important}
    .library-home--portrait .library-entry{height:78px;flex-direction:column;justify-content:center;gap:7px}.library-entry__icon{display:grid;width:30px;height:30px;place-items:center;border-radius:9px;background:rgba(255,255,255,.08);font-size:13px;font-weight:800}.library-entry--steam .library-entry__icon{background:#1a355d}.library-entry--epic .library-entry__icon{background:#262626;font-size:9px}.library-entry--gog .library-entry__icon{background:linear-gradient(145deg,#8d65ec,#5831bb)}.library-entry--import .library-entry__icon{background:transparent;font-size:26px;font-weight:300}
    .library-entry__copy strong,.library-entry__copy small{display:block}.library-entry__copy strong{font-size:11px}.library-entry__copy small{margin-top:3px;color:#8d8e94;font-size:8px}.library-home--portrait .library-entry__copy small{display:none}
    .current-library{padding:16px 16px 92px}.current-library>header{display:flex;align-items:center;margin-bottom:12px}.current-library h2{margin:0;font-size:16px}.current-library header span{margin-left:6px;color:#8d8e94;font-size:11px}.current-library header button{margin-left:auto;color:#aeb1b8;font-size:12px}
    .current-library__tools{display:flex;gap:7px;margin-left:auto}.current-library__tools button{display:grid;width:31px;height:31px;place-items:center;border-radius:9px;background:#242529;color:#d9dce2}
    .current-library__grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.current-game{min-width:0;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:linear-gradient(145deg,#17191c,#111214)}
    .current-game__cover,.platform-game-card__cover{display:block;background:linear-gradient(135deg,var(--cover-a),var(--cover-b));box-shadow:inset 0 -28px 40px rgba(0,0,0,.28)}.current-game__cover{height:104px}.current-game strong,.current-game span{display:block;overflow:hidden;padding:0 10px;text-overflow:ellipsis;white-space:nowrap}.current-game strong{margin-top:9px;font-size:12px}.current-game span{margin:6px 0 10px;color:#8b8e95;font-size:9px}
    .library-home--landscape{display:flex;height:100%;flex-direction:column;background:radial-gradient(circle at 76% 20%,rgba(100,26,113,.48),transparent 38%),linear-gradient(120deg,#10151a,#08070d)}
    .hero-track{display:flex;min-height:0;flex:1;align-items:center;gap:10px;padding:4px 48px 8px;overflow:hidden}.hero-card{width:110px;height:188px;flex:0 0 110px;border-radius:12px;background:linear-gradient(150deg,var(--cover-a),var(--cover-b));box-shadow:0 10px 26px rgba(0,0,0,.36)}.hero-card.active{width:140px;height:204px;flex-basis:140px;border:1px solid rgba(255,255,255,.72)}
    .hero-card strong{display:block;margin:150px 10px 0;text-shadow:0 2px 8px #000;font-size:11px}.hero-card.active strong{margin-top:165px;font-size:13px}
    .landscape-entry-row{display:grid;height:88px;grid-template-columns:repeat(5,1fr);gap:10px;padding:0 48px 12px}.landscape-entry-row .library-entry{height:76px;justify-content:center;gap:12px}.landscape-entry-row .library-entry__copy strong{font-size:12px}.landscape-entry-row .library-entry__copy small{font-size:8px}
    .library-entry--my-games .library-entry__icon{background:linear-gradient(145deg,#d7d9df,#8e9198);color:#26282d}
    .platform-library{background:linear-gradient(150deg,#0b0c0f,#111316)}.platform-library__content{padding-bottom:18px}.platform-library .mobile-topbar{position:sticky;z-index:2;top:0;background:rgba(13,15,20,.9);backdrop-filter:blur(12px)}
    .platform-account{display:grid;align-items:center;background:linear-gradient(145deg,#202226,#17191c)}.platform-account--portrait{grid-template-columns:48px minmax(0,1fr);gap:12px;margin:4px 16px 12px;padding:12px 14px;border-radius:14px}.platform-account--portrait .platform-account__metrics{display:grid;grid-column:1/-1;grid-template-columns:repeat(2,1fr);margin-top:4px;border-radius:10px;background:#282a2e}
    .platform-account__avatar{display:grid;width:48px;height:48px;place-items:center;border-radius:50%;background:linear-gradient(145deg,#9b79ff,#5d36d7);font-weight:900}.platform-account__identity{min-width:0}.platform-account__identity strong,.platform-account__identity span{display:block}.platform-account__identity strong{font-size:15px}.platform-account__identity span{margin-top:5px;color:#9b9da4;font-size:10px}
    .platform-account__metric{padding:11px 14px;text-align:center}.platform-account__metric+ .platform-account__metric{border-left:1px solid rgba(255,255,255,.12)}.platform-account__metric span,.platform-account__metric strong{display:block}.platform-account__metric span{color:#85878e;font-size:9px}.platform-account__metric strong{margin-top:4px;font-size:15px}
    .platform-library-title{display:flex;align-items:center;padding:0 17px 10px}.platform-library-title h2{margin:0;font-size:16px}.platform-library-title span{margin-left:7px;color:#86888e;font-size:10px}.platform-library-title .current-library__tools{margin-left:auto}
    .platform-game-grid{display:grid;gap:12px;padding:0 16px}.platform-library--portrait .platform-game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.platform-game-card{position:relative;min-width:0;overflow:hidden;border:1px solid rgba(255,255,255,.1)!important;border-radius:13px!important;background:#15171a!important;text-align:left}.platform-game-card__cover{height:105px}.platform-game-card strong,.platform-game-card small{display:block;overflow:hidden;padding:0 10px;text-overflow:ellipsis;white-space:nowrap}.platform-game-card strong{margin-top:8px;font-size:12px}.platform-game-card small{margin:5px 0 10px;color:#878990;font-size:9px}.platform-game-card em{position:absolute;top:8px;right:8px;padding:3px 6px;border-radius:5px;background:rgba(92,49,187,.86);font-size:8px;font-style:normal}
    .platform-library--landscape{display:grid;grid-template-columns:1fr}.platform-library--landscape .platform-library__content{padding:0 36px 18px}.platform-library--landscape .handheld-topbar{padding:0}.platform-library--landscape .platform-account{grid-template-columns:52px minmax(0,1fr) auto;margin:0 0 10px;padding:0;background:transparent}.platform-library--landscape .platform-account__metrics{display:grid;grid-template-columns:repeat(2,130px)}.platform-library--landscape .platform-game-grid{grid-template-columns:repeat(4,minmax(0,1fr));padding:0}.platform-library--landscape .platform-game-card__cover{height:92px}.platform-library--landscape .platform-library-title{padding:0 0 8px}
    @media(max-height:820px){.demo-canvas{padding:18px}}
  </style>
</head>
<body>
  <main class="gog-demo-shell" id="gogDemoShell">
    <aside class="left-nav" id="leftNav"></aside>
    <section class="demo-stage">
      <div class="stage-toolbar" id="stageToolbar"></div>
      <div class="demo-canvas" id="demoCanvas"></div>
      <button class="panel-restore" id="panelRestore" data-action="toggle-panel">展开标注</button>
    </section>
    <aside class="anno-panel" id="annoPanel">
      <header class="anno-header"><h2>交互标注</h2><button id="toggleMarkers" data-action="toggle-markers">显示标号</button><button id="togglePanel" data-action="toggle-panel">收起</button></header>
      <nav class="anno-tabs"><button id="interactionTab" data-action="anno-tab" data-value="interaction">交互说明</button><button id="edgeTab" data-action="anno-tab" data-value="edge">异常&amp;边界</button></nav>
      <div class="anno-scroll" id="annoScroll"></div>
    </aside>
  </main>
  <script>
    const PLATFORM_PRIORITY = ['steam','epic','gog'];
    const PLATFORM_GAME_KEY = ['gameId','platformAppId'];
    const GOG_ACCOUNT = {
      platform:'gog', supportsAccountValue:false, accountValue:null,
      username:'GalaxyRider', gogId:'gog_20876491', avatar:'G',
      gameCount:126, totalPlaytime:'438 小时', lastSyncedAt:'今天 14:32',
    };
    const CURRENT_LIBRARY_GAMES = [
      { name:'黑神话：悟空', meta:'最近游玩 2 小时前', colors:['#98714b','#181416'] },
      { name:'艾尔登法环', meta:'最近游玩 昨天', colors:['#b79a60','#202421'] },
      { name:'赛博朋克 2077', meta:'最近游玩 3 天前', colors:['#e6d823','#403223'] },
      { name:'博德之门 3', meta:'最近游玩 1 周前', colors:['#874d3d','#22202d'] },
      { name:'雨中冒险', meta:'最近游玩 12 天前', colors:['#84b0a9','#26364a'] },
      { name:'巫师 3：狂猎', meta:'最近游玩 1 个月前', colors:['#51696b','#aa5a3d'] },
      { name:'极限竞速：地平线 5', meta:'最近游玩 2 个月前', colors:['#407ac4','#ce6d45'] },
      { name:'冰汽时代', meta:'最近游玩 3 个月前', colors:['#4d7181','#171d28'] },
      { name:'极乐迪斯科', meta:'最近游玩 去年', colors:['#c97955','#3e4167'] },
    ];
    const LIBRARY_ENTRIES = [
      { id:'steam', label:'Steam', icon:'S' }, { id:'epic', label:'Epic', icon:'EPIC' },
      { id:'gog', label:'GOG', icon:'G' }, { id:'import', label:'导入游戏', icon:'+' },
    ];
    const GOG_GAMES = [
      { gameId:'the-witcher-3', platformAppId:'gog-1495134320', name:'巫师 3：狂猎', hours:168, colors:['#395d63','#bc6b3c'] },
      { gameId:'cyberpunk-2077', platformAppId:'gog-1423049311', name:'赛博朋克 2077', hours:74, colors:['#ead722','#5a4425'] },
      { gameId:'control', platformAppId:'gog-1808684453', name:'Control', hours:26, colors:['#9b1e2e','#261d29'] },
      { gameId:'baldurs-gate-3', platformAppId:'gog-1456460669', name:'博德之门 3', hours:52, colors:['#71483c','#201a27'] },
      { gameId:'disco-elysium', platformAppId:'gog-1962937292', name:'极乐迪斯科', hours:31, colors:['#c97955','#3e4167'] },
      { gameId:'frostpunk', platformAppId:'gog-1440162894', name:'冰汽时代', hours:19, colors:['#446473','#171d28'] },
    ];
    const FLOW = [
      { id:'profile-portrait', group:'我的页', label:'我的 · 竖屏', orientation:'portrait' },
      { id:'gog-login', group:'我的页', label:'GOG 官方授权', orientation:'portrait' },
      { id:'library-home-portrait', group:'游戏库', label:'首页 · 竖屏', orientation:'portrait' },
      { id:'library-home-landscape', group:'游戏库', label:'首页 · 横屏', orientation:'landscape' },
      { id:'gog-library-portrait', group:'游戏库', label:'GOG 账号库 · 竖屏', orientation:'portrait' },
      { id:'gog-library-landscape', group:'游戏库', label:'GOG 账号库 · 横屏', orientation:'landscape' },
      { id:'search-portrait', group:'搜索', label:'搜索 · 竖屏', orientation:'portrait' },
      { id:'search-landscape', group:'搜索', label:'搜索 · 横屏', orientation:'landscape' },
      { id:'detail-portrait', group:'详情', label:'详情 · 竖屏', orientation:'portrait' },
      { id:'detail-landscape', group:'详情', label:'详情 · 横屏', orientation:'landscape' },
    ];
    const SIMULATIONS = ['normal','loading','empty','error','expired','cancelled','cached'];
    const SIMULATION_LABELS = { normal:'正常',loading:'加载中',empty:'空数据',error:'加载失败',expired:'授权过期',cancelled:'用户取消',cached:'缓存降级' };
    const state = {
      screen:'profile-portrait', orientation:'portrait', annotationTab:'interaction', showMarkers:false, panelHidden:false,
      simulation:'normal', platformSwitchOpen:false, profilePlatform:'gog', sourcePlatform:null, selectedPlatform:'gog', selectedGame:null,
      loginOrigin:null, loginOrientation:null, authorizationMode:null, loginError:null, gogRefreshInFlight:false, gogRefreshRequestCount:0,
      ownedPlatforms:['steam','epic','gog'], lowConfidenceNoMerge:true,
      accountByPlatform:{
        steam:{ bindStatus:'bound', tokenStatus:'valid' }, epic:{ bindStatus:'bound', tokenStatus:'valid' },
        gog:{ bindStatus:'bound', tokenStatus:'valid', account:{ ...GOG_ACCOUNT } },
      },
    };
    function resolveSelectedPlatform({ sourcePlatform, ownedPlatforms, accountByPlatform }) {
      if (sourcePlatform) return sourcePlatform;
      return PLATFORM_PRIORITY.find(platform => ownedPlatforms.includes(platform) && accountByPlatform[platform]?.bindStatus === 'bound' && accountByPlatform[platform]?.tokenStatus === 'valid') || null;
    }
    function currentPage(){return FLOW.find(page=>page.id===state.screen)||FLOW[0]}
    function selectPage(pageId){const next=FLOW.find(page=>page.id===pageId);if(!next)throw new Error(`Unknown page: ${pageId}`);state.screen=next.id;state.orientation=next.orientation;state.platformSwitchOpen=false;render()}
    function renderNavigation(){
      const groups=FLOW.reduce((result,page)=>{(result[page.group]||=[]).push(page);return result},{});
      leftNav.innerHTML=`<div class="brand"><span class="brand-mark">G</span><span><strong>GOG 接入</strong><small>真实页面交互标注</small></span></div>${Object.entries(groups).map(([group,pages])=>`<section class="nav-group"><h2 class="nav-group-title">${group}</h2>${pages.map(page=>`<button class="nav-item${page.id===state.screen?' active':''}" data-page="${page.id}"><span class="nav-dot"></span><span>${page.label}</span></button>`).join('')}</section>`).join('')}`;
    }
    function renderToolbar(page){stageToolbar.innerHTML=`<div class="stage-heading"><h1>${page.group} / ${page.label}</h1><p>${page.orientation==='landscape'?'横屏 874 × 402':'竖屏 402 × 874'} · 真实 DOM</p></div><label class="simulation-control">状态模拟<select data-action="simulation">${SIMULATIONS.map(item=>`<option value="${item}"${state.simulation===item?' selected':''}>${SIMULATION_LABELS[item]}</option>`).join('')}</select></label>`}
    function renderStub(screen,orientation,title,ref='stub-target'){return `<section class="app-viewport" data-screen="${screen}" data-orientation="${orientation}"><div class="stub-page"><div data-annotation-ref="${ref}"><strong>${orientation==='landscape'?'横屏独立布局':'竖屏独立布局'}</strong><h2>${title}</h2><p>正在基于现行页面重建，不使用截图底图或整体缩放。</p></div></div></section>`}
    function coverStyle(colors){return `--cover-a:${colors[0]};--cover-b:${colors[1]}`}
    function renderPortraitStatus(){return `<div class="portrait-status"><span>9:41</span><span>▲ ● ▬</span></div>`}
    function renderPortraitTopBar(title){return `<header class="mobile-topbar"><button type="button" aria-label="返回">‹</button><h1>${title}</h1><button type="button" aria-label="搜索" data-action="open-search">⌕</button></header>`}
    function renderLandscapeTopBar(title){return `<header class="handheld-topbar"><h1>${title}</h1><button type="button" aria-label="搜索" data-action="open-search">⌕</button></header>`}
    function renderPortraitBottomNav(active){const items=[['home','首页','⌒'],['play','玩游戏','⌑'],['rank','排行榜','≡'],['library','游戏库','▦'],['profile','我的','●']];return `<nav class="mobile-bottom-nav" aria-label="主导航">${items.map(([id,label,icon])=>`<button type="button" class="${id===active?'active':''}" data-nav="${id}" data-icon="${icon}">${label}</button>`).join('')}</nav>`}
    function renderLandscapeSideNav(active){return `<nav class="handheld-nav" aria-label="掌机主导航"><strong class="${active==='library'?'active':''}">▦ 游戏库</strong><span>⌑</span><span>◎</span><span>≡</span><span>●</span></nav>`}
    function renderLibraryEntry(entry){return `<button type="button" class="library-entry library-entry--${entry.id}" data-library-entry="${entry.id}" data-action="open-library-entry"${entry.id==='gog'?' data-annotation-ref="gog-entry"':''}><span class="library-entry__icon" aria-hidden="true">${entry.icon}</span><span class="library-entry__copy"><strong>${entry.label}</strong><small>${entry.id==='import'?'手动添加':'查看游戏'}</small></span></button>`}
    function renderCurrentLibrarySections(){return `<section class="current-library" data-annotation-ref="current-library"><header><h2>我的游戏</h2><span>9款</span><div class="current-library__tools"><button type="button" aria-label="搜索">⌕</button><button type="button" aria-label="排序">⇅</button><button type="button" aria-label="视图">☰</button></div></header><div class="current-library__grid">${CURRENT_LIBRARY_GAMES.slice(0,5).map(game=>`<article class="current-game"><span class="current-game__cover" style="${coverStyle(game.colors)}"></span><strong>${game.name}</strong><span>${game.meta}</span></article>`).join('')}</div></section>`}
    function renderProfilePortrait(){return renderStub('profile-portrait','portrait','我的','account-summary')}
    function renderGogLogin(){return `<section class="app-viewport" data-screen="gog-login" data-orientation="portrait"><div class="stub-page"><div data-annotation-ref="official-login"><h2>GOG 官方登录</h2><p>盖世游戏只接收授权结果，不读取、不保存邮箱或密码。</p></div></div></section>`}
    function renderLibraryHomePortrait(){return `<section class="app-viewport library-home library-home--portrait" data-screen="library-home-portrait" data-orientation="portrait"><div class="app-scroll portrait-layout">${renderPortraitStatus()}<div class="library-tabs"><button class="active" type="button">PC游戏</button><button type="button">复古游戏</button><button class="scan" type="button" aria-label="扫描">◰</button></div><div class="library-entry-row">${LIBRARY_ENTRIES.map(renderLibraryEntry).join('')}</div>${renderCurrentLibrarySections()}${renderPortraitBottomNav('library')}</div></section>`}
    function renderLibraryHomeLandscape(){const entries=[{id:'my-games',label:'我的游戏',icon:'▦'},...LIBRARY_ENTRIES];return `<section class="app-viewport library-home library-home--landscape" data-screen="library-home-landscape" data-orientation="landscape">${renderLandscapeSideNav('library')}<section class="hero-track" data-annotation-ref="current-library">${CURRENT_LIBRARY_GAMES.slice(0,7).map((game,index)=>`<article class="hero-card${index===0?' active':''}" style="${coverStyle(game.colors)}"><strong>${game.name}</strong></article>`).join('')}</section><div class="landscape-entry-row">${entries.map(renderLibraryEntry).join('')}</div></section>`}
    function renderGogAccountSummary(orientation){return `<section class="platform-account platform-account--${orientation}" data-annotation-ref="account-summary"><span class="platform-account__avatar" aria-hidden="true">${GOG_ACCOUNT.avatar}</span><div class="platform-account__identity"><strong>${GOG_ACCOUNT.username}</strong><span data-account-metric="gog-id">GOG ID: ${GOG_ACCOUNT.gogId}</span></div><div class="platform-account__metrics"><div class="platform-account__metric" data-account-metric="game-count"><span>游戏</span><strong>${GOG_ACCOUNT.gameCount}</strong></div><div class="platform-account__metric" data-account-metric="total-playtime"><span>总时长</span><strong>${GOG_ACCOUNT.totalPlaytime}</strong></div></div></section>`}
    function renderPlatformLibrary({orientation,screen}){const title=`<div class="platform-library-title"><h2>GOG库</h2><span>${GOG_GAMES.length}款</span><div class="current-library__tools"><button type="button">⌕</button><button type="button">⇅</button><button type="button">☰</button></div></div>`;const body=`<main class="app-scroll platform-library__content">${orientation==='portrait'?renderPortraitStatus():''}${orientation==='portrait'?renderPortraitTopBar('GOG'):renderLandscapeTopBar('GOG')}${renderGogAccountSummary(orientation)}${title}<section class="platform-game-grid" data-annotation-ref="game-grid">${GOG_GAMES.map(game=>`<button type="button" class="platform-game-card" data-game-card data-platform="gog" data-game-id="${game.gameId}" data-platform-app-id="${game.platformAppId}"><span class="platform-game-card__cover" style="${coverStyle(game.colors)}" aria-hidden="true"></span><strong>${game.name}</strong><small>已游玩 ${game.hours} 小时</small><em>GOG</em></button>`).join('')}</section></main>`;return `<section class="app-viewport platform-library platform-library--${orientation}" data-screen="${screen}" data-orientation="${orientation}">${body}</section>`}
    function renderGogLibraryPortrait(){return renderPlatformLibrary({orientation:'portrait',screen:'gog-library-portrait'})}
    function renderGogLibraryLandscape(){return renderPlatformLibrary({orientation:'landscape',screen:'gog-library-landscape'})}
    function renderSearchPortrait(){return renderStub('search-portrait','portrait','搜索','search-results')}
    function renderSearchLandscape(){return renderStub('search-landscape','landscape','搜索','search-results')}
    function renderDetailPortrait(){return renderStub('detail-portrait','portrait','游戏详情','detail-context')}
    function renderDetailLandscape(){return renderStub('detail-landscape','landscape','游戏详情','detail-context')}
    function renderRealPage(page){const renderers={'profile-portrait':renderProfilePortrait,'gog-login':renderGogLogin,'library-home-portrait':renderLibraryHomePortrait,'library-home-landscape':renderLibraryHomeLandscape,'gog-library-portrait':renderGogLibraryPortrait,'gog-library-landscape':renderGogLibraryLandscape,'search-portrait':renderSearchPortrait,'search-landscape':renderSearchLandscape,'detail-portrait':renderDetailPortrait,'detail-landscape':renderDetailLandscape};const renderer=renderers[page.id];if(!renderer)throw new Error(`Missing renderer: ${page.id}`);return renderer()}
    function beginAuthorization(mode){state.loginOrigin=state.screen;state.loginOrientation=state.orientation;state.authorizationMode=mode;state.loginError=null;selectPage('gog-login')}
    function openLibraryEntry(entryId){if(entryId!=='gog')return;const suffix=state.orientation==='landscape'?'landscape':'portrait';const gog=state.accountByPlatform.gog;if(gog.bindStatus!=='bound'||gog.tokenStatus!=='valid'){beginAuthorization('bind');return}selectPage(`gog-library-${suffix}`)}
    function openPlatformGame(card){state.selectedGame={gameId:card.dataset.gameId,platformAppId:card.dataset.platformAppId,platform:card.dataset.platform};state.sourcePlatform=card.dataset.platform;state.selectedPlatform=card.dataset.platform;const suffix=state.orientation==='landscape'?'landscape':'portrait';selectPage(`detail-${suffix}`)}
    function renderAnnotations(page){interactionTab.classList.toggle('active',state.annotationTab==='interaction');edgeTab.classList.toggle('active',state.annotationTab==='edge');toggleMarkers.textContent=state.showMarkers?'隐藏标号':'显示标号';annoScroll.innerHTML=`<section class="anno-context"><small>${state.annotationTab==='interaction'?'INTERACTION':'EDGE CASE'}</small><h3>${page.label}</h3><p>页面标注将随真实 DOM 分阶段对齐。</p></section>`}
    function render(){const page=currentPage();state.orientation=page.orientation;gogDemoShell.classList.toggle('panel-hidden',state.panelHidden);renderNavigation();renderToolbar(page);demoCanvas.innerHTML=renderRealPage(page);renderAnnotations(page)}
    document.addEventListener('click',event=>{const pageButton=event.target.closest('.nav-item[data-page]');if(pageButton){selectPage(pageButton.dataset.page);return}const gameCard=event.target.closest('[data-game-card]');if(gameCard){openPlatformGame(gameCard);return}const action=event.target.closest('[data-action]');if(!action)return;if(action.dataset.action==='open-library-entry')openLibraryEntry(action.dataset.libraryEntry);else if(action.dataset.action==='toggle-panel')state.panelHidden=!state.panelHidden;else if(action.dataset.action==='toggle-markers')state.showMarkers=!state.showMarkers;else if(action.dataset.action==='anno-tab')state.annotationTab=action.dataset.value;else return;render()});
    document.addEventListener('change',event=>{if(event.target.matches('[data-action="simulation"]')){state.simulation=event.target.value;render()}});
    window.GogDemoApp={state,GOG_ACCOUNT,GOG_GAMES,resolveSelectedPlatform,selectPage,openPlatformGame,render};
    render();
  </script>
</body>
</html>
