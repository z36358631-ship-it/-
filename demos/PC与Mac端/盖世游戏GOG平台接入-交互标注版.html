<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盖世游戏 GOG 平台接入 · 交互标注 Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --nav-width: 220px;
      --anno-width: 400px;
      --shell-bg: #14161e;
      --nav-bg: #1e2235;
      --panel-bg: #1a1e2a;
      --canvas-bg: #0f1118;
      --card-bg: #202536;
      --line: rgba(255, 255, 255, 0.09);
      --muted: #8f98ad;
      --text: #f4f6fb;
      --accent: #845ef7;
      --accent-soft: rgba(132, 94, 247, 0.16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 1080px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--shell-bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    button,
    select { font: inherit; }

    button { color: inherit; }

    .gog-demo-shell {
      display: flex;
      width: 100%;
      height: 100%;
      background: var(--shell-bg);
    }

    .left-nav {
      flex: 0 0 var(--nav-width);
      width: var(--nav-width);
      padding: 24px 14px;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--nav-bg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(145deg, #9b79ff, #5d36d7);
      box-shadow: 0 8px 20px rgba(93, 54, 215, 0.32);
      font-weight: 800;
    }

    .brand strong,
    .brand small { display: block; }

    .brand strong { font-size: 14px; }

    .brand small {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .nav-group { margin-top: 22px; }

    .nav-group-title {
      margin: 0 10px 8px;
      color: #7f899f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 9px;
      padding: 10px 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #b8c0d1;
      text-align: left;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }

    .nav-item:hover { background: rgba(255, 255, 255, 0.05); }

    .nav-item.active {
      background: var(--accent-soft);
      color: #eee8ff;
    }

    .nav-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #596177;
    }

    .nav-item.active .nav-dot {
      background: #9b79ff;
      box-shadow: 0 0 0 4px rgba(155, 121, 255, 0.12);
    }

    .demo-stage {
      position: relative;
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
      background: var(--shell-bg);
    }

    .stage-toolbar {
      display: flex;
      min-height: 64px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(20, 22, 30, 0.96);
    }

    .stage-heading { min-width: 0; }

    .stage-heading h1 {
      margin: 0;
      overflow: hidden;
      font-size: 15px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stage-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .simulation-control {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .simulation-control select {
      height: 34px;
      padding: 0 32px 0 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: var(--card-bg);
      color: var(--text);
    }

    .demo-canvas {
      display: grid;
      min-height: 0;
      flex: 1 1 auto;
      overflow: auto;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 38%, rgba(132, 94, 247, 0.08), transparent 34%),
        var(--canvas-bg);
    }

    .screen-placeholder {
      width: min(100%, 560px);
      min-height: 480px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      background: linear-gradient(155deg, rgba(37, 42, 59, 0.98), rgba(25, 29, 41, 0.98));
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.34);
      transition: width 180ms ease, min-height 180ms ease;
    }

    .demo-canvas[data-orientation="landscape"] .screen-placeholder {
      width: min(100%, 840px);
      min-height: 420px;
    }

    .screen-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .screen-kicker,
    .state-chip {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .screen-kicker { color: #a991ff; }

    .state-chip {
      padding: 6px 9px;
      border: 1px solid rgba(155, 121, 255, 0.24);
      border-radius: 999px;
      background: var(--accent-soft);
      color: #cabbff;
    }

    .screen-placeholder h2 {
      margin: 42px 0 10px;
      font-size: 30px;
      line-height: 1.25;
    }

    .screen-placeholder > p {
      max-width: 440px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .placeholder-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 42px;
    }

    .placeholder-card {
      min-height: 82px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
    }

    .placeholder-card span,
    .placeholder-card strong { display: block; }

    .placeholder-card span {
      color: var(--muted);
      font-size: 11px;
    }

    .placeholder-card strong {
      margin-top: 8px;
      overflow: hidden;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-restore {
      position: absolute;
      z-index: 3;
      top: 14px;
      right: 18px;
      display: none;
      height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--card-bg);
      cursor: pointer;
    }

    .gog-demo-shell.panel-hidden .panel-restore { display: block; }

    .gog-demo-shell.panel-hidden .stage-toolbar { padding-right: 132px; }

    .anno-panel {
      display: flex;
      width: var(--anno-width);
      flex: 0 0 var(--anno-width);
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: var(--panel-bg);
    }

    .gog-demo-shell.panel-hidden .anno-panel { display: none; }

    .anno-header {
      display: flex;
      min-height: 64px;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
    }

    .anno-header h2 {
      flex: 1;
      margin: 0;
      font-size: 15px;
    }

    .anno-header button,
    .anno-tabs button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: #aab3c5;
      cursor: pointer;
    }

    .anno-header button {
      height: 32px;
      padding: 0 10px;
      font-size: 11px;
    }

    .anno-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 18px 0;
    }

    .anno-tabs button {
      height: 38px;
      font-size: 12px;
    }

    .anno-tabs button.active {
      border-color: rgba(155, 121, 255, 0.32);
      background: var(--accent-soft);
      color: #eee8ff;
    }

    .anno-scroll {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 18px;
    }

    .anno-context {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
    }

    .anno-context small {
      color: #a991ff;
      font-weight: 700;
    }

    .anno-context h3 {
      margin: 9px 0 8px;
      font-size: 16px;
    }

    .anno-context p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .anno-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .anno-item {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.028);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .anno-item:hover,
    .anno-item:focus-visible {
      border-color: rgba(155, 121, 255, 0.38);
      outline: none;
      background: rgba(132, 94, 247, 0.08);
      transform: translateY(-1px);
    }

    .anno-head {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .anno-badge,
    .annotation-marker {
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: rgb(250, 173, 20);
      color: #17120a;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
    }

    .anno-badge {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
    }

    .anno-badge.global,
    .annotation-marker.global {
      background: #1296db;
      color: white;
    }

    .anno-badge.edge,
    .annotation-marker.edge {
      background: #e74c3c;
      color: white;
    }

    .anno-title {
      color: #eef1f8;
      font-size: 13px;
      font-weight: 700;
    }

    .anno-body {
      display: grid;
      gap: 5px;
      margin-top: 11px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .anno-body span strong {
      color: #c8cfdd;
      font-weight: 700;
    }

    [data-annotation-ref] { position: relative; }

    .annotation-marker {
      position: absolute;
      z-index: 8;
      top: -10px;
      right: -10px;
      display: none;
      width: 23px;
      height: 23px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.42);
      pointer-events: none;
    }

    .annotation-marker + .annotation-marker { transform: translateX(-27px); }

    .gog-demo-shell.markers-visible .annotation-marker { display: inline-grid; }

    @keyframes annotationFlash {
      0%, 100% { box-shadow: 0 0 0 0 rgba(250, 173, 20, 0); }
      35% { box-shadow: 0 0 0 6px rgba(250, 173, 20, 0.42), 0 0 0 12px rgba(250, 173, 20, 0.13); }
    }

    .annotation-flash {
      animation: annotationFlash 760ms ease-out;
      outline: 2px solid rgb(250, 173, 20);
      outline-offset: 3px;
    }

    .product-screen {
      width: 402px;
      min-width: 402px;
      height: 874px;
      min-height: 874px;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 28px;
      background: #171a25;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
    }

    .product-screen.library-screen { width: 402px; }

    .product-header {
      display: flex;
      min-height: 70px;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(29, 33, 47, 0.96);
    }

    .product-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .product-header small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .product-header-badge {
      padding: 7px 10px;
      border: 1px solid rgba(177, 147, 255, 0.24);
      border-radius: 999px;
      background: var(--accent-soft);
      color: #cdbfff;
      font-size: 11px;
      font-weight: 700;
    }

    .product-body { padding: 24px; }

    .platform-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
    }

    .platform-tab {
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #858fa4;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .platform-tab.active {
      background: rgba(132, 94, 247, 0.2);
      color: #f2edff;
    }

    .account-hero,
    .empty-state,
    .official-login-card {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        radial-gradient(circle at 90% 10%, rgba(132, 94, 247, 0.17), transparent 32%),
        linear-gradient(145deg, #24293a, #1d2130);
    }

    .account-hero { padding: 24px; }

    .account-identity {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .gog-logo {
      display: grid;
      width: 50px;
      height: 50px;
      flex: 0 0 50px;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(145deg, #9e72ff, #5e31d9);
      box-shadow: 0 12px 28px rgba(94, 49, 217, 0.32);
      color: white;
      font-size: 18px;
      font-weight: 900;
    }

    .account-identity h3 {
      margin: 0;
      font-size: 18px;
    }

    .account-identity p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    .metric-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.035);
    }

    .metric-card span,
    .metric-card strong { display: block; }

    .metric-card span {
      color: var(--muted);
      font-size: 11px;
    }

    .metric-card strong {
      margin-top: 8px;
      font-size: 17px;
    }

    .account-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      min-height: 42px;
      padding: 0 15px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .primary-button {
      border: 0;
      background: linear-gradient(135deg, #9270ff, #6b3ce0);
      color: white;
      box-shadow: 0 10px 24px rgba(107, 60, 224, 0.25);
    }

    .secondary-button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: #dce1ed;
    }

    .danger-button {
      border: 1px solid rgba(255, 112, 128, 0.28);
      background: rgba(255, 90, 110, 0.08);
      color: #ff9aa7;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
    }

    .empty-state {
      display: grid;
      min-height: 360px;
      padding: 48px 30px;
      place-items: center;
      text-align: center;
    }

    .empty-state-content { max-width: 360px; }

    .empty-state h3 {
      margin: 18px 0 9px;
      font-size: 22px;
    }

    .empty-state p,
    .security-note,
    .login-domain,
    .logout-confirm p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .empty-state .primary-button { margin-top: 22px; }

    .official-login-card {
      max-width: 480px;
      margin: 28px auto 0;
      padding: 28px;
    }

    .official-login-card h3 {
      margin: 20px 0 8px;
      font-size: 24px;
    }

    .login-domain {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.16);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .security-note {
      margin: 15px 0;
      padding: 12px 14px;
      border-left: 3px solid #8f6cff;
      background: rgba(132, 94, 247, 0.08);
      color: #cbc4df;
    }

    .login-preview {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .masked-field {
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.14);
      color: #70798d;
      line-height: 42px;
      font-size: 12px;
    }

    .login-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .login-error {
      margin-top: 14px;
      padding: 11px 13px;
      border: 1px solid rgba(255, 112, 128, 0.24);
      border-radius: 10px;
      background: rgba(255, 90, 110, 0.08);
      color: #ffadb8;
      font-size: 12px;
    }

    .login-test-tools {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .login-test-tools button {
      border: 0;
      background: transparent;
      color: #8f98ad;
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
    }

    .library-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0 14px;
    }

    .library-heading h3 { margin: 0; }

    .library-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .game-card {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      min-height: 100px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.035);
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .game-cover {
      display: grid;
      height: 78px;
      place-items: end start;
      padding: 8px;
      border-radius: 10px;
      background:
        linear-gradient(155deg, transparent 20%, rgba(0, 0, 0, 0.68)),
        linear-gradient(135deg, var(--cover-a), var(--cover-b));
      color: white;
      font-size: 10px;
      font-weight: 800;
    }

    .game-meta {
      min-width: 0;
      padding: 8px 4px 4px 12px;
    }

    .game-meta strong,
    .game-meta span { display: block; }

    .game-meta strong {
      overflow: hidden;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-meta span {
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
    }

    .gog-pill {
      display: inline-block;
      margin-top: 9px;
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(132, 94, 247, 0.15);
      color: #cbbbff;
      font-size: 9px;
      font-weight: 800;
    }

    .logout-confirm {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 112, 128, 0.22);
      border-radius: 14px;
      background: rgba(255, 90, 110, 0.055);
    }

    .logout-confirm strong { font-size: 13px; }

    .logout-confirm p { margin: 7px 0 12px; }

    .confirm-actions { display: flex; gap: 8px; }

    .sync-line {
      margin-top: 13px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .product-screen.detail-screen { width: 402px; }

    .product-screen.search-screen.landscape-screen {
      width: 874px;
      min-width: 874px;
      height: 402px;
      min-height: 402px;
    }

    .detail-hero {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        radial-gradient(circle at 88% 12%, rgba(132, 94, 247, 0.2), transparent 36%),
        linear-gradient(145deg, #252a3c, #1c202e);
    }

    .detail-title-row,
    .detail-platform-row,
    .search-heading,
    .search-result-meta,
    .platform-option {
      display: flex;
      align-items: center;
    }

    .detail-title-row,
    .detail-platform-row,
    .search-heading,
    .platform-option { justify-content: space-between; }

    .detail-title-row { gap: 18px; }

    .detail-title-row h3 {
      margin: 0;
      font-size: 24px;
    }

    .detail-title-row p,
    .search-heading p,
    .source-unavailable p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .detail-platform-row {
      gap: 16px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .platform-identity {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 12px;
    }

    .platform-logo {
      display: grid;
      min-width: 48px;
      height: 48px;
      padding: 0 10px;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, #8f6cff, #5c35cd);
      color: white;
      font-size: 12px;
      font-weight: 900;
    }

    .platform-identity strong,
    .platform-identity span { display: block; }

    .platform-identity span {

      justify-items: center;

      font-weight: 900;
    }

    .skeleton-list {
      display: grid;
      width: 100%;
      gap: 12px;
      margin-bottom: 22px;
    }

    .skeleton {
      height: 68px;
      overflow: hidden;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.055);
    }

    .skeleton::after {
      display: block;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.09), transparent);
      content: "";
      animation: shimmer 1.1s infinite;

      { gameId:'the-witcher-3', platform:'gog', platformAppId:'gog-1495134320', name:'巫师 3：狂猎', rawScore:null, colors:['#395d63','#bc6b3c'] },
    ];

    function convertEpicScore(score) {
      const converted = Math.round(Number(score) * 20) / 10;
      return Math.min(10, Math.max(0, converted));
    }

    function resolveSelectedPlatform({ sourcePlatform, ownedPlatforms, accountByPlatform }) {
      if (sourcePlatform) return sourcePlatform;
      return PLATFORM_PRIORITY.find(platform =>
        ownedPlatforms.includes(platform) &&
        accountByPlatform[platform]?.bindStatus === 'bound' &&
        accountByPlatform[platform]?.tokenStatus === 'valid'
      ) || null;
    }

    function getCurrentPage() {
      return FLOW.find(page => page.id === state.screen) || FLOW[0];
    }

    function renderNavigation() {
      const groups = FLOW.reduce((result, page) => {
        (result[page.group] ||= []).push(page);
        return result;
      }, {});

      const groupMarkup = Object.entries(groups).map(([group, pages]) => `
        <section class="nav-group">
          <h2 class="nav-group-title">${group}</h2>
          ${pages.map(page => `
            <button class="nav-item${page.id === state.screen ? ' active' : ''}"
              data-page="${page.id}" aria-current="${page.id === state.screen ? 'page' : 'false'}">
              <span class="nav-dot"></span><span>${page.label}</span>
            </button>
          `).join('')}
        </section>
      `).join('');

      document.getElementById('leftNav').innerHTML = `
        <div class="brand">
          <span class="brand-mark">G</span>
          <span><strong>GOG 接入</strong><small>交互标注 Demo</small></span>
        </div>
        ${groupMarkup}
      `;
    }

    function isPlatformAvailable(platform) {
      const account = state.accountByPlatform[platform];
      return account?.bindStatus === 'bound' && account?.tokenStatus === 'valid';
    }

    function getSelectedGameName() {
      const selected = state.selectedGame;
      if (!selected) return '赛博朋克 2077';
      return SEARCH_RESULTS.find(game => game.gameId === selected.gameId)?.name ||
        GOG_GAMES.find(game => game.gameId === selected.gameId)?.name ||
        'PC 游戏';
    }

    function renderDetail() {
      const platform = state.selectedPlatform || resolveSelectedPlatform(state) || 'steam';
      const detail = DETAIL_BY_PLATFORM[platform];
      const available = isPlatformAvailable(platform);
      const sourceLabel = DETAIL_BY_PLATFORM[state.sourcePlatform]?.label || '无指定来源';
      const switchPlatforms = PLATFORM_PRIORITY.filter(item =>
        state.ownedPlatforms.includes(item) || item === state.sourcePlatform
      );
      return `
        <article class="product-screen detail-screen" data-screen="${state.showPlatformSwitch ? 'detail-switch' : 'detail-gog'}"
          data-game-id="${state.selectedGame?.gameId || ''}"
          data-platform-app-id="${state.selectedGame?.platformAppId || ''}">
          ${renderProductHeader('游戏详情', `来源平台：${sourceLabel}`, detail.label)}

            <section class="detail-hero" data-annotation-ref="detail-context">
              <div class="detail-title-row">
                <div><h3>${getSelectedGameName()}</h3><p>平台版本独立展示 · 当前启动上下文不会静默切换</p></div>

                </div>
                <span class="product-header-badge">${state.sourcePlatform === platform ? '来源平台' : '手动切换'}</span>
              </div>
              <div class="detail-metrics">
                <div class="detail-metric"><span>游玩时长</span><strong data-detail-hours>${detail.hours}</strong></div>
                <div class="detail-metric"><span>云存档</span><strong data-detail-cloud>${detail.cloud}</strong></div>
              </div>
              ${available ? '' : `
                <div class="source-unavailable" data-source-unavailable>
                  <strong>${detail.label} 来源当前不可用</strong>
                  <p>请重新登录 ${detail.label}，或打开“切换平台”并由你主动选择其他已拥有版本；不会自动改用 Steam。</p>
                </div>

              <div class="detail-actions" data-annotation-ref="launch-actions">
                <button class="secondary-button" data-action="open-platform-switch">切换平台</button>
                <button class="primary-button" data-launch-platform data-action="${available ? 'launch-selected' : 'reauthorize-source'}">
                  ${available ? detail.launch : `重新登录 ${detail.label}`}
                </button>
              </div>
              ${state.showPlatformSwitch ? `
                <section class="platform-switch" data-platform-switch data-annotation-ref="platform-switch">
                  <h4>选择启动平台</h4>
                  <div class="platform-options">
                    ${switchPlatforms.map(item => {
                      const option = DETAIL_BY_PLATFORM[item];
                      return `
                        <button class="platform-option${item === platform ? ' active' : ''}"
                          data-action="select-detail-platform" data-platform="${item}">
                          <span>${option.label}</span>
                          <small>${isPlatformAvailable(item) ? `${option.hours} · ${option.cloud}` : '需要绑定或重新登录'}</small>

      const selected = state.selectedGame;
      const selectedName = GOG_GAMES.find(game => game.gameId === selected?.gameId)?.name;

            <span class="state-symbol">←</span>

    function renderCanvas(page) {
      const canvas = document.getElementById('demoCanvas');
      canvas.dataset.orientation = state.orientation;
      const renderers = {
        'profile-unbound':renderProfileUnbound,
        'gog-login':renderGogLogin,
        'profile-bound':renderProfileBound,
        'library-unbound':renderLibraryUnbound,
        'library-bound':renderLibraryBound,
        'detail-gog':renderDetail,
        'detail-switch':renderDetail,
        'search-portrait':() => renderSearch('portrait'),
        'search-landscape':() => renderSearch('landscape'),
      };
      canvas.innerHTML = state.simulation === 'normal'
        ? (renderers[page.id] ? renderers[page.id]() : renderPlaceholder(page))
        : renderSimulationState(page);
    }

    function annotationBadgeClass(id) {
      if (id === 'G') return ' global';
      if (id.startsWith('E')) return ' edge';
      return '';
    }

    function renderAnnotationMarkers(page) {
      document.querySelectorAll('.annotation-marker').forEach(marker => marker.remove());
      const groups = ANNOTATIONS[page.id] || { interaction:[], edge:[] };
      [...groups.interaction, ...groups.edge].forEach(annotation => {
        const target = document.querySelector(`[data-annotation-ref="${annotation.ref}"]`);
        if (!target) return;
        const marker = document.createElement('span');
        marker.className = `annotation-marker${annotationBadgeClass(annotation.id)}`;
        marker.textContent = annotation.id;
        marker.dataset.markerId = annotation.id;
        marker.dataset.ref = annotation.ref;
        marker.setAttribute('aria-hidden', 'true');
        target.appendChild(marker);
      });
    }

    function renderAnnotations(page) {
      const pageAnnotations = ANNOTATIONS[page.id] || { interaction:[], edge:[] };
      const annotations = pageAnnotations[state.annotationTab] || [];
      document.getElementById('interactionTab').classList.toggle('active', state.annotationTab === 'interaction');
      document.getElementById('edgeTab').classList.toggle('active', state.annotationTab === 'edge');
      document.getElementById('toggleMarkers').textContent = state.showMarkers ? '隐藏标号' : '显示标号';
      document.getElementById('annoScroll').innerHTML = `
        <section class="anno-context">
          <small>${state.annotationTab === 'interaction' ? 'INTERACTION' : 'EDGE CASE'}</small>
          <h3>${page.group} · ${page.label}</h3>
          <p>${state.annotationTab === 'interaction' ? '页面主要操作、展示反馈与全局规则。' : '异常、降级与恢复操作的边界。'}点击任一标注可定位中心元素。</p>
          <div class="anno-list">
            ${annotations.map(annotation => `
              <div class="anno-item" data-annotation-item data-id="${annotation.id}" data-page="${page.id}"
                data-ref="${annotation.ref}" role="button" tabindex="0">
                <div class="anno-head">
                  <span class="anno-badge${annotationBadgeClass(annotation.id)}">${annotation.id}</span>
                  <span class="anno-title">${annotation.title}</span>
                </div>
                <div class="anno-body">
                  <span><strong>触发：</strong>${annotation.trigger}</span>
                  <span><strong>展示：</strong>${annotation.display}</span>
                  <span><strong>交互：</strong>${annotation.interaction}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
      renderAnnotationMarkers(page);
    }

    function render() {
      const page = getCurrentPage();
      state.screen = page.id;
      state.orientation = page.id === 'search-landscape' ? 'landscape' : 'portrait';

      const shell = document.getElementById('gogDemoShell');
      shell.classList.toggle('panel-hidden', state.panelHidden);
      shell.classList.toggle('markers-visible', state.showMarkers);
      renderNavigation();
      renderToolbar(page);
      renderCanvas(page);
      renderAnnotations(page);
    }

    function beginAuthorization(mode) {
      state.loginOrigin = state.screen;
      state.authorizationMode = mode;
      state.loginError = null;
      state.screen = 'gog-login';
      render();
    }

    function returnScreenForLogin() {
      return state.loginOrigin || (state.accountByPlatform.gog.bindStatus === 'bound' ? 'profile-bound' : 'profile-unbound');
    }

    function completeGogAuthorization() {
      const nextAccount = state.authorizationMode === 'switch' ? SWITCHED_GOG_ACCOUNT : GOG_ACCOUNT;
      const returnScreen = returnScreenForLogin();
      state.accountByPlatform.gog = {
        bindStatus:'bound', tokenStatus:'valid', account:{ ...nextAccount },
      };
      state.gogLastSyncAt = '刚刚';
      state.screen = returnScreen.startsWith('library')
        ? 'library-bound'
        : returnScreen.startsWith('detail') ? 'detail-gog' : 'profile-bound';
      state.authorizationMode = null;
      state.loginOrigin = null;
      state.loginError = null;
      render();
    }

    function cancelGogAuthorization() {
      state.screen = returnScreenForLogin();
      state.authorizationMode = null;
      state.loginOrigin = null;
      state.loginError = null;
      render();
    }

    function refreshGogAccount() {
      if (state.gogRefreshInFlight) return;
      state.gogRefreshInFlight = true;
      state.gogRefreshRequestCount += 1;
      render();
      setTimeout(() => {
        state.gogRefreshInFlight = false;
        state.gogLastSyncAt = '刚刚';
        render();
      }, 120);
    }

    function openPlatformGame(card) {
      state.selectedGame = {
        gameId:card.dataset.gameId,
        platformAppId:card.dataset.platformAppId,
        platform:card.dataset.platform,
      };
      state.sourcePlatform = card.dataset.platform;
      state.selectedPlatform = resolveSelectedPlatform(state);
      state.showPlatformSwitch = false;
      state.screen = 'detail-gog';
      render();
    }

    function preparePageScenario(pageId) {
      if (pageId.startsWith('search') || pageId.startsWith('detail')) {
        if (state.accountByPlatform.gog.bindStatus === 'unbound') {
          state.accountByPlatform.gog = {
            bindStatus:'bound', tokenStatus:'valid', account:{ ...GOG_ACCOUNT },
          };
        }
      }
      if (pageId.startsWith('detail')) {
        state.selectedGame ||= {
          gameId:'cyberpunk-2077', platformAppId:'gog-1423049311', platform:'gog',
        };
        state.sourcePlatform ||= 'gog';
        state.selectedPlatform = pageId === 'detail-switch'
          ? (state.selectedPlatform || 'gog')
          : 'gog';
      }
      state.showPlatformSwitch = pageId === 'detail-switch';
    }

    function flashAnnotationTarget(ref) {
      const target = document.querySelector(`[data-annotation-ref="${ref}"]`);
      if (!target) return;
      target.classList.remove('annotation-flash');
      void target.offsetWidth;
      target.classList.add('annotation-flash');
      target.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' });
      setTimeout(() => target.classList.remove('annotation-flash'), 760);
    }

    function recoverSimulation() {
      state.simulation = 'loading';
      render();
      setTimeout(() => {
        state.simulation = 'normal';
        state.simulationOrigin = null;
        state.gogLastSyncAt = '刚刚';
        render();
      }, 120);
    }

    document.addEventListener('click', event => {
      const annotationItem = event.target.closest('[data-annotation-item]');
      if (annotationItem) {
        flashAnnotationTarget(annotationItem.dataset.ref);
        return;
      }

      const pageButton = event.target.closest('[data-page]');
      if (pageButton) {
        state.screen = pageButton.dataset.page;
        state.showLogoutConfirm = false;
        preparePageScenario(state.screen);
        render();
        return;
      }

      const gameCard = event.target.closest('[data-game-card]');
      if (gameCard) {
        openPlatformGame(gameCard);
        return;
      }

      const searchResult = event.target.closest('[data-search-result]');
      if (searchResult) {
        openPlatformGame(searchResult);
        return;
      }

      const actionButton = event.target.closest('[data-action]');
      if (!actionButton) return;
      if (actionButton.dataset.action === 'bind-gog') {
        beginAuthorization('bind');
        return;
      } else if (actionButton.dataset.action === 'switch-gog') {
        beginAuthorization('switch');
        return;
      } else if (actionButton.dataset.action === 'gog-authorize-success') {
        completeGogAuthorization();
        return;
      } else if (actionButton.dataset.action === 'gog-authorize-cancel') {
        cancelGogAuthorization();
        return;
      } else if (actionButton.dataset.action === 'gog-authorize-failure') {
        state.loginError = state.authorizationMode === 'switch'
          ? '切换失败，原账号 GalaxyRider 已保留。可重试或取消返回。'
          : '授权失败，未保存任何账号输入。可重试或取消返回。';
        render();
        return;
      } else if (actionButton.dataset.action === 'refresh-gog') {
        refreshGogAccount();
        return;
      } else if (actionButton.dataset.action === 'logout-gog') {
        state.showLogoutConfirm = true;
        render();
        return;
      } else if (actionButton.dataset.action === 'cancel-logout-gog') {
        state.showLogoutConfirm = false;
        render();
        return;
      } else if (actionButton.dataset.action === 'confirm-logout-gog') {
        state.accountByPlatform.gog = { bindStatus:'unbound', tokenStatus:'none', account:null };
        state.selectedGame = null;
        state.sourcePlatform = null;
        state.selectedPlatform = resolveSelectedPlatform(state);
        state.showLogoutConfirm = false;
        state.screen = 'profile-unbound';
        render();
        return;
      } else if (actionButton.dataset.action === 'open-platform-switch') {
        state.showPlatformSwitch = true;
        state.screen = 'detail-switch';
        render();
        return;
      } else if (actionButton.dataset.action === 'select-detail-platform') {
        state.selectedPlatform = actionButton.dataset.platform;
        state.showPlatformSwitch = false;
        state.screen = 'detail-gog';
        render();
        return;
      } else if (actionButton.dataset.action === 'reauthorize-source') {
        if (state.selectedPlatform === 'gog') beginAuthorization('bind');
        return;
      } else if (actionButton.dataset.action === 'launch-selected') {
        return;
      } else if (actionButton.dataset.action === 'simulation-refresh' || actionButton.dataset.action === 'simulation-retry') {
        recoverSimulation();
        return;
      } else if (actionButton.dataset.action === 'simulation-reauthorize') {
        state.simulation = 'normal';
        state.simulationOrigin = null;
        beginAuthorization('bind');
        return;
      } else if (actionButton.dataset.action === 'restore-original-entry') {
        state.screen = state.simulationOrigin || state.screen;
        state.simulation = 'normal';
        state.simulationOrigin = null;
        render();
        return;
      } else if (actionButton.dataset.action === 'anno-tab') {
        state.annotationTab = actionButton.dataset.value;
      } else if (actionButton.dataset.action === 'toggle-markers') {
        state.showMarkers = !state.showMarkers;
      } else if (actionButton.dataset.action === 'toggle-panel') {
        state.panelHidden = !state.panelHidden;
      } else {
        return;
      }
      render();
    });

    document.addEventListener('change', event => {
      if (event.target.matches('[data-action="simulation"]')) {
        const nextSimulation = event.target.value;
        if (nextSimulation !== 'normal' && state.simulation === 'normal') {
          state.simulationOrigin = state.screen;
        }
        state.simulation = nextSimulation;
        if (nextSimulation === 'normal') state.simulationOrigin = null;
        render();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const annotationItem = event.target.closest('[data-annotation-item]');
      if (!annotationItem) return;
      event.preventDefault();
      flashAnnotationTarget(annotationItem.dataset.ref);
    });

    window.GogDemoApp = {
      state, ANNOTATIONS, GOG_GAMES, SEARCH_RESULTS, DETAIL_BY_PLATFORM,
      convertEpicScore, resolveSelectedPlatform, openPlatformGame, render,
    };
    render();
  </script>
</body>
</html>
