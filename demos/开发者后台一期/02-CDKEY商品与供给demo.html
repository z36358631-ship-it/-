<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="demo-hash-example" content="#/P01-02?role=developer&state=default"><title>CDKEY 商品与供给｜开发者后台一期</title><style>:root {
  --brand-cyan: #38E8FF;
  --brand-blue: #6A7CFF;
  --brand-deep: #101827;
  --brand-night: #0B1220;
  --success: #1E9B66;
  --warning: #C88918;
  --danger: #D95656;
  --info: #3976D9;
  --text-primary: #172033;
  --text-secondary: #5B657A;
  --text-tertiary: #8B94A6;
  --line: #E6E9F0;
  --line-strong: #D5DAE5;
  --surface: #FFFFFF;
  --surface-soft: #F7F8FB;

  --nav-text: #AEB8CD;
  --nav-active: #FFFFFF;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;

  --font-number: "D-DIN-PRO", "DIN Alternate", var(--font-sans);
}

* { box-sizing: border-box; }

html, body { min-width: 1280px; min-height: 100%; margin: 0; }

body {
  color: var(--text-primary);
  background: #E9EDF4;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; }
button, a, select { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.number { font-family: var(--font-number); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

#app { min-width: 1280px; min-height: 100vh; }

.demo-stage { position: relative; min-width: 1280px; min-height: 100vh; background: #E9EDF4; }

.product-frame {
  position: relative;
  width: 100%;
  min-width: 1280px;
  height: 100vh;
  min-height: 720px;
  background: var(--surface-soft);
  overflow: hidden;
}

.top-bar {
  position: absolute;
  inset: 0 0 auto 0;
  z-index: 4;
  height: 56px;
  display: flex;
  align-items: center;
  color: #FFFFFF;
  background: linear-gradient(98deg, #0B1220 0%, #15213A 72%, #13243A 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.brand-block {
  width: 232px;
  height: 56px;
  padding: 0 var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

.brand-mark {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  color: var(--brand-cyan);
  border: 1px solid rgba(56, 232, 255, 0.44);
  border-radius: 9px;
  background: linear-gradient(145deg, rgba(56, 232, 255, 0.18), rgba(106, 124, 255, 0.18));
}

.brand-copy { min-width: 0; }
.brand-title { color: #FFFFFF; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
.brand-subtitle { color: #B7C2D6; font-size: 11px; }

.top-context { min-width: 0; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-3); }
.top-context strong { overflow: hidden; color: #FFFFFF; text-overflow: ellipsis; white-space: nowrap; }
.environment-badge { padding: 3px 8px; color: #D9FBFF; font-size: 11px; border: 1px solid rgba(56,232,255,.52); border-radius: 999px; background: rgba(56,232,255,.14); }
.top-account { margin-left: auto; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-3); color: #DCE3F0; }
.account-avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: #142039; font-weight: 700; background: linear-gradient(135deg, var(--brand-cyan), #B7C1FF); }
.account-copy span { display: block; color: #B7C2D6; font-size: 11px; }
.top-help-button { margin-left: auto; min-height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; color: #EAF0FA; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; background: rgba(255,255,255,.06); cursor: pointer; }
.top-help-button:hover { color: #FFFFFF; border-color: rgba(56,232,255,.44); background: rgba(56,232,255,.08); }
.top-help-button svg { width: 16px; height: 16px; color: var(--brand-cyan); }
.top-help-button + .top-account { margin-left: 0; }

.side-nav {
  position: absolute;
  inset: 56px auto 0 0;
  z-index: 3;
  width: 232px;
  min-height: 0;
  padding: var(--space-5) var(--space-3);
  color: var(--nav-text);
  background: var(--brand-deep);
  border-right: 1px solid rgba(255,255,255,.05);
}

.nav-label { padding: 0 10px var(--space-2); color: #64728D; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.nav-list { display: grid; gap: var(--space-1); }
.nav-item { position: relative; min-height: 42px; padding: 9px 10px; display: flex; align-items: center; gap: 10px; color: #AAB7CA; border-radius: var(--radius-sm); transition: color .15s, background .15s; }
.nav-item:hover { color: #EDF2FA; background: rgba(255,255,255,.05); }
.nav-item.is-active { color: #FFFFFF; background: linear-gradient(90deg, rgba(56,232,255,.20), rgba(106,124,255,.14)); }
.nav-item.is-active::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand-cyan); }
.nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
.nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-footer { position: absolute; right: 16px; bottom: 18px; left: 16px; padding-top: var(--space-4); color: #64728D; font-size: 11px; border-top: 1px solid rgba(255,255,255,.07); }

.workspace { position: absolute; inset: 56px 0 0 232px; min-width: 1048px; min-height: 0; overflow: auto; background: var(--surface-soft); }
.product-frame.is-login .workspace { left: 0; }
.context-bar { height: 48px; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-2); color: var(--text-secondary); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.88); }
.context-bar svg { width: 15px; height: 15px; color: var(--text-tertiary); }
.context-divider { color: var(--line-strong); }
.context-value { color: var(--text-primary); font-weight: 600; }

.page-wrap { min-width: 0; padding: var(--space-6) var(--space-8) 48px; }
.page-header { min-height: 66px; margin-bottom: var(--space-5); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-6); }
.page-eyebrow { margin-bottom: 4px; color: var(--brand-blue); font-family: var(--font-number); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.page-title { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -.02em; }
.page-summary { max-width: 720px; margin: 7px 0 0; color: var(--text-secondary); }
.page-actions { padding-top: 2px; display: flex; align-items: center; gap: var(--space-2); }

.help-center { padding: var(--space-6) var(--space-8) 48px; }
.help-center__header { margin-bottom: 20px; display: flex; gap: 16px; align-items: center; }
.help-center__header .text-back { margin: 0; }
.help-center__header h1 { margin: 0; font-size: 24px; }
.help-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; }
.faq-item button { width: 100%; min-height: 46px; padding: 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--text-primary); text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; }
.faq-item button:hover { color: var(--brand-blue); }
.faq-item p { margin: 0; padding: 12px 0 18px; color: var(--text-secondary); line-height: 1.65; }
.contact-card { min-height: 240px; padding: 20px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--line); border-radius: var(--radius-md); background: #FFFFFF; box-shadow: var(--shadow-card); }
.contact-card h2 { margin: 0 0 8px; font-size: 17px; }
.contact-card span { color: var(--text-secondary); }
.contact-card p { margin: 8px 0 0; padding: 12px; color: #0B6271; border-radius: var(--radius-sm); background: #EFFCFE; }

.review-tools {
  position: fixed;
  z-index: 20;
  left: 18px;
  bottom: 18px;
  width: 104px;
  height: 40px;
  padding: 10px 12px;
  overflow: hidden;
  color: #EAF0FA;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--radius-md);
  background: rgba(11,18,32,.94);
  box-shadow: 0 12px 36px rgba(5,10,20,.24);
  backdrop-filter: blur(12px);
  transition: width .16s ease, height .16s ease, padding .16s ease;
}
.review-tools:hover,
.review-tools:focus-within {
  width: 316px;
  height: auto;
  padding: 12px;
  overflow: visible;
}
.review-tools__title { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.review-tools__title span { color: #8F9DB7; font-size: 10px; font-weight: 500; }
.review-tools__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; opacity: 0; pointer-events: none; }
.review-tools label { display: grid; gap: 4px; color: #91A0BA; font-size: 10px; }
.review-tools select { width: 100%; height: 30px; padding: 0 26px 0 8px; color: #EAF0FA; font-size: 11px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; background: #172238; }
.review-tools__actions { margin-top: 8px; display: flex; justify-content: flex-end; gap: 8px; opacity: 0; pointer-events: none; }
.review-scenarios { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; opacity: 0; pointer-events: none; }
.review-scenarios > span { width: 100%; color: #91A0BA; font-size: 10px; }
.review-scenarios button { min-height: 28px; padding: 5px 8px; color: #C9D4E4; font-size: 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; background: #172238; cursor: pointer; }
.review-scenarios button:hover,
.review-scenarios button:focus-visible { color: #FFFFFF; border-color: rgba(56,232,255,.44); outline: 2px solid rgba(56,232,255,.26); outline-offset: 1px; }
.review-tools:hover .review-tools__grid,
.review-tools:hover .review-tools__actions,
.review-tools:hover .review-scenarios,
.review-tools:focus-within .review-tools__grid,
.review-tools:focus-within .review-tools__actions,
.review-tools:focus-within .review-scenarios { opacity: 1; pointer-events: auto; }

.overview-page { min-height: 100vh; padding: 42px 56px 72px; color: #E9EFF9; background: radial-gradient(circle at 74% 10%, rgba(56,232,255,.12), transparent 30%), linear-gradient(145deg, #0B1220, #121D32 68%, #182340); }
.overview-hero { max-width: 1180px; margin: 0 auto 28px; }
.overview-kicker { color: var(--brand-cyan); font-family: var(--font-number); font-size: 12px; font-weight: 700; letter-spacing: .14em; }
.overview-title { max-width: 820px; margin: 12px 0 8px; font-size: 38px; line-height: 1.2; }
.overview-copy { max-width: 840px; margin: 0; color: #9EABC0; font-size: 15px; }
.overview-note { margin-top: 20px; padding: 10px 14px; display: inline-flex; align-items: center; gap: 9px; color: #BCD0E8; border: 1px solid rgba(255,255,255,.10); border-radius: 999px; background: rgba(255,255,255,.04); }
.overview-note svg { width: 16px; height: 16px; color: var(--warning); }
.overview-grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
.overview-card { min-width: 0; padding: var(--space-5); color: #EAF0FA; border: 1px solid rgba(255,255,255,.09); border-radius: 14px; background: rgba(255,255,255,.05); box-shadow: 0 10px 36px rgba(0,0,0,.12); }
.overview-card:hover { border-color: rgba(56,232,255,.30); background: rgba(255,255,255,.07); }
.overview-card__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.overview-card__id { color: var(--brand-cyan); font-family: var(--font-number); font-weight: 700; }
.overview-card h2 { margin: 12px 0 4px; font-size: 17px; }
.overview-card p { min-height: 42px; margin: 0 0 16px; color: #93A2B9; font-size: 12px; }
.overview-link { display: inline-flex; align-items: center; gap: 7px; color: #FFFFFF; font-size: 13px; font-weight: 650; }
.overview-link svg { width: 15px; height: 15px; color: var(--brand-cyan); }
.overview-section { max-width: 1180px; margin: 28px auto 0; }
.overview-section__header { margin-bottom: 12px; display: flex; align-items: flex-end; justify-content: space-between; }
.overview-section h2 { margin: 0; font-size: 18px; }
.overview-section__header span { color: #7F8DA5; font-size: 12px; }
.role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
.role-card { padding: 16px; border: 1px solid rgba(255,255,255,.08); border-radius: var(--radius-md); background: rgba(255,255,255,.035); }
.role-card strong { display: block; margin-bottom: 5px; }
.role-card span { color: #8F9DB7; font-size: 12px; }
.route-index { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.route-group { padding: 14px; border: 1px solid rgba(255,255,255,.07); border-radius: var(--radius-md); background: rgba(255,255,255,.03); }
.route-group h3 { margin: 0 0 10px; color: #C9D4E4; font-size: 13px; }
.route-group a { min-height: 30px; padding: 5px 0; display: flex; align-items: center; gap: 8px; color: #94A3B9; font-size: 11px; border-top: 1px solid rgba(255,255,255,.045); }
.route-group a:hover { color: #FFFFFF; }
.route-group code { color: var(--brand-cyan); font-family: var(--font-number); }

@media (max-width: 1360px) {
  .page-wrap { padding-right: 24px; padding-left: 24px; }
  .help-center { padding-right: 24px; padding-left: 24px; }
  .help-grid { grid-template-columns: minmax(0, 1fr) 280px; }
  .review-tools:hover, .review-tools:focus-within { width: 280px; }
  .overview-page { padding-right: 40px; padding-left: 40px; }
}

.gh-icon { width: 18px; height: 18px; flex: 0 0 auto; }

.gh-button {
  min-height: 36px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--text-primary);
  font-weight: 650;
  line-height: 1;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
}
.gh-button:hover { border-color: #B8C1D4; background: #FAFBFD; }
.gh-button[data-variant="primary"] { color: #071522; border-color: var(--brand-cyan); background: linear-gradient(135deg, var(--brand-cyan), #8BEFFF); }
.gh-button[data-variant="primary"]:hover { filter: brightness(.98); }
.gh-button[data-variant="danger"] { color: var(--danger); border-color: rgba(217,86,86,.35); background: #FFF8F8; }
.gh-button[data-variant="ghost"] { color: #C7D1E1; border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.04); }
.gh-button[data-variant="text"] { min-height: 30px; padding: 0 6px; color: var(--info); border-color: transparent; background: transparent; }
.gh-button[data-size="small"] { min-height: 28px; padding: 0 9px; font-size: 11px; }
.gh-button:disabled, .gh-button[aria-disabled="true"] { color: var(--text-tertiary); border-color: var(--line); background: var(--surface-muted); cursor: not-allowed; opacity: .68; }
.page-button:disabled, .page-button[aria-disabled="true"] { color: var(--text-tertiary); cursor: not-allowed; opacity: .45; }
.gh-button svg { width: 16px; height: 16px; }

.field { display: grid; gap: 7px; min-width: 0; }
.field-label { display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.field-required { margin-left: 3px; color: var(--danger); }
.field-hint { color: var(--text-tertiary); font-size: 11px; font-weight: 400; }
.gh-input, .gh-select, .gh-textarea { width: 100%; color: var(--text-primary); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); transition: border .15s, box-shadow .15s; }
.gh-input, .gh-select { height: 38px; padding: 0 11px; }
.gh-textarea { min-height: 96px; padding: 10px 11px; resize: vertical; }
.gh-input:hover, .gh-select:hover, .gh-textarea:hover { border-color: #ABB5C9; }
.gh-input[aria-invalid="true"], .gh-textarea[aria-invalid="true"] { border-color: var(--danger); background: #FFF9F9; }
.field-error { color: var(--danger); font-size: 11px; }

.status-tag { min-height: 24px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 11px; font-weight: 650; border-radius: 999px; background: var(--surface-muted); white-space: nowrap; }
.status-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-tag[data-variant="success"] { color: var(--success); background: rgba(30,155,102,.10); }
.status-tag[data-variant="warning"] { color: var(--warning); background: rgba(200,137,24,.11); }
.status-tag[data-variant="danger"] { color: var(--danger); background: rgba(217,86,86,.10); }
.status-tag[data-variant="info"] { color: var(--info); background: rgba(57,118,217,.10); }

.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.panel-header { min-height: 54px; padding: 0 var(--space-5); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); border-bottom: 1px solid var(--line); }
.panel-title { margin: 0; font-size: 15px; }
.panel-description { color: var(--text-tertiary); font-size: 11px; }
.panel-body { padding: var(--space-5); }

.filter-bar { margin-bottom: var(--space-4); padding: 12px; display: grid; grid-template-columns: minmax(220px, 1.5fr) repeat(2, minmax(150px, .8fr)) auto; gap: 10px; align-items: end; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.search-field { position: relative; }
.search-field svg { position: absolute; top: 10px; left: 11px; width: 17px; height: 17px; color: var(--text-tertiary); pointer-events: none; }
.search-field input { padding-left: 36px; }

.table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.data-table th { height: 42px; padding: 0 14px; color: var(--text-secondary); font-size: 11px; text-align: left; background: var(--surface-muted); border-bottom: 1px solid var(--line); }
.data-table td { height: 54px; padding: 9px 14px; color: var(--text-primary); border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #FAFBFD; }
.table-primary { font-weight: 650; }
.table-secondary { margin-top: 2px; color: var(--text-tertiary); font-size: 11px; }

.pagination { margin-top: var(--space-4); display: flex; align-items: center; justify-content: space-between; color: var(--text-tertiary); font-size: 12px; }
.pagination__buttons { display: flex; gap: 6px; }
.page-button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
.page-button.is-active { color: #091521; border-color: var(--brand-cyan); background: rgba(56,232,255,.24); }

.tabs { margin-bottom: var(--space-4); display: flex; gap: var(--space-5); border-bottom: 1px solid var(--line); }
.tab { position: relative; padding: 0 2px 11px; color: var(--text-secondary); border: 0; background: transparent; cursor: pointer; }
.tab.is-active { color: var(--text-primary); font-weight: 650; }
.tab.is-active::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: var(--brand-blue); }
.tabs[data-variant="task"] { gap: 8px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-muted); }
.tabs[data-variant="task"] .tab { min-height: 36px; padding: 8px 16px; border: 1px solid transparent; border-radius: 7px; }
.tabs[data-variant="task"] .tab.is-active { color: var(--text-primary); border-color: var(--line-strong); background: #FFFFFF; box-shadow: 0 2px 8px rgba(24,38,66,.08); }
.tabs[data-variant="task"] .tab.is-active::after { display: none; }
.tab:focus-visible, .nav-item:focus-visible, .top-help-button:focus-visible { outline: 2px solid var(--brand-cyan); outline-offset: 2px; }
.authorization-summary { position: sticky; top: 0; z-index: 2; margin-bottom: 16px; padding: 14px 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(255,255,255,.96); }
.authorization-summary > div { min-width: 0; display: grid; gap: 5px; }
.authorization-summary span { color: var(--text-secondary); font-size: 11px; }
.code-block { overflow: hidden; border: 1px solid #24344F; border-radius: var(--radius-md); background: #101827; }
.code-block header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; color: #EAF0FA; border-bottom: 1px solid rgba(255,255,255,.08); }
.code-block header .gh-button[data-variant="text"] { color: #C8F7FF; }

.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }

.timeline { position: relative; margin: 0; padding: 0; list-style: none; }
.timeline-item { position: relative; padding: 0 0 20px 26px; }
.timeline-item::before { content: ""; position: absolute; top: 5px; left: 5px; width: 8px; height: 8px; border: 2px solid var(--surface); border-radius: 50%; background: var(--brand-blue); box-shadow: 0 0 0 1px var(--brand-blue); }

.test-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice-card { padding: var(--space-4); display: flex; align-items: center; gap: 10px; color: var(--text-secondary); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); cursor: pointer; }
.choice-card.is-selected { color: var(--success); border-color: rgba(30,155,102,.42); background: rgba(30,155,102,.05); }
.choice-card input { accent-color: var(--success); }

.publish-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.publish-option { padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); cursor: pointer; }
.publish-option.is-active { border-color: var(--brand-blue); box-shadow: 0 0 0 3px rgba(106,124,255,.10); }
.publish-option strong { display: block; }
.publish-option span { display: block; margin-top: 4px; color: var(--text-secondary); font-size: 12px; }

.targeting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.rule-builder { min-height: 236px; padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.rule-builder h3 { margin: 0 0 12px; font-size: 14px; }
.rule-builder__header { margin-bottom: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.rule-builder__header h3 { margin-bottom: 4px; }
.rule-builder__header p { margin: 0; color: var(--text-tertiary); font-size: 10px; }
.rule-row { padding: 10px 0; display: grid; grid-template-columns: 92px 1fr; gap: 10px; border-top: 1px solid var(--line); }
.rule-row__label { padding-top: 7px; color: var(--text-secondary); font-size: 11px; font-weight: 650; }
.rule-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.rule-chip { padding: 7px 10px; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 999px; background: var(--surface-soft); cursor: pointer; }
.rule-chip.is-active { color: #162040; border-color: rgba(106,124,255,.35); background: rgba(106,124,255,.12); }
.rule-chip.is-excluded { color: var(--danger); border-color: rgba(217,86,86,.28); background: rgba(217,86,86,.08); }
.audience-estimate span, .audience-estimate strong, .audience-estimate p { display: block; }
.audience-estimate > span { color: var(--text-tertiary); font-size: 10px; }
.audience-estimate > strong { margin: 4px 0; font-family: var(--font-number); font-size: 30px; }
.audience-estimate p { margin: 0 0 14px; color: var(--text-secondary); font-size: 11px; line-height: 1.5; }

.dashboard-toolbar { margin-bottom: var(--space-4); display: flex; justify-content: space-between; gap: var(--space-4); }
.dashboard-toolbar__group { display: flex; gap: 8px; }
.chart-legend { margin-top: 10px; display: flex; justify-content: flex-end; gap: 16px; color: var(--text-tertiary); font-size: 11px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-blue); }

.cdkey-workspace { min-width: 0; }
[data-cdkey-panel][hidden] { display: none !important; }
.cdkey-panel-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: var(--space-4); align-items: start; }
.cdkey-panel-grid > .panel { min-width: 0; }
.cdkey-panel-grid .data-table th,
.cdkey-panel-grid .data-table td { padding-right: 10px; padding-left: 10px; font-size: 11px; }
.source-boundary { margin-top: 12px; padding: 10px 12px; display: grid; gap: 3px; color: var(--text-secondary); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-muted); }
.source-boundary strong { color: var(--text-primary); font-size: 12px; }
.source-boundary span { font-size: 11px; line-height: 1.6; }
.one-time-result { margin-top: 14px; padding: 14px; display: grid; gap: 8px; color: #0B6271; border: 1px solid rgba(47,215,239,.44); border-radius: var(--radius-sm); background: #EFFCFE; }
.one-time-result code { padding: 9px 10px; color: #FFFFFF; border-radius: 6px; background: #101827; font-family: var(--font-number); overflow-wrap: anywhere; }
.one-time-result .form-actions { flex-wrap: wrap; }
.cdkey-table-actions { margin-top: 14px; justify-content: flex-end; }
.api-docs-layout { align-items: start; }
.api-docs-nav { margin-bottom: 16px; display: grid; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-md); background: #FFFFFF; }
.api-docs-nav button { min-height: 40px; padding: 9px 12px; color: var(--text-secondary); text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; }
.api-docs-nav button:last-child { border-bottom: 0; }
.api-docs-nav button:hover,
.api-docs-nav button:focus-visible { color: var(--text-primary); background: var(--surface-muted); outline: none; }
.api-docs-content { display: grid; gap: var(--space-4); }
.api-docs-content > section { scroll-margin-top: 16px; }
.api-docs-content .panel-body > p { margin: 0; color: var(--text-secondary); line-height: 1.65; }
.api-docs-content .panel-body > p + p { margin-top: 8px; }
.error-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
.error-chip-list button { min-height: 32px; padding: 6px 10px; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 999px; background: #FFFFFF; cursor: pointer; }
.error-chip-list button:hover,
.error-chip-list button:focus-visible { color: var(--brand-blue); border-color: var(--brand-blue); outline: none; }
[data-restriction-reason] { margin-bottom: 16px; align-items: center; justify-content: space-between; }
[data-restriction-help] { flex: 0 0 auto; min-height: 32px; padding: 6px 10px; color: currentColor; border: 1px solid currentColor; border-radius: 6px; background: transparent; cursor: pointer; }

@media (max-width: 1360px) {
  .metric-grid { gap: 9px; }
  .metric-card { padding: 13px; }
  .metric-value { font-size: 22px; }
  .login-aside { padding: 42px; }
  .login-form { padding-right: 48px; padding-left: 48px; }
  .form-grid, .summary-grid { gap: 14px; }
  .rule-row { grid-template-columns: 78px 1fr; }
  .cdkey-panel-grid { grid-template-columns: minmax(0, 1fr); }
}</style></head><body>

_100","manifestId":"manifest_demo_003","pointerKey":"app_demo_001 + OS + CPU 架构"},"testTask":{"testRoundId":"test_round_demo_002","taskId":"test_task_demo_002","assignee":"陈宇"},"campaign":{"id":"campaign_demo_001","requestDraftId":"campaign_draft_demo_001","userSegmentId":"segment_demo_001","mode":"轻量 Campaign／UTM","querySnapshotId":"query_snapshot_demo_20260903"}},"states":["default","loading","empty","error","permission"],"helpCenter":{"title":"帮助中心","faq":[{"question":"如何创建 Key 批次？","answer":"先确认游戏、SKU、渠道、额度和有效期均在平台授权范围内，再在 Key 批次 Tab 提交。"},{"question":"额度不足怎么办？","answer":"当前批次不会生成，请联系对接的盖世发行运营调整授权额度。"},{"question":"渠道未开通怎么办？","answer":"发行方不能自行扩大白名单，请联系对接的盖世发行运营。"},{"question":"Secret 丢失怎么办？","answer":"Secret 不支持再次查看，请轮换凭据并更新第三方渠道配置。"},{"question":"重复请求如何处理？","answer":"同一 request_id 幂等返回原结果；订单内容冲突时返回重复订单冲突。"},{"question":"凭据暂停后会怎样？","answer":"新请求立即拒绝，历史审计和已交付记录继续保留。"},{"question":"Key 作废范围是什么？","answer":"只作废尚未分配的 Key，已分配记录继续保留。"},{"question":"盖世平台 Key 和外部平台 Key 有什么区别？","answer":"盖世平台 Key 由盖世兑换服务校验；Steam、Epic、GOG 等 Key 必须由对应平台或供应商提供。"}],"contact":{"supportName":"发行支持","serviceHours":"以合作对接安排为准","channel":"当前未配置公开联系方式","fallback":"请联系对接的盖世发行运营"}},"pages":{"P01-01":{"audience":"developer","summary":"在新发行平台独立品牌页面完成已有账号密码登录，或通过盖世游戏平台第三方授权自动建号／登录，再进入开发者注册状态分流。","status":"未登录","primaryAction":"账号密码登录","onboarding":{"title":"从首款签约游戏开始，完成发行闭环","description":"盖世游戏为已签约且获得发行授权的合作方提供资料、供给、测试发布、精准投放和发行数据能力。","audience":"一期仅面向受邀合作方","steps":["完成厂商与游戏资料","配置商品及 CDKEY","上传包体并通过测试发布","提交精准投放并查看发行数据"],"preparations":["受邀账号","公司与游戏授权资料","首款签约游戏资料","拟合作渠道和技术联系人"],"primaryAction":"开始入驻"},"sections":[{"title":"页面目标与场景","items":["在新发行平台独立品牌页面完成已有账号密码登录，或通过盖世游戏平台第三方授权自动建号／登录，再进入开发者注册状态分流。","未登录用户进入开发者平台；已有且已设置密码的平台账号可直接登录，新用户通过盖世游戏平台授权首次创建平台账号。身份验证成功后根据开发者注册状态继续。","用户未建立有效平台会话；账号密码登录需要有效独立平台账号；盖世第三方登录依赖盖世授权服务和可用的盖世游戏 App。登录前不要求存在 vendor_id。"]},{"title":"展示与业务字段","items":["账号密码入口只接受已存在且已设置密码的平台账号；账号不存在、密码未设置或密码错误均不得创建账号。盖世授权不复用盖世 Cookie、会员权益或玩家业务数据；首次授权由服务端原子创建独立 account_id、写入唯一身份映射并建立新平台会话，再按开发者注册状态分流。","默认展示账号／邮箱、密码、“登录”“忘记密码”和“使用盖世游戏账号登录”；密码默认掩码，可切换可见。页面说明“首次使用盖世游戏账号授权将自动创建平台账号；开发者资格仍需另行提交资料”。","盖世登录态展示二维码、倒计时、“二维码已失效，点击刷新”“返回账号登录”；扫码后依次展示“已扫码，请在盖世游戏确认”和“授权成功，正在进入”。","页面不展示“注册账号”“绑定已有开发者账号”或“继续注册开发者”；账号密码不存在时统一提示“账号或密码错误；首次使用请通过盖世游戏账号登录”，不得透露账号是否存在。","二维码取消、过期、授权服务失败、身份映射冲突、自动建号失败和账号停用分别显示可恢复原因；建号或映射失败时不得产生孤立账号、孤立映射或半登录会话。"]},{"title":"交互与动作","items":["用户提交账号密码后，服务端只校验既有凭据和账号状态；成功建立独立会话，失败时保留账号、清空密码并恢复按钮，同一提交不得重复建立会话或触发注册。","用户选择盖世登录后生成绑定当前浏览器会话、短时有效且只能消费一次的授权请求；扫码确认成功后，以盖世稳定身份查找唯一映射：已有映射则登录对应 account_id；无映射则在同一事务中创建未取得开发者资格的 account_id、写入映射并建立会话。","自动建号不得使用盖世邮箱匹配或覆盖既有平台账号；若稳定身份已存在冲突映射，停止建号和登录，保留原关系并提示联系平台处理。","登录成功后按状态路由：未提交／草稿进入 P01-03，待线下结果进入 P01-07，需修改进入 P01-03，已确认进入 P01-02，已停用结束会话并停留登录页。首次自动建号的默认状态为未提交。","首次盖世登录后可在已登录账号安全能力中验证邮箱并设置平台密码；设置完成前只能继续使用盖世登录。设置密码不得创建第二个 account_id 或改变开发者注册状态。","用户选择“忘记密码”后通过已验证邮箱重置；未设置密码或账号不存在时均返回相同结果，不显示目标账号是否存在。发送、校验或重置失败时保留当前账号输入并允许重试。"]},{"title":"结果与边界","items":["成功建立新发行平台独立会话，并按开发者注册状态进入资料提交、结果或工作台；盖世首次授权成功时原子保存新 account_id 与唯一身份映射。","同一盖世身份最多映射一个 account_id，同一 account_id 一期最多映射一个盖世身份；相同邮箱不触发自动合并。","账号密码和盖世授权并发成功时，以服务端首次成功建立的会话为准，其余授权请求立即失效，不得覆盖当前账号。","解绑、换绑或归属争议由平台运营核验后处理；登录页不提供绑定、换绑或覆盖入口。","登录页面、会话 Cookie、业务权限和数据库均属于新发行平台；仅授权中间态使用盖世名称、Logo 和二维码。"]}],"states":["default","loading","empty","error","permission","credential-error","account-disabled"],"actions":[{"id":"gamehub-login","label":"使用盖世游戏账号登录"},{"id":"forgot-password","label":"忘记密码"}],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"独立账号与盖世第三方登录页"},"P01-02":{"audience":"developer","summary":"已确认开发者的厂商资料、Game、APPID、SDK 接入及后续发行入口总览。","status":"开发者资格已确认","primaryAction":"进入游戏管理","sections":[{"title":"页面目标与场景","items":["已确认开发者的厂商资料、Game、APPID、SDK 接入及后续发行入口总览。","开发者注册结果已确认的合作方登录后查看本厂商建档进度、Game 列表与 APPID 接入状态。","独立平台会话有效；账号处于已启用；开发者注册和首次厂商资料结果均为已确认；账号已绑定唯一 vendor_id。"]},{"title":"展示与业务字段","items":["首页只承载已确认开发者的 vendor_id + game_id + app_id 上下文入口。身份登录成功但注册未确认的账号不得加载本页框架、导航或缓存数据。","顶部展示厂商名称、独立账号、vendor_id、厂商资料状态和“维护厂商资料”；盖世身份只显示“已映射／未映射”，不展示玩家昵称、会员或游戏资产。","游戏卡展示游戏名称、game_id、app_id、Windows／Mac／Linux、发行方式、资料结果和发布状态；无 Game 时显示“尚未创建游戏”和“创建游戏”。","APPID 已创建时展示三系统 SDK 当前版本和“进入接入页”；开发文档入口打开 Google Docs。未配置时显示具体不可用原因。","待处理区展示资料待线下结果、需修改和结果已录入；合同、资质、定价和上架不提供在线审批动作。","投放和发行数据入口仅在 Game 与 APPID 都存在时展示摘要；开发者不能从首页执行发布、停售、下架或启动投放。"]},{"title":"交互与动作","items":["每次加载及进入子模块前重新校验账号启用、注册已确认和唯一 vendor_id；条件失效时清除本页数据，并按真实状态返回登录、注册资料或结果页。","选择厂商资料、Game、APPID／SDK 或线下结果后进入本厂商对应页面；返回首页时刷新最新状态并恢复所选 Game。","后续入口同时校验 vendor_id + game_id + app_id；缺少 APPID、越权或前置未满足时留在首页并展示缺失项。","SDK 下载失败保留系统选择并允许重试；Google Docs 在新浏览器页打开，不清空首页状态。"]},{"title":"结果与边界","items":["已确认开发者进入本厂商资料、Game、APPID／SDK、线下结果或已具备资格的后续业务入口。","未提交、草稿、待线下结果、需修改和已停用账号均不可进入工作台；不能仅靠前端隐藏入口。","资料待线下结果时对应提交版本只读；需修改后可从结果页返回修改，上一有效快照不被覆盖。","数据异常不以 0 代替未知结果，首页显示“数据暂不可用”和更新时间。"]}],"states":["default","loading","empty","error","permission","profile-rejected","data-delayed"],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"开发者工作台首页"},"P01-03":{"audience":"developer","summary":"首次开发者注册、厂商资料提交，以及已确认后的厂商资料修改。","status":"草稿","primaryAction":"提交注册","actions":[{"id":"save-draft","label":"保存草稿"}],"sections":[{"title":"页面目标与场景","items":["首次开发者注册、厂商资料提交，以及已确认后的厂商资料修改。","已登录但尚未取得开发者资格的用户首次提交资料；结果为需修改时重新提交；已确认开发者后续修订厂商资料。","独立平台会话有效且账号已启用；首次注册不要求已有 vendor_id，账号不存在其他有效申请或厂商绑定；后续修改要求账号已绑定目标厂商。"]},{"title":"展示与业务字段","items":["平台账号自动创建不等于开发者注册完成。首次注册与后续厂商资料复用同一数据结构，避免重复填写。主体资质、合同和授权仍在线下核验；本页收集判断与协作所需的最小信息，不提供在线签约或自动审核。","主体信息包含主体类型、注册国家／地区、主体法定名称和登记编号；登记编号的必填与格式按注册地区配置。系统检测到疑似已有主体时只提示“该主体可能已登记，请联系平台核实”，不展示既有账号或厂商信息。","品牌资料包含厂商展示名称、Logo、简介和官网；联系资料包含联系人姓名、联系手机和联系邮箱，手机或邮箱至少填写一项。","顶部状态为未提交、草稿、待线下结果、需修改或已确认；需修改展示原因摘要，已确认后新建修改稿时显示“当前有效版本保持不变”。","首次注册说明固定为“平台账号已创建；提交后由平台结合线下合作与资质结果确认，确认前无法进入工作台、创建游戏或 APPID”。待线下结果时表单只读。"]},{"title":"交互与动作","items":["用户保存草稿时校验已输入字段格式；首次保存只关联 account_id，不授予 vendor_id 数据权限。失败时保留输入并显示“保存失败，请重试”。","用户提交注册时校验主体、品牌、联系人和上传状态；成功生成不可覆盖的资料版本，并创建或关联待确认的 vendor_id，账号仍不可进入工作台。重复提交不生成新版本。","运营录入已确认后，系统原子绑定 account_id + vendor_id 并开放工作台；绑定或权限写入失败时保持待线下结果，不出现已确认但无厂商权限的半成功状态。","需修改时恢复原输入并生成新版本；已确认后的修改稿在新结果录入前不覆盖上一有效快照。","离开存在未保存修改的页面时，页面内提示“内容尚未保存”，用户可保存草稿或放弃本次修改。"]},{"title":"结果与边界","items":["草稿保存于当前账号；首次提交后进入待线下结果并跳转 P01-07；结果已确认后账号获得唯一厂商权限并可进入 P01-02。","同一账号同时只允许一个有效开发者注册申请或厂商绑定；同一主体疑似重复时进入人工核实，不自动合并或泄露已有关系。","联系资料不在 C 端展示；盖世第三方身份不写入厂商公开资料。","首次确认前不生成可公开使用的厂商快照，也不开放 Game、APPID 或后续模块。"]}],"states":["default","loading","empty","error","permission","unsaved","reviewing","rejected","approved"],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"开发者注册与厂商资料页"},"P01-04":{"audience":"developer","summary":"本厂商 Game、APPID、支持系统、发行方式及跨流程状态列表。","status":"已确认","primaryAction":"创建游戏","sections":[{"title":"页面目标与场景","items":["本厂商 Game、APPID、支持系统、发行方式及跨流程状态列表。","合作方查看本厂商 Game 建档、APPID 接入、线下结果和后续发行状态，并进入创建、编辑、接入或结果页面。","账号已登录且厂商资料存在；数据源只包含账号绑定厂商的游戏项目。"]},{"title":"展示与业务字段","items":["列表聚合 vendor_id + game_id + app_id 状态，但不承载 SDK 能力配置、CDKEY 供给、包体管理、发布或投放的具体操作。","顶部支持按游戏名称、game_id 或 app_id 搜索，支持发行方式、资料结果和发布状态筛选。","列表展示游戏名称、game_id、app_id、Windows／Mac／Linux 支持情况、发行方式、资料结果、供给／版本状态摘要、发布状态、更新时间和操作；未创建 APPID 时明确显示“未创建”。","资料结果只使用草稿、待线下结果、需修改、已确认；合同、资质、定价和上架结论显示其线下结果摘要及录入时间，不提供在线审批按钮。","默认按更新时间倒序，同一时间按 Game 创建时间倒序；每页 20 条，可切换 20、50、100 条。无数据、无结果、加载失败和无权限均有明确状态。"]},{"title":"交互与动作","items":["搜索与筛选组合生效，清空后恢复默认列表；切换筛选或每页条数时回到第 1 页。","选择“创建游戏”进入创建页；选择游戏名称进入编辑／只读页；选择 APPID 进入 APPID 与 SDK 接入页；选择“查看结果”进入对应资料版本。","资料已确认、APPID 已创建且后续前置满足时，可进入该 Game 的 CDKEY 供给或包体版本入口；每次进入均校验 vendor_id + game_id + app_id，归属或权限失败不返回目标数据。","刷新后保持当前搜索、筛选和页码；目标记录在刷新期间失效时移除该行并提示列表已更新。"]},{"title":"结果与边界","items":["开发者进入本厂商 Game 的创建、编辑、APPID／SDK、线下结果或具备资格的后续业务入口。","一期不提供批量选择、批量编辑、删除游戏或跨厂商搜索。","已发布或已下架状态由平台操作回写；开发者不能在列表直接发布、下架或切换发行方式。","游戏数量超过当前页容量时使用服务端分页，不无限加载。"]}],"states":["default","loading","empty","error","permission","filtered-empty"],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"游戏列表页"},"P01-05":{"audience":"developer","summary":"Game 基本资料、宣传素材、发行范围、Windows／Mac／Linux 要求、Steam 全量标签和发行方式的建档与提交。","status":"草稿","primaryAction":"提交资料","sections":[{"title":"页面目标与场景","items":["Game 基本资料、宣传素材、发行范围、Windows／Mac／Linux 要求、Steam 全量标签和发行方式的建档与提交。","合作方创建本厂商 Game，或在草稿、需修改、已确认及已发布后提交资料修改。","账号已登录并绑定目标厂商；厂商资料已提交。新建时归属 vendor_id 自动绑定且不可更改；待线下结果时提交版本只读。"]},{"title":"展示与业务字段","items":["一个 Game 只绑定一个厂商和一种发行方式；一期一个 Game 后续创建一个 APPID。本页不承载 APPID 编辑、CDKEY SKU、包体上传、测试或正式发布。","基本资料区展示游戏中文名、原始／英文名、短简介、详细介绍、开发商名称和预计／实际发行日期；vendor_id 自动展示且不可编辑，保存成功后展示 game_id。","宣传素材区展示游戏图标、横版封面、竖版封面和游戏截图的上传进度、预览、替换与移除；提交时明确各类必填状态。","发行信息区展示支持语言、销售地区、Windows／Mac／Linux 支持开关及各自最低／推荐要求，以及唯一发行方式“第三方平台激活”或“盖世直接下载”。至少选择一个桌面系统，不提供移动端字段。","标签区直接使用 Steam 全量标签字典，支持按标签名称搜索并展示标签 ID；开发者至少选择一个有效标签，平台不维护平行标签库或自定义标签。","页面顶部展示草稿、待线下结果、需修改、已确认；已确认或已发布 Game 创建修改稿时显示“当前有效内容保持不变，录入新结果后更新”。"]},{"title":"交互与动作","items":["开发者编辑后保存草稿，系统校验已输入字段和上传结果；成功后记录保存时间，失败时保留全部输入并允许重试。","选择“提交资料”时校验必填字段、素材、语言、地区、已选系统要求、Steam 标签和发行方式；通过后生成不可变版本并进入待线下结果，重复点击只保留一次有效提交。","待线下结果页面只读；需修改后从原输入继续编辑。已确认或已发布 Game 修改关键资料时生成新修改稿，新结果录入前不覆盖上一有效快照。","发行方式在草稿或需修改状态可改；已确认后修改须形成新资料版本，已发布 Game 不能由开发者直接切换线上交付方式。","离开未保存修改时显示页面内未保存提示，用户可保存草稿或放弃本次未保存修改；已保存内容再次进入时恢复。"]},{"title":"结果与边界","items":["Game 草稿保存于本厂商；提交成功后进入待线下结果，并在游戏列表和线下结果页同步状态。","已发布 Game 的关键资料修改在待结果或需修改时，C 端继续使用上一有效快照；新结果确认为可用后才更新，开发者无直接发布动作。","一个 Game 同时只允许一个待线下结果资料版本；并发保存发现版本变化时不覆盖服务端结果，提示刷新后继续。","Game 不提供删除；误建项目由平台运营线下确认后处置，不在一期新增自助删除流程。"]}],"states":["default","loading","empty","error","permission","unsaved","reviewing","rejected","approved"],"actions":[{"id":"save-draft","label":"保存草稿"}],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"创建／编辑游戏页"},"P01-06":{"audience":"developer","summary":"为一个 Game 创建一期唯一 APPID，并提供 Windows／Mac／Linux SDK 下载和 Google Docs 开发文档入口。","status":"APPID 已创建","primaryAction":"下载 SDK","sections":[{"title":"页面目标与场景","items":["为一个 Game 创建一期唯一 APPID，并提供 Windows／Mac／Linux SDK 下载和 Google Docs 开发文档入口。","合作方完成 Game 建档后创建 APPID，技术人员获取对应系统 SDK 并按最小能力集完成初始化、登录、权益与首次启动授权接入。","独立开发者账号已登录并绑定目标 vendor_id；目标 game_id 归属该厂商且处于可接入状态；一期同一 game_id 最多存在一个 APPID。"]},{"title":"展示与业务字段","items":["APPID 是新发行平台公开应用标识，不是密码、API Secret 或 Steam AppID。SDK 只承载初始化、登录、权益查询、首次启动授权、错误码和日志；一期不建设通用开放平台凭据体系。","未创建状态说明“一期一个 Game 创建一个 APPID；创建后不可修改、删除或重新生成”，并展示目标 Game 与发行方式供确认。","创建成功后只读展示 app_id、创建人、创建时间和状态；SDK 区分别展示 Windows／Mac／Linux 包的版本、文件大小、校验值、更新时间与下载状态。","Google Docs 入口说明文档覆盖初始化、登录、权益、首次启动授权、错误码和日志；平台内不复制正文、搜索、版本管理或 FAQ。","授权规则固定为：设备首次启动联网校验并成功获得 app_id 对应权益后允许离线运行；一期不要求后续每次启动联网鉴权。","页面明确“不提供心跳、并发控制、封禁、踢下线、IP 白名单、组织成员权限或多项目凭证”；不得用占位配置暗示一期支持。"]},{"title":"交互与动作","items":["点击“创建 APPID”时服务端按 vendor_id + game_id 校验归属与唯一性；提交携带幂等键，同一请求重试返回同一 app_id，不生成重复对象。","APPID 已存在时重复创建返回既有对象并刷新页面；Game 状态冲突、账号停用或越权时不创建，分别提示当前状态或“无权访问”，且不泄露他厂对象。","选择系统 SDK 后生成受控下载；下载失败保留目标系统并提供重试，校验值不匹配时提示删除本地文件并重新下载。SDK 包未配置时按钮禁用并显示“该系统 SDK 暂未配置”。","点击“开发文档”在新浏览器页打开当前有效 Google Docs；未配置地址时入口不可用并提示联系发行运营，原页面上下文不丢失。"]},{"title":"结果与边界","items":["生成并持久化一期唯一 app_id，或展示既有 APPID；合作方可获取已配置的三系统 SDK 与开发文档，后续商品、包体和数据以 vendor_id + game_id + app_id 关联。","APPID 创建后不可修改、删除、轮换或手工覆盖；停用只改变可用状态，不释放 game_id 唯一关系。","SDK 包按系统独立发布版本，但能力边界一致；SDK 下载不代表 Game、商品或包体已经上架。","首次授权失败不得进入离线模式；首次授权成功后，本期不因缺少心跳或后续联网而自动撤销既有本地授权。权益撤销如何在设备重新联网后生效由权益服务规则处理。"]}],"states":["default","loading","empty","error","permission","reviewing","approved","rejected","syncing"],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"APPID 与 SDK 接入页"},"P01-07":{"audience":"developer","summary":"厂商或 Game 资料版本、线下结果、原因摘要及重新提交入口。","status":"需修改","primaryAction":"按意见修改","sections":[{"title":"页面目标与场景","items":["厂商或 Game 资料版本、线下结果、原因摘要及重新提交入口。","合作方从工作台、厂商资料或游戏列表查看某次提交的待处理状态与已录入线下结果。","账号已登录；目标资料版本归属本厂商；对象类型为厂商资料或 Game 资料。"]},{"title":"展示与业务字段","items":["每次提交形成独立不可变版本；本页只展示本厂商资料及线下结果，不提供结果录入、在线审批或发布操作。","页面展示对象类型、对象名称、版本、提交时间、结果录入时间和状态“待线下结果”“已确认”或“需修改”。","需修改时展示问题字段与原因摘要；Steam 标签最终结果与提交值不同时，展示提交标签、已确认标签和线下原因摘要。","已确认时展示生效结果：首次厂商资料成为有效快照，修改稿更新有效快照，Game 资料进入对应发行准备；发布前置未齐时显示“资料已确认，暂不满足发布条件”及缺失项。","待线下结果或修改稿需修改时展示“当前有效内容保持不变”；无上一快照时展示“尚未生成可用内容”。"]},{"title":"交互与动作","items":["选择“返回编辑”时，需修改对象进入对应编辑页并恢复该版本输入；待线下结果仅可进入只读页。","历史记录只读展示，不得覆盖最新状态或恢复为当前版本。","目标版本归属校验失败时不返回内容，显示“无权查看该记录”并返回本厂商工作台。"]},{"title":"结果与边界","items":["开发者获得明确线下结果，并进入允许的编辑页或继续后续发行准备。","原因摘要由运营按线下结论录入，开发者不能修改；重新提交不会删除旧结果。","资料确认为可用不等于正式发布；发行授权、地区、合同范围及对应商品／版本的线下商业结果仍须满足。","同一对象以最新有效资料版本决定可操作状态，历史页面只读。"]}],"states":["default","loading","empty","error","permission","enabled","disabled","filtered-empty"],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"资料线下结果页"},"P01-08":{"audience":"operations","summary":"管理独立平台账号、开发者注册状态、唯一厂商关系及盖世第三方身份映射异常。","status":"账号已启用","primaryAction":"发送密码设置","actions":[{"id":"approve","label":"通过"},{"id":"reject","label":"驳回"}],"sections":[{"title":"页面目标与场景","items":["管理独立平台账号、开发者注册状态、唯一厂商关系及盖世第三方身份映射异常。","平台发行运营查询申请人与已确认开发者，处理账号启停、密码设置／重置协助、映射冲突或经核验的解绑。","操作人具有平台发行运营权限；账号、申请、厂商和盖世身份映射均按当前权限范围读取。"]},{"title":"展示与业务字段","items":["平台账号可先于开发者资格存在；盖世首次授权产生的平台账号可暂未设置密码。密码和盖世身份映射分别管理，但都只能登录同一 account_id；运营不提供把盖世身份合并到另一个已有账号的常规入口。","登录凭据只显示“密码未设置／已设置”“盖世已映射／未映射／冲突”，不得显示密码、盖世稳定身份明文、玩家昵称、会员或游戏资产。","注册状态展示未提交、草稿、待线下结果、需修改、已确认；仅已确认记录展示有效 vendor_id 和工作台权限。","详情提供“停用账号”“启用账号”“发送密码设置／重置”“核验后解绑盖世身份”；解绑按钮仅在填写核验依据且账号已有可用密码凭据后可用，不提供直接换绑或合并账号。","合同字段只记录线下已签约结果，不提供合同文件导入、在线签署或在线审核；页面不展示结算账户、提款或自动分账。"]},{"title":"交互与动作","items":["搜索与筛选组合生效，变化后回到第 1 页；加载失败保留条件且不展示其他权限范围缓存。","运营停用账号时填写原因；成功后新登录被拒绝，已有会话失效，但申请、厂商、Game、资料和历史结果不删除。","运营向已验证邮箱发送一次性密码设置／重置链接，不生成或展示明文密码；未设置密码的账号完成设置后可使用账号密码登录，已有密码在重置成功前保持有效。","运营解绑盖世身份前填写申请人核验方式、依据摘要和原因，并校验账号已有可用密码；成功后该身份不能继续登录此账号，账号密码及业务数据不变。无替代登录凭据或存在归属争议时禁止解绑并转人工处置。","注册结果已确认时，账号与唯一 vendor_id 必须原子绑定；已有有效厂商关系或主体冲突时不覆盖，保持待处理并记录冲突。"]},{"title":"结果与边界","items":["更新账号启停、密码设置／重置请求或盖世映射状态；已确认账号保持唯一厂商关系，登录和工作台门禁读取最新结果。","不因相同邮箱、联系人或主体名称自动合并账号；疑似重复进入人工核实。","解绑只移除登录凭据映射，不删除 account_id、vendor_id 或任何业务历史。","平台运营不得代替用户扫码盖世账号或查看第三方身份敏感值。"]}],"states":["default","loading","empty","error","permission","reviewing","approved","rejected","filtered-empty"],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"开发者账号与盖世身份映射管理页"},"P01-09":{"audience":"operations","summary":"查看厂商资料版本与差异，录入线下完成的合同／主体资质结果及依据摘要。","status":"待线下结果","primaryAction":"保存线下结果","sections":[{"title":"页面目标与场景","items":["查看厂商资料版本与差异，录入线下完成的合同／主体资质结果及依据摘要。","商务或法务已在线下完成签约与主体资质核验后，平台发行运营将既有结论录入系统供后续链路读取。","操作人具有平台发行运营权限；目标 vendor_id 属于签约范围且存在待线下结果资料版本；运营已取得可追溯的线下结论。"]},{"title":"展示与业务字段","items":["本页不在线审核合同或主体资质，不让系统自动生成商务结论。系统仅校验资料是否完整、目标版本状态和录入字段格式；运营按既有线下结论录入“已确认”或“需修改”。","列表展示 vendor_id、厂商名称、资料版本、提交人、提交时间、状态和操作；支持名称／ID 搜索及待线下结果／已确认／需修改筛选，默认待线下结果优先。","详情展示厂商公开资料、联系资料、绑定主体、上一有效快照差异，以及资料完整性校验结果；校验结果不得被描述为资质审批意见。","录入区包含结果、原因摘要、线下审核人、线下完成时间、结果来源／依据编号和录入备注；结果为需修改时原因摘要和问题字段必填。","已处理版本只读展示线下审核人、录入人、线下完成时间、录入时间、结果和原因摘要；无权限时不返回资料。"]},{"title":"交互与动作","items":["运营选择待录入版本后查看详情；每页 20 条，不提供批量结果录入。","保存前只校验版本仍待线下结果、厂商绑定、必填字段和结果来源；不得根据页面资料自动推荐或改写线下结论。","保存“已确认”后该版本成为新的有效快照；保存“需修改”后保留开发者输入并开放修改入口。","同一资料版本只允许一个当前有效结果；并发录入以首个成功结果为准。保存失败不改变状态并保留输入，运营可按同一结论重试。"]},{"title":"结果与边界","items":["厂商资料进入已确认或需修改；工作台、线下结果页及下游有效快照按已录入结果更新。","首次确认前不向下游输出可公开使用的厂商快照；修改稿待结果期间继续使用上一有效快照。","运营不得直接修改开发者原提交内容；需调整时按线下结论录入需修改并写明字段与原因摘要。","日志记录资料版本、结果来源、线下审核人、录入人、前后状态和时间，但不保存合同正文或敏感附件。"]}],"states":["default","loading","empty","error","permission","reviewing","approved-gated","approved-ready","rejected"],"actions":[{"id":"record-offline-result","label":"保存线下结果"}],"prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"厂商线下资质结果录入页"},"P01-10":{"summary":"查看 Game 资料、三系统要求与 Steam 标签，录入线下完成的资料／上架结论及发布前置摘要。","sections":[{"title":"页面目标与场景","items":["查看 Game 资料、三系统要求与 Steam 标签，录入线下完成的资料／上架结论及发布前置摘要。","商务、发行与法务已在线下完成资料、授权和上架判断后，平台发行运营将既有结论录入系统。","操作人具有平台发行运营权限；vendor_id + game_id + app_id 关系有效，Game 存在待线下结果资料版本；运营已取得可追溯的线下结论。APPID 未创建时可录入资料结果，但不得标记发布前置已满足。"]},{"title":"展示与业务字段","items":["本页不在线审批资料、定价或上架，也不自动生成商务结论。系统只做字段完整性、对象关系和状态校验；运营按线下结论录入资料结果、最终 Steam 标签与发布前置摘要。","列表展示游戏名称、vendor_id、game_id、app_id、发行方式、支持系统、资料版本、提交时间和结果状态；默认待线下结果优先。","详情完整展示基本资料、素材、语言、销售地区、Windows／Mac／Linux 最低／推荐配置、开发者提交的 Steam 标签和发行方式；修改稿展示上一有效快照及差异。","Steam 标签结果只能从同一 Steam 全量标签字典中选择；若与提交值不同，原因摘要必填。平台不得新增自定义标签或维护平行标签库。","发布前置区只读展示线下发行授权、有效期、授权地区、合同范围、定价／领取条件、分成、结算责任和上架结果的状态、来源及时间；缺失项显示“线下结果未录入”。","录入区包含资料结果、问题字段／原因摘要、线下审核人、线下完成时间、结果来源／依据编号和录入备注。已处理版本只读展示线下审核人、录入人和两个时间。"]},{"title":"交互与动作","items":["运营搜索、筛选并选择记录后在同页查看；每页 20 条，不提供批量结果录入。","保存前只校验版本状态、三 ID 关系、资料完整性、Steam 标签字典有效性及录入字段；系统不得把完整性校验自动转成“已确认”或“可上架”。","保存“已确认”后生成新的 Game 有效快照和已确认标签；保存“需修改”后保留输入并开放开发者修改。APPID、授权或商业结果缺失时发布前置仍为未满足。","已发布 Game 的修改稿结果确认为可用后原子切换新快照；录入完成前继续使用上一有效快照。并发录入以首个成功结果为准，失败不产生半生效资料。"]},{"title":"结果与边界","items":["Game 资料进入已确认或需修改；已确认时生成有效资料与 Steam 标签快照，并输出独立的发布前置状态。","发行授权有效、销售地区在授权范围内、合同范围覆盖该 Game／发行方式且线下定价与上架结果已确认，才可满足正式发布门禁。","资料确认不创建 CDKEY SKU、不上传包体、不执行发布；开发者不能从本页或结果页直接发布。","日志记录三 ID、资料版本、提交标签、最终标签、结果来源、线下审核人、录入人、前后状态和时间。"]}],"status":"待线下结果","primaryAction":"保存线下结果","actions":[{"id":"record-offline-result","label":"保存线下结果"}],"states":["default","loading","empty","error","permission"],"audience":"operations","prdSource":"prd/发行平台专项/开发者后台PRD/01-开发者平台、厂商与游戏资料PRD.md","prdHeading":"游戏资料与上架线下结果录入页"},"P02-01":{"audience":"developer","summary":"在同一 Game 上下文内通过“商品与供给”“Key 批次”“渠道 API”“接口说明”四个任务 Tab，查看两条 Key 链的商品、授权、库存摘要和可操作入口。","status":"授权正常／供给异常","primaryAction":"进入 Key 批次","cdkeySelfService":{"tabs":["商品与供给","Key 批次","渠道 API","接口说明"],"authorization":{"status":"授权正常","remainingQuota":8000,"channels":["渠道 A","渠道 B"],"pausedReason":"—","scope":"示例厂商 × 首款签约游戏 × SKU-DEMO-001"},"keySources":[{"id":"gamehub_generated","label":"盖世平台 Key","rule":"由盖世兑换服务校验并授予已配置权益"},{"id":"external_imported","label":"外部平台 Key","rule":"仅受控导入或供应商 API 同步，盖世不生成"}],"keyBatches":[{"batchId":"KEY-20260902-001","name":"渠道 A 首发批次","source":"盖世平台 Key","quantity":2000,"allocated":640,"remaining":1360,"channel":"渠道 A","status":"可用","download":"明文已下载"}],"credentials":[{"name":"渠道 A 正式凭据","clientId":"gh_demo_channel_a","secretMask":"••••••••9K7Q","secretHint":"末四位 9K7Q","scope":"首款签约游戏 / SKU-DEMO-001","expiresAt":"2026-12-31 23:59","status":"正常","lastCalledAt":"2026-09-02 10:18"}],"apiDocs":{"auth":"client_id + HMAC-SHA256；时间戳、随机数和签名放入请求头，Secret 不进入 URL。","idempotency":"同一 request_id 返回同一分配结果，不重复扣 业务字段","items":["导入结果只写入外部 Key 账本；盖世不生成外部 Key，页面不提供普通明文粘贴。","受控导入记录 external_key_batch_id、交付方、外部平台、版本、区域、数量、文件哈希、加密方式和接收人；不得在普通表单粘贴明文 Key。","校验包含格式、空值、批内重复、跨批重复、外部平台、区域、SKU、已交付历史和恶意公式／文件类型；结果分通过、失败和重复数量。","部分失败时只有通过校验且成功原子写入的 Key 进入可用库存；失败明细通过受控文件返回，不在页面展示明文。"]},{"title":"交互与动作","items":["受控导入携带 action_id；重复提交同一文件哈希／外部批次号返回原结果，不重复入库。","导入过程中断时批次保持校验中或失败，不得把未提交记录计入库存；重试先查询原动作结果。","停用批次只阻止可用 Key 新预留；已预留按订单状态释放或交付，已交付不变。作废与替换须逐码留痕。"]},{"title":"结果与边界","items":["生成 external_key_batch_id 和独立外部库存记录；可用 Key 可被平台订单预留／交付，失败 Key 不入账。","Key 原文加密存储，解密仅发生在授权履约路径；明文、解密密钥、供应商 Secret 不进入页面、导出、埋点、Fixture、普通日志或截图。"]}],"states":["default","loading","empty","error","permission","unlinked","configured","saleable","stopped","invalidated"],"prdSource":"prd/发行平台专项/开发者后台PRD/02-游戏商品与CDKEY供给管理PRD.md","prdHeading":"外部 Key 入站供给配置页"},"P02-05":{"audience":"operations","summary":"平台开通盖世 Key 计划后，发行方自助创建批次、受控下载，并管理渠道 API 凭据、分配、交付确认和结果恢复。","status":"计划已启用","primaryAction":"创建盖世 Key 批次","sections":[{"title":"页面目标与场景","items":["平台开通盖世 Key 计划后，发行方自助创建批次、受控下载，并管理渠道 API 凭据、分配、交付确认和结果恢复。","盖世直接发行游戏需要线下渠道发码或系统对接时，发行方在授权范围内完成供给，不必逐批找运营。","SKU 为盖世直接发行且绑定正常 APPID；gamehub_key_program_id 已启用；用途、渠道、区域、配额和有效期在预授权范围内。"]},{"title":"展示与业务字段","items":["发行方只在预授权计划内自助；平台控制范围和启停，盖世兑换服务负责 Key 生成、渠道交付状态和权益授予。Key 来源枚举固定为 gamehub_generated＝盖世兑换服务生成的盖世平台 Key，external_imported＝外部平台或供应商提供并受控导入的 Key；盖世不得生成 Steam、Epic、GOG 等外部平台 Key。","批次字段包含 gamehub_key_batch_id、名称、用途、channel_id、区域、数量、有效期、批次状态、可用／分配待确认／已交付／已兑换数量和受控下载状态。","凭据列表显示名称、channel_id、client_id、Secret 末四位、Scope、配额、有效期、最近调用和状态；完整 client_secret 只在创建／轮换成功时展示一次。","接口说明展示正式版本、请求／响应、HMAC 签名、时间戳与随机数、防重放、request_id 幂等、限流、分配／查询／确认、错误码和响应丢失恢复；示例不得包含生产 Secret、真实 Key 或真实用户数据。"]},{"title":"交互与动作","items":["发行方创建批次时提交名称、用途、渠道、区域、数量和有效期；服务端按计划原子校验并扣减可生成配额。生成失败不产生半批次、不扣配额。","受控批次下载完成后，文件内 Key 直接进入“已交付”且不可再次展示；下载响应未完成时可用同一 action_id 查询并恢复原下载任务，系统不得重新生成一批 Key。成功后遗失只能作废未兑换 Key 并新建批次。","渠道凭据支持创建、轮换、暂停、恢复和撤销；Scope 不得超出计划。暂停拒绝新分配；撤销不可恢复，但不反向改写历史分配与兑换。","渠道按 channel_id + request_id 调用分配接口；内容一致时在幂等     const requestedState = query.get('state');

    if (role !== route.role) state = 'permission';
    return { route, role, state };
  };

    return false;
  };

  const bindInteractions = ({ route, role, state }) => {
    const routeSelect = root.querySelector('[data-review-route]');
    const roleSelect = root.querySelector('[data-review-role]');
    const stateSelect = root.querySelector('[data-review-state]');
    routeSelect?.addEventListener('change', event => navigate({ routeId: event.target.value, role, state: 'default' }));
    roleSelect?.addEventListener('change', event => navigate({ routeId: route.id, role: event.target.value, state: 'default' }));
    stateSelect?.addEventListener('change', event => navigate({ routeId: route.id, role, state: event.target.value }));

    root.querySelectorAll('[data-demo-action]').forEach(control => control.addEventListener('click', event => {
      const action = event.currentTarget.dataset.demoAction;
      if (!action || event.currentTarget.disabled) return;
      if (action === 'reset-demo') { location.reload(); return; }
      if (action === 'gamehub-login' || action === 'password-login') {
        const showQr = action === 'gamehub-login';
        const password = root.querySelector('[data-password-login]');
        const qr = root.querySelector('[data-gamehub-qr]');
        if (password) password.hidden = showQr;
        if (qr) qr.hidden = !showQr;
        (showQr ? qr?.querySelector('[data-demo-action="confirm-gamehub-login"]') : password?.querySelector('input'))?.focus();
        return;
      }
      if (action === 'refresh-qr') {
        const status = root.querySelector('[data-qr-status]');
        const countdown = root.querySelector('[data-qr-countdown]');
        if (status) status.textContent = '二维码已刷新，请在盖世游戏中确认授权';
        if (countdown) countdown.textContent = '02:00';
        resultMessage(route.id, '二维码已刷新', '旧授权请求立即失效，新请求仍绑定当前浏览器会话。', 'info');
        return;
      }
      if (action === 'confirm-gamehub-login') {
        const status = root.querySelector('[data-qr-status]');
        if (status) status.textContent = '已扫码并授权成功，正在创建独立平台账号';
        resultMessage(route.id, '盖世授权成功', '首次授权已原子创建独立 account_id；下一步提交开发者注册资料。');
        setTimeout(() => navigate({ routeId: 'P01-03', role: 'developer', state: 'default' }), 180);
        return;
      }
      if (action === 'forgot-password') { resultMessage(route.id, '已提交密码找回', '无论账号是否存在均返回相同结果；请检查已验证邮箱。', 'info'); return; }
      if (action === 'open-help') { toggleHelp(true); return; }
      if (action === 'close-help') { toggleHelp(false); return; }
      if (action === 'toggle-faq') {
        const answer = event.currentTarget.nextElementSibling;
        const expanded = event.currentTarget.getAttribute('aria-expanded') === 'true';
        event.currentTarget.setAttribute('aria-expanded', String(!expanded));
        const mark = event.currentTarget.querySelector('[aria-hidden="true"]');
        if (mark) mark.textContent = expanded ? '＋' : '−';
        if (answer) answer.hidden = expanded;
        return;
      }
      if (action === 'cdkey-tab') {
        setCdkeyTab(route.id, Number(event.currentTarget.dataset.tabIndex));
        return;
      }
      const cdkeyRestriction = {
        'review-quota-exceeded': { reason: '剩余配额不足，当前申请需要 2000 个 Key。', quota: '0', disabled: true, scenario: 'quota-exceeded', status: '授权正常', pausedReason: '—' },
        'review-channel-denied': { reason: '渠道 A 不在当前游戏白名单内。', quota: '8000', disabled: true, scenario: 'channel-denied', status: '授权正常', pausedReason: '—' },
        'review-publishing-paused': { reason: '平台已暂停当前游戏的发行授权。', quota: '8000', disabled: true, scenario: 'publishing-paused', status: '发行暂停', pausedReason: '授权风控复核中' },
        'review-generation-failed': { reason: '下一次创建将展示生成失败且不扣减配额。', quota: '8000', disabled: false, scenario: 'generation-failed', status: '授权正常', pausedReason: '—' },
      }[action];
      if (cdkeyRestriction) {
        const frame = root.querySelector('.product-frame');
        if (frame) frame.dataset.cdkeyScenario = cdkeyRestriction.scenario;
        const quota = root.querySelector('[data-authorization-quota] .number');
        const authStatus = root.querySelector('[data-authorization-status] .status-tag');
        const pausedReason = root.querySelector('[data-authorization-paused] strong');
        if (quota) quota.textContent = cdkeyRestriction.quota;
        setStatusTag(authStatus, cdkeyRestriction.status);
        if (pausedReason) pausedReason.textContent = cdkeyRestriction.pausedReason;
        root.querySelector('[data-restriction-reason]')?.remove();
        root.querySelector('[data-cdkey-authorization]')?.insertAdjacentHTML('afterend', `<div class="result-strip" data-restriction-reason data-variant="warning"><div><strong>${c.escapeHtml(cdkeyRestriction.reason)}</strong><span>这是评审场景，不修改真实授权。</span></div><button type="button" data-restriction-help>查看帮助</button></div>`);
        root.querySelector('[data-restriction-help]')?.addEventListener('click', () => toggleHelp(true));
        setActionDisabled('create-key-batch', cdkeyRestriction.disabled);
        return;
      }
      if (action === 'create-key-batch') {
        const target = root.querySelector('[data-key-batch-result]');
        if (!target) { resultMessage(route.id, '创建 Key 批次入口已打开', '正式流程将校验计划、渠道和额度，并仅提供一次性明文下载。', 'info'); return; }
        target.innerHTML = '<div class="one-time-result" data-key-batch-generating><strong>生成中</strong><span>正在按当前授权范围校验配额并生成盖世平台 Key。</span></div>';
        setActionDisabled('create-key-batch', true);
        setTimeout(() => {
          if (root.querySelector('.product-frame')?.dataset.cdkeyScenario === 'generation-failed') {
            target.innerHTML = '<div class="result-strip" data-variant="danger"><div><strong>生成失败</strong><span>演示服务异常，未生成半批次且未扣减配额。</span></div></div>';
            setActionDisabled('create-key-batch', false);
            return;
          }
          target.innerHTML = `<div class="one-time-result" data-one-time-key-download><strong>批次生成成功</strong><span>演示下载文件：KEY-20260902-NEW.csv；有效窗口内下载失败可重试，成功后不能再次查看明文。</span><div class="form-actions">${c.button({ label: '模拟下载失败', action: 'simulate-key-download-failure' })}${c.button({ label: '模拟一次性下载成功', variant: 'primary', action: 'acknowledge-key-download' })}</div></div>`;
          target.querySelector('[data-demo-action="simulate-key-download-failure"]')?.addEventListener('click', () => {
            resultMessage(route.id, '下载失败', '一次性有效窗口仍未关闭，可在当前页面重试。', 'warning');
          });
          target.querySelector('[data-demo-action="acknowledge-key-download"]')?.addEventListener('click', clickEvent => {
            clickEvent.currentTarget.closest('[data-one-time-key-download]')?.remove();
            resultMessage(route.id, '一次性下载窗口已关闭', '再次进入只显示批次号、数量、状态和审计记录。', 'warning');
          });
          resultMessage(route.id, 'Key 批次已创建', '2000 个盖世平台 Key 已进入一次性下载窗口。');
        }, 300);
        return;
      }
      if (action === 'create-api-credential' || action === 'rotate-api-credential') {
        const target = root.querySelector('[data-credential-result]');
        if (!target) { resultMessage(route.id, '创建渠道凭据入口已打开', 'Secret 仅在创建结果中展示一次，凭据不得扩大预授权范围。', 'info'); return; }
        target.innerHTML = `<div class="one-time-result" data-one-time-secret><strong>client_secret 仅显示一次</strong><code>${c.escapeHtml(demoSecret())}</code>${c.button({ label: '我已保存', variant: 'primary', action: 'acknowledge-secret' })}</div>`;
        target.querySelector('[data-demo-action="acknowledge-secret"]')?.addEventListener('click', clickEvent => {
          clickEvent.currentTarget.closest('[data-one-time-secret]')?.remove();
          resultMessage(route.id, 'Secret 已隐藏', '后续只显示末四位；遗失时必须轮换。', 'warning');
        });
        resultMessage(route.id, action === 'create-api-credential' ? '渠道凭据已创建' : '渠道凭据已轮换', action === 'create-api-credential' ? '本次关闭后只显示末四位。' : '旧 Secret 已失效；本次关闭后只显示末四位。');
        return;
      }
      if (['pause-api-credential', 'revoke-api-credential', 'pause-key-batch', 'void-key-batch'].includes(action)) {
        updateBusinessState(route.id, { lastCdkeyAction: action }, `${action} · 仅写入当前页面内存审计`);
        const keyStatus = root.querySelector('[data-cdkey-panel="batches"] .status-tag');
        const credentialStatus = root.querySelector('[data-cdkey-panel="credentials"] .status-tag');
        if (action === 'pause-key-batch') setStatusTag(keyStatus, '已暂停');
        if (action === 'void-key-batch') setStatusTag(keyStatus, '已作废');
        if (action === 'pause-api-credential') setStatusTag(credentialStatus, '已暂停');
        if (action === 'revoke-api-credential') setStatusTag(credentialStatus, '已撤销');
        resultMessage(route.id, '状态已更新', '历史审计和已交付记录继续保留。', action.includes('revoke') || action.includes('void') ? 'danger' : 'warning');
        return;
      }
      if (action === 'api-doc-section') {
        const apiTarget = event.currentTarget.dataset.apiTarget;
        if (apiTarget) root.querySelector(`#${apiTarget}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        else resultMessage(route.id, '接口说明入口已打开', '渠道 API 使用 HMAC-SHA256、request_id 幂等与分配确认机制。', 'info');
        return;
      }
      if (action === 'filter-api-error') {
        resultMessage(route.id, `错误码：${event.currentTarget.textContent.trim()}`, '已定位对应错误说明；不发起真实请求。', 'info');
        return;
      }
      if (action === 'copy-api-example') {
        const example = root.querySelector('.code-block code')?.textContent || '';
        if (!navigator.clipboard?.writeText) {
          resultMessage(route.id, '复制失败', '当前浏览器未授予剪贴板权限，请手动选择示例文本。', 'warning');
          return;
        }
        navigator.clipboard.writeText(example)
          .then(() => resultMessage(route.id, '示例已复制', '仅写入当前浏览器剪贴板。'))
          .catch(() => resultMessage(route.id, '复制失败', '当前浏览器未授予剪贴板权限，请手动选择示例文本。', 'warning'));
        return;
      }
      if (action === 'retry-state' || action === 'default-state') {
        const allowed = routes.find(item => item.role === role) || routes.find(item => item.id === moduleConfig.defaultRoute) || routes[0];
        navigate({ routeId: state === 'permission' ? allowed.id : route.id, role, state: 'default' });
        return;
      }
      if (action === 'login') { navigate({ routeId: 'P01-02', role: 'developer', state: 'default' }); return; }
      if (action.startsWith('primary-')) {
        if (route.id === 'P04-03') {
          const cdkeyModule = modules.find(item => item.id === '02');
          if (cdkeyModule) location.href = `${cdkeyModule.output}#/P02-01?role=developer&state=default`;
          return;
        }
        const businessAction = primaryBusinessAction(route.id);
        if (businessAction && handleBusinessAction(route.id, businessAction)) return;
        const destination = primaryDestination(route.id);
        if (destination) navigate({ routeId: destination, role, state: 'default' });
        else resultMessage(route.id, '操作已记录', '当前页面的演示状态已更新，刷新后恢复初始数据。');
        return;
      }
      if (handleBusinessAction(route.id, action)) return;
      if (action === 'record-offline-result') { resultMessage(route.id, '线下结果已保存', '结果、原因、审核人、时间和提交快照已写入当前页面内存审计。'); return; }
      if (action === 'rollback-release') {
        updateBusinessState(route.id, { pointer: '0.9.0' }, '回滚历史 Build · 三组 Release Pointer 原子切换');
        resultMessage(route.id, '回滚配置已提交', '三组 OS／架构 Pointer 已切换到 0.9.0；历史 Build、Manifest 与 Chunk 均保留。', 'warning');
        return;
      }
      if (action === 'create-campaign') { resultMessage(route.id, 'Campaign 已创建', '已生成唯一 campaign_id 与 UTM 追踪链接；不触发自动广告投放。'); return; }
      if (action === 'submit-resource-request') { resultMessage(route.id, '资源需求已提交', '已生成新修订并进入处理中；该状态不代表资源承诺。', 'info'); return; }
      if (action === 'generate-export') {
        const target = root.querySelector('[data-export-result]');
        if (target) target.innerHTML = '<div class="one-time-result"><strong>聚合文件生成成功</strong><span>export_demo_001 · 120 行 · XLSX／CSV；下载地址短期有效。</span></div>';
        resultMessage(route.id, '聚合文件已生成', '文件复用 query_snapshot_demo_20260903，未包含用户、订单、设备或 Key 明文。');
        return;
      }
      if (action === 'download-sdk') { resultMessage(route.id, 'SDK 下载已准备', '演示不下载真实文件；三系统 SDK 版本和 SHA-256 校验值保持可追溯。', 'info'); return; }
      if (action === 'open-sdk-docs') { resultMessage(route.id, '接入文档入口已检查', '正式环境将打开受控 Google Docs；离线 Demo 不发起远程请求。', 'info'); return; }
      if (action === 'send-password-setup') { resultMessage(route.id, '密码设置邮件已发送', '仅向已验证邮箱发送；不会创建第二个 account_id。', 'info'); return; }
      if (action === 'save-draft') {
        const now = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
        memory.page[route.id] = { savedAt: now };
        root.querySelectorAll('[data-save-state]').forEach(node => { node.textContent = `最近保存：${now}（仅当前页面内存）`; });
        resultMessage(route.id, '草稿已保存', '不会自动保存；刷新页面后恢复 Fixture。');
        return;
      }
      if (action === 'approve') { resultMessage(route.id, '审核已通过', '结果仅用于本次演示，刷新后恢复。'); return; }
      if (action === 'reject') { resultMessage(route.id, '已驳回并记录原因', '请开发者修改后重新提交。', 'danger'); return; }
      if (action === 'start-upload') {
        memory.upload[route.id] = 'uploading';
        const bar = root.querySelector('[data-upload-progress]');
        const label = root.querySelector('[data-upload-label]');
        if (bar) bar.style.width = '82%';
        if (label) label.textContent = '上传中 82%，已完成分片正在校验';
        resultMessage(route.id, '分片上传已开始', '不会读取或上传真实文件。', 'info');
        return;
      }
      if (action === 'interrupt-upload') {
        memory.upload[route.id] = 'interrupted';
        const label = root.querySelector('[data-upload-label]');
        if (label) label.textContent = '网络中断，已完成分片保留，可继续上传';
        resultMessage(route.id, '上传已中断', '已完成分片已保留，请在页面内继续。', 'warning');
        return;
      }
      if (action === 'retry-upload') {
        memory.upload[route.id] = 'verified';
        const bar = root.querySelector('[data-upload-progress]');
        const label = root.querySelector('[data-upload-label]');
        if (bar) bar.style.width = '100%';
        if (label) label.textContent = '分片已全部上传，完整性校验通过';
        resultMessage(route.id, '继续上传完成', '包体完整性校验通过。');
        return;
      }
      if (action === 'test-pass') {
        root.querySelectorAll('.choice-card').forEach(node => node.classList.remove('is-selected'));
        event.currentTarget.closest('.choice-card')?.classList.add('is-selected');
        resultMessage(route.id, '已选择测试通过', '提交后将生成不可覆盖的历史记录。', 'info');
        return;
      }
      if (action === 'submit-test-result') { resultMessage(route.id, '测试结果已提交', '历史结果不可覆盖，开发者可查看处理记录。'); return; }
      if (action === 'schedule-release' || action === 'release-now') {
        const scheduled = action === 'schedule-release';
        root.querySelectorAll('.publish-option').forEach(node => node.classList.toggle('is-active', node.dataset.demoAction === action));
        const scheduleField = root.querySelector('[data-schedule-field]');
        const scheduleInput = scheduleField?.querySelector('input');
        scheduleField?.classList.toggle('is-disabled', !scheduled);
        if (scheduleInput) {
          scheduleInput.disabled = !scheduled;
          scheduleInput.setAttribute('aria-disabled', String(!scheduled));
          if (!scheduled) scheduleInput.value = '';
        }
        root.querySelectorAll('[data-release-submit], [data-primary-action]').forEach(control => {
          control.dataset.demoAction = action;
          const label = control.querySelector('span');
          if (label) label.textContent = scheduled ? '定时发布' : '立即发布';
        });
        resultMessage(route.id, action === 'schedule-release' ? '已选择定时发布' : '已选择立即发布', '运营发布前仍需通过全部门禁；失败时保持原线上版本。', 'warning');
        return;
      }
      if (action === 'add-target-rule') { event.currentTarget.classList.toggle('is-active'); resultMessage(route.id, '包含规则已更新', '仅使用已确认的地区、语言、设备／系统和平台行为标签。', 'info'); return; }
      if (action === 'exclude-rule') { event.currentTarget.classList.toggle('is-excluded'); resultMessage(route.id, '排除规则已更新', '规则未保存到服务端，刷新后恢复。', 'info'); return; }
      if (action === 'dashboard-range') {
        event.currentTarget.parentElement?.querySelectorAll('.gh-button').forEach(node => node.dataset.variant = node === event.currentTarget ? 'primary' : 'secondary');
        resultMessage(route.id, '时间范围已切换', '图表仍使用 T+1 聚合演示数据。', 'info');
        return;
      }
      if (action === 'tab') {
        event.currentTarget.parentElement.querySelectorAll('.tab').forEach(node => { node.classList.toggle('is-active', node === event.currentTarget); node.setAttribute('aria-selected', String(node === event.currentTarget)); });
        return;
      }
      if (action.startsWith('page-')) { resultMessage(route.id, '列表位置已记住', '页码、筛选和滚动位置只在当前页面内存中保留。', 'info'); return; }
      const destination = primaryDestination(route.id);
      if (event.currentTarget.hasAttribute('data-primary-action') && destination) { navigate({ routeId: destination, role, state: 'default' }); return; }
      resultMessage(route.id, '演示操作已完成', '此操作仅修改当前页面内存，刷新后恢复。');
    }));
  };

  const render = () => {
    const { route, role, state } = parseLocation();
    const page = fixture.pages?.[route.id] || fallbackPage(route);
    const content = namespace.templates.render({ route, page, state });
    root.innerHTML = namespace.shell.renderBusiness({ module: moduleConfig, routes, route, page, fixture, role, state, content });
    if (memory.result[route.id] && state === 'default') {
      const target = root.querySelector('[data-runtime-result]');
      if (target) target.innerHTML = c.resultStrip(memory.result[route.id]);
    }
    if (memory.page[route.id]?.savedAt) root.querySelectorAll('[data-save-state]').forEach(node => { node.textContent = `最近保存：${memory.page[route.id].savedAt}（仅当前页面内存）`; });
    applyBusinessState(route.id);
    bindInteractions({ route, role, state });
    if (route.id === 'P02-01' && state === 'default') setCdkeyTab(route.id, memory.page[route.id]?.cdkeyTab || 0, false);
  };

  addEventListener('hashchange', render);
  render();
})(window.GameHubDemo);</script></body></html>
