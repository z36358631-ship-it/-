<html lang="zh-CN">

  <style>* { box-sizing: border-box; }
:root {
  --brand: #f3b71b;
  --brand-strong: #d89200;
  --brand-soft: #fff8df;
  --ink: #172033;
  --muted: #667085;
  --line: #e4e7ec;

  --surface: #ffffff;
  --soft: #f8fafc;

  --success-soft: #ecfdf3;
  --warning: #b54708;
  --warning-soft: #fffaeb;
  --danger: #b42318;

  --info: #175cd3;

  --radius: 10px;

}
html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; }
button, input, select, textarea { font: inherit; }

.gh-user { display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.14); }

.gh-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.gh-input:focus, .gh-select:focus, .gh-textarea:focus { border-color: #d9a50e; box-shadow: 0 0 0 3px rgba(243,183,27,.15); }

.gh-link-card { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 16px; text-align: left; cursor: pointer; }

.gh-banner { border-radius: 12px; padding: 24px; background: linear-gradient(120deg, #111827, #344054); color: #fff; overflow: hidden; position: relative; }

<body>
  <div id="app"></div>
  <script>(function exposeNextDemoContext(global) {
  const STORAGE_KEY = 'gamehub.developer.next.v1';
  const seed = {
    schema_version: 1,
    vendor_id: 'VENDOR-202609-001',
    vendor_name: '星海互动科技有限公司',
    game_id: 'GAME-48291',
    app_id: 'APP-7F3A9C',
    game_name_zh: '星海远征',
    game_name_en: 'Ocean Expedition',
    first_build_uploaded: true,
    build_id: 'BUILD-20260904.3',
    qualification_status: 'unsubmitted',
    qualification_version: null,
    profile_status: 'draft',
    profile_version: 'PROFILE-001',
    release_scope_status: 'draft',
    release_scope_version: 'SCOPE-001',
    contract_status: 'effective',
    contract_version: 'CONTRACT-20260901-001',
    contract_valid_to: '2027-08-31',
    credential_status: 'active',
    messages: [],
    announcements: [],
    resources: [],
  };

  const clone = value => JSON.parse(JSON.stringify(value));
  const read = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return { ...clone(seed), ...saved };
    } catch {
      return clone(seed);
    }
  };
  const write = next => {
    const value = { ...read(), ...clone(next) };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch {}
    return value;
  };
  const emitEvent = event => {
    const current = read();
    const messages = [{
      event_id: event.event_id || `EVENT-${Date.now()}`,
      event_source: event.event_source,
      entity_id: event.entity_id,
      event_type: event.event_type,
      event_status: event.event_status,
      event_time: event.event_time || new Date().toISOString(),
      deep_link: event.deep_link || '',
      title_zh: event.title_zh,
      title_en: event.title_en,
      body_zh: event.body_zh || '',
      body_en: event.body_en || '',
      reason: event.reason || '',
      read: false,
    }, ...(current.messages || [])];
    return write({ messages });
  };
  const reset = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}

  document.addEventListener('click',event=>{const routeButton=event.target.closest('[data-route]');if(routeButton){const id=routeButton.dataset.route;if(routes[id])go(id);else if(id.startsWith('P06'))location.href=`06-游戏创建与发行资料demo.html#/${id}`;else location.href=`07-开发接入与资源中心demo.html#/${id}`;return;}const command=event.target.closest('[data-command]');if(command){event.preventDefault();document.execCommand(command.dataset.command,false,command.dataset.value||null);return;}const c=event.target.closest('[data-action]');if(!c)return;const a=c.dataset.action;if(a==='open-games'){location.href='06-游戏创建与发行资料demo.html#/P06-01';return;}if(a==='open-resources'){location.href='07-开发接入与资源中心demo.html#/P07-01';return;}if(a==='message-tab'){state.tab=c.dataset.tab;return render();}if(a==='category'){state.category=c.dataset.category;return render();}if(a==='mark-all'){const current=ctx.read();ctx.write({messages:(current.messages||[]).map(i=>({...i,read:true}))});return render();}if(a==='open-message'){const id=c.dataset.id;const current=ctx.read();ctx.write({messages:(current.messages||[]).map(i=>i.event_id===id?{...i,read:true}:i)});return go('P08-02',`id=${encodeURIComponent(id)}`);}if(a==='back-inbox')return go('P08-01');if(a==='open-deep-link'){location.href=c.dataset.link;return;}if(a==='new-announcement')return go('P08-04');if(a==='back-announcements')return go('P08-03');if(a==='edit-announcement')return go('P08-04',`id=${c.dataset.id}`);if(a==='locale'){state.locale=c.dataset.locale;return render();}if(a==='insert-image'){state.activeId=c.dataset.target;state.dialog='image';return render();}if(a==='close-dialog'){state.dialog='';return render();}if(a==='confirm-image'){state.dialog='';return showToast('图片已插入正文');}if(a==='save-announcement'){const form=document.querySelector('#announcementForm');const id=form.elements.id.value;const zh=form.elements.title_zh.value.trim();const en=form.elements.title_en.value.trim();const bodyZh=document.querySelector('[data-rich-name="body_zh"]').innerHTML;const bodyEn=document.querySelector('[data-rich-name="body_en"]').innerHTML;if(!zh||!en||!strip(bodyZh)||!strip(bodyEn))return showToast('请补全中英文标题和正文',true);const item={id,title_zh:zh,title_en:en,body_zh:bodyZh,body_en:bodyEn,status:'draft',updated:'2026-09-05 16:55',operator:'李瑜'};const index=state.announcements.findIndex(i=>i.id===id);if(index>=0)state.announcements[index]=item;else state.announcements.unshift(item);ctx.write({announcements:state.announcements});return go('P08-03');}if(a==='publish-announcement'){state.activeId=c.dataset.id;state.dialog='publish';return render();}if(a==='confirm-publish'){if(search.get('scenario')==='publish-failed'){state.dialog='';return showToast('发布失败，草稿已保留',true);}const item=state.announcements.find(i=>i.id===state.activeId);if(item){item.status='published';item.updated='2026-09-05 16:58';const eventId=`EVENT-${item.id}`;ctx.emitEvent({event_id:eventId,event_source:'system',entity_id:item.id,event_type:'announcement',event_status:'published',deep_link:`08-消息通知中心demo.html#/P08-02?id=${eventId}`,title_zh:item.title_zh,title_en:item.title_en,body_zh:strip(item.body_zh),body_en:strip(item.body_en)});ctx.write({announcements:state.announcements});}state.dialog='';return showToast('公告已发布');}if(a==='offline-announcement'){state.activeId=c.dataset.id;state.dialog='offline';return render();}if(a==='confirm-offline'){const item=state.announcements.find(i=>i.id===state.activeId);if(item)item.status='offline';ctx.write({announcements:state.announcements});state.dialog='';return showToast('公告已下线');}});
  window.addEventListener('hashchange',render);
  if(!location.hash)go('P08-01');else render();
})();</script>
