    function renderTimeline(record){return `<ol class="timeline">${record.events.slice().reverse().map(event=>`<li><strong>${esc(event.action)}</strong><span>${esc(event.actor)} · ${esc(event.at)}</span><small>${esc(event.result)}</small>${event.reason?`<p>${esc(event.reason)}</p>`:''}</li>`).join('')}</ol>`;}
    function renderDetail(){const record=getRecord(state.recordId);if(!record)return renderNotFound();const config=typeConfig[record.type];const tabs=`<nav class="detail-tabs" aria-label="详情视图"><button type="button" data-detail-tab="snapshot" class="${state.detailTab==='snapshot'?'is-active':''}">提交快照</button><button type="button" data-detail-tab="audit" class="${state.detailTab==='audit'?'is-active':''}">操作记录</button></nav>`;return `${pageHeader(record.title,`${record.id} · ${record.subtitle} · 提交于 ${record.submittedAt}`,`<button type="button" class="btn" data-back-list>返回${config.short}列表</button>${tag(record.status)}`)}${state.message?renderMessage():''}<div class="detail-grid"><div class="detail-main"><section class="card panel"><div class="summary-strip"><div><span>申请编号</span><strong>${esc(record.id)}</strong></div><div><span>资料版本</span><strong>${esc(record.version)}</strong></div><div><span>发行范围</span><strong>${esc(record.scope)}</strong></div><div><span>风险分级</span><strong>${esc(record.risk)}</strong></div></div></section><section class="card panel">${tabs}${state.detailTab==='audit'?renderTimeline(record):renderSnapshotSections(record)}</section></div><aside class="detail-side"><section class="card panel"><h2>审核处理</h2><p class="action-note">所有处理均基于当前只读快照；首个成功终态生效，重复请求不会再次写入。</p><div class="action-stack">${auditActions(record)}</div></section><section class="card panel"><h2>状态说明</h2><p class="action-note">当前状态：${esc(statusLabel(record.status))}</p><p class="action-note">${esc(record.type==='enterprise'?'企业认证结果决定发行合作权限；禁用后仍可登录查看历史结果。':record.type==='release'?'发布审核仅决定本次快照能否生效，不修改开发者原草稿。':'资质审核与发布审核独立，已失效版本不可用于新的上架申请。')}</p></section></aside></div>`;}
    function renderSnapshotPage(){const record=getRecord(state.recordId);if(!record)return renderNotFound();return `<div class="snapshot-page">${pageHeader('提交快照',`${record.id} · ${record.title}`,`<button type="button" class="btn" data-back-detail>返回申请详情</button>`)}<div class="snapshot-lock">🔒 本页展示申请方正式提交时生成的不可变快照；审核操作不会修改快照内容。</div><section class="card panel snapshot-watermark">${renderSnapshotSections(record)}</section></div>`;}
    function openDetailDrawer(recordId,tab='snapshot'){
      const record=getRecord(recordId);if(!record)return;
      if(tab==='packages'&&record.type!=='release')tab='snapshot';
      state.recordId=record.id;state.detailTab=tab;state.modal={kind:'detail',recordId:record.id};
      const tabs=`<nav class="detail-tabs" aria-label="申请详情"><button type="button" data-detail-tab="snapshot" class="${tab==='snapshot'?'is-active':''}">提交快照</button>${record.type==='release'?`<button type="button" data-detail-tab="packages" class="${tab==='packages'?'is-active':''}">PC 包体测试</button>`:''}<button type="button" data-detail-tab="audit" class="${tab==='audit'?'is-active':''}">审核记录</button></nav>`;
      const path=`审核管理 / ${typeConfig[record.type].label} / 申请详情`;
      const statusText=record.type==='enterprise'?'企业认证结果决定发行合作权限；禁用后仍可登录查看历史结果。':record.type==='release'?'本次发布须同时通过资料审核与当前修订 PC 包体测试，审核结果不修改开发者原草稿。':'资质变更与发布审核独立，已失效版本不可用于新的上架申请。';
      const content=tab==='audit'?renderTimeline(record):tab==='packages'?renderPackageTests(record):renderSnapshotSections(record);
      const body=`<header data-drawer-header><div><h2>${esc(record.title)}</h2><p>${esc(path)} · ${esc(record.id)} · 提交于 ${esc(record.submittedAt)}</p></div><div style="display:flex;align-items:center;gap:10px">${tag(record.status)}<button type="button" class="modal-close" data-modal-close aria-label="关闭">×</button></div></header><div class="modal-body" data-drawer-scroll>${state.message?renderMessage():''}<section class="card panel" style="margin-bottom:16px"><div class="summary-strip"><div><span>申请编号</span><strong>${esc(record.id)}</strong></div><div><span>资料版本</span><strong>${esc(record.version)}</strong></div><div><span>发行范围</span><strong>${esc(record.scope)}</strong></div><div><span>风险分级</span><strong>${esc(record.risk)}</strong></div></div></section><div class="drawer-status"><div><strong>当前状态：${esc(statusLabel(record.status))}</strong><span>${esc(statusText)}</span></div>${tag(record.status)}</div>${record.type==='release'?renderReleaseGate(record):''}<section class="card panel">${tabs}${content}</section></div><footer class="modal-footer" data-drawer-footer><div class="drawer-footer-actions">${auditActions(record)}</div></footer>`;
      openModal(body,false,true);
    }
    function renderNotFound(){return `${pageHeader('申请不存在','该记录可能已被移除或地址不完整。')}<button type="button" class="btn primary" data-nav="enterprise">返回企业认证审核</button>`;}
    function render(){document.getElementById('breadcrumb').innerHTML=breadcrumb();const view=document.getElementById('mainView');view.innerHTML=renderList();navActive();decorateListActions();decorateRangeControl();decoratePagination();}
    function route(){const next=parseHash();Object.assign(state,next);state.recordId='';state.mode='';state.message=null;state.modal=null;closeModal(true);render();if(state.pendingRecordId){const id=state.pendingRecordId,tab=state.pendingDetailTab||'snapshot';state.pendingRecordId='';state.pendingDetailTab='';openDetailDrawer(id,tab);}}
    function openModal(content,wide=false,drawer=false){const root=document.getElementById('modalRoot');root.hidden=false;root.classList.toggle('is-drawer',drawer);root.innerHTML=`<section class="modal${wide?' wide':''}${drawer?' drawer':''}" role="dialog" aria-modal="true">${content}</section>`;root.querySelector('textarea')?.focus();}
    function closeModal(force=false){const current=state.modal;if(!force&&current&&current.kind!=='detail'&&current.parentRecordId){openDetailDrawer(current.parentRecordId,current.returnTab||state.detailTab);return;}const root=document.getElementById('modalRoot');root.hidden=true;root.classList.remove('is-drawer');root.innerHTML='';state.modal=null;state.recordId='';state.busy=false;}
    const actionSpec=(record,action)=>{
      const needsReason=['supplement','reject','disable','offline','invalidate'].includes(action);
      const needsBasis=['restore','relist'].includes(action);
      const title=action==='retry'?'重试写入审核结果':actionName[action]||action;
      const description=action==='claim'?'领取后申请进入审核中，其他审核员可看到当前处理人。':action==='approve'?'通过后当前提交快照进入已通过终态。':action==='supplement'?'申请方补充后需重新提交，当前快照继续保留。':action==='reject'?'拒绝后当前申请终止，原因会展示给申请方。':action==='disable'?'禁用后立即收回企业发行合作权限。':action==='offline'?'下架后商店停止新购，已购权益不受本 Demo 变更。':action==='invalidate'?'失效后该资质版本不可用于新的发布申请。':action==='restore'?'恢复前请确认企业异常状态已经解除。':action==='relist'?'恢复前请确认原下架问题已处理完毕。':'系统将以同一请求编号重试，成功前不改变业务状态。';
      return{title,description,needsReason,needsBasis};
    };
    function showActionModal(action,recordId=state.recordId,returnToDetail=true){const record=getRecord(recordId);if(!record)return;state.recordId=record.id;const spec=actionSpec(record,action);state.modal={kind:'action',action,recordId:record.id,parentRecordId:returnToDetail?record.id:'',returnTab:state.detailTab};openModal(`<header><div><h2>${esc(spec.title)}</h2><p>${esc(record.id)} · 当前状态 ${esc(statusLabel(record.status))}</p></div><button type="button" class="modal-close" data-modal-close aria-label="关闭">×</button></header><div class="modal-body"><p class="action-note">${esc(spec.description)}</p>${spec.needsReason||spec.needsBasis?`<label class="field">${spec.needsReason?'处理原因':'恢复依据'}<textarea class="form-textarea" maxlength="500" data-action-reason placeholder="请填写清晰、可追溯的${spec.needsReason?'原因':'复核依据'}"></textarea></label><p class="form-error" data-modal-error></p>`:''}</div><footer class="modal-footer"><button type="button" class="btn" data-modal-close>取消</button><button type="button" class="btn ${['reject','disable','offline','invalidate'].includes(action)?'danger':'primary'}" data-action-confirm>确认${esc(spec.title)}</button></footer>`);}
    function nextStatus(action,record){return({claim:'reviewing',approve:'approved',supplement:'supplement',reject:'rejected',disable:'disabled',restore:'approved',offline:'offline',relist:'approved',invalidate:'invalid',retry:'approved'})[action]||record.status;}
    function actionAllowed(record,action){if(record.retry)return action==='retry';if(record.status==='pending'&&action==='claim')return true;if(['pending','reviewing'].includes(record.status)){if(action==='approve'&&record.type==='release'&&!releaseGate(record).passed)return false;return['approve','reject','supplement'].includes(action);}if(record.status==='approved')return record.type==='enterprise'?action==='disable':record.type==='release'?action==='offline':action==='invalidate';if(record.status==='disabled'&&record.type==='enterprise')return action==='restore';if(record.status==='offline'&&record.type==='release')return action==='relist';return false;}
    async function performAction(action,reason=''){
      const record=getRecord(state.recordId);if(!record||state.busy)return;
      const returnToDetail=Boolean(state.modal?.parentRecordId);if(!actionAllowed(record,action)){closeModal(true);state.message={type:'warning',text:'申请状态已变化，重复或过期操作已忽略，操作记录保持不变。'};render();if(returnToDetail)openDetailDrawer(record.id,'audit');return;}
      const spec=actionSpec(record,action),trimmed=String(reason||'').trim();
      if((spec.needsReason||spec.needsBasis)&&!trimmed){const error=document.querySelector('[data-modal-error]');if(error)error.textContent=`请填写${spec.needsReason?'处理原因':'恢复依据'}。`;return;}
      const requestKey=record.retry?.requestId||`${record.id}:${record.version}:${action}:${record.status}`;
      if(state.handled.has(requestKey)){closeModal(true);state.message={type:'warning',text:'重复请求已忽略，申请状态和操作记录保持不变。'};render();if(returnToDetail)openDetailDrawer(record.id,'audit');return;}
      state.busy=true;const confirm=document.querySelector('[data-action-confirm]');if(confirm){confirm.disabled=true;confirm.textContent='处理中…';}
      await new Promise(resolve=>setTimeout(resolve,420));
      const before=record.status;state.handled.add(requestKey);record.status=nextStatus(action,record);record.events.push({at:nowText(),actor:'运营审核员 李然',action:actionName[action]||action,result:`${statusLabel(before)} → ${statusLabel(record.status)}`,reason:trimmed||undefined,requestId:requestKey});record.retry=null;closeModal(true);state.message={type:'',text:`${actionName[action]||'处理'}已完成，业务状态已更新为“${statusLabel(record.status)}”。`};state.detailTab='audit';render();if(returnToDetail)openDetailDrawer(record.id,'audit');
    }
    function getPackage(recordId,packageId){const record=getRecord(recordId);return{record,item:record?.packages?.find(pkg=>pkg.id===packageId)};}
    function packageTransitionAllowed(record,item,status){
      if(!record||!item||!['pending','reviewing'].includes(record.status)||!item.current||item.parseStatus!=='parsed')return false;
      return item.testStatus==='pending'?status==='testing':item.testStatus==='testing'?['passed','failed'].includes(status):false;
    }
    function updatePackageStatus(recordId,packageId,status,reason='',attachments=[]){
      const{record,item}=getPackage(recordId,packageId);if(!packageTransitionAllowed(record,item,status))return false;
      const normalizedReason=String(reason||'').trim();if(status==='failed'&&!normalizedReason)return false;
      const before=item.testStatus,at=nowText(),action=status==='testing'?'开始测试':status==='passed'?'标记测试通过':'标记测试不通过';
      item.testStatus=status;item.tester='测试员 陈桥';item.updatedAt=at;item.reason=status==='failed'?normalizedReason:'';item.attachments=status==='failed'?attachments:[];
      item.history.push({at,actor:'测试员 陈桥',action,result:`${packageStatusLabel[before]} → ${packageStatusLabel[status]}`,reason:normalizedReason||undefined,attachments:attachments.map(file=>file.name)});
      record.events.push({at,actor:'测试员 陈桥',action:`PC 包体 · ${item.platform} ${item.packageType} · ${action}`,result:`${item.revision} · ${packageStatusLabel[before]} → ${packageStatusLabel[status]}`,reason:normalizedReason||undefined});
      if(status==='failed'){
        const applicationBefore=record.status;
        record.status='supplement';
        record.events.push({at,actor:'系统',action:'发布申请转待补充',result:`${statusLabel(applicationBefore)} → ${statusLabel(record.status)}`,reason:`${item.platform} ${item.packageType} ${item.revision} 测试不通过，需开发者补传新包体并重新提交。`});
      }
      state.message=null;render();openDetailDrawer(record.id,'packages');
      return true;
    }
    function formatFileSize(size){if(size>=1024*1024)return`${(size/1024/1024).toFixed(1)} MB`;if(size>=1024)return`${Math.round(size/1024)} KB`;return`${size} B`;}
    function renderPackageFailureModal(){
      const draft=state.modal;if(!draft||draft.kind!=='package-fail')return;const{record,item}=getPackage(draft.recordId,draft.packageId);if(!record||!item)return;
      openModal(`<header><div><h2>标记包体测试不通过</h2><p>${esc(item.platform)} · ${esc(item.packageType)} · ${esc(item.revision)}</p></div><button type="button" class="modal-close" data-modal-close aria-label="关闭">×</button></header><div class="modal-body"><label class="field">不通过原因<textarea class="form-textarea" maxlength="500" data-package-fail-reason placeholder="请填写复现环境、操作步骤、实际结果与预期结果">${esc(draft.reason||'')}</textarea></label><p class="form-error" data-package-fail-error>${esc(draft.error||'')}</p><label class="file-upload">选择本地测试记录附件<input type="file" multiple accept=".png,.jpg,.jpeg,.pdf,.txt,.log,.zip" data-package-file aria-label="添加测试记录附件"></label>${draft.attachments.length?`<div class="draft-files">${draft.attachments.map((file,index)=>`<div class="draft-file"><span>${esc(file.name)} · ${esc(file.size)}</span><button type="button" data-package-attachment-remove="${index}" aria-label="移除附件 ${esc(file.name)}">移除</button></div>`).join('')}</div>`:''}</div><footer class="modal-footer"><button type="button" class="btn" data-modal-close>取消</button><button type="button" class="btn danger" data-package-fail-confirm>确认不通过</button></footer>`);
    }
    function showPackageFailModal(recordId,packageId){const{record,item}=getPackage(recordId,packageId);if(!packageTransitionAllowed(record,item,'failed'))return;state.recordId=record.id;state.modal={kind:'package-fail',recordId:record.id,packageId:item.id,parentRecordId:record.id,returnTab:'packages',reason:'',error:'',attachments:[]};renderPackageFailureModal();}
    function confirmPackageFailure(){const draft=state.modal;if(!draft||draft.kind!=='package-fail')return;draft.reason=document.querySelector('[data-package-fail-reason]')?.value||'';if(!draft.reason.trim()){draft.error='请填写不通过原因。';const error=document.querySelector('[data-package-fail-error]');if(error)error.textContent=draft.error;return;}const{record,item}=getPackage(draft.recordId,draft.packageId);if(!record||!item)return;const files=draft.attachments.slice(),reason=draft.reason.trim();closeModal(true);updatePackageStatus(record.id,item.id,'failed',reason,files);}
    function showAttachment(token){const [recordId,sectionIndex,fileIndex]=token.split(':');const record=getRecord(recordId),section=record?.snapshot[Number(sectionIndex)],file=section?.attachments?.[Number(fileIndex)];if(!record||!file)return;const[name,ext]=file;state.modal={kind:'attachment',parentRecordId:record.id,returnTab:'snapshot'};openModal(`<header><div><h2>${esc(name)}</h2><p>审核管理 / ${esc(typeConfig[record.type].label)} / 申请详情 / 提交快照 / 附件</p></div><button type="button" class="modal-close" data-modal-close aria-label="关闭">×</button></header><div class="modal-body"><div class="document-preview"><div class="document-paper"><span class="seal">资料专用章</span><h3>${esc(name)}</h3><p>申请编号：${esc(record.id)}</p><p>申请主体：${esc(record.title)}</p><p>资料版本：${esc(record.version)}</p><p>本文件为申请方正式提交时的只读审核材料，仅用于当前业务申请核验。</p><p>文件内容示意：主体信息、签署信息、有效期与适用范围均已包含在提交快照中。</p></div><aside class="document-meta"><dl><div><dt>文件名</dt><dd>${esc(record.id)}-${Number(sectionIndex)+1}-${Number(fileIndex)+1}.${esc(ext.toLowerCase())}</dd></div><div><dt>文件类型</dt><dd>${esc(ext)}</dd></div><div><dt>快照版本</dt><dd>${esc(record.version)}</dd></div><div><dt>访问权限</dt><dd>当前审核人员只读</dd></div><div><dt>完整性校验</dt><dd>SHA-256 已校验</dd></div></dl></aside></div></div><footer class="modal-footer"><button type="button" class="btn primary" data-modal-close>关闭预览</button></footer>`,true);}
    document.addEventListener('click',event=>{
      const rangeTrigger=event.target.closest('[data-range-trigger]');if(rangeTrigger){collectFilters();openRangePopover(rangeTrigger);return;}
      const rangePreset=event.target.closest('[data-range-preset]');if(rangePreset){applyRangePreset(rangePreset.dataset.rangePreset);return;}
      if(event.target.closest('[data-range-clear]')){state.filters[state.type]={...(state.filters[state.type]||{}),start:'',end:''};resetPage();closeRangePopover();render();return;}
      if(event.target.closest('[data-range-cancel]')){closeRangePopover();return;}
      if(event.target.closest('[data-range-apply]')){const start=document.querySelector('[data-range-start]')?.value||'',end=document.querySelector('[data-range-end]')?.value||'';if(start&&end&&localTimestamp(start)>localTimestamp(end)){document.querySelector('[data-range-error]').textContent='开始时间不能晚于结束时间。';return;}state.filters[state.type]={...(state.filters[state.type]||{}),start,end};resetPage();closeRangePopover();render();return;}
      const nav=event.target.closest('[data-nav]');if(nav){setHash(nav.dataset.nav);return;}
      const crumb=event.target.closest('[data-crumb]');if(crumb){setHash(crumb.dataset.crumb);return;}
      const open=event.target.closest('[data-open]');if(open){const record=getRecord(open.dataset.open);if(record){if(state.page==='list'&&state.type===record.type)openDetailDrawer(record.id,'snapshot');else{state.pendingRecordId=record.id;state.pendingDetailTab='snapshot';setHash(record.type);}}return;}
      const snapshot=event.target.closest('[data-snapshot]');if(snapshot){const record=getRecord(snapshot.dataset.snapshot);if(record)openDetailDrawer(record.id,'snapshot');return;}
      const listAction=event.target.closest('[data-list-action]');if(listAction){showActionModal(listAction.dataset.listAction,listAction.dataset.recordId,false);return;}
      const tab=event.target.closest('[data-detail-tab]');if(tab){openDetailDrawer(state.recordId,tab.dataset.detailTab);return;}
      const attachment=event.target.closest('[data-attachment]');if(attachment){showAttachment(attachment.dataset.attachment);return;}
      const packageAction=event.target.closest('[data-package-action]');if(packageAction){const actionName=packageAction.dataset.packageAction,recordId=packageAction.dataset.recordId,packageId=packageAction.dataset.packageId;if(actionName==='fail')showPackageFailModal(recordId,packageId);else updatePackageStatus(recordId,packageId,actionName==='start'?'testing':'passed');return;}
      const removePackageAttachment=event.target.closest('[data-package-attachment-remove]');if(removePackageAttachment&&state.modal?.kind==='package-fail'){state.modal.reason=document.querySelector('[data-package-fail-reason]')?.value||'';state.modal.attachments.splice(Number(removePackageAttachment.dataset.packageAttachmentRemove),1);state.modal.error='';renderPackageFailureModal();return;}
      if(event.target.closest('[data-package-fail-confirm]')){confirmPackageFailure();return;}
      const action=event.target.closest('[data-action]');if(action){showActionModal(action.dataset.action);return;}
      if(event.target.closest('[data-modal-close]')||event.target.id==='modalRoot'){closeModal();return;}
      if(event.target.closest('[data-action-confirm]')){performAction(state.modal?.action,document.querySelector('[data-action-reason]')?.value||'');return;}
      if(event.target.closest('[data-message-close]')){state.message=null;render();return;}
      const pageButton=event.target.closest('[data-page]');if(pageButton&&!pageButton.disabled){state.pagination[paginationKey()]=Number(pageButton.dataset.page);render();return;}
      if(event.target.closest('[data-filter-reset]')){state.filters[state.type]={};resetPage();render();return;}
      if(event.target.closest('[data-filter-submit]')){collectFilters();resetPage();render();return;}
      if(event.target.closest('[data-list-refresh]')){collectFilters();state.message=null;render();return;}
      if(!document.getElementById('rangePopover').hidden&&!event.target.closest('#rangePopover'))closeRangePopover();
    });
    document.addEventListener('change',event=>{if(event.target.matches('[data-global-region]')){closeModal(true);closeRangePopover();state.region=event.target.value;state.message=null;render();return;}if(event.target.matches('[data-package-file]')&&state.modal?.kind==='package-fail'){state.modal.reason=document.querySelector('[data-package-fail-reason]')?.value||'';const additions=[...event.target.files].map(file=>({name:file.name,size:formatFileSize(file.size),type:file.type||'本地文件'}));state.modal.attachments=[...state.modal.attachments,...additions].filter((file,index,array)=>array.findIndex(candidate=>candidate.name===file.name&&candidate.size===file.size)===index);state.modal.error='';renderPackageFailureModal();}});
    function collectFilters(){const current={};document.querySelectorAll('[data-filter]').forEach(input=>current[input.dataset.filter]=input.value);state.filters[state.type]=current;}
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!document.getElementById('rangePopover').hidden){closeRangePopover();return;}if(event.key==='Escape'&&!document.getElementById('modalRoot').hidden)closeModal();if(event.key==='Enter'&&event.target.matches('[data-filter="keyword"]')){collectFilters();resetPage();render();}});
    window.addEventListener('hashchange',route);
    window.AdminReviewDemo={records,typeConfig,statusMeta,getRecord,performAction,releaseGate,updatePackageStatus,setHash,state};
    if(!location.hash)location.hash='#/enterprise';else route();
  })();
  </script>
