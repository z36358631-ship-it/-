<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>游戏创建与发行资料｜盖世游戏开发者平台</title>
  <style>* { box-sizing: border-box; }
:root {
  --brand: #f3b71b;
  --brand-strong: #d89200;
  --brand-soft: #fff8df;
  --ink: #172033;
  --muted: #667085;
  --line: #e4e7ec;
  --line-strong: #d0d5dd;
  --page: #f5f7fa;
  --surface: #ffffff;
  --soft: #f8fafc;
  --success: #14804a;
  --success-soft: #ecfdf3;
  --warning: #b54708;
  --warning-soft: #fffaeb;
  --danger: #b42318;
  --danger-soft: #fef3f2;
  --info: #175cd3;
  --info-soft: #eff8ff;
  --radius: 10px;
  --shadow: 0 10px 30px rgba(21, 31, 51, .08);
  --font: "Microsoft YaHei UI", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: var(--info); text-decoration: none; }
.gh-app { min-height: 100vh; }
.gh-topbar { height: 64px; padding: 0 28px; background: #111827; color: #fff; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
.gh-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .02em; }
.gh-brand svg { width: 34px; height: 34px; }
.gh-brand small { display: block; margin-top: 2px; color: #98a2b3; font-size: 11px; font-weight: 500; }
.gh-top-actions { display: flex; align-items: center; gap: 10px; }
.gh-top-link { border: 0; background: transparent; color: #d0d5dd; cursor: pointer; padding: 8px 10px; border-radius: 7px; }
.gh-top-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.gh-user { display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.14); }
.gh-avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(135deg, var(--brand), #ffdd75); color: #523600; font-weight: 800; }
.gh-user-copy strong, .gh-user-copy small { display: block; }
.gh-user-copy small { margin-top: 2px; color: #98a2b3; font-size: 11px; }
.gh-layout { min-height: calc(100vh - 64px); display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.gh-sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px; }
.gh-sidebar-label { padding: 0 12px 10px; color: #98a2b3; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.gh-nav { display: grid; gap: 4px; }
.gh-nav button { width: 100%; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 11px; padding: 11px 12px; color: #475467; cursor: pointer; text-align: left; }
.gh-nav button:hover { background: #f9fafb; color: var(--ink); }
.gh-nav button.is-active { background: var(--brand-soft); color: #9a6700; font-weight: 700; }
.gh-nav-icon { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #d9dde5; border-radius: 6px; font-size: 11px; font-weight: 800; }
.gh-nav button.is-active .gh-nav-icon { border-color: #efc85e; background: #fff6cf; }
.gh-main { min-width: 0; padding: 30px 34px 56px; }
.gh-content { width: min(1180px, 100%); margin: 0 auto; }
.gh-breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #98a2b3; font-size: 13px; margin-bottom: 18px; }
.gh-breadcrumb button { border: 0; background: none; color: var(--info); padding: 0; cursor: pointer; }
.gh-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
.gh-page-head h1 { margin: 0; font-size: 28px; line-height: 1.3; letter-spacing: -.02em; }
.gh-page-head p { margin: 7px 0 0; color: var(--muted); line-height: 1.7; }
.gh-head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.gh-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(16,24,40,.02); overflow: hidden; }
.gh-card + .gh-card { margin-top: 18px; }
.gh-card-head { min-height: 62px; padding: 17px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.gh-card-head h2 { margin: 0; font-size: 16px; }
.gh-card-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.gh-card-body { padding: 20px; }
.gh-grid-2, .gh-grid-3, .gh-grid-4 { display: grid; gap: 16px; }
.gh-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gh-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gh-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.gh-metric { padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.gh-metric span { color: var(--muted); font-size: 12px; }
.gh-metric strong { display: block; margin: 12px 0 6px; font-size: 24px; font-variant-numeric: tabular-nums; }
.gh-metric small { color: #98a2b3; }
.gh-button { min-height: 38px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 8px 15px; font-weight: 650; cursor: pointer; transition: .16s ease; }
.gh-button:hover { border-color: #98a2b3; background: #f9fafb; }
.gh-button.primary { border-color: var(--brand); background: var(--brand); color: #332300; }
.gh-button.primary:hover { border-color: var(--brand-strong); background: #e9aa0a; }
.gh-button.danger { border-color: #fda29b; color: var(--danger); background: #fff; }
.gh-button.link { border-color: transparent; background: transparent; color: var(--info); padding-inline: 6px; }
.gh-button:disabled { border-color: var(--line); background: #f2f4f7; color: #98a2b3; cursor: not-allowed; }
.gh-tag { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; border-radius: 999px; padding: 3px 9px; background: #f2f4f7; color: #475467; font-size: 12px; white-space: nowrap; }
.gh-tag.success { background: var(--success-soft); color: var(--success); }
.gh-tag.warning { background: var(--warning-soft); color: var(--warning); }
.gh-tag.danger { background: var(--danger-soft); color: var(--danger); }
.gh-tag.info { background: var(--info-soft); color: var(--info); }
.gh-notice { margin-bottom: 18px; padding: 14px 16px; border: 1px solid #b2ddff; background: var(--info-soft); border-radius: 9px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; color: #1849a9; }
.gh-notice.warning { border-color: #fedf89; background: var(--warning-soft); color: #93370d; }
.gh-notice.danger { border-color: #fecdca; background: var(--danger-soft); color: #912018; }
.gh-notice strong { display: block; margin-bottom: 4px; }
.gh-notice p { margin: 0; line-height: 1.65; }
.gh-tabs { display: flex; align-items: center; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.gh-tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 12px 1px 11px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.gh-tabs button.is-active { color: var(--ink); border-bottom-color: var(--brand); font-weight: 700; }
.gh-field { min-width: 0; }
.gh-field.wide { grid-column: 1 / -1; }
.gh-field label, .gh-label { display: block; margin-bottom: 8px; color: #344054; font-weight: 650; }
.gh-required::after { content: " *"; color: var(--danger); }
.gh-input, .gh-select, .gh-textarea { width: 100%; min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 9px 11px; color: var(--ink); outline: none; }
.gh-input:focus, .gh-select:focus, .gh-textarea:focus { border-color: #d9a50e; box-shadow: 0 0 0 3px rgba(243,183,27,.15); }
.gh-textarea { min-height: 112px; resize: vertical; line-height: 1.7; }
.gh-hint { display: block; margin-top: 6px; color: #98a2b3; font-size: 12px; line-height: 1.5; }
.gh-error { min-height: 18px; margin-top: 5px; color: var(--danger); font-size: 12px; }
.gh-checks { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.gh-checks label { display: flex; align-items: center; gap: 7px; color: #475467; font-weight: 500; }
.gh-upload { position: relative; min-height: 104px; border: 1px dashed #b8c0cc; border-radius: 8px; background: #fbfcfd; display: grid; place-items: center; padding: 16px; color: var(--muted); text-align: center; cursor: pointer; }
.gh-upload:hover { border-color: #d9a50e; background: #fffdf6; }
.gh-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.gh-form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 20px; margin-top: 20px; border-top: 1px solid var(--line); }
.gh-table-wrap { overflow-x: auto; }
.gh-table { width: 100%; border-collapse: collapse; min-width: 760px; }
.gh-table th { height: 44px; padding: 10px 14px; background: #f9fafb; color: #667085; font-size: 12px; text-align: left; font-weight: 700; border-bottom: 1px solid var(--line); }
.gh-table td { padding: 14px; border-bottom: 1px solid #eef0f3; color: #344054; vertical-align: middle; }
.gh-table tbody tr:last-child td { border-bottom: 0; }
.gh-table tbody tr:hover { background: #fcfcfd; }
.gh-table strong, .gh-table small { display: block; }
.gh-table small { margin-top: 4px; color: #98a2b3; }
.gh-row-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.gh-empty { padding: 62px 20px; text-align: center; color: var(--muted); }
.gh-empty-mark { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 16px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px; }
.gh-readonly { padding: 13px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.gh-readonly span, .gh-readonly strong, .gh-readonly small { display: block; }
.gh-readonly span { color: var(--muted); font-size: 12px; }
.gh-readonly strong { margin: 8px 0 4px; color: #344054; word-break: break-word; }
.gh-readonly small { color: #98a2b3; line-height: 1.5; }
.gh-code { border-radius: 8px; background: #101828; color: #d1fadf; padding: 14px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; overflow-x: auto; }
.gh-filter { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.gh-filter .gh-input { width: min(300px, 100%); }
.gh-filter .gh-select { width: 160px; }
.gh-pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.gh-dialog-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(16,24,40,.48); backdrop-filter: blur(2px); }
.gh-dialog { width: min(560px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: #fff; border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.gh-dialog.wide { width: min(820px, 100%); }
.gh-dialog-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 18px; }
.gh-dialog-head h2 { margin: 0; font-size: 19px; }
.gh-dialog-head p { margin: 6px 0 0; color: var(--muted); line-height: 1.6; }
.gh-dialog-close { width: 32px; height: 32px; border: 0; border-radius: 7px; background: #f2f4f7; cursor: pointer; font-size: 21px; color: var(--muted); }
.gh-dialog-body { padding: 20px 22px; overflow-y: auto; }
.gh-dialog-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
.gh-toast { position: fixed; top: 82px; left: 50%; z-index: 100; transform: translateX(-50%); max-width: min(480px, calc(100vw - 28px)); padding: 11px 16px; border-radius: 8px; background: #101828; color: #fff; box-shadow: var(--shadow); }
.gh-toast.error { background: #7a271a; }
.gh-kv { display: grid; grid-template-columns: 160px minmax(0,1fr); border-bottom: 1px solid #eef0f3; }
.gh-kv:last-child { border-bottom: 0; }
.gh-kv > span { padding: 13px 14px; background: #f9fafb; color: var(--muted); }
.gh-kv > strong, .gh-kv > div { padding: 13px 16px; font-weight: 500; min-width: 0; }
.gh-split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.gh-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #98a2b3; display: inline-block; }
.gh-status-dot.unread { background: #f0b21b; box-shadow: 0 0 0 4px #fff6d6; }
.gh-link-card { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 16px; text-align: left; cursor: pointer; }
.gh-link-card:hover { border-color: #e5bc49; box-shadow: 0 4px 14px rgba(21,31,51,.06); }
.gh-link-card strong, .gh-link-card small { display: block; }
.gh-link-card small { margin-top: 7px; color: var(--muted); line-height: 1.55; }
.gh-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.gh-banner { border-radius: 12px; padding: 24px; background: linear-gradient(120deg, #111827, #344054); color: #fff; overflow: hidden; position: relative; }
.gh-banner::after { content: ""; position: absolute; width: 260px; height: 260px; right: -50px; top: -130px; border-radius: 50%; background: radial-gradient(circle, rgba(255,211,82,.36), rgba(255,211,82,0)); }
.gh-banner h2 { margin: 0 0 8px; font-size: 23px; }
.gh-banner p { margin: 0; color: #d0d5dd; line-height: 1.7; max-width: 720px; }
.gh-rich-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 8px 8px 0 0; background: #f9fafb; }
.gh-rich-toolbar button { min-width: 32px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
.gh-rich-editor { min-height: 190px; border: 1px solid var(--line-strong); border-radius: 0 0 8px 8px; padding: 13px; line-height: 1.75; outline: none; }

@media (max-width: 960px) {
  .gh-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gh-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gh-split { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .gh-topbar { height: 58px; padding: 0 14px; }
  .gh-brand span { font-size: 13px; }
  .gh-brand small, .gh-user-copy, .gh-top-link.optional { display: none; }
  .gh-layout { min-height: calc(100vh - 58px); display: block; }
  .gh-sidebar { position: sticky; top: 58px; z-index: 24; padding: 0 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .gh-sidebar-label { display: none; }
  .gh-nav { display: flex; width: max-content; }
  .gh-nav button { width: auto; padding: 11px 10px; border-radius: 0; white-space: nowrap; }
  .gh-nav button.is-active { background: transparent; box-shadow: inset 0 -2px var(--brand); }
  .gh-nav-icon { display: none; }
  .gh-main { padding: 20px 14px 38px; }
  .gh-page-head { display: block; }
  .gh-page-head h1 { font-size: 23px; }
  .gh-head-actions { justify-content: flex-start; margin-top: 14px; }
  .gh-grid-2, .gh-grid-3, .gh-grid-4 { grid-template-columns: 1fr; }
  .gh-card-head { align-items: flex-start; padding: 15px 16px; }
  .gh-card-body { padding: 16px; }
  .gh-filter { padding: 14px 16px; }
  .gh-filter .gh-input, .gh-filter .gh-select { width: 100%; }
  .gh-tabs { gap: 20px; }
  .gh-dialog-layer { padding: 12px; }
  .gh-dialog { max-height: calc(100vh - 24px); border-radius: 12px; }
  .gh-dialog-head, .gh-dialog-body, .gh-dialog-foot { padding-left: 16px; padding-right: 16px; }
  .gh-kv { grid-template-columns: 112px minmax(0,1fr); }
}
@media (max-width: 360px) {
  .gh-brand svg { width: 30px; height: 30px; }
  .gh-top-actions { gap: 2px; }
  .gh-main { padding-left: 10px; padding-right: 10px; }
  .gh-page-head h1 { font-size: 21px; }
  .gh-button { padding-inline: 11px; }
  .gh-kv { grid-template-columns: 1fr; }
  .gh-kv > span { padding-bottom: 5px; }
  .gh-kv > strong, .gh-kv > div { padding-top: 5px; }
}

.d6-game-art { width: 54px; height: 72px; border-radius: 8px; background: linear-gradient(145deg, #0d344f, #276b74 58%, #f1b823); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); flex: 0 0 auto; }
.d6-game-row { width: 100%; display: flex; align-items: center; gap: 16px; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; }

.d6-progress { height: 8px; border-radius: 999px; background: #eef1f5; overflow: hidden; }

.d6-step-list { display: grid; gap: 12px; }
.d6-step { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eef0f3; }
.d6-step:last-child { border-bottom: 0; }
.d6-step-index { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #f2f4f7; color: #667085; font-size: 12px; font-weight: 800; }

.d6-cover p { margin: 0; color: #dce8ed; line-height: 1.6; }
.d6-cover-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.d6-cover-tags span { padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.13); font-size: 11px; }
.d6-market-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; }
.d6-market-option { display: flex; align-items: center; gap: 8px; min-height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: #475467; }
.d6-file-list { display: grid; gap: 8px; margin-top: 12px; }

.d6-diff > span { color: var(--muted); background: #f9fafb; }
.d6-diff > del { color: #7a271a; background: #fff7f6; text-decoration: none; }

@media (max-width: 820px) {
  .d6-game-meta { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .d6-market-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .d6-diff { grid-template-columns: 112px minmax(0,1fr); }

@media (max-width: 520px) {
  .d6-game-row { align-items: flex-start; }
  .d6-game-title { align-items: flex-start; }
  .d6-game-meta { grid-template-columns: 1fr; }
  .d6-market-grid { grid-template-columns: 1fr; }
  .d6-step { grid-template-columns: 30px minmax(0,1fr); }
  .d6-step > .gh-tag { grid-column: 2; width: max-content; }
}</style>

    const keyword = state.marketKeyword.toLowerCase();
    const visible = markets.filter(item => !keyword || item.join(' ').toLowerCase().includes(keyword));
    return `${breadcrumb(tx('发行范围','Release scope'))}${pageHead(tx('发行范围','Release scope'),tx('选择计划发行的国家／地区、平台和时间。','Choose target markets, platforms and release time.'),tag(statusLabels[current.release_scope_status] || current.release_scope_status,statusTone(current.release_scope_status)))}<form class="gh-card" id="scopeForm"><header class="gh-card-head"><div><h2>${tx('市场与平台','Markets & platforms')}</h2><p>${tx('中国大陆、中国香港、中国澳门和中国台湾分开选择。','Mainland China, Hong Kong, Macao and Taiwan are selected separately.')}</p></div></header><div class="gh-card-body"><div class="gh-grid-2"><div class="gh-field wide"><label for="marketSearch">${tx('搜索国家或地区','Search markets')}</label><input class="gh-input" id="marketSearch" data-action="market-search" value="${escapeHtml(state.marketKeyword)}" placeholder="${tx('输入名称或代码','Name or code')}"></div><div class="gh-field wide"><div class="d6-market-grid">${visible.map(([code,zh,en]) => `<label class="d6-market-option"><input type="checkbox" name="markets" value="${code}" ${state.selectedMarkets.includes(code) ? 'checked':''}> <span>${tx(zh,en)}</span><small>${code}</small></label>`).join('')}</div></div><div class="gh-field wide"><span class="gh-label gh-required">${tx('支持平台','Platforms')}</span><div class="gh-checks"><label><input type="checkbox" name="release_platforms" value="Windows" checked> Windows</label><label><input type="checkbox" name="release_platforms" value="macOS" checked> macOS</label><label><input type="checkbox" name="release_platforms" value="Linux"> Linux</label></div></div>${field({label:tx('计划发行时间','Planned release'),name:'release_at',type:'datetime-local',value:'2026-11-20T14:30',required:true})}<div class="gh-field"><label for="timezone">${tx('时区','Time zone')}</label><select class="gh-select" id="timezone" name="timezone"><option>UTC+08:00 北京</option><option>UTC+00:00 伦敦</option><option>UTC-08:00 洛杉矶</option></select></div></div><div class="gh-form-actions">${button(tx('保存草稿','Save draft'),'save-scope')}${button(tx('提交审核','Submit for review'),'submit-scope','primary')}</div></div></form>`;
  }
  function renderContract() {
    const current = ctx.read();
    return `${breadcrumb(tx('合同状态','Contract'))}${pageHead(tx('合同状态','Contract'),tx('查看当前合作合同，内容由平台运营维护。','View the active publishing contract managed by operations.'),tag(statusLabels[current.contract_status] || current.contract_status,statusTone(current.contract_status)))}<section class="gh-card"><header class="gh-card-head"><div><h2>${tx('合同信息','Contract information')}</h2><p>${tx('如有疑问，请联系 dev@xiaoji.com。','Contact dev@xiaoji.com if you have questions.')}</p></div></header><div class="gh-card-body"><div class="gh-grid-2">${readonly(tx('合同编号','Contract no.'),'GH-PC-2026-091')}${readonly(tx('合作类型','Cooperation type'),tx('平台代理发行','Platform publishing'))}${readonly(tx('有效期','Validity'),`2026-09-01 ${tx('至','to')} ${current.contract_valid_to}`)}${readonly(tx('当前状态','Status'),statusLabels[current.contract_status] || current.contract_status)}${readonly(tx('确认时间','Confirmed at'),'2026-09-01 18:30')}${readonly(tx('对接邮箱','Contact'),'dev@xiaoji.com')}</div></div></section>`;
  }
  const filteredReviews = () => state.reviewRows.filter(row => (!state.reviewFilters.keyword || `${row.id}${row.game}${row.vendor}`.includes(state.reviewFilters.keyword)) && (!state.reviewFilters.type || row.type === state.reviewFilters.type) && (!state.reviewFilters.status || row.status === state.reviewFilters.status));
  function renderReviews() {
    const rows = filteredReviews();
    return `${pageHead('游戏资料审核','查看商店资料、游戏资质和发行范围申请。')}<section class="gh-card"><div class="gh-filter"><input class="gh-input" data-filter="keyword" value="${escapeHtml(state.reviewFilters.keyword)}" placeholder="搜索申请编号、游戏或厂商"><select class="gh-select" data-filter="type"><option value="">全部类型</option>${['商店展示资料','游戏资质','发行范围'].map(value => `<option ${state.reviewFilters.type === value ? 'selected':''}>${value}</option>`).join('')}</select><select class="gh-select" data-filter="status"><option value="">全部状态</option><option value="pending" ${state.reviewFilters.status === 'pending' ? 'selected':''}>审核中</option><option value="supplement" ${state.reviewFilters.status === 'supplement' ? 'selected':''}>待补充</option><option value="approved" ${state.reviewFilters.status === 'approved' ? 'selected':''}>已通过</option><option value="rejected" ${state.reviewFilters.status === 'rejected' ? 'selected':''}>未通过</option></select><button class="gh-button" data-action="reset-review-filter">重置</button></div><div class="gh-table-wrap"><table class="gh-table"><thead><tr><th>申请编号</th><th>游戏／厂商</th><th>申请类型</th><th>版本</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody>${rows.length ? rows.map(row => `<tr><td><strong>${row.id}</strong></td><td><strong>${row.game}</strong><small>${row.vendor}</small></td><td>${row.type}</td><td>${row.version}</td><td>${tag(statusLabels[row.status],statusTone(row.status))}</td><td>${row.submitted}</td><td><div class="gh-row-actions">${button('查看详情','review-detail','link',`data-id="${row.id}"`)}${row.status === 'pending' ? button('通过','quick-approve','link',`data-id="${row.id}"`) : ''}</div></td></tr>`).join('') : `<tr><td colspan="7"><div class="gh-empty">未找到匹配申请</div></td></tr>`}</tbody></table></div><div class="gh-pagination">共 ${rows.length} 条</div></section>`;
  }
  function activeReview() {
    return state.reviewRows.find(row => row.id === hashParams().get('id')) || state.reviewRows[0];
  }
  function renderReviewDetail() {
    const review = activeReview();
    return `${breadcrumb('审核详情')}${pageHead('审核详情',`${review.id} · ${review.type}`,`${button('返回列表','back-reviews')}${review.status === 'pending' ? `${button('要求补充','review-supplement')}${button('拒绝','review-reject','danger')}${button('通过','review-approve','primary')}` : ''}`)}<section class="gh-grid-3">${readonly('游戏',review.game,ctx.read().game_id)}${readonly('厂商',review.vendor,ctx.read().vendor_id)}${readonly('提交版本',review.version,review.submitted)}</section><section class="gh-card"><header class="gh-card-head"><div><h2>本次提交</h2><p>运营只审核，不修改开发者原值。</p></div>${tag(statusLabels[review.status],statusTone(review.status))}</header><div class="gh-card-body"><div class="gh-kv"><span>申请类型</span><strong>${review.type}</strong></div><div class="gh-kv"><span>申请主体</span><strong>星海互动科技有限公司</strong></div><div class="gh-kv"><span>关联游戏</span><strong>星海远征（GAME-48291）</strong></div><div class="gh-kv"><span>附件</span><div><a href="#" data-action="preview-file">软件著作权证明.png</a> · <a href="#" data-action="preview-file">授权证明.png</a></div></div></div></section><section class="gh-card"><header class="gh-card-head"><div><h2>与上一通过版本对比</h2><p>仅展示实际变更字段。</p></div></header><div><div class="d6-diff"><span>字段</span><del>上一版</del><ins>本次提交</ins></div><div class="d6-diff"><span>授权截止日</span><del>2027-07-31</del><ins>2028-07-31</ins></div><div class="d6-diff"><span>授权范围</span><del>海外地区</del><ins>全球（不含受限地区）</ins></div></div></section>`;
  }
  function renderContractAdmin() {
    const current = ctx.read();
    return `${pageHead('合同状态维护','为开发者维护当前合同状态。')}<form class="gh-card" id="contractForm"><header class="gh-card-head"><div><h2>合同信息</h2><p>保存后同步到开发者端合同状态页。</p></div>${tag(statusLabels[current.contract_status],statusTone(current.contract_status))}</header><div class="gh-card-body"><div class="gh-grid-2">${field({label:'合同编号',name:'contract_no',value:'GH-PC-2026-091',required:true})}<div class="gh-field"><label for="contract_type">合作类型</label><select class="gh-select" id="contract_type" name="contract_type"><option>平台代理发行</option><option>联合发行</option></select></div>${field({label:'生效日',name:'valid_from',type:'date',value:'2026-09-01',required:true})}${field({label:'截止日',name:'valid_to',type:'date',value:current.contract_valid_to,required:true})}<div class="gh-field"><label for="contract_status">状态</label><select class="gh-select" id="contract_status" name="contract_status"><option value="effective" ${current.contract_status === 'effective' ? 'selected':''}>生效中</option><option value="expired" ${current.contract_status === 'expired' ? 'selected':''}>已过期</option><option value="terminated" ${current.contract_status === 'terminated' ? 'selected':''}>已终止</option></select></div>${field({label:'确认人',name:'confirmed_by',value:'李瑜',required:true})}${field({label:'证据链接',name:'evidence_url',value:'https://docs.google.com/document/u/0/',type:'url',required:true,wide:true,hint:'仅运营端可见。'})}</div><div class="gh-form-actions">${button('保存','save-contract','primary')}</div></div></form>`;
  }
  function renderDialog() {
    if (!state.dialog) return '';
    if (state.dialog === 'review-action') {
      const label = state.activeAction === 'approved' ? '通过' : state.activeAction === 'supplement' ? '要求补充' : '拒绝';
      const reasonRequired = state.activeAction !== 'approved';
      return `<div class="gh-dialog-layer"><section class="gh-dialog" role="dialog" aria-modal="true" aria-label="${label}"><header class="gh-dialog-head"><div><h2>${label}申请</h2><p>${reasonRequired ? '原因将在平台内完整展示给开发者。' : '通过后开发者将看到最新状态。'}</p></div><button class="gh-dialog-close" data-action="close-dialog">×</button></header><div class="gh-dialog-body"><div class="gh-field"><label class="${reasonRequired ? 'gh-required':''}" for="reviewReason">处理意见</label><textarea class="gh-textarea" id="reviewReason" maxlength="500" placeholder="${reasonRequired ? '请输入 1—500 字' : '选填'}"></textarea><div class="gh-error">${escapeHtml(state.actionError)}</div></div></div><footer class="gh-dialog-foot">${button('取消','close-dialog')}${button('确认'+label,'confirm-review',state.activeAction === 'rejected' ? 'danger' : 'primary')}</footer></section></div>`;
    }
    return '';
  }
  function renderPage() {
    const route = currentRoute();
    const pages = { games:renderGames, create:renderCreate, overview:renderOverview, profile:renderProfile, qualification:renderQualification, scope:renderScope, contract:renderContract, reviews:renderReviews, 'review-detail':renderReviewDetail, 'contract-admin':renderContractAdmin };
    return pages[route.page]();
  }
  function render() {
    const route = currentRoute();
    document.documentElement.lang = lang() === 'en' ? 'en' : 'zh-CN';
    app.innerHTML = `<div class="gh-app">${topbar(route.role)}<div class="gh-layout">${sidebar(route.role)}<main class="gh-main"><div class="gh-content">${renderPage()}</div></main></div>${renderDialog()}${state.toast ? `<div class="gh-toast ${state.toastError ? 'error':''}" role="status">${escapeHtml(state.toast)}</div>` : ''}</div>`;
  }
  const syncFiles = input => {
    const label = document.querySelector(`[data-upload-label="${input.dataset.upload}"]`);
    if (label) label.textContent = input.files.length ? [...input.files].map(file => file.name).join('、') : '选择文件';
  };
  document.addEventListener('input', event => {
    if (event.target.matches('[data-filter]')) { state.reviewFilters[event.target.dataset.filter] = event.target.value; render(); }
    if (event.target.matches('[data-action="market-search"]')) { state.marketKeyword = event.target.value; render(); requestAnimationFrame(() => document.querySelector('#marketSearch')?.focus()); }
  });
  document.addEventListener('change', event => {
    if (event.target.matches('[data-upload]')) syncFiles(event.target);
    if (event.target.name === 'markets') {
      state.selectedMarkets = [...document.querySelectorAll('[name="markets"]:checked')].map(item => item.value);
    }
  });
  document.addEventListener('click', event => {
    const routeButton = event.target.closest('[data-route]');
    if (routeButton) {
      const id = routeButton.dataset.route;
      if (routes[id]) routeTo(id);
      else if (id.startsWith('P07')) location.href = `07-开发接入与资源中心demo.html#/${id}`;
      else if (id.startsWith('P08')) location.href = `08-消息通知中心demo.html#/${id}`;
      return;
    }
    const control = event.target.closest('[data-action]');
    if (!control) return;
    const action = control.dataset.action;
    if (action === 'create-game') return routeTo('P06-02');
    if (action === 'back-games') return routeTo('P06-01');
    if (action === 'enter-game') return routeTo('P06-03');
    if (action === 'go-qualification') return routeTo('P06-05');
    if (action === 'open-resources') { location.href = '07-开发接入与资源中心demo.html#/P07-01'; return; }
    if (action === 'open-messages') { location.href = '08-消息通知中心demo.html#/P08-01'; return; }
    if (action === 'submit-create') {
      const form = document.querySelector('#createGameForm');
      const zh = form.elements.game_name_zh.value.trim(); const en = form.elements.game_name_en.value.trim();
      const platforms = [...form.querySelectorAll('[name="platforms"]:checked')].map(item => item.value);
      if (!zh || !en || !platforms.length) return showToast(tx('请填写中英文名称并选择至少一个平台','Complete both titles and select at least one platform.'),true);
      ctx.write({ game_id:'GAME-48291', app_id:'APP-7F3A9C', game_name_zh:zh, game_name_en:en, target_platforms:platforms });
      ctx.emitEvent({ event_source:'game', entity_id:'GAME-48291', event_type:'game_created', event_status:'success', deep_link:'06-游戏创建与发行资料demo.html#/P06-03', title_zh:'游戏创建成功', title_en:'Game created', body_zh:'游戏项目已创建，可继续完善发行资料。', body_en:'The game project is ready for publishing profile setup.' });
      return routeTo('P06-03');
    }
    if (action === 'save-profile') return showToast(tx('草稿已保存','Draft saved'));
    if (action === 'submit-profile') {
      ctx.write({ profile_status:'pending', profile_version:`PROFILE-${Date.now()}` });
      ctx.emitEvent({ event_source:'profile', entity_id:ctx.read().game_id, event_type:'profile_review', event_status:'pending', deep_link:'06-游戏创建与发行资料demo.html#/P06-04', title_zh:'商店展示资料已提交', title_en:'Store profile submitted' });
      return showToast(tx('已提交审核','Submitted for review'));
    }
    if (action === 'save-qualification') return showToast(tx('草稿已保存','Draft saved'));
    if (action === 'submit-qualification') {
      ctx.write({ qualification_status:'pending', qualification_version:`QUAL-${Date.now()}` });
      ctx.emitEvent({ event_source:'qualification', entity_id:ctx.read().game_id, event_type:'qualification_review', event_status:'pending', deep_link:'06-游戏创建与发行资料demo.html#/P06-05', title_zh:'游戏资质已提交', title_en:'Qualifications submitted', body_zh:'资质已进入平台审核。', body_en:'Qualifications are under platform review.' });
      return showToast(tx('资质已提交，不影响其他流程','Qualifications submitted without blocking other flows'));
    }
    if (action === 'save-scope') return showToast(tx('发行范围草稿已保存','Release scope draft saved'));
    if (action === 'submit-scope') {
      if (!state.selectedMarkets.length) return showToast(tx('请至少选择一个国家或地区','Select at least one market'),true);
      ctx.write({ release_scope_status:'pending', release_scope_version:`SCOPE-${Date.now()}`, release_scope:{ regions:state.selectedMarkets } });
      ctx.emitEvent({ event_source:'release_scope', entity_id:ctx.read().game_id, event_type:'scope_review', event_status:'pending', deep_link:'06-游戏创建与发行资料demo.html#/P06-06', title_zh:'发行范围已提交', title_en:'Release scope submitted' });
      return showToast(tx('已提交审核','Submitted for review'));
    }
    if (action === 'reset-review-filter') { state.reviewFilters = {keyword:'',type:'',status:''}; return render(); }
    if (action === 'review-detail') return routeTo('P06-09',`id=${encodeURIComponent(control.dataset.id)}`);
    if (action === 'back-reviews') return routeTo('P06-08');
    if (action === 'quick-approve') {
      const row = state.reviewRows.find(item => item.id === control.dataset.id); if (row) row.status = 'approved'; showToast('已通过该申请'); return;
    }
    if (['review-supplement','review-reject','review-approve'].includes(action)) {
      state.activeAction = action === 'review-supplement' ? 'supplement' : action === 'review-reject' ? 'rejected' : 'approved'; state.dialog = 'review-action'; state.actionError = ''; return render();
    }
    if (action === 'close-dialog') { state.dialog = ''; state.actionError = ''; return render(); }
    if (action === 'confirm-review') {
      const reason = document.querySelector('#reviewReason')?.value.trim() || '';
      if (state.activeAction !== 'approved' && !reason) { state.actionError = '请填写处理原因'; return render(); }
      const row = activeReview(); row.status = state.activeAction;
      const key = row.object === 'release_scope' ? 'release_scope_status' : `${row.object}_status`;
      ctx.write({ [key]:state.activeAction });
      ctx.emitEvent({ event_source:row.object, entity_id:ctx.read().game_id, event_type:'review_result', event_status:state.activeAction, deep_link:`06-游戏创建与发行资料demo.html#/${row.object === 'profile' ? 'P06-04' : row.object === 'qualification' ? 'P06-05' : 'P06-06'}`, title_zh:`${row.type}${statusLabels[state.activeAction]}`, title_en:`${row.type} review updated`, reason });
      state.dialog = ''; routeTo('P06-08'); return;
    }
    if (action === 'save-contract') {
      const form = document.querySelector('#contractForm');
      ctx.write({ contract_status:form.elements.contract_status.value, contract_valid_to:form.elements.valid_to.value, contract_version:`CONTRACT-${Date.now()}` });
      return showToast('合同状态已保存');
    }
    if (action === 'preview-file') { event.preventDefault(); return showToast('正在预览附件'); }
  });
  window.addEventListener('hashchange', render);
  if (!location.hash) routeTo('P06-01'); else render();
})();</script>
</body>
</html>
