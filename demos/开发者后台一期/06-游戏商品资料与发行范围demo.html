<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>游戏商品资料与发行范围｜PC 发行平台</title>
  <style>:root {
  --brand-cyan: #38E8FF;
  --brand-blue: #6A7CFF;
  --brand-deep: #101827;
  --brand-night: #0B1220;
  --success: #1E9B66;
  --warning: #C88918;
  --danger: #D95656;
  --info: #3976D9;
  --text-primary: #172033;
  --text-secondary: #5B657A;
  --text-tertiary: #8B94A6;
  --line: #E6E9F0;
  --line-strong: #D5DAE5;
  --surface: #FFFFFF;
  --surface-soft: #F7F8FB;
  --surface-muted: #F0F2F7;
  --nav-text: #AEB8CD;
  --nav-active: #FFFFFF;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --shadow-card: 0 6px 20px rgba(25, 38, 66, 0.06);
  --focus-ring: 0 0 0 3px rgba(56, 232, 255, 0.22);
  --font-sans: "MiSans VF", MiSans, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-number: "D-DIN-PRO", "DIN Alternate", var(--font-sans);
}

* { box-sizing: border-box; }

html, body { min-width: 0; min-height: 100%; margin: 0; }

body {
  color: var(--text-primary);
  background: #E9EDF4;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; }
button, a, select { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.number { font-family: var(--font-number); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

#app { min-width: 0; min-height: 100vh; }

.portal-stage { position: relative; min-width: 0; min-height: 100vh; background: #E9EDF4; }

.product-frame {
  position: relative;
  width: 100%;
  min-width: 0;
  height: 100vh;
  min-height: 0;
  background: var(--surface-soft);
  overflow: hidden;
}

.top-bar {
  position: absolute;
  inset: 0 0 auto 0;
  z-index: 4;
  height: 56px;
  display: flex;
  align-items: center;
  color: #FFFFFF;
  background: linear-gradient(98deg, #0B1220 0%, #15213A 72%, #13243A 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.brand-block {
  width: 232px;
  height: 56px;
  padding: 0 var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  color: inherit;
  text-align: left;
  border-top: 0;
  border-bottom: 0;
  border-left: 0;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  background: transparent;
  cursor: pointer;
}
.brand-block:hover { background: rgba(255,255,255,.045); }

.brand-mark {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: #FFFFFF;
}
.brand-mark svg { width: 32px; height: 32px; }

.brand-copy { min-width: 0; }
.brand-title { color: #FFFFFF; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
.brand-subtitle { color: #B7C2D6; font-size: 11px; }

.top-context { min-width: 0; height: 56px; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-3); color: inherit; border: 0; background: transparent; }
.top-context strong { overflow: hidden; color: #FFFFFF; text-overflow: ellipsis; white-space: nowrap; }
.top-home-link { cursor: pointer; }
.top-home-link:hover { background: rgba(255,255,255,.045); }
.top-account-menu { position: relative; height: 56px; margin-left: 8px; display: flex; align-items: center; }
.top-account { min-width: 176px; height: 56px; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-3); color: #DCE3F0; text-align: left; border: 0; background: transparent; cursor: pointer; }
.top-account:hover, .top-account-menu.is-open .top-account { background: rgba(255,255,255,.05); }
.account-avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: #142039; font-weight: 700; background: linear-gradient(135deg, var(--brand-cyan), #B7C1FF); }
.account-copy { min-width: 0; flex: 1; }
.account-copy strong { display: block; overflow: hidden; color: #FFFFFF; text-overflow: ellipsis; white-space: nowrap; }
.account-copy span { display: block; color: #B7C2D6; font-size: 11px; }
.top-account > svg { width: 15px; height: 15px; flex: 0 0 auto; color: #8998AF; transform: rotate(90deg); transition: transform .16s ease; }
.top-account-menu.is-open .top-account > svg { transform: rotate(-90deg); }
.top-account-dropdown { position: absolute; top: 50px; right: 14px; z-index: 20; width: 170px; padding: 6px; opacity: 0; visibility: hidden; transform: translateY(-4px); border: 1px solid #DDE3EC; border-radius: 10px; background: #FFFFFF; box-shadow: 0 14px 36px rgba(12,22,42,.18); transition: opacity .14s ease, transform .14s ease, visibility .14s; }
.top-account-dropdown::before { content: ""; position: absolute; inset: -8px 0 auto; height: 10px; }
.top-account-menu:hover .top-account-dropdown, .top-account-menu.is-open .top-account-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
.top-account-dropdown button { width: 100%; min-height: 38px; padding: 0 11px; color: var(--text-secondary); text-align: left; border: 0; border-radius: 7px; background: transparent; cursor: pointer; }
.top-account-dropdown button:hover { color: var(--text-primary); background: #F2F5F9; }
.top-help-button, .top-login-button, .top-language-button, .top-console-button { min-height: 36px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: #EAF0FA; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; background: rgba(255,255,255,.06); cursor: pointer; }
.top-help-button, .top-language-button, .top-login-button, .top-console-button { margin-left: 8px; }
.top-help-button:hover, .top-login-button:hover, .top-language-button:hover, .top-console-button:hover { color: #FFFFFF; border-color: rgba(56,232,255,.44); background: rgba(56,232,255,.08); }
.top-help-button.is-active { color: #071522; border-color: var(--brand-cyan); background: linear-gradient(135deg, var(--brand-cyan), #8BEFFF); }
.top-help-button.is-active svg { color: #071522; }
.top-language-button { min-width: 92px; font-weight: 700; }
.top-help-button svg, .top-login-button svg, .top-console-button svg { width: 16px; height: 16px; color: var(--brand-cyan); }
.top-language-button + .top-account-menu, .top-language-button + .top-account { margin-left: 8px; }
.top-context + .top-account-menu, .top-context + .top-account, .top-context + .top-login-button, .top-context + .top-help-button { margin-left: auto; }
.top-login-button[hidden], .top-help-button[hidden], .top-console-button[hidden] { display: none; }
.product-frame[data-role="developer"] .top-help-button,
.product-frame[data-role="developer"] .top-language-button,
.product-frame[data-role="developer"] .top-console-button { color: #C7D1E0; border-color: transparent; background: transparent; }
.product-frame[data-role="developer"] > .top-bar > .top-help-button { margin-left: auto; }
.product-frame[data-role="developer"] .top-help-button:hover,
.product-frame[data-role="developer"] .top-language-button:hover,
.product-frame[data-role="developer"] .top-console-button:hover { color: #FFFFFF; border-color: transparent; background: rgba(255,255,255,.06); }
.product-frame[data-role="developer"] .top-help-button.is-active { color: var(--brand-cyan); border-color: transparent; background: rgba(56,232,255,.08); }
.product-frame[data-role="developer"] .top-help-button.is-active svg { color: var(--brand-cyan); }
.product-frame[data-role="developer"] .top-login-button { color: #071522; font-weight: 700; border-color: transparent; background: linear-gradient(135deg, var(--brand-cyan), #9AF2FF); }
.product-frame[data-role="developer"] .top-login-button:hover { color: #071522; border-color: transparent; background: linear-gradient(135deg, #5DEEFF, #AEF5FF); }
.product-frame.is-login.is-help-open > .top-bar { height: 64px; padding-right: clamp(20px, 2vw, 32px); padding-left: clamp(20px, 2vw, 32px); }
.product-frame.is-login.is-help-open > .top-bar .brand-block { width: auto; height: 64px; padding: 0; border-right: 0; }
.product-frame.is-login.is-help-open .workspace { inset: 64px 0 0; }

.side-nav {
  position: absolute;
  inset: 56px auto 0 0;
  z-index: 3;
  width: 232px;
  min-height: 0;
  padding: var(--space-5) var(--space-3);
  overflow-y: auto;
  color: var(--nav-text);
  background: var(--brand-deep);
  border-right: 1px solid rgba(255,255,255,.05);
}

.nav-label { padding: 0 10px var(--space-2); color: #64728D; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.nav-list { display: grid; gap: var(--space-1); }
.nav-item { position: relative; min-height: 42px; padding: 9px 10px; display: flex; align-items: center; gap: 10px; color: #AAB7CA; border-radius: var(--radius-sm); transition: color .15s, background .15s; }
.nav-item:hover { color: #EDF2FA; background: rgba(255,255,255,.05); }
.nav-item.is-active { color: #FFFFFF; background: linear-gradient(90deg, rgba(56,232,255,.20), rgba(106,124,255,.14)); }
.nav-item.is-active::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand-cyan); }
.nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
.nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-nav button.nav-item { width: 100%; border: 0; text-align: left; background: transparent; cursor: pointer; }
.side-nav button.nav-item:hover { background: rgba(255,255,255,.05); }
.side-nav button.nav-item.is-active { background: linear-gradient(90deg, rgba(56,232,255,.20), rgba(106,124,255,.14)); }
.workspace { position: absolute; inset: 56px 0 0 232px; min-width: 0; min-height: 0; overflow: auto; background: var(--surface-soft); }
.product-frame.is-login > .top-bar { display: none; }
.product-frame.is-login .workspace { inset: 0; }
.product-frame.is-login.is-help-open > .top-bar { display: flex; }
.product-frame.is-login.is-help-open .workspace { inset: 64px 0 0; }
.product-frame.is-onboarding .workspace { left: 0; }
.product-frame.is-entry-choice .workspace { background: #091426; }
.product-frame.is-entry-choice .page-wrap { min-height: 100%; padding-top: 24px; }
.product-frame.is-help-open .workspace { left: 0; }
.product-frame.is-help-open .side-nav,
.product-frame.is-help-open .context-bar,
.product-frame.is-help-open .platform-tab-bar { display: none; }
.product-frame.is-login .page-wrap { padding: 0; }
.context-bar { height: 48px; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-2); color: var(--text-secondary); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.88); }
.context-bar svg { width: 15px; height: 15px; color: var(--text-tertiary); }
.context-divider { color: var(--line-strong); }
.context-value { color: var(--text-primary); font-weight: 600; }

.platform-tab-bar {
  position: absolute;
  inset: 56px 0 auto;
  z-index: 3;
  height: 56px;
  display: flex;
  align-items: stretch;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  background: #FFFFFF;
  box-shadow: 0 2px 8px rgba(20, 35, 58, .04);
}
.platform-tab-list {
  min-width: 0;
  padding: 0 clamp(20px, 2.4vw, 48px);
  display: flex;
  align-items: stretch;
  gap: clamp(28px, 3.2vw, 56px);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.platform-tab-list::-webkit-scrollbar { display: none; }
.platform-tab {
  position: relative;
  min-width: max-content;
  padding: 0 2px;
  flex: 0 0 auto;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  border: 0;
  background: transparent;
  cursor: pointer;
  transition: color .15s ease;
}
.platform-tab:hover { color: var(--brand-blue); }
.platform-tab::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: transparent;
}
.platform-tab.is-active { color: #08AEC8; }
.platform-tab.is-active::after { background: linear-gradient(90deg, #08C9D6, #24B7E5); }
.platform-tab:focus-visible { outline: 2px solid var(--brand-cyan); outline-offset: -4px; border-radius: 4px; }
.product-frame.is-platform-console .workspace { inset: 112px 0 0; }
.product-frame.is-platform-console.is-help-open .workspace { inset: 56px 0 0; }
.product-frame.is-publisher-workspace .workspace { inset: 56px 0 0; background: #F5F7FA; }
.product-frame.is-publisher-workspace .page-wrap { min-height: 100%; padding: 0; }
.product-frame.is-publisher-workspace.is-help-open .workspace { inset: 56px 0 0; }
.product-frame.is-publisher-workspace .brand-title { color: #F7FAFF; font-size: 14px; }
.product-frame.is-publisher-workspace .brand-subtitle { color: #91A1B8; }

.page-wrap { min-width: 0; padding: var(--space-6) var(--space-8) 48px; }
.page-header { min-height: 66px; margin-bottom: var(--space-5); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-6); }
.page-header > :first-child { min-width: 0; flex: 1 1 auto; }
.page-eyebrow { margin-bottom: 4px; color: var(--brand-blue); font-family: var(--font-number); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.page-title { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -.02em; }
.page-summary { max-width: 720px; margin: 7px 0 0; color: var(--text-secondary); }
.page-actions { padding-top: 2px; display: flex; flex: 0 0 auto; align-items: center; gap: var(--space-2); }

.help-center { min-height: calc(100vh - 56px); padding: 20px var(--space-8) 32px; }
.help-center__header { min-height: 68px; margin-bottom: 16px; display: flex; justify-content: space-between; gap: 24px; align-items: center; }
.help-center__heading { min-width: 0; display: flex; gap: 16px; align-items: center; }
.help-center__header .text-back { margin: 0; }
.help-center__header h1 { margin: 0; font-size: 24px; }
.help-search { width: min(420px, 40vw); height: 40px; display: flex; flex: 0 0 auto; overflow: hidden; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: #FFFFFF; }
.help-search:focus-within { border-color: var(--brand-blue); box-shadow: 0 0 0 3px rgba(106,124,255,.10); }
.help-search input { min-width: 0; padding: 0 12px; flex: 1 1 auto; color: var(--text-primary); border: 0; background: transparent; outline: none; }
.help-search input::placeholder { color: var(--text-tertiary); }
.help-search input[aria-invalid="true"] { background: #FFF9F9; }
.help-search button { min-width: 84px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: #071522; font-weight: 650; border: 0; border-left: 1px solid var(--line); background: linear-gradient(135deg, var(--brand-cyan), #8BEFFF); cursor: pointer; }
.help-search button:hover { filter: brightness(.98); }
.help-search button svg { width: 16px; height: 16px; }
.help-library { min-height: calc(100vh - 160px); display: grid; grid-template-columns: 292px minmax(0, 1fr); overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-md); background: #FFFFFF; box-shadow: var(--shadow-card); }
.help-library__nav { min-width: 0; overflow-y: auto; background: #F5F7FA; border-right: 1px solid var(--line); }
.help-library__nav-title { height: 48px; padding: 0 20px; display: flex; align-items: center; color: var(--text-primary); font-weight: 700; border-bottom: 1px solid var(--line); }
.help-library__nav nav { padding: 12px 10px 24px; }
.help-nav-group + .help-nav-group { margin-top: 14px; }
.help-nav-group h2 { margin: 0; padding: 0 10px 6px; color: var(--text-tertiary); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.help-nav-subgroup-title { margin: 10px 10px 4px; color: #8B95A6; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.help-nav-item { width: 100%; min-height: 40px; padding: 8px 10px; display: flex; align-items: flex-start; gap: 9px; color: var(--text-secondary); text-align: left; line-height: 1.45; border: 0; border-radius: var(--radius-sm); background: transparent; cursor: pointer; }
.help-nav-item.is-child { padding-left: calc(10px + (var(--help-document-depth, 1) * 18px)); position: relative; }
.help-nav-item.is-child::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: calc(10px + ((var(--help-document-depth, 1) - 1) * 18px)); border-left: 1px solid #D4DAE5; }
.help-nav-item:hover { color: var(--text-primary); background: rgba(106,124,255,.07); }
.help-nav-item.is-active { color: #2335A0; font-weight: 650; background: rgba(106,124,255,.12); }
.help-nav-item svg { width: 16px; height: 16px; margin-top: 2px; flex: 0 0 auto; }
.help-library__content { min-width: 0; overflow-y: auto; background: #FFFFFF; }
.help-article { max-width: 980px; padding: 38px 48px 56px; }
.help-article[hidden], .help-search-results[hidden] { display: none; }
.help-breadcrumb { display: flex; align-items: center; gap: 7px; color: var(--text-tertiary); font-size: 12px; }
.help-breadcrumb span { color: var(--line-strong); }
.help-article > h1 { margin: 12px 0 10px; color: var(--text-primary); font-size: 30px; line-height: 1.3; letter-spacing: -.02em; }
.help-article__lead { margin: 0; padding-bottom: 24px; color: var(--text-secondary); font-size: 15px; line-height: 1.8; border-bottom: 1px solid var(--line); }
.help-article section { padding-top: 24px; }
.help-article section + section { margin-top: 2px; }
.help-article section h2 { margin: 0 0 12px; font-size: 18px; }
.help-article ol, .help-article ul { margin: 0; padding-left: 22px; color: var(--text-secondary); line-height: 1.8; }
.help-article li + li { margin-top: 8px; }
.help-note { margin-top: 28px; padding: 15px 16px; display: flex; gap: 11px; color: #0B6271; border: 1px solid rgba(47,215,239,.28); border-radius: var(--radius-sm); background: #EFFCFE; }
.help-note > svg { width: 18px; height: 18px; margin-top: 2px; flex: 0 0 auto; }
.help-note strong { display: block; }
.help-note p { margin: 4px 0 0; color: #376D78; line-height: 1.65; }
.help-search-results { max-width: 1040px; padding: 38px 48px 56px; }
.help-search-summary { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.help-search-summary > span { color: var(--brand-blue); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.help-search-summary h1 { margin: 8px 0 6px; font-size: 25px; }
.help-search-summary p { margin: 0; color: var(--text-secondary); }
.help-result-list { display: grid; }
.help-result-item { border-bottom: 1px solid var(--line); }
.help-result-item button { width: 100%; padding: 22px 0; display: block; color: var(--text-primary); text-align: left; border: 0; background: transparent; cursor: pointer; }
.help-result-item button:hover h2 { color: var(--brand-blue); }
.help-result-item button > span { color: var(--text-tertiary); font-size: 12px; }
.help-result-item h2 { margin: 6px 0 7px; font-size: 18px; }
.help-result-item p { margin: 0; color: var(--text-secondary); line-height: 1.75; }
.help-result-item mark { padding: 0 2px; color: inherit; background: #FFE07A; border-radius: 2px; }
.help-search-empty { min-height: 360px; display: grid; place-content: center; justify-items: center; color: var(--text-secondary); text-align: center; }
.help-search-empty strong { color: var(--text-primary); font-size: 18px; }
.help-search-empty p { margin: 8px 0 0; }

/* 单游戏控制台导航 */
.side-nav--game { padding-top: 12px; }
.game-nav-back { min-height: 36px; margin-bottom: 12px; padding: 7px 9px; display: flex; align-items: center; gap: 7px; color: #8E9DB3; font-size: 12px; border-radius: 8px; }
.game-nav-back:hover { color: #FFFFFF; background: rgba(255,255,255,.05); }
.game-nav-back svg { width: 15px; height: 15px; transform: rotate(180deg); }
.game-nav-current { margin-bottom: 18px; padding: 12px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,.08); border-radius: 11px; background: rgba(255,255,255,.045); }
.game-nav-current > div { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto; color: #06131E; border-radius: 10px; background: linear-gradient(145deg, var(--brand-cyan), #8995FF); }
.game-nav-current > div svg { width: 21px; height: 21px; }
.game-nav-current strong, .game-nav-current small { display: block; }
.game-nav-current strong { overflow: hidden; color: #FFFFFF; text-overflow: ellipsis; white-space: nowrap; }
.game-nav-current small { margin-top: 3px; color: #7889A2; font-family: var(--font-number); font-size: 10px; }
.nav-group-label { margin-top: 10px; padding: 10px 10px 5px; color: #64728D; font-size: 10px; font-weight: 700; letter-spacing: .07em; }
.side-nav--game .nav-item { min-height: 40px; }

@media (max-width: 1360px) {
  .page-wrap { padding-right: 24px; padding-left: 24px; }
  .help-center { padding-right: 24px; padding-left: 24px; }
  .help-library { grid-template-columns: 270px minmax(0, 1fr); }
  .help-article, .help-search-results { padding-right: 36px; padding-left: 36px; }
}

@media (max-width: 1180px) {
  .brand-block, .side-nav { width: 212px; }
  .workspace { left: 212px; }

.gh-icon { width: 18px; height: 18px; flex: 0 0 auto; }

.gh-button {
  min-height: 36px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--text-primary);
  font-weight: 650;
  line-height: 1;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
}
.gh-button:hover { border-color: #B8C1D4; background: #FAFBFD; }
.gh-button[data-variant="primary"] { color: #071522; border-color: var(--brand-cyan); background: linear-gradient(135deg, var(--brand-cyan), #8BEFFF); }
.gh-button[data-variant="primary"]:hover { filter: brightness(.98); }
.gh-button[data-variant="danger"] { color: var(--danger); border-color: rgba(217,86,86,.35); background: #FFF8F8; }
.gh-button[data-variant="ghost"] { color: #C7D1E1; border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.04); }
.gh-button[data-variant="text"] { min-height: 30px; padding: 0 6px; color: var(--info); border-color: transparent; background: transparent; }
.gh-button[data-size="small"] { min-height: 28px; padding: 0 9px; font-size: 11px; }
.gh-button:disabled, .gh-button[aria-disabled="true"] { color: var(--text-tertiary); border-color: var(--line); background: var(--surface-muted); cursor: not-allowed; opacity: .68; }
.page-button:disabled, .page-button[aria-disabled="true"] { color: var(--text-tertiary); cursor: not-allowed; opacity: .45; }
.gh-button svg { width: 16px; height: 16px; }

.field { display: grid; gap: 7px; min-width: 0; }
.field-label { display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.field-required { margin-left: 3px; color: var(--danger); }
.field-hint { color: var(--text-tertiary); font-size: 11px; font-weight: 400; }
.gh-input, .gh-select, .gh-textarea { width: 100%; color: var(--text-primary); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); transition: border .15s, box-shadow .15s; }
.gh-input, .gh-select { height: 38px; padding: 0 11px; }
.gh-textarea { min-height: 96px; padding: 10px 11px; resize: vertical; }
.gh-input:hover, .gh-select:hover, .gh-textarea:hover { border-color: #ABB5C9; }
.gh-input[aria-invalid="true"], .gh-textarea[aria-invalid="true"] { border-color: var(--danger); background: #FFF9F9; }
.field-error { color: var(--danger); font-size: 11px; }

.status-tag { min-height: 24px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 11px; font-weight: 650; border-radius: 999px; background: var(--surface-muted); white-space: nowrap; }
.status-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-tag[data-variant="success"] { color: var(--success); background: rgba(30,155,102,.10); }
.status-tag[data-variant="warning"] { color: var(--warning); background: rgba(200,137,24,.11); }
.status-tag[data-variant="danger"] { color: var(--danger); background: rgba(217,86,86,.10); }
.status-tag[data-variant="info"] { color: var(--info); background: rgba(57,118,217,.10); }

.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.panel-header { min-height: 54px; padding: 0 var(--space-5); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); border-bottom: 1px solid var(--line); }
.panel-title { margin: 0; font-size: 15px; }
.panel-description { color: var(--text-tertiary); font-size: 11px; }
.panel-body { padding: var(--space-5); }

.filter-bar { margin-bottom: var(--space-4); padding: 12px; display: grid; grid-template-columns: minmax(220px, 1.5fr) repeat(2, minmax(150px, .8fr)) auto; gap: 10px; align-items: end; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.search-field { position: relative; }
.search-field svg { position: absolute; top: 10px; left: 11px; width: 17px; height: 17px; color: var(--text-tertiary); pointer-events: none; }
.search-field input { padding-left: 36px; }

.table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.data-table { width: 100%; min-width: 680px; border-collapse: collapse; table-layout: fixed; }
.data-table[data-columns="7"], .data-table[data-columns="8"] { min-width: 920px; }
.data-table[data-columns="6"] { min-width: 820px; }
.data-table[data-columns="5"] { min-width: 740px; }
.data-table th { height: 42px; padding: 0 14px; color: var(--text-secondary); font-size: 11px; text-align: left; background: var(--surface-muted); border-bottom: 1px solid var(--line); }
.data-table td { height: 54px; padding: 9px 14px; color: var(--text-primary); border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: normal; word-break: normal; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #FAFBFD; }
.table-primary { font-weight: 650; }
.table-secondary { margin-top: 2px; color: var(--text-tertiary); font-size: 11px; white-space: nowrap; }
.table-identifier { white-space: nowrap; }

.pagination { margin-top: var(--space-4); display: flex; align-items: center; justify-content: space-between; color: var(--text-tertiary); font-size: 12px; }
.pagination__buttons { display: flex; gap: 6px; }
.page-button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
.page-button.is-active { color: #091521; border-color: var(--brand-cyan); background: rgba(56,232,255,.24); }

.tabs { margin-bottom: var(--space-4); display: flex; gap: var(--space-5); border-bottom: 1px solid var(--line); }
.tab { position: relative; padding: 0 2px 11px; color: var(--text-secondary); border: 0; background: transparent; cursor: pointer; }
.tab.is-active { color: var(--text-primary); font-weight: 650; }
.tab.is-active::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: var(--brand-blue); }
.tabs[data-variant="task"] { gap: 8px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-muted); }
.tabs[data-variant="task"] .tab { min-height: 36px; padding: 8px 16px; border: 1px solid transparent; border-radius: 7px; }
.tabs[data-variant="task"] .tab.is-active { color: var(--text-primary); border-color: var(--line-strong); background: #FFFFFF; box-shadow: 0 2px 8px rgba(24,38,66,.08); }
.tabs[data-variant="task"] .tab.is-active::after { display: none; }
.tab:focus-visible, .nav-item:focus-visible, .top-help-button:focus-visible { outline: 2px solid var(--brand-cyan); outline-offset: 2px; }
.authorization-summary { position: sticky; top: 0; z-index: 2; margin-bottom: 16px; padding: 14px 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(255,255,255,.96); }
.authorization-summary > div { min-width: 0; display: grid; gap: 5px; }
.authorization-summary span { color: var(--text-secondary); font-size: 11px; }
.code-block { overflow: hidden; border: 1px solid #24344F; border-radius: var(--radius-md); background: #101827; }
.code-block header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; color: #EAF0FA; border-bottom: 1px solid rgba(255,255,255,.08); }
.code-block header .gh-button[data-variant="text"] { color: #C8F7FF; }
.code-block pre { margin: 0; padding: 16px; overflow: auto; color: #C8F7FF; font: 12px/1.7 var(--font-number); }

.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.stepper-item { position: relative; display: grid; justify-items: center; gap: 7px; color: var(--text-tertiary); font-size: 11px; text-align: center; }
.stepper-item::before { content: ""; position: absolute; top: 10px; right: 50%; left: -50%; height: 1px; background: var(--line-strong); }
.stepper-item:first-child::before { display: none; }
.stepper-dot { position: relative; z-index: 1; width: 20px; height: 20px; display: grid; place-items: center; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--surface); }
.stepper-item.is-done, .stepper-item.is-active { color: var(--text-primary); }
.stepper-item.is-done .stepper-dot { color: #FFFFFF; border-color: var(--success); background: var(--success); }
.stepper-item.is-active .stepper-dot { border-color: var(--brand-blue); box-shadow: 0 0 0 4px rgba(106,124,255,.12); }

.result-strip { margin-bottom: var(--space-4); padding: 11px 13px; display: flex; align-items: flex-start; gap: 9px; color: var(--info); border: 1px solid rgba(57,118,217,.18); border-radius: var(--radius-sm); background: rgba(57,118,217,.07); }
.result-strip[data-variant="success"] { color: var(--success); border-color: rgba(30,155,102,.20); background: rgba(30,155,102,.07); }
.result-strip[data-variant="warning"] { color: var(--warning); border-color: rgba(200,137,24,.22); background: rgba(200,137,24,.08); }
.result-strip[data-variant="danger"] { color: var(--danger); border-color: rgba(217,86,86,.22); background: rgba(217,86,86,.07); }
.result-strip svg { width: 17px; height: 17px; margin-top: 1px; }
.result-strip strong { display: block; font-size: 12px; }
.result-strip span { display: block; margin-top: 1px; color: var(--text-secondary); font-size: 11px; }

.timeline { position: relative; margin: 0; padding: 0; list-style: none; }
.timeline-item { position: relative; padding: 0 0 20px 26px; }
.timeline-item::before { content: ""; position: absolute; top: 5px; left: 5px; width: 8px; height: 8px; border: 2px solid var(--surface); border-radius: 50%; background: var(--brand-blue); box-shadow: 0 0 0 1px var(--brand-blue); }
.timeline-item::after { content: ""; position: absolute; top: 17px; bottom: 0; left: 9px; width: 1px; background: var(--line-strong); }
.timeline-item:last-child::after { display: none; }
.timeline-title { font-weight: 650; }
.timeline-meta { margin-top: 2px; color: var(--text-tertiary); font-size: 11px; }

.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
.metric-card { padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.metric-label { color: var(--text-secondary); font-size: 12px; }
.metric-value { margin-top: 6px; font-family: var(--font-number); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.metric-trend { margin-top: 3px; color: var(--success); font-family: var(--font-number); font-size: 11px; }

.chart { height: 256px; padding: 12px 14px 8px; border: 1px solid var(--line); border-radius: var(--radius-md); background: linear-gradient(180deg, #FFFFFF, #FBFCFE); }
.chart-heading { height: 24px; display: flex; align-items: center; justify-content: space-between; color: var(--text-tertiary); font-size: 10px; }
.chart-heading .legend-item { color: var(--text-secondary); }
.chart svg { width: 100%; height: calc(100% - 24px); overflow: visible; }
.chart-grid { stroke: #E8EBF2; stroke-width: 1; }
.chart-area { fill: url(#chartGradient); opacity: .72; }
.chart-line { fill: none; stroke: var(--brand-blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart-dot { fill: #FFFFFF; stroke: var(--brand-blue); stroke-width: 2; }
.chart-axis { fill: #7E899B; font-family: var(--font-number); font-size: 10px; text-anchor: end; }

.state-panel { min-height: 520px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.state-content { max-width: 430px; padding: 42px; text-align: center; }
.state-visual { width: 58px; height: 58px; margin: 0 auto 16px; display: grid; place-items: center; color: var(--brand-blue); border-radius: 18px; background: rgba(106,124,255,.10); }
.state-visual svg { width: 28px; height: 28px; }
.state-content h2 { margin: 0 0 8px; font-size: 18px; }
.state-content p { margin: 0 0 20px; color: var(--text-secondary); }
.skeleton-stack { width: 680px; display: grid; gap: 12px; }
.skeleton { height: 16px; border-radius: 5px; background: linear-gradient(90deg, #EEF1F6 25%, #F8F9FB 38%, #EEF1F6 64%); background-size: 400% 100%; animation: skeleton 1.5s ease infinite; }
.skeleton:nth-child(1) { width: 44%; height: 26px; }
.skeleton:nth-child(2) { width: 72%; }
.skeleton:nth-child(3) { width: 100%; height: 92px; }
.skeleton:nth-child(4) { width: 100%; height: 180px; }
@keyframes skeleton { from { background-position: 100% 50%; } to { background-position: 0 50%; } }

@media (max-width: 760px) {
  .gh-button { min-height: 40px; }
  .panel-header { min-height: 0; padding: 15px 16px; align-items: flex-start; flex-direction: column; gap: 5px; }
  .panel-body { padding: 16px; }
  .filter-bar { grid-template-columns: minmax(0, 1fr); }

.game-data-metrics { margin-bottom: 16px; }
.game-dashboard-grid { align-items: start; }
.release-overview { display: grid; gap: 0; }
.release-overview > div { position: relative; min-height: 58px; padding: 8px 0 8px 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }

.release-overview > div:first-child::before { top: 50%; }
.release-overview > div:last-child::before { bottom: 50%; }
.release-overview > div > span:first-child { position: absolute; left: 0; z-index: 1; width: 31px; height: 31px; display: grid; place-items: center; color: var(--text-tertiary); font-size: 11px; border: 1px solid var(--line); border-radius: 50%; background: #FFFFFF; }
.release-overview > div.is-done > span:first-child { color: #FFFFFF; border-color: var(--success); background: var(--success); }
.release-overview > div.is-warning > span:first-child { color: #FFFFFF; border-color: var(--warning); background: var(--warning); }

.data-placeholder { min-height: 150px; display: grid; grid-template-columns: minmax(360px, 1fr) minmax(240px, .6fr); align-items: center; gap: 34px; }
.data-placeholder__chart { height: 112px; padding: 18px 20px 0; display: flex; align-items: flex-end; gap: 8%; border-bottom: 1px solid var(--line); background: linear-gradient(to bottom, rgba(106,124,255,.035), transparent); }
.data-placeholder__chart i { width: 9%; min-height: 10px; border-radius: 5px 5px 0 0; background: linear-gradient(#AEB9FA, #D6DBF9); }
.data-placeholder__chart i:nth-child(1) { height: 20%; }.data-placeholder__chart i:nth-child(2) { height: 31%; }.data-placeholder__chart i:nth-child(3) { height: 46%; }.data-placeholder__chart i:nth-child(4) { height: 39%; }.data-placeholder__chart i:nth-child(5) { height: 64%; }.data-placeholder__chart i:nth-child(6) { height: 54%; }
.data-placeholder strong { color: var(--text-primary); }
.data-placeholder p { margin: 6px 0 0; color: var(--text-secondary); line-height: 1.65; }

/* 测试与发布 */
.release-page-tabs { margin-bottom: 16px; padding: 4px; display: inline-flex; gap: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-muted); }

.release-page-tabs button.is-active { color: var(--text-primary); background: #FFFFFF; box-shadow: 0 2px 8px rgba(24,38,66,.08); }
[data-release-panel][hidden] { display: none; }
.publishing-summary { margin-bottom: 16px; padding: 14px 16px; display: flex; gap: 11px; color: #285E76; border: 1px solid rgba(57,118,217,.18); border-radius: 10px; background: #F1F7FF; }

.publishing-summary strong { display: block; }
.publishing-summary p { margin: 4px 0 0; color: #58758A; }
.release-stage-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.release-stage-card { min-height: 326px; padding: 18px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 13px; background: #FFFFFF; box-shadow: var(--shadow-card); }
.release-stage-card.is-current { border-color: rgba(200,137,24,.42); box-shadow: 0 10px 26px rgba(166,112,12,.10); }
.release-stage-card.is-locked { background: #FAFBFC; }
.release-stage-card > header { display: flex; justify-content: space-between; gap: 12px; }
.release-stage-card__index { color: var(--text-tertiary); font-family: var(--font-number); font-size: 12px; font-weight: 700; }
.release-stage-card__icon { width: 42px; height: 42px; margin: 20px 0 14px; display: grid; place-items: center; color: var(--brand-blue); border-radius: 12px; background: rgba(106,124,255,.10); }
.release-stage-card.is-complete .release-stage-card__icon { color: var(--success); background: rgba(30,155,102,.10); }
.release-stage-card.is-current .release-stage-card__icon { color: var(--warning); background: rgba(200,137,24,.11); }
.release-stage-card__icon svg { width: 22px; height: 22px; }
.release-stage-card h2 { margin: 0 0 7px; font-size: 18px; }
.release-stage-card > p { min-height: 44px; margin: 0; color: var(--text-secondary); line-height: 1.55; }

.release-review-note { margin-top: 14px; min-height: 72px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 1px solid rgba(200,137,24,.22); border-radius: 11px; background: #FFFBF1; }
.release-review-note > div { display: flex; align-items: center; gap: 11px; }
.release-review-note > div > svg { width: 20px; height: 20px; flex: 0 0 auto; color: var(--warning); }
.release-review-note strong, .release-review-note small { display: block; }
.release-review-note small { margin-top: 3px; color: var(--text-secondary); }
.audit-record-summary { margin-bottom: 16px; padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; }
.audit-record-summary > div + div { padding-left: 20px; border-left: 1px solid var(--line); }
.audit-record-summary span, .audit-record-summary strong, .audit-record-summary small { display: block; }
.audit-record-summary span, .audit-record-summary small { color: var(--text-tertiary); }
.audit-record-summary strong { margin: 4px 0; }
.audit-record-list { position: relative; display: grid; gap: 12px; }
.audit-record-list::before { content: ""; position: absolute; top: 20px; bottom: 20px; left: 16px; width: 1px; background: var(--line); }
.audit-record { position: relative; padding-left: 48px; }
.audit-record__node { position: absolute; top: 20px; left: 10px; z-index: 1; width: 13px; height: 13px; border: 3px solid #FFFFFF; border-radius: 50%; background: var(--line-strong); box-shadow: 0 0 0 1px var(--line-strong); }

.api-docs-shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: start; }

@media (max-width: 680px) {

  .platform-progress-track { gap: 10px; }

@media (max-width: 420px) {

    display: grid;

  const renderProductDialog = () => !state.productDialog ? '' : `<div class="d6-dialog-layer"><section class="d6-dialog" role="dialog" aria-modal="true"><header class="d6-dialog-head"><div><h2>编辑商品资料</h2><p>只维护商品定义，价格在定价模块处理。</p></div><button class="d6-dialog-close" type="button" data-action="close-product">×</button></header><div class="d6-dialog-body"><div class="d6-form-grid">${field({label:'商品名称',name:'productName',value:'远征者豪华版',required:true})}${selectField({label:'商品类型',name:'productType',options:['基础游戏','游戏版本','DLC'],value:'游戏版本',required:true})}${field({label:'SKU ID',name:'skuId',value:'SKU-GLOBAL-002',hint:'创建后只读'})}${selectField({label:'供给方式',name:'supplyMethod',options:['直接下载','CDKEY','直接下载 / CDKEY'],value:'直接下载 / CDKEY'})}${textareaField({label:'包含内容',name:'included',value:'游戏本体、数字原声带、远征者外观包。'})}<div class="d6-field wide"><label>价格状态</label><div class="d6-readonly-box"><strong>待定价模块确认</strong><small>本页不提供价格编辑，避免与发布模块产生两份数据。</small></div></div></div></div><footer class="d6-dialog-foot">${button('取消','close-product')}${button('保存商品资料','save-product','primary')}</footer></section></div>`;

  const submitApplicationSnapshot = ({ overseasOnly = false } = {}) => {

    const sequence = String(state.reviewSnapshots.length + 4).padStart(3, '0');
    const snapshot = Object.freeze({

      stage: state.applicationStage,
      stageLabel: stageLabel(state.applicationStage),
      result: 'reviewing',
      accountType: state.accountType,
      contractVersion: 'CONTRACT-20260901-001',
      qualificationVersion: state.qualificationVersion,

      skus: includedSkusForStage(state.applicationStage),
      buildId: 'BUILD-20260904.3',
      priceVersion: state.applicationStage === 'pioneer' ? '测试权益不适用价格' : 'PRICE-20260904.2',
      releaseScope: sourceScope,
      excludedMarkets,
      submittedAt: '2026-09-05 15:30',

  const render = () => {

  const showToast = message => {

    state.applicationDialog = false;
    render();
  };

  const filterGameNavigation = query => {
    const navigation = root.querySelector('.d6-game-nav');
    if (!navigation) return;
    const keyword = String(query || '').trim().toLocaleLowerCase('zh-CN');
    const matches = element => !keyword || String(element.dataset.navLabel || '').toLocaleLowerCase('zh-CN').includes(keyword);
    const primaryItems = [...navigation.querySelectorAll(':scope > button[data-nav-label]')];
    primaryItems.forEach(item => { item.hidden = !matches(item); });
    const group = navigation.querySelector('.d6-nav-group');
    const groupTrigger = group?.querySelector('.d6-nav-group-trigger');
    const secondaryItems = [...(group?.querySelectorAll('.d6-nav-sub button[data-nav-label]') || [])];
    const groupMatched = groupTrigger ? matches(groupTrigger) : false;
    secondaryItems.forEach(item => { item.hidden = Boolean(keyword) && !groupMatched && !matches(item); });
    if (group) group.hidden = Boolean(keyword) && !groupMatched && !secondaryItems.some(item => !item.hidden);
    const hasResult = primaryItems.some(item => !item.hidden) || Boolean(group && !group.hidden);
    const empty = root.querySelector('.d6-nav-empty');
    if (empty) empty.hidden = hasResult;
  };

  root.addEventListener('input', event => {
    if (event.target.matches('[data-nav-search]')) filterGameNavigation(event.target.value);
    if (event.target.matches('[data-market-search]')) {
      const keyword = String(event.target.value || '').trim().toLocaleLowerCase('zh-CN');

      const options = [...root.querySelectorAll('.d6-market-option')];
      options.forEach(option => {
        const code = option.querySelector('[data-market-code]')?.dataset.marketCode?.toLocaleLowerCase('zh-CN') || '';

      });
      const empty = root.querySelector('.d6-market-empty');
      if (empty) empty.hidden = options.some(option => !option.hidden);
    }
  });

  root.addEventListener('change', event => {
    if (event.target.matches('[data-market-code]')) {
      const code = event.target.dataset.marketCode;
      const selected = new Set(state.marketSelectionDraft);
      if (event.target.checked) selected.add(code); else selected.delete(code);
      state.marketSelectionDraft = [...selected];
      root.querySelectorAll(`[data-market-code="${code}"]`).forEach(input => { input.checked = event.target.checked; });
      const count = root.querySelector('[data-market-count]');
      if (count) count.textContent = String(state.marketSelectionDraft.length);
    }
    if (event.target.matches('#mainlandStatus')) {
      state.mainlandStatus = event.target.value;

      const showFields = ['approved', 'change_pending', 'abnormal'].includes(state.mainlandStatus);

  root.addEventListener('click', event => {

      return;

    if (action === 'store-section') { state.mainTab = 'store'; state.section = control.dataset.section || 'profile'; render(); return; }
    if (action === 'back-games') { state.view = 'games'; render(); return; }
    if (action === 'enter-game') { state.view = 'game'; state.mainTab = 'overview'; state.section = 'profile'; render(); return; }
    if (action === 'edit-profile') { state.profileEditing = true; render(); return; }

    }
    if (action === 'profile-language') { state.language = control.dataset.language === 'en' ? 'en' : 'zh'; render(); return; }

      showToast('资质材料已提交平台人工复核，通过前不会放行对应发行范围。');
      return;

    if (action === 'open-product') { state.productDialog = true; render(); return; }
    if (action === 'close-product') { state.productDialog = false; render(); return; }
    if (action === 'save-product') {

      state.skuReady = true;

    if (action === 'edit-release') {

    if (action === 'cancel-release') {

      render();

    }
    if (action === 'save-release') {

    if (action === 'open-market-picker') {
