<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发者平台与企业认证｜盖世游戏开发者平台</title><style>:root {
  --brand-cyan: #38E8FF;
  --brand-blue: #6A7CFF;
  --brand-deep: #101827;
  --brand-night: #0B1220;
  --success: #1E9B66;
  --warning: #C88918;
  --danger: #D95656;
  --info: #3976D9;
  --text-primary: #172033;
  --text-secondary: #5B657A;
  --text-tertiary: #8B94A6;
  --line: #E6E9F0;
  --line-strong: #D5DAE5;
  --surface: #FFFFFF;
  --surface-soft: #F7F8FB;
  --surface-muted: #F0F2F7;
  --nav-text: #AEB8CD;
  --nav-active: #FFFFFF;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --shadow-card: 0 6px 20px rgba(25, 38, 66, 0.06);
  --focus-ring: 0 0 0 3px rgba(56, 232, 255, 0.22);
  --font-sans: "MiSans VF", MiSans, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-number: "D-DIN-PRO", "DIN Alternate", var(--font-sans);
}

* { box-sizing: border-box; }

html, body { min-width: 0; min-height: 100%; margin: 0; }

body {
  color: var(--text-primary);
  background: #E9EDF4;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; }
button, a, select { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.number { font-family: var(--font-number); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

#app { min-width: 0; min-height: 100vh; }

.portal-stage { position: relative; min-width: 0; min-height: 100vh; background: #E9EDF4; }

.product-frame {
  position: relative;
  width: 100%;
  min-width: 0;
  height: 100vh;
  min-height: 0;
  background: var(--surface-soft);
  overflow: hidden;
}

.top-bar {
  position: absolute;
  inset: 0 0 auto 0;
  z-index: 4;
  height: 56px;
  display: flex;
  align-items: center;
  color: #FFFFFF;
  background: linear-gradient(98deg, #0B1220 0%, #15213A 72%, #13243A 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.brand-block {
  width: 232px;
  height: 56px;
  padding: 0 var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  color: inherit;
  text-align: left;
  border-top: 0;
  border-bottom: 0;
  border-left: 0;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  background: transparent;
  cursor: pointer;
}
.brand-block:hover { background: rgba(255,255,255,.045); }

.brand-mark {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: #FFFFFF;
}
.brand-mark svg { width: 32px; height: 32px; }

.brand-copy { min-width: 0; }
.brand-title { color: #FFFFFF; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
.brand-subtitle { color: #B7C2D6; font-size: 11px; }

.top-context { min-width: 0; height: 56px; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-3); color: inherit; border: 0; background: transparent; }
.top-context strong { overflow: hidden; color: #FFFFFF; text-overflow: ellipsis; white-space: nowrap; }
.top-home-link { cursor: pointer; }
.top-home-link:hover { background: rgba(255,255,255,.045); }
.top-account-menu { position: relative; height: 56px; margin-left: 8px; display: flex; align-items: center; }
.top-account { min-width: 176px; height: 56px; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-3); color: #DCE3F0; text-align: left; border: 0; background: transparent; cursor: pointer; }
.top-account:hover, .top-account-menu.is-open .top-account { background: rgba(255,255,255,.05); }
.account-avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: #142039; font-weight: 700; background: linear-gradient(135deg, var(--brand-cyan), #B7C1FF); }
.account-copy { min-width: 0; flex: 1; }
.account-copy strong { display: block; overflow: hidden; color: #FFFFFF; text-overflow: ellipsis; white-space: nowrap; }
.account-copy span { display: block; color: #B7C2D6; font-size: 11px; }
.top-account > svg { width: 15px; height: 15px; flex: 0 0 auto; color: #8998AF; transform: rotate(90deg); transition: transform .16s ease; }
.top-account-menu.is-open .top-account > svg { transform: rotate(-90deg); }
.top-account-dropdown { position: absolute; top: 50px; right: 14px; z-index: 20; width: 170px; padding: 6px; opacity: 0; visibility: hidden; transform: translateY(-4px); border: 1px solid #DDE3EC; border-radius: 10px; background: #FFFFFF; box-shadow: 0 14px 36px rgba(12,22,42,.18); transition: opacity .14s ease, transform .14s ease, visibility .14s; }
.top-account-dropdown::before { content: ""; position: absolute; inset: -8px 0 auto; height: 10px; }
.top-account-menu:hover .top-account-dropdown, .top-account-menu.is-open .top-account-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
.top-account-dropdown button { width: 100%; min-height: 38px; padding: 0 11px; color: var(--text-secondary); text-align: left; border: 0; border-radius: 7px; background: transparent; cursor: pointer; }
.top-account-dropdown button:hover { color: var(--text-primary); background: #F2F5F9; }
.top-help-button, .top-login-button, .top-language-button, .top-console-button { min-height: 36px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: #EAF0FA; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; background: rgba(255,255,255,.06); cursor: pointer; }
.top-help-button, .top-language-button, .top-login-button, .top-console-button { margin-left: 8px; }
.top-help-button:hover, .top-login-button:hover, .top-language-button:hover, .top-console-button:hover { color: #FFFFFF; border-color: rgba(56,232,255,.44); background: rgba(56,232,255,.08); }
.top-help-button.is-active { color: #071522; border-color: var(--brand-cyan); background: linear-gradient(135deg, var(--brand-cyan), #8BEFFF); }
.top-help-button.is-active svg { color: #071522; }
.top-language-button { min-width: 92px; font-weight: 700; }
.top-help-button svg, .top-login-button svg, .top-console-button svg { width: 16px; height: 16px; color: var(--brand-cyan); }
.top-language-button + .top-account-menu, .top-language-button + .top-account { margin-left: 8px; }
.top-context + .top-account-menu, .top-context + .top-account, .top-context + .top-login-button, .top-context + .top-help-button { margin-left: auto; }
.top-login-button[hidden], .top-help-button[hidden], .top-console-button[hidden] { display: none; }
.product-frame[data-role="developer"] .top-help-button,
.product-frame[data-role="developer"] .top-language-button,
.product-frame[data-role="developer"] .top-console-button { color: #C7D1E0; border-color: transparent; background: transparent; }
.product-frame[data-role="developer"] > .top-bar > .top-help-button { margin-left: auto; }
.product-frame[data-role="developer"] .top-help-button:hover,
.product-frame[data-role="developer"] .top-language-button:hover,
.product-frame[data-role="developer"] .top-console-button:hover { color: #FFFFFF; border-color: transparent; background: rgba(255,255,255,.06); }
.product-frame[data-role="developer"] .top-help-button.is-active { color: var(--brand-cyan); border-color: transparent; background: rgba(56,232,255,.08); }
.product-frame[data-role="developer"] .top-help-button.is-active svg { color: var(--brand-cyan); }
.product-frame[data-role="developer"] .top-login-button { color: #071522; font-weight: 700; border-color: transparent; background: linear-gradient(135deg, var(--brand-cyan), #9AF2FF); }
.product-frame[data-role="developer"] .top-login-button:hover { color: #071522; border-color: transparent; background: linear-gradient(135deg, #5DEEFF, #AEF5FF); }
.product-frame.is-login.is-help-open > .top-bar { height: 64px; padding-right: clamp(20px, 2vw, 32px); padding-left: clamp(20px, 2vw, 32px); }
.product-frame.is-login.is-help-open > .top-bar .brand-block { width: auto; height: 64px; padding: 0; border-right: 0; }
.product-frame.is-login.is-help-open .workspace { inset: 64px 0 0; }

.side-nav {
  position: absolute;
  inset: 56px auto 0 0;
  z-index: 3;
  width: 232px;
  min-height: 0;
  padding: var(--space-5) var(--space-3);
  overflow-y: auto;
  color: var(--nav-text);
  background: var(--brand-deep);
  border-right: 1px solid rgba(255,255,255,.05);
}

.nav-label { padding: 0 10px var(--space-2); color: #64728D; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.nav-list { display: grid; gap: var(--space-1); }
.nav-item { position: relative; min-height: 42px; padding: 9px 10px; display: flex; align-items: center; gap: 10px; color: #AAB7CA; border-radius: var(--radius-sm); transition: color .15s, background .15s; }
.nav-item:hover { color: #EDF2FA; background: rgba(255,255,255,.05); }
.nav-item.is-active { color: #FFFFFF; background: linear-gradient(90deg, rgba(56,232,255,.20), rgba(106,124,255,.14)); }
.nav-item.is-active::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand-cyan); }
.nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
.nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-nav button.nav-item { width: 100%; border: 0; text-align: left; background: transparent; cursor: pointer; }
.side-nav button.nav-item:hover { background: rgba(255,255,255,.05); }
.side-nav button.nav-item.is-active { background: linear-gradient(90deg, rgba(56,232,255,.20), rgba(106,124,255,.14)); }
.workspace { position: absolute; inset: 56px 0 0 232px; min-width: 0; min-height: 0; overflow: auto; background: var(--surface-soft); }
.product-frame.is-login > .top-bar { display: none; }
.product-frame.is-login .workspace { inset: 0; }
.product-frame.is-login.is-help-open > .top-bar { display: flex; }
.product-frame.is-login.is-help-open .workspace { inset: 64px 0 0; }
.product-frame.is-onboarding .workspace { left: 0; }
.product-frame.is-entry-choice .workspace { background: #091426; }
.product-frame.is-entry-choice .page-wrap { min-height: 100%; padding-top: 24px; }
.product-frame.is-help-open .workspace { left: 0; }
.product-frame.is-help-open .side-nav,
.product-frame.is-help-open .context-bar,
.product-frame.is-help-open .platform-tab-bar { display: none; }
.product-frame.is-login .page-wrap { padding: 0; }
.context-bar { height: 48px; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-2); color: var(--text-secondary); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.88); }
.context-bar svg { width: 15px; height: 15px; color: var(--text-tertiary); }
.context-divider { color: var(--line-strong); }
.context-value { color: var(--text-primary); font-weight: 600; }

.platform-tab-bar {
  position: absolute;
  inset: 56px 0 auto;
  z-index: 3;
  height: 56px;
  display: flex;
  align-items: stretch;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  background: #FFFFFF;
  box-shadow: 0 2px 8px rgba(20, 35, 58, .04);
}
.platform-tab-list {
  min-width: 0;
  padding: 0 clamp(20px, 2.4vw, 48px);
  display: flex;
  align-items: stretch;
  gap: clamp(28px, 3.2vw, 56px);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.platform-tab-list::-webkit-scrollbar { display: none; }
.platform-tab {
  position: relative;
  min-width: max-content;
  padding: 0 2px;
  flex: 0 0 auto;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  border: 0;
  background: transparent;
  cursor: pointer;
  transition: color .15s ease;
}
.platform-tab:hover { color: var(--brand-blue); }
.platform-tab::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: transparent;
}
.platform-tab.is-active { color: #08AEC8; }
.platform-tab.is-active::after { background: linear-gradient(90deg, #08C9D6, #24B7E5); }
.platform-tab:focus-visible { outline: 2px solid var(--brand-cyan); outline-offset: -4px; border-radius: 4px; }
.product-frame.is-platform-console .workspace { inset: 112px 0 0; }
.product-frame.is-platform-console.is-help-open .workspace { inset: 56px 0 0; }

.page-wrap { min-width: 0; padding: var(--space-6) var(--space-8) 48px; }
.page-header { min-height: 66px; margin-bottom: var(--space-5); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-6); }
.page-header > :first-child { min-width: 0; flex: 1 1 auto; }
.page-eyebrow { margin-bottom: 4px; color: var(--brand-blue); font-family: var(--font-number); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.page-title { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -.02em; }
.page-summary { max-width: 720px; margin: 7px 0 0; color: var(--text-secondary); }
.page-actions { padding-top: 2px; display: flex; flex: 0 0 auto; align-items: center; gap: var(--space-2); }

.help-center { min-height: calc(100vh - 56px); padding: 20px var(--space-8) 32px; }
.help-center__header { min-height: 68px; margin-bottom: 16px; display: flex; justify-content: space-between; gap: 24px; align-items: center; }
.help-center__heading { min-width: 0; display: flex; gap: 16px; align-items: center; }
.help-center__header .text-back { margin: 0; }
.help-center__header h1 { margin: 0; font-size: 24px; }
.help-search { width: min(420px, 40vw); height: 40px; display: flex; flex: 0 0 auto; overflow: hidden; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: #FFFFFF; }
.help-search:focus-within { border-color: var(--brand-blue); box-shadow: 0 0 0 3px rgba(106,124,255,.10); }
.help-search input { min-width: 0; padding: 0 12px; flex: 1 1 auto; color: var(--text-primary); border: 0; background: transparent; outline: none; }
.help-search input::placeholder { color: var(--text-tertiary); }
.help-search input[aria-invalid="true"] { background: #FFF9F9; }
.help-search button { min-width: 84px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: #071522; font-weight: 650; border: 0; border-left: 1px solid var(--line); background: linear-gradient(135deg, var(--brand-cyan), #8BEFFF); cursor: pointer; }
.help-search button:hover { filter: brightness(.98); }
.help-search button svg { width: 16px; height: 16px; }
.help-library { min-height: calc(100vh - 160px); display: grid; grid-template-columns: 292px minmax(0, 1fr); overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-md); background: #FFFFFF; box-shadow: var(--shadow-card); }
.help-library__nav { min-width: 0; overflow-y: auto; background: #F5F7FA; border-right: 1px solid var(--line); }
.help-library__nav-title { height: 48px; padding: 0 20px; display: flex; align-items: center; color: var(--text-primary); font-weight: 700; border-bottom: 1px solid var(--line); }
.help-library__nav nav { padding: 12px 10px 24px; }
.help-nav-group + .help-nav-group { margin-top: 14px; }
.help-nav-group h2 { margin: 0; padding: 0 10px 6px; color: var(--text-tertiary); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.help-nav-subgroup-title { margin: 10px 10px 4px; color: #8B95A6; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.help-nav-item { width: 100%; min-height: 40px; padding: 8px 10px; display: flex; align-items: flex-start; gap: 9px; color: var(--text-secondary); text-align: left; line-height: 1.45; border: 0; border-radius: var(--radius-sm); background: transparent; cursor: pointer; }
.help-nav-item:hover { color: var(--text-primary); background: rgba(106,124,255,.07); }
.help-nav-item.is-active { color: #2335A0; font-weight: 650; background: rgba(106,124,255,.12); }
.help-nav-item svg { width: 16px; height: 16px; margin-top: 2px; flex: 0 0 auto; }
.help-library__content { min-width: 0; overflow-y: auto; background: #FFFFFF; }
.help-article { max-width: 980px; padding: 38px 48px 56px; }
.help-article[hidden], .help-search-results[hidden] { display: none; }
.help-breadcrumb { display: flex; align-items: center; gap: 7px; color: var(--text-tertiary); font-size: 12px; }
.help-breadcrumb span { color: var(--line-strong); }
.help-article > h1 { margin: 12px 0 10px; color: var(--text-primary); font-size: 30px; line-height: 1.3; letter-spacing: -.02em; }
.help-article__lead { margin: 0; padding-bottom: 24px; color: var(--text-secondary); font-size: 15px; line-height: 1.8; border-bottom: 1px solid var(--line); }
.help-article section { padding-top: 24px; }
.help-article section + section { margin-top: 2px; }
.help-article section h2 { margin: 0 0 12px; font-size: 18px; }
.help-article ol, .help-article ul { margin: 0; padding-left: 22px; color: var(--text-secondary); line-height: 1.8; }
.help-article li + li { margin-top: 8px; }
.help-note { margin-top: 28px; padding: 15px 16px; display: flex; gap: 11px; color: #0B6271; border: 1px solid rgba(47,215,239,.28); border-radius: var(--radius-sm); background: #EFFCFE; }
.help-note > svg { width: 18px; height: 18px; margin-top: 2px; flex: 0 0 auto; }
.help-note strong { display: block; }
.help-note p { margin: 4px 0 0; color: #376D78; line-height: 1.65; }
.help-search-results { max-width: 1040px; padding: 38px 48px 56px; }
.help-search-summary { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.help-search-summary > span { color: var(--brand-blue); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.help-search-summary h1 { margin: 8px 0 6px; font-size: 25px; }
.help-search-summary p { margin: 0; color: var(--text-secondary); }
.help-result-list { display: grid; }
.help-result-item { border-bottom: 1px solid var(--line); }
.help-result-item button { width: 100%; padding: 22px 0; display: block; color: var(--text-primary); text-align: left; border: 0; background: transparent; cursor: pointer; }
.help-result-item button:hover h2 { color: var(--brand-blue); }
.help-result-item button > span { color: var(--text-tertiary); font-size: 12px; }
.help-result-item h2 { margin: 6px 0 7px; font-size: 18px; }
.help-result-item p { margin: 0; color: var(--text-secondary); line-height: 1.75; }
.help-result-item mark { padding: 0 2px; color: inherit; background: #FFE07A; border-radius: 2px; }
.help-search-empty { min-height: 360px; display: grid; place-content: center; justify-items: center; color: var(--text-secondary); text-align: center; }
.help-search-empty strong { color: var(--text-primary); font-size: 18px; }
.help-search-empty p { margin: 8px 0 0; }

/* 单游戏控制台导航 */
.side-nav--game { padding-top: 12px; }
.game-nav-back { min-height: 36px; margin-bottom: 12px; padding: 7px 9px; display: flex; align-items: center; gap: 7px; color: #8E9DB3; font-size: 12px; border-radius: 8px; }
.game-nav-back:hover { color: #FFFFFF; background: rgba(255,255,255,.05); }
.game-nav-back svg { width: 15px; height: 15px; transform: rotate(180deg); }
.game-nav-current { margin-bottom: 18px; padding: 12px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,.08); border-radius: 11px; background: rgba(255,255,255,.045); }
.game-nav-current > div { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto; color: #06131E; border-radius: 10px; background: linear-gradient(145deg, var(--brand-cyan), #8995FF); }
.game-nav-current > div svg { width: 21px; height: 21px; }
.game-nav-current strong, .game-nav-current small { display: block; }
.game-nav-current strong { overflow: hidden; color: #FFFFFF; text-overflow: ellipsis; white-space: nowrap; }
.game-nav-current small { margin-top: 3px; color: #7889A2; font-family: var(--font-number); font-size: 10px; }
.nav-group-label { margin-top: 10px; padding: 10px 10px 5px; color: #64728D; font-size: 10px; font-weight: 700; letter-spacing: .07em; }
.side-nav--game .nav-item { min-height: 40px; }

@media (max-width: 1360px) {
  .page-wrap { padding-right: 24px; padding-left: 24px; }
  .help-center { padding-right: 24px; padding-left: 24px; }
  .help-library { grid-template-columns: 270px minmax(0, 1fr); }
  .help-article, .help-search-results { padding-right: 36px; padding-left: 36px; }
}

@media (max-width: 1180px) {
  .brand-block, .side-nav { width: 212px; }
  .workspace { left: 212px; }
  .product-frame.is-login .workspace { inset: 0; }
  .product-frame.is-onboarding .workspace { left: 0; }
  .product-frame.is-help-open .workspace { left: 0; }
  .top-context { padding-right: 16px; padding-left: 16px; }
  .top-account { padding-right: 16px; padding-left: 12px; }
  .page-wrap, .help-center { padding-right: 20px; padding-left: 20px; }
  .page-header { gap: 16px; }
  .page-title, .help-center__header h1 { font-size: 22px; }
  .help-library { grid-template-columns: 248px minmax(0, 1fr); }
  .help-article, .help-search-results { padding: 30px 32px 48px; }
  .help-article > h1 { font-size: 26px; }
}

/* 发行平台运营后台：对齐南京 gamesir-dashboard 的浅色框架 */

.gh-icon { width: 18px; height: 18px; flex: 0 0 auto; }

.gh-button {

.gh-input, .gh-select, .gh-textarea { width: 100%; color: var(--text-primary); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); transition: border .15s, box-shadow .15s; }

.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }

.page-button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }

.tabs { margin-bottom: var(--space-4); display: flex; gap: var(--space-5); border-bottom: 1px solid var(--line); }

.authorization-summary { position: sticky; top: 0; z-index: 2; margin-bottom: 16px; padding: 14px 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(255,255,255,.96); }

.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.stepper-item { position: relative; display: grid; justify-items: center; gap: 7px; color: var(--text-tertiary); font-size: 11px; text-align: center; }
.stepper-item::before { content: ""; position: absolute; top: 10px; right: 50%; left: -50%; height: 1px; background: var(--line-strong); }
.stepper-item:first-child::before { display: none; }

.result-strip { margin-bottom: var(--space-4); padding: 11px 13px; display: flex; align-items: flex-start; gap: 9px; color: var(--info); border: 1px solid rgba(57,118,217,.18); border-radius: var(--radius-sm); background: rgba(57,118,217,.07); }

.timeline { position: relative; margin: 0; padding: 0; list-style: none; }

.verified-publisher { min-width: 244px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(56,232,255,.20); border-radius: 12px; background: rgba(9,18,34,.28); }
.verified-publisher > svg { width: 26px; height: 26px; padding: 5px; color: #0D2931; border-radius: 50%; background: var(--brand-cyan); }

.verified-publisher small { margin-top: 3px; color: #9FB1C8; }
.game-library { margin-top: 18px; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: #FFFFFF; box-shadow: var(--shadow-card); }

.game-card-grid { display: grid; grid-template-columns: minmax(250px, .72fr) minmax(420px, 1.28fr); gap: 16px; }
.create-game-card, .game-project-card { min-height: 256px; overflow: hidden; color: inherit; text-align: left; border: 1px solid var(--line); border-radius: 14px; background: #FFFFFF; cursor: pointer; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
.create-game-card:hover, .game-project-card:hover { transform: translateY(-2px); border-color: #9AA9FF; box-shadow: 0 12px 28px rgba(35,52,88,.12); }

.create-game-card { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); text-align: center; border-style: dashed; background: linear-gradient(145deg, #FBFCFE, #F4F7FB); }
.create-game-card__icon { width: 54px; height: 54px; margin-bottom: 14px; display: grid; place-items: center; color: #3347B6; font-family: var(--font-number); font-size: 31px; font-weight: 400; border-radius: 15px; background: rgba(106,124,255,.12); }
.create-game-card strong { color: var(--text-primary); font-size: 17px; }

.game-project-card__cover { position: relative; min-height: 256px; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 64% 28%, rgba(58,226,242,.92), transparent 18%), radial-gradient(circle at 42% 56%, rgba(84,107,244,.82), transparent 32%), linear-gradient(150deg, #071625, #1B315F 58%, #0B7185); }
.game-project-card__cover::before, .game-project-card__cover::after { content: ""; position: absolute; width: 180px; height: 180px; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; }
.game-project-card__cover::after { width: 112px; height: 112px; border-color: rgba(56,232,255,.38); }
.game-project-card__art { position: relative; z-index: 1; width: 64px; height: 64px; display: grid; place-items: center; color: #FFFFFF; border: 1px solid rgba(255,255,255,.24); border-radius: 20px; background: rgba(5,15,28,.35); box-shadow: 0 10px 24px rgba(0,0,0,.22); }
.game-project-card__art svg { width: 34px; height: 34px; }
.game-project-card__state { position: absolute; right: 12px; bottom: 12px; left: 12px; z-index: 1; padding: 8px 10px; color: #FFF1C7; font-size: 12px; font-weight: 650; text-align: center; border-radius: 8px; background: rgba(72,45,5,.78); backdrop-filter: blur(8px); }

.game-project-card__heading small { margin-top: 5px; color: var(--text-tertiary); }

.game-project-card__ids { margin-top: 18px; display: grid; gap: 6px; color: var(--text-secondary); font-family: var(--font-number); font-size: 12px; }
.game-project-card__progress { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.game-project-card__progress i { height: 5px; border-radius: 999px; background: #E4E8EF; }
.game-project-card__progress i.is-done { background: var(--success); }
.game-project-card__progress i.is-warning { background: var(--warning); }
.game-project-card__footer { margin-top: 9px; display: flex; justify-content: space-between; gap: 12px; color: var(--text-secondary); font-size: 11px; }

.workspace-notice { margin-top: 16px; min-height: 72px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border: 1px solid rgba(200,137,24,.22); border-radius: 12px; background: #FFFBF1; }

.game-console-hero__copy > span, .game-console-hero__stage > span { color: #91A2BB; font-size: 11px; }

.release-overview { display: grid; gap: 0; }
.release-overview > div { position: relative; min-height: 58px; padding: 8px 0 8px 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.release-overview > div::before { content: ""; position: absolute; top: 0; bottom: 0; left: 15px; width: 1px; background: var(--line); }
.release-overview > div:first-child::before { top: 50%; }
.release-overview > div:last-child::before { bottom: 50%; }
.release-overview > div > span:first-child { position: absolute; left: 0; z-index: 1; width: 31px; height: 31px; display: grid; place-items: center; color: var(--text-tertiary); font-size: 11px; border: 1px solid var(--line); border-radius: 50%; background: #FFFFFF; }
.release-overview > div.is-done > span:first-child { color: #FFFFFF; border-color: var(--success); background: var(--success); }
.release-overview > div.is-warning > span:first-child { color: #FFFFFF; border-color: var(--warning); background: var(--warning); }
.release-overview > div > span:first-child svg { width: 15px; height: 15px; }

.console-todo { padding-bottom: 15px; }

.console-todo__level { display: inline-flex; margin-bottom: 8px; padding: 3px 7px; color: #955D00; font-size: 10px; font-weight: 700; border-radius: 4px; background: #FFF1C7; }

.console-todo p { margin: 5px 0 12px; color: var(--text-secondary); line-height: 1.6; }

.data-placeholder { min-height: 150px; display: grid; grid-template-columns: minmax(360px, 1fr) minmax(240px, .6fr); align-items: center; gap: 34px; }
.data-placeholder__chart { height: 112px; padding: 18px 20px 0; display: flex; align-items: flex-end; gap: 8%; border-bottom: 1px solid var(--line); background: linear-gradient(to bottom, rgba(106,124,255,.035), transparent); }
.data-placeholder__chart i { width: 9%; min-height: 10px; border-radius: 5px 5px 0 0; background: linear-gradient(#AEB9FA, #D6DBF9); }
.data-placeholder__chart i:nth-child(1) { height: 20%; }.data-placeholder__chart i:nth-child(2) { height: 31%; }.data-placeholder__chart i:nth-child(3) { height: 46%; }.data-placeholder__chart i:nth-child(4) { height: 39%; }.data-placeholder__chart i:nth-child(5) { height: 64%; }.data-placeholder__chart i:nth-child(6) { height: 54%; }
.data-placeholder strong { color: var(--text-primary); }
.data-placeholder p { margin: 6px 0 0; color: var(--text-secondary); line-height: 1.65; }

/* 测试与发布 */

.release-page-tabs button { min-width: 112px; min-height: 36px; padding: 0 16px; color: var(--text-secondary); font-weight: 650; border: 0; border-radius: 7px; background: transparent; cursor: pointer; }

.publishing-summary { margin-bottom: 16px; padding: 14px 16px; display: flex; gap: 11px; color: #285E76; border: 1px solid rgba(57,118,217,.18); border-radius: 10px; background: #F1F7FF; }

.release-stage-card > header { display: flex; justify-content: space-between; gap: 12px; }

.release-stage-card__icon { width: 42px; height: 42px; margin: 20px 0 14px; display: grid; place-items: center; color: var(--brand-blue); border-radius: 12px; background: rgba(106,124,255,.10); }

.audit-record-summary { margin-bottom: 16px; padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; }

.audit-record-summary span, .audit-record-summary strong, .audit-record-summary small { display: block; }

.audit-record-summary strong { margin: 4px 0; }
.audit-record-list { position: relative; display: grid; gap: 12px; }

.audit-record__main > footer { padding-top: 12px; display: flex; align-items: center; gap: 18px; color: var(--text-tertiary); font-size: 12px; border-top: 1px solid var(--line); }
.audit-record__main > footer .gh-button { margin-left: auto; }

/* 企业认证介绍、单页申请与 Demo 状态演示 */

<textarea id="portal-data" hidden aria-hidden="true">{"accounts":{"developer":{"name":"王明","roleName":"已确认开发者"},"operations":{"name":"李然","roleName":"平台发行运营"},"tester":{"name":"陈宇","roleName":"平台测试人员"}},"context":{"vendorId":"VEN-202609-001","vendorName":"星海互动","gameId":"GAME-48291","gameName":"星海远征","versionId":"VER-100","versionName":"1.0.0","appId":"APP-7F3A9C","campaignId":"CMP-202609-001","querySnapshotId":"QRY-20260903-001"},"helpCenter":{"title":"帮助中心","faq":[{"id":"developer-verification","category":"账号与认证","question":"如何完成开发者认证？","answer":"填写主体、品牌和联系人资料并提交，平台录入线下确认结果后即可取得开发者资格。","steps":["进入“开发者认证”，选择主体类型和注册国家／地区。","填写主体法定名称、登记编号、品牌与联系人信息。","确认资料无误后提交，等待平台录入线下确认结果。"],"details":["认证资料支持在提交前保存草稿。","资料需要修改时，按页面反馈修订后重新提交。"],"note":"开发者资格以平台已录入的确认结果为准。"},{"id":"create-game-appid","category":"游戏与 APPID","question":"如何创建游戏并获取 APPID？","answer":"完成开发者认证后创建游戏并提交资料；项目确认后系统会生成唯一 APPID。","steps":["进入“游戏管理”，点击“创建游戏”。","填写游戏基础信息、发行信息和支持平台后提交资料。","游戏项目确认后，在“APPID 与 SDK 接入”中查看唯一 APPID。"],"details":["每个已确认的游戏项目对应唯一 APPID。","APPID 用于 SDK 接入和后续版本、发行数据关联。"]},{"id":"download-sdk-docs","category":"游戏与 APPID","question":"在哪里下载 SDK 和查看接入文档？","answer":"进入 APPID 与 SDK 接入页，可按系统下载 SDK、核对校验值并打开接入文档。","steps":["在左侧导航进入“APPID 与 SDK 接入”。","选择 Windows、macOS 或 Linux 对应 SDK。","下载后核对版本号与 SHA-256 校验值，再按接入文档完成配置。"],"details":["三个系统使用同一 APPID，分别下载对应平台的 SDK。","接入文档仅对已授权的开发者账号开放。"]},{"id":"create-key-batch","category":"CDKEY","question":"如何创建 Key 批次？","answer":"确认游戏、SKU、渠道、额度和有效期均在授权范围内后，在 Key 批次中提交创建。","steps":["进入“CDKEY 商品与供给”，切换到“Key 批次”。","选择游戏、SKU、渠道并填写生成数量和有效期。","提交创建后，在一次性有效窗口内下载 Key 文件。"],"details":["Key 明文仅在创建成功后提供一次性下载。","后续只保留批次、数量、状态和审计记录。"],"note":"请在下载后妥善保存 Key 文件，关闭一次性窗口后不能再次查看明文。"},{"id":"lost-client-secret","category":"CDKEY","question":"Secret 丢失怎么办？","answer":"Secret 不支持再次查看，请轮换凭据并更新第三方渠道配置。","steps":["进入“渠道 API”，找到对应渠道凭据。","执行“轮换凭据”，并立即保存新 Secret。","在第三方渠道更新配置并完成接口验证。"],"details":["新 Secret 仅显示一次，关闭后只展示末四位。","凭据轮换后，旧 Secret 立即失效。"],"note":"为避免渠道调用中断，请先准备好第三方渠道的配置更新窗口。"},{"id":"resume-build-upload","category":"包体与发布","question":"包体上传中断后需要重新上传吗？","answer":"已完成的分片会保留；重新进入 Build 详情后可从中断位置继续上传。","steps":["返回对应版本的“包体上传与 Build 详情”。","确认中断原因和已完成的上传进度。","点击“继续上传”，完成剩余分片与完整性校验。"],"details":["已完成分片不会因网络中断而重复上传。","完整性校验通过后才能继续提交测试。"]},{"id":"publish-after-test","category":"包体与发布","question":"测试通过后如何发布版本？","answer":"平台完成上架结论并确认发布条件后，由发行运营配置立即发布或定时发布。","steps":["在版本详情确认测试结果与上架结论。","确认目标系统、CPU 架构和对应 Release Pointer。","由发行运营配置立即发布或定时发布，并保留发布记录。"],"details":["测试通过不等于版本已经发布。","历史 Build、Manifest 与 Chunk 会继续保留，可用于回滚。"]},{"id":"data-refresh-frequency","category":"经营数据","question":"经营数据多久更新一次？","answer":"交易与 Key 数据按小时更新，客户端下载、更新与首次启动数据次日更新。","sectionTitle":"更新频率","steps":["交易、退款与 Key 供给／兑换：按小时更新。","客户端下载、更新与首次启动：次日更新。"],"details":["看板与导出使用同一查询条件时，应保持相同的数据口径。","数据尚未完成更新时，请以页面标注的最近更新时间为准。"]},{"id":"key-source-difference","category":"CDKEY","question":"盖世平台 Key 和外部平台 Key 有什么区别？","answer":"盖世平台 Key 由盖世兑换服务校验；Steam、Epic、GOG 等 Key 必须由对应平台或供应商提供。","sectionTitle":"两类 Key 的来源","steps":["盖世平台 Key：由开发者后台按授权额度生成，供指定渠道分配和兑换。","外部平台 Key：由 Steam、Epic、GOG 等对应平台或供应商提供，再按供给配置导入。"],"details":["开发者后台不能代替外部平台生成其 Key。","两类 Key 分别保留供给、分配、兑换和对账记录。"]}],"contact":{"supportName":"盖世游戏开发者支持","serviceHours":"服务时间以合作对接安排为准","channel":"合作群／项目对接人","email":"dev@xiaoji.com","fallback":"紧急问题请联系当前项目对接人"}},"managedContent":{"revision":1,"publishedAt":"2026-09-03 10:00","publishedBy":"平台运营 李然","zh":{"introTitle":"加入盖世游戏开发者平台，开展正版发行合作","introDescription":"本流程将引导企业完成身份核验与合作授权。请先了解申请流程、资料要求和内容规范，再一次性提交企业主体、银行结算、厂商联系人及协议签署信息。","introSteps":["了解平台合作范围与内容规范","准备企业工商及银行结算资料","阅读并确认平台合作协议","一次性提交企业认证申请","审核通过后开通发行合作能力"],"introRequirements":["企业法定名称、注册地区、注册地址及工商执照号码","清晰有效的工商执照证明图片","与企业法定名称一致的银行账户及证明图片","厂商品牌、联系人和账单接收邮箱","有权代表企业签署协议的授权人员信息"],"introRules":["提交的游戏及素材必须合法合规，并已取得完整权利或充分授权。","不得提交含恶意代码、病毒、欺诈或未经授权收集敏感信息的内容。","不得提交侵犯第三方知识产权、隐私权或其他合法权益的内容。","具体游戏的接入、测试、审核与发行安排，以后续产品配置及双方确认结果为准。"],"introReviewNote":"平台运营通常在资料提交后的 5 个工作日内完成审核。提交成功不代表认证通过；审核结果与处理记录可在开发者控制台持续查看。","ndaTitle":"《盖世游戏开发者平台保密协议》","ndaBody":"盖世游戏开发者平台保密协议\n\n一、协议主体与生效\n本协议由盖世游戏开发者平台运营方（以下简称“平台方”）与申请企业（以本页填写的企业法定名称为准，以下简称“合作方”）共同订立。合作方的授权代表在本页确认接受并提交申请后，本协议对合作方生效；平台方确认合作申请或开始向合作方披露保密信息后，本协议对双方生效。\n\n二、保密信息\n“保密信息”是指一方及其关联方以书面、口头、电子或其他方式向另一方披露的，已经标明保密或者依其性质、披露场景应被合理理解为保密的信息，包括但不限于未发布的游戏、产品规划、源代码与技术资料、测试版本、接口文档、账号与权限、运营方案、投放计划、商务条件、定价与结算数据、用户与交易数据、协议条款以及包含前述信息的复制件、摘要和衍生资料。\n\n三、不属于保密信息的情形\n接收方能够以书面证据证明下列任一情形的，不属于保密信息：接收时已合法公开的信息；接收方在披露前已合法知悉且不负保密义务的信息；接收方未使用披露方保密信息而独立开发的信息；从有权披露且不受保密限制的第三方合法取得的信息；经披露方书面同意公开的信息。\n\n四、使用与披露限制\n接收方仅可为评估、建立和履行盖世游戏开发者平台合作关系使用保密信息，不得用于竞争、侵权或其他与合作无关的目的。除确有知悉必要且已承担不低于本协议保护义务的员工、关联方、专业顾问或服务商外，接收方不得向任何第三方披露保密信息。未经披露方书面许可，接收方不得对获得的软件、接口、样品或技术资料实施反向工程、反编译、拆解或规避安全措施，但法律明确允许且不得排除的情形除外。\n\n五、安全保护义务\n接收方应采取不低于保护自身同类重要信息的合理安全措施，包括访问权限控制、账号与凭据保护、传输和存储保护、人员保密管理及必要的日志留存。发生或可能发生未经授权的访问、使用、披露、丢失或泄露时，接收方应及时通知披露方，说明已知影响，并采取合理措施控制和补救。\n\n六、依法披露\n接收方因法律法规、司法机关、行政机关或证券监管要求必须披露保密信息时，应在法律允许范围内及时通知披露方，并仅披露依法必须披露的最小范围；接收方应合理协助披露方申请保密审理、保护令或其他救济。\n\n七、返还与销毁\n合作终止、披露方提出书面要求或保密信息已无继续使用必要时，接收方应停止使用，并按披露方要求返还或销毁其控制范围内的保密信息及复制件；法律法规、合规审计或自动备份机制要求保留的部分除外，但保留信息仍受本协议约束。\n\n八、知识产权与无授权\n保密信息及其相关知识产权始终归披露方或其合法权利人所有。除为履行合作所必需的有限使用权外，披露行为不构成任何专利、著作权、商标、商业秘密或其他权利的转让、许可或承诺，也不构成对合作、采购、发行或投资结果的保证。\n\n九、违约与救济\n任何一方违反本协议，给另一方造成损失的，应依法承担违约责任并赔偿可证明的直接损失及合理维权费用。双方确认，擅自披露或使用保密信息可能造成难以用金钱完全弥补的损害，守约方有权依法申请停止侵害、行为保全或其他救济。\n\n十、期限与存续\n本协议自生效之日起持续有效，直至双方书面终止合作。保密义务在相关信息依法公开前持续有效；涉及商业秘密、个人信息、账号凭据和依法应持续保护的信息，其保护义务不因合作终止而消灭。\n\n十一、适用法律与争议解决\n本协议的订立、效力、解释和履行适用中华人民共和国法律。争议应先友好协商；协商不成的，按双方后续书面确认的争议解决条款处理；未另行约定时，任何一方可向平台运营主体住所地有管辖权的人民法院提起诉讼。\n\n十二、其他\n未经另一方书面同意，任何一方不得转让本协议项下主要权利义务，但因合并、分立、资产或业务整体转让而由合法承继主体承接的除外。部分条款无效不影响其他条款效力。本协议与双方后续签署的专项保密条款冲突时，以双方明确约定优先适用的文本为准。平台可基于法律、业务或安全需要更新协议，并在开发者平台展示当前生效版本；新版本仅对合作方再次确认后发生效力。","distributionTitle":"《盖世游戏开发者平台发行合作协议》","distributionBody":"盖世游戏开发者平台发行合作协议\n\n一、协议主体与合作目的\n本协议由盖世游戏开发者平台运营方（以下简称“平台方”）与申请企业（以本页填写的企业法定名称为准，以下简称“合作方”）订立。双方拟通过盖世游戏开发者平台完成游戏资料接入、测试审核、商品配置、包体与版本管理、发行推广、授权校验、渠道供给及经营数据查看等合作。合作方的授权代表确认本协议并提交企业认证申请，不当然代表具体游戏已获准发行；每款游戏的合作范围以平台配置、审核结果及双方后续确认文件为准。\n\n二、定义\n“合作产品”指合作方提交并经平台方确认接入的游戏、DLC、附加内容、更新及本地化版本；“平台”指盖世游戏开发者平台及其面向用户提供发行服务的相关产品；“用户”指通过平台获取、购买、预约、下载、激活或使用合作产品的自然人；“盖世 Key”指由平台依授权规则生成并用于验证合作产品权益的授权码；“外部 Key”指由第三方平台或合作方提供、并由平台受控管理的授权码；“净收入”指用户实付收入扣除依法代收税费、退款、拒付、渠道费用及双方书面确认的其他调整项后的金额。\n\n三、合作资格与授权\n合作方声明其具有签署和履行本协议的完整权利与授权，对合作产品、商标、宣传素材、音乐、美术、字体、人物形象、数据及其他交付内容拥有完整权利或已取得充分许可。合作方授予平台方在双方确认的产品、地区、渠道、语言和期限内，为接入、测试、展示、宣传、销售、交付、下载、更新、客服和运营分析之目的，对合作产品及素材进行必要复制、存储、传输、展示、执行、格式转换和非实质性适配的非独占许可。具体授权范围可由单款游戏配置或补充协议限定。\n\n四、产品与资料交付\n合作方应按平台要求提交真实、准确、完整且持续有效的企业、银行、联系人、游戏、商品、权利证明、分级、隐私和合规资料，并在资料发生变化时及时更新。合作产品的包体、更新、补丁、本地化版本、运行环境和技术文档应达到双方确认的格式与质量要求。合作方不得提交包含恶意代码、病毒、后门、欺诈功能、未经授权的数据采集或可能损害用户设备与平台安全的内容。\n\n五、技术接入、测试与发布\n合作方应配合完成账号登录、启动校验、权益查询、离线授权、错误码、日志及双方确认的其他技术接入。合作产品发布前，平台方可进行资料、功能、兼容性、安全性和合规审核；审核不减轻合作方对产品质量、权利与合法性的责任。版本发布、灰度、回滚、下架和紧急修复按平台规则及双方确认流程执行。未经平台方确认，合作方不得自行将未审核版本标记为正式发行版本。\n\n六、商品、定价与用户交易\n合作产品的商品形态、销售地区、币种、价格、折扣、退款规则、预购或预约安排，以双方确认的商品配置和平台规则为准。平台方可在法律法规和已公示规则允许范围内处理订单、支付、退款、拒付、发票或账单支持。合作方不得通过虚假交易、误导宣传、价格欺诈或其他方式损害用户和平台权益。\n\n七、CDKEY 与第三方渠道供给\n经平台方开通后，合作方可在获授权的游戏、渠道、额度和有效期范围内申请或生成盖世 Key 批次，并可通过平台提供的渠道接口向经批准的第三方渠道交付。合作方应妥善保管接口凭据、Key 文件和交付记录，不得超范围生成、出售、转让或泄露。外部 Key 由实际权利方生成，合作方应保证来源合法、数量和状态真实可核验。Key 的冻结、撤销、补发、兑换、异常处置与对账以平台规则和批次记录为准。\n\n八、发行推广与精准化投放\n合作方授权平台方在合作范围内使用合作产品名称、商标、图标、截图、视频、文案和其他营销素材进行站内外展示、推荐、活动和渠道推广。需要建立 Campaign、定向人群、追踪参数或付费投放时，具体预算、素材、地区、渠道、投放周期、归因口径和数据权限由双方另行确认。平台方不保证任何固定曝光、下载、转化或收入结果。\n\n九、经营数据与隐私\n平台方可向合作方提供与其合作产品相关的浏览、预约、下载、激活、订单、退款、收入及渠道效果等汇总数据。双方应依适用法律及各自隐私政策处理个人信息，仅在实现合作目的的必要范围内收集、使用、存储和共享。未经另行书面约定，双方分别作为独立的个人信息处理者承担各自义务，不得利用平台数据识别、骚扰用户或从事与合作无关的分析。\n\n十、结算、账单与税费\n收入分成比例、结算币种、结算周期、最低付款门槛、税费承担、开票和付款方式，以双方后续确认的结算规则、单款游戏配置或补充协议为准。平台方按确认口径生成账单并发送至合作方在企业认证中填写的联系邮箱；合作方应在约定期限内核对并反馈异议。合作方应保证收款账户为其合法控制且账户户名与认证主体一致，并自行承担依法应由其承担的税费。\n\n十一、双方支持义务\n平台方在合理范围内提供开发者平台、发行工具、用户账单与平台账号相关支持。合作方负责合作产品本身的用户支持、缺陷修复、内容更新、服务器稳定性和依法应提供的售后服务，并应及时响应平台方发现的严重缺陷、安全事件、侵权投诉或监管要求。\n\n十二、知识产权与品牌\n除本协议明确授权外，双方各自保留其原有技术、产品、数据、商标和其他知识产权。任何一方使用另一方品牌均应遵守对方书面品牌规范，不得暗示超出实际合作范围的背书、独家关系或权利归属。用户依交易规则取得的合作产品使用权，不因本协议终止而被无故剥夺。\n\n十三、内容合规与下架\n合作方保证合作产品及宣传资料符合发行地区适用法律、分级、出版、网络安全、数据与消费者保护要求。平台方发现涉嫌违法、侵权、恶意代码、重大安全风险、严重质量问题或监管要求时，可采取暂停下载、停止销售、限制 Key、下架或其他必要措施，并及时通知合作方；紧急情况下可先行处置。\n\n十四、陈述、保证与赔偿\n双方分别保证具备签署和履行本协议的能力。合作方对其提交内容的真实性、权利完整性和合法合规性负责；因合作方内容、授权瑕疵、违法行为或违反本协议导致第三方索赔、行政处罚或平台方损失的，合作方应依法承担责任并合理配合处理。平台方应对其自行提供的平台服务和运营行为承担相应责任。\n\n十五、责任限制\n除故意或重大过失、侵犯知识产权、违反保密或数据保护义务以及法律不得限制的责任外，任何一方不对间接损失、可得利益损失或惩罚性损失承担责任。具体责任上限如需约定，以双方书面确认的补充协议为准。本条不影响用户依法享有的权利。\n\n十六、期限、暂停与终止\n本协议自生效之日起持续有效，直至双方依法或依约终止。任何一方严重违约并在收到书面通知后的合理期限内未纠正，守约方可终止合作；存在违法、侵权、安全风险、欺诈、资不抵债或监管要求时，可立即暂停或终止相关服务。终止后，双方应停止新增发行与授权，完成必要的退款、对账、用户支持、数据返还或删除；为已购用户继续下载、更新或验证所必需的权利和义务，可在合理范围内继续有效。\n\n十七、通知、变更与转让\n合作通知可发送至开发者平台账号、认证联系邮箱或双方书面确认的其他渠道。合作方应保证邮箱持续有效并及时更新。平台可因法律、监管、安全或业务需要更新平台规则与协议，并在平台展示当前版本；涉及合作方实质权利义务的变更，应由合作方再次确认后生效。未经另一方书面同意，任何一方不得转让本协议项下主要权利义务，但合法承继主体承接的除外。\n\n十八、适用法律、争议解决与其他\n本协议适用中华人民共和国法律。争议应先友好协商；协商不成的，按双方后续书面确认的争议解决条款处理；未另行约定时，任何一方可向平台运营主体住所地有管辖权的人民法院提起诉讼。本协议与单款游戏配置、结算规则及双方签署的补充协议共同构成完整合作约定；发生冲突时，后签署或针对具体事项的文件优先。部分条款无效不影响其他条款效力。双方之间不因本协议形成合伙、劳动或代理关系。","help":{"title":"帮助中心","faq":[{"id":"account-login","category":"账号与登录","question":"如何登录开发者平台？","answer":"可使用中国大陆手机号接收验证码登录，也可使用盖世游戏 App 扫码登录。未注册账号将在首次登录时自动注册。","steps":["输入 11 位中国大陆手机号并获取 6 位验证码。","也可打开盖世游戏 App 扫描二维码并确认登录。","完成登录验证后选择入驻方式。"],"details":["自动注册只创建平台账号，不代表企业认证已通过。","验证码仅用于本次登录验证。"]},{"id":"company-verification","category":"企业认证","question":"企业认证需要准备哪些资料？","answer":"需准备企业工商信息与执照图片、授权签署人信息、企业银行账户与证明图片，以及厂商品牌和联系人资料。","steps":["先阅读企业认证介绍，确认申请流程和资料要求。","按工商执照填写企业法定名称、注册地址和执照号码。","填写企业银行账户并上传两类证明图片。","补充厂商与联系人信息，阅读两份平台协议后统一确认并提交。"],"details":["银行账户户名必须与企业法定名称一致。","联系邮箱为必填项，用于接收账单、结算及重要业务通知。","流程没有草稿态，提交前可清空重填。"]},{"id":"review-status","category":"审核结果","question":"提交后如何查看审核状态？","answer":"正式提交后页面进入待审核状态；再次登录仍会显示当前申请编号、修订版本、审核状态与处理记录。","steps":["待审核：平台运营正在处理，企业资料不可再次提交。","已通过：企业主体认证完成。","已拒绝：页面展示审核意见，并提供修改入口。"],"details":["提交成功不等于审核通过。","每次处理结果都会保留审核人和处理时间。"]},{"id":"resubmit-rejected","category":"审核结果","question":"认证被拒绝后如何重新提交？","answer":"根据页面展示的拒绝原因修改原资料，并在确认页重新提交；系统将生成新的申请修订。","steps":["点击“修改并重新提交”。","按审核意见在单页资料中完成修改。","核对后再次点击 登录服务 PRD 为准。"]},{"id":"gamehub-login-development-guide","category":"SDK 服务","section":"盖世游戏登录","question":"盖世游戏登录开发指南","answer":"用于说明盖世游戏登录的接入准备、授权流程和结果处理。当前为可配置占位文章。","steps":["由运营后台补充接口与回调说明。"],"details":["实际实现以后续 SDK 文档为准。"]},{"id":"gamehub-qr-login","category":"SDK 服务","section":"盖世游戏登录","question":"扫码登录","answer":"用于说明 PC 或网页端拉起二维码并由盖世游戏 App 确认登录的流程。当前为可配置占位文章。","steps":["由运营后台补充二维码状态与异常处理。"],"details":["登录安全规则以后续 SDK 文档为准。"]},{"id":"gamehub-get-user-info","category":"SDK 服务","section":"盖世游戏登录","question":"获取用户信息","answer":"用于说明登录成功后可获取的用户字段、授权范围和隐私限制。当前为可配置占位文章。","steps":["由运营后台维护字段说明和权限要求。"],"details":["不得超出用户授权和合作目的使用用户信息。"]},{"id":"gamehub-login-faq","category":"SDK 服务","section":"盖世游戏登录","question":"盖世游戏登录常见问题","answer":"用于汇总扫码超时、授权失败、账号不一致和环境配置等常见问题。当前为可配置占位文章。","steps":["由运营后台持续维护问题与处理建议。"],"details":["无法自助解决时可联系 dev@xiaoji.com。"]},{"id":"developer-services-placeholder","category":"开发者服务","question":"开发者服务包含哪些能力？","answer":"开发者服务模块等待后续 PRD 输出，本期仅预留帮助分类和入口。","steps":["请关注后续平台更新。"],"details":["企业认证和帮助中心为本期完整交付范围。"]}],"contact":{"supportName":"盖世游戏开发者支持","serviceHours":"服务时间以合作对接安排为准","channel":"合作群／项目对接人","email":"dev@xiaoji.com","fallback":"紧急问题请联系当前项目对接人"}}},"en":{"introTitle":"Join the GameHub Developer Platform","introDescription":"This process guides companies through identity verification and partnership authorization. Review the process, required documents and content standards before submitting the company, settlement, publisher, contact and agreement information in one application.","introSteps":["Review the partnership scope and content standards","Prepare company and bank settlement documents","Read and accept the platform agreements","Submit the company verification application","Unlock publishing capabilities after approval"],"introRequirements":["Legal company name, registration region, registered address and license number","A clear and valid business license image","A company bank account and proof image matching the legal name","Publisher brand, business contact and billing email","An authorized representative who may accept the agreements"],"introRules":["Products and assets must be lawful and fully owned or properly licensed.","Products may not contain malware, fraud or unauthorized collection of sensitive information.","Products may not infringe intellectual property, privacy or other lawful rights.","Game onboarding, testing, review and distribution follow later product configuration and mutual confirmation."],"introReviewNote":"Platform operations normally completes the review within 5 business days after submission. Submission does not mean approval; the result and processing history remain available in the Developer Console.","ndaTitle":"GameHub Developer Platform Confidentiality Agreement","ndaBody":"GAMEHUB DEVELOPER PLATFORM CONFIDENTIALITY AGREEMENT\n\n1. Parties and Effect. This Agreement is entered into by the operator of the GameHub Developer Platform (Platform Party) and the applicant company identified by the legal company name submitted on this page (Partner). It becomes binding on Partner when its authorized representative accepts and submits it, and on both parties when the Platform Party confirms the partnership application or discloses Confidential Information.\n\n2. Confidential Information. Confidential Information means non-public information disclosed in writing, orally, electronically or otherwise that is marked confidential or should reasonably be understood as confidential, including unreleased products, roadmaps, source code, technical materials, test builds, API documents, credentials, operational and marketing plans, commercial terms, pricing and settlement data, user and transaction data, agreement terms, and all copies, summaries and derivatives.\n\n3. Exclusions. Confidential Information excludes information the receiving party can prove was lawfully public without breach, lawfully known before disclosure without restriction, independently developed without use of the disclosing party's information, lawfully received from a third party entitled to disclose it, or approved for release in writing.\n\n4. Limited Use and Disclosure. The receiving party may use Confidential Information only to evaluate, establish and perform the GameHub partnership. It may disclose information only to personnel, affiliates, advisers or service providers with a need to know and confidentiality duties no less protective than this Agreement. Except where law cannot prohibit it, the receiving party may not reverse engineer, decompile, disassemble or bypass security protections in disclosed software, interfaces or samples without written permission.\n\n5. Security. Each party must apply reasonable safeguards at least equal to those used for its own similar information, including access control, credential protection, secure transmission and storage, personnel controls and appropriate logs. Any suspected unauthorized access, use, loss or disclosure must be reported promptly with known impact and reasonable mitigation steps.\n\n6. Required Disclosure. If disclosure is legally required, the receiving party must, where permitted, notify the disclosing party promptly and disclose only the minimum required scope while reasonably assisting with protective relief.\n\n7. Return and Destruction. When the partnership ends, the information is no longer needed, or the disclosing party requests it, the receiving party must stop use and return or destroy controlled copies, except records required by law, audit rules or automated backups, which remain protected.\n\n8. Ownership. Confidential Information and related intellectual property remain owned by the disclosing party or its licensors. Disclosure grants no ownership, patent, copyright, trademark, trade secret or other license except the limited right necessary to evaluate or perform the partnership.\n\n9. Breach and Remedies. A breaching party is responsible under applicable law for proven direct losses and reasonable enforcement costs. Because unauthorized use or disclosure may cause irreparable harm, the non-breaching party may seek injunctive or other equitable relief in addition to available remedies.\n\n10. Term and Survival. This Agreement continues until the parties terminate the relationship in writing. Duties continue until the information lawfully becomes public. Trade secrets, personal data, credentials and information that must remain protected by law continue for as long as protection is required.\n\n11. Law and Disputes. This Agreement is governed by the laws of the People's Republic of China. The parties will first negotiate in good faith. Any later written dispute clause controls; if none exists, disputes may be submitted to the competent court at the domicile of the Platform Party.\n\n12. General. Neither party may transfer its principal duties without written consent, except to a lawful successor in a merger, division or transfer of the relevant business. Invalid provisions do not affect the remainder. A later specific confidentiality agreement controls where the parties expressly give it priority. Updated platform terms become effective for Partner only after Partner confirms the new version.","distributionTitle":"GameHub Developer Platform Distribution Partnership Agreement","distributionBody":"GAMEHUB DEVELOPER PLATFORM DISTRIBUTION PARTNERSHIP AGREEMENT\n\n1. Parties and Purpose. This Agreement is entered into by the operator of the GameHub Developer Platform (Platform Party) and the applicant company identified on this page (Partner). The parties intend to use the platform for game onboarding, testing, product configuration, build and release management, promotion, entitlement validation, channel supply and business reporting. Acceptance and company-verification submission do not by themselves approve any game for distribution; each game's scope follows its approved configuration and later written confirmation.\n\n2. Definitions. Product means a game, DLC, add-on, update or localized build submitted and approved for onboarding. Platform means the GameHub Developer Platform and related user-facing distribution products. User means a person who views, reserves, purchases, downloads, activates or uses a Product. GameHub Key means an entitlement code generated under authorized platform rules. External Key means a code supplied by Partner or another platform. Net Revenue means user payments less legally collected taxes, refunds, chargebacks, channel fees and other mutually confirmed adjustments.\n\n3. Eligibility and License. Partner represents that it has full authority to sign and perform this Agreement and owns or has sufficient licenses for Products, trademarks, assets, music, art, fonts, characters, data and other deliveries. Within the approved product, territory, channel, language and term, Partner grants the Platform Party a non-exclusive license to copy, store, transmit, display, perform, format and make non-material technical adaptations needed for onboarding, testing, marketing, sale, delivery, download, update, support and analysis.\n\n4. Delivery. Partner must provide true, accurate, complete and current company, bank, contact, game, product, rights, rating, privacy and compliance information. Builds, updates, patches, localized versions, runtime requirements and technical documentation must meet confirmed format and quality requirements. Products may not contain malware, backdoors, fraud, unauthorized data collection or functions that threaten users or the Platform.\n\n5. Integration, Testing and Release. Partner will cooperate on sign-in, launch verification, entitlement queries, offline authorization, error codes, logs and other confirmed integrations. The Platform Party may review information, functionality, compatibility, security and compliance before release. Review does not reduce Partner's responsibility for quality, rights or legality. Releases, staged rollout, rollback, removal and emergency fixes follow platform rules and confirmed procedures.\n\n6. Products, Pricing and Transactions. Product type, territory, currency, price, discounts, refunds, pre-order or reservation rules follow confirmed product settings and platform rules. The Platform Party may process orders, payment, refunds, chargebacks, invoices and billing support as permitted by law and published rules. Partner may not manipulate transactions, mislead users or commit price fraud.\n\n7. Keys and Channels. After authorization, Partner may create GameHub Key batches within approved games, channels, quotas and validity periods, and may deliver through approved channel APIs. Partner must protect credentials, key files and delivery records and may not create, sell, transfer or expose Keys outside authorization. External Keys remain generated by the relevant rightsholder. Freezing, revocation, replacement, redemption, exception handling and reconciliation follow platform rules and batch records.\n\n8. Marketing and Targeting. Partner authorizes use of approved names, trademarks, icons, screenshots, videos and copy for in-platform and external display, recommendations, campaigns and channel promotion. Budgets, assets, regions, channels, schedules, attribution and data access for paid or targeted campaigns require separate confirmation. No fixed exposure, download, conversion or revenue result is guaranteed.\n\n9. Data and Privacy. The Platform Party may provide aggregated views, reservations, downloads, activations, orders, refunds, revenue and channel performance for Partner's Products. Each party must process personal information lawfully and only as necessary for the partnership. Unless otherwise agreed in writing, each party acts as an independent controller and may not identify or contact users or analyze data for unrelated purposes.\n\n10. Settlement and Tax. Revenue share, currency, settlement cycle, payment threshold, tax, invoicing and payment method follow later settlement rules, product settings or supplemental agreements. Statements are sent to the contact email submitted in company verification. Partner must keep that email current and ensure its receiving account is lawfully controlled and matches the verified legal company name.\n\n11. Support. The Platform Party provides reasonable support for the platform, distribution tools, user billing and platform accounts. Partner supports the Product, fixes defects, maintains content and servers, provides legally required after-sales service, and responds promptly to serious defects, security incidents, infringement claims and regulatory requirements.\n\n12. Intellectual Property and Brand. Except for express licenses, each party retains its pre-existing technology, products, data, trademarks and other intellectual property. Brand use must follow written guidelines and may not imply endorsement, exclusivity or ownership beyond the actual partnership. Lawfully acquired user rights may not be removed without proper cause solely because this Agreement ends.\n\n13. Compliance and Removal. Partner warrants that Products and marketing materials comply with applicable law, ratings, publication, cybersecurity, data and consumer-protection requirements. The Platform Party may suspend downloads or sales, restrict Keys, remove a Product or take necessary measures for suspected illegality, infringement, malware, material security risk, serious quality issues or regulatory orders, with notice where practicable.\n\n14. Warranties and Indemnity. Each party warrants authority to enter and perform. Partner is responsible for the truth, rights and legality of submitted content and will bear liability and reasonably assist with claims, penalties or losses caused by its infringement, illegality or breach. The Platform Party remains responsible for its own platform services and operations.\n\n15. Liability. Except for fraud, wilful misconduct, gross negligence, intellectual-property infringement, confidentiality or data-protection breach, and liability that cannot be limited by law, neither party is liable for indirect, consequential, lost-profit or punitive damages. Any agreed cap must be set in a written supplemental agreement. User rights under mandatory law are unaffected.\n\n16. Term, Suspension and Termination. This Agreement continues until lawfully terminated. A material breach not cured within a reasonable written cure period permits termination. Illegality, infringement, security risk, fraud, insolvency or regulatory action may justify immediate suspension or termination. After termination, the parties stop new distribution and authorization and complete required refunds, reconciliation, user support and data return or deletion. Rights necessary to support existing users may continue for a reasonable period.\n\n17. Notices, Changes and Assignment. Notices may be sent through the developer account, verified contact email or other confirmed channel. Partner must keep its email valid. Platform terms may be updated for law, security or business needs; material changes bind Partner only after renewed confirmation. Principal rights and duties may not be transferred without written consent except to a lawful successor.\n\n18. Law, Disputes and Entire Agreement. This Agreement is governed by the laws of the People's Republic of China. The parties first negotiate in good faith. A later written dispute clause controls; if none exists, disputes may be submitted to the competent court at the domicile of the Platform Party. This Agreement, product settings, settlement rules and supplemental agreements form the complete partnership terms; later or more specific terms control conflicts. Invalid provisions do not affect the remainder. No partnership, employment or agency relationship is created.","help":{"title":"Help Center","faq":[{"id":"account-login","category":"Account and sign-in","question":"How do I sign in to the developer platform?","answer":"Use an email address to receive a verification code, or scan the QR code with the GameHub app. An unregistered account is created automatically on first sign-in.","steps":["Enter your email address and request a 6-digit verification code.","You can also open the GameHub app, scan the QR code and confirm sign-in.","Complete sign-in verification and choose an onboarding option."],"details":["Automatic registration creates only a platform account; it does not approve company verification.","The verification code is used only for this sign-in."]},{"id":"company-verification","category":"Company verification","question":"What do I need for company verification?","answer":"Prepare the legal registration details and license image, authorized signatory details, company bank account and proof image, plus the publisher brand and business contact.","steps":["Read the company-verification introduction and requirements first.","Enter the legal company name, registered address and license number exactly as shown on the license.","Enter the company bank account and upload both proof images.","Complete publisher and contact details, then accept both platform agreements in one confirmation and submit."],"details":["The bank account holder must match the legal company name.","The contact email is required for statements, settlement and important business notices.","There is no draft status. You may clear and restart before submission."]},{"id":"review-status","category":"Review result","question":"How can I check the review status?","answer":"After formal submission, the page shows Pending review. Future sign-ins continue to show the application ID, revision, status and processing history.","steps":["Pending: platform operations is reviewing the submission.","Approved: company verification is complete.","Rejected: the page shows the review note and an edit entry."],"details":["Submission does not mean approval.","Each result keeps the reviewer and processing time."]},{"id":"resubmit-rejected","category":"Review result","question":"How do I resubmit after rejection?","answer":"Update the information based on the review note and submit it again from the confirmation step. The platform creates a new application revision.","steps":["Select Edit and resubmit.","Update the requested information on the single application page.","Review everything and select Submit for review."],"details":["Resubmission never overwrites the previous revision or review record.","Restarting clears only the current unsubmitted changes."]},{"id":"pc-game-listing-guide","category":"Game listing","section":"Listing guides","question":"PC game listing guide","answer":"An overview of the path from creating a PC game project and preparing information to submitting it for listing review. This configurable article is a placeholder.","steps":["Review the required information and prerequisites.","Platform operations will add the final workflow after the related PRD is approved."],"details":["Production listing configuration is not available in this phase."]},{"id":"pc-test-plan-introduction","category":"Game listing","section":"Listing guides","question":"GameHub PC test plan introduction","answer":"An introduction to PC test-plan scenarios, eligibility and result viewing. This configurable article is a placeholder.","steps":["Platform operations maintains the introduction, availability and eligibility."],"details":["The final flow follows the later testing and release PRD."]},{"id":"pc-buyout-game-docs","category":"Game listing","section":"Listing guides","question":"PC buy-to-own game documentation","answer":"A directory for product, pricing, entitlement and review documentation for buy-to-own PC games. This configurable article is a placeholder.","steps":["Platform operations maintains the official document links and scope."],"details":["No product or pricing controls are added in this phase."]},{"id":"pc-store-materials","category":"Game listing","section":"Listing guides","question":"GameHub PC store asset requireme (function registerComponents(namespace) {
  const icon = (name, className) => namespace.icons.render(name, className);
  const escapeHtml = value => String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
  const attrs = values => Object.entries(values)
    .filter(([, value]) => value !== undefined && value !== null && value !== false)
    .map(([key, value]) => value === true ? key : `${key}="${escapeHtml(value)}"`)
    .join(' ');

  const button = ({ label, variant = 'secondary', iconName, action, primary = false, disabled = false, size, extra = '' }) => {
    const attributeText = attrs({
      type: 'button',
      class: 'gh-button',
      'data-component': 'Button',
      'data-variant': variant,
      'data-size': size,
      'data-portal-action': action,
      'data-primary-action': primary || undefined,
      disabled: disabled || undefined,
      'aria-disabled': disabled ? 'true' : undefined,
    });
    return `<button ${attributeText}${extra ? ` ${extra}` : ''}>${iconName ? icon(iconName) : ''}<span>${escapeHtml(label)}</span></button>`;
  };

  const input = ({ label, value = '', placeholder = '', name = '', required = false, hint = '', invalid = false, error = '', type = 'text', disabled = false, extra = '' }) => `
    <label class="field">
      <span class="field-label"><span>${escapeHtml(label)}${required ? '<span class="field-required">*</span>' : ''}</span>${hint ? `<span class="field-hint">${escapeHtml(hint)}</span>` : ''}</span>
      <input class="gh-input" data-component="Input" data-variant="${invalid ? 'error' : 'default'}" type="${escapeHtml(type)}" name="${escapeHtml(name)}" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" ${required ? 'required' : ''} ${invalid ? 'aria-invalid="true"' : ''} ${disabled ? 'disabled aria-disabled="true"' : ''}${extra ? ` ${extra}` : ''}>
      ${error ? `<span class="field-error">${escapeHtml(error)}</span>` : ''}
    </label>`;

  const textarea = ({ label, value = '', placeholder = '', required = false, hint = '', name = '', disabled = false, extra = '' }) => `
    <label class="field is-wide">
      <span class="field-label"><span>${escapeHtml(label)}${required ? '<span class="field-required">*</span>' : ''}</span>${hint ? `<span class="field-hint">${escapeHtml(hint)}</span>` : ''}</span>
      <textarea class="gh-textarea" data-component="Input" data-variant="multiline" name="${escapeHtml(name)}" placeholder="${escapeHtml(placeholder)}" ${required ? 'required' : ''} ${disabled ? 'disabled aria-disabled="true"' : ''}${extra ? ` ${extra}` : ''}>${escapeHtml(value)}</textarea>
    </label>`;

  const select = ({ label, options = [], value, name = '' }) => `
    <label class="field">
      <span class="field-label">${escapeHtml(label)}</span>
      <select class="gh-select" data-component="Select" data-variant="default" name="${escapeHtml(name)}">
        ${options.map(option => {
          const entry = typeof option === 'string' ? { label: option, value: option } : option;
          return `<option value="${escapeHtml(entry.value)}"${entry.value === value ? ' selected' : ''}>${escapeHtml(entry.label)}</option>`;
        }).join('')}
      </select>
    </label>`;

  const statusVariant = status => {
    const text = String(status || '');
    if (/通过|正常|已发布|进行中|已完成|可售|成功|在线|可用/.test(text)) return 'success';
    if (/异常|失败|驳回|中断|停售|下架|不通过|已作废|已撤销/.test(text)) return 'danger';
    if (/待|草稿|审核中|排期|测试中|处理中|暂停|生成中/.test(text)) return 'warning';
    return 'info';
  };

  const statusTag = (status, variant = statusVariant(status)) => `<span class="status-tag" data-component="StatusTag" data-variant="${escapeHtml(variant)}">${escapeHtml(status || '未知状态')}</span>`;

  const normalizeRows = rows => rows.length ? rows : [['暂无数据', '等待业务确认', '未开始', '查看']];
  const table = ({ headers = ['对象', '说明', '状态', '操作'], rows = [] }) => {
    const safeRows = normalizeRows(rows);
    return `<div class="table-wrap"><table class="data-table" data-component="Table" data-variant="default" data-columns="${headers.length}">
      <thead><tr>${headers.map(header => `<th>${escapeHtml(header)}</th>`).join('')}</tr></thead>
      <tbody>${safeRows.map((row, rowIndex) => `<tr>${row.map((cell, cellIndex) => {
        const value = typeof cell === 'object' ? cell : { text: cell };
        if (value.status) return `<td>${statusTag(value.status)}</td>`;
        if (value.action) return `<td>${button({ label: value.action, variant: 'text', size: 'small', action: value.portalAction || 'row-detail' })}</td>`;
        const text = String(value.text ?? '');
        const isIdentifier = /(?:\b(?:APP|SKU|BUILD|MANIFEST|KEY|TEST|CMP|REQ|EXP|QRY|REL|VEN|SUP|ACC)-[A-Z0-9-]+\b|\bcli_[a-z0-9_]+\b|^\d{4}[-/]\d{2}[-/]\d{2})/i.test(text);
        const classes = [cellIndex === 0 ? 'table-primary' : '', isIdentifier ? 'table-identifier' : ''].filter(Boolean).join(' ');
        return `<td><div class="${classes}">${escapeHtml(text)}</div>${value.subtext ? `<div class="table-secondary">${escapeHtml(value.subtext)}</div>` : ''}</td>`;
      }).join('')}</tr>`).join('')}</tbody>
    </table></div>`;
  };

  const pagination = ({ total = 1, page = 1, pageSize = 20 }) => {
    const totalPages = Math.max(1, Math.ceil(Number(total) / Math.max(1, Number(pageSize))));
    const currentPage = Math.min(Math.max(1, Number(page)), totalPages);
    const pageButtons = Array.from({ length: totalPages }, (_, index) => index + 1)
      .map(item => `<button class="page-button${item === currentPage ? ' is-active' : ''} number" data-portal-action="page-${item}"${item === currentPage ? ' aria-current="page"' : ''}>${escapeHtml(item)}</button>`)
      .join('');
    return `<div class="pagination" data-component="Pagination" data-variant="default">
      <span>共 <strong class="number">${escapeHtml(total)}</strong> 条记录</span>
      <div class="pagination__buttons">
        <button class="page-button" data-portal-action="page-prev" aria-label="上一页"${currentPage === 1 ? ' disabled aria-disabled="true"' : ''}>${icon('chevron', 'gh-icon')}</button>
        ${pageButtons}
        <button class="page-button" data-portal-action="page-next" aria-label="下一页"${currentPage === totalPages ? ' disabled aria-disabled="true"' : ''}>${icon('chevron', 'gh-icon')}</button>
      </div>
    </div>`;
  };

  const tabs = ({ items = [], active = 0, variant = 'line', action = 'tab', idPrefix = 'tab', indexAttribute = 'data-tab-index' }) =>
    `<div class="tabs" role="tablist" data-component="Tabs" data-variant="${escapeHtml(variant)}">${items.map((item, index) => {
      const id = `${idPrefix}-${index}`;
      return `<button id="${escapeHtml(id)}" class="tab${index === active ? ' is-active' : ''}" role="tab" aria-selected="${index === active}" aria-controls="${escapeHtml(id)}-panel" tabindex="${index === active ? '0' : '-1'}" data-portal-action="${escapeHtml(action)}" ${escapeHtml(indexAttribute)}="${index}">${escapeHtml(item)}</button>`;
    }).join('')}</div>`;

  const authorizationSummary = authorization => `<section class="authorization-summary" data-cdkey-authorization>
    <div data-authorization-status><span>授权状态</span>${statusTag(authorization.status, 'success')}</div>
    <div data-authorization-quota><span>剩余 Key 配额</span><strong class="number">${escapeHtml(authorization.remainingQuota)}</strong></div>
    <div data-authorization-channels><span>可用渠道</span><strong>${escapeHtml(authorization.channels.join('、'))}</strong></div>
    <div data-authorization-paused><span>暂停原因</span><strong>${escapeHtml(authorization.pausedReason)}</strong></div>
  </section>`;

  const codeBlock = ({ title, code, action = 'copy-api-example' }) => `<section class="code-block">
    <header><strong>${escapeHtml(title)}</strong>${button({ label: '复制示例', variant: 'text', action, size: 'small' })}</header>
    <pre><code>${escapeHtml(code)}</code></pre>
  </section>`;

  const stepper = ({ items = [], active = 0 }) => `<div class="stepper" data-component="Stepper" data-variant="horizontal">${items.map((item, index) => `<div class="stepper-item${index < active ? ' is-done' : ''}${index === active ? ' is-active' : ''}"><span class="stepper-dot">${index < active ? icon('check', 'gh-icon') : ''}</span><span>${escapeHtml(item)}</span></div>`).join('')}</div>`;

  const timeline = ({ items = [] }) => `<ol class="timeline" data-component="Timeline" data-variant="vertical">${items.map((item, index) => `<li class="timeline-item"><div class="timeline-title">${escapeHtml(item)}</div><div class="timeline-meta number">${index === 0 ? '刚刚' : '历史记录'}</div></li>`).join('')}</ol>`;

  const metricCard = ({ label, value, trend = 'T+1 汇总口径' }) => `<article class="metric-card" data-component="MetricCard" data-variant="default"><div class="metric-label">${escapeHtml(label)}</div><div class="metric-value number">${escapeHtml(value)}</div><div class="metric-trend">${escapeHtml(trend)}</div></article>`;

  const chart = ({ label = '趋势', unit = '数量（次）', legend = '当前指标' } = {}) => `<div class="chart" data-component="Chart" data-variant="line" role="img" aria-label="${escapeHtml(label)}">
    <div class="chart-heading"><span>${escapeHtml(unit)}</span><span class="legend-item"><i class="legend-dot"></i>${escapeHtml(legend)}</span></div>
    <svg viewBox="0 0 760 220" preserveAspectRatio="none"><defs><linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A7CFF" stop-opacity=".30"/><stop offset="1" stop-color="#6A7CFF" stop-opacity="0"/></linearGradient></defs>
      <path class="chart-grid" d="M58 24H740M58 72H740M58 120H740M58 168H740"/>
      <g class="chart-axis"><text x="48" y="28">3,000</text><text x="48" y="76">2,000</text><text x="48" y="124">1,000</text><text x="48" y="172">0</text><text x="58" y="207">08-28</text><text x="276" y="207">08-30</text><text x="498" y="207">09-01</text><text x="704" y="207">09-03</text></g>

    const attachmentMode = ['license', 'bank'].includes(reviewState.attachmentMode) ? reviewState.attachmentMode : '';

    };

      }
      if (action === 'tab') {
        event.currentTarget.parentElement.querySelectorAll('.tab').forEach(node => { node.classList.toggle('is-active', node === event.currentTarget); node.setAttribute('aria-selected', String(node === event.currentTarget)); });
        return;
      }
      if (action.startsWith('page-')) { resultMessage(route.id, '列表已更新', '筛选条件和页码保持不变。', 'info'); return; }
      const destination = primaryDestination(route.id);
      if (event.currentTarget.hasAttribute('data-primary-action') && destination) { navigate({ routeId: destination, state: 'default' }); return; }
      resultMessage(route.id, '操作已完成', '最新状态已保存。');
    }));
    root.querySelector('[data-help-search-input]')?.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      searchHelp();
    });
    root.querySelector('[data-review-filter-keyword]')?.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      root.querySelector('[data-portal-action="qualification-review-filter"]')?.click();
    });
    root.querySelectorAll('[data-qualification-file]').forEach(input => input.addEventListener('change', event => {
      const file = event.currentTarget.files?.[0];
      const nameField = event.currentTarget.dataset.qualificationFile;
      if (!file || !nameField) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || file.size > 10 * 1024 * 1024) {
        event.currentTarget.value = '';
        event.currentTarget.setAttribute('aria-invalid', 'true');
        event.currentTarget.closest('.qualification-upload')?.classList.add('is-invalid');
        resultMessage(route.id, memory.shell.language === 'en' ? 'Image does not meet the requirements' : '图片不符合要求', memory.shell.language === 'en' ? 'Upload a JPG, PNG or WEBP image no larger than 10 MB.' : '请上传不超过 10 MB 的 JPG、PNG 或 WEBP 图片。', 'warning');
        return;
      }
      memory.qualification.form = { ...(memory.qualification.form || {}), [nameField]: file.name };
      event.currentTarget.removeAttribute('aria-invalid');
      event.currentTarget.closest('.qualification-upload')?.classList.remove('is-invalid');
      const label = root.querySelector(`[data-file-name="${nameField}"]`);
      if (label) label.textContent = file.name;
      resultMessage(route.id, memory.shell.language === 'en' ? 'Image selected' : '已选择证明图片', memory.shell.language === 'en' ? 'The file is kept in this in-progress submission and uploaded only after formal submission.' : '文件仅保留在本次填写中，正式提交后才生成申请快照。', 'info');
    }));
    root.querySelectorAll('[data-rich-editor-image-input]').forEach(input => input.addEventListener('change', event => {
      const file = event.currentTarget.files?.[0];
      const editorBody = event.currentTarget.closest('[data-rich-editor]')?.querySelector('[data-rich-editor-body]');
      if (!file || !editorBody) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || file.size > 5 * 1024 * 1024) {
        event.currentTarget.value = '';
        resultMessage(route.id, '图片插入失败', '请选择不超过 5 MB 的 JPG、PNG 或 WEBP 图片。', 'warning');
        return;
      }
      const reader = new FileReader();
      reader.addEventListener('load', () => {
        const image = document.createElement('img');
        image.src = String(reader.result || '');
        image.alt = file.name;
        editorBody.append(image);
        editorBody.focus();
        resultMessage(route.id, '图片已插入正文', '图片已在当前富文本中预览，保存并生效后进入发布版本。', 'success');
      });
      reader.addEventListener('error', () => resultMessage(route.id, '图片读取失败', '请重新选择图片后再试。', 'danger'));
      reader.readAsDataURL(file);
    }));
    root.querySelectorAll('[data-qualification-form] input, [data-qualification-form] textarea, [data-qualification-form] select').forEach(field => {
      const clearInvalid = event => {
        event.currentTarget.removeAttribute('aria-invalid');
        event.currentTarget.closest('.field, .agreement-check')?.classList.remove('is-invalid');
        event.currentTarget.closest('.field')?.querySelector('.qualification-field-error')?.remove();
      };
      field.addEventListener('input', clearInvalid);
      field.addEventListener('change', clearInvalid);
    });
    root.querySelectorAll('[data-login-panel] input').forEach(input => input.addEventListener('input', event => {
      const field = event.currentTarget;
      if (field.hasAttribute('data-login-numeric')) field.value = field.value.replace(/\D/g, '').slice(0, Number(field.maxLength) || undefined);
      field.removeAttribute('aria-invalid');
      const message = field.closest('.login-field-stack')?.querySelector('[data-login-error]');
      if (message) {
        message.textContent = '\u00A0';
        message.dataset.variant = 'idle';
        message.hidden = false;
      }
    }));
  };

  const render = () => {
    const { route, role, state, cdkeyTab } = parseLocation();
    const page = portalData.pages?.[route.id] || fallbackPage(route);
    const editorMode = route.id === 'P01-05' ? (memory.page[route.id]?.editorMode || 'edit') : 'edit';
    const qualificationForView = role === 'developer' && route.id === 'P01-03' && memory.qualificationPreview
      ? memory.qualificationPreview
      : memory.qualification;
    document.documentElement.lang = memory.shell.language === 'en' && role === 'developer' ? 'en' : 'zh-CN';
    const content = namespace.templates.render({ route, page, state, editorMode, qualification: qualificationForView, language: memory.shell.language, managedContent: memory.managedContent, contentEditor: memory.contentEditor, operationsReview: memory.operationsReview, registration: memory.registration, authenticated: memory.session.authenticated });
    root.innerHTML = namespace.shell.renderBusiness({ module: moduleConfig, routes, route, page, portalData, role, state, editorMode, content, qualification: qualificationForView, language: memory.shell.language, managedContent: memory.managedContent, registration: memory.registration });
    if (memory.result[route.id] && state === 'default') {
      const target = root.querySelector('[data-runtime-result]');
      if (target) target.innerHTML = c.resultStrip(memory.result[route.id]);
    }
    if (memory.page[route.id]?.savedAt) root.querySelectorAll('[data-save-state]').forEach(node => { node.textContent = `最近保存：${memory.page[route.id].savedAt}`; });
    applyBusinessState(route.id);
    bindInteractions({ route, role, state });
    if (route.id === 'P01-07' && state === 'default' && memory.page[route.id]?.releaseTab === 'audit') {
      root.querySelector('[data-release-tab="audit"]')?.click();
      if (memory.page[route.id]?.focusReview) {
        memory.page[route.id].focusReview = false;
        requestAnimationFrame(() => root.querySelector('[data-review-record="pre-release"]')?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
      }
    }
    if (memory.shell.helpOpen) toggleHelp(true);
    requestAnimationFrame(() => root.querySelector('.platform-tab.is-active')?.scrollIntoView({ block: 'nearest', inline: 'center' }));
    if (route.id === 'P02-01' && state === 'default') setCdkeyTab(route.id, cdkeyTab ?? memory.page[route.id]?.cdkeyTab ?? 0, false);
  };

  addEventListener('hashchange', render);
  addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    root.querySelectorAll('[data-qualification-example-modal]:not([hidden])').forEach(modal => modal.setAttribute('hidden', ''));
  });
  addEventListener('storage', event => {
    if (event.key !== managedContentStorageKey || !event.newValue) return;
    try {
      const next = JSON.parse(event.newValue);
      if (!next?.zh || !next?.en || Number(next.revision) <= Number(memory.managedContent.revision)) return;
      memory.managedContent = next;
      memory.contentEditor.draft = cloneJson(next);
      render();
    } catch { /* 忽略其他页面写入的无效内容 */ }
  });
  render();
})(window.GameHubDeveloperPortal);</script></body></html>
