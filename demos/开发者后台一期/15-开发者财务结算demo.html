<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>开发者财务结算｜盖世游戏开发者平台</title>
  <style>* { box-sizing: border-box; }
:root {
  --brand: #f3b71b;
  --brand-strong: #d89200;
  --brand-soft: #fff8df;
  --ink: #172033;
  --muted: #667085;
  --line: #e4e7ec;
  --line-strong: #d0d5dd;
  --page: #f5f7fa;
  --surface: #ffffff;
  --soft: #f8fafc;
  --success: #14804a;
  --success-soft: #ecfdf3;
  --warning: #b54708;
  --warning-soft: #fffaeb;
  --danger: #b42318;
  --danger-soft: #fef3f2;
  --info: #175cd3;
  --info-soft: #eff8ff;
  --radius: 10px;
  --shadow: 0 10px 30px rgba(21, 31, 51, .08);
  --font: "Microsoft YaHei UI", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: var(--info); text-decoration: none; }
.gh-app { min-height: 100vh; }
.gh-topbar { height: 64px; padding: 0 28px; background: #111827; color: #fff; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
.gh-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .02em; }
.gh-brand svg { width: 34px; height: 34px; }
.gh-brand small { display: block; margin-top: 2px; color: #98a2b3; font-size: 11px; font-weight: 500; }
.gh-top-actions { display: flex; align-items: center; gap: 10px; }
.gh-top-link { border: 0; background: transparent; color: #d0d5dd; cursor: pointer; padding: 8px 10px; border-radius: 7px; }
.gh-top-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.gh-user { display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.14); }
.gh-avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(135deg, var(--brand), #ffdd75); color: #523600; font-weight: 800; }
.gh-user-copy strong, .gh-user-copy small { display: block; }
.gh-user-copy small { margin-top: 2px; color: #98a2b3; font-size: 11px; }
.gh-layout { min-height: calc(100vh - 64px); display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.gh-sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px; }
.gh-sidebar-label { padding: 0 12px 10px; color: #98a2b3; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.gh-nav { display: grid; gap: 4px; }
.gh-nav button { width: 100%; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 11px; padding: 11px 12px; color: #475467; cursor: pointer; text-align: left; }
.gh-nav button:hover { background: #f9fafb; color: var(--ink); }
.gh-nav button.is-active { background: var(--brand-soft); color: #9a6700; font-weight: 700; }
.gh-nav-icon { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #d9dde5; border-radius: 6px; font-size: 11px; font-weight: 800; }
.gh-nav button.is-active .gh-nav-icon { border-color: #efc85e; background: #fff6cf; }
.gh-main { min-width: 0; padding: 30px 34px 56px; }
.gh-content { width: min(1180px, 100%); margin: 0 auto; }
.gh-breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #98a2b3; font-size: 13px; margin-bottom: 18px; }
.gh-breadcrumb button { border: 0; background: none; color: var(--info); padding: 0; cursor: pointer; }
.gh-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
.gh-page-head h1 { margin: 0; font-size: 28px; line-height: 1.3; letter-spacing: -.02em; }
.gh-page-head p { margin: 7px 0 0; color: var(--muted); line-height: 1.7; }
.gh-head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.gh-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(16,24,40,.02); overflow: hidden; }
.gh-card + .gh-card { margin-top: 18px; }
.gh-card-head { min-height: 62px; padding: 17px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.gh-card-head h2 { margin: 0; font-size: 16px; }
.gh-card-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.gh-card-body { padding: 20px; }
.gh-grid-2, .gh-grid-3, .gh-grid-4 { display: grid; gap: 16px; }
.gh-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gh-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gh-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.gh-metric { padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.gh-metric span { color: var(--muted); font-size: 12px; }
.gh-metric strong { display: block; margin: 12px 0 6px; font-size: 24px; font-variant-numeric: tabular-nums; }
.gh-metric small { color: #98a2b3; }
.gh-button { min-height: 38px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 8px 15px; font-weight: 650; cursor: pointer; transition: .16s ease; }
.gh-button:hover { border-color: #98a2b3; background: #f9fafb; }
.gh-button.primary { border-color: var(--brand); background: var(--brand); color: #332300; }
.gh-button.primary:hover { border-color: var(--brand-strong); background: #e9aa0a; }
.gh-button.danger { border-color: #fda29b; color: var(--danger); background: #fff; }
.gh-button.link { border-color: transparent; background: transparent; color: var(--info); padding-inline: 6px; }
.gh-button:disabled { border-color: var(--line); background: #f2f4f7; color: #98a2b3; cursor: not-allowed; }
.gh-tag { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; border-radius: 999px; padding: 3px 9px; background: #f2f4f7; color: #475467; font-size: 12px; white-space: nowrap; }
.gh-tag.success { background: var(--success-soft); color: var(--success); }
.gh-tag.warning { background: var(--warning-soft); color: var(--warning); }
.gh-tag.danger { background: var(--danger-soft); color: var(--danger); }
.gh-tag.info { background: var(--info-soft); color: var(--info); }
.gh-notice { margin-bottom: 18px; padding: 14px 16px; border: 1px solid #b2ddff; background: var(--info-soft); border-radius: 9px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; color: #1849a9; }
.gh-notice.warning { border-color: #fedf89; background: var(--warning-soft); color: #93370d; }
.gh-notice.danger { border-color: #fecdca; background: var(--danger-soft); color: #912018; }
.gh-notice strong { display: block; margin-bottom: 4px; }
.gh-notice p { margin: 0; line-height: 1.65; }
.gh-tabs { display: flex; align-items: center; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.gh-tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 12px 1px 11px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.gh-tabs button.is-active { color: var(--ink); border-bottom-color: var(--brand); font-weight: 700; }
.gh-field { min-width: 0; }
.gh-field.wide { grid-column: 1 / -1; }
.gh-field label, .gh-label { display: block; margin-bottom: 8px; color: #344054; font-weight: 650; }
.gh-required::after { content: " *"; color: var(--danger); }
.gh-input, .gh-select, .gh-textarea { width: 100%; min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 9px 11px; color: var(--ink); outline: none; }
.gh-input:focus, .gh-select:focus, .gh-textarea:focus { border-color: #d9a50e; box-shadow: 0 0 0 3px rgba(243,183,27,.15); }
.gh-textarea { min-height: 112px; resize: vertical; line-height: 1.7; }
.gh-hint { display: block; margin-top: 6px; color: #98a2b3; font-size: 12px; line-height: 1.5; }
.gh-error { min-height: 18px; margin-top: 5px; color: var(--danger); font-size: 12px; }
.gh-checks { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.gh-checks label { display: flex; align-items: center; gap: 7px; color: #475467; font-weight: 500; }
.gh-upload { position: relative; min-height: 104px; border: 1px dashed #b8c0cc; border-radius: 8px; background: #fbfcfd; display: grid; place-items: center; padding: 16px; color: var(--muted); text-align: center; cursor: pointer; }
.gh-upload:hover { border-color: #d9a50e; background: #fffdf6; }
.gh-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.gh-form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 20px; margin-top: 20px; border-top: 1px solid var(--line); }
.gh-table-wrap { overflow-x: auto; }
.gh-table { width: 100%; border-collapse: collapse; min-width: 760px; }
.gh-table th { height: 44px; padding: 10px 14px; background: #f9fafb; color: #667085; font-size: 12px; text-align: left; font-weight: 700; border-bottom: 1px solid var(--line); }
.gh-table td { padding: 14px; border-bottom: 1px solid #eef0f3; color: #344054; vertical-align: middle; }
.gh-table tbody tr:last-child td { border-bottom: 0; }
.gh-table tbody tr:hover { background: #fcfcfd; }
.gh-table strong, .gh-table small { display: block; }
.gh-table small { margin-top: 4px; color: #98a2b3; }
.gh-row-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.gh-empty { padding: 62px 20px; text-align: center; color: var(--muted); }
.gh-empty-mark { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 16px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px; }
.gh-readonly { padding: 13px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.gh-readonly span, .gh-readonly strong, .gh-readonly small { display: block; }
.gh-readonly span { color: var(--muted); font-size: 12px; }
.gh-readonly strong { margin: 8px 0 4px; color: #344054; word-break: break-word; }
.gh-readonly small { color: #98a2b3; line-height: 1.5; }
.gh-code { border-radius: 8px; background: #101828; color: #d1fadf; padding: 14px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; overflow-x: auto; }
.gh-filter { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.gh-filter .gh-input { width: min(300px, 100%); }
.gh-filter .gh-select { width: 160px; }
.gh-pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.gh-dialog-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(16,24,40,.48); backdrop-filter: blur(2px); }
.gh-dialog { width: min(560px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: #fff; border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.gh-dialog.wide { width: min(820px, 100%); }
.gh-dialog-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 18px; }
.gh-dialog-head h2 { margin: 0; font-size: 19px; }
.gh-dialog-head p { margin: 6px 0 0; color: var(--muted); line-height: 1.6; }
.gh-dialog-close { width: 32px; height: 32px; border: 0; border-radius: 7px; background: #f2f4f7; cursor: pointer; font-size: 21px; color: var(--muted); }
.gh-dialog-body { padding: 20px 22px; overflow-y: auto; }
.gh-dialog-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
.gh-toast { position: fixed; top: 82px; left: 50%; z-index: 100; transform: translateX(-50%); max-width: min(480px, calc(100vw - 28px)); padding: 11px 16px; border-radius: 8px; background: #101828; color: #fff; box-shadow: var(--shadow); }
.gh-toast.error { background: #7a271a; }
.gh-kv { display: grid; grid-template-columns: 160px minmax(0,1fr); border-bottom: 1px solid #eef0f3; }
.gh-kv:last-child { border-bottom: 0; }
.gh-kv > span { padding: 13px 14px; background: #f9fafb; color: var(--muted); }
.gh-kv > strong, .gh-kv > div { padding: 13px 16px; font-weight: 500; min-width: 0; }
.gh-split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.gh-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #98a2b3; display: inline-block; }
.gh-status-dot.unread { background: #f0b21b; box-shadow: 0 0 0 4px #fff6d6; }
.gh-link-card { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 16px; text-align: left; cursor: pointer; }
.gh-link-card:hover { border-color: #e5bc49; box-shadow: 0 4px 14px rgba(21,31,51,.06); }
.gh-link-card strong, .gh-link-card small { display: block; }
.gh-link-card small { margin-top: 7px; color: var(--muted); line-height: 1.55; }
.gh-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.gh-banner { border-radius: 12px; padding: 24px; background: linear-gradient(120deg, #111827, #344054); color: #fff; overflow: hidden; position: relative; }
.gh-banner::after { content: ""; position: absolute; width: 260px; height: 260px; right: -50px; top: -130px; border-radius: 50%; background: radial-gradient(circle, rgba(255,211,82,.36), rgba(255,211,82,0)); }
.gh-banner h2 { margin: 0 0 8px; font-size: 23px; }
.gh-banner p { margin: 0; color: #d0d5dd; line-height: 1.7; max-width: 720px; }
.gh-rich-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 8px 8px 0 0; background: #f9fafb; }
.gh-rich-toolbar button { min-width: 32px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
.gh-rich-editor { min-height: 190px; border: 1px solid var(--line-strong); border-radius: 0 0 8px 8px; padding: 13px; line-height: 1.75; outline: none; }

@media (max-width: 960px) {
  .gh-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gh-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gh-split { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .gh-topbar { height: 58px; padding: 0 14px; }
  .gh-brand span { font-size: 13px; }
  .gh-brand small, .gh-user-copy, .gh-top-link.optional { display: none; }
  .gh-layout { min-height: calc(100vh - 58px); display: block; }
  .gh-sidebar { position: sticky; top: 58px; z-index: 24; padding: 0 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .gh-sidebar-label { display: none; }
  .gh-nav { display: flex; width: max-content; }
  .gh-nav button { width: auto; padding: 11px 10px; border-radius: 0; white-space: nowrap; }
  .gh-nav button.is-active { background: transparent; box-shadow: inset 0 -2px var(--brand); }
  .gh-nav-icon { display: none; }
  .gh-main { padding: 20px 14px 38px; }
  .gh-page-head { display: block; }
  .gh-page-head h1 { font-size: 23px; }
  .gh-head-actions { justify-content: flex-start; margin-top: 14px; }
  .gh-grid-2, .gh-grid-3, .gh-grid-4 { grid-template-columns: 1fr; }
  .gh-card-head { align-items: flex-start; padding: 15px 16px; }
  .gh-card-body { padding: 16px; }
  .gh-filter { padding: 14px 16px; }
  .gh-filter .gh-input, .gh-filter .gh-select { width: 100%; }
  .gh-tabs { gap: 20px; }
  .gh-dialog-layer { padding: 12px; }
  .gh-dialog { max-height: calc(100vh - 24px); border-radius: 12px; }
  .gh-dialog-head, .gh-dialog-body, .gh-dialog-foot { padding-left: 16px; padding-right: 16px; }
  .gh-kv { grid-template-columns: 112px minmax(0,1fr); }
}
@media (max-width: 360px) {
  .gh-brand svg { width: 30px; height: 30px; }
  .gh-top-actions { gap: 2px; }
  .gh-main { padding-left: 10px; padding-right: 10px; }
  .gh-page-head h1 { font-size: 21px; }
  .gh-button { padding-inline: 11px; }
  .gh-kv { grid-template-columns: 1fr; }
  .gh-kv > span { padding-bottom: 5px; }
  .gh-kv > strong, .gh-kv > div { padding-top: 5px; }
}

.d15-nav button { min-height: 44px; }
.d15-section-gap { margin-top: 18px; }
.d15-metrics { margin-bottom: 20px; }
.d15-metrics .gh-metric { min-width: 0; }
.d15-metrics .gh-metric strong { font-size: 22px; }
.d15-status-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 1fr)) auto;
  gap: 0;
  margin-bottom: 18px;
  padding: 0 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
}
.d15-status-strip > div {
  min-width: 0;
  padding: 16px 18px;
  border-right: 1px solid #eef0f3;
}
.d15-status-strip > div:first-child { padding-left: 0; }
.d15-status-strip > div:nth-last-child(2) { border-right: 0; }
.d15-status-strip span,
.d15-status-strip strong { display: block; }
.d15-status-strip > div > span { margin-bottom: 7px; color: var(--muted); font-size: 12px; }
.d15-status-strip .gh-tag { display: inline-flex; }
.d15-status-strip .d15-status-action {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  border-right: 0;
  padding-right: 0;
}
.d15-entity-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 18px;
}
.d15-entity-grid > .gh-card { margin-top: 0; }
.d15-current-application { margin: 0 0 18px; }
.d15-readonly-input[readonly] {
  color: var(--ink);
  background: #f7f8fa;
  cursor: not-allowed;
}
.d15-kv-list { display: grid; gap: 0; }
.d15-kv-list > div {
  display: grid;
  grid-template-columns: minmax(110px, .7fr) minmax(0, 1.3fr);
  gap: 18px;
  padding: 12px 0;
  border-bottom: 1px solid #eef0f3;
}
.d15-kv-list > div:last-child { border-bottom: 0; }
.d15-kv-list span { color: var(--muted); }
.d15-kv-list strong { text-align: right; overflow-wrap: anywhere; }
.d15-upload { min-height: 88px; }
.d15-filter-grid {
  display: grid;
  grid-template-columns: minmax(230px, 1.6fr) repeat(3, minmax(130px, 1fr)) auto;
  gap: 12px;
  align-items: end;
}
.d15-filter-grid .gh-field label { margin-bottom: 6px; color: var(--muted); font-size: 12px; }
.d15-filter-action {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  min-height: 40px;
}
.d15-original { min-width: 220px; max-width: 300px; line-height: 1.65; }
.d15-settlement-filter-grid { grid-template-columns: minmax(240px,1.6fr) repeat(5,minmax(120px,1fr)); }
.d15-settlement-filter-grid .d15-filter-action { grid-column: 1 / -1; }
.d15-settlement-table { min-width: 1100px; }
.d15-source-summary,
.d15-settlement-table .gh-tag { white-space: nowrap; }
.d15-settlement-table th:last-child,
.d15-settlement-table td:last-child {
  position: sticky;
  right: 0;
  z-index: 1;
  background: #fff;
  box-shadow: -6px 0 10px rgba(16,24,40,.05);
}
.d15-settlement-table th:last-child { z-index: 2; background: #f9fafb; }
.d15-mono {
  font-family: Consolas, "SFMono-Regular", monospace;
  font-size: 12px;
  white-space: nowrap;
}
.d15-text-button {
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--info);
  cursor: pointer;
  text-align: left;
  white-space: nowrap;
}
.d15-page-tools {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.d15-page-tools > div { display: flex; gap: 8px; }
.d15-page-tools > div:first-child { margin-right: auto; }
.d15-drawer-layer {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  justify-content: flex-end;
  background: rgba(16,24,40,.44);
}
.d15-drawer {
  width: min(980px, calc(100vw - 40px));
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #fff;
  box-shadow: -16px 0 40px rgba(16,24,40,.16);
}
.d15-drawer :focus-visible,
[data-testid="developer-finance-demo"] .gh-dialog :focus-visible {
  outline: 3px solid rgba(243,183,27,.48);
  outline-offset: 2px;
}
[data-testid="developer-finance-demo"] [inert] { pointer-events: none; }
.d15-payment-drawer,
.d15-history-drawer { width: min(720px, calc(100vw - 40px)); }
.d15-drawer-head {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 24px 17px;
  border-bottom: 1px solid var(--line);
  background: #fff;
}
.d15-drawer-head h2 { margin: 0; font-size: 21px; }
.d15-drawer-head p {
  display: flex;

    const year = Number(match[1]);
    const month = Number(match[2]);
    if (!Number.isInteger(year) || month < 1 || month > 12) return '';
    return month === 12
      ? String(year + 1).padStart(4,'0') + '-01'
      : String(year).padStart(4,'0') + '-' + String(month + 1).padStart(2,'0');
  }

    const generatedPeriod = match[1] + '-' + match[2];

        return payment.created <= payment.updated && events.every((event,index) => payment.created <= event.at && (!index || events[index - 1].at <= event.at)) && (!events.length || events[events.length - 1].at === payment.updated);
      }),
      paymentAttemptTransitionsValid,
      paymentEffectiveAmountsConsistent,
      paymentProofAccessValid:auditPayments.every(payment => {
        const attempt = currentPaymentAttempt(payment);
        const hasProof = Boolean(attempt && ['remitted','completed'].includes(paymentAttemptStatus(attempt)) && attempt.proofAvailable);
        return Boolean(downloadablePaymentAttempt(payment)) === hasProof;
      }),
      paymentAttemptAudit,
    };

      completed:['已完成','success'], failed:['失败','danger'], returned:['退回','danger'], held:['暂缓','warning'],
      carried:['已结转',''], cancelled:['已取消',''],

  function currentPaymentAttempt(payment) {

  function requiredMinor(control, currency) {
    const raw = control ? control.value.trim() : '';
    if (!raw) return null;
    const digits = CURRENCY_DIGITS[currency] ?? 2;
    const pattern = digits === 0 ? /^-?\d+$/ : new RegExp('^-?\\d+(?:\\.\\d{1,' + digits + '})?$');
    if (!pattern.test(raw)) return null;
    const valueMinor = minor(raw,currency);
    return Number.isSafeInteger(valueMinor) ? valueMinor : null;
  }

  function requiredPositiveInteger(control) {
    const raw = control ? control.value.trim() : '';
    if (!/^\d+$/.test(raw)) return null;
    const value = Number(raw);
    return Number.isSafeInteger(value) && value > 0 ? value : null;
  }

  function currentTaskFor(statement, payment) {
    const dispute = activeDisputes().find(item => item.statementId === statement.id && ['processing','supplement'].includes(item.status));
    if (dispute && dispute.status === 'supplement') return { label:'补充差异材料', tone:'warning', owner:'developer' };
    if (statement.status === 'voided') return { label:'无需处理', tone:'', owner:'none' };
    if (statement.status === 'pending') return { label:'确认账单', tone:'warning', owner:'developer' };
    if (statement.status === 'disputed') return { label:'等待差异处理', tone:'info', owner:'platform' };
    if (statement.status === 'confirmed') return { label:'等待平台锁单', tone:'info', owner:'platform' };
    if (statement.invoice === 'pending' && statement.requiresInvoice) return { label:'提交发票', tone:'warning', owner:'developer' };
    if (statement.invoice === 'rejected') return { label:'重新提交发票', tone:'danger', owner:'developer' };
    if (statement.invoice === 'reviewing') return { label:'等待发票审核', tone:'info', owner:'platform' };
    if (payment && ['failed','returned'].includes(payment.status) && payment.developerActionRequired) return { label:'处理收款资料', tone:'danger', owner:'developer' };
    const paymentState = payment ? payment.status : statement.payment;
    if (['completed','carried','cancelled'].includes(paymentState)) return { label:'无需处理', tone:'success', owner:'none' };
    return { label:'等待平台处理', tone:'info', owner:'platform' };

  function settlementUpdatedAt(statement, payment) {
    const disputeTimes = activeDisputes().filter(item => item.statementId === statement.id).flatMap(item => [
      item.submissionSnapshot && item.submissionSnapshot.submittedAt,
      ...(item.supplements || []).map(supplement => supplement.submittedAt),
      ...(item.timeline || []).map(event => event.at),
    ]);
    const paymentTimes = payment ? [
      payment.created,
      payment.updated,
      ...(payment.attempts || []).flatMap(attempt => (attempt.events || []).map(event => event.at)),
    ] : [];
    return [statement.generated,statement.updatedAt,statement.invoiceUpdatedAt,statement.invoiceData && statement.invoiceData.date,...disputeTimes,...paymentTimes]
      .filter(Boolean)
      .sort((left,right) => String(left).localeCompare(String(right)))
      .slice(-1)[0] || '—';
  }

  function filteredSettlementRecords() {

      const keywordText = [item.statementId,item.paymentId,item.period,providerRefs].join(' ').toLowerCase();
      if (f.keyword && !keywordText.includes(f.keyword.toLowerCase())) return false;
      if (f.period !== 'all' && item.period.slice(0,4) !== f.period) return false;
      if (f.source !== 'all' && !item.sources.includes(f.source)) return false;
      if (f.statementStatus !== 'all' && item.statementStatus !== f.statementStatus) return false;
      if (f.invoiceStatus !== 'all' && item.invoiceStatus !== f.invoiceStatus) return false;
      if (f.paymentStatus !== 'all' && item.paymentStatus !== f.paymentStatus) return false;
      return true;
    });
  }

  function filteredFlows() {
    return activeFlows().filter(item => {
      const f = state.flowFilters;
      if (f.keyword && !(item.id + item.game + item.sku).toLowerCase().includes(f.keyword.toLowerCase())) return false;
      if (f.type !== 'all' && item.type !== f.type) return false;
      if (f.period !== 'all' && item.date.slice(0,4) !== f.period) return false;
      if (f.currency !== 'all' && item.originalCurrency !== f.currency) return false;

    const end = Math.min(safePage * PAGE_SIZE, count);
    return '<div class="gh-pagination"><span>共 ' + count + ' 条，每页 20 条</span><span>' + start + '—' + end + '</span>' +
      '<button class="gh-button" type="button" data-page-group="' + group + '" data-page="' + (safePage - 1) + '" ' + (safePage <= 1 ? 'disabled' : '') + '>上一页</button>' +
      '<span>' + safePage + ' / ' + pages + '</span><button class="gh-button" type="button" data-page-group="' + group + '" data-page="' + (safePage + 1) + '" ' + (safePage >= pages ? 'disabled' : '') + '>下一页</button></div>';

  function disputeSnapshotDetails(dispute) {
    const snapshot = dispute.submissionSnapshot;
    const rows = [readonly('差异单号',dispute.id),readonly('差异类型',DISPUTE_TYPES[snapshot.type]),readonly('状态',disputeStatus(dispute.status)[0])];
    if (snapshot.flowIds && snapshot.flowIds.length) rows.push(readonly('关联流水',snapshot.flowIds.join('、')));
    if (snapshot.developerOrderNo) rows.push(readonly('开发者侧订单号',snapshot.developerOrderNo));
    if (snapshot.businessReference) rows.push(readonly('业务参考号',snapshot.businessReference));
    if (snapshot.keyBatch) rows.push(readonly('Key 批次',snapshot.keyBatch),readonly('渠道',snapshot.channel),readonly('平台数量',snapshot.platformQuantity),readonly('期望数量',snapshot.expectedQuantity));
    if (snapshot.itemRef) rows.push(readonly('流水或账单项',snapshot.itemRef));
    if (Number.isSafeInteger(snapshot.platformMinor)) rows.push(readonly('平台金额',money(snapshot.platformMinor,snapshot.currency)));
    if (Number.isSafeInteger(snapshot.expectedMinor)) rows.push(readonly('期望金额',money(snapshot.expectedMinor,snapshot.currency)));
    rows.push(readonly('附件',snapshot.attachment || '—'),'<div class="gh-field wide">' + readonly('差异说明',snapshot.reason) + '</div>');
    return rows.join('');
  }

    let body = '';

  function focusKeyTarget(key) {
    return [...app.querySelectorAll('[data-focus-key]')].find(node => node.dataset.focusKey === key) || null;
  }

  function rememberOverlayTrigger(node) {
    overlayFocus.triggerKeys.push((node && node.dataset.focusKey) || '');
    overlayFocus.pendingInitialFocus = true;
    overlayFocus.pendingRestoreKey = '';
  }

  function replaceOverlay() {
    overlayFocus.pendingInitialFocus = true;
    overlayFocus.pendingRestoreKey = '';
  }

  function prepareOverlayClose() {
    overlayFocus.pendingRestoreKey = overlayFocus.triggerKeys.pop() || '';
    overlayFocus.pendingInitialFocus = false;
  }

  function focusableIn(node) {
    if (!node) return [];
    return [...node.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex="0"]')]
      .filter(control => !control.closest('[inert]') && control.getAttribute('aria-hidden') !== 'true');
  }

  function topOverlay() {
    const overlays = [...app.querySelectorAll('[role="dialog"]')];
    return overlays[overlays.length - 1] || null;
  }

  function syncOverlayA11y() {
    const overlays = [...app.querySelectorAll('[role="dialog"]')];
    const current = overlays[overlays.length - 1] || null;
    const backgrounds = app.querySelectorAll('.gh-topbar, .gh-layout, .d15-scenario-switcher');
    backgrounds.forEach(node => {
      if (current) node.setAttribute('inert','');
      else node.removeAttribute('inert');
    });
    overlays.forEach(node => {
      if (node === current) node.removeAttribute('inert');
      else node.setAttribute('inert','');
    });

    const restoreKey = overlayFocus.pendingRestoreKey;
    overlayFocus.pendingRestoreKey = '';
    if (restoreKey) {
      const target = focusKeyTarget(restoreKey);
      if (target) {
        target.focus();
        return;
      }
    }
    if (current && (overlayFocus.pendingInitialFocus || !current.contains(document.activeElement))) {
      const target = focusableIn(current)[0] || current;
      target.focus();
    } else if (!current && restoreKey) {
      const route = app.querySelector('[data-route="' + primaryRoute() + '"]');
      if (route) route.focus();
    }
    overlayFocus.pendingInitialFocus = false;
  }

  function trapOverlayFocus(event) {
    if (event.key !== 'Tab') return false;
    const overlay = topOverlay();
    if (!overlay) return false;
    const focusable = focusableIn(overlay);
    if (!focusable.length) {
      event.preventDefault();
      overlay.focus();
      return true;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    } else if (!overlay.contains(document.activeElement)) {
      event.preventDefault();
      first.focus();
    }
    return true;
  }

  function syncEntityDraftFromDom() {

  function needsSwift(draft) {
    return !(draft.bankRegion === '中国大陆' && draft.settlementCurrency === 'CNY');
  }

  const BANK_PROOF_FIELDS = Object.freeze(['bankRegion','accountName','bankName','accountNumber','swift']);

  function bankProofFingerprint(draft) {
    return BANK_PROOF_FIELDS.map(key => String((draft && draft[key]) || '').trim()).join('\u001f');
  }

  function bindBankProofToDraft(draft) {
    state.bankProofFingerprint = draft && draft.bankProof ? bankProofFingerprint(draft) : '';
    state.bankProofNeedsRefresh = false;
  }

  function syncBankProofValidity() {
    const draft = state.entityDraft;
    if (!draft || !draft.bankProof) return;
    if (!state.bankProofFingerprint || bankProofFingerprint(draft) !== state.bankProofFingerprint) {
      draft.bankProof = '';
      state.bankProofFingerprint = '';
      state.bankProofNeedsRefresh = true;
    }
  }

  function validateEntity() {
    syncEntityDraftFromDom();
    const draft = state.entityDraft || {};
    const required = ['contactName','contactEmail','bankRegion','settlementCurrency','accountName','bankName','accountNumber','bankProof','taxRegion','taxNo','taxProof'];
    if (needsSwift(draft)) required.push('swift');
    const missing = required.filter(key => !String(draft[key] || '').trim());
    if (missing.length) return { message:'请补全必填资料。', fields:missing };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.contactEmail)) return { message:'请填写有效财务邮箱。', fields:['contactEmail'] };
    if (needsSwift(draft) && !/^[A-Za-z0-9]{8}([A-Za-z0-9]{3})?$/.test(draft.swift.replace(/\s/g,''))) return { message:'请填写有效 SWIFT / BIC。', fields:['swift'] };
    return null;
  }

  function saveTextFile(name, rows) {
    const blob = new Blob([rows], { type:'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }

  function csvCell(value) {
    let text = String(value == null ? '' : value);
    if (/^\s*[=+\-@]/u.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g,'""') + '"';
  }

  function csv(headers, rows) {
    return [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\n');
  }

  const STATEMENT_EXPORT_HEADERS = Object.freeze([
    '账单号','账期','版本','交易原币汇总','折算后销售额','退款','拒付','税费','支付费','平台分成','补贴与调整','应结算','币种',
    '生成时间','确认期限','账单状态','付款状态','平台直销小计','外部 Key 采购小计','盖世 Key 渠道小计',
  ]);
  const FLOW_EXPORT_HEADERS = Object.freeze([
    '流水号','日期','游戏','SKU','业务来源','履约方式','类型','交易原币','交易金额','汇率','汇率版本','折算金额','税费','支付费',
    '平台分成','调整','应结算','结算币种','结算模型','规则版本','结算对手方','账单号',
  ]);
  const PAYMENT_EXPORT_HEADERS = Object.freeze([
    '付款单号','账单号','付款状态','付款金额','剩余金额','币种','收款账户','财务主体版本','计划付款日','生成时间','更新时间',
    '付款尝试数','当前尝试状态','银行参考号','异常原因','是否需开发者处理','预计重试时间','下一次付款尝试',
  ]);

  function statementExportCsv(items) {
    return csv(STATEMENT_EXPORT_HEADERS,items.map(item => [
      item.id,item.period,item.version,item.originalSummary,decimal(item.salesMinor,item.currency),decimal(item.refundsMinor,item.currency),
      decimal(item.chargebacksMinor,item.currency),decimal(item.taxMinor,item.currency),decimal(item.providerFeeMinor,item.currency),
      decimal(item.platformShareMinor,item.currency),decimal(item.adjustmentsMinor,item.currency),decimal(item.settlementMinor,item.currency),item.currency,
      item.generated,item.deadline,statementStatus(item.status)[0],paymentStatus(paymentStateForStatement(item))[0],
      decimal(item.sourceTotalsMinor.direct_sale,item.currency),decimal(item.sourceTotalsMinor.external_key,item.currency),decimal(item.sourceTotalsMinor.gamehub_key,item.currency),
    ]));
  }

  function flowExportCsv(items) {
    return csv(FLOW_EXPORT_HEADERS,items.map(item => [
      item.id,item.date,item.game,item.sku,ledgerSourceLabel(item.ledgerSource),fulfillmentLabel(item.fulfillmentType),flowType(item.type)[0],
      item.originalCurrency,decimal(item.originalMinor,item.originalCurrency),item.fxRateText,item.fxVersion,decimal(item.convertedMinor,item.settlementCurrency),
      decimal(item.taxMinor,item.settlementCurrency),decimal(item.feeMinor,item.settlementCurrency),decimal(item.platformShareMinor,item.settlementCurrency),
      decimal(item.adjustmentMinor,item.settlementCurrency),decimal(item.settlementMinor,item.settlementCurrency),item.settlementCurrency,
      ruleModelLabel(item.ruleModel),item.ruleVersion,item.settlementCounterparty,item.statementId,
    ]));
  }

  function paymentExportCsv(items) {
    return csv(PAYMENT_EXPORT_HEADERS,items.map(item => {
      const attempt = currentPaymentAttempt(item);
      const attemptStatus = paymentAttemptStatus(attempt);
      return [
        item.id,item.statementId,paymentStatus(item.status)[0],decimal(item.amountMinor,item.currency),decimal(item.remainingMinor,item.currency),item.currency,
        item.account,item.accountVersion,item.planned,item.created,item.updated,item.attempts.length,paymentStatus(attemptStatus)[0] || '',
        attempt && attempt.providerRef ? attempt.providerRef : '',item.reason || '',item.developerActionRequired ? '是' : '否',
        item.estimatedRetryAt || '',item.nextAttempt || '',
      ];
    }));
  }

  function exportCsv(group) {
    if (group === 'statement') {
      const ids = new Set(filteredSettlementRecords().map(item => item.statementId));
      return statementExportCsv(activeStatements().filter(item => ids.has(item.id)));
    }
    if (group === 'flow') return flowExportCsv(filteredFlows());
    if (group === 'payment') return paymentExportCsv(filteredPayments());
    return csv([],[]);
  }

  app.addEventListener('input', event => {
    const entityControl = event.target.closest('[data-entity-field]');

    const entityControl = event.target.closest('[data-entity-field]');
    if (entityControl && state.entityDraft) {
      const key = entityControl.dataset.entityField;
      state.entityDraft[key] = entityControl.value;

      const value = app.querySelector('[data-testid="platform-amount"] strong');

      return;

    const control = event.target.closest('[data-filter-group]');

      if (group === 'flow') state.flowPage = 1;
      if (group === 'payment') state.paymentPage = 1;

      return;

  app.addEventListener('click', event => {
    const route = event.target.closest('[data-route]');
    if (route) {
      state.route = route.dataset.route;
      clearRouteOverlays();
      location.hash = '/' + state.route;
      render();
      return;
    }
    const drawerTab = event.target.closest('[data-statement-drawer-tab]');
    if (drawerTab) { state.statementDrawerTab = drawerTab.dataset.statementDrawerTab; state.disputeMode = false; render(); return; }
    const pager = event.target.closest('[data-page-group]');
    if (pager && !pager.disabled) {
      const page = Number(pager.dataset.page);
      if (pager.dataset.pageGroup === 'settlement') state.settlementPage = page;
      if (pager.dataset.pageGroup === 'flow') state.flowPage = page;
      if (pager.dataset.pageGroup === 'payment') state.paymentPage = page;
      render();
      return;
    }
    const actionNode = event.target.closest('[data-action]');
    if (!actionNode) return;
    const action = actionNode.dataset.action;
    if (action === 'open-flow-query') {
      clearRouteOverlays();
      state.route = 'settlement/flows';
      location.hash = '/settlement/flows';
      render();
    } else if (action === 'back-settlement') {
      clearRouteOverlays();
      state.route = 'settlement';
      location.hash = '/settlement';
      render();
    } else if (action === 'toggle-scenario-menu') {
      state.scenarioMenuOpen = !state.scenarioMenuOpen;

      setDemoScenario(actionNode.dataset.scenario);

      state.entityDraft = clone(entitySeed);
      state.entityDraft.effectiveVersion = '';
      bindBankProofToDraft(state.entityDraft);
      state.entityEditing = true;
      state.entityEditMode = 'initial';
      state.entityValidation = null;
      state.bankProofNeedsRefresh = false;
      render();
    } else if (action === 'start-change') {
      state.entityDraft = clone(activeEntity());
      bindBankProofToDraft(state.entityDraft);
      state.entityDraft.accountNumber = '782612340098';
      syncBankProofValidity();
      state.entityEditing = true;
      state.entityEditMode = 'change';
      state.entityValidation = null;
      render();
    } else if (action === 'cancel-entity-edit') {
      const entity = activeEntity();
      state.entityEditing = false;
      if (!entity.effectiveVersion) entity.status = 'unconfigured';
      state.entityDraft = null;
      state.entityValidation = null;
      state.bankProofNeedsRefresh = false;
      state.bankProofFingerprint = '';
      render();
    } else if (action === 'save-entity') {
      syncEntityDraftFromDom();
      const entity = activeEntity();
      if (!entity.effectiveVersion) entity.status = 'draft';
      setToast('已保存');

      const validationError = validateEntity();
      if (validationError) {
        state.entityValidation = validationError;
        render();
        return;
      }
      const entity = activeEntity();
      const isChange = state.entityEditMode === 'change' || Boolean(entity.effectiveVersion);
      entity.submittedVersion = 'FIN-2026-004';
      entity.status = isChange ? 'change_reviewing' : 'reviewing';
      setActiveApplicationSnapshot(state.entityDraft);
      state.entityValidation = null;
      state.entityEditing = false;
      setToast('已提交审核');
    } else if (action === 'view-submission') {
      rememberOverlayTrigger(actionNode);
      state.selectedHistory = '__submission';
      render();
    } else if (action === 'resume-entity-edit') {
      const entity = activeEntity();
      state.entityDraft = state.entityDraft || clone(activeApplicationSnapshot() || entity);
      if (!state.bankProofFingerprint) bindBankProofToDraft(state.entityDraft);
      state.entityEditing = true;
      state.entityEditMode = entity.effectiveVersion ? 'change' : 'initial';
      render();
    } else if (action === 'withdraw-review') {
      rememberOverlayTrigger(actionNode);
      state.dialog = 'withdraw';

        snapshot.platformMinor = disputeItemPlatformMinor(snapshot.itemRef,item);

        timeline:[deepFreeze({ action:'submitted', at:snapshot.submittedAt, operator:'开发者 王明', note:'已提交差异' })],
      });
      if (item) { item.status = 'disputed'; item.disputeStatus = 'processing'; }
      state.disputeMode = false;
      state.statementDrawerTab = 'dispute';
      setToast('差异已提交');
    } else if (action === 'confirm-supplement') {
      const reason = app.querySelector('[data-testid="supplement-reason"]');
      const dispute = state.disputes.filter(item => item.statementId === state.activeStatement).slice(-1)[0];
      if (!reason || !reason.value.trim()) {
        showFormError('d15-dispute-error','请填写补充说明。',['supplement-reason']);
        return;
      }
      if (dispute) {
        const supplement = deepFreeze({ reason:reason.value.trim(), attachment:state.disputeFile || '—', submittedAt:'2026-09-10 16:05', operator:'开发者 王明' });
        dispute.supplements.push(supplement);
        dispute.timeline.push(deepFreeze({ action:'supplemented', at:supplement.submittedAt, operator:supplement.operator, note:'已补充：' + supplement.reason + (state.disputeFile ? ' · ' + state.disputeFile : '') }));
        dispute.status = 'processing';
      }
      state.disputeMode = false;
      state.statementDrawerTab = 'dispute';
      setToast('材料已补充');
    } else if (action === 'submit-invoice') {
      const item = statements.find(row => row.id === state.activeStatement);
      const number = app.querySelector('[data-testid="invoice-number"]');
      const date = app.querySelector('[data-testid="invoice-date"]');
      const amount = app.querySelector('[data-testid="invoice-amount"]');
      const amountMinor = requiredMinor(amount,item ? item.currency : 'USD');
      const existingFile = item && item.invoiceData ? item.invoiceData.file : '';
      const invoiceFile = state.invoiceFile || existingFile;
      const invalidFields = [...(!number || !number.value.trim() ? ['invoice-number'] : []),...(!date || !date.value ? ['invoice-date'] : []),...(amountMinor === null || amountMinor <= 0 ? ['invoice-amount'] : []),...(!invoiceFile ? ['invoice-file'] : [])];
      if (invalidFields.length) {
        showFormError('d15-invoice-error','请填写发票号、日期、有效金额并上传附件。',invalidFields);
        return;
      }
      if (item && amountMinor !== item.settlementMinor) {
        showFormError('d15-invoice-error','发票金额须与账单应结算金额一致。',['invoice-amount']);
        return;
      }
      if (item) {
        item.invoice = 'reviewing';
        item.payment = 'awaiting_invoice';
        item.invoiceData = { number:number.value.trim(), date:date.value, amountMinor, currency:item.currency, file:invoiceFile };
        item.invoiceUpdatedAt = '2026-09-10 16:15';
      }
      state.invoiceFile = '';
      setToast('发票已提交');
    } else if (action === 'download-statement') {
      const item = statements.find(row => row.id === state.activeStatement);
      if (item) saveTextFile(item.id + '.csv',statementExportCsv([item]));
    } else if (action === 'download-payment-proof') {
      const item = payments.find(row => row.id === state.activePayment);
      const attempt = downloadablePaymentAttempt(item);
      if (attempt && (!actionNode.dataset.attempt || actionNode.dataset.attempt === attempt.id)) {
        saveTextFile(item.id + '-付款凭证.txt','付款单号：' + item.id + '\n付款尝试：' + attempt.id + '\n银行参考号：' + attempt.providerRef);
      }
    } else if (action === 'open-related-statement') {
      replaceOverlay();
      state.activePayment = '';
      state.route = 'settlement';
      state.activeStatement = actionNode.dataset.statement;
      state.statementDrawerTab = 'summary';
      if (location.hash !== '#/settlement') history.pushState(null,'','#/settlement');
      render();
    } else if (action === 'go-entity') {
      prepareOverlayClose();
      state.activePayment = '';
      state.route = 'entity';
      location.hash = '/entity';
      render();
    } else if (action === 'export-statements') {
      saveTextFile('结算记录.csv',exportCsv('statement'));
    } else if (action === 'export-flows') {
      saveTextFile('对账流水.csv',exportCsv('flow'));
    } else if (action === 'export-payments') {
      saveTextFile('付款记录.csv',exportCsv('payment'));
    } else if (action === 'apply-filters') {
      state.settlementFilters.keyword = state.filterKeywordDrafts.settlement;
      state.flowFilters.keyword = state.filterKeywordDrafts.flow;
      state.paymentFilters.keyword = state.filterKeywordDrafts.payment;
      state.settlementPage = 1; state.flowPage = 1; state.paymentPage = 1; render();
    } else if (action === 'reset-settlement-filters') {
      state.settlementFilters = { keyword:'', period:'all', source:'all', statementStatus:'all', invoiceStatus:'all', paymentStatus:'all' }; state.filterKeywordDrafts.settlement = ''; state.settlementPage = 1; render();
    } else if (action === 'reset-flow-filters') {
      state.flowFilters = { keyword:'', type:'all', source:'all', period:'all', currency:'all' }; state.filterKeywordDrafts.flow = ''; state.flowPage = 1; render();
    } else if (action === 'reset-payment-filters') {
      state.paymentFilters = { keyword:'', status:'all', period:'all', currency:'all' }; state.filterKeywordDrafts.payment = ''; state.paymentPage = 1; render();
    } else if (action === 'close-dialog') {
      prepareOverlayClose();
      state.dialog = ''; render();
    }
  });

  window.addEventListener('hashchange', () => {
    state.route = routeFromHash();
    clearRouteOverlays();
    render();
  });
  window.addEventListener('keydown', event => {
    if (trapOverlayFocus(event)) return;
    if (event.key === 'Escape' && topOverlay()) {
      event.preventDefault();
      prepareOverlayClose();
      if (state.dialog) {
        state.dialog = '';
      } else {
        state.activeStatement = '';
        state.activePayment = '';
        state.selectedHistory = '';
        state.disputeMode = false;
        state.invoiceFile = '';
        state.disputeFile = '';
      }
      render();
      return;
    }
    if (state.scenarioMenuOpen) {
      const item = event.target.closest && event.target.closest('[role="menuitemradio"]');
      const items = [...app.querySelectorAll('[role="menuitemradio"]')];
      if (item && ['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(event.key)) {
        event.preventDefault();
        const index = items.indexOf(item);
        const nextIndex = event.key === 'Home' ? 0
          : event.key === 'End' ? items.length - 1
          : ['ArrowDown','ArrowRight'].includes(event.key) ? (index + 1) % items.length
          : (index - 1 + items.length) % items.length;
        items.forEach((node,itemIndex) => { node.tabIndex = itemIndex === nextIndex ? 0 : -1; });
        if (items[nextIndex]) items[nextIndex].focus();
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        state.scenarioMenuOpen = false;
        render();
        const orb = app.querySelector('[data-testid="scenario-orb"]');
        if (orb) orb.focus();
        return;
      }
    }
    if (event.key !== 'Escape') return;
    state.scenarioMenuOpen = false;
    render();
  });
  window.__developerFinanceDemo = {
    snapshot:() => {
      const audit = auditLedgerData(auditFixture());
      const currentStatements = activeStatements();
      const currentPayments = activePayments();
      const currentDisputes = activeDisputes();
      const invoiceData = currentStatements.filter(item => item.invoiceData).map(item => item.invoiceData);
      const paymentAudit = auditPaymentData({ statements:currentStatements, payments:currentPayments });
      return clone({
        scenario:state.demoScenario,
        moneyStorage:state.demoScenario === 'empty' || audit.moneyAmountsAreIntegers ? 'minor-unit-integer' : 'invalid',
        route:state.route, entity:activeEntity(), statements:currentStatements.map(item => ({ id:item.id, status:item.status, payment:item.payment, invoice:item.invoice })),
        settlementRecords:activeSettlementRecords(),
        counts:{ statements:currentStatements.length, flows:activeFlows().length, disputes:activeDisputes().length, invoices:activeInvoices().length, payments:currentPayments.length },
        ledgerSources:[...new Set(activeFlows().map(item => item.ledgerSource))],
        statementStatuses:[...new Set(currentStatements.map(item => item.status))],
        disputeStatuses:[...new Set(currentDisputes.map(item => item.status))],
        invoiceStatuses:[...new Set(currentStatements.map(item => item.invoice))],
        disputeRecords:currentDisputes,
        disputeSnapshotsImmutable:currentDisputes.every(item => Object.isFrozen(item.submissionSnapshot) && item.timeline.every(Object.isFrozen) && item.supplements.every(Object.isFrozen)),
        invoiceDataComplete:invoiceData.length > 0 && invoiceData.every(item => item.number && item.date && Number.isSafeInteger(item.amountMinor) && item.currency && item.file),
        invoiceAmountsAreIntegers:invoiceData.length > 0 && invoiceData.every(item => Number.isSafeInteger(item.amountMinor)),
        paymentStatuses:[...new Set(currentPayments.map(item => item.status))],
        pages:{ settlements:Math.ceil(filteredSettlementRecords().length / PAGE_SIZE), flows:Math.ceil(filteredFlows().length / PAGE_SIZE) },
        statementIdsUnique:new Set(currentStatements.map(item => item.id)).size === currentStatements.length,
        ...audit,
        ...paymentAudit,
      });
    },
    auditFixture:() => clone(auditFixture()),
    auditLedger:fixture => clone(auditLedgerData(fixture)),
    paymentAuditFixture:() => clone(paymentAuditFixture()),
    auditPayments:fixture => clone(auditPaymentData(fixture)),
    exportCsv,
    csvCell,
    overlaySnapshot:() => clone({
      activeStatement:state.activeStatement,
      activePayment:state.activePayment,
      selectedHistory:state.selectedHistory,
      dialog:state.dialog,
      disputeMode:Boolean(state.disputeMode),
      disputeFile:state.disputeFile,
      invoiceFile:state.invoiceFile,
      focusDepth:overlayFocus.triggerKeys.length,
    }),
    setDemoScenario,
    setEntityScenario:(status, overrides) => {
      state.entity = { ...clone(entitySeed), ...(overrides ? clone(overrides) : {}), status };
      if (status === 'unconfigured' || status === 'draft' || status === 'reviewing') state.entity.effectiveVersion = '';
      const hasApplication = ['reviewing','change_reviewing','supplement'].includes(status);
      if (hasApplication && !state.entity.submittedVersion) state.entity.submittedVersion = 'FIN-2026-010';
      setActiveApplicationSnapshot(hasApplication ? state.entity : null);
      state.entityDraft = (status === 'draft' || status === 'supplement') ? clone(activeApplicationSnapshot() || state.entity) : null;
      state.entityEditing = status === 'draft' || status === 'supplement';
      state.entityEditMode = state.entity.effectiveVersion ? 'change' : 'initial';
      state.entityValidation = null;
      if (state.entityDraft) bindBankProofToDraft(state.entityDraft);
      else {
        state.bankProofNeedsRefresh = false;
        state.bankProofFingerprint = '';
      }
      state.route = 'entity';
      render();
    },
    reset:() => location.reload(),
  };
  render();
})();</script>
</body>
