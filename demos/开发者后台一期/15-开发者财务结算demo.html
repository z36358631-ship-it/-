<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>开发者财务结算｜盖世游戏开发者平台</title>
  <style>* { box-sizing: border-box; }
:root {
  --brand: #f3b71b;
  --brand-strong: #d89200;
  --brand-soft: #fff8df;
  --ink: #172033;
  --muted: #667085;
  --line: #e4e7ec;
  --line-strong: #d0d5dd;
  --page: #f5f7fa;
  --surface: #ffffff;
  --soft: #f8fafc;
  --success: #14804a;
  --success-soft: #ecfdf3;
  --warning: #b54708;
  --warning-soft: #fffaeb;
  --danger: #b42318;
  --danger-soft: #fef3f2;
  --info: #175cd3;
  --info-soft: #eff8ff;
  --radius: 10px;
  --shadow: 0 10px 30px rgba(21, 31, 51, .08);
  --font: "Microsoft YaHei UI", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: var(--info); text-decoration: none; }
.gh-app { min-height: 100vh; }
.gh-topbar { height: 64px; padding: 0 28px; background: #111827; color: #fff; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
.gh-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .02em; }
.gh-brand svg { width: 34px; height: 34px; }
.gh-brand small { display: block; margin-top: 2px; color: #98a2b3; font-size: 11px; font-weight: 500; }
.gh-top-actions { display: flex; align-items: center; gap: 10px; }
.gh-top-link { border: 0; background: transparent; color: #d0d5dd; cursor: pointer; padding: 8px 10px; border-radius: 7px; }
.gh-top-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.gh-user { display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.14); }
.gh-avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(135deg, var(--brand), #ffdd75); color: #523600; font-weight: 800; }
.gh-user-copy strong, .gh-user-copy small { display: block; }
.gh-user-copy small { margin-top: 2px; color: #98a2b3; font-size: 11px; }
.gh-layout { min-height: calc(100vh - 64px); display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.gh-sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px; }
.gh-sidebar-label { padding: 0 12px 10px; color: #98a2b3; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.gh-nav { display: grid; gap: 4px; }
.gh-nav button { width: 100%; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 11px; padding: 11px 12px; color: #475467; cursor: pointer; text-align: left; }
.gh-nav button:hover { background: #f9fafb; color: var(--ink); }
.gh-nav button.is-active { background: var(--brand-soft); color: #9a6700; font-weight: 700; }
.gh-nav-icon { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #d9dde5; border-radius: 6px; font-size: 11px; font-weight: 800; }
.gh-nav button.is-active .gh-nav-icon { border-color: #efc85e; background: #fff6cf; }
.gh-main { min-width: 0; padding: 30px 34px 56px; }
.gh-content { width: min(1180px, 100%); margin: 0 auto; }
.gh-breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #98a2b3; font-size: 13px; margin-bottom: 18px; }
.gh-breadcrumb button { border: 0; background: none; color: var(--info); padding: 0; cursor: pointer; }
.gh-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
.gh-page-head h1 { margin: 0; font-size: 28px; line-height: 1.3; letter-spacing: -.02em; }
.gh-page-head p { margin: 7px 0 0; color: var(--muted); line-height: 1.7; }
.gh-head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.gh-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(16,24,40,.02); overflow: hidden; }
.gh-card + .gh-card { margin-top: 18px; }
.gh-card-head { min-height: 62px; padding: 17px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.gh-card-head h2 { margin: 0; font-size: 16px; }
.gh-card-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.gh-card-body { padding: 20px; }
.gh-grid-2, .gh-grid-3, .gh-grid-4 { display: grid; gap: 16px; }
.gh-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gh-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gh-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.gh-metric { padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.gh-metric span { color: var(--muted); font-size: 12px; }
.gh-metric strong { display: block; margin: 12px 0 6px; font-size: 24px; font-variant-numeric: tabular-nums; }
.gh-metric small { color: #98a2b3; }
.gh-button { min-height: 38px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 8px 15px; font-weight: 650; cursor: pointer; transition: .16s ease; }
.gh-button:hover { border-color: #98a2b3; background: #f9fafb; }
.gh-button.primary { border-color: var(--brand); background: var(--brand); color: #332300; }
.gh-button.primary:hover { border-color: var(--brand-strong); background: #e9aa0a; }
.gh-button.danger { border-color: #fda29b; color: var(--danger); background: #fff; }
.gh-button.link { border-color: transparent; background: transparent; color: var(--info); padding-inline: 6px; }
.gh-button:disabled { border-color: var(--line); background: #f2f4f7; color: #98a2b3; cursor: not-allowed; }
.gh-tag { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; border-radius: 999px; padding: 3px 9px; background: #f2f4f7; color: #475467; font-size: 12px; white-space: nowrap; }
.gh-tag.success { background: var(--success-soft); color: var(--success); }
.gh-tag.warning { background: var(--warning-soft); color: var(--warning); }
.gh-tag.danger { background: var(--danger-soft); color: var(--danger); }
.gh-tag.info { background: var(--info-soft); color: var(--info); }
.gh-notice { margin-bottom: 18px; padding: 14px 16px; border: 1px solid #b2ddff; background: var(--info-soft); border-radius: 9px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; color: #1849a9; }
.gh-notice.warning { border-color: #fedf89; background: var(--warning-soft); color: #93370d; }
.gh-notice.danger { border-color: #fecdca; background: var(--danger-soft); color: #912018; }
.gh-notice strong { display: block; margin-bottom: 4px; }
.gh-notice p { margin: 0; line-height: 1.65; }
.gh-tabs { display: flex; align-items: center; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.gh-tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 12px 1px 11px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.gh-tabs button.is-active { color: var(--ink); border-bottom-color: var(--brand); font-weight: 700; }
.gh-field { min-width: 0; }
.gh-field.wide { grid-column: 1 / -1; }
.gh-field label, .gh-label { display: block; margin-bottom: 8px; color: #344054; font-weight: 650; }
.gh-required::after { content: " *"; color: var(--danger); }
.gh-input, .gh-select, .gh-textarea { width: 100%; min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 9px 11px; color: var(--ink); outline: none; }
.gh-input:focus, .gh-select:focus, .gh-textarea:focus { border-color: #d9a50e; box-shadow: 0 0 0 3px rgba(243,183,27,.15); }
.gh-textarea { min-height: 112px; resize: vertical; line-height: 1.7; }
.gh-hint { display: block; margin-top: 6px; color: #98a2b3; font-size: 12px; line-height: 1.5; }
.gh-error { min-height: 18px; margin-top: 5px; color: var(--danger); font-size: 12px; }
.gh-checks { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.gh-checks label { display: flex; align-items: center; gap: 7px; color: #475467; font-weight: 500; }
.gh-upload { position: relative; min-height: 104px; border: 1px dashed #b8c0cc; border-radius: 8px; background: #fbfcfd; display: grid; place-items: center; padding: 16px; color: var(--muted); text-align: center; cursor: pointer; }
.gh-upload:hover { border-color: #d9a50e; background: #fffdf6; }
.gh-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.gh-form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 20px; margin-top: 20px; border-top: 1px solid var(--line); }
.gh-table-wrap { overflow-x: auto; }
.gh-table { width: 100%; border-collapse: collapse; min-width: 760px; }
.gh-table th { height: 44px; padding: 10px 14px; background: #f9fafb; color: #667085; font-size: 12px; text-align: left; font-weight: 700; border-bottom: 1px solid var(--line); }
.gh-table td { padding: 14px; border-bottom: 1px solid #eef0f3; color: #344054; vertical-align: middle; }
.gh-table tbody tr:last-child td { border-bottom: 0; }
.gh-table tbody tr:hover { background: #fcfcfd; }
.gh-table strong, .gh-table small { display: block; }
.gh-table small { margin-top: 4px; color: #98a2b3; }
.gh-row-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.gh-empty { padding: 62px 20px; text-align: center; color: var(--muted); }
.gh-empty-mark { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 16px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px; }
.gh-readonly { padding: 13px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.gh-readonly span, .gh-readonly strong, .gh-readonly small { display: block; }
.gh-readonly span { color: var(--muted); font-size: 12px; }
.gh-readonly strong { margin: 8px 0 4px; color: #344054; word-break: break-word; }
.gh-readonly small { color: #98a2b3; line-height: 1.5; }
.gh-code { border-radius: 8px; background: #101828; color: #d1fadf; padding: 14px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; overflow-x: auto; }
.gh-filter { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.gh-filter .gh-input { width: min(300px, 100%); }
.gh-filter .gh-select { width: 160px; }
.gh-pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.gh-dialog-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(16,24,40,.48); backdrop-filter: blur(2px); }
.gh-dialog { width: min(560px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: #fff; border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.gh-dialog.wide { width: min(820px, 100%); }
.gh-dialog-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 18px; }
.gh-dialog-head h2 { margin: 0; font-size: 19px; }
.gh-dialog-head p { margin: 6px 0 0; color: var(--muted); line-height: 1.6; }
.gh-dialog-close { width: 32px; height: 32px; border: 0; border-radius: 7px; background: #f2f4f7; cursor: pointer; font-size: 21px; color: var(--muted); }
.gh-dialog-body { padding: 20px 22px; overflow-y: auto; }
.gh-dialog-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
.gh-toast { position: fixed; top: 82px; left: 50%; z-index: 100; transform: translateX(-50%); max-width: min(480px, calc(100vw - 28px)); padding: 11px 16px; border-radius: 8px; background: #101828; color: #fff; box-shadow: var(--shadow); }
.gh-toast.error { background: #7a271a; }
.gh-kv { display: grid; grid-template-columns: 160px minmax(0,1fr); border-bottom: 1px solid #eef0f3; }
.gh-kv:last-child { border-bottom: 0; }
.gh-kv > span { padding: 13px 14px; background: #f9fafb; color: var(--muted); }
.gh-kv > strong, .gh-kv > div { padding: 13px 16px; font-weight: 500; min-width: 0; }
.gh-split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.gh-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #98a2b3; display: inline-block; }
.gh-status-dot.unread { background: #f0b21b; box-shadow: 0 0 0 4px #fff6d6; }
.gh-link-card { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 16px; text-align: left; cursor: pointer; }
.gh-link-card:hover { border-color: #e5bc49; box-shadow: 0 4px 14px rgba(21,31,51,.06); }
.gh-link-card strong, .gh-link-card small { display: block; }
.gh-link-card small { margin-top: 7px; color: var(--muted); line-height: 1.55; }
.gh-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.gh-banner { border-radius: 12px; padding: 24px; background: linear-gradient(120deg, #111827, #344054); color: #fff; overflow: hidden; position: relative; }
.gh-banner::after { content: ""; position: absolute; width: 260px; height: 260px; right: -50px; top: -130px; border-radius: 50%; background: radial-gradient(circle, rgba(255,211,82,.36), rgba(255,211,82,0)); }
.gh-banner h2 { margin: 0 0 8px; font-size: 23px; }
.gh-banner p { margin: 0; color: #d0d5dd; line-height: 1.7; max-width: 720px; }
.gh-rich-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 8px 8px 0 0; background: #f9fafb; }
.gh-rich-toolbar button { min-width: 32px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
.gh-rich-editor { min-height: 190px; border: 1px solid var(--line-strong); border-radius: 0 0 8px 8px; padding: 13px; line-height: 1.75; outline: none; }

@media (max-width: 960px) {
  .gh-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gh-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gh-split { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .gh-topbar { height: 58px; padding: 0 14px; }
  .gh-brand span { font-size: 13px; }
  .gh-brand small, .gh-user-copy, .gh-top-link.optional { display: none; }
  .gh-layout { min-height: calc(100vh - 58px); display: block; }
  .gh-sidebar { position: sticky; top: 58px; z-index: 24; padding: 0 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .gh-sidebar-label { display: none; }
  .gh-nav { display: flex; width: max-content; }
  .gh-nav button { width: auto; padding: 11px 10px; border-radius: 0; white-space: nowrap; }
  .gh-nav button.is-active { background: transparent; box-shadow: inset 0 -2px var(--brand); }
  .gh-nav-icon { display: none; }
  .gh-main { padding: 20px 14px 38px; }
  .gh-page-head { display: block; }
  .gh-page-head h1 { font-size: 23px; }
  .gh-head-actions { justify-content: flex-start; margin-top: 14px; }
  .gh-grid-2, .gh-grid-3, .gh-grid-4 { grid-template-columns: 1fr; }
  .gh-card-head { align-items: flex-start; padding: 15px 16px; }
  .gh-card-body { padding: 16px; }
  .gh-filter { padding: 14px 16px; }
  .gh-filter .gh-input, .gh-filter .gh-select { width: 100%; }
  .gh-tabs { gap: 20px; }
  .gh-dialog-layer { padding: 12px; }
  .gh-dialog { max-height: calc(100vh - 24px); border-radius: 12px; }
  .gh-dialog-head, .gh-dialog-body, .gh-dialog-foot { padding-left: 16px; padding-right: 16px; }
  .gh-kv { grid-template-columns: 112px minmax(0,1fr); }
}
@media (max-width: 360px) {
  .gh-brand svg { width: 30px; height: 30px; }
  .gh-top-actions { gap: 2px; }
  .gh-main { padding-left: 10px; padding-right: 10px; }
  .gh-page-head h1 { font-size: 21px; }
  .gh-button { padding-inline: 11px; }
  .gh-kv { grid-template-columns: 1fr; }
  .gh-kv > span { padding-bottom: 5px; }
  .gh-kv > strong, .gh-kv > div { padding-top: 5px; }
}

/* 开发者财务：浅色导航、主体月度汇总与单层核账详情。 */
.d15-app .gh-sidebar { background:#fff; border-right-color:#e4e7ec; }
.d15-app .d15-nav button { min-height:44px; color:#596577; }
.d15-app .d15-nav button:hover { color:#1f2937; background:#f4f5f7; }
.d15-app .d15-nav button.is-active { color:#182235; background:#eef0f2; font-weight:700; }
.d15-app .d15-nav button.is-active .gh-nav-icon { color:#324153; border-color:#d7dce3; background:#fff; }
.d15-app .gh-content { max-width:none; }

.d15-entity-summary .gh-card-body { padding:22px; }
.d15-entity-summary h2,.d15-section-title h2 { margin:0; color:#172033; font-size:16px; }
.d15-entity-summary p,.d15-section-title p { margin:7px 0 0; color:#8a94a5; font-size:12px; line-height:1.6; }
.d15-entity-summary-row { min-width:0; display:flex; align-items:center; justify-content:space-between; gap:24px; }
.d15-entity-review { min-width:0; display:flex; align-items:center; justify-content:flex-end; gap:10px; color:#667085; font-size:12px; }
.d15-entity-review > span:last-child,.d15-entity-review > strong { min-width:0; font-weight:500; }
.d15-entity-review.danger > strong { color:#b42318; }
.d15-section-title { margin:28px 0 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:18px; }
.d15-section-title > div:last-child { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.d15-entity-detail-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:26px 46px; padding:24px 26px 28px !important; }
.d15-entity-detail-grid .gh-readonly { min-width:0; padding:0; border:0; background:transparent; }
.d15-entity-detail-grid .gh-readonly span { color:#667085; }
.d15-entity-detail-grid .gh-readonly strong { margin-top:7px; color:#172033; font-size:14px; line-height:1.5; }
.d15-proof-field { grid-column:span 2; }
.d15-proof-card { width:min(420px,100%); min-height:58px; margin-top:8px; padding:10px 12px; display:grid; grid-template-columns:34px minmax(0,1fr) auto; align-items:center; gap:10px; color:#344054; text-align:left; border:1px solid #d8dee7; border-radius:8px; background:#f9fafb; cursor:pointer; }
.d15-proof-card:hover { border-color:#7dd9e5; background:#f2fcfd; }
.d15-proof-card > span { width:34px; height:34px; display:grid; place-items:center; color:#176b78; border-radius:7px; background:#daf5f8; font-size:12px; font-weight:750; }
.d15-proof-card > strong { min-width:0; margin:0 !important; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.d15-proof-card > small { margin:0 !important; color:#175cd3 !important; white-space:nowrap; }
.d15-history-table { min-width:920px !important; }
.d15-history-table th,.d15-history-table td { white-space:nowrap; }
.d15-history-table th:last-child,.d15-history-table td:last-child { width:72px; }
.d15-entity-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 32px; padding:24px 26px 28px !important; }
.d15-entity-field { min-width:0; }
.d15-entity-field label:not(.gh-upload),.d15-entity-field .gh-label { margin-bottom:8px; color:#344054; font-size:13px; font-weight:650; }
.d15-entity-field .gh-input[aria-invalid="true"],.d15-entity-upload.is-error { border-color:#f04438; }
.d15-entity-field .gh-input[aria-invalid="true"]:focus { box-shadow:0 0 0 3px rgba(240,68,56,.12); }
.d15-field-error { display:block; margin-top:6px; color:#b42318; font-size:12px; line-height:1.4; }
.gh-field .d15-entity-upload { min-height:116px; display:grid; align-content:center; gap:6px; }
.publisher-finance .gh-field label.d15-entity-upload { display:grid; }
.d15-entity-upload strong { max-width:100%; overflow:hidden; color:#344054; font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
.d15-entity-upload span { color:#7a8494; font-size:12px; }
.d15-entity-alert { margin:0 0 12px; padding:10px 12px; color:#b42318; border:1px solid #fecdca; border-radius:8px; background:#fef3f2; font-size:12px; }

.d15-filters {
  min-width:0;
  margin-bottom:16px;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(4,minmax(140px,1fr)) auto;
  align-items:end;
  gap:12px;
  border:1px solid #e1e6ed;
  border-radius:10px;
  background:#fff;
}
.d15-filters label { min-width:0; display:grid; gap:7px; }
.d15-filters label > span { color:#5f6a7c; font-size:12px; font-weight:650; }
.d15-filter-actions { display:flex; align-items:center; gap:8px; }
.d15-settlement-card { min-width:0; }

        accountFull:row.accountFull, swift:row.swift, provider:row.provider, eventCount:0,

    const focusTarget = () => {
      let control = null;
      if (target.type === 'batch') control = document.querySelector('[data-finance-action="open-batch-confirm"]');
      if (target.type === 'statement') {
        control = [...document.querySelectorAll('[data-confirm-statement-id]')].find(node => node.dataset.confirmStatementId === target.id)
          || [...document.querySelectorAll('[data-statement-id]')].find(node => node.dataset.statementId === target.id);
        if (control?.matches('tr')) control.tabIndex = -1;
        if (!control) control = document.querySelector('[data-finance-action="open-batch-confirm"]');
      }
      control?.focus();
    };
    focusTarget();
    requestAnimationFrame(focusTarget);
  };
  const rerender = () => {
    if (embedded && typeof state.callbacks.onChange === 'function') state.callbacks.onChange({ preserveScroll:true });
    else standaloneRender();
    if (state.confirmationIds.length) focusFirstConfirmationControl();
  };
  const closeConfirmation = () => {
    const returnTarget = state.confirmationReturn;
    state.confirmationIds = [];
    state.confirmationReturn = null;
    rerender();
    restoreConfirmationFocus(returnTarget);
  };
  const readFilters = () => {
    state.filters = {
      billingMonth:document.querySelector('[data-d15-filter="billingMonth"]')?.value || 'all',
      settlementMonth:document.querySelector('[data-d15-filter="settlementMonth"]')?.value || 'all',
      gameId:document.querySelector('[data-d15-filter="gameId"]')?.value || 'all',
      status:document.querySelector('[data-d15-filter="status"]')?.value || 'all',
    };
    state.page = 1;
    state.selectedStatementIds = [];
    state.confirmationIds = [];
    state.confirmationReturn = null;
    state.exportMessage = '';
  };
  const save = (content, filename) => {
    try {
      const href = URL.createObjectURL(new Blob([content], { type:'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = href;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(href), 0);
      return true;
    } catch { return false; }
  };

  const startEntityEdit = () => {
    state.entityMode = 'edit';
    state.entityDraft = cloneEntity(draftSource());
    state.entityFile = null;
    state.entityErrors = {};
    state.entityError = '';
    rerender();
  };
  const cancelEntityEdit = () => {
    state.entityMode = 'view';
    state.entityDraft = null;
    state.entityFile = null;
    state.entityErrors = {};
    state.entityError = '';
    rerender();
  };
  const readEntityDraft = () => {
    const form = document.querySelector('[data-d15-entity-form]');
    const draft = cloneEntity(state.entityDraft || draftSource() || {});
    entityFields.forEach(field => { draft[field.key] = form?.elements.namedItem(field.key)?.value?.trim() || ''; });
    const file = form?.elements.namedItem('bankProof')?.files?.[0] || state.entityFile;
    if (file) draft.bankProof = { name:file.name, type:file.type, size:file.size };
    return draft;
  };
  const validateEntityDraft = draft => {
    const errors = {};
    entityFields.forEach(field => { if (!draft[field.key]) errors[field.key] = `${field.label}为必填项`; });
    if (!errors.phone && !/^1[3-9]\d{9}$/.test(draft.phone)) errors.phone = '请填写正确的中国大陆手机号';
    if (!errors.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.email)) errors.email = '请填写正确的邮箱';
    if (!errors.bankAccountName && !errors.legalName && draft.bankAccountName !== draft.legalName) errors.bankAccountName = '银行账户户名必须与企业法定名称一致';
    if (!draft.bankProof?.name) errors.bankProof = '请上传银行账户证明附件';
    else if (!['image/jpeg','image/png','image/webp'].includes(draft.bankProof.type)) errors.bankProof = '银行证明附件仅支持 JPG、PNG、WEBP';
    else if (Number(draft.bankProof.size || 0) > 10 * 1024 * 1024) errors.bankProof = '银行证明附件不能超过 10 MB';
    return errors;
  };
  const focusFirstEntityError = () => {
    const firstError = document.querySelector('[data-d15-entity-form] [aria-invalid="true"]');
    firstError?.scrollIntoView({ block:'center', behavior:'smooth' });
    firstError?.focus();
  };
  const submitEntity = () => {
    const draft = readEntityDraft();
    const errors = validateEntityDraft(draft);
    state.entityDraft = draft;
    state.entityErrors = errors;
    state.entityError = Object.values(errors)[0] || '';
    if (state.entityError) {
      rerender();
      focusFirstEntityError();
      return;
    }
    try {
      statements.submitFinancialEntity(state.statementState, {
        ...draft,
        developerId:DEVELOPER_ID,
        developerName:DEVELOPER_NAME,
        submittedBy:draft.contactName,
      });
      state.entityMode = 'view';
      state.entityDraft = null;
      state.entityFile = null;
      state.entityErrors = {};
      state.entityError = '';
      rerender();
    } catch (error) {
      state.entityError = error?.message || '提交失败，请重试';
      rerender();
    }
  };
  const reviewEntity = (result, reason = '') => {
    const pending = entityApplications().find(application => application.status === 'pending');
    if (!pending) return false;
    statements.reviewFinancialEntity(state.statementState, pending.id, {
      result,
      reason,
      operator:'平台运营 李然',
    });
    state.entityMode = 'view';
    state.entityDraft = null;
    state.entityFile = null;
    state.entityErrors = {};
    state.entityError = '';
    rerender();
    return true;
  };

  document.addEventListener('click', event => {
    const routeButton = event.target.closest('[data-route]');
    if (routeButton && !embedded) {
      state.route = routeButton.dataset.route === 'entity' ? 'entity' : 'settlement';
      state.page = 1;
      state.selectedStatementIds = [];
      state.confirmationIds = [];
      state.confirmationReturn = null;
      location.hash = `#/${state.route}`;
      standaloneRender();
      return;
    }
    const control = event.target.closest('[data-finance-action]');
    if (!control || control.disabled || control.getAttribute('aria-disabled') === 'true') return;
    const action = control.dataset.financeAction;
    if (['cancel-confirm','close-proof','close-history','close-game-sales','close-cdkey'].includes(action)
      && (control.classList.contains('d15-dialog-layer') || control.classList.contains('d15-drawer-layer'))
      && event.target.closest('[data-finance-stop]')) return;
    if (action === 'query') { readFilters(); rerender(); }
    if (action === 'reset-filters') { state.filters = { billingMonth:'all',settlementMonth:'all',gameId:'all',status:'all' }; state.page = 1; state.selectedStatementIds = []; state.confirmationIds = []; state.confirmationReturn = null; state.exportMessage = ''; rerender(); }
    if (action === 'page') { state.page = Math.max(1,Number(control.dataset.page) || 1); rerender(); }
    if (action === 'open-confirm') { state.confirmationReturn = { type:'statement',id:control.dataset.confirmStatementId }; state.confirmationIds = [control.dataset.confirmStatementId].filter(Boolean); rerender(); }
    if (action === 'open-batch-confirm') { state.confirmationReturn = { type:'batch' }; state.confirmationIds = selectedPendingRows().map(row => row.id); rerender(); }
    if (action === 'cancel-confirm') closeConfirmation();
    if (action === 'confirm-statements') {
      const ids = confirmationRows().map(row => row.id);
      statements.confirmStatements(state.statementState,ids,{ confirmedBy:'开发者 王明' });
      const confirmed = new Set(ids);
      state.selectedStatementIds = state.selectedStatementIds.filter(id => !confirmed.has(id));
      closeConfirmation();
    }
    if (action === 'edit-entity') startEntityEdit();
    if (action === 'cancel-entity') cancelEntityEdit();
    if (action === 'view-history') { state.historyVersion = control.dataset.historyVersion || ''; rerender(); }
    if (action === 'close-history') { state.historyVersion = null; rerender(); }
    if (action === 'preview-proof') {
      const version = control.dataset.proofVersion;
      const row = entityHistoryRows().find(item => item.version === version);
      const proof = row?.snapshot?.bankProof || activeFinancialEntity()?.bankProof;
      state.proofPreview = { name:proof?.name || '银行账户证明', url:proofPreviewUrl(proof) };
      rerender();
    }
    if (action === 'close-proof') { state.proofPreview = null; rerender(); }
    if (action === 'view-game-sales') { state.gameSalesDetailId = control.dataset.gameSalesStatementId || ''; rerender(); }
    if (action === 'close-game-sales') { state.gameSalesDetailId = ''; rerender(); }
    if (action === 'view-cdkey') { state.cdkeyDetailId = control.dataset.cdkeyStatementId || ''; rerender(); }
    if (action === 'close-cdkey') { state.cdkeyDetailId = ''; rerender(); }
    if (action === 'export-settlements') {
      const rows = visibleSettlements();
      const csv = statements.exportStatementsCsv(rows,{ includeDeveloper:false,audience:'developer' });
      const ok = save(csv,`对账结算_${state.filters.billingMonth === 'all' ? '全部账单月' : state.filters.billingMonth}.csv`);
      state.exportMessage = ok ? `已导出 ${rows.length} 条结算记录` : '导出失败，请重试';
      rerender();
    }
    if (action === 'demo-toggle') { state.demoOpen = !state.demoOpen; rerender(); }
    if (action === 'scenario') { state.demoScenario = control.dataset.scenario; state.demoOpen = false; state.selectedStatementIds = []; state.confirmationIds = []; state.confirmationReturn = null; state.page = 1; rerender(); }
  });

  document.addEventListener('submit', event => {
    if (!event.target.matches('[data-d15-entity-form]')) return;
    event.preventDefault();
    submitEntity();
  });

  document.addEventListener('input', event => {
    if (!event.target.matches('[data-d15-entity-form] input:not([type="file"])')) return;
    const key = event.target.name;
    state.entityDraft = { ...(state.entityDraft || {}), [key]:event.target.value };
    if (state.entityErrors[key]) state.entityErrors = { ...state.entityErrors, [key]:'' };
  });

  document.addEventListener('change', event => {
    if (event.target.matches('[data-d15-select-statement]')) {
      const selected = new Set(state.selectedStatementIds);
      if (event.target.checked) selected.add(event.target.value);
      else selected.delete(event.target.value);
      state.selectedStatementIds = [...selected];
      rerender();
      return;
    }
    if (event.target.matches('[data-d15-select-page]')) {
      const selected = new Set(state.selectedStatementIds);
      currentSettlements().filter(row => row.status === 'pending').forEach(row => {
        if (event.target.checked) selected.add(row.id);
        else selected.delete(row.id);
      });
      state.selectedStatementIds = [...selected];
      rerender();
      return;
    }
    if (!event.target.matches('[data-d15-entity-form] input[type="file"]')) return;
    const file = event.target.files?.[0];
    if (!file) return;
    state.entityFile = file;
    state.entityDraft = { ...(state.entityDraft || {}), bankProof:{ name:file.name, type:file.type, size:file.size } };
    state.entityErrors = { ...state.entityErrors, bankProof:'' };
    state.entityError = '';
    const name = event.target.closest('.d15-entity-upload')?.querySelector('[data-d15-upload-name]');
    if (name) name.textContent = file.name;
  });

  window.addEventListener('keydown', event => {
    const dialog = document.querySelector('.d15-proof-dialog,.d15-history-dialog,.d15-settlement-drawer,.d15-confirm-dialog');
    if (event.key === 'Tab' && dialog) {
      const focusable = [...dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
        .filter(node => node.getClientRects().length > 0 && node.getAttribute('aria-disabled') !== 'true');
      if (focusable.length) {
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
      event.stopImmediatePropagation();
      return;
    }
    if (event.key === 'Escape' && (state.confirmationIds.length || state.proofPreview || state.historyVersion || state.gameSalesDetailId || state.cdkeyDetailId)) {
      event.preventDefault();
      event.stopImmediatePropagation();
      if (state.proofPreview) { state.proofPreview = null; rerender(); }
      else if (state.historyVersion) { state.historyVersion = null; rerender(); }
      else if (state.gameSalesDetailId) { state.gameSalesDetailId = ''; rerender(); }
      else if (state.cdkeyDetailId) { state.cdkeyDetailId = ''; rerender(); }
      else closeConfirmation();
    }
  });
  window.addEventListener('hashchange', () => {
    if (embedded) return;
    const route = location.hash.replace(/^#\/?/,'');
    state.route = route === 'entity' ? 'entity' : 'settlement';
    state.page = 1;
    state.selectedStatementIds = [];
    state.confirmationIds = [];
    state.confirmationReturn = null;
    state.proofPreview = null;
    state.historyVersion = null;
    state.gameSalesDetailId = '';
    state.cdkeyDetailId = '';
    standaloneRender();
  });

  window.__developerFinanceDemo = {
    snapshot:() => ({
      scenario:state.demoScenario,
      settlements:allSettlements(),
      visibleSettlements:visibleSettlements(),
      selectedStatementIds:[...state.selectedStatementIds],
      financialEntity:activeFinancialEntity(),
      financialEntityApplications:entityApplications(),
    }),
    reviewEntity,
    setEnterpriseCertificationStatus:status => { state.enterpriseCertificationStatus = status; state.entityMode = 'view'; rerender(); },
    setDemoScenario:scenarioName => { state.demoScenario = scenarioName; rerender(); },
    reset:() => location.reload(),
  };

  if (embedded) {
    window.PublisherFinance = {
      routeIds:['P15-01','P15-02'],
      createState:() => state,
      render:(_financeState, options = {}) => {
        state.route = options.routeId === 'P15-01' ? 'entity' : 'settlement';
        state.enterpriseCertificationStatus = options.access?.qualificationStatus || 'approved';
        state.demoScenario = state.enterpriseCertificationStatus === 'approved' ? 'exhaustive' : 'empty';
        const canonicalRoute = state.route === 'entity' ? 'P15-01' : 'P15-02';
        return `<section class="publisher-finance" data-testid="developer-finance-demo" data-finance-route="${canonicalRoute}">${pageContent()}${auxiliaryOverlays()}</section>`;
      },
      bind:(_root, options = {}) => {
        state.callbacks.onChange = typeof options.onChange === 'function' ? options.onChange : null;
        state.callbacks.onNavigate = typeof options.onNavigate === 'function' ? options.onNavigate : null;
        document.body.classList.toggle('finance-overlay-open', Boolean(state.confirmationIds.length || state.proofPreview || state.historyVersion || state.gameSalesDetailId || state.cdkeyDetailId));
      },
      closeOverlays:() => {
        state.selectedStatementIds = [];
        state.confirmationIds = [];
        state.confirmationReturn = null;
        state.proofPreview = null;
        state.historyVersion = null;
        state.gameSalesDetailId = '';
        state.cdkeyDetailId = '';
        document.body.classList.remove('finance-overlay-open');
      },
      applyEntryContext:(_financeState, context = {}) => {
        const filters = context.filters || {};
        state.filters = {
          billingMonth:filters.billingMonth || filters.month || 'all',
          settlementMonth:filters.settlementMonth || 'all',
          gameId:filters.gameId || context.gameId || 'all',
          status:filters.status || 'all',
        };
        state.page = 1;
        state.selectedStatementIds = [];
        state.confirmationIds = [];
        state.confirmationReturn = null;
        state.proofPreview = null;
        state.historyVersion = null;
        state.gameSalesDetailId = '';
        state.cdkeyDetailId = '';
      },
      setScenario:(_financeState, scenarioName) => {
        state.demoScenario = ['exhaustive','empty'].includes(scenarioName) ? scenarioName : 'exhaustive';
        state.selectedStatementIds = [];
        state.confirmationIds = [];
        state.confirmationReturn = null;
        state.proofPreview = null;
        state.historyVersion = null;
        state.gameSalesDetailId = '';
        state.cdkeyDetailId = '';
        state.page = 1;
        rerender();
      },
      setEnterpriseCertificationStatus:(_financeState, status) => {
        state.enterpriseCertificationStatus = status;
        state.entityMode = 'view';
        rerender();
      },
    };
  } else {
    const route = location.hash.replace(/^#\/?/,'');
    state.route = route === 'entity' ? 'entity' : 'settlement';
    standaloneRender();
  }
})();</script>
</body>
</html>
