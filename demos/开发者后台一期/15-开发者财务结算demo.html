<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>开发者财务结算｜盖世游戏开发者平台</title>
  <style>* { box-sizing: border-box; }
:root {
  --brand: #f3b71b;
  --brand-strong: #d89200;
  --brand-soft: #fff8df;
  --ink: #172033;
  --muted: #667085;
  --line: #e4e7ec;
  --line-strong: #d0d5dd;
  --page: #f5f7fa;
  --surface: #ffffff;
  --soft: #f8fafc;
  --success: #14804a;
  --success-soft: #ecfdf3;
  --warning: #b54708;
  --warning-soft: #fffaeb;
  --danger: #b42318;
  --danger-soft: #fef3f2;
  --info: #175cd3;
  --info-soft: #eff8ff;
  --radius: 10px;
  --shadow: 0 10px 30px rgba(21, 31, 51, .08);
  --font: "Microsoft YaHei UI", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: var(--info); text-decoration: none; }
.gh-app { min-height: 100vh; }
.gh-topbar { height: 64px; padding: 0 28px; background: #111827; color: #fff; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
.gh-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .02em; }
.gh-brand svg { width: 34px; height: 34px; }
.gh-brand small { display: block; margin-top: 2px; color: #98a2b3; font-size: 11px; font-weight: 500; }
.gh-top-actions { display: flex; align-items: center; gap: 10px; }
.gh-top-link { border: 0; background: transparent; color: #d0d5dd; cursor: pointer; padding: 8px 10px; border-radius: 7px; }
.gh-top-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.gh-user { display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.14); }
.gh-avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(135deg, var(--brand), #ffdd75); color: #523600; font-weight: 800; }
.gh-user-copy strong, .gh-user-copy small { display: block; }
.gh-user-copy small { margin-top: 2px; color: #98a2b3; font-size: 11px; }
.gh-layout { min-height: calc(100vh - 64px); display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.gh-sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px; }
.gh-sidebar-label { padding: 0 12px 10px; color: #98a2b3; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.gh-nav { display: grid; gap: 4px; }
.gh-nav button { width: 100%; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 11px; padding: 11px 12px; color: #475467; cursor: pointer; text-align: left; }
.gh-nav button:hover { background: #f9fafb; color: var(--ink); }
.gh-nav button.is-active { background: var(--brand-soft); color: #9a6700; font-weight: 700; }
.gh-nav-icon { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #d9dde5; border-radius: 6px; font-size: 11px; font-weight: 800; }
.gh-nav button.is-active .gh-nav-icon { border-color: #efc85e; background: #fff6cf; }
.gh-main { min-width: 0; padding: 30px 34px 56px; }
.gh-content { width: min(1180px, 100%); margin: 0 auto; }
.gh-breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #98a2b3; font-size: 13px; margin-bottom: 18px; }
.gh-breadcrumb button { border: 0; background: none; color: var(--info); padding: 0; cursor: pointer; }
.gh-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
.gh-page-head h1 { margin: 0; font-size: 28px; line-height: 1.3; letter-spacing: -.02em; }
.gh-page-head p { margin: 7px 0 0; color: var(--muted); line-height: 1.7; }
.gh-head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.gh-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(16,24,40,.02); overflow: hidden; }
.gh-card + .gh-card { margin-top: 18px; }
.gh-card-head { min-height: 62px; padding: 17px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.gh-card-head h2 { margin: 0; font-size: 16px; }
.gh-card-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.gh-card-body { padding: 20px; }
.gh-grid-2, .gh-grid-3, .gh-grid-4 { display: grid; gap: 16px; }
.gh-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gh-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gh-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.gh-metric { padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.gh-metric span { color: var(--muted); font-size: 12px; }
.gh-metric strong { display: block; margin: 12px 0 6px; font-size: 24px; font-variant-numeric: tabular-nums; }
.gh-metric small { color: #98a2b3; }
.gh-button { min-height: 38px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 8px 15px; font-weight: 650; cursor: pointer; transition: .16s ease; }
.gh-button:hover { border-color: #98a2b3; background: #f9fafb; }
.gh-button.primary { border-color: var(--brand); background: var(--brand); color: #332300; }
.gh-button.primary:hover { border-color: var(--brand-strong); background: #e9aa0a; }
.gh-button.danger { border-color: #fda29b; color: var(--danger); background: #fff; }
.gh-button.link { border-color: transparent; background: transparent; color: var(--info); padding-inline: 6px; }
.gh-button:disabled { border-color: var(--line); background: #f2f4f7; color: #98a2b3; cursor: not-allowed; }
.gh-tag { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; border-radius: 999px; padding: 3px 9px; background: #f2f4f7; color: #475467; font-size: 12px; white-space: nowrap; }
.gh-tag.success { background: var(--success-soft); color: var(--success); }
.gh-tag.warning { background: var(--warning-soft); color: var(--warning); }
.gh-tag.danger { background: var(--danger-soft); color: var(--danger); }
.gh-tag.info { background: var(--info-soft); color: var(--info); }
.gh-notice { margin-bottom: 18px; padding: 14px 16px; border: 1px solid #b2ddff; background: var(--info-soft); border-radius: 9px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; color: #1849a9; }
.gh-notice.warning { border-color: #fedf89; background: var(--warning-soft); color: #93370d; }
.gh-notice.danger { border-color: #fecdca; background: var(--danger-soft); color: #912018; }
.gh-notice strong { display: block; margin-bottom: 4px; }
.gh-notice p { margin: 0; line-height: 1.65; }
.gh-tabs { display: flex; align-items: center; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.gh-tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 12px 1px 11px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.gh-tabs button.is-active { color: var(--ink); border-bottom-color: var(--brand); font-weight: 700; }
.gh-field { min-width: 0; }
.gh-field.wide { grid-column: 1 / -1; }
.gh-field label, .gh-label { display: block; margin-bottom: 8px; color: #344054; font-weight: 650; }
.gh-required::after { content: " *"; color: var(--danger); }
.gh-input, .gh-select, .gh-textarea { width: 100%; min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 9px 11px; color: var(--ink); outline: none; }
.gh-input:focus, .gh-select:focus, .gh-textarea:focus { border-color: #d9a50e; box-shadow: 0 0 0 3px rgba(243,183,27,.15); }
.gh-textarea { min-height: 112px; resize: vertical; line-height: 1.7; }
.gh-hint { display: block; margin-top: 6px; color: #98a2b3; font-size: 12px; line-height: 1.5; }
.gh-error { min-height: 18px; margin-top: 5px; color: var(--danger); font-size: 12px; }
.gh-checks { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.gh-checks label { display: flex; align-items: center; gap: 7px; color: #475467; font-weight: 500; }
.gh-upload { position: relative; min-height: 104px; border: 1px dashed #b8c0cc; border-radius: 8px; background: #fbfcfd; display: grid; place-items: center; padding: 16px; color: var(--muted); text-align: center; cursor: pointer; }
.gh-upload:hover { border-color: #d9a50e; background: #fffdf6; }
.gh-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.gh-form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 20px; margin-top: 20px; border-top: 1px solid var(--line); }
.gh-table-wrap { overflow-x: auto; }
.gh-table { width: 100%; border-collapse: collapse; min-width: 760px; }
.gh-table th { height: 44px; padding: 10px 14px; background: #f9fafb; color: #667085; font-size: 12px; text-align: left; font-weight: 700; border-bottom: 1px solid var(--line); }
.gh-table td { padding: 14px; border-bottom: 1px solid #eef0f3; color: #344054; vertical-align: middle; }
.gh-table tbody tr:last-child td { border-bottom: 0; }
.gh-table tbody tr:hover { background: #fcfcfd; }
.gh-table strong, .gh-table small { display: block; }
.gh-table small { margin-top: 4px; color: #98a2b3; }
.gh-row-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.gh-empty { padding: 62px 20px; text-align: center; color: var(--muted); }
.gh-empty-mark { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 16px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px; }
.gh-readonly { padding: 13px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.gh-readonly span, .gh-readonly strong, .gh-readonly small { display: block; }
.gh-readonly span { color: var(--muted); font-size: 12px; }
.gh-readonly strong { margin: 8px 0 4px; color: #344054; word-break: break-word; }
.gh-readonly small { color: #98a2b3; line-height: 1.5; }
.gh-code { border-radius: 8px; background: #101828; color: #d1fadf; padding: 14px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; overflow-x: auto; }
.gh-filter { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.gh-filter .gh-input { width: min(300px, 100%); }
.gh-filter .gh-select { width: 160px; }
.gh-pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.gh-dialog-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(16,24,40,.48); backdrop-filter: blur(2px); }
.gh-dialog { width: min(560px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: #fff; border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.gh-dialog.wide { width: min(820px, 100%); }
.gh-dialog-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 18px; }
.gh-dialog-head h2 { margin: 0; font-size: 19px; }
.gh-dialog-head p { margin: 6px 0 0; color: var(--muted); line-height: 1.6; }
.gh-dialog-close { width: 32px; height: 32px; border: 0; border-radius: 7px; background: #f2f4f7; cursor: pointer; font-size: 21px; color: var(--muted); }
.gh-dialog-body { padding: 20px 22px; overflow-y: auto; }
.gh-dialog-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
.gh-toast { position: fixed; top: 82px; left: 50%; z-index: 100; transform: translateX(-50%); max-width: min(480px, calc(100vw - 28px)); padding: 11px 16px; border-radius: 8px; background: #101828; color: #fff; box-shadow: var(--shadow); }
.gh-toast.error { background: #7a271a; }
.gh-kv { display: grid; grid-template-columns: 160px minmax(0,1fr); border-bottom: 1px solid #eef0f3; }
.gh-kv:last-child { border-bottom: 0; }
.gh-kv > span { padding: 13px 14px; background: #f9fafb; color: var(--muted); }
.gh-kv > strong, .gh-kv > div { padding: 13px 16px; font-weight: 500; min-width: 0; }
.gh-split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.gh-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #98a2b3; display: inline-block; }
.gh-status-dot.unread { background: #f0b21b; box-shadow: 0 0 0 4px #fff6d6; }
.gh-link-card { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 16px; text-align: left; cursor: pointer; }
.gh-link-card:hover { border-color: #e5bc49; box-shadow: 0 4px 14px rgba(21,31,51,.06); }
.gh-link-card strong, .gh-link-card small { display: block; }
.gh-link-card small { margin-top: 7px; color: var(--muted); line-height: 1.55; }
.gh-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.gh-banner { border-radius: 12px; padding: 24px; background: linear-gradient(120deg, #111827, #344054); color: #fff; overflow: hidden; position: relative; }
.gh-banner::after { content: ""; position: absolute; width: 260px; height: 260px; right: -50px; top: -130px; border-radius: 50%; background: radial-gradient(circle, rgba(255,211,82,.36), rgba(255,211,82,0)); }
.gh-banner h2 { margin: 0 0 8px; font-size: 23px; }
.gh-banner p { margin: 0; color: #d0d5dd; line-height: 1.7; max-width: 720px; }
.gh-rich-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 8px 8px 0 0; background: #f9fafb; }
.gh-rich-toolbar button { min-width: 32px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
.gh-rich-editor { min-height: 190px; border: 1px solid var(--line-strong); border-radius: 0 0 8px 8px; padding: 13px; line-height: 1.75; outline: none; }

@media (max-width: 960px) {
  .gh-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gh-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gh-split { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .gh-topbar { height: 58px; padding: 0 14px; }
  .gh-brand span { font-size: 13px; }
  .gh-brand small, .gh-user-copy, .gh-top-link.optional { display: none; }
  .gh-layout { min-height: calc(100vh - 58px); display: block; }
  .gh-sidebar { position: sticky; top: 58px; z-index: 24; padding: 0 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .gh-sidebar-label { display: none; }
  .gh-nav { display: flex; width: max-content; }
  .gh-nav button { width: auto; padding: 11px 10px; border-radius: 0; white-space: nowrap; }
  .gh-nav button.is-active { background: transparent; box-shadow: inset 0 -2px var(--brand); }
  .gh-nav-icon { display: none; }
  .gh-main { padding: 20px 14px 38px; }
  .gh-page-head { display: block; }
  .gh-page-head h1 { font-size: 23px; }
  .gh-head-actions { justify-content: flex-start; margin-top: 14px; }
  .gh-grid-2, .gh-grid-3, .gh-grid-4 { grid-template-columns: 1fr; }
  .gh-card-head { align-items: flex-start; padding: 15px 16px; }
  .gh-card-body { padding: 16px; }
  .gh-filter { padding: 14px 16px; }
  .gh-filter .gh-input, .gh-filter .gh-select { width: 100%; }
  .gh-tabs { gap: 20px; }
  .gh-dialog-layer { padding: 12px; }
  .gh-dialog { max-height: calc(100vh - 24px); border-radius: 12px; }
  .gh-dialog-head, .gh-dialog-body, .gh-dialog-foot { padding-left: 16px; padding-right: 16px; }
  .gh-kv { grid-template-columns: 112px minmax(0,1fr); }
}
@media (max-width: 360px) {
  .gh-brand svg { width: 30px; height: 30px; }
  .gh-top-actions { gap: 2px; }
  .gh-main { padding-left: 10px; padding-right: 10px; }
  .gh-page-head h1 { font-size: 21px; }
  .gh-button { padding-inline: 11px; }
  .gh-kv { grid-template-columns: 1fr; }
  .gh-kv > span { padding-bottom: 5px; }
  .gh-kv > strong, .gh-kv > div { padding-top: 5px; }
}

/* 开发者财务：浅色导航、主体月度汇总与单层核账详情。 */
.d15-app .gh-sidebar { background:#fff; border-right-color:#e4e7ec; }
.d15-app .d15-nav button { min-height:44px; color:#596577; }
.d15-app .d15-nav button:hover { color:#1f2937; background:#f4f5f7; }
.d15-app .d15-nav button.is-active { color:#182235; background:#eef0f2; font-weight:700; }
.d15-app .d15-nav button.is-active .gh-nav-icon { color:#324153; border-color:#d7dce3; background:#fff; }

.d15-entity-summary .gh-card-body { padding:22px; }
.d15-entity-summary h2,.d15-section-title h2 { margin:0; color:#172033; font-size:16px; }
.d15-entity-summary p,.d15-section-title p { margin:7px 0 0; color:#8a94a5; font-size:12px; line-height:1.6; }
.d15-entity-summary-row { min-width:0; display:flex; align-items:center; justify-content:space-between; gap:24px; }
.d15-entity-review { min-width:0; display:flex; align-items:center; justify-content:flex-end; gap:10px; color:#667085; font-size:12px; }
.d15-entity-review > span:last-child,.d15-entity-review > strong { min-width:0; font-weight:500; }
.d15-entity-review.danger > strong { color:#b42318; }
.d15-section-title { margin:28px 0 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:18px; }
.d15-section-title > div:last-child { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.d15-entity-detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 70px; padding:24px 26px 28px !important; }
.d15-entity-detail-grid .gh-readonly { min-width:0; padding:0; border:0; background:transparent; }
.d15-entity-detail-grid .gh-readonly span { color:#667085; }
.d15-entity-detail-grid .gh-readonly strong { margin-top:7px; color:#172033; font-size:14px; line-height:1.5; }
.d15-entity-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 32px; padding:24px 26px 28px !important; }
.d15-entity-field { min-width:0; }
.d15-entity-field label:not(.gh-upload),.d15-entity-field .gh-label { margin-bottom:8px; color:#344054; font-size:13px; font-weight:650; }
.d15-entity-field .gh-input[aria-invalid="true"],.d15-entity-upload.is-error { border-color:#f04438; }
.d15-entity-field .gh-input[aria-invalid="true"]:focus { box-shadow:0 0 0 3px rgba(240,68,56,.12); }
.d15-field-error { display:block; margin-top:6px; color:#b42318; font-size:12px; line-height:1.4; }
.gh-field .d15-entity-upload { min-height:116px; display:grid; align-content:center; gap:6px; }
.publisher-finance .gh-field label.d15-entity-upload { display:grid; }
.d15-entity-upload strong { max-width:100%; overflow:hidden; color:#344054; font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
.d15-entity-upload span { color:#7a8494; font-size:12px; }
.d15-entity-alert { margin:0 0 12px; padding:10px 12px; color:#b42318; border:1px solid #fecdca; border-radius:8px; background:#fef3f2; font-size:12px; }

.d15-filters {
  min-width:0;
  margin-bottom:16px;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(4,minmax(140px,1fr)) auto;
  align-items:end;
  gap:12px;
  border:1px solid #e1e6ed;
  border-radius:10px;
  background:#fff;
}
.d15-filters label { min-width:0; display:grid; gap:7px; }
.d15-filters label > span { color:#5f6a7c; font-size:12px; font-weight:650; }
.d15-filter-actions { display:flex; align-items:center; gap:8px; }
.d15-settlement-card { min-width:0; }
.d15-settlement-card .gh-card-head > div:last-child { flex:0 0 auto; }
.d15-settlement-actions { display:flex; align-items:center; gap:8px; }
.d15-settlement-actions .gh-button[aria-disabled="true"] { color:#98a2b3; border-color:#e4e7ec; background:#f2f4f7; cursor:not-allowed; }
.d15-settlement-table { min-width:1640px !important; font-size:12px; }
.d15-settlement-table th,.d15-settlement-table td { min-width:112px; white-space:nowrap; }
.d15-settlement-table .d15-check { width:48px; min-width:48px; text-align:center; }
.d15-settlement-table th:nth-child(2),.d15-settlement-table td:nth-child(2) { min-width:132px; }
.d15-settlement-table th:nth-child(3),.d15-settlement-table td:nth-child(3) { min-width:150px; }
.d15-settlement-table th:nth-child(6),.d15-settlement-table td:nth-child(6) { min-width:130px; }
.d15-settlement-table th:nth-child(7),.d15-settlement-table td:nth-child(7),

    const withholdingTaxMinor = Math.round((paidMinor - salesTaxMinor - providerFeeMinor - platformShareMinor) * withholdingTaxRate);
    const payableMinor = paidMinor - salesTaxMinor - providerFeeMinor - platformShareMinor - withholdingTaxMinor;

  const gamesByDeveloper = Object.freeze({

      Object.freeze({ id:'GAME-48293', name:'风暴边境' }),

      Object.freeze({ id:'GAME-48311', name:'荒野余烬' }),
      Object.freeze({ id:'GAME-48312', name:'霓虹突围' }),

  const createStatement = ({ state, developerId, developerName, entity, game, billingMonth, gameIndex, monthIndex, itemType }) => {
    const ratio = ratioFor(state, developerId, billingMonth);
    const paid = 7800000 + gameIndex * 925000 + monthIndex * 680000;
    const tax = Math.round(paid * 0.06);
    const fee = Math.round(paid * 0.029);
    const adjustments = {
      sales_share:{ userPaidMinor:paid, refundMinor:0, chargebackMinor:0, salesTaxMinor:tax, paymentFeeMinor:fee },
      refund_adjustment:{ userPaidMinor:0, refundMinor:Math.round(paid * 0.032), chargebackMinor:0, salesTaxMinor:0, paymentFeeMinor:0 },
      chargeback_adjustment:{ userPaidMinor:0, refundMinor:0, chargebackMinor:Math.round(paid * 0.014), salesTaxMinor:0, paymentFeeMinor:0 },
    }[itemType];
    const receivedMinor = adjustments.userPaidMinor - adjustments.refundMinor - adjustments.chargebackMinor - adjustments.salesTaxMinor - adjustments.paymentFeeMinor;
    const suffix = { sales_share:'SALES', refund_adjustment:'REFUND', chargeback_adjustment:'CHARGEBACK' }[itemType];
    const confirmed = (monthIndex + gameIndex + ITEM_ORDER[itemType]) % 4 === 0;
    return {
      id:`ST-${billingMonth.replace('-', '')}-${game.id}-${suffix}`,
      developerId, developerName, entityName:entity.legalName, entityVersion:entity.entityVersion,
      gameId:game.id, gameName:game.name, billingMonth, settlementMonth:nextMonth(billingMonth),
      itemType, itemLabel:ITEM_LABELS[itemType], currency:'CNY', ...adjustments, receivedMinor,
      ratioPercent:ratio.ratioPercent, ratioVersion:ratio.id,
      settlementMinor:roundMinor(receivedMinor * ratio.ratioPercent / 100),
      status:confirmed ? 'confirmed' : 'pending', lockedAt:`${nextMonth(billingMonth)}-05 11:20`,
      confirmedAt:confirmed ? `${nextMonth(billingMonth)}-08 10:30` : '', confirmedBy:confirmed ? '开发者 王明' : '',
    };
  };

  const seedStatements = state => {
    const months = ['2026-08','2026-07','2026-06'];
    return activeEntitySeeds.flatMap((entity, developerIndex) => months.flatMap((billingMonth, monthIndex) => {
      const games = gamesByDeveloper[entity.developerId] || [];
      return games.flatMap((game, gameIndex) => Object.keys(ITEM_ORDER).map(itemType => createStatement({
        state, developerId:entity.developerId, developerName:entity.developerName, entity, game,
        billingMonth, gameIndex:gameIndex + developerIndex, monthIndex, itemType,
      })));
    }));
  };

  const createState = () => {
    const state = {
      ratioVersions:clone(ratioSeeds),
      financialEntityVersions:clone(activeEntitySeeds),
      activeFinancialEntityVersions:Object.fromEntries(activeEntitySeeds.map(item => [item.developerId, item.entityVersion])),
      financialEntityApplications:clone(applicationSeeds),
      statements:[],
    };
    state.financialEntityVersions.push(...state.financialEntityApplications.map(application => clone(application.snapshot)));
    state.statements = seedStatements(state);
    return state;
  };

  const isAll = value => value == null || value === '' || value === 'all';
  const statementMatches = (row, filters) => {
    if (!isAll(filters.developerId) && row.developerId !== filters.developerId) return false;
    if (!isAll(filters.developer) && row.developerName !== filters.developer) return false;
    if (!isAll(filters.entityName) && row.entityName !== filters.entityName) return false;
    if (!isAll(filters.gameId) && row.gameId !== filters.gameId) return false;
    if (!isAll(filters.game) && row.gameId !== filters.game && row.gameName !== filters.game) return false;
    if (!isAll(filters.billingMonth) && row.billingMonth !== filters.billingMonth) return false;
    if (!isAll(filters.settlementMonth) && row.settlementMonth !== filters.settlementMonth) return false;
    if (!isAll(filters.itemType) && row.itemType !== filters.itemType) return false;
    if (!isAll(filters.status) && row.status !== filters.status) return false;
    const keyword = String(filters.keyword || '').trim().toLowerCase();
    return !keyword || `${row.developerId} ${row.developerName} ${row.entityName} ${row.gameId} ${row.gameName}`.toLowerCase().includes(keyword);
  };

  const statementsFor = (state, filters = {}) => (state.statements || [])
    .filter(row => statementMatches(row, filters))
    .slice()
    .sort((a, b) => b.billingMonth.localeCompare(a.billingMonth) || a.gameId.localeCompare(b.gameId) || ITEM_ORDER[a.itemType] - ITEM_ORDER[b.itemType])
    .map(clone);

  const confirmStatements = (state, ids, details = {}) => {
    const requested = new Set(Array.isArray(ids) ? ids : [ids]);
    const confirmedAt = details.confirmedAt || nowText();
    const confirmedBy = details.confirmedBy || '开发者';
    const changed = [];
    (state.statements || []).forEach(row => {
      if (!requested.has(row.id) || row.status !== 'pending') return;
      row.status = 'confirmed';
      row.confirmedAt = confirmedAt;
      row.confirmedBy = confirmedBy;
      row.lockedAt ||= confirmedAt;
      changed.push(clone(row));
    });
    return changed;
  };

  const saveRatioVersion = (state, input = {}) => {
    const developerId = String(input.developerId || '').trim();
    if (!developerId) throw new Error('缺少开发者');
    const rawRatioPercent = input.ratioPercent;
    if (rawRatioPercent == null || String(rawRatioPercent).trim() === '') throw new Error('请填写结算比例');
    const ratioPercent = Number(rawRatioPercent);
    if (!Number.isFinite(ratioPercent) || ratioPercent < 0 || ratioPercent > 100) throw new Error('结算比例范围为 0%-100%');
    if (!Number.isInteger(ratioPercent)) throw new Error('结算比例必须为整数');
    const effectiveBillingMonth = assertMonth(input.effectiveBillingMonth);
    const reason = String(input.reason || '').trim();
    if (!reason) throw new Error('请填写变更原因');
    if (input.canManageFinance === false) throw new Error('无财务配置权限');

    const previous = ratioFor(state, developerId, effectiveBillingMonth);
    (state.ratioVersions || []).forEach(version => {
      if (version.developerId === developerId && version.effectiveBillingMonth === effectiveBillingMonth && version.status !== 'superseded') version.status = 'superseded';
    });
    const sequence = String((state.ratioVersions || []).length + 1).padStart(3, '0');
    const version = {
      id:input.id || `RATIO-${effectiveBillingMonth.replace('-', '')}-${sequence}`,
      developerId, ratioPercent, effectiveBillingMonth, reason,
      operator:String(input.operator || '平台运营').trim(), operatedAt:input.operatedAt || nowText(),
      previousRatioPercent:previous.ratioPercent, status:'active',
    };
    state.ratioVersions.push(version);

    (state.statements || []).forEach(row => {
      if (row.developerId !== developerId || row.status === 'confirmed' || row.lockedAt) return;
      const applied = ratioFor(state, developerId, row.billingMonth);
      row.ratioPercent = applied.ratioPercent;
      row.ratioVersion = applied.id;
      row.settlementMinor = roundMinor(row.receivedMinor * applied.ratioPercent / 100);
    });
    return clone(version);
  };

  const financialEntity = (state, developerId) => {
    const versionId = state.activeFinancialEntityVersions?.[developerId];
    if (!versionId) return null;
    const entity = (state.financialEntityVersions || []).find(item => item.developerId === developerId && item.entityVersion === versionId && item.status === 'approved');

  const financialEntityApplications = (state, filters = {}) => (state.financialEntityApplications || [])

      if (!isAll(filters.developerId) && application.developerId !== filters.developerId) return false;

      return !keyword || `${application.developerId} ${application.developerName} ${application.snapshot?.legalName || ''}`.toLowerCase().includes(keyword);
    })
    .slice()
    .sort((a, b) => b.submittedAt.localeCompare(a.submittedAt) || b.id.localeCompare(a.id))
    .map(clone);

  const requiredText = (value, label) => {
    const text = String(value || '').trim();
    if (!text) throw new Error(`${label}为必填项`);
    return text;
  };

  const validateEntityInput = input => {
    const snapshot = {
      developerId:requiredText(input.developerId, '开发者 ID'),
      developerName:requiredText(input.developerName, '开发者'),
      legalName:requiredText(input.legalName, '企业法定名称'),
      contactName:requiredText(input.contactName, '联系人姓名'),
      phone:requiredText(input.phone, '手机号'),
      email:requiredText(input.email, '邮箱'),
      bankAccountName:requiredText(input.bankAccountName, '银行账户户名'),
      bankName:requiredText(input.bankName, '开户银行'),
      bankAccount:requiredText(input.bankAccount, '银行账号'),
      bankBranch:requiredText(input.bankBranch, '开户支行／联行信息'),
      bankProof:clone(input.bankProof),
    };
    if (!/^1\d{10}$/.test(snapshot.phone)) throw new Error('请填写正确的手机号');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(snapshot.email)) throw new Error('请填写正确的邮箱');
    if (snapshot.bankAccountName !== snapshot.legalName) throw new Error('银行账户户名必须与企业法定名称一致');
    if (!snapshot.bankProof || !snapshot.bankProof.name) throw new Error('请上传银行账户证明附件');
    if (!['image/jpeg','image/png','image/webp'].includes(snapshot.bankProof.type)) throw new Error('银行证明附件仅支持 JPG、PNG、WEBP');
    if (Number(snapshot.bankProof.size || 0) > 10 * 1024 * 1024) throw new Error('银行证明附件不能超过 10 MB');
    return snapshot;
  };

  const submitFinancialEntity = (state, input = {}) => {
    const snapshot = validateEntityInput(input);
    const pending = (state.financialEntityApplications || []).find(item => item.developerId === snapshot.developerId && item.status === 'pending');
    if (pending) throw new Error('该开发者已有待审核的财务主体申请');
    const current = financialEntity(state, snapshot.developerId);
    const year = String(input.submittedAt || nowText()).slice(0, 4);
    const nextSuffix = (items, readId) => Math.max(0, ...items.map(item => Number((readId(item).match(/(\d+)$/) || [])[1] || 0))) + 1;
    const applicationIndex = nextSuffix(state.financialEntityApplications, item => item.id);
    const entityIndex = nextSuffix(state.financialEntityVersions, item => item.entityVersion);
    const entityVersion = `FIN-${year}-${String(entityIndex).padStart(3, '0')}`;
    const application = {
      id:input.id || `FIN-APP-${year}-${String(applicationIndex).padStart(3, '0')}`,
      applicationType:current ? 'change' : 'initial', status:'pending',
      developerId:snapshot.developerId, developerName:snapshot.developerName, entityVersion,
      submittedAt:input.submittedAt || nowText(), submittedBy:String(input.submittedBy || snapshot.contactName).trim(),
      reviewedAt:'', reviewedBy:'', reviewReason:'', snapshot:{ ...snapshot, entityVersion, status:'pending' },

    state.financialEntityVersions.push(clone(application.snapshot));
    return clone(application);
  };

  const reviewFinancialEntity = (state, applicationId, input = {}) => {
    const application = (state.financialEntityApplications || []).find(item => item.id === applicationId);
    if (!application) throw new Error('未找到财务主体申请');
    if (application.status !== 'pending') throw new Error('该申请已完成审核');
    const result = input.result;
    if (!['approved','rejected'].includes(result)) throw new Error('审核结果仅支持 approved 或 rejected');
    const reason = String(input.reason || '').trim();
    if (result === 'rejected' && !reason) throw new Error('驳回必须填写原因');
    const reviewedAt = input.reviewedAt || nowText();
    const operator = String(input.operator || '平台运营').trim();
    Object.assign(application, { status:result, reviewedAt, reviewedBy:operator, reviewReason:reason });
    const version = state.financialEntityVersions.find(item => item.developerId === application.developerId && item.entityVersion === application.entityVersion);
    if (version) Object.assign(version, { status:result, reviewedAt, reviewedBy:operator, reviewReason:reason });
    if (result === 'approved') {

      const previous = state.financialEntityVersions.find(item => item.developerId === application.developerId && item.entityVersion === previousVersionId && item.status === 'approved');
      if (previous) previous.status = 'superseded';
      state.activeFinancialEntityVersions[application.developerId] = application.entityVersion;
    }
    return clone(application);
  };

  const quote = value => `"${String(value ?? '').replaceAll('"', '""')}"`;
  const safeCell = value => {
    const text = String(value ?? '');
    const formulaLike = /^[\s]*[=+\-@]/.test(text) || /^[\t\r\n]/.test(text);
    return quote(formulaLike ? `'${text}` : text);
  };
  const decimal = minor => (Number(minor || 0) / 100).toFixed(2);
  const statusLabel = status => status === 'confirmed' ? '已确认' : '待确认';

  const exportStatementsCsv = (rows, options = {}) => {
    const includeDeveloper = Boolean(options.includeDeveloper);
    const includeRatioVersion = Boolean(options.includeRatioVersion);
    const headers = [
      ...(includeDeveloper ? ['开发者','财务主体'] : []),
      '游戏 ID','游戏名称','账单月份','结算月份','结算项','用户支付金额（CNY）','结算比例',
      ...(includeRatioVersion ? ['结算比例版本'] : []),
      '实际到账金额（CNY）','结算金额（CNY）','状态',
    ];
    const lines = (rows || []).map(row => [
      ...(includeDeveloper ? [safeCell(row.developerName), safeCell(row.entityName)] : []),
      safeCell(row.gameId), safeCell(row.gameName), safeCell(row.billingMonth), safeCell(row.settlementMonth), safeCell(row.itemLabel),
      quote(decimal(row.userPaidMinor)), quote(`${row.ratioPercent}%`),
      ...(includeRatioVersion ? [safeCell(row.ratioVersion)] : []),
      quote(decimal(row.receivedMinor)), quote(decimal(row.settlementMinor)), safeCell(statusLabel(row.status)),
    ].join(','));
    return `\uFEFF${[headers.map(safeCell).join(','), ...lines].join('\r\n')}`;
  };

  return Object.freeze({
    createState,
    nextMonth,
    statementsFor,
    confirmStatements,
    ratioFor,
    saveRatioVersion,
    financialEntity,
    financialEntityApplications,
    submitFinancialEntity,
    reviewFinancialEntity,
    exportStatementsCsv,
  });
})();

  const pagination = total => {
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    state.page = Math.max(1, Math.min(state.page, pages));
    return `<footer class="gh-pagination" data-d15-pagination data-page-size="20"><span>共 ${total} 条，每页 20 条</span><button class="gh-button" type="button" data-finance-action="page" data-page="${state.page - 1}"${state.page <= 1 ? ' disabled' : ''}>上一页</button><strong>${state.page} / ${pages}</strong><button class="gh-button" type="button" data-finance-action="page" data-page="${state.page + 1}"${state.page >= pages ? ' disabled' : ''}>下一页</button></footer>`;
  };

  const DEVELOPER_ID = 'DEV-1001';
  const DEVELOPER_NAME = '星海互动';
  const entityFields = Object.freeze([
    Object.freeze({ key:'legalName', label:'企业法定名称' }),
    Object.freeze({ key:'contactName', label:'联系人姓名' }),
    Object.freeze({ key:'phone', label:'手机号' }),
    Object.freeze({ key:'email', label:'邮箱', type:'email' }),
    Object.freeze({ key:'bankAccountName', label:'银行账户户名' }),
    Object.freeze({ key:'bankName', label:'开户银行' }),
    Object.freeze({ key:'bankAccount', label:'银行账号' }),
    Object.freeze({ key:'bankBranch', label:'开户支行／联行信息' }),
  ]);
  const activeFinancialEntity = () => statements.financialEntity(state.statementState, DEVELOPER_ID);
  const entityApplications = () => statements.financialEntityApplications(state.statementState, { developerId:DEVELOPER_ID });
  const latestEntityApplication = () => entityApplications()[0] || null;
  const draftSource = () => {
    const latest = latestEntityApplication();
    return latest?.status === 'rejected' ? latest.snapshot : activeFinancialEntity();
  };
  const cloneEntity = value => value == null ? value : JSON.parse(JSON.stringify(value));
  const entityStatus = () => {
    const latest = latestEntityApplication();
    if (latest?.status === 'pending') return { label:'审核中', tone:'warning', detail:`变更申请已于 ${latest.submittedAt} 提交，审核通过后生效。` };
    if (latest?.status === 'rejected') return { label:'已驳回', tone:'danger', detail:latest.reviewReason || '请修改资料后重新提交。' };
    return { label:'已生效', tone:'success', detail:'当前资料已通过审核。' };
  };
  const entityInput = field => {
    const draft = state.entityDraft || {};
    const error = state.entityErrors[field.key] || '';
    const isFirstError = Object.keys(state.entityErrors)[0] === field.key;
    return `<div class="gh-field d15-entity-field"><label for="d15-entity-${esc(field.key)}">${esc(field.label)}</label><input id="d15-entity-${esc(field.key)}" class="gh-input" type="${esc(field.type || 'text')}" name="${esc(field.key)}" value="${esc(draft[field.key] || '')}" aria-label="${esc(field.label)}" aria-invalid="${error ? 'true' : 'false'}"${error ? ` aria-describedby="d15-error-${esc(field.key)}"` : ''}>${error ? `<small class="d15-field-error" id="d15-error-${esc(field.key)}"${isFirstError ? ' role="alert"' : ''}>${esc(error)}</small>` : ''}</div>`;
  };
  const entityUpload = () => {
    const proof = state.entityDraft?.bankProof;
    const error = state.entityErrors.bankProof || '';
    const isFirstError = Object.keys(state.entityErrors)[0] === 'bankProof';
    return `<div class="gh-field wide d15-entity-field"><span class="gh-label">银行账户证明附件</span><label class="gh-upload d15-entity-upload ${error ? 'is-error' : ''}" for="d15-entity-bank-proof"><input id="d15-entity-bank-proof" type="file" name="bankProof" aria-label="银行账户证明附件" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" aria-invalid="${error ? 'true' : 'false'}"${error ? ' aria-describedby="d15-error-bankProof"' : ''}><strong data-d15-upload-name>${esc(proof?.name || '点击上传附件')}</strong><span>支持 JPG、PNG、WEBP，单文件不超过 10 MB</span></label>${error ? `<small class="d15-field-error" id="d15-error-bankProof"${isFirstError ? ' role="alert"' : ''}>${esc(error)}</small>` : ''}</div>`;
  };
  const entityActions = status => state.entityMode === 'edit'
    ? `${button('取消','cancel-entity')}<button type="submit" form="d15-entity-form" class="gh-button primary">提交审核</button>`
    : button('修改','edit-entity','',status.label === '审核中' ? 'disabled' : '');

  function entityPage() {
    if (state.demoScenario === 'empty') return `<section class="gh-card">${emptyState('尚未配置财务主体', '请提交企业与银行资料，审核通过后用于结算。')}</section>`;
    const profile = activeFinancialEntity();
    if (!profile) return `<section class="gh-card">${emptyState('尚未配置财务主体', '请联系平台运营完成初次配置。')}</section>`;
    const status = entityStatus();
    const statusDetail = status.tone === 'danger' ? `<strong>${esc(status.detail)}</strong>` : `<span>${esc(status.detail)}</span>`;
    const content = state.entityMode === 'edit'
      ? `<form id="d15-entity-form" class="gh-card-body d15-entity-form" data-d15-entity-form novalidate>${entityFields.map(entityInput).join('')}${entityUpload()}</form>`
      : `<div class="gh-card-body d15-entity-detail-grid">${entityFields.map(field => readonly(field.label,profile[field.key])).join('')}${readonly('银行账户证明附件',profile.bankProof?.name || '—','JPG、PNG、WEBP，单文件不超过 10 MB')}</div>`;
    return `<section class="gh-card d15-entity-summary" data-d15-entity-summary><div class="gh-card-body"><div class="d15-entity-summary-row"><div><h2>当前生效版本</h2><p>${esc(profile.entityVersion)} · 审核通过前，变更不会覆盖当前结算资料。</p></div><div class="d15-entity-review ${esc(status.tone)}" data-d15-entity-status><span class="gh-tag ${esc(status.tone)}">${esc(status.label)}</span>${statusDetail}</div></div></div></section>
      <section class="d15-section-title"><div><h2>财务主体资料</h2><p>银行账户户名须与企业法定名称一致。</p></div><div>${entityActions(status)}</div></section>
      ${state.entityError && !Object.keys(state.entityErrors).length ? `<div class="d15-entity-alert" role="alert">${esc(state.entityError)}</div>` : ''}
      <section class="gh-card d15-entity-details" data-d15-entity-details>${content}</section>`;
  }

  const allSettlements = () => statements.statementsFor(state.statementState, { developerId:DEVELOPER_ID });
  const optionsFor = key => [...new Set(allSettlements().map(row => row[key]))].sort((a,b) => String(b).localeCompare(String(a)));
  const allDeveloperGames = () => {
    const games = new Map();
    allSettlements().forEach(row => { if (!games.has(row.gameId)) games.set(row.gameId,{ gameId:row.gameId,gameName:row.gameName }); });
    return [...games.values()].sort((a,b) => a.gameName.localeCompare(b.gameName,'zh-CN'));
  };
  const visibleSettlements = () => state.demoScenario === 'empty' ? [] : statements.statementsFor(state.statementState, {
    developerId:DEVELOPER_ID,
    billingMonth:state.filters.billingMonth,
    settlementMonth:state.filters.settlementMonth,
    gameId:state.filters.gameId,
    status:state.filters.status,
  });
  const currentSettlements = () => {
    const rows = visibleSettlements();
    const pages = Math.max(1,Math.ceil(rows.length / PAGE_SIZE));
    state.page = Math.max(1,Math.min(state.page,pages));
    return rows.slice((state.page - 1) * PAGE_SIZE,state.page * PAGE_SIZE);
  };
  const selectedPendingRows = () => {
    const selected = new Set(state.selectedStatementIds);
    return allSettlements().filter(row => selected.has(row.id) && row.status === 'pending');
  };
  const confirmationRows = () => {
    const requested = new Set(state.confirmationIds);
    return allSettlements().filter(row => requested.has(row.id) && row.status === 'pending');
  };
  const selectOptions = (values, selected, allLabel, format = value => value) => `<option value="all"${selected === 'all' ? ' selected' : ''}>${esc(allLabel)}</option>${values.map(value => `<option value="${esc(value)}"${selected === value ? ' selected' : ''}>${esc(format(value))}</option>`).join('')}`;
  const settlementFilters = () => `<section class="d15-filters" aria-label="结算记录筛选"><label><span>账单月份</span><select class="gh-select" data-d15-filter="billingMonth">${selectOptions(optionsFor('billingMonth'),state.filters.billingMonth,'全部月份')}</select></label><label><span>结算月份</span><select class="gh-select" data-d15-filter="settlementMonth">${selectOptions(optionsFor('settlementMonth'),state.filters.settlementMonth,'全部月份')}</select></label><label><span>游戏</span><select class="gh-select" data-d15-filter="gameId">${selectOptions(allDeveloperGames().map(game => game.gameId),state.filters.gameId,'全部游戏',value => allDeveloperGames().find(game => game.gameId === value)?.gameName || value)}</select></label><label><span>状态</span><select class="gh-select" data-d15-filter="status"><option value="all"${state.filters.status === 'all' ? ' selected' : ''}>全部状态</option><option value="pending"${state.filters.status === 'pending' ? ' selected' : ''}>待确认</option><option value="confirmed"${state.filters.status === 'confirmed' ? ' selected' : ''}>已确认</option></select></label><div class="d15-filter-actions">${button('重置','reset-filters')}${button('查询','query','primary')}</div></section>`;

  const settlementRow = row => {
    const checked = state.selectedStatementIds.includes(row.id);
    const selectable = row.status === 'pending';
    return `<tr data-d15-settlement-row data-statement-id="${esc(row.id)}" data-game-id="${esc(row.gameId)}" data-billing-month="${esc(row.billingMonth)}" data-settlement-month="${esc(row.settlementMonth)}" data-item-type="${esc(row.itemType)}" data-received-minor="${esc(row.receivedMinor)}" data-ratio-percent="${esc(row.ratioPercent)}" data-settlement-minor="${esc(row.settlementMinor)}" data-status="${esc(row.status)}"><td class="d15-check"><input type="checkbox" data-d15-select-statement value="${esc(row.id)}" aria-label="选择 ${esc(row.id)}"${checked ? ' checked' : ''}${selectable ? '' : ' disabled'}></td><td>${esc(row.gameId)}</td><td><strong>${esc(row.gameName)}</strong></td><td>${esc(row.billingMonth)}</td><td>${esc(row.settlementMonth)}</td><td>${esc(row.itemLabel)}</td><td class="d15-number">${esc(cny(row.userPaidMinor))}</td><td class="d15-number">${esc(row.ratioPercent)}%</td><td class="d15-number">${esc(cny(row.receivedMinor))}</td><td class="d15-number d15-payable">${esc(cny(row.settlementMinor))}</td><td><span class="gh-tag ${row.status === 'confirmed' ? 'success' : 'warning'}">${row.status === 'confirmed' ? '已确认' : '待确认'}</span></td><td>${selectable ? button('确认','open-confirm','link',`data-confirm-statement-id="${esc(row.id)}"`) : '—'}</td></tr>`;
  };

  function settlementPage() {
    const rows = visibleSettlements();
    const current = currentSettlements();
    const currentPending = current.filter(row => row.status === 'pending');
    const selected = selectedPendingRows();
    const allCurrentSelected = currentPending.length > 0 && currentPending.every(row => state.selectedStatementIds.includes(row.id));
    const table = current.length ? `<div class="gh-table-wrap"><table class="gh-table d15-settlement-table" data-testid="settlement-table"><thead><tr><th class="d15-check"><input type="checkbox" data-d15-select-page aria-label="选择本页待确认"${allCurrentSelected ? ' checked' : ''}${currentPending.length ? '' : ' disabled'}></th><th>游戏 ID</th><th>游戏名称</th><th>账单月份</th><th>结算月份</th><th>结算项</th><th>用户支付金额（CNY）</th><th>结算比例</th><th>实际到账金额（CNY）</th><th>结算金额（CNY）</th><th>状态</th><th>操作</th></tr></thead><tbody>${current.map(settlementRow).join('')}</tbody></table></div>${pagination(rows.length)}` : emptyState(state.demoScenario === 'empty' ? '暂无结算记录' : '未找到符合条件的记录', state.demoScenario === 'empty' ? '账单生成后，结算记录会展示在这里。' : '请调整筛选条件或重置后再试。');
    return `${settlementFilters()}<section class="gh-card d15-settlement-card"><header class="gh-card-head"><div><h2>对账结算</h2><p>账单按 N+1 结算；确认后不可撤销。</p></div><div class="d15-settlement-actions">${button('批量确认','open-batch-confirm','',selected.length ? '' : 'aria-disabled="true"')}${button('导出当前结果','export-settlements','',rows.length ? '' : 'disabled')}</div></header>${state.exportMessage ? `<div class="d15-export-message ${state.exportMessage.includes('失败') ? 'is-error' : ''}" data-d15-export-status>${esc(state.exportMessage)}</div>` : ''}${table}</section>`;
  }

  function confirmationDialog() {
    const rows = confirmationRows();
    if (!rows.length) return '';
    const total = rows.reduce((sum,row) => sum + Number(row.settlementMinor || 0),0);
    return `<div class="d15-dialog-layer" data-finance-action="cancel-confirm"><section class="d15-confirm-dialog" role="dialog" aria-modal="true" aria-label="确认结算单" data-finance-stop><header><h2>确认结算单</h2><button type="button" class="gh-dialog-close" data-finance-action="cancel-confirm" aria-label="关闭">×</button></header><div class="d15-confirm-body"><p>共 <strong>${rows.length} 条</strong>结算单，结算金额合计</p><b>${esc(cnyWithSymbol(total))}</b><small>确认后不可撤销，请核对后操作。</small></div><footer>${button('取消','cancel-confirm')}${button('确认','confirm-statements','primary')}</footer></section></div>`;
  }

  const pageContent = () => state.route === 'entity' ? entityPage() : settlementPage();
  const scenario = () => `<section class="d15-demo"><button type="button" data-finance-action="demo-toggle" aria-expanded="${state.demoOpen}" data-testid="scenario-orb"><b>Demo</b><span>状态</span></button>${state.demoOpen ? `<aside><strong>页面状态</strong><button type="button" data-finance-action="scenario" data-scenario="exhaustive" class="${state.demoScenario === 'exhaustive' ? 'is-active' : ''}">穷举态</button><button type="button" data-finance-action="scenario" data-scenario="empty" class="${state.demoScenario === 'empty' ? 'is-active' : ''}">缺省态</button></aside>` : ''}</section>`;
  const logo = () => `<svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#f3b71b"/><path d="M10 18.3c0-5.3 3.7-9.1 8.9-9.1 2.6 0 4.8.9 6.4 2.4l-3.1 3.1a4.7 4.7 0 0 0-3.3-1.3c-2.8 0-4.7 2-4.7 4.9 0 2.8 1.9 4.9 4.8 4.9 2 0 3.3-.8 4-2.1h-4.6v-3.8h8.7c.1.6.1 1.2.1 1.8 0 5.1-3.4 8.8-8.3 8.8-5.2 0-8.9-4-8.9-9.6Z" fill="#422d00"/></svg>`;
  function standaloneRender() {
    const title = state.route === 'entity' ? '财务主体' : '对账结算';
    const description = state.route === 'entity' ? '维护结算主体与银行账户资料。' : '核对并确认按月生成的游戏结算单。';
    app.innerHTML = `<div class="gh-app d15-app" data-testid="developer-finance-demo"><header class="gh-topbar"><div class="gh-brand">${logo()}<span>PC 发行平台<small>开发者中心</small></span></div><div class="gh-user"><div class="gh-avatar">星</div><div class="gh-user-copy"><strong>星海互动</strong><small>企业开发者</small></div></div></header><div class="gh-layout"><aside class="gh-sidebar"><div class="gh-sidebar-label">财务</div><nav class="gh-nav d15-nav" aria-label="财务导航"><button type="button" data-route="entity" class="${state.route === 'entity' ? 'is-active' : ''}"><span class="gh-nav-icon">主</span>财务主体</button><button type="button" data-route="settlement" class="${state.route !== 'entity' ? 'is-active' : ''}"><span class="gh-nav-icon">结</span>对账结算</button></nav></aside><main class="gh-main"><div class="gh-content">${pageHead(title,description)}${pageContent()}</div></main></div>${scenario()}${confirmationDialog()}</div>`;
    document.body.classList.toggle('finance-overlay-open', Boolean(state.confirmationIds.length));
  }

  const focusFirstConfirmationControl = () => requestAnimationFrame(() => {
    const dialog = document.querySelector('.d15-confirm-dialog');
    if (!dialog || dialog.contains(document.activeElement)) return;
    dialog.querySelector('button:not([disabled])')?.focus();
  });
  const restoreConfirmationFocus = target => requestAnimationFrame(() => {
    if (!target) return;
    let control = null;
    if (target.type === 'batch') control = document.querySelector('[data-finance-action="open-batch-confirm"]');
    if (target.type === 'statement') {
      control = [...document.querySelectorAll('[data-confirm-statement-id]')].find(node => node.dataset.confirmStatementId === target.id)
        || [...document.querySelectorAll('[data-statement-id]')].find(node => node.dataset.statementId === target.id);
      if (control?.matches('tr')) control.tabIndex = -1;
      if (!control) control = document.querySelector('[data-finance-action="open-batch-confirm"]');
    }
    control?.focus();
  });
  const rerender = () => {
    if (embedded && typeof state.callbacks.onChange === 'function') state.callbacks.onChange({ preserveScroll:true });
    else standaloneRender();
    if (state.confirmationIds.length) focusFirstConfirmationControl();
  };
  const closeConfirmation = () => {
    const returnTarget = state.confirmationReturn;
    state.confirmationIds = [];
    state.confirmationReturn = null;
    rerender();
    restoreConfirmationFocus(returnTarget);
  };
  const readFilters = () => {
    state.filters = {
      billingMonth:document.querySelector('[data-d15-filter="billingMonth"]')?.value || 'all',
      settlementMonth:document.querySelector('[data-d15-filter="settlementMonth"]')?.value || 'all',
      gameId:document.querySelector('[data-d15-filter="gameId"]')?.value || 'all',
      status:document.querySelector('[data-d15-filter="status"]')?.value || 'all',
    };
    state.page = 1;
    state.selectedStatementIds = [];
    state.confirmationIds = [];
    state.confirmationReturn = null;
    state.exportMessage = '';
  };
  const save = (content, filename) => {
    try {
      const href = URL.createObjectURL(new Blob([content], { type:'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = href;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(href), 0);
      return true;
    } catch { return false; }
  };

  const startEntityEdit = () => {
    state.entityMode = 'edit';
    state.entityDraft = cloneEntity(draftSource());
    state.entityFile = null;
    state.entityErrors = {};
    state.entityError = '';
    rerender();
  };
  const cancelEntityEdit = () => {
    state.entityMode = 'view';
    state.entityDraft = null;
    state.entityFile = null;
    state.entityErrors = {};
    state.entityError = '';
    rerender();
  };
  const readEntityDraft = () => {
    const form = document.querySelector('[data-d15-entity-form]');
    const draft = cloneEntity(state.entityDraft || draftSource() || {});
    entityFields.forEach(field => { draft[field.key] = form?.elements.namedItem(field.key)?.value?.trim() || ''; });
    const file = form?.elements.namedItem('bankProof')?.files?.[0] || state.entityFile;
    if (file) draft.bankProof = { name:file.name, type:file.type, size:file.size };
    return draft;
  };
  const validateEntityDraft = draft => {
    const errors = {};
    entityFields.forEach(field => { if (!draft[field.key]) errors[field.key] = `${field.label}为必填项`; });
    if (!errors.phone && !/^1[3-9]\d{9}$/.test(draft.phone)) errors.phone = '请填写正确的中国大陆手机号';
    if (!errors.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.email)) errors.email = '请填写正确的邮箱';
    if (!errors.bankAccountName && !errors.legalName && draft.bankAccountName !== draft.legalName) errors.bankAccountName = '银行账户户名必须与企业法定名称一致';
    if (!draft.bankProof?.name) errors.bankProof = '请上传银行账户证明附件';
    else if (!['image/jpeg','image/png','image/webp'].includes(draft.bankProof.type)) errors.bankProof = '银行证明附件仅支持 JPG、PNG、WEBP';
    else if (Number(draft.bankProof.size || 0) > 10 * 1024 * 1024) errors.bankProof = '银行证明附件不能超过 10 MB';
    return errors;
  };
  const focusFirstEntityError = () => {
    const firstError = document.querySelector('[data-d15-entity-form] [aria-invalid="true"]');
    firstError?.scrollIntoView({ block:'center', behavior:'smooth' });
    firstError?.focus();
  };
  const submitEntity = () => {
    const draft = readEntityDraft();
    const errors = validateEntityDraft(draft);
    state.entityDraft = draft;
    state.entityErrors = errors;
    state.entityError = Object.values(errors)[0] || '';
    if (state.entityError) {
      rerender();
      focusFirstEntityError();
      return;
    }
    try {
      statements.submitFinancialEntity(state.statementState, {
        ...draft,
        developerId:DEVELOPER_ID,
        developerName:DEVELOPER_NAME,
        submittedBy:draft.contactName,
      });
      state.entityMode = 'view';
      state.entityDraft = null;
      state.entityFile = null;
      state.entityErrors = {};
      state.entityError = '';
      rerender();
    } catch (error) {
      state.entityError = error?.message || '提交失败，请重试';
      rerender();
    }
  };
  const reviewEntity = (result, reason = '') => {
    const pending = entityApplications().find(application => application.status === 'pending');
    if (!pending) return false;
    statements.reviewFinancialEntity(state.statementState, pending.id, {
      result,
      reason,
      operator:'平台运营 李然',
    });
    state.entityMode = 'view';
    state.entityDraft = null;
    state.entityFile = null;
    state.entityErrors = {};
    state.entityError = '';
    rerender();
    return true;
  };

  document.addEventListener('click', event => {
    const routeButton = event.target.closest('[data-route]');
    if (routeButton && !embedded) {
      state.route = routeButton.dataset.route === 'entity' ? 'entity' : 'settlement';
      state.page = 1;
      state.selectedStatementIds = [];
      state.confirmationIds = [];
      state.confirmationReturn = null;
      location.hash = `#/${state.route}`;
      standaloneRender();
      return;
    }
    const control = event.target.closest('[data-finance-action]');
    if (!control || control.disabled || control.getAttribute('aria-disabled') === 'true') return;
    const action = control.dataset.financeAction;
    if (action === 'cancel-confirm' && control.classList.contains('d15-dialog-layer') && event.target.closest('[data-finance-stop]')) return;
    if (action === 'query') { readFilters(); rerender(); }
    if (action === 'reset-filters') { state.filters = { billingMonth:'all',settlementMonth:'all',gameId:'all',status:'all' }; state.page = 1; state.selectedStatementIds = []; state.confirmationIds = []; state.confirmationReturn = null; state.exportMessage = ''; rerender(); }
    if (action === 'page') { state.page = Math.max(1,Number(control.dataset.page) || 1); rerender(); }
    if (action === 'open-confirm') { state.confirmationReturn = { type:'statement',id:control.dataset.confirmStatementId }; state.confirmationIds = [control.dataset.confirmStatementId].filter(Boolean); rerender(); }
    if (action === 'open-batch-confirm') { state.confirmationReturn = { type:'batch' }; state.confirmationIds = selectedPendingRows().map(row => row.id); rerender(); }
    if (action === 'cancel-confirm') closeConfirmation();
    if (action === 'confirm-statements') {
      const ids = confirmationRows().map(row => row.id);
      statements.confirmStatements(state.statementState,ids,{ confirmedBy:'开发者 王明' });
      const confirmed = new Set(ids);
      state.selectedStatementIds = state.selectedStatementIds.filter(id => !confirmed.has(id));
      closeConfirmation();
    }
    if (action === 'edit-entity') startEntityEdit();
    if (action === 'cancel-entity') cancelEntityEdit();
    if (action === 'export-settlements') {
      const rows = visibleSettlements();
      const csv = statements.exportStatementsCsv(rows,{ includeDeveloper:false,includeRatioVersion:false });
      const ok = save(csv,`对账结算_${state.filters.billingMonth === 'all' ? '全部账单月' : state.filters.billingMonth}.csv`);
      state.exportMessage = ok ? `已导出 ${rows.length} 条结算记录` : '导出失败，请重试';
      rerender();
    }
    if (action === 'demo-toggle') { state.demoOpen = !state.demoOpen; rerender(); }
    if (action === 'scenario') { state.demoScenario = control.dataset.scenario; state.demoOpen = false; state.selectedStatementIds = []; state.confirmationIds = []; state.confirmationReturn = null; state.page = 1; rerender(); }
  });

  document.addEventListener('submit', event => {
    if (!event.target.matches('[data-d15-entity-form]')) return;
    event.preventDefault();
    submitEntity();
  });

  document.addEventListener('input', event => {
    if (!event.target.matches('[data-d15-entity-form] input:not([type="file"])')) return;
    const key = event.target.name;
    state.entityDraft = { ...(state.entityDraft || {}), [key]:event.target.value };
    if (state.entityErrors[key]) state.entityErrors = { ...state.entityErrors, [key]:'' };
  });

  document.addEventListener('change', event => {
    if (event.target.matches('[data-d15-select-statement]')) {
      const selected = new Set(state.selectedStatementIds);
      if (event.target.checked) selected.add(event.target.value);
      else selected.delete(event.target.value);
      state.selectedStatementIds = [...selected];
      rerender();
      return;
    }
    if (event.target.matches('[data-d15-select-page]')) {
      const selected = new Set(state.selectedStatementIds);
      currentSettlements().filter(row => row.status === 'pending').forEach(row => {
        if (event.target.checked) selected.add(row.id);
        else selected.delete(row.id);
      });
      state.selectedStatementIds = [...selected];
      rerender();
      return;
    }
    if (!event.target.matches('[data-d15-entity-form] input[type="file"]')) return;
    const file = event.target.files?.[0];
    if (!file) return;
    state.entityFile = file;
    state.entityDraft = { ...(state.entityDraft || {}), bankProof:{ name:file.name, type:file.type, size:file.size } };
    state.entityErrors = { ...state.entityErrors, bankProof:'' };
    state.entityError = '';
    const name = event.target.closest('.d15-entity-upload')?.querySelector('[data-d15-upload-name]');
    if (name) name.textContent = file.name;
  });

  window.addEventListener('keydown', event => {
    const dialog = document.querySelector('.d15-confirm-dialog');
    if (event.key === 'Tab' && dialog) {
      const focusable = [...dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
        .filter(node => node.getClientRects().length > 0 && node.getAttribute('aria-disabled') !== 'true');
      if (focusable.length) {
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
      event.stopImmediatePropagation();
      return;
    }
    if (event.key === 'Escape' && state.confirmationIds.length) {
      event.preventDefault();
      event.stopImmediatePropagation();
      closeConfirmation();
    }
  });
  window.addEventListener('hashchange', () => {
    if (embedded) return;
    const route = location.hash.replace(/^#\/?/,'');
    state.route = route === 'entity' ? 'entity' : 'settlement';
    state.page = 1;
    state.selectedStatementIds = [];
    state.confirmationIds = [];
    state.confirmationReturn = null;
    standaloneRender();
  });

  window.__developerFinanceDemo = {
    snapshot:() => ({
      scenario:state.demoScenario,
      settlements:allSettlements(),
      visibleSettlements:visibleSettlements(),
      selectedStatementIds:[...state.selectedStatementIds],
      financialEntity:activeFinancialEntity(),
      financialEntityApplications:entityApplications(),
    }),
    reviewEntity,
    setDemoScenario:scenarioName => { state.demoScenario = scenarioName; rerender(); },
    reset:() => location.reload(),
  };

  if (embedded) {
    window.PublisherFinance = {
      routeIds:['P15-01','P15-02'],
      createState:() => state,
      render:(_financeState, options = {}) => {
        state.route = options.routeId === 'P15-01' ? 'entity' : 'settlement';
        const canonicalRoute = state.route === 'entity' ? 'P15-01' : 'P15-02';
        return `<section class="publisher-finance" data-testid="developer-finance-demo" data-finance-route="${canonicalRoute}">${pageContent()}${confirmationDialog()}</section>`;
      },
      bind:(_root, options = {}) => {
        state.callbacks.onChange = typeof options.onChange === 'function' ? options.onChange : null;
        state.callbacks.onNavigate = typeof options.onNavigate === 'function' ? options.onNavigate : null;
        document.body.classList.toggle('finance-overlay-open', Boolean(state.confirmationIds.length));
      },
      closeOverlays:() => {
        state.selectedStatementIds = [];
        state.confirmationIds = [];
        state.confirmationReturn = null;
        document.body.classList.remove('finance-overlay-open');
      },
      applyEntryContext:(_financeState, context = {}) => {
        const filters = context.filters || {};
        state.filters = {
          billingMonth:filters.billingMonth || filters.month || 'all',
          settlementMonth:filters.settlementMonth || 'all',
          gameId:filters.gameId || context.gameId || 'all',
          status:filters.status || 'all',
        };
        state.page = 1;
        state.selectedStatementIds = [];
        state.confirmationIds = [];
        state.confirmationReturn = null;
      },
      setScenario:(_financeState, scenarioName) => {
        state.demoScenario = ['exhaustive','empty'].includes(scenarioName) ? scenarioName : 'exhaustive';
        state.selectedStatementIds = [];
        state.confirmationIds = [];
        state.confirmationReturn = null;
        state.page = 1;
        rerender();
      },
    };
  } else {
    const route = location.hash.replace(/^#\/?/,'');
    state.route = route === 'entity' ? 'entity' : 'settlement';
    standaloneRender();
  }
})();</script>
</body>
</html>
