<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>包体测试与版本发布｜盖世游戏开发者平台</title><style>:root {
  --brand-cyan: #38E8FF;
  --brand-blue: #6A7CFF;
  --brand-deep: #101827;
  --brand-night: #0B1220;
  --success: #1E9B66;
  --warning: #C88918;
  --danger: #D95656;
  --info: #3976D9;
  --text-primary: #172033;
  --text-secondary: #5B657A;
  --text-tertiary: #8B94A6;
  --line: #E6E9F0;
  --line-strong: #D5DAE5;
  --surface: #FFFFFF;
  --surface-soft: #F7F8FB;
  --surface-muted: #F0F2F7;
  --nav-text: #AEB8CD;
  --nav-active: #FFFFFF;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --shadow-card: 0 6px 20px rgba(25, 38, 66, 0.06);
  --focus-ring: 0 0 0 3px rgba(56, 232, 255, 0.22);
  --font-sans: "MiSans VF", MiSans, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-number: "D-DIN-PRO", "DIN Alternate", var(--font-sans);
}

* { box-sizing: border-box; }

html, body { min-width: 0; min-height: 100%; margin: 0; }

body {
  color: var(--text-primary);
  background: #E9EDF4;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; }
button, a, select { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.number { font-family: var(--font-number); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

#app { min-width: 0; min-height: 100vh; }

.portal-stage { position: relative; min-width: 0; min-height: 100vh; background: #E9EDF4; }

.product-frame {
  position: relative;
  width: 100%;
  min-width: 0;
  height: 100vh;
  min-height: 0;
  background: var(--surface-soft);
  overflow: hidden;
}

.top-bar {
  position: absolute;
  inset: 0 0 auto 0;
  z-index: 4;
  height: 56px;
  display: flex;
  align-items: center;
  color: #FFFFFF;
  background: linear-gradient(98deg, #0B1220 0%, #15213A 72%, #13243A 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.brand-block {
  width: 232px;
  height: 56px;
  padding: 0 var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

.brand-mark {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  color: var(--brand-cyan);
  border: 1px solid rgba(56, 232, 255, 0.44);
  border-radius: 9px;
  background: linear-gradient(145deg, rgba(56, 232, 255, 0.18), rgba(106, 124, 255, 0.18));
}

.brand-copy { min-width: 0; }
.brand-title { color: #FFFFFF; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
.brand-subtitle { color: #B7C2D6; font-size: 11px; }

.top-context { min-width: 0; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-3); }
.top-context strong { overflow: hidden; color: #FFFFFF; text-overflow: ellipsis; white-space: nowrap; }
.top-account { margin-left: auto; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-3); color: #DCE3F0; }
.account-avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: #142039; font-weight: 700; background: linear-gradient(135deg, var(--brand-cyan), #B7C1FF); }
.account-copy span { display: block; color: #B7C2D6; font-size: 11px; }
.top-help-button { margin-left: auto; min-height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; color: #EAF0FA; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; background: rgba(255,255,255,.06); cursor: pointer; }
.top-help-button:hover { color: #FFFFFF; border-color: rgba(56,232,255,.44); background: rgba(56,232,255,.08); }
.top-help-button svg { width: 16px; height: 16px; color: var(--brand-cyan); }
.top-help-button + .top-account { margin-left: 0; }

.side-nav {
  position: absolute;
  inset: 56px auto 0 0;
  z-index: 3;
  width: 232px;
  min-height: 0;
  padding: var(--space-5) var(--space-3);
  overflow-y: auto;
  color: var(--nav-text);
  background: var(--brand-deep);
  border-right: 1px solid rgba(255,255,255,.05);
}

.nav-label { padding: 0 10px var(--space-2); color: #64728D; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.nav-list { display: grid; gap: var(--space-1); }
.nav-item { position: relative; min-height: 42px; padding: 9px 10px; display: flex; align-items: center; gap: 10px; color: #AAB7CA; border-radius: var(--radius-sm); transition: color .15s, background .15s; }
.nav-item:hover { color: #EDF2FA; background: rgba(255,255,255,.05); }
.nav-item.is-active { color: #FFFFFF; background: linear-gradient(90deg, rgba(56,232,255,.20), rgba(106,124,255,.14)); }
.nav-item.is-active::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand-cyan); }
.nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
.nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workspace { position: absolute; inset: 56px 0 0 232px; min-width: 0; min-height: 0; overflow: auto; background: var(--surface-soft); }
.product-frame.is-login .workspace { left: 0; }
.product-frame.is-onboarding .workspace { left: 0; }
.product-frame.is-login .page-wrap { padding-top: 16px; padding-bottom: 16px; }
.context-bar { height: 48px; padding: 0 var(--space-6); display: flex; align-items: center; gap: var(--space-2); color: var(--text-secondary); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.88); }
.context-bar svg { width: 15px; height: 15px; color: var(--text-tertiary); }
.context-divider { color: var(--line-strong); }
.context-value { color: var(--text-primary); font-weight: 600; }

.page-wrap { min-width: 0; padding: var(--space-6) var(--space-8) 48px; }
.page-header { min-height: 66px; margin-bottom: var(--space-5); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-6); }
.page-header > :first-child { min-width: 0; flex: 1 1 auto; }
.page-eyebrow { margin-bottom: 4px; color: var(--brand-blue); font-family: var(--font-number); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.page-title { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -.02em; }
.page-summary { max-width: 720px; margin: 7px 0 0; color: var(--text-secondary); }
.page-actions { padding-top: 2px; display: flex; flex: 0 0 auto; align-items: center; gap: var(--space-2); }

.help-center { padding: var(--space-6) var(--space-8) 48px; }
.help-center__header { margin-bottom: 20px; display: flex; gap: 16px; align-items: center; }
.help-center__header .text-back { margin: 0; }
.help-center__header h1 { margin: 0; font-size: 24px; }
.help-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; }
.faq-item button { width: 100%; min-height: 46px; padding: 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--text-primary); text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; }
.faq-item button:hover { color: var(--brand-blue); }
.faq-item p { margin: 0; padding: 12px 0 18px; color: var(--text-secondary); line-height: 1.65; }
.contact-card { min-height: 240px; padding: 20px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--line); border-radius: var(--radius-md); background: #FFFFFF; box-shadow: var(--shadow-card); }
.contact-card h2 { margin: 0 0 8px; font-size: 17px; }
.contact-card span { color: var(--text-secondary); }
.contact-card a { width: fit-content; color: var(--info); font-weight: 650; text-decoration: none; }
.contact-card a:hover, .contact-card a:focus-visible { text-decoration: underline; outline: none; }
.contact-card p { margin: 8px 0 0; padding: 12px; color: #0B6271; border-radius: var(--radius-sm); background: #EFFCFE; }

@media (max-width: 1360px) {
  .page-wrap { padding-right: 24px; padding-left: 24px; }
  .help-center { padding-right: 24px; padding-left: 24px; }
  .help-grid { grid-template-columns: minmax(0, 1fr) 280px; }
}

@media (max-width: 1180px) {
  .brand-block, .side-nav { width: 212px; }
  .workspace { left: 212px; }
  .product-frame.is-login .workspace { left: 0; }
  .product-frame.is-onboarding .workspace { left: 0; }
  .top-context { padding-right: 16px; padding-left: 16px; }
  .top-account { padding-right: 16px; padding-left: 12px; }
  .page-wrap, .help-center { padding-right: 20px; padding-left: 20px; }
  .page-header { gap: 16px; }
  .page-title, .help-center__header h1 { font-size: 22px; }
  .help-grid { grid-template-columns: minmax(0, 1fr) 250px; gap: 16px; }
}

.gh-icon { width: 18px; height: 18px; flex: 0 0 auto; }

.gh-button {
  min-height: 36px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--text-primary);
  font-weight: 650;
  line-height: 1;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
}
.gh-button:hover { border-color: #B8C1D4; background: #FAFBFD; }
.gh-button[data-variant="primary"] { color: #071522; border-color: var(--brand-cyan); background: linear-gradient(135deg, var(--brand-cyan), #8BEFFF); }
.gh-button[data-variant="primary"]:hover { filter: brightness(.98); }
.gh-button[data-variant="danger"] { color: var(--danger); border-color: rgba(217,86,86,.35); background: #FFF8F8; }
.gh-button[data-variant="ghost"] { color: #C7D1E1; border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.04); }
.gh-button[data-variant="text"] { min-height: 30px; padding: 0 6px; color: var(--info); border-color: transparent; background: transparent; }
.gh-button[data-size="small"] { min-height: 28px; padding: 0 9px; font-size: 11px; }
.gh-button:disabled, .gh-button[aria-disabled="true"] { color: var(--text-tertiary); border-color: var(--line); background: var(--surface-muted); cursor: not-allowed; opacity: .68; }
.page-button:disabled, .page-button[aria-disabled="true"] { color: var(--text-tertiary); cursor: not-allowed; opacity: .45; }
.gh-button svg { width: 16px; height: 16px; }

.field { display: grid; gap: 7px; min-width: 0; }
.field-label { display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.field-required { margin-left: 3px; color: var(--danger); }
.field-hint { color: var(--text-tertiary); font-size: 11px; font-weight: 400; }
.gh-input, .gh-select, .gh-textarea { width: 100%; color: var(--text-primary); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); transition: border .15s, box-shadow .15s; }
.gh-input, .gh-select { height: 38px; padding: 0 11px; }
.gh-textarea { min-height: 96px; padding: 10px 11px; resize: vertical; }
.gh-input:hover, .gh-select:hover, .gh-textarea:hover { border-color: #ABB5C9; }
.gh-input[aria-invalid="true"], .gh-textarea[aria-invalid="true"] { border-color: var(--danger); background: #FFF9F9; }
.field-error { color: var(--danger); font-size: 11px; }

.status-tag { min-height: 24px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 11px; font-weight: 650; border-radius: 999px; background: var(--surface-muted); white-space: nowrap; }
.status-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-tag[data-variant="success"] { color: var(--success); background: rgba(30,155,102,.10); }
.status-tag[data-variant="warning"] { color: var(--warning); background: rgba(200,137,24,.11); }
.status-tag[data-variant="danger"] { color: var(--danger); background: rgba(217,86,86,.10); }
.status-tag[data-variant="info"] { color: var(--info); background: rgba(57,118,217,.10); }

.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.panel-header { min-height: 54px; padding: 0 var(--space-5); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); border-bottom: 1px solid var(--line); }
.panel-title { margin: 0; font-size: 15px; }
.panel-description { color: var(--text-tertiary); font-size: 11px; }
.panel-body { padding: var(--space-5); }

.filter-bar { margin-bottom: var(--space-4); padding: 12px; display: grid; grid-template-columns: minmax(220px, 1.5fr) repeat(2, minmax(150px, .8fr)) auto; gap: 10px; align-items: end; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.search-field { position: relative; }
.search-field svg { position: absolute; top: 10px; left: 11px; width: 17px; height: 17px; color: var(--text-tertiary); pointer-events: none; }
.search-field input { padding-left: 36px; }

.table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.data-table { width: 100%; min-width: 680px; border-collapse: collapse; table-layout: fixed; }
.data-table[data-columns="7"], .data-table[data-columns="8"] { min-width: 920px; }
.data-table[data-columns="6"] { min-width: 820px; }
.data-table[data-columns="5"] { min-width: 740px; }
.data-table th { height: 42px; padding: 0 14px; color: var(--text-secondary); font-size: 11px; text-align: left; background: var(--surface-muted); border-bottom: 1px solid var(--line); }
.data-table td { height: 54px; padding: 9px 14px; color: var(--text-primary); border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: normal; word-break: normal; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #FAFBFD; }
.table-primary { font-weight: 650; }
.table-secondary { margin-top: 2px; color: var(--text-tertiary); font-size: 11px; white-space: nowrap; }
.table-identifier { white-space: nowrap; }

.pagination { margin-top: var(--space-4); display: flex; align-items: center; justify-content: space-between; color: var(--text-tertiary); font-size: 12px; }
.pagination__buttons { display: flex; gap: 6px; }
.page-button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
.page-button.is-active { color: #091521; border-color: var(--brand-cyan); background: rgba(56,232,255,.24); }

.tabs { margin-bottom: var(--space-4); display: flex; gap: var(--space-5); border-bottom: 1px solid var(--line); }
.tab { position: relative; padding: 0 2px 11px; color: var(--text-secondary); border: 0; background: transparent; cursor: pointer; }
.tab.is-active { color: var(--text-primary); font-weight: 650; }
.tab.is-active::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: var(--brand-blue); }
.tabs[data-variant="task"] { gap: 8px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-muted); }
.tabs[data-variant="task"] .tab { min-height: 36px; padding: 8px 16px; border: 1px solid transparent; border-radius: 7px; }
.tabs[data-variant="task"] .tab.is-active { color: var(--text-primary); border-color: var(--line-strong); background: #FFFFFF; box-shadow: 0 2px 8px rgba(24,38,66,.08); }
.tabs[data-variant="task"] .tab.is-active::after { display: none; }
.tab:focus-visible, .nav-item:focus-visible, .top-help-button:focus-visible { outline: 2px solid var(--brand-cyan); outline-offset: 2px; }
.authorization-summary { position: sticky; top: 0; z-index: 2; margin-bottom: 16px; padding: 14px 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(255,255,255,.96); }
.authorization-summary > div { min-width: 0; display: grid; gap: 5px; }
.authorization-summary span { color: var(--text-secondary); font-size: 11px; }
.code-block { overflow: hidden; border: 1px solid #24344F; border-radius: var(--radius-md); background: #101827; }
.code-block header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; color: #EAF0FA; border-bottom: 1px solid rgba(255,255,255,.08); }
.code-block header .gh-button[data-variant="text"] { color: #C8F7FF; }
.code-block pre { margin: 0; padding: 16px; overflow: auto; color: #C8F7FF; font: 12px/1.7 var(--font-number); }

.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.stepper-item { position: relative; display: grid; justify-items: center; gap: 7px; color: var(--text-tertiary); font-size: 11px; text-align: center; }
.stepper-item::before { content: ""; position: absolute; top: 10px; right: 50%; left: -50%; height: 1px; background: var(--line-strong); }
.stepper-item:first-child::before { display: none; }
.stepper-dot { position: relative; z-index: 1; width: 20px; height: 20px; display: grid; place-items: center; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--surface); }
.stepper-item.is-done, .stepper-item.is-active { color: var(--text-primary); }
.stepper-item.is-done .stepper-dot { color: #FFFFFF; border-color: var(--success); background: var(--success); }
.stepper-item.is-active .stepper-dot { border-color: var(--brand-blue); box-shadow: 0 0 0 4px rgba(106,124,255,.12); }

.result-strip { margin-bottom: var(--space-4); padding: 11px 13px; display: flex; align-items: flex-start; gap: 9px; color: var(--info); border: 1px solid rgba(57,118,217,.18); border-radius: var(--radius-sm); background: rgba(57,118,217,.07); }
.result-strip[data-variant="success"] { color: var(--success); border-color: rgba(30,155,102,.20); background: rgba(30,155,102,.07); }
.result-strip[data-variant="warning"] { color: var(--warning); border-color: rgba(200,137,24,.22); background: rgba(200,137,24,.08); }
.result-strip[data-variant="danger"] { color: var(--danger); border-color: rgba(217,86,86,.22); background: rgba(217,86,86,.07); }
.result-strip svg { width: 17px; height: 17px; margin-top: 1px; }
.result-strip strong { display: block; font-size: 12px; }
.result-strip span { display: block; margin-top: 1px; color: var(--text-secondary); font-size: 11px; }

.timeline { position: relative; margin: 0; padding: 0; list-style: none; }
.timeline-item { position: relative; padding: 0 0 20px 26px; }
.timeline-item::before { content: ""; position: absolute; top: 5px; left: 5px; width: 8px; height: 8px; border: 2px solid var(--surface); border-radius: 50%; background: var(--brand-blue); box-shadow: 0 0 0 1px var(--brand-blue); }
.timeline-item::after { content: ""; position: absolute; top: 17px; bottom: 0; left: 9px; width: 1px; background: var(--line-strong); }
.timeline-item:last-child::after { display: none; }
.timeline-title { font-weight: 650; }
.timeline-meta { margin-top: 2px; color: var(--text-tertiary); font-size: 11px; }

.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
.metric-card { padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.metric-label { color: var(--text-secondary); font-size: 12px; }
.metric-value { margin-top: 6px; font-family: var(--font-number); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.metric-trend { margin-top: 3px; color: var(--success); font-family: var(--font-number); font-size: 11px; }

.chart { height: 256px; padding: 12px 14px 8px; border: 1px solid var(--line); border-radius: var(--radius-md); background: linear-gradient(180deg, #FFFFFF, #FBFCFE); }
.chart-heading { height: 24px; display: flex; align-items: center; justify-content: space-between; color: var(--text-tertiary); font-size: 10px; }
.chart-heading .legend-item { color: var(--text-secondary); }
.chart svg { width: 100%; height: calc(100% - 24px); overflow: visible; }
.chart-grid { stroke: #E8EBF2; stroke-width: 1; }
.chart-area { fill: url(#chartGradient); opacity: .72; }
.chart-line { fill: none; stroke: var(--brand-blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart-dot { fill: #FFFFFF; stroke: var(--brand-blue); stroke-width: 2; }
.chart-axis { fill: #7E899B; font-family: var(--font-number); font-size: 10px; text-anchor: end; }

.state-panel { min-height: 520px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.state-content { max-width: 430px; padding: 42px; text-align: center; }
.state-visual { width: 58px; height: 58px; margin: 0 auto 16px; display: grid; place-items: center; color: var(--brand-blue); border-radius: 18px; background: rgba(106,124,255,.10); }
.state-visual svg { width: 28px; height: 28px; }
.state-content h2 { margin: 0 0 8px; font-size: 18px; }
.state-content p { margin: 0 0 20px; color: var(--text-secondary); }
.skeleton-stack { width: 680px; display: grid; gap: 12px; }
.skeleton { height: 16px; border-radius: 5px; background: linear-gradient(90deg, #EEF1F6 25%, #F8F9FB 38%, #EEF1F6 64%); background-size: 400% 100%; animation: skeleton 1.5s ease infinite; }
.skeleton:nth-child(1) { width: 44%; height: 26px; }

      if (action === 'download-sdk') { resultMessage(route.id, 'SDK 下载已开始', '请在下载完成后核对版本与 SHA-256 校验值。', 'info'); return; }
      if (action === 'open-sdk-docs') { resultMessage(route.id, '接入文档已打开', '仅已授权的开发者账号可以访问接入文档。', 'info'); return; }
      if (action === 'send-password-setup') { resultMessage(route.id, '密码设置邮件已发送', '仅向已验证邮箱发送；不会创建第二个 account_id。', 'info'); return; }
      if (action === 'save-draft') {
        const now = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
        memory.page[route.id] = { savedAt: now };
        root.querySelectorAll('[data-save-state]').forEach(node => { node.textContent = `最近保存：${now}`; });
        resultMessage(route.id, '草稿已保存', '提交审核前可继续修改。');
        return;
      }
      if (action === 'approve') { resultMessage(route.id, '审核已通过', '审核结果已保存并写入处理记录。'); return; }
      if (action === 'reject') { resultMessage(route.id, '已驳回并记录原因', '请开发者修改后重新提交。', 'danger'); return; }
      if (action === 'start-upload') {
        memory.upload[route.id] = 'uploading';
        const bar = root.querySelector('[data-upload-progress]');
        const label = root.querySelector('[data-upload-label]');
        if (bar) bar.style.width = '82%';
        if (label) label.textContent = '上传中 82%，已完成分片正在校验';
        resultMessage(route.id, '分片上传已开始', '已创建本次上传任务，可在当前页面查看进度。', 'info');
        return;
      }
      if (action === 'interrupt-upload') {
        memory.upload[route.id] = 'interrupted';
        const label = root.querySelector('[data-upload-label]');
        if (label) label.textContent = '网络中断，已完成分片保留，可继续上传';
        resultMessage(route.id, '上传已中断', '已完成分片已保留，请在页面内继续。', 'warning');
        return;
      }
      if (action === 'retry-upload') {
        memory.upload[route.id] = 'verified';
        const bar = root.querySelector('[data-upload-progress]');
        const label = root.querySelector('[data-upload-label]');
        if (bar) bar.style.width = '100%';
        if (label) label.textContent = '分片已全部上传，完整性校验通过';
        resultMessage(route.id, '继续上传完成', '包体完整性校验通过。');
        return;
      }
      if (action === 'test-pass') {
        root.querySelectorAll('.choice-card').forEach(node => node.classList.remove('is-selected'));
        event.currentTarget.closest('.choice-card')?.classList.add('is-selected');
        resultMessage(route.id, '已选择测试通过', '提交后将生成不可覆盖的历史记录。', 'info');
        return;
      }
      if (action === 'submit-test-result') { resultMessage(route.id, '测试结果已提交', '历史结果不可覆盖，开发者可查看处理记录。'); return; }
      if (action === 'schedule-release' || action === 'release-now') {
        const scheduled = action === 'schedule-release';
        root.querySelectorAll('.publish-option').forEach(node => node.classList.toggle('is-active', node.dataset.portalAction === action));
        const scheduleField = root.querySelector('[data-schedule-field]');
        const scheduleInput = scheduleField?.querySelector('input');
        scheduleField?.classList.toggle('is-disabled', !scheduled);
        if (scheduleInput) {
          scheduleInput.disabled = !scheduled;
          scheduleInput.setAttribute('aria-disabled', String(!scheduled));
          if (!scheduled) scheduleInput.value = '';
        }
        root.querySelectorAll('[data-release-submit], [data-primary-action]').forEach(control => {
          control.dataset.portalAction = action;
          const label = control.querySelector('span');
          if (label) label.textContent = scheduled ? '定时发布' : '立即发布';
        });
        resultMessage(route.id, action === 'schedule-release' ? '已选择定时发布' : '已选择立即发布', '运营发布前仍需通过全部门禁；失败时保持原线上版本。', 'warning');
        return;
      }
      if (action === 'add-target-rule') { event.currentTarget.classList.toggle('is-active'); resultMessage(route.id, '包含规则已更新', '仅使用已确认的地区、语言、设备／系统和平台行为标签。', 'info'); return; }
      if (action === 'exclude-rule') { event.currentTarget.classList.toggle('is-excluded'); resultMessage(route.id, '排除规则已更新', '请保存配置后继续预估人群。', 'info'); return; }
      if (action === 'dashboard-range') {
        event.currentTarget.parentElement?.querySelectorAll('[data-dashboard-range]').forEach(node => node.dataset.variant = node === event.currentTarget ? 'primary' : 'secondary');
        resultMessage(route.id, '时间范围已切换', '指标、趋势和明细已按所选范围更新。', 'info');
        return;
      }
      if (action === 'dashboard-filter') {
        event.currentTarget.parentElement?.querySelectorAll('[data-dashboard-filter]').forEach(node => node.dataset.variant = node === event.currentTarget ? 'primary' : 'secondary');
        resultMessage(route.id, '筛选条件已更新', '指标、趋势和明细已同步刷新。', 'info');
        return;
      }
      if (action === 'tab') {
        event.currentTarget.parentElement.querySelectorAll('.tab').forEach(node => { node.classList.toggle('is-active', node === event.currentTarget); node.setAttribute('aria-selected', String(node === event.currentTarget)); });
        return;
      }
      if (action.startsWith('page-')) { resultMessage(route.id, '列表已更新', '筛选条件和页码保持不变。', 'info'); return; }
      const destination = primaryDestination(route.id);
      if (event.currentTarget.hasAttribute('data-primary-action') && destination) { navigate({ routeId: destination, state: 'default' }); return; }
      resultMessage(route.id, '操作已完成', '最新状态已保存。');
    }));
  };

  const render = () => {
    const { route, role, state, cdkeyTab } = parseLocation();
    const page = portalData.pages?.[route.id] || fallbackPage(route);
    const content = namespace.templates.render({ route, page, state });
    root.innerHTML = namespace.shell.renderBusiness({ module: moduleConfig, routes, route, page, portalData, role, state, content });
    if (memory.result[route.id] && state === 'default') {
      const target = root.querySelector('[data-runtime-result]');
      if (target) target.innerHTML = c.resultStrip(memory.result[route.id]);
    }
    if (memory.page[route.id]?.savedAt) root.querySelectorAll('[data-save-state]').forEach(node => { node.textContent = `最近保存：${memory.page[route.id].savedAt}`; });
    applyBusinessState(route.id);
    bindInteractions({ route, role, state });
    if (route.id === 'P02-01' && state === 'default') setCdkeyTab(route.id, cdkeyTab ?? memory.page[route.id]?.cdkeyTab ?? 0, false);
  };

  addEventListener('hashchange', render);
  render();
})(window.GameHubDeveloperPortal);</script></body></html>
