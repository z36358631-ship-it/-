<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>暗黑系列首发适配·游玩活动</title>
  <style>
    :root{--bg:#100b0d;--surface:#211519;--raised:#2d1819;--red:#d93628;--red-deep:#6c1517;--gold:#ffd992;--gold-2:#ee9a45;--text:#fff4e4;--muted:#c39b91;--line:rgba(255,180,102,.28);--font:"MiSans VF","MiSans","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070708;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:14px 0;overflow:auto}button{font:inherit;color:inherit}
    .phone{width:390px;height:min(844px,calc(100vh - 52px));min-height:610px;max-width:100%;position:relative;overflow:hidden;border-radius:30px;background:var(--bg);box-shadow:0 0 0 8px #252127,0 28px 80px rgba(0,0,0,.65)}
    .app{position:absolute;inset:0;background:radial-gradient(circle at 70% 0%,rgba(206,36,26,.22),transparent 28%),var(--bg)}.status{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;color:#fff0df;font-size:10px}.status-right{display:flex;gap:7px;color:#dcc6bb;align-items:center}.battery{width:19px;height:9px;border:1px solid #d7c2b8;border-radius:2px;padding:1px}.battery i{display:block;width:70%;height:100%;background:var(--gold);border-radius:1px}.scroll{height:calc(100% - 28px);overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{width:0}
    .topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid rgba(255,192,140,.12);background:rgba(22,9,11,.92);position:sticky;top:0;z-index:4}.back,.more{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#fff1e0;font-size:22px;cursor:pointer}.more{font-size:18px}.top-title{font-size:14px;font-weight:750}.top-meta{font-size:10px;color:var(--muted)}
    .hero{min-height:190px;padding:20px 18px 18px;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 22%,rgba(255,159,62,.35),transparent 24%),linear-gradient(145deg,#361015,#120d10 70%);border-bottom:1px solid rgba(255,161,76,.25)}.hero::after{content:"";position:absolute;width:160px;height:160px;right:-38px;top:18px;border:2px solid rgba(240,79,49,.54);transform:rotate(45deg);box-shadow:0 0 40px rgba(230,48,25,.32)}.badge{display:inline-flex;align-items:center;gap:5px;color:#ffd98e;font-size:10px;border:1px solid rgba(255,212,125,.38);border-radius:999px;padding:5px 8px;background:rgba(66,20,15,.55)}.badge i{width:6px;height:6px;border-radius:50%;background:#ff6a51;box-shadow:0 0 10px #ff6a51}.hero h1{margin:12px 0 5px;font-size:25px;line-height:1.15}.hero p{margin:0;color:#e1beb2;font-size:11px;line-height:1.5;max-width:250px}.hero .game-pills{display:flex;gap:6px;position:relative;z-index:1;margin-top:14px;overflow:auto;scrollbar-width:none}.game-pills::-webkit-scrollbar{width:0}.game-pill{border:1px solid rgba(255,193,116,.28);background:rgba(33,14,16,.75);color:#c89e90;border-radius:999px;padding:7px 10px;font-size:10px;white-space:nowrap;cursor:pointer}.game-pill.active{border-color:#ffc15d;background:rgba(156,34,26,.6);color:#fff1cd}.side-bar{position:absolute;right:0;top:18px;z-index:3;display:grid;gap:7px}.side-button{min-width:58px;height:28px;padding:0 9px;border:1px solid rgba(255,196,118,.35);border-right:0;border-radius:999px 0 0 999px;background:rgba(24,10,12,.82);color:#f2c793;font-size:9px;cursor:pointer}.side-button:hover{background:rgba(125,31,25,.72);color:#fff2d7}
    .content{padding:14px 14px 28px}.section{margin-bottom:14px}.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:9px}.section-title h2{margin:0;font-size:16px}.section-title span{display:none}.ornate{position:relative;border:1px solid rgba(249,137,63,.45);border-radius:14px;background:linear-gradient(140deg,rgba(102,25,25,.46),rgba(20,13,16,.96));box-shadow:inset 0 0 0 1px rgba(255,194,105,.08)}.ornate::before{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);opacity:.8}.user-card{padding:12px;display:flex;align-items:center;justify-content:space-between}.user-left{display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffceb0,#aa2e2c 55%,#3b1118);font-size:13px;font-weight:800}.user-name{font-size:12px;font-weight:700}.user-sub{margin-top:3px;color:#9f7770;font-size:9px}.user-status{padding:6px 8px;border:1px solid rgba(0,199,119,.42);border-radius:999px;color:#a7f1d0;background:rgba(0,199,119,.08);font-size:9px}.action{height:34px;padding:0 13px;border:1px solid #f7ba67;border-radius:999px;background:linear-gradient(180deg,#b63a26,#741519);color:#fff5da;font-size:11px;font-weight:750;cursor:pointer}.action.done{border-color:#5d4d4b;background:#302024;color:#a88c84}.task-list{padding:3px 12px}.task{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,196,138,.12)}.task:last-child{border-bottom:0}.task-copy{min-width:0}.task-copy b{display:block;font-size:12px}.task-copy span{display:block;margin-top:4px;color:#a87e74;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-btn{flex:none;height:30px;padding:0 10px;border:1px solid rgba(255,185,96,.5);border-radius:999px;background:rgba(124,30,27,.4);color:#ffd69a;font-size:10px;cursor:pointer}.task-btn.done{border-color:rgba(0,199,119,.35);color:#99e7c2;background:rgba(0,199,119,.08)}
    .lottery{padding:14px}.lottery-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.lottery-top b{font-size:14px}.draw-count{color:#ffcf7e;font-size:10px}.wheel{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:244px;margin:0 auto 12px}.lot{aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:4px;border:1px solid rgba(255,183,91,.34);border-radius:9px;background:linear-gradient(145deg,#391616,#1d1114);color:#edc9a0;font-size:10px;line-height:1.25}.lot strong{display:block;color:#ffd77e;font-size:16px}.lot.draw{border-color:#ffcc74;background:linear-gradient(145deg,#ce4b27,#6e1219);box-shadow:0 4px 0 #3d0c11;cursor:pointer}.lot.draw:active{transform:translateY(2px);box-shadow:none}.lot.empty{opacity:.7}.wheel-help{text-align:center;color:#a77c70;font-size:10px}.rules{padding:13px;color:#d5aea4;font-size:10px;line-height:1.6}.rules strong{color:#ffe0a3}.bottom-link{width:100%;height:40px;border:1px solid rgba(255,198,122,.35);border-radius:10px;background:rgba(128,30,27,.25);color:#f5d197;font-size:11px;cursor:pointer}.modal-mask{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.8)}.modal-mask.hidden{display:none}.modal{width:100%;padding:18px;border:1px solid rgba(255,185,101,.56);border-radius:18px;background:linear-gradient(155deg,#361518,#160f12);box-shadow:0 20px 55px rgba(0,0,0,.6)}.modal h3{margin:0;color:#ffe1a7;font-size:17px}.modal p{margin:8px 0;color:#caa59b;font-size:11px;line-height:1.55}.modal-close{float:right;width:26px;height:26px;border:0;border-radius:50%;background:#432225;color:#e2b8ad;cursor:pointer;font-size:17px}.prize-result{display:grid;place-items:center;min-height:86px;margin:12px 0;border-radius:12px;border:1px solid rgba(255,190,104,.35);background:radial-gradient(circle,#7e2e22,transparent 60%),#231114;color:#ffe2a8;text-align:center;font-size:14px;font-weight:750}.modal .action{width:100%;height:40px}.address{display:grid;gap:8px;margin-top:10px}.address input{height:38px;border:1px solid rgba(255,198,122,.26);border-radius:8px;background:#1c1114;color:#fff2e0;padding:0 10px;font-size:11px;outline:none}.address input:focus{border-color:#f4b461}.small-note{color:#8f6b65;font-size:9px;line-height:1.45}
    @media(max-height:730px){body{align-items:flex-start;padding-top:12px}}
  </style>
</head>
<body>
  <main class="phone" aria-label="暗黑系列运营活动页">
    <div class="app">
      <div class="status"><span>21:30 ◔</span><span class="status-right"><span>5G</span><span class="battery"><i></i></span></span></div>
      <div class="scroll" id="activityScroll">
        <header class="topbar"><button class="back" id="backToLanding" aria-label="返回落地页">‹</button><div class="top-title">暗黑系列游玩活动</div></header>
        <section class="hero"><div class="side-bar"><button class="side-button" id="loginBtn">登录用户</button><button class="side-button" id="sideRulesBtn">活动规则</button><button class="side-button" id="sidePrizeBtn">我的奖品</button></div><div class="badge"><i></i>首发适配 · 游玩挑战</div><h1 id="activityGameTitle">《暗黑破坏神 IV》</h1><p>完成当前游戏的首次有效游玩和 30 分钟任务，获得对应奖池抽奖机会。</p><div class="game-pills" id="gamePills"></div></section>
        <div class="content">
          <section class="section ornate user-card"><div class="user-left"><div class="avatar">D</div><div><div class="user-name">盖世用户 · 首发活动</div><div class="user-sub">当前游戏：<span id="userGameName">《暗黑破坏神 IV》</span></div></div></div><div class="user-status">活动可参加</div></section>
          <section class="section"><div class="section-title"><h2>任务抽奖</h2></div><div class="ornate lottery"><div class="lottery-top"><b id="poolTitle">《暗黑4》首发奖池</b></div><div class="wheel" id="wheel"></div></div></section>
          <section class="section"><div class="section-title"><h2>游玩任务</h2></div><div class="ornate task-list" id="taskList"></div></section>
        </div>
      </div>
      <div class="modal-mask hidden" id="modalMask"><div class="modal"><button class="modal-close" id="modalClose" aria-label="关闭">×</button><h3 id="modalTitle">恭喜获得</h3><p id="modalCopy">奖品已记录到我的奖品。</p><div class="prize-result" id="prizeResult">《暗黑4》标准版游戏权益</div><button class="action" id="modalAction">知道了</button></div></div>
      <div class="modal-mask hidden" id="addressMask"><div class="modal"><button class="modal-close" id="addressClose" aria-label="关闭">×</button><h3>填写收货地址</h3><p>实物奖品将在活动结束后统一发货。</p><div class="address"><input placeholder="收货人姓名"><input placeholder="联系电话"><input placeholder="详细收货地址"><button class="action" id="saveAddress">保存地址</button><span class="small-note" id="addressNote">地址仅用于本次奖品履约，提交后可在“我的奖品”查看状态。</span></div></div></div>
    </div>
  </main>
  <script>
    const gameConfig = {
      d4: { name:'《暗黑破坏神 IV》', pool:'《暗黑4》首发奖池', prizes:['30分钟秒玩时长','60分钟秒玩时长','盖世游戏手柄','手机散热器','快充配件','谢谢参与'] },
      d3: { name:'《暗黑破坏神 III》', pool:'《暗黑3》活动奖池', prizes:['30分钟秒玩时长','60分钟秒玩时长','盖世游戏手柄','手机散热器','快充配件','谢谢参与'] },
      d2r: { name:'《暗黑破坏神2》重制版', pool:'《暗黑2》活动奖池', prizes:['30分钟秒玩时长','60分钟秒玩时长','盖世游戏手柄','手机散热器','快充配件','谢谢参与'] }
    };
    const params = new URLSearchParams(location.search); let currentGame = params.get('game') || 'd4';
    const stateByGame = {};
    const $ = s => document.querySelector(s);
    function getState(){ if(!stateByGame[currentGame]) stateByGame[currentGame]={draws:1,tasks:{login:true,play5:false,play30:false,play60:false,play180:false,compat:false},progress:{},prizes:[]}; return stateByGame[currentGame]; }
    function openModal(title,copy,prize,action='知道了'){ $('#modalTitle').textContent=title; $('#modalCopy').textContent=copy; $('#prizeResult').textContent=prize; $('#modalAction').textContent=action; $('#modalMask').classList.remove('hidden'); }
    function closeModal(){ $('#modalMask').classList.add('hidden'); }
    function renderPills(){ $('#gamePills').innerHTML=Object.entries(gameConfig).map(([id,g])=>`<button class="game-pill ${id===currentGame?'active':''}" data-game="${id}">${g.name}</button>`).join(''); document.querySelectorAll('.game-pill').forEach(b=>b.addEventListener('click',()=>{currentGame=b.dataset.game; render();})); }
    function renderTasks(){ const state=getState(); const tasks=[['login','登录','登录后自动完成 · 抽奖+1',1],['play5','玩PC游戏5分钟','累计前台有效游玩5分钟 · 抽奖+1',1],['play30','玩PC游戏30分钟','累计前台有效游玩30分钟 · 抽奖+1',1],['play60','玩PC游戏1小时','累计前台有效游玩1小时 · 抽奖+1',1],['play180','玩PC游戏3小时','累计前台有效游玩3小时 · 抽奖+2',2],['compat','兼容性评价','提交当前游戏兼容性评价 · 抽奖+1',1]]; $('#taskList').innerHTML=tasks.map(([id,title,desc,reward])=>{const done=state.tasks[id], progress=state.progress[id]; const label=done?'已完成':progress?'完成模拟游玩':'去完成'; return `<div class="task"><div class="task-copy"><b>${title}</b><span>${progress?'演示状态：正在检测有效游玩':desc}</span></div><button class="task-btn ${done?'done':''}" data-task="${id}">${label}</button></div>`}).join(''); document.querySelectorAll('.task-btn').forEach(btn=>btn.addEventListener('click',()=>completeTask(btn.dataset.task))); }
    function completeTask(id){ const state=getState(); if(state.tasks[id])return; if(id==='login'){state.tasks.login=true;state.draws+=1;render();return;} if((id.startsWith('play'))&&!state.progress[id]){state.progress[id]=true;renderTasks();return;} state.tasks[id]=true; delete state.progress[id]; const rewards={play5:1,play30:1,play60:1,play180:2,compat:1}; state.draws += rewards[id] || 0; render(); }
    function renderWheel(){ const state=getState(),g=gameConfig[currentGame]; const list=[g.prizes[0],g.prizes[1],g.prizes[2],g.prizes[3],'__DRAW__',g.prizes[4],g.prizes[5],g.prizes[0],g.prizes[1]]; $('#wheel').innerHTML=list.map((p,i)=>p==='__DRAW__'?`<button class="lot draw" id="drawBtn"><strong>抽奖</strong><small>剩余 ${state.draws} 次</small></button>`:`<div class="lot ${p==='谢谢参与'?'empty':''}"><strong>${p==='谢谢参与'?'·':'✦'}</strong>${p}</div>`).join(''); $('#drawBtn').addEventListener('click',drawPrize); $('#poolTitle').textContent=g.pool; }
    function renderPrizes(){ const state=getState(); const text=state.prizes.length?state.prizes.map(item=>`${item.prize} · ${item.status}`).join('；'):'暂无已中奖记录'; $('#modalCopy').textContent=text; }
    function render(){ const state=getState(); renderPills(); renderTasks(); renderWheel(); $('#activityGameTitle').textContent=gameConfig[currentGame].name; $('#userGameName').textContent=gameConfig[currentGame].name; }
    function drawPrize(){ const state=getState(); if(!state.draws){openModal('还没有抽奖次数','先完成当前游戏的有效游玩任务，再来抽取对应奖池。','完成任务获得次数');return;} state.draws--; const g=gameConfig[currentGame]; const prize=g.prizes[Math.floor(Math.random()*g.prizes.length)]; const isPhysical=prize.includes('手柄')||prize.includes('散热')||prize.includes('配件'); const record={prize,status:isPhysical?'待填写地址':prize.includes('权益')?'待核销':'已到账'}; state.prizes.unshift(record); renderWheel(); openModal(prize==='谢谢参与'?'本次未中奖':'恭喜获得',isPhysical?'实物奖品请前往我的奖品填写地址。':prize.includes('权益')?'数字权益按地区和激活规则核销。':'奖品已到账。',prize,isPhysical?'去填写地址':'知道了'); $('#modalAction').onclick=()=>{if(isPhysical){$('#modalMask').classList.add('hidden');$('#addressMask').classList.remove('hidden')}else closeModal()}; }
    $('#modalClose').addEventListener('click',closeModal); $('#addressClose').addEventListener('click',()=>$('#addressMask').classList.add('hidden')); $('#saveAddress').addEventListener('click',()=>{const values=[...document.querySelectorAll('.address input')].map(input=>input.value.trim());if(values.some(value=>!value)){ $('#addressNote').textContent='请填写收货人、联系电话和详细地址。'; $('#addressNote').style.color='#ffad92'; return;}const state=getState();if(state.prizes[0])state.prizes[0].status='待发货';$('#addressMask').classList.add('hidden');openModal('地址已保存','奖品发货状态可在我的奖品查看。','待发货','知道了');});
    $('#loginBtn').addEventListener('click',()=>openModal('登录用户','当前已登录盖世账号，可参与暗黑系列游玩活动。','活动可参加'));
    $('#sideRulesBtn').addEventListener('click',()=>openModal('活动规则','完成登录、玩PC游戏5分钟/30分钟/1小时/3小时或兼容性评价任务，获得对应抽奖次数；实物奖需实名和填写地址。','以活动页实际配置为准'));
    $('#sidePrizeBtn').addEventListener('click',()=>{renderPrizes();$('#modalTitle').textContent='我的奖品';$('#prizeResult').textContent='奖品记录';$('#modalAction').textContent='知道了';$('#modalMask').classList.remove('hidden');});
    $('#backToLanding').addEventListener('click',()=>{location.href='暗黑系列首发适配落地页demo.html'});
    render();
  </script>
</body>
</html>
