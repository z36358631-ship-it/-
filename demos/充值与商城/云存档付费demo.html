<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盖世游戏 - 云存档付费Demo</title>
<style>
:root{--bg:#0b0d12;--card:#151820;--border:rgba(255,255,255,0.08);--text:#f4f4f5;--sub:#8e8e93;--primary:#d4b473;--green:#52c41a;--red:#f5222d;--blue:#1890ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC",sans-serif;color:var(--text)}
body{background:#000;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
.ctrl-btns{display:flex;gap:10px;margin-bottom:12px}
.ctrl-btn{padding:7px 16px;border-radius:14px;background:#222;color:#fff;border:1px solid #444;cursor:pointer;font-size:12px}
#app{background:var(--bg);border-radius:40px;box-shadow:0 0 0 10px #222;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:0.4s}
#app.portrait{width:390px;height:844px}
#app.landscape{width:844px;height:390px;border-radius:20px}
.top-bar{display:flex;align-items:center;padding:10px 16px;gap:10px;flex-shrink:0}
.top-bar .back{font-size:18px;cursor:pointer}
.top-bar .title{font-size:15px;font-weight:bold;flex:1}
.top-bar .guide{font-size:11px;color:var(--sub);cursor:pointer;padding:3px 8px;border:1px solid var(--border);border-radius:8px}
.tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:10px 0;font-size:13px;color:var(--sub);cursor:pointer;position:relative}
.tab.active{color:#fff;font-weight:bold}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:18px;height:2.5px;background:var(--primary);border-radius:2px}
.sub-tabs{display:flex;gap:10px;padding:8px 16px;flex-shrink:0}
.stab{padding:4px 12px;border-radius:12px;font-size:12px;color:var(--sub);background:rgba(255,255,255,0.05);cursor:pointer}
.stab.active{background:#fff;color:#000;font-weight:bold}
.scroll{flex:1;overflow-y:auto}.scroll::-webkit-scrollbar{display:none}
/* 存档卡片grid */
.save-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px}
.landscape .save-grid{grid-template-columns:1fr 1fr 1fr}
.save-card{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
.save-card img{width:100%;height:80px;object-fit:cover;display:block}
.landscape .save-card img{height:60px}
.sc-body{padding:8px 10px}
.sc-title{font-size:11px;color:#fff;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;margin-bottom:4px}
.sc-meta{font-size:10px;color:var(--sub);margin-bottom:6px}
.sc-btn{display:block;width:100%;padding:5px;border-radius:8px;text-align:center;font-size:11px;font-weight:bold;border:none;cursor:pointer}
.sc-btn.buy{background:var(--primary);color:#000}
.sc-btn.bought{background:rgba(255,255,255,0.08);color:var(--sub)}
.sc-btn.using{background:rgba(82,196,26,0.15);color:var(--green)}
.sc-btn.use{background:rgba(255,255,255,0.08);color:#fff}
.sc-time{font-size:9px;color:var(--sub);margin-top:4px}
.sc-del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.save-cover{position:relative}
.save-cover img{width:100%;height:80px;object-fit:cover;display:block}
.landscape .save-cover img{height:60px}
.source-tag,.package-tag{position:absolute;top:5px;padding:2px 6px;border-radius:8px;font-size:8px;font-weight:bold;backdrop-filter:blur(6px)}
.source-tag{left:5px;background:rgba(0,0,0,.64);color:#fff}
.package-tag{right:5px;background:rgba(212,180,115,.92);color:#171208}
.type-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:bold;margin-right:4px}
.type-tag.full{background:rgba(250,173,20,0.15);color:var(--primary)}
.type-tag.boss{background:rgba(245,34,45,0.15);color:var(--red)}
.section-label{padding:12px 16px 4px;font-size:11px;color:var(--sub);font-weight:bold}
.status-card{margin:10px 16px 0;padding:11px 12px;border-radius:12px;background:linear-gradient(135deg,rgba(212,180,115,.14),rgba(255,255,255,.025));border:1px solid rgba(212,180,115,.2)}
.status-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.status-title{font-size:12px;font-weight:bold}.status-pill{font-size:9px;padding:2px 7px;border-radius:9px;background:rgba(255,255,255,.08);color:var(--sub)}.status-pill.active{background:rgba(82,196,26,.14);color:var(--green)}.status-pill.expired{background:rgba(245,34,45,.14);color:#ff7875}
.status-desc{font-size:9px;color:var(--sub);line-height:1.55;margin:5px 0 8px}
.package-status-line{margin:5px 16px 0;padding:8px 10px;border-radius:9px;border:1px solid rgba(212,180,115,.22);background:rgba(212,180,115,.08);color:#d8c89d;font-size:10px;line-height:1.5}
.acquired-label{display:inline-block;margin-bottom:5px;padding:2px 6px;border-radius:7px;background:rgba(255,255,255,.07);color:var(--sub);font-size:9px}
.entitlement-list{display:grid;gap:8px;margin:12px 0}
.entitlement-card{padding:11px;border-radius:11px;border:1px solid var(--border);background:var(--card);cursor:pointer}
.entitlement-card.primary{border-color:rgba(212,180,115,.42);background:linear-gradient(135deg,rgba(212,180,115,.12),rgba(255,255,255,.025))}
.entitlement-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:bold}.entitlement-title em{font-style:normal;color:var(--primary)}
.entitlement-desc{font-size:9px;color:var(--sub);line-height:1.55;margin-top:5px}
.detail-actions{display:flex;gap:8px}.detail-actions button{flex:1;padding:10px 8px;border-radius:14px;font-size:12px;font-weight:bold;border:none;cursor:pointer}.detail-actions .primary{background:var(--primary);color:#171208}.detail-actions .secondary{background:rgba(255,255,255,.08);color:#fff}
.experience-choice{display:grid;gap:6px;margin-top:4px}.experience-choice button{padding:9px 10px;text-align:left;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:11px;cursor:pointer}.experience-choice button strong{display:block;font-size:11px;margin-bottom:2px}.experience-choice button span{font-size:9px;color:var(--sub)}
/* 详情页 */
.detail{position:absolute;inset:0;background:var(--bg);z-index:350;display:none;flex-direction:column}
.detail.show{display:flex}
.detail-scroll{flex:1;overflow-y:auto}
.d-media{width:100%;height:180px;overflow-x:auto;display:flex;scroll-snap-type:x mandatory;flex-shrink:0}
.d-media img{min-width:100%;height:100%;object-fit:cover;scroll-snap-align:center;flex-shrink:0}
.landscape .detail-scroll{display:flex;flex-direction:row}
.landscape .d-media{width:50%;height:100%;flex-shrink:0;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.landscape .d-media img{min-width:100%;min-height:100%;width:100%}
.landscape .d-info{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.d-info{padding:16px}
.d-title{font-size:16px;font-weight:bold;margin-bottom:8px}
.d-desc{font-size:13px;color:#ccc;line-height:1.6;margin-bottom:12px}
.d-meta{background:var(--card);border-radius:8px;padding:10px;margin-bottom:12px}
.dm-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.dm-row .l{color:var(--sub)}
.d-footer{padding:10px 16px 20px;border-top:1px solid var(--border);flex-shrink:0}
.d-footer .tip{font-size:10px;color:var(--sub);text-align:center;margin-bottom:6px}
.d-buy{width:100%;padding:12px;border-radius:18px;background:var(--primary);color:#000;text-align:center;font-size:14px;font-weight:bold;cursor:pointer;border:none}
.d-buy.bought{background:rgba(82,196,26,0.15);color:var(--green)}
/* 寄售页 */
.consign{position:absolute;inset:0;background:var(--bg);z-index:360;display:none;flex-direction:column}
.consign.show{display:flex}
.consign-body{flex:1;overflow-y:auto;padding:16px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:500}
.fg input,.fg textarea,.fg select{width:100%;padding:9px 11px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:13px;outline:none}
.fg textarea{height:70px;resize:vertical}
.fg input:focus,.fg textarea:focus{border-color:var(--primary)}
.radio-list label{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border-radius:8px;margin-bottom:5px;border:1px solid var(--border);cursor:pointer;font-size:12px}
.radio-list input{accent-color:var(--primary)}
.submit-btn{width:100%;padding:13px;border-radius:18px;background:var(--primary);color:#000;font-size:14px;font-weight:bold;border:none;cursor:pointer;margin-top:8px}
/* 游戏中 */
.ingame{position:absolute;inset:0;background:#111;z-index:300;display:none;flex-direction:row}
.ingame.show{display:flex}
.ig-bg{flex:1;background:radial-gradient(circle at 68% 32%,rgba(220,181,92,.24),transparent 26%),linear-gradient(135deg,#26314a 0%,#151821 42%,#090b10 100%);position:relative}
.ig-bg::after{content:'游戏画面';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.2);font-size:12px}
.ig-bar{width:42px;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:10px}
.ig-icon{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.ig-icon.active{background:var(--primary);color:#000}
.ig-panel{position:absolute;top:0;right:42px;width:280px;height:100%;background:rgba(11,13,18,0.97);border-left:1px solid var(--border);display:none;flex-direction:column;z-index:5}
.ig-panel.show{display:flex}
.ig-head{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ig-head h4{font-size:13px}
.ig-tabs{display:flex;gap:8px;padding:6px 12px;border-bottom:1px solid var(--border)}
.ig-tab{font-size:10px;color:var(--sub);cursor:pointer;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,0.05)}
.ig-tab.active{background:#fff;color:#000;font-weight:bold}
.ig-body{flex:1;overflow-y:auto}
/* 弹窗 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,0.7);z-index:400;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#1e1e24;width:80%;max-width:300px;border-radius:14px;padding:18px;position:relative}
.modal-box h3{font-size:14px;margin-bottom:8px;padding-right:24px}
.modal-box p{font-size:11px;color:var(--sub);line-height:1.6;white-space:pre-line;margin-bottom:14px}
.modal-close{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--sub);font-size:16px}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer;border:none}
.mbtn-cancel{background:rgba(255,255,255,0.1);color:#fff}
.mbtn-confirm{background:var(--primary);color:#000}
.checkout-layer,.payment-layer{position:absolute;inset:0;z-index:420;display:none;background:rgba(0,0,0,.72);align-items:flex-end}
.checkout-layer.show,.payment-layer.show{display:flex}
.checkout-sheet{width:100%;max-height:92%;overflow-y:auto;background:#17181e;border-radius:22px 22px 0 0;padding:18px 16px 20px}
.checkout-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.checkout-head h3{font-size:16px}.checkout-head p{margin-top:4px;color:var(--sub);font-size:10px}
.checkout-head button{width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:var(--sub);font-size:18px;cursor:pointer}
.checkout-save{display:flex;gap:10px;padding:12px;margin-top:12px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.checkout-save img{width:72px;height:48px;border-radius:8px;object-fit:cover}
.checkout-save div{display:flex;min-width:0;flex-direction:column;justify-content:center}.checkout-save strong{overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.checkout-save span{margin-top:5px;color:var(--sub);font-size:10px}
.checkout-section{margin-top:16px}.checkout-section h4{font-size:12px;margin-bottom:8px}
.checkout-options{display:grid;gap:8px}
.checkout-option{padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:#fff;text-align:left;cursor:pointer}
.checkout-option.selected{border-color:var(--primary);background:rgba(212,180,115,.11)}
.checkout-option strong{display:flex;justify-content:space-between;font-size:12px}.checkout-option strong em{color:var(--primary);font-style:normal}.checkout-option span{display:block;margin-top:5px;color:var(--sub);font-size:10px;line-height:1.5}
.payment-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.payment-method{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:#fff;cursor:pointer}
.payment-method.selected{border-color:var(--primary);background:rgba(212,180,115,.11)}
.checkout-summary{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11px}
.checkout-summary>div:first-child{color:var(--sub)}.checkout-summary small{display:block;margin-top:5px;color:var(--sub);font-size:9px;line-height:1.5}
.checkout-total{display:flex;justify-content:space-between;align-items:end;margin-top:8px}.checkout-total strong{color:var(--primary);font-size:20px}
.checkout-confirm{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--primary);color:#171208;font-weight:bold;cursor:pointer}
.payment-layer{z-index:430;align-items:center;justify-content:center}
.payment-dialog{width:82%;max-width:320px;margin:auto;background:#1e1e24;border-radius:16px;padding:18px;text-align:center}
.payment-dialog .channel{font-size:14px;font-weight:bold}.payment-dialog .amount{font-size:26px;color:var(--primary);margin:14px 0}.payment-dialog p{color:var(--sub);font-size:11px}
.payment-actions{display:flex;gap:8px;margin-top:16px}.payment-actions button{flex:1;padding:10px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}.payment-actions button:last-child{background:var(--primary);color:#171208;font-weight:bold}
.landscape .checkout-layer{align-items:stretch;justify-content:flex-end}.landscape .checkout-sheet{width:390px;max-height:100%;border-radius:20px 0 0 20px}
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:7px 16px;border-radius:12px;font-size:12px;font-weight:bold;opacity:0;transition:0.3s;z-index:500;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="ctrl-btns">
<button class="ctrl-btn" onclick="toggleOrient()">🔄 横竖屏</button>
<button class="ctrl-btn" onclick="enterIngame()">🎮 游戏中模式</button>
</div>
<div id="app" class="portrait">
<div class="top-bar"><span class="back" onclick="showToast('返回')">‹</span><span class="title">GTA V</span><span class="guide" onclick="openExperiencePicker()">套餐体验</span><span class="guide" onclick="showGuide()">❓说明</span></div>
<div class="tabs">
<div class="tab" onclick="showToast('详情')">详情</div>
<div class="tab" onclick="showToast('社区')">社区</div>
<div class="tab active">存档</div>
</div>
<div class="sub-tabs">
<div class="stab active" onclick="switchSub('plaza',this)">存档广场</div>
<div class="stab" onclick="switchSub('mine',this)">我的存档</div>
</div>
<div class="scroll">
<div id="sec-plaza" class="save-grid"></div>
<div id="sec-mine" style="display:none"></div>
</div>
<!-- 详情页 -->
<div class="detail" id="detailPage">
<div class="top-bar"><span class="back" onclick="closeDetail()">‹</span><span class="title">存档详情</span></div>
<div class="detail-scroll" id="detailScroll">
<div class="d-media" id="dMedia"></div>
<div class="d-info" id="dInfo"></div>
</div>
<div class="d-footer"><div class="tip">存档为虚拟商品，购买后不支持退款</div><button class="d-buy" id="dBuy"></button></div>
</div>
<!-- 寄售页 -->
<div class="consign" id="consignPage">
<div class="top-bar"><span class="back" onclick="closeConsign()">‹</span><span class="title">寄售存档</span></div>
<div class="consign-body">
<div class="fg"><label>* 选择存档</label><div class="radio-list" id="consignFiles"></div></div>
<div class="fg"><label>关联游戏</label><div style="padding:9px 11px;background:var(--card);border-radius:8px;border:1px solid var(--border);font-size:13px">GTA V（当前游戏）</div></div>
<div class="fg"><label>* 标题</label><input id="cTitle" placeholder="如：全BOSS击杀存档"></div>
<div class="fg"><label>* 内容描述</label><textarea id="cDesc" placeholder="描述存档内容..."></textarea></div>
<div class="fg"><label>上传图片（首张作封面）</label><div style="display:flex;gap:8px"><div style="width:60px;height:60px;border-radius:8px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--sub)" onclick="showToast('选择图片')">+</div></div></div>
<div class="fg"><label>价格</label><div style="padding:9px 11px;background:var(--card);border-radius:8px;border:1px solid var(--border);color:var(--primary);font-weight:bold">¥6.00（固定价格）</div><div style="font-size:10px;color:var(--sub);margin-top:4px">每成交1次，赠送30分钟云游时长</div></div>
<button class="submit-btn" onclick="submitConsign()">确认寄售</button>
</div>
</div>
<!-- 游戏中 -->
<div class="ingame" id="ingame">
<div class="ig-bg"></div>
<div class="ig-panel" id="igPanel">
<div class="ig-head"><h4>存档管理</h4><span style="font-size:10px;color:var(--sub);cursor:pointer;padding:2px 6px;border:1px solid var(--border);border-radius:6px" onclick="showGuide()">❓说明</span></div>
<div class="ig-tabs"><div class="ig-tab active" onclick="switchIg('market',this)">存档广场</div><div class="ig-tab" onclick="switchIg('my',this)">我的存档</div></div>
<div class="ig-body" id="igBody"></div>
</div>
<div class="ig-bar">
<div class="ig-icon" onclick="exitIngame()">‹</div>
<div class="ig-icon" onclick="showToast('键盘')">⌨</div>
<div class="ig-icon" onclick="showToast('手柄')">🎮</div>
<div class="ig-icon active" onclick="toggleIgPanel()">💾</div>
<div class="ig-icon" onclick="showToast('设置')">⚙</div>
</div>
</div>
<!-- 弹窗 -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-box"><span class="modal-close" id="mClose" onclick="closeModal()">×</span><h3 id="mTitle"></h3><p id="mDesc"></p><div class="modal-btns" id="mBtns"><button class="mbtn-cancel" onclick="closeModal()">取消</button><button class="mbtn-confirm" onclick="modalConfirm()">确认</button></div></div>
</div>
<div class="checkout-layer" id="checkoutLayer"></div>
<div class="payment-layer" id="paymentLayer"></div>
<div class="toast" id="toast"></div>
</div>
<script>
function makeCover(kicker,title,colorA,colorB){
var safeKicker=String(kicker).replace(/[<>&"]/g,'');
var safeTitle=String(title).replace(/[<>&"]/g,'');
var svg='<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">'
+'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+colorA+'"/><stop offset="1" stop-color="'+colorB+'"/></linearGradient><radialGradient id="r" cx=".75" cy=".18" r=".7"><stop stop-color="#ffffff" stop-opacity=".24"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>'
+'<rect width="640" height="360" fill="url(#g)"/><rect width="640" height="360" fill="url(#r)"/>'
+'<path d="M390 76h116l66 92-48 112H390l-44-104z" fill="#fff" opacity=".08"/><circle cx="492" cy="176" r="62" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="18"/>'
+'<text x="42" y="72" fill="#f5d783" font-family="Arial,sans-serif" font-size="24" font-weight="700">'+safeKicker+'</text>'
+'<text x="42" y="286" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">'+safeTitle+'</text>'
+'<text x="42" y="322" fill="#fff" fill-opacity=".62" font-family="Arial,sans-serif" font-size="16">GAME SAVE · CLOUD ARCHIVE</text></svg>';
return'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);

function applySaveWithRight(saveId){
var right=getSaveRight(saveId);
if(activeIdx===saveId){showToast('当前正在使用此存档');return;}
if(right==='none'){
if(monthlySaveIds.has(saveId))openExpiredIntercept(saveId);else openDetail(saveId);
return;
}
if(right==='package'){
var cycle=getActiveCycle(),firstUse=cycle&&cycle.successUsageCount===0;
showModal(firstUse?'首次使用将影响退款资格':'确认加载存档',(firstUse?'加载后将不再满足套餐退款条件，并会覆盖当前本地进度，是否继续？':'加载此存档将覆盖当前本地进度，是否继续？')+'\n仅在加载成功并启动游戏后计入使用记录。',firstUse?'package-use-first':'package-use');
}else{
showModal('确认加载存档','加载此存档将覆盖当前本地进度，是否继续？','permanent-use');
}
}
function calculateCreatorReward(cycleId,save){
if(save.source!=='player')return{rewardStatus:'none',rewardReason:'官方存档不占名额'};
var normalizedSaveId=getNormalizedSaveId(save);
if(!normalizedSaveId)return{rewardStatus:'none',rewardReason:'存档指纹缺失，转人工审核且不占名额'};
var duplicate=packageUsage.some(function(u){return u.cycleId===cycleId&&u.normalizedSaveId===normalizedSaveId&&u.success});
if(duplicate)return{rewardStatus:'none',rewardReason:'本周期重复存档不占名额'};
var cycle=packageCycles.find(function(c){return c.id===cycleId});
if(!cycle||cycle.rewardSlotsUsed>=monthlyProduct.rewardSlots)return{rewardStatus:'none',rewardReason:'本周期奖励名额已满'};
cycle.rewardSlotsUsed++;
return{rewardStatus:'pending',rewardReason:'T+1 待发放',rewardSlotIndex:cycle.rewardSlotsUsed,rewardMinutes:monthlyProduct.rewardMinutes,rewardValidDays:monthlyProduct.rewardValidDays};
}
function recordPackageUsage(cycleId,save){
var cycle=packageCycles.find(function(c){return c.id===cycleId});
if(!cycle)return null;
var reward=calculateCreatorReward(cycleId,save);
var usage={cycleId:cycleId,saveId:save.id,normalizedSaveId:getNormalizedSaveId(save),source:save.source,author:save.author,success:true,usedAt:new Date(),rewardStatus:reward.rewardStatus,rewardReason:reward.rewardReason,rewardSlotIndex:reward.rewardSlotIndex||0};
packageUsage.push(usage);cycle.successUsageCount++;monthlySaveIds.add(saves.indexOf(save));
return usage;
}
function completeSaveUse(saveId,usePackage){
var usage=null;
if(usePackage){
var cycle=getActiveCycle();
if(cycle)usage=recordPackageUsage(cycle.id,saves[saveId]);
}
activeIdx=saveId;refreshAll();
if(usage&&usage.rewardStatus==='pending')showToast('加载并启动成功 · 作者奖励占用 '+usage.rewardSlotIndex+'/3 名额');
else if(usage)showToast('加载并启动成功 · '+usage.rewardReason);
else showToast('存档已加载并启动游戏');
}
function confirmPackagePurchase(){
var active=getActiveCycle(),start=active&&pendingPackageMode==='renew'?new Date(active.endAt):new Date();
if(active&&pendingPackageMode==='renew'&&getFutureCycle()){showToast('最多提前续费 1 期');return;}
var cycle={id:'CYCLE-'+Date.now(),startAt:start,endAt:addDays(start,monthlyProduct.durationDays),status:start>Date.now()?'future':'active',successUsageCount:0,rewardSlotsUsed:0};
packageCycles.push(cycle);packageDemoState='active';closeModal();refreshAll();
if(document.getElementById('detailPage').classList.contains('show')&&currentDetailType==='system')openDetail(curIdx,'system');
showToast(pendingPackageMode==='renew'?'续费成功，未来周期已安排':'开通成功，套餐立即生效');
}

else if(right==='permanent')h+='<button style="width:100%;padding:8px;border-radius:10px;background:rgba(82,196,26,0.15);color:var(--green);font-size:12px;font-weight:bold;border:none;cursor:pointer" onclick="igUse('+idx+')">使用</button>';
else if(monthlySaveIds.has(idx))h+='<button style="width:100%;padding:8px;border-radius:10px;background:var(--primary);color:#171208;font-size:11px;font-weight:bold;border:none;cursor:pointer" onclick="openCheckout('+idx+',{preferredPlan:\'monthly\',source:\'ingame-expired\'})">续费后使用</button>';
else h+='<button style="width:100%;padding:8px;border-radius:10px;background:var(--primary);color:#171208;font-size:11px;font-weight:bold;border:none;cursor:pointer" onclick="openCheckout('+idx+',{preferredPlan:\'single\',source:\'ingame-detail\'})">购买</button>';
h+='</div>';
document.getElementById('igBody').innerHTML=h;
}
function igBuy(idx){openCheckout(idx,{preferredPlan:'single',source:'ingame-detail'})}
function igUse(idx){curIdx=idx;applySaveWithRight(idx)}

function igConsignDetail(ci){
var c=consignSaves[ci];
var cover=c.imgs&&c.imgs[0]||makeCover('PLAYER SAVE',c.title,'#5d3b32','#131827');
var stTag=c.status==='on'?'<span style="position:absolute;top:4px;right:4px;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:bold;color:#fff;background:rgba(82,196,26,0.85)">上架中</span>':'<span style="position:absolute;top:4px;right:4px;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:bold;color:#fff;background:rgba(245,34,45,0.85)">未上架</span>';
var h='<div style="padding:10px"><div style="cursor:pointer;color:var(--sub);font-size:11px;margin-bottom:8px" onclick="renderIgMine()">‹ 返回</div>';
h+='<div style="position:relative;margin-bottom:8px"><img src="'+cover+'" style="width:100%;height:80px;object-fit:cover;border-radius:6px">'+stTag+'</div>';
h+='<div style="font-size:13px;font-weight:bold;margin-bottom:6px">'+c.title+'</div>';
h+='<div style="font-size:11px;color:#ccc;line-height:1.5;margin-bottom:8px">'+(c.desc||'')+'</div>';
h+='<div style="font-size:10px;color:var(--sub);margin-bottom:10px">已售'+c.sold+'份 · 获'+c.sold*30+'分钟</div>';
if(c.status==='on'){
h+='<div style="display:flex;gap:6px"><button style="flex:1;padding:8px;border-radius:10px;background:rgba(255,255,255,0.08);color:#fff;font-size:12px;font-weight:bold;border:none;cursor:pointer" onclick="showToast(\'编辑功能\')">编辑</button><button style="flex:1;padding:8px;border-radius:10px;background:rgba(255,255,255,0.08);color:var(--sub);font-size:12px;font-weight:bold;border:none;cursor:pointer" onclick="toggleConsignStatus('+ci+')">下架</button></div>';
}else{
h+='<div style="display:flex;gap:6px"><button style="flex:1;padding:8px;border-radius:10px;background:rgba(255,255,255,0.08);color:#fff;font-size:12px;font-weight:bold;border:none;cursor:pointer" onclick="showToast(\'编辑功能\')">编辑</button><button style="flex:1;padding:8px;border-radius:10px;background:rgba(82,196,26,0.15);color:var(--green);font-size:12px;font-weight:bold;border:none;cursor:pointer" onclick="toggleConsignStatus('+ci+')">上架</button><button style="flex:1;padding:8px;border-radius:10px;background:rgba(245,34,45,0.15);color:var(--red);font-size:12px;font-weight:bold;border:none;cursor:pointer" onclick="confirmDelConsign('+ci+')">删除</button></div>';
}
h+='</div>';
document.getElementById('igBody').innerHTML=h;
}

window.CloudSaveDemo={
setDemoState:setDemoState,
openCheckout:openCheckout,
getCheckoutState:function(){return Object.assign({},checkoutState)}
};
refreshAll();
</script>
