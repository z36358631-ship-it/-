<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盖世游戏 APP 租号功能 Demo</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg-primary: #000000;
      --bg-card: #1a1a1a;
      --bg-elevated: #252525;
      --text-primary: #ffffff;
      --text-secondary: #e6e6e6;
      --text-muted: #9b9ca3;
      --brand-gold: #ffcc43;
      --brand-green: #33d8a4;
      --brand-blue: #338feb;
      --commerce-primary-start: #22a9ff;
      --commerce-primary-end: #4f63ff;
      --commerce-primary-text: #ffffff;
      --commerce-secondary-bg: #2a2d33;
      --commerce-secondary-border: rgb(255 255 255 / 12%);
      --commerce-panel-bg: #202226;
      --border-default: #353d4e;
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-number: "D-DIN-PRO", var(--font-primary);
      font-family: var(--font-primary);
      background: #07090d;
      color: var(--text-primary);
    }

    html, body { min-width: 320px; min-height: 100%; }
    body { margin: 0; background: radial-gradient(circle at 50% 8%, #202637 0, #0b0e14 38%, #050608 100%); }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible { outline: 2px solid var(--brand-gold); outline-offset: 2px; }

    #appRentalDemo {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .device {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 20px;
      background: var(--bg-primary);
      box-shadow: 0 30px 90px rgb(0 0 0 / 58%), 0 0 0 7px rgb(255 255 255 / 3%);
    }

    .device.portrait { width: 390px; height: 844px; }

    .device.portrait::before {
      position: absolute;
      z-index: -2;
      inset: 0;
      background:
        radial-gradient(circle at 76% 2%, rgb(75 47 105 / 56%), transparent 32%),
        radial-gradient(circle at 15% 30%, rgb(31 76 105 / 38%), transparent 31%),
        linear-gradient(165deg, #10131d 0, #090a0e 44%, #020203 100%);
      content: "";
    }

    .device.portrait.theme-home::before {
      background:
        radial-gradient(circle at 14% 0, rgb(121 72 31 / 54%), transparent 38%),
        radial-gradient(circle at 90% 45%, rgb(63 72 35 / 42%), transparent 35%),
        linear-gradient(164deg, #1d1611 0, #0a0a09 54%, #020202 100%);
    }

    .device.portrait.theme-library::before {
      background:
        radial-gradient(circle at 36% 0, rgb(53 65 117 / 60%), transparent 38%),
        linear-gradient(174deg, #141828 0, #090a0f 52%, #030303 100%);
    }

    .device.portrait.theme-profile::before {
      background:
        radial-gradient(circle at 18% 5%, rgb(4 84 110 / 62%), transparent 39%),
        radial-gradient(circle at 83% 70%, rgb(57 24 69 / 34%), transparent 36%),
        linear-gradient(178deg, #06131a 0, #07070a 50%, #020203 100%);
    }

    .mobile-status {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      display: flex;
      width: 100%;
      height: 34px;
      align-items: center;
      justify-content: space-between;
      padding: 4px 17px 0;
      color: rgb(255 255 255 / 94%);
      font-family: var(--font-number);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .status-left, .status-right { display: flex; align-items: center; gap: 7px; }
    .status-rate { color: rgb(255 255 255 / 76%); font-size: 10px; font-style: italic; }
    .status-icon { display: inline-flex; width: 15px; height: 15px; align-items: center; justify-content: center; }
    .status-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .battery { display: inline-flex; height: 14px; min-width: 27px; align-items: center; justify-content: center; border: 1px solid rgb(255 255 255 / 74%); border-radius: 4px; font-size: 8px; }

    .portrait-content {
      position: absolute;
      inset: 34px 0 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 10px 16px 104px;
      scrollbar-width: none;
    }

    .portrait-content::-webkit-scrollbar { display: none; }

    .device.portrait.has-expiry-reminder .portrait-content { padding-top: 100px; }
    .device.portrait.has-ingame-expiry .portrait-content { padding-top: 150px; }

    .portrait-nav {
      position: absolute;
      z-index: 10;
      right: 8px;
      bottom: 8px;
      left: 8px;
      display: grid;
      height: 72px;
      grid-template-columns: repeat(5, 1fr);
      align-items: stretch;
      padding: 4px;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 24px;
      background: rgb(36 36 39 / 83%);
      box-shadow: 0 -10px 34px rgb(0 0 0 / 34%), inset 0 1px rgb(255 255 255 / 6%);
      backdrop-filter: blur(20px);
    }

    .portrait-nav button {
      display: flex;
      min-width: 0;
      min-height: 62px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 2px 3px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: #85868c;
      cursor: pointer;
      font-size: 10px;
      line-height: 14px;
      transition: background 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .portrait-nav button:active { transform: scale(.96); }
    .portrait-nav button.active { background: rgb(255 255 255 / 10%); color: #fff; }
    .portrait-nav button svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }

    .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .search-box {
      display: flex;
      height: 44px;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 100px;
      background: rgb(255 255 255 / 5%);
      color: rgb(255 255 255 / 47%);
      font-size: 14px;
      backdrop-filter: blur(12px);
    }

    .search-box svg { width: 21px; height: 21px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; }
    .device-link { display: grid; width: 44px; height: 44px; flex: 0 0 auto; place-items: center; border: 0; background: none; color: #fff; cursor: pointer; }
    .device-link svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .page-tabs {
      display: flex;
      align-items: flex-start;
      gap: 27px;
      overflow-x: auto;
      margin: 0 -2px 18px;
      padding: 0 2px 2px;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .page-tabs::-webkit-scrollbar { display: none; }
    .page-tabs button {
      position: relative;
      min-height: 38px;
      padding: 0 0 10px;
      border: 0;
      background: none;
      color: rgb(255 255 255 / 48%);
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
    }

    .page-tabs button.active { color: #fff; font-weight: 650; }
    .page-tabs button.active::after {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 18px;
      height: 3px;
      border-radius: 100px;
      background: #fff;
      content: "";
      transform: translateX(-50%);
    }

    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 1px 11px; }
    .section-head h2 { margin: 0; font-size: 18px; font-weight: 650; line-height: 26px; }
    .section-head span { color: var(--text-muted); font-size: 11px; }

    .hero-card {
      position: relative;
      width: 100%;
      min-height: 224px;
      overflow: hidden;
      padding: 18px;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 20px;
      background:
        linear-gradient(180deg, transparent 8%, rgb(3 5 9 / 7%) 38%, rgb(3 4 7 / 96%) 100%),
        radial-gradient(circle at 66% 28%, rgb(238 184 85 / 42%), transparent 23%),
        linear-gradient(135deg, #40301e 0, #1e2534 50%, #0b0c10 100%);
      box-shadow: 0 12px 32px rgb(0 0 0 / 24%);
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .real-media { position: relative; display: block; overflow: hidden; background: #11141a; }
    .real-media > img { position: absolute; max-width: none; object-fit: cover; pointer-events: none; user-select: none; }
    .hero-real { position: absolute; z-index: 0; inset: 0; }
    .hero-real::after { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(5 7 10 / 35%) 0, rgb(5 7 10 / 8%) 35%, rgb(3 4 7 / 22%) 52%, rgb(3 4 7 / 98%) 100%), linear-gradient(90deg, rgb(3 4 7 / 44%), transparent 56%); content: ""; }
    .hero-card::after { content: none; }
    .hero-topline { position: absolute; z-index: 2; top: 15px; right: 16px; left: 16px; display: flex; align-items: center; gap: 7px; }
    .hero-recommendation { color: #fff; font-size: 13px; font-weight: 720; text-shadow: 0 2px 8px rgb(0 0 0 / 72%); }
    .hero-date { padding: 3px 6px; border-radius: 5px; background: rgb(255 255 255 / 92%); color: #151515; font-family: var(--font-number); font-size: 11px; font-weight: 760; line-height: 15px; }
    .hero-bottomline { position: absolute; z-index: 2; right: 16px; bottom: 15px; left: 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .hero-game-copy { min-width: 0; flex: 1; }
    .hero-game-copy h1 { overflow: hidden; margin: 0 0 7px; font-size: 24px; font-weight: 720; line-height: 30px; text-overflow: ellipsis; text-shadow: 0 2px 9px rgb(0 0 0 / 76%); white-space: nowrap; }
    .hero-game-copy p { display: flex; min-width: 0; align-items: center; gap: 7px; margin: 0; font-size: 10px; line-height: 15px; white-space: nowrap; }
    .hero-game-copy p b { color: #ff9b43; font-family: var(--font-number); font-size: 12px; }
    .hero-game-copy p span { overflow: hidden; color: rgb(255 255 255 / 68%); text-overflow: ellipsis; }
    .hero-rental-offer { display: flex; flex: 0 0 auto; flex-direction: column; align-items: flex-end; padding-bottom: 1px; text-shadow: 0 2px 9px rgb(0 0 0 / 80%); }
    .hero-rental-price { color: #fff; font-family: var(--font-number); font-size: 19px; font-weight: 760; line-height: 23px; }
    .hero-rental-demand { margin-top: 3px; color: rgb(255 255 255 / 70%); font-size: 10px; line-height: 14px; }
    .rent-badge { padding: 4px 8px; border: 1px solid rgb(255 215 115 / 25%); border-radius: 100px; background: rgb(255 204 67 / 14%); color: #ffda78; font-size: 10px; }
    .primary-action {
      min-width: 112px;
      min-height: 44px;
      padding: 0 15px;
      border: 0;
      border-radius: 100px;
      background: linear-gradient(135deg, var(--commerce-primary-start), var(--commerce-primary-end));
      box-shadow: 0 8px 22px rgb(45 126 255 / 24%);
      color: var(--commerce-primary-text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .mini-game-row { display: grid; grid-auto-columns: 84px; grid-auto-flow: column; gap: 11px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .mini-game-row::-webkit-scrollbar { display: none; }
    .mini-game { min-width: 0; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; text-align: left; }
    .mini-game .cover-art { width: 84px; height: 84px; }
    .mini-game strong { display: block; overflow: hidden; margin-top: 7px; font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .mini-game .discovery-display { margin-top: 4px; font-size: 9px; }
    .mini-game .mini-rental-offer { display: block; margin-top: 4px; color: #fff; font-family: var(--font-number); font-size: 10px; font-weight: 720; line-height: 14px; }
    .mini-game .mini-rental-demand { display: block; margin-top: 1px; color: var(--text-muted); font-size: 8px; line-height: 12px; }

    .cover-art {
      position: relative;
      display: block;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(140deg, #303b5d, #121721);
    }

    .cover-art::after { position: absolute; inset: 0; background: linear-gradient(155deg, rgb(255 255 255 / 16%), transparent 42%, rgb(0 0 0 / 44%)); content: ""; }
    .cover-art svg { position: absolute; inset: 0; width: 100%; height: 100%; color: rgb(255 255 255 / 55%); fill: none; stroke: currentColor; stroke-width: 1.15; }
    .cover-art small { position: absolute; z-index: 2; right: 7px; bottom: 6px; left: 7px; color: rgb(255 255 255 / 89%); font-size: 8px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 1px 5px #000; }
    .cover-art--ember { background: linear-gradient(140deg, #8a3527, #251410 55%, #0c0908); }
    .cover-art--forest { background: linear-gradient(145deg, #315f5a, #142c31 52%, #080e12); }
    .cover-art--violet { background: linear-gradient(145deg, #7056a1, #34254e 54%, #11101d); }
    .cover-art--gold { background: linear-gradient(145deg, #a68035, #47371a 55%, #17120b); }
    .cover-art--blue { background: linear-gradient(145deg, #3f78a3, #1e3a55 52%, #0b111a); }
    .cover-art--red { background: linear-gradient(145deg, #a73e46, #4b1b25 52%, #160a0d); }

    .account-card {
      display: flex;
      min-height: 74px;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
      padding: 13px 16px;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 18px;
      background: rgb(255 255 255 / 5%);
      backdrop-filter: blur(14px);
    }

    .avatar-small, .profile-avatar {
      display: grid;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 50%;
      background: linear-gradient(145deg, #526071, #272c36);
      color: rgb(255 255 255 / 72%);
    }

    .avatar-small { width: 46px; height: 46px; flex: 0 0 auto; }
    .avatar-small svg, .profile-avatar svg { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .account-card strong { font-size: 15px; }
    .account-card p { margin: 4px 0 0; color: var(--text-muted); font-size: 11px; }

    .feature-scroll { display: grid; grid-auto-columns: 75%; grid-auto-flow: column; gap: 12px; overflow-x: auto; scrollbar-width: none; }
    .feature-scroll::-webkit-scrollbar { display: none; }
    .feature-card { overflow: hidden; border: 1px solid rgb(255 255 255 / 10%); border-radius: 18px; background: rgb(20 20 23 / 76%); }
    .feature-card .cover-art { width: 100%; height: 112px; border-radius: 17px 17px 10px 10px; }
    .feature-info { display: flex; min-height: 57px; align-items: center; gap: 8px; padding: 9px 11px; }
    .feature-info strong { overflow: hidden; flex: 1; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .small-pill { min-height: 36px; padding: 0 14px; border: 1px solid rgb(255 255 255 / 12%); border-radius: 100px; background: rgb(255 255 255 / 7%); cursor: pointer; font-size: 11px; }

    .game-list { display: grid; gap: 12px; }
    .game-list-item { display: grid; min-height: 76px; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 11px; }
    .game-list-item .cover-art { width: 64px; height: 64px; }
    .game-list-copy { min-width: 0; }
    .game-list-copy strong { display: block; overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .game-list-copy p { overflow: hidden; margin: 5px 0 3px; color: var(--text-muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .rating { color: #ff9c42; font-family: var(--font-number); font-size: 12px; font-weight: 650; }

    .library-tools { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 9px; margin-bottom: 17px; }
    .filter-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: rgb(255 255 255 / 6%); cursor: pointer; }
    .filter-button svg { width: 20px; height: 20px; fill: none; stroke: #a1a2aa; stroke-linecap: round; stroke-width: 1.7; }
    .library-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
    .library-card { min-width: 0; overflow: hidden; padding: 0 0 10px; border: 1px solid rgb(255 255 255 / 7%); border-radius: 17px; background: rgb(16 16 18 / 78%); }
    .library-card .cover-art { width: 100%; height: 109px; border-radius: 16px 16px 10px 10px; }
    .library-card strong { display: block; overflow: hidden; margin: 9px 10px 3px; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .library-card span { margin: 0 10px; color: #8c8d94; font-size: 9px; }

    .profile-tools { display: flex; justify-content: flex-end; gap: 5px; margin-bottom: 21px; }
    .icon-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
    .icon-button svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .profile-identity { display: flex; flex-direction: column; align-items: center; margin-bottom: 23px; text-align: center; }
    .profile-avatar { width: 76px; height: 76px; margin-bottom: 12px; background: linear-gradient(145deg, #76524a, #342a3d); }
    .profile-avatar.real-avatar { display: block; }
    .profile-name-row { display: flex; align-items: center; gap: 8px; }
    .profile-name-row h1 { margin: 0; font-size: 19px; font-weight: 650; }
    .member-chip { padding: 5px 9px; border: 1px solid rgb(255 218 123 / 22%); border-radius: 100px; background: rgb(255 204 67 / 13%); color: #ffda79; font-size: 10px; }
    .profile-uid { margin: 7px 0 0; color: var(--text-muted); font-family: var(--font-number); font-size: 11px; }

    .profile-card {
      width: 100%;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid rgb(255 255 255 / 11%);
      border-radius: 19px;
      background: linear-gradient(145deg, rgb(35 49 57 / 90%), rgb(20 20 27 / 88%));
      backdrop-filter: blur(16px);
    }

    .platform-card { margin-bottom: 14px; padding: 14px 16px; border: 1px solid rgb(255 255 255 / 9%); border-radius: 18px; background: rgb(28 34 40 / 74%); }
    .platform-head { display: flex; align-items: center; justify-content: space-between; }
    .platform-head strong { font-size: 14px; }
    .platform-head span { padding: 3px 7px; border-radius: 100px; background: rgb(51 216 164 / 10%); color: var(--brand-green); font-size: 9px; }
    .platform-stats { display: grid; grid-template-columns: repeat(2, 1fr); margin-top: 13px; }
    .platform-stats div { color: #fff; font-family: var(--font-number); font-size: 17px; font-weight: 650; text-align: center; }
    .platform-stats div + div { border-left: 1px solid rgb(255 255 255 / 10%); }
    .platform-stats small { display: block; margin-top: 3px; color: var(--text-muted); font-family: var(--font-primary); font-size: 9px; font-weight: 400; }
    .profile-promo { width: 100%; height: 60px; margin-bottom: 14px; border: 1px solid rgb(255 255 255 / 11%); border-radius: 16px; }

    .member-banner { display: flex; min-height: 92px; align-items: center; gap: 12px; padding: 16px; }
    .member-emblem { display: grid; width: 50px; height: 50px; flex: 0 0 auto; place-items: center; border-radius: 16px; background: linear-gradient(145deg, #ffe29c, #a97224); color: #2b210e; }
    .member-emblem svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .member-copy { min-width: 0; flex: 1; }
    .member-copy strong { display: block; font-size: 15px; }
    .member-copy p { margin: 5px 0 0; color: var(--text-muted); font-size: 10px; }
    .member-action-label { min-width: 58px; padding: 7px 9px; border: 1px solid rgb(255 218 123 / 24%); border-radius: 100px; color: #ffda79; font-size: 9px; text-align: center; }
    .chevron { width: 18px; height: 18px; fill: none; stroke: #bbbcc2; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }

    .profile-menu { display: grid; gap: 1px; margin-bottom: 15px; overflow: hidden; border: 1px solid rgb(255 255 255 / 9%); border-radius: 18px; background: rgb(24 24 29 / 82%); }
    .profile-menu button { display: grid; min-height: 58px; grid-template-columns: 38px minmax(0, 1fr) 18px; align-items: center; gap: 10px; padding: 0 15px; border: 0; border-bottom: 1px solid rgb(255 255 255 / 7%); background: transparent; cursor: pointer; text-align: left; }
    .profile-menu button:last-child { border-bottom: 0; }
    .menu-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: rgb(255 255 255 / 6%); color: #d5d6da; }
    .menu-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .menu-copy strong { display: block; font-size: 13px; font-weight: 550; }
    .menu-copy small { display: block; margin-top: 3px; color: var(--text-muted); font-size: 9px; }

    .ranking-head { display: flex; align-items: end; justify-content: space-between; margin: 4px 0 19px; }
    .ranking-head h1 { margin: 0; font-size: 28px; }
    .ranking-head p { margin: 0 0 3px; color: var(--text-muted); font-size: 10px; }
    .ranking-list { display: grid; gap: 10px; }
    .ranking-row { display: grid; min-height: 78px; grid-template-columns: 30px 58px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid rgb(255 255 255 / 7%); border-radius: 16px; background: rgb(255 255 255 / 4%); }
    .rank-number { color: var(--brand-gold); font-family: var(--font-number); font-size: 20px; font-style: italic; font-weight: 700; }
    .ranking-row .cover-art { width: 58px; height: 58px; }
    .ranking-row strong { display: block; font-size: 13px; }
    .ranking-row small { color: var(--text-muted); font-size: 9px; }

    .subpage-head { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .back-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: rgb(255 255 255 / 6%); cursor: pointer; }
    .back-button svg { width: 21px; height: 21px; fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .subpage-head h1 { margin: 0; font-size: 21px; }

      return source
        .filter((sku) => sku.enabled && sku.inStock && sku.region === (context.region || 'CN'))
        .filter((sku) => !sku.platform || sku.platform === (context.platform || 'Steam'))
        .filter((sku) => !sku.editionId || sku.editionId === (context.editionId || 'standard'))
        .filter((sku) => !sku.firstOnly || context.firstRentalEligible)
        .filter((sku) => Number.isFinite(Number(sku.price)))
        .sort((left, right) => left.price - right.price)[0] || null;
    }

    function lowestEligiblePurchaseSku(game, context = {}) {
      if (typeof game === 'string') game = getGameContext(game);
      if (!game) return null;
      const source = game.purchaseSkus || [];
      return source
        .filter((sku) => sku.enabled && sku.inStock && sku.region === (context.region || 'CN'))
        .filter((sku) => sku.platform === (context.platform || 'Steam'))
        .filter((sku) => sku.editionId === (context.editionId || 'standard'))
        .sort((left, right) => left.price - right.price)[0] || null;
    }

    function resolvePricePresentation(game, { compact = false } = {}) {
      const entitlement = resolveCurrentAction().primary;
      const entitlementLabels = {
        launch: '启动游戏', download: '下载游戏', continue: '已租号',
        'member-play': '会员畅玩', permanent: '单游戏永久畅玩',
      };
      if (entitlementLabels[entitlement]) return { label: entitlementLabels[entitlement], kind: 'entitlement' };
      const context = {
        region: 'CN', platform: state.selectedPlatform, editionId: state.selectedEditionId,
        firstRentalEligible: Boolean(SCENARIOS[state.scenario]?.trialEligible),
      };
      const rental = lowestEligibleRentalSku(game, context);
      const purchase = lowestEligiblePurchaseSku(game, context);
      if (rental && purchase && compact) return { label: '租/购可选', kind: 'mixed' };
      if (rental && purchase) return { label: `租 2小时 ¥${rental.price}起｜购 ¥${purchase.price}起`, kind: 'mixed' };
      if (rental) return { label: `${rental.firstOnly ? '首次租' : '租 2小时'} ¥${rental.price}${rental.firstOnly ? '' : '起'}`, kind: 'rental' };
      if (purchase) return { label: `购 ¥${purchase.price}起`, kind: 'purchase' };
      return { label: '', kind: 'none' };
    }

    function normalizeGameUserContext(gameId, input = {}) {
      const activeRental = input.activeOrderStatus === 'active'
        && Number(input.expireAt) > Date.now()
        && !input.refundActive;
      const playable = Boolean(
        input.owned || input.installed || input.imported || input.permanent
        || (input.membershipActive && input.memberLibrary),
      );
      const playableReason = input.owned ? 'owned'
        : input.installed ? 'installed'
          : input.imported ? 'imported'
            : input.permanent ? 'permanent'
              : input.membershipActive && input.memberLibrary ? 'membership' : null;
      return {
        gameId,
        ...input,
        activeRental,
        playable,
        playableReason,
      };
    }

    function getDiscoveryUserContext(gameId) {
      const context = normalizeGameUserContext(gameId, state.discoveryContexts[gameId] || {});
      return {
        ...context,
        firstRentalEligible: Boolean(state.platformTrialEligibility.eligible && context.firstRentalEligible),
      };
    }

    function resolveGameDisplayModel(gameId, userContext = {}) {
      if (userContext.activeRental) {
        return {
          displayType: DISCOVERY_DISPLAY_TYPES.RENTED,
          displayText: '已租号',
          rawAmount: null,
          formattedAmount: null,
          reason: 'active-rental',
        };
      }
      if (userContext.playable) {
        return {
          displayType: DISCOVERY_DISPLAY_TYPES.PLAYABLE,
          displayText: '可畅玩',
          rawAmount: null,
          formattedAmount: null,
          reason: userContext.playableReason,
        };
      }
      const rental = lowestEligibleRentalSku(getGameContext(gameId), userContext);
      if (!rental || !userContext.priceResolved || !userContext.inventoryResolved || !userContext.eligibilityResolved) {
        return {
          displayType: DISCOVERY_DISPLAY_TYPES.NONE,
          displayText: '',
          rawAmount: null,
          formattedAmount: null,
          reason: 'unresolved-or-unavailable',
        };
      }
      const formattedAmount = Number(rental.price).toFixed(1);
      return {
        displayType: DISCOVERY_DISPLAY_TYPES.RENTAL_PRICE,
        displayText: `¥${formattedAmount} · 租号`,
        rawAmount: rental.price,
        formattedAmount,
        reason: rental.firstOnly ? 'eligible-first-rental-price' : 'eligible-rental-price',
      };
    }

    function getDiscoveryDisplay(gameId) {
      return resolveGameDisplayModel(gameId, getDiscoveryUserContext(gameId));
    }

    function renderDiscoveryDisplay(gameId, className = '') {
      const model = getDiscoveryDisplay(gameId);
      if (model.displayType === DISCOVERY_DISPLAY_TYPES.NONE) return '';
      const classes = ['discovery-display', className].filter(Boolean).join(' ');
      return `<span class="${classes}" data-discovery-display="${model.displayType}">${model.displayText}</span>`;
    }

    function renderHomeRentalPrice(gameId) {
      const model = getDiscoveryDisplay(gameId);
      if (model.displayType !== DISCOVERY_DISPLAY_TYPES.RENTAL_PRICE) return renderDiscoveryDisplay(gameId);
      const suffix = model.reason === 'eligible-first-rental-price' ? '首租' : '租号';
      return `<strong class="hero-rental-price" data-discovery-display="${model.displayType}">¥${model.formattedAmount}${suffix}</strong>`;
    }

    function setDiscoveryContext(gameId, patch = {}) {
      state.discoveryContexts[gameId] = {
        ...(state.discoveryContexts[gameId] || {}),
        ...patch,
      };
      renderApp();
      return getDiscoveryDisplay(gameId);
    }

    function getMembershipStatusModel() {
      return MEMBERSHIP_STATUS_MODELS[state.membershipStatus] || MEMBERSHIP_STATUS_MODELS.none;
    }

    function setMembershipStatus(value) {
      state.membershipStatus = MEMBERSHIP_STATUS_MODELS[value] ? value : 'none';
      renderApp();
      return state.membershipStatus;
    }

    function getDetailModel() {
      const action = resolveCurrentAction();
      const labels = {
        launch: '启动游戏',
        download: '下载游戏',
        continue: '登录游戏',
        'rent-2h': '2小时租用',
        'more-duration': '更多租期',
        trial: '首次体验',
        permanent: '单游戏永久畅玩',
        membership: '开通会员',
        'member-play': '会员畅玩',
      };
      const optionIds = [action.primary, ...action.secondary]
        .filter((id) => !['credential', 'renew', 'membership-status'].includes(id));
      return {
        action,
        options: optionIds.map((id) => ({ id, label: labels[id] })),
        labels,
      };
    }

    function getSelectedOffer() {
      const game = getSelectedGame();
      const context = getCheckoutEligibilityContext(game.id);
      if (getGameSaleMode(game.id) === GAME_SALE_MODES.TIME_RENTAL) {
        const quote = quoteRentalOffer(state.rentalPlan, state.selectedHours, state.selectedEditionId, context);
        return { sku: quote.id, packageName: quote.packageName, durationLabel: quote.durationLabel, amount: quote.price, originalAmount: quote.originalPrice, editionId: quote.editionId };
      }
      const configured = eligibleCheckoutSkus(game, context).find(({ id }) => id === state.selectedSku);
      if (configured) {
        return {
          sku: configured.id,
          packageName: configured.packageName || configured.label || '当前套餐',
          durationLabel: configured.durationLabel || configured.label || '当前权益',
          amount: Number(configured.price),
          originalAmount: Number(configured.originalPrice ?? configured.price),
          platform: context.platform,
          editionId: context.editionId,
        };
      }
      if (state.selectedSku === 'trial') return { sku: 'trial', packageName: '首次体验套餐', durationLabel: '2小时', amount: 1.99, originalAmount: 9.9 };
      if (state.selectedSku === 'permanent') return { sku: 'permanent', packageName: '单游戏畅玩权益', durationLabel: '长期有效', amount: 168, originalAmount: 168 };
      return { sku: state.selectedSku, packageName: '当前权益', durationLabel: '当前权益', amount: 0, originalAmount: 0 };
    }

    function selectRentalSku(sku) {
      state.selectedSku = sku;
      const hourly = /^hourly-(\d+)h$/.exec(sku);
      if (hourly) state.selectedHours = Number(hourly[1]);
      if (state.order?.status === 'pending') state.order = null;
      if (state.screen === 'checkout') ensureGameOrder();
      renderApp();
      return state.selectedSku;
    }

    function rebuildPendingOrder() {
      if (state.order?.status === 'pending') state.order = null;
      if (state.screen === 'checkout') ensureGameOrder();
    }

    function selectEdition(editionId) {
      if (editionId !== 'standard') return false;
      const edition = getGameEdition(getSelectedGame(), editionId, state.selectedPlatform);
      if (!edition || edition.id !== editionId || !edition.enabled || !edition.inStock) return false;
      state.selectedEditionId = edition.id;
      rebuildPendingOrder();
      renderApp();
      return true;
    }

    function selectRentalPlan(plan) {
      if (!['hourly', 'daily', 'weekly'].includes(plan)) return false;
      state.rentalPlan = plan;
      state.selectedSku = quoteRentalOffer(plan).id;
      rebuildPendingOrder();
      renderApp();
      return true;
    }

    function setRentalHours(value) {
      const normalized = typeof value === 'string' ? value.trim() : value;
      if (normalized === '' || normalized === null || normalized === undefined) return false;
      const parsed = Number(normalized);
      if (!Number.isInteger(parsed) || parsed < 2 || parsed > 23) return false;
      state.selectedHours = parsed;
      state.rentalPlan = 'hourly';
      state.selectedSku = quoteRentalOffer('hourly', state.selectedHours).id;
      rebuildPendingOrder();
      renderApp();
      return state.selectedHours;
    }

    function prepareCheckoutForSelectedGame() {
      const game = getSelectedGame();
      state.selectedEditionId = 'standard';
      if (getGameSaleMode(game.id) === GAME_SALE_MODES.TIME_RENTAL) {
        state.rentalPlan = 'hourly';
        state.selectedHours = 2;
      }
      const selected = defaultCheckoutSku(game, getCheckoutEligibilityContext(game.id));
      state.selectedSku = selected?.id || null;
      state.order = null;
      return selected;
    }

    function setRentalRiskDecision(value = {}) {
      state.rentalRiskDecision = {
        extraNoReasonRestricted: false,
        ruleVersion: '',
        ...value,
      };
      return { ...state.rentalRiskDecision };
    }

    function requestRentalCheckout(gameId = state.selectedGameId) {
      const game = getGameContext(gameId);
      if (!game) return { allowed: false, reason: 'game-not-found' };
      state.pendingRentalIntent = { gameId };
      state.pendingRiskSnapshot = null;
      const decision = state.rentalRiskDecision || {};
      if (decision.extraNoReasonRestricted) {
        state.riskReminderOpen = true;
        renderApp();
        return { allowed: false, reason: 'extra-no-reason-restricted' };
      }
      state.pendingRiskSnapshot = {
        extraNoReasonRestricted: false,
        extraNoReasonApplicable: true,
        ruleVersion: decision.ruleVersion || '',
        acceptedAt: null,
      };
      return continueRentalCheckout();
    }

    function continueRentalCheckout() {
      const gameId = state.pendingRentalIntent?.gameId || state.selectedGameId;
      if (!getGameContext(gameId)) return { allowed: false, reason: 'game-not-found' };
      setSelectedGame(gameId, { shouldRender: false });
      const selected = prepareCheckoutForSelectedGame();
      if (!selected || !ensureGameOrder()) {
        state.pendingRentalIntent = null;
        state.pendingRiskSnapshot = null;
        state.riskReminderOpen = false;
        showToast('当前暂无可用租号套餐');
        return { allowed: false, reason: 'sku-unavailable' };
      }
      state.pendingRentalIntent = null;
      state.riskReminderOpen = false;
      navigate('checkout');
      return { allowed: true, reason: 'checkout-opened', gameId };
    }

    function confirmRentalRisk() {
      state.pendingRiskSnapshot = {
        extraNoReasonRestricted: true,
        extraNoReasonApplicable: false,
        ruleVersion: state.rentalRiskDecision?.ruleVersion || '',
        acceptedAt: Date.now(),
      };
      state.riskReminderOpen = false;
      return continueRentalCheckout();
    }

    function closeRentalRisk() {
      state.riskReminderOpen = false;
      state.pendingRentalIntent = null;
      state.pendingRiskSnapshot = null;
      renderApp();
      return true;
    }

    function attemptRentalAccountLaunch(targetGameId, { launchRequestId = '' } = {}) {
      const requestId = launchRequestId || `LAUNCH-${targetGameId}-${Date.now()}`;
      const cached = state.launchRequestResults[requestId];
      if (cached) return { ...cached };
      const activeOrder = getOrderCollection().find((order) => order.status === 'active' && order.credentialAvailable);
      if (!activeOrder || activeOrder.gameId === targetGameId) {
        const result = { allowed: true, reason: 'owned-or-rented-game' };
        state.launchRequestResults[requestId] = result;
        return { ...result };
      }
      const game = getGameContext(targetGameId);
      const context = getCheckoutEligibilityContext(targetGameId);
      const hasExplicitRentalCatalog = DISCOVERY_GAME_CONTEXTS.some(({ id }) => id === targetGameId);
      const rentable = Boolean(game && hasExplicitRentalCatalog) && (getGameSaleMode(targetGameId) === GAME_SALE_MODES.TIME_RENTAL
        ? Boolean(lowestEligibleRentalSku(game, context))
        : eligibleCheckoutSkus(game, context).length > 0);
      state.nonTargetLaunchGuard = {
        currentGameId: activeOrder.gameId,
        currentGameName: activeOrder.gameName,
        targetGameId,
        targetGameName: game?.name || targetGameId,
        rentable,
        launchRequestId: requestId,
      };
      const result = { allowed: false, reason: 'non-rented-game', rentable };
      state.launchRequestResults[requestId] = result;
      renderApp();
      return { ...result };
    }

    function closeNonTargetLaunchGuard() {
      state.nonTargetLaunchGuard = null;
      renderApp();
      return true;
    }

    function viewTargetRental() {
      const gameId = state.nonTargetLaunchGuard?.targetGameId;
      state.nonTargetLaunchGuard = null;
      if (!gameId) return { allowed: false, reason: 'target-game-missing' };
      return requestRentalCheckout(gameId);
    }

    function createOrder({ sku, amount, priceVersion, ...snapshot }) {
      if (state.order && NON_TERMINAL_ORDER_STATUSES.has(state.order.status)) return null;
      const createdAt = Date.now();
      const game = getSelectedGame();
      const offer = getSelectedOffer();
      state.order = {
        orderType: 'rental',
        saleMode: getGameSaleMode(game.id),
        gameId: game.id,
        gameName: game.name,
        gameOriginalAmount: Number(GAME_ORIGINAL_AMOUNTS[game.id] || 0),
        currency: 'CNY',
        platform: state.selectedPlatform,
        editionId: 'standard',
        version: `${state.selectedPlatform} · 标准版`,
        packageName: offer.packageName,
        durationLabel: offer.durationLabel,
        originalAmount: offer.originalAmount,
        rawAmount: Number(amount),
        paymentMethod: state.selectedPayment,
        riskSnapshot: state.pendingRiskSnapshot
          ? { ...state.pendingRiskSnapshot }
          : {
              extraNoReasonRestricted: false,
              extraNoReasonApplicable: true,
              ruleVersion: state.rentalRiskDecision?.ruleVersion || '',
              acceptedAt: null,
            },
        ...snapshot,
        id: nextOrderId(createdAt),
        status: 'pending',
        createdAt,
        updatedAt: createdAt,
        sku,
        amount: Number(amount),
        priceVersion,
        paymentDeadline: createdAt + 30 * 60 * 1000,
      };
      state.pendingRiskSnapshot = null;
      renderApp();
      return cloneOrder(state.order);
    }

    function ensureGameOrder() {
      const offer = getSelectedOffer();
      if (state.order && NON_TERMINAL_ORDER_STATUSES.has(state.order.status)) return cloneOrder(state.order);
      const game = getSelectedGame();
      return createOrder({
        sku: offer.sku,
        amount: offer.amount,
        priceVersion: 'APP-PRICE-2026-08-03',
        gameId: game.id,
        gameName: game.name,
        platform: state.selectedPlatform,
        editionId: state.selectedEditionId,
        version: `${state.selectedPlatform} · ${getSelectedEdition(game)?.name || '默认版'}`,
        packageName: offer.packageName,
        durationLabel: offer.durationLabel,
        originalAmount: offer.originalAmount,
        rawAmount: offer.amount,
        paymentMethod: state.selectedPayment,
      });
    }

    function createMembershipOrder() {
      if (state.membershipOrder?.status === 'pending') return cloneOrder(state.membershipOrder);
      const plan = MEMBER_PLANS.find(({ id }) => id === state.memberPlan) || MEMBER_PLANS[0];
      const createdAt = nowFromServer();
      lastMembershipOrderNumber = Math.max(createdAt, lastMembershipOrderNumber + 1);
      state.membershipNotice = null;
      state.membershipOrder = {
        id: `MEMBER-${lastMembershipOrderNumber}`,
        status: 'pending',
        planId: plan.id,
        planName: plan.name,
        amount: plan.price,
        originalAmount: plan.original,
        paymentMethod: state.memberPayment,
        createdAt,
      };
      renderApp();
      return cloneOrder(state.membershipOrder);
    }

    function formatCountdown(deadline) {
      const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      const minutes = Math.floor(seconds / 60);
      return `${String(minutes).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function setInventoryAvailable(value) {
      state.inventoryAvailable = Boolean(value);
      renderApp();
    }

    function setPriceChanged(value) {
      state.priceChanged = Boolean(value);
      if (state.priceChanged && state.order) state.screen = 'checkout';
      renderApp();
    }

    function isCoreScreen(screen) {
      return CORE_SCREENS.has(screen);
    }

    function readCurrentScrollTop() {
      const root = document.querySelector('#appRentalDemo');
      const region = root?.querySelector('.portrait-content, .landscape-content');
      return Number(region?.scrollTop || 0);
    }

    function restoreSourceScrollIfNeeded(screen) {
      if (screen !== state.routeContext.sourceScreen) return;
      requestAnimationFrame(() => {
        const root = document.querySelector('#appRentalDemo');
        const region = root?.querySelector('.portrait-content, .landscape-content');
        if (region) region.scrollTop = state.routeContext.sourceScrollTop;
      });
    }

    function dismissMembershipIntro() {
      state.membershipIntroSeen = true;
      state.membershipIntroOpen = false;
      renderApp();
      return true;
    }

    function navigate(screen, { rememberSource = true, replaceTask = false } = {}) {
      const current = state.screen;
      if (screen === 'checkout') {
        if (current !== 'checkout' && state.order?.status !== 'pending') state.order = null;
        let checkoutOrder = ensureGameOrder();
        if (!checkoutOrder) {
          prepareCheckoutForSelectedGame();
          checkoutOrder = ensureGameOrder();
        }
        if (!checkoutOrder) {
          showToast('当前暂无可用租号套餐');
          return false;
        }
      }
      if (screen === 'orders') ensureSelectedOrder();
      if (screen === 'membership' && !state.membershipIntroSeen) state.membershipIntroOpen = true;
      if (screen !== 'membership') state.membershipIntroOpen = false;
      state.capturePageId = screen;
      if (screen === current) return renderApp();
      if (rememberSource && isCoreScreen(current) && !isCoreScreen(screen)) {
        state.routeContext.sourceScreen = current;
        state.routeContext.sourceScrollTop = readCurrentScrollTop();
        state.routeContext.taskStack = [];
      } else if (replaceTask && !isCoreScreen(current) && !isCoreScreen(screen)) {
        const stack = state.routeContext.taskStack;
        if (stack[stack.length - 1] === screen) stack.pop();
      } else if (!isCoreScreen(current) && !isCoreScreen(screen)) {
        const stack = state.routeContext.taskStack;
        if (stack[stack.length - 1] !== current) stack.push(current);
      } else if (isCoreScreen(screen)) {
        state.routeContext.taskStack = [];
      }
      state.screen = screen;
      renderApp();
      restoreSourceScrollIfNeeded(screen);
      return true;
    }

    function taskBack() {
      const previous = state.routeContext.taskStack.pop();
      const sourceTarget = state.screen === 'detail' ? state.routeContext.sourceScreen : null;
      const target = previous || sourceTarget || TASK_FALLBACK[state.screen] || state.routeContext.sourceScreen || 'home';
      state.screen = target;
      state.capturePageId = target;
      if (isCoreScreen(target)) state.routeContext.taskStack = [];
      renderApp();
      restoreSourceScrollIfNeeded(target);
      return target;
    }

    function setRouteContext(value = {}) {
      state.routeContext.sourceScreen = isCoreScreen(value.sourceScreen) ? value.sourceScreen : null;
      state.routeContext.sourceScrollTop = Number.isFinite(Number(value.sourceScrollTop)) ? Number(value.sourceScrollTop) : 0;
      state.routeContext.taskStack = Array.isArray(value.taskStack) ? value.taskStack.filter((screen) => typeof screen === 'string') : [];
      return JSON.parse(JSON.stringify(state.routeContext));
    }

    function nowFromServer() {
      return state.serverNow !== null && Number.isFinite(Number(state.serverNow))
        ? Number(state.serverNow)
        : Date.now();
    }

    function orderDurationMs(order) {
      if (order?.sku === 'trial') return 2 * 60 * 60 * 1000;
      const label = String(order?.durationLabel || '');
      const days = Number(label.match(/(\d+)天/)?.[1] || 0);
      if (days > 0) return days * 24 * 60 * 60 * 1000;
      const hours = Number(label.match(/(\d+)小时/)?.[1] || state.selectedHours || 2);
      return Math.max(2, hours) * 60 * 60 * 1000;
    }

    function payOrder({ paidAt = nowFromServer(), transactionId = state.order?.id, accountPrepared = true } = {}) {
      if (!state.order || !transactionId) return false;
      if (state.processedPaymentTransactions[transactionId]) return cloneOrder(state.order);
      if (state.order.status !== 'pending') return false;
      const entitlementOrder = state.order.saleMode === GAME_SALE_MODES.ENTITLEMENT;
      const riskRestricted = Boolean(state.order.riskSnapshot?.extraNoReasonRestricted);
      state.order.paidAt = Number(paidAt);
      state.order.startsAt = Number(paidAt);
      state.order.updatedAt = Number(paidAt);
      state.order.playedMinutes = 0;
      state.order.refundRuleVersion = riskRestricted ? null : 'REFUND-72H-30M-V1';
      if (entitlementOrder) {
        state.order.status = 'active';
        state.order.credentialAvailable = false;
        if (state.order.sku === 'trial') {
          state.order.expiresAt = Number(paidAt) + 2 * 60 * 60 * 1000;
          state.order.expireAt = state.order.expiresAt;
          state.platformTrialEligibility = {
            eligible: false,
            consumedAt: Number(paidAt),
            orderId: state.order.id,
          };
          if (state.discoveryContexts[state.order.gameId]) {
            state.discoveryContexts[state.order.gameId].firstRentalEligible = false;
          }
          setScenario('member-library-trial-used', { shouldRender: false });
        }
        state.transactionNotice = 'entitlement-active';
      } else {
        const rentalReady = accountPrepared !== false;
        state.order.status = rentalReady ? 'active' : 'refunding';
        state.order.credentialAvailable = rentalReady;
        if (rentalReady) {
          state.accountAllocationCount += 1;
          state.order.expireAt = Number(paidAt) + orderDurationMs(state.order);
          state.order.expiresAt = state.order.expireAt;
        }
        state.transactionNotice = rentalReady ? 'rental-active' : 'rental-refunding';
      }
      state.selectedOrderId = state.order.id;
      state.processedPaymentTransactions[transactionId] = state.order.id;
      renderApp();
      return cloneOrder(state.order);
    }

    function prepareAccountForLaunch({ orderId, launchRequestId }) {
      if (!orderId || !launchRequestId) return { ok: false, reason: 'request-invalid' };
      if (state.preparedLaunchRequests[launchRequestId]) return { ...state.preparedLaunchRequests[launchRequestId] };
      const order = getOrderCollection().find((item) => item.id === orderId);
      const expiresAt = Number(order?.expiresAt || order?.expireAt || 0);
      const valid = order?.status === 'active' && (!expiresAt || expiresAt > nowFromServer());
      const result = valid
        ? { ok: true, orderId, launchRequestId, prepared: true }
        : { ok: false, orderId, launchRequestId, reason: 'entitlement-expired' };
      state.preparedLaunchRequests[launchRequestId] = result;
      if (result.ok) state.accountAllocationCount += 1;
      return { ...result };
    }

    function releaseMemberGameUsage(reason = 'switch-game') {
      const usage = state.activeMemberUsage;
      if (!usage) return { ok: true, released: false };
      if (state.memberUsageReleaseFailed) return { ok: false, reason: 'release-failed', usage: { ...usage } };
      state.activeMemberUsage = null;
      state.accountAllocationCount = Math.max(0, state.accountAllocationCount - 1);
      clearSensitiveState(reason === 'switch-game' ? 'member-switch' : reason);
      return { ok: true, released: true, usage: { ...usage, status: 'ended', endedReason: reason } };
    }

    function startMemberGameUsage(gameId, { usageId = `MEMBER-USAGE-${Date.now()}`, releaseFailed = false } = {}) {
      if (!gameId || Number(state.membershipEntitlement.expiresAt || 0) <= nowFromServer()) return { ok: false, reason: 'membership-inactive' };
      const current = state.activeMemberUsage;
      if (current?.gameId === gameId) return { ok: true, reused: true, usage: { ...current } };
      if (current) {
        state.memberUsageReleaseFailed = Boolean(releaseFailed);
        const released = releaseMemberGameUsage('switch-game');
        state.memberUsageReleaseFailed = false;
        if (!released.ok) return { ok: false, reason: 'release-failed', usage: { ...current } };
      }
      state.activeMemberUsage = { id: usageId, gameId, status: 'active', startedAt: nowFromServer() };
      state.accountAllocationCount += 1;
      return { ok: true, reused: false, usage: { ...state.activeMemberUsage } };
    }

    function applyMembershipPayment({ planId, paidAt = nowFromServer(), transactionId }) {
      if (!MEMBER_PLAN_DAYS[planId] || !transactionId) return null;
      if (state.processedPaymentTransactions[transactionId]) return { ...state.membershipEntitlement };
      const duration = MEMBER_PLAN_DAYS[planId] * 86_400_000;
      const currentExpiry = Number(state.membershipEntitlement.expiresAt || 0);
      const active = currentExpiry > Number(paidAt);
      const startsAt = active ? Number(state.membershipEntitlement.startsAt || paidAt) : Number(paidAt);
      const base = active ? currentExpiry : Number(paidAt);
      state.membershipEntitlement = { planId, startsAt, expiresAt: base + duration };
      state.processedPaymentTransactions[transactionId] = `membership:${planId}`;
      return { ...state.membershipEntitlement };
    }

    function payMembershipOrder({ paidAt = nowFromServer() } = {}) {
      if (!state.membershipOrder || state.membershipOrder.status !== 'pending') return false;
      const entitlement = applyMembershipPayment({
        planId: state.membershipOrder.planId,
        paidAt,
        transactionId: state.membershipOrder.id,
      });
      if (!entitlement) return false;
      state.membershipOrder.status = 'paid';
      state.membershipOrder.paidAt = Number(paidAt);
      state.membershipOrder.startsAt = entitlement.startsAt;
      state.membershipOrder.expiresAt = entitlement.expiresAt;
      state.membershipStatus = state.memberPlan === 'weekly'
        ? 'weekly-active'
        : state.memberPlan === 'monthly'
          ? 'monthly-active'
          : 'quarterly-active';
      state.membershipNotice = '会员支付成功，会员已生效';
      renderApp();
      return cloneOrder(state.membershipOrder);
    }

    function ensureScenarioOrder(scenario = state.scenario) {
      if (scenario !== 'active-rental') return null;
      const now = Date.now();
      state.order = {
        ...ORDER_FIXTURES[0],
        id: 'APP-SCENARIO-ACTIVE',
        orderType: 'rental',
        sku: 'hourly-8h',
        priceVersion: 'APP-PRICE-2026-08-03',
        paymentMethod: 'alipay',
        scenarioSeed: true,
        updatedAt: now,
        expireAt: now + 8 * 60 * 60 * 1000,
      };
      state.selectedOrderId = state.order.id;
      state.accountAllocationCount = 1;
      if (!state.rentalUsage || state.rentalUsage.expiryHandled) {
        state.rentalUsageSequence += 1;
        state.serverTime = now;
        state.rentalUsage = {
          id: `USAGE-APP-SCENARIO-ACTIVE-${state.rentalUsageSequence}`,
          orderId: state.order.id,
          expireAt: now + 8 * 60 * 60 * 1000,
          sessionActive: true,
          rentalSessionRevoked: false,
          shortAuthValid: true,
          accountReleased: false,
          packageInstalled: true,
          expiryHandled: false,
          expiryExecutionCount: 0,
          accountReleaseCount: 0,
          takeover: null,
        };
        state.expiryReminderOpen = false;
        state.expiredLaunchDialogOpen = false;
        state.postRentalEntitlement = null;
        state.lastExpiryMinutes = null;
      }
      return cloneOrder(state.order);
    }

    function setScenario(value, { shouldRender = true } = {}) {
      if (value !== 'active-rental' && state.order?.scenarioSeed) {
        state.order = null;
        state.selectedOrderId = null;
        state.accountAllocationCount = 0;
      }
      state.scenario = SCENARIOS[value] ? value : 'member-library-trial';
      state.membershipStatus = SCENARIOS[state.scenario]?.membershipStatus || 'none';
      state.entitlementPanelOpen = false;
      normalizeSkuForScenario();
      ensureScenarioOrder(state.scenario);
      if (shouldRender) renderApp();
      return state.scenario;
    }

    function getOrderCollection() {
      const fixtures = ORDER_FIXTURES.map(cloneOrder);
      const visible = (orders) => orders.filter(({ id }) => !state.hiddenOrderIds.includes(id));
      if (!state.order) return visible(fixtures);
      const index = fixtures.findIndex(({ id }) => id === state.order.id || (state.order.scenarioSeed && id === 'APP-20260803001'));
      if (index >= 0) fixtures.splice(index, 1);
      return visible([cloneOrder(state.order), ...fixtures]);
    }

    function rentalOrderTab(order) {
      if (order.status === 'pending') return 'pending';
      if (order.status === 'active' && Number(order.expireAt) > Date.now()) return 'usable';
      return 'all';
    }

    function matchesOrderTab(order, tab) {
      if (tab === 'all') return true;
      return rentalOrderTab(order) === tab;
    }

    function normalizeOrderSearch(value) {
      return String(value || '').trim().toLocaleLowerCase('zh-CN');
    }

    function getFilteredOrders() {
      const keyword = normalizeOrderSearch(state.orderSearch);
      return getOrderCollection()
        .filter((order) => matchesOrderTab(order, state.orderTab))
        .filter((order) => !keyword || normalizeOrderSearch(`${order.gameName} ${order.id}`).includes(keyword))
        .sort((left, right) => Number(right.updatedAt || right.createdAt) - Number(left.updatedAt || left.createdAt));
    }

    function setOrderSearch(value) {
      state.orderSearch = String(value || '');
      state.orderSearchOpen = Boolean(state.orderSearch);
      renderApp();
      return getFilteredOrders().map(({ id }) => id);

    function ensureSelectedOrder() {
      const orders = getFilteredOrders();

        state.selectedOrderId = orders.find(({ status }) => status === 'active')?.id || orders[0]?.id || null;

      return state.selectedOrderId;
    }

      ensureSelectedOrder();
      return getOrderCollection().find(({ id }) => id === state.selectedOrderId) || null;

    function selectOrder(orderId) {

      navigate('order-detail');

    function handleOrderCardAction(action, orderId) {
      const order = getOrderCollection().find(({ id }) => id === orderId);
      if (!order) return false;
      if (action === 'pay') {
        state.order = cloneOrder(order);
        state.selectedOrderId = order.id;
        navigate('checkout');
        return true;
      }
      if (action === 'cancel') {
        state.order = { ...cloneOrder(order), status: 'ended', endedAt: Date.now(), updatedAt: Date.now() };
        state.selectedOrderId = order.id;
        showToast('订单已取消');
        return true;
      }
      if (action === 'login') {
        state.selectedOrderId = order.id;
        openLoginMethod();
        return true;
      }
      if (action === 'credentials') {
        state.selectedOrderId = order.id;
        return openCredentialPanel();
      }
      if (action === 'after-sales') {
        state.selectedOrderId = order.id;
        return openAfterSales();
      }
      if (action === 'after-sales-detail') {
        state.selectedOrderId = order.id;
        state.afterSalesProgressOpen = true;
        renderApp();
        return true;
      }
      if (action === 'progress') {
        state.selectedOrderId = order.id;
        state.refundProgressOrderId = order.id;
        renderApp();
        return true;
      }
      if (action === 'rent') return requestRentalCheckout(order.gameId);
      if (action === 'playable') {
        const gameId = getGameContext(order.gameId) ? order.gameId : 'elden-ring';
        setScenario('permanent-owned', { shouldRender: false });
        setSelectedGame(gameId, { shouldRender: false });
        navigate('detail');
        return true;
      }
      if (action === 'delete') {
        state.confirmDeleteOrderId = order.id;
        renderApp();
        return true;
      }
      return false;
    }

    function openLoginMethod() {
      if (getSelectedOrder()?.status !== 'active') return false;

      renderApp();
      return true;
    }

    function closeLoginMethod() {

      setSelectedGame(order.gameId, { shouldRender: false });

    function closeCredentialPanel() {

      state.credentialAccountVisible = false;
      state.credentialPasswordVisible = false;

    function toggleCredential(field) {
      if (field === 'account') state.credentialAccountVisible = !state.credentialAccountVisible;
      if (field === 'password') state.credentialPasswordVisible = !state.credentialPasswordVisible;
      renderApp();
    }

    function getThirdPartyLoginConfig(order = getSelectedOrder()) {
      if (order?.status !== 'active' || order.credentialAvailable === false) return null;
      const config = THIRD_PARTY_LOGIN_CONFIGS[order.gameId];
      return config?.platformApproved ? config : null;
    }

    function resetThirdPartyCredentialState() {
      state.thirdPartyAccountVisible = false;
      state.thirdPartyPasswordVisible = false;
      state.thirdPartyCode = null;
      state.thirdPartyCodeExpiresAt = null;
      state.thirdPartyCodeCooldownUntil = null;
      state.thirdPartyCodeIssued = false;
    }

    function toggleThirdPartyCredential(field) {
      if (!getThirdPartyLoginConfig()) return false;
      if (field === 'account') state.thirdPartyAccountVisible = !state.thirdPartyAccountVisible;
      else if (field === 'password') state.thirdPartyPasswordVisible = !state.thirdPartyPasswordVisible;
      else return false;
      renderApp();
      return true;
    }

    let toastTimer = null;
    const CREDENTIAL_AUTH_TTL_MS = 5 * 60 * 1000;
    const CLIPBOARD_CLEAR_DELAY_MS = 60 * 1000;
    let clipboardClearTimer = null;

    function showToast(message) {
      if (toastTimer) clearTimeout(toastTimer);
      state.toast = message;
      renderApp();
      toastTimer = setTimeout(() => {
        toastTimer = null;
        if (state.toast !== message) return;
        state.toast = null;
        renderApp();
      }, 1800);
    }

    function authorizeCredentialAccess(now = Date.now()) {
      if (getSelectedOrder()?.status !== 'active') return false;
      state.credentialAccessExpiresAt = now + CREDENTIAL_AUTH_TTL_MS;
      return state.credentialAccessExpiresAt;
    }

    function credentialAccessActive(now = Date.now()) {
      return getSelectedOrder()?.status === 'active' && Number(state.credentialAccessExpiresAt || 0) > now;
    }

    function clearCopiedCredential(expectedValue = null) {
      if (expectedValue !== null && state.copiedCredential !== expectedValue) return false;
      state.copiedCredential = null;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText('').catch(() => {});
      return true;
    }

    function scheduleClipboardClear(value) {
      if (clipboardClearTimer) clearTimeout(clipboardClearTimer);
      state.copiedCredential = value;
      clipboardClearTimer = setTimeout(() => {
        clipboardClearTimer = null;
        clearCopiedCredential(value);
      }, CLIPBOARD_CLEAR_DELAY_MS);
      return true;
    }

    function copyCredential(field) {
      if (!['account', 'password'].includes(field) || !credentialAccessActive()) return false;
      const value = RENTAL_CREDENTIAL[field];
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(value).catch(() => {});
      scheduleClipboardClear(value);
      showToast(`${field === 'account' ? '账号' : '密码'}已复制`);
      return true;
    }

    function copyThirdPartyCredential(field) {
      const config = getThirdPartyLoginConfig();
      if (!config || !['account', 'password'].includes(field) || !credentialAccessActive()) return false;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(config[field]).catch(() => {});
      scheduleClipboardClear(config[field]);
      showToast(`${config.platformName}${field === 'account' ? '账号' : '密码'}已复制`);
      return true;
    }

    function submitSteamLogin() {
      if (!state.steamForm.account.trim() || !state.steamForm.password) {
        showToast('请输入 Steam 账号和密码');
        return false;
      }
      const order = getSelectedOrder();
      if (!order || order.status !== 'active') return false;
      state.steamForm.submitted = true;
      state.steamForm.requiresGuard = false;
      state.steamHelpOpen = false;
      setSelectedGame(order.gameId, { shouldRender: false });
      setScenario('active-rental', { shouldRender: false });
      navigate('detail', { rememberSource: false, replaceTask: true });
      showToast('登录成功，已进入游戏详情');
      return true;
    }

    function guardRemainingSeconds() {
      if (!state.guardCode || !state.guardExpiresAt) return 0;
      return Math.max(0, Math.ceil((state.guardExpiresAt - Date.now()) / 1000));
    }

    function requestGuardCode() {
      if (getSelectedOrder()?.status !== 'active' || (!state.steamForm.requiresGuard && !state.credentialPanelOpen)) return false;
      if (!state.guardCode || guardRemainingSeconds() <= 0) return refreshGuardCode();
      renderApp();
      return true;
    }

    function refreshGuardCode() {
      if (getSelectedOrder()?.status !== 'active' || (!state.steamForm.requiresGuard && !state.credentialPanelOpen)) return false;
      state.guardCode = '48291';
      state.guardExpiresAt = Date.now() + 30 * 1000;
      state.guardIssued = true;
      renderApp();
      return true;
    }

    function copyGuardCode() {
      if (!credentialAccessActive() || !state.guardCode || guardRemainingSeconds() <= 0) return false;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(state.guardCode).catch(() => {});
      scheduleClipboardClear(state.guardCode);
      showToast('验证码已复制');
      return true;
    }

    function expireGuardCode() {
      if (!state.guardCode && !state.guardIssued) return false;
      state.guardCode = null;
      state.guardExpiresAt = null;
      renderApp();
      return true;
    }

    function thirdPartyCodeRemainingSeconds() {
      if (!state.thirdPartyCode || !state.thirdPartyCodeExpiresAt) return 0;
      return Math.max(0, Math.ceil((state.thirdPartyCodeExpiresAt - Date.now()) / 1000));
    }

    function thirdPartyCodeCooldownSeconds() {
      if (!state.thirdPartyCodeCooldownUntil) return 0;
      return Math.max(0, Math.ceil((state.thirdPartyCodeCooldownUntil - Date.now()) / 1000));
    }

    function requestThirdPartyCode() {
      if (!getThirdPartyLoginConfig()) return false;
      if (state.thirdPartyCode && thirdPartyCodeRemainingSeconds() > 0) {
        renderApp();
        return true;
      }
      return refreshThirdPartyCode();
    }

    function refreshThirdPartyCode() {
      if (!getThirdPartyLoginConfig()) return false;
      const cooldown = thirdPartyCodeCooldownSeconds();
      if (cooldown > 0) {
        showToast(`${cooldown}s 后可重新获取`);
        return false;
      }
      state.thirdPartyCode = '739204';
      state.thirdPartyCodeExpiresAt = Date.now() + 60 * 1000;
      state.thirdPartyCodeCooldownUntil = Date.now() + 30 * 1000;
      state.thirdPartyCodeIssued = true;
      renderApp();
      return true;
    }

    function copyThirdPartyCode() {
      if (!credentialAccessActive() || !getThirdPartyLoginConfig() || !state.thirdPartyCode || thirdPartyCodeRemainingSeconds() <= 0) return false;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(state.thirdPartyCode).catch(() => {});
      scheduleClipboardClear(state.thirdPartyCode);
      showToast('第三方验证码已复制');
      return true;
    }

    function expireThirdPartyCode() {
      if (!state.thirdPartyCode && !state.thirdPartyCodeIssued) return false;
      state.thirdPartyCode = null;
      state.thirdPartyCodeExpiresAt = null;
      state.thirdPartyCodeCooldownUntil = null;
      renderApp();
      return true;
    }

    function wipeSensitiveState({ clearAccount = false, closePanels = true } = {}) {
      state.guardCode = null;
      state.guardExpiresAt = null;
      state.guardIssued = false;
      if (clearAccount) state.steamForm.account = '';
      state.steamForm.password = '';
      state.steamForm.submitted = false;
      state.steamForm.requiresGuard = false;
      state.credentialAccountVisible = false;
      state.credentialPasswordVisible = false;
      resetThirdPartyCredentialState();
      if (closePanels) {
        state.credentialPanelOpen = false;
        state.steamHelpOpen = false;
        state.loginMethodOpen = false;
      }
    }

    function clearSensitiveState(reason = 'manual') {
      state.credentialAccessExpiresAt = null;
      if (clipboardClearTimer) clearTimeout(clipboardClearTimer);
      clipboardClearTimer = null;
      clearCopiedCredential();
      wipeSensitiveState({ clearAccount: ['order-ended', 't0', 'after-sales', 'background'].includes(reason), closePanels: true });
      renderApp();
      return true;
    }

    function endOrder() {
      if (!state.order || state.order.status !== 'active') return false;
      state.order.status = 'ended';
      clearSensitiveState('order-ended');
      return true;
    }

    function setCurrentOrderStatus(value) {
      if (!state.order || !ORDER_STATUS_META[value]) return false;
      state.order.status = value;
      state.order.updatedAt = Date.now();
      if (value !== 'active') clearSensitiveState(`order-${value}`);
      renderApp();
      return state.order.status;
    }

    function setGameplayContext(value) {
      state.gameplayContext = Boolean(value);
      renderApp();
      return state.gameplayContext;
    }

    function resolvePostRentalEntitlement() {
      if (['personal-owned', 'permanent', 'membership'].includes(state.postRentalEntitlement)) return state.postRentalEntitlement;
      if (['owned-installed', 'owned-uninstalled', 'permanent-owned'].includes(state.scenario)) return 'personal-owned';
      if (['weekly-active', 'monthly-active', 'quarterly-active'].includes(state.membershipStatus) || state.scenario === 'active-member') return 'membership';
      return null;
    }

    function setPostRentalEntitlement(value) {
      state.postRentalEntitlement = ['personal-owned', 'permanent', 'membership'].includes(value) ? value : null;
      renderApp();
      return state.postRentalEntitlement;
    }

    function handleRentalT0() {
      const usage = state.rentalUsage;
      if (!usage || usage.expiryHandled || state.serverTime < usage.expireAt) return false;
      usage.expiryHandled = true;
      usage.expiryExecutionCount += 1;
      usage.rentalSessionRevoked = true;
      usage.shortAuthValid = false;
      usage.accountReleased = true;
      usage.accountReleaseCount += 1;
      state.expiryReminderOpen = false;
      if (state.order) state.order.status = 'ended';
      wipeSensitiveState({ clearAccount: true, closePanels: true });
      const takeover = resolvePostRentalEntitlement();
      usage.takeover = takeover;
      usage.sessionActive = Boolean(takeover);
      state.expiredLaunchDialogOpen = !takeover;
      state.expiredLaunchReason = 'ended';
      state.routeContext.taskStack = [];
      state.screen = takeover ? 'detail' : 'order-detail';
      renderApp();
      return true;
    }

    function triggerExpiryMinutes(minutes) {
      if (!state.rentalUsage || !Number.isFinite(Number(minutes))) return false;
      const numericMinutes = Number(minutes);
      const previousMinutes = state.lastExpiryMinutes;
      const reminderThreshold = 15;
      state.serverTime = state.rentalUsage.expireAt - Math.max(0, numericMinutes) * 60 * 1000;
      if (numericMinutes <= 0) return handleRentalT0();
      const alreadyShown = state.remindedUsageIds.includes(state.rentalUsage.id);
      const crossedThreshold = previousMinutes === null
        ? numericMinutes <= reminderThreshold && numericMinutes > reminderThreshold - 1
        : previousMinutes > reminderThreshold && numericMinutes <= reminderThreshold;
      state.lastExpiryMinutes = numericMinutes;
      if (crossedThreshold && !alreadyShown) {
        state.remindedUsageIds.push(state.rentalUsage.id);
        state.expiryReminderCount += 1;
        state.expiryReminderOpen = true;
      }
      renderApp();
      return state.expiryReminderOpen;
    }

    function closeExpiryReminder() {
      state.expiryReminderOpen = false;
      renderApp();
      return true;
    }

    function continueFromExpiryReminder() {
      state.expiryReminderOpen = false;
      navigate('detail');
      return true;
    }

    function setLaunchVerification(value) {
      state.launchVerification = value === 'offline' ? 'offline' : 'online';
      renderApp();
      return state.launchVerification;
    }

    function attemptLaunchAfterExpiry() {
      if (!state.rentalUsage?.expiryHandled) return false;
      if (state.launchVerification !== 'online') {
        state.expiredLaunchDialogOpen = true;
        state.expiredLaunchReason = 'network';
        renderApp();
        return false;
      }
      const takeover = resolvePostRentalEntitlement();
      if (!takeover) {
        state.expiredLaunchDialogOpen = false;
        state.expiredLaunchReason = 'ended';
        state.rentalUsage.sessionActive = false;
        navigate('detail');
        return false;
      }
      state.rentalUsage.takeover = takeover;
      state.rentalUsage.sessionActive = true;
      state.expiredLaunchDialogOpen = false;
      state.screen = 'detail';
      renderApp();
      return true;
    }

    function recheckEntitlement() {
      return attemptLaunchAfterExpiry();
    }

    function closeExpiredLaunchDialog() {
      state.expiredLaunchDialogOpen = false;
      const target = state.routeContext.sourceScreen || TASK_FALLBACK[state.screen] || 'home';
      state.screen = target;
      state.routeContext.taskStack = [];
      renderApp();
      restoreSourceScrollIfNeeded(target);
      return true;
    }

    function getNoReasonEligibility(order) {
      if (!order) return { eligible: false, reason: '订单信息不可用' };
      if (order.riskSnapshot?.extraNoReasonRestricted) {
        return { eligible: false, reason: '本单不适用平台额外3天无理由；履约售后仍可正常申请' };
      }
      const paidAt = Number(order.paidAt);
      const playedMinutes = Number(order.playedMinutes);
      const within72Hours = Number.isFinite(paidAt) && Date.now() >= paidAt && Date.now() - paidAt <= 72 * 60 * 60 * 1000;
      const within30Minutes = Number.isFinite(playedMinutes) && playedMinutes <= 30;
      const ruleSnapshotted = Boolean(order.refundRuleVersion);
      const eligible = order.status === 'active' && within72Hours && within30Minutes && ruleSnapshotted;
      if (eligible) return { eligible: true, reason: '' };
      if (!within72Hours) return { eligible: false, reason: '已超过支付后72小时，不支持3天无理由' };
      if (!within30Minutes) return { eligible: false, reason: '累计游玩超过30分钟，不支持3天无理由' };
      if (!ruleSnapshotted) return { eligible: false, reason: '订单缺少退款规则快照，请联系客服处理' };
      return { eligible: false, reason: '当前订单状态不支持3天无理由' };
    }

    function openAfterSales() {
      const order = getSelectedOrder();
      if (!order || !['active', 'refunding'].includes(order.status)) return false;
      if (state.afterSalesDraft.orderId !== order.id) {

    function submitAfterSales() {
      if (state.afterSalesOrder?.orderId === state.afterSalesDraft.orderId) return cloneOrder(state.afterSalesOrder);
      if (!state.afterSalesDraft.orderId || !state.afterSalesDraft.description.trim()) {
        showToast('请填写问题描述');
        return null;
      }
      state.afterSalesOrder = {
        id: `AFTER-${state.afterSalesDraft.orderId}`,
        orderId: state.afterSalesDraft.orderId,
        type: state.afterSalesDraft.type,
        description: state.afterSalesDraft.description.trim(),
        status: 'submitted',

      state.afterSalesProgressOpen = false;
      wipeSensitiveState({ clearAccount: true, closePanels: true });

    function realCrop(assetKey, crop, alt, label = '', className = 'cover-art') {
      const [sourceWidth, sourceHeight] = ASSET_SIZES[assetKey];
      const [x, y, width, height] = crop;
      return `<span class="real-media ${className}"><img data-real-asset="true" data-source-screen="${assetKey}" data-source-width="${sourceWidth}" data-source-height="${sourceHeight}" data-crop-x="${x}" data-crop-y="${y}" data-crop-width="${width}" data-crop-height="${height}" src="${ASSETS[assetKey]}" alt="${alt}" draggable="false">${label ? `<small>${label}</small>` : ''}</span>`;
    }

    function applyRealCrops(root) {
      root.querySelectorAll('img[data-real-asset="true"]').forEach((image) => {
        const frameWidth = image.parentElement.clientWidth;
        const frameHeight = image.parentElement.clientHeight;
        const sourceWidth = Number(image.dataset.sourceWidth);
        const sourceHeight = Number(image.dataset.sourceHeight);
        const cropX = Number(image.dataset.cropX);
        const cropY = Number(image.dataset.cropY);
        const cropWidth = Number(image.dataset.cropWidth);
        const cropHeight = Number(image.dataset.cropHeight);
        const scale = Math.max(frameWidth / cropWidth, frameHeight / cropHeight);
        const renderedWidth = sourceWidth * scale;
        const renderedHeight = sourceHeight * scale;
        const cropCenterX = (cropX + cropWidth / 2) * scale;
        const cropCenterY = (cropY + cropHeight / 2) * scale;
        image.style.width = `${renderedWidth}px`;
        image.style.height = `${renderedHeight}px`;
        image.style.left = `${frameWidth / 2 - cropCenterX}px`;
        image.style.top = `${frameHeight / 2 - cropCenterY}px`;
      });
    }

    function resolveDetailActions() {
      const game = getSelectedGame();
      const { primary } = getDetailModel().action;
      const base = [
        { id: 'more', label: '更多', icon: 'more', ariaLabel: '更多', action: 'feedback', tone: 'light' },
        { id: 'quick-play', label: '秒玩', icon: 'quick-play', action: 'feedback', tone: 'light' },
      ];
      if (primary === 'continue') return [...base, { id: 'login', label: '登录游戏', action: 'open-login-method', tone: 'primary' }];
      if (primary === 'download') return [...base, { id: 'download', label: '下载游戏', action: 'feedback', tone: 'primary' }];
      if (['launch', 'member-play', 'permanent'].includes(primary)) return [...base, { id: 'playable', label: '可畅玩', action: 'feedback', tone: 'primary' }];
      if (game.acquisitionMode === 'free') return [...base, { id: 'acquire', label: '获取游戏', action: 'feedback', tone: 'secondary' }];
      const context = getCheckoutEligibilityContext(game.id);
      const canRent = getGameSaleMode(game.id) === GAME_SALE_MODES.TIME_RENTAL
        ? Boolean(lowestEligibleRentalSku(game, context))
        : eligibleCheckoutSkus(game, context).length > 0;
      const canBuy = Boolean(lowestEligiblePurchaseSku(game, context));
      if (canBuy) base.push({ id: 'purchase', label: '立即购买', action: 'feedback', tone: canRent ? 'secondary' : 'primary' });
      if (canRent) base.push({ id: 'rent', label: '租号开玩', action: 'begin-checkout', tone: 'primary' });
      if (!canBuy && !canRent) base.push({ id: 'unavailable', label: '暂不可用', action: 'feedback', tone: 'primary', disabled: true });
      return base;
    }

      return `有效期至 ${value.year}.${value.month}.${value.day}`;

    function renderOrderCover(order, className = 'order-game-cover') {

        'elden-ring': ['home', [67, 1658, 492, 235]],
        'the-forest': ['landscapeSteamLibrary', [606, 297, 390, 224]],
        hogwarts: ['landscapeSteamLibrary', [608, 753, 390, 216]],
