<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盖世游戏 APP 租号功能 Demo</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg-primary: #000000;
      --bg-card: #1a1a1a;
      --bg-elevated: #252525;
      --text-primary: #ffffff;
      --text-secondary: #e6e6e6;
      --text-muted: #9b9ca3;
      --brand-gold: #ffcc43;
      --brand-green: #33d8a4;
      --brand-blue: #338feb;
      --border-default: #353d4e;
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-number: "D-DIN-PRO", var(--font-primary);
      font-family: var(--font-primary);
      background: #07090d;
      color: var(--text-primary);
    }

    html, body { min-width: 320px; min-height: 100%; }
    body { margin: 0; background: radial-gradient(circle at 50% 8%, #202637 0, #0b0e14 38%, #050608 100%); }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible { outline: 2px solid var(--brand-gold); outline-offset: 2px; }

    #appRentalDemo {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .device {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 20px;
      background: var(--bg-primary);
      box-shadow: 0 30px 90px rgb(0 0 0 / 58%), 0 0 0 7px rgb(255 255 255 / 3%);
    }

    .device.portrait { width: 390px; height: 844px; }

    .device.portrait::before {
      position: absolute;
      z-index: -2;
      inset: 0;
      background:
        radial-gradient(circle at 76% 2%, rgb(75 47 105 / 56%), transparent 32%),
        radial-gradient(circle at 15% 30%, rgb(31 76 105 / 38%), transparent 31%),
        linear-gradient(165deg, #10131d 0, #090a0e 44%, #020203 100%);
      content: "";
    }

    .device.portrait.theme-home::before {
      background:
        radial-gradient(circle at 14% 0, rgb(121 72 31 / 54%), transparent 38%),
        radial-gradient(circle at 90% 45%, rgb(63 72 35 / 42%), transparent 35%),
        linear-gradient(164deg, #1d1611 0, #0a0a09 54%, #020202 100%);
    }

    .device.portrait.theme-library::before {
      background:
        radial-gradient(circle at 36% 0, rgb(53 65 117 / 60%), transparent 38%),
        linear-gradient(174deg, #141828 0, #090a0f 52%, #030303 100%);
    }

    .device.portrait.theme-profile::before {
      background:
        radial-gradient(circle at 18% 5%, rgb(4 84 110 / 62%), transparent 39%),
        radial-gradient(circle at 83% 70%, rgb(57 24 69 / 34%), transparent 36%),
        linear-gradient(178deg, #06131a 0, #07070a 50%, #020203 100%);
    }

    .mobile-status {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      display: flex;
      width: 100%;
      height: 34px;
      align-items: center;
      justify-content: space-between;
      padding: 4px 17px 0;
      color: rgb(255 255 255 / 94%);
      font-family: var(--font-number);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .status-left, .status-right { display: flex; align-items: center; gap: 7px; }
    .status-rate { color: rgb(255 255 255 / 76%); font-size: 10px; font-style: italic; }
    .status-icon { display: inline-flex; width: 15px; height: 15px; align-items: center; justify-content: center; }
    .status-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .battery { display: inline-flex; height: 14px; min-width: 27px; align-items: center; justify-content: center; border: 1px solid rgb(255 255 255 / 74%); border-radius: 4px; font-size: 8px; }

    .portrait-content {
      position: absolute;
      inset: 34px 0 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 10px 16px 104px;
      scrollbar-width: none;
    }

    .portrait-content::-webkit-scrollbar { display: none; }

    .portrait-nav {
      position: absolute;
      z-index: 10;
      right: 8px;
      bottom: 8px;
      left: 8px;
      display: grid;
      height: 72px;
      grid-template-columns: repeat(5, 1fr);
      align-items: stretch;
      padding: 4px;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 24px;
      background: rgb(36 36 39 / 83%);
      box-shadow: 0 -10px 34px rgb(0 0 0 / 34%), inset 0 1px rgb(255 255 255 / 6%);
      backdrop-filter: blur(20px);
    }

    .portrait-nav button {
      display: flex;
      min-width: 0;
      min-height: 62px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 2px 3px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: #85868c;
      cursor: pointer;
      font-size: 10px;
      line-height: 14px;
      transition: background 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .portrait-nav button:active { transform: scale(.96); }
    .portrait-nav button.active { background: rgb(255 255 255 / 10%); color: #fff; }
    .portrait-nav button svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }

    .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .search-box {
      display: flex;
      height: 44px;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 100px;
      background: rgb(255 255 255 / 5%);
      color: rgb(255 255 255 / 47%);
      font-size: 14px;
      backdrop-filter: blur(12px);
    }

    .search-box svg { width: 21px; height: 21px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; }
    .device-link { display: grid; width: 44px; height: 44px; flex: 0 0 auto; place-items: center; border: 0; background: none; color: #fff; cursor: pointer; }
    .device-link svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .page-tabs {
      display: flex;
      align-items: flex-start;
      gap: 27px;
      overflow-x: auto;
      margin: 0 -2px 18px;
      padding: 0 2px 2px;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .page-tabs::-webkit-scrollbar { display: none; }
    .page-tabs button {
      position: relative;
      min-height: 38px;
      padding: 0 0 10px;
      border: 0;
      background: none;
      color: rgb(255 255 255 / 48%);
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
    }

    .page-tabs button.active { color: #fff; font-weight: 650; }
    .page-tabs button.active::after {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 18px;
      height: 3px;
      border-radius: 100px;
      background: #fff;
      content: "";
      transform: translateX(-50%);
    }

    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 1px 11px; }
    .section-head h2 { margin: 0; font-size: 18px; font-weight: 650; line-height: 26px; }
    .section-head span { color: var(--text-muted); font-size: 11px; }

    .hero-card {
      position: relative;
      min-height: 224px;
      overflow: hidden;
      padding: 18px;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 20px;
      background:
        linear-gradient(180deg, transparent 8%, rgb(3 5 9 / 7%) 38%, rgb(3 4 7 / 96%) 100%),
        radial-gradient(circle at 66% 28%, rgb(238 184 85 / 42%), transparent 23%),
        linear-gradient(135deg, #40301e 0, #1e2534 50%, #0b0c10 100%);
      box-shadow: 0 12px 32px rgb(0 0 0 / 24%);
    }

    .real-media { position: relative; display: block; overflow: hidden; background: #11141a; }
    .real-media > img { position: absolute; max-width: none; object-fit: cover; pointer-events: none; user-select: none; }
    .hero-real { position: absolute; z-index: 0; inset: 0; }
    .hero-real::after { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(5 7 10 / 18%) 0, rgb(5 7 10 / 44%) 45%, rgb(3 4 7 / 97%) 100%); content: ""; }

    .hero-card::after {
      position: absolute;
      top: -36px;
      right: -10px;
      width: 190px;
      height: 190px;
      border: 1px solid rgb(255 212 113 / 27%);
      border-radius: 50%;
      box-shadow: inset 0 0 0 24px rgb(0 0 0 / 16%), inset 0 0 0 25px rgb(255 255 255 / 5%);
      content: "";
    }

    .hero-mark { position: absolute; z-index: 1; top: 40px; right: 33px; width: 94px; height: 94px; color: rgb(255 235 189 / 76%); }
    .hero-mark svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.3; }
    .hero-eyebrow { position: relative; z-index: 2; color: rgb(255 255 255 / 68%); font-size: 11px; letter-spacing: .11em; }
    .hero-copy { position: absolute; z-index: 2; right: 16px; bottom: 15px; left: 16px; }
    .hero-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .rent-badge { padding: 4px 8px; border: 1px solid rgb(255 215 115 / 25%); border-radius: 100px; background: rgb(255 204 67 / 14%); color: #ffda78; font-size: 10px; }
    .hero-score { margin-left: auto; color: #ffb14b; font-family: var(--font-number); font-size: 14px; font-weight: 650; }
    .hero-title { margin: 0 0 10px; font-size: 23px; font-weight: 680; letter-spacing: .02em; }
    .hero-bottom { display: flex; align-items: center; gap: 10px; }
    .hero-subtitle { flex: 1; color: var(--text-muted); font-size: 11px; line-height: 16px; }
    .primary-action {
      min-width: 112px;
      min-height: 44px;
      padding: 0 15px;
      border: 0;
      border-radius: 100px;
      background: linear-gradient(135deg, #ffd86b, #e6a62b);
      box-shadow: 0 8px 22px rgb(241 178 47 / 19%);
      color: #19140b;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .mini-game-row { display: grid; grid-auto-columns: 84px; grid-auto-flow: column; gap: 11px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .mini-game-row::-webkit-scrollbar { display: none; }
    .mini-game { min-width: 0; }
    .mini-game .cover-art { width: 84px; height: 84px; }
    .mini-game strong { display: block; overflow: hidden; margin-top: 7px; font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }

    .cover-art {
      position: relative;
      display: block;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(140deg, #303b5d, #121721);
    }

    .cover-art::after { position: absolute; inset: 0; background: linear-gradient(155deg, rgb(255 255 255 / 16%), transparent 42%, rgb(0 0 0 / 44%)); content: ""; }
    .cover-art svg { position: absolute; inset: 0; width: 100%; height: 100%; color: rgb(255 255 255 / 55%); fill: none; stroke: currentColor; stroke-width: 1.15; }
    .cover-art small { position: absolute; z-index: 2; right: 7px; bottom: 6px; left: 7px; color: rgb(255 255 255 / 89%); font-size: 8px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 1px 5px #000; }
    .cover-art--ember { background: linear-gradient(140deg, #8a3527, #251410 55%, #0c0908); }
    .cover-art--forest { background: linear-gradient(145deg, #315f5a, #142c31 52%, #080e12); }
    .cover-art--violet { background: linear-gradient(145deg, #7056a1, #34254e 54%, #11101d); }
    .cover-art--gold { background: linear-gradient(145deg, #a68035, #47371a 55%, #17120b); }
    .cover-art--blue { background: linear-gradient(145deg, #3f78a3, #1e3a55 52%, #0b111a); }
    .cover-art--red { background: linear-gradient(145deg, #a73e46, #4b1b25 52%, #160a0d); }

    .account-card {
      display: flex;
      min-height: 74px;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
      padding: 13px 16px;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 18px;
      background: rgb(255 255 255 / 5%);
      backdrop-filter: blur(14px);
    }

    .avatar-small, .profile-avatar {
      display: grid;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 50%;
      background: linear-gradient(145deg, #526071, #272c36);
      color: rgb(255 255 255 / 72%);
    }

    .avatar-small { width: 46px; height: 46px; flex: 0 0 auto; }
    .avatar-small svg, .profile-avatar svg { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .account-card strong { font-size: 15px; }
    .account-card p { margin: 4px 0 0; color: var(--text-muted); font-size: 11px; }

    .feature-scroll { display: grid; grid-auto-columns: 75%; grid-auto-flow: column; gap: 12px; overflow-x: auto; scrollbar-width: none; }
    .feature-scroll::-webkit-scrollbar { display: none; }
    .feature-card { overflow: hidden; border: 1px solid rgb(255 255 255 / 10%); border-radius: 18px; background: rgb(20 20 23 / 76%); }
    .feature-card .cover-art { width: 100%; height: 112px; border-radius: 17px 17px 10px 10px; }
    .feature-info { display: flex; min-height: 57px; align-items: center; gap: 8px; padding: 9px 11px; }
    .feature-info strong { overflow: hidden; flex: 1; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .small-pill { min-height: 36px; padding: 0 14px; border: 1px solid rgb(255 255 255 / 12%); border-radius: 100px; background: rgb(255 255 255 / 7%); cursor: pointer; font-size: 11px; }

    .game-list { display: grid; gap: 12px; }
    .game-list-item { display: grid; min-height: 76px; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 11px; }
    .game-list-item .cover-art { width: 64px; height: 64px; }
    .game-list-copy { min-width: 0; }
    .game-list-copy strong { display: block; overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .game-list-copy p { overflow: hidden; margin: 5px 0 3px; color: var(--text-muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .rating { color: #ff9c42; font-family: var(--font-number); font-size: 12px; font-weight: 650; }

    .library-tools { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 9px; margin-bottom: 17px; }
    .filter-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: rgb(255 255 255 / 6%); cursor: pointer; }
    .filter-button svg { width: 20px; height: 20px; fill: none; stroke: #a1a2aa; stroke-linecap: round; stroke-width: 1.7; }
    .library-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
    .library-card { min-width: 0; overflow: hidden; padding: 0 0 10px; border: 1px solid rgb(255 255 255 / 7%); border-radius: 17px; background: rgb(16 16 18 / 78%); }
    .library-card .cover-art { width: 100%; height: 109px; border-radius: 16px 16px 10px 10px; }
    .library-card strong { display: block; overflow: hidden; margin: 9px 10px 3px; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .library-card span { margin: 0 10px; color: #8c8d94; font-size: 9px; }

    .profile-tools { display: flex; justify-content: flex-end; gap: 5px; margin-bottom: 21px; }
    .icon-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
    .icon-button svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .profile-identity { display: flex; flex-direction: column; align-items: center; margin-bottom: 23px; text-align: center; }
    .profile-avatar { width: 76px; height: 76px; margin-bottom: 12px; background: linear-gradient(145deg, #76524a, #342a3d); }
    .profile-avatar.real-avatar { display: block; }
    .profile-name-row { display: flex; align-items: center; gap: 8px; }
    .profile-name-row h1 { margin: 0; font-size: 19px; font-weight: 650; }
    .member-chip { padding: 5px 9px; border: 1px solid rgb(255 218 123 / 22%); border-radius: 100px; background: rgb(255 204 67 / 13%); color: #ffda79; font-size: 10px; }
    .profile-uid { margin: 7px 0 0; color: var(--text-muted); font-family: var(--font-number); font-size: 11px; }

    .profile-card {
      width: 100%;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid rgb(255 255 255 / 11%);
      border-radius: 19px;
      background: linear-gradient(145deg, rgb(35 49 57 / 90%), rgb(20 20 27 / 88%));
      backdrop-filter: blur(16px);
    }

    .platform-card { margin-bottom: 14px; padding: 14px 16px; border: 1px solid rgb(255 255 255 / 9%); border-radius: 18px; background: rgb(28 34 40 / 74%); }
    .platform-head { display: flex; align-items: center; justify-content: space-between; }
    .platform-head strong { font-size: 14px; }
    .platform-head span { padding: 3px 7px; border-radius: 100px; background: rgb(51 216 164 / 10%); color: var(--brand-green); font-size: 9px; }
    .platform-stats { display: grid; grid-template-columns: repeat(2, 1fr); margin-top: 13px; }
    .platform-stats div { color: #fff; font-family: var(--font-number); font-size: 17px; font-weight: 650; text-align: center; }
    .platform-stats div + div { border-left: 1px solid rgb(255 255 255 / 10%); }
    .platform-stats small { display: block; margin-top: 3px; color: var(--text-muted); font-family: var(--font-primary); font-size: 9px; font-weight: 400; }
    .profile-promo { width: 100%; height: 60px; margin-bottom: 14px; border: 1px solid rgb(255 255 255 / 11%); border-radius: 16px; }

    .member-banner { display: flex; min-height: 92px; align-items: center; gap: 12px; padding: 16px; }
    .member-emblem { display: grid; width: 50px; height: 50px; flex: 0 0 auto; place-items: center; border-radius: 16px; background: linear-gradient(145deg, #ffe29c, #a97224); color: #2b210e; }
    .member-emblem svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .member-copy { min-width: 0; flex: 1; }
    .member-copy strong { display: block; font-size: 15px; }
    .member-copy p { margin: 5px 0 0; color: var(--text-muted); font-size: 10px; }
    .member-action-label { min-width: 58px; padding: 7px 9px; border: 1px solid rgb(255 218 123 / 24%); border-radius: 100px; color: #ffda79; font-size: 9px; text-align: center; }
    .chevron { width: 18px; height: 18px; fill: none; stroke: #bbbcc2; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }

    .profile-menu { display: grid; gap: 1px; margin-bottom: 15px; overflow: hidden; border: 1px solid rgb(255 255 255 / 9%); border-radius: 18px; background: rgb(24 24 29 / 82%); }
    .profile-menu button { display: grid; min-height: 58px; grid-template-columns: 38px minmax(0, 1fr) 18px; align-items: center; gap: 10px; padding: 0 15px; border: 0; border-bottom: 1px solid rgb(255 255 255 / 7%); background: transparent; cursor: pointer; text-align: left; }
    .profile-menu button:last-child { border-bottom: 0; }
    .menu-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: rgb(255 255 255 / 6%); color: #d5d6da; }
    .menu-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .menu-copy strong { display: block; font-size: 13px; font-weight: 550; }
    .menu-copy small { display: block; margin-top: 3px; color: var(--text-muted); font-size: 9px; }

    .ranking-head { display: flex; align-items: end; justify-content: space-between; margin: 4px 0 19px; }
    .ranking-head h1 { margin: 0; font-size: 28px; }
    .ranking-head p { margin: 0 0 3px; color: var(--text-muted); font-size: 10px; }
    .ranking-list { display: grid; gap: 10px; }
    .ranking-row { display: grid; min-height: 78px; grid-template-columns: 30px 58px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid rgb(255 255 255 / 7%); border-radius: 16px; background: rgb(255 255 255 / 4%); }
    .rank-number { color: var(--brand-gold); font-family: var(--font-number); font-size: 20px; font-style: italic; font-weight: 700; }
    .ranking-row .cover-art { width: 58px; height: 58px; }
    .ranking-row strong { display: block; font-size: 13px; }
    .ranking-row small { color: var(--text-muted); font-size: 9px; }

    .subpage-head { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .back-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: rgb(255 255 255 / 6%); cursor: pointer; }
    .back-button svg { width: 21px; height: 21px; fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .subpage-head h1 { margin: 0; font-size: 21px; }
    .stub-panel { display: grid; min-height: 420px; place-items: center; padding: 28px; border: 1px solid rgb(255 255 255 / 9%); border-radius: 20px; background: rgb(255 255 255 / 4%); text-align: center; }
    .stub-panel svg { width: 64px; height: 64px; margin-bottom: 18px; fill: none; stroke: rgb(255 255 255 / 56%); stroke-width: 1.35; }
    .stub-panel h2 { margin: 0 0 7px; font-size: 18px; }
    .stub-panel p { max-width: 240px; margin: 0; color: var(--text-muted); font-size: 12px; line-height: 19px; }

    .portrait-content--subpage { padding-bottom: 96px; }
    .portrait-content--plain { padding-bottom: 24px; }
    .portrait-fixed-footer {
      position: absolute;
      z-index: 12;
      right: 8px;
      bottom: 8px;
      left: 8px;
      display: flex;
      min-height: 74px;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 22px;
      background: rgb(27 27 31 / 92%);
      box-shadow: 0 -12px 34px rgb(0 0 0 / 38%);
      backdrop-filter: blur(20px);
    }
    .portrait-fixed-footer .footer-summary { min-width: 0; flex: 1; }
    .portrait-fixed-footer .footer-summary strong { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .portrait-fixed-footer .footer-summary span { display: block; margin-top: 4px; color: var(--text-muted); font-size: 9px; }
    .portrait-fixed-footer .primary-action { min-width: 150px; }
    .primary-action:disabled { background: #353d4e; box-shadow: none; color: #868991; cursor: not-allowed; }

    const MEMBER_FAQ = Object.freeze([

      { topic: 'support', question: '需要客服协助时怎么办？', answer: '遇到登录、启动、存档或支付异常，可在订单详情发起客服协助，并保留订单号和问题截图。' },

    const MEMBERSHIP_STATUS_MODELS = Object.freeze({

      'monthly-active': { title: '月度会员', detail: '有效期至 2026.09.03', actionLabel: '续费', chip: '月度会员' },

    });

    function cloneOrder(order) {
      return JSON.parse(JSON.stringify(order));
    }

    function nextOrderId(timestamp) {
      lastOrderNumber = Math.max(timestamp, lastOrderNumber + 1);
      return `APP-${lastOrderNumber}`;
    }

    function resolveAction(input) {
      if (input.imported) return { primary: 'launch', secondary: [] };
      if (input.owns && input.installed) return { primary: 'launch', secondary: [] };
      if (input.owns) return { primary: 'download', secondary: [] };
      if (input.permanentEntitlement) return { primary: 'launch', secondary: [] };
      if (input.activeRental) return { primary: 'continue', secondary: ['credential', 'renew'] };
      if (!input.memberLibrary) return { primary: 'rent-2h', secondary: ['more-duration'] };
      if (input.membershipActive) return { primary: 'member-play', secondary: ['membership-status'] };
      if (input.trialEligible) return { primary: 'trial', secondary: ['permanent', 'membership'] };
      return { primary: 'permanent', secondary: ['membership'] };
    }

    function resolveCurrentAction() {
      return resolveAction(SCENARIOS[state.scenario]);
    }

    function normalizeSkuForScenario() {
      const { primary } = resolveCurrentAction();
      state.selectedSku = {
        launch: 'launch',
        download: 'download',
        continue: 'continue',
        'rent-2h': 'rent-2h',
        trial: 'trial',
        permanent: 'permanent',
        'member-play': 'member-play',
      }[primary] || 'rent-2h';
      state.moreDurationOpen = false;
    }

    function getSelectedGame() {
      return MEMBER_GAMES.find(({ id }) => id === state.selectedGameId) || MEMBER_GAMES[0];
    }

    function getMembershipStatusModel() {
      return MEMBERSHIP_STATUS_MODELS[state.membershipStatus] || MEMBERSHIP_STATUS_MODELS.none;
    }

    function setMembershipStatus(value) {
      state.membershipStatus = MEMBERSHIP_STATUS_MODELS[value] ? value : 'none';
      renderApp();
      return state.membershipStatus;
    }

    function getDetailModel() {
      const action = resolveCurrentAction();
      const labels = {
        launch: '启动游戏',
        download: '下载游戏',
        continue: '继续游戏',
        'rent-2h': '2小时租用',
        'more-duration': '更多租期',
        trial: '首次体验',
        permanent: '单游戏永久畅玩',
        membership: '开通会员',
        'member-play': '会员畅玩',
      };
      const optionIds = [action.primary, ...action.secondary]
        .filter((id) => !['credential', 'renew', 'membership-status'].includes(id));
      return {
        action,
        options: optionIds.map((id) => ({ id, label: labels[id] })),
        labels,
      };
    }

    function getSelectedOffer() {
      if (state.selectedSku === 'rent-2h') return { sku: 'rent-2h', durationLabel: '2小时', amount: 9.9 };
      const hourly = /^hourly-(\d+)h$/.exec(state.selectedSku);
      if (hourly) {
        const hours = Number(hourly[1]);
        return { sku: state.selectedSku, durationLabel: `${hours}小时`, amount: Number((hours * 4.5).toFixed(2)) };
      }
      if (state.selectedSku === 'daily') return { sku: 'daily', durationLabel: '日租（24小时）', amount: 29.9 };
      if (state.selectedSku === 'weekly') return { sku: 'weekly', durationLabel: '周租（7天）', amount: 99 };
      if (state.selectedSku === 'trial') return { sku: 'trial', durationLabel: '首次体验（2小时）', amount: 1.99 };
      if (state.selectedSku === 'permanent') return { sku: 'permanent', durationLabel: '单游戏永久畅玩', amount: 168 };
      return { sku: state.selectedSku, durationLabel: '当前权益', amount: 0 };
    }

    function selectRentalSku(sku) {
      state.selectedSku = sku;
      const hourly = /^hourly-(\d+)h$/.exec(sku);
      if (hourly) state.selectedHours = Number(hourly[1]);
      if (state.order?.status === 'pending') state.order = null;
      renderApp();
      return state.selectedSku;
    }

    function toggleMoreDuration(force) {
      state.moreDurationOpen = typeof force === 'boolean' ? force : !state.moreDurationOpen;
      renderApp();
      return state.moreDurationOpen;
    }

    function createOrder({ sku, amount, priceVersion, ...snapshot }) {
      if (state.order && NON_TERMINAL_ORDER_STATUSES.has(state.order.status)) return null;
      const createdAt = Date.now();
      const game = getSelectedGame();
      const offer = getSelectedOffer();
      state.order = {
        gameId: game.id,
        gameName: game.name,
        version: `${state.selectedVersion}版本`,
        durationLabel: offer.durationLabel,
        gameOriginalPrice: 298,
        paymentMethod: state.selectedPayment,
        ...snapshot,
        id: nextOrderId(createdAt),
        status: 'pending',
        createdAt,
        sku,
        amount,
        priceVersion,
        paymentDeadline: createdAt + 30 * 60 * 1000,
      };
      renderApp();
      return cloneOrder(state.order);
    }

    function ensureGameOrder() {
      const offer = getSelectedOffer();
      if (state.order && NON_TERMINAL_ORDER_STATUSES.has(state.order.status)) return cloneOrder(state.order);
      const game = getSelectedGame();
      return createOrder({
        sku: offer.sku,
        amount: offer.amount,
        priceVersion: 'APP-PRICE-2026-08-03',
        gameId: game.id,
        gameName: game.name,
        version: `${state.selectedVersion}版本`,
        durationLabel: offer.durationLabel,
        gameOriginalPrice: 298,
        paymentMethod: state.selectedPayment,
      });
    }

    function createMembershipOrder() {
      if (state.membershipOrder?.status === 'pending') return cloneOrder(state.membershipOrder);
      const plan = MEMBER_PLANS.find(({ id }) => id === state.memberPlan) || MEMBER_PLANS[0];
      const createdAt = Date.now();
      lastMembershipOrderNumber = Math.max(createdAt, lastMembershipOrderNumber + 1);
      state.membershipOrder = {
        id: `MEMBER-${lastMembershipOrderNumber}`,
        status: 'pending',
        planId: plan.id,
        planName: plan.name,
        amount: plan.price,
        originalAmount: plan.original,
        paymentMethod: state.memberPayment,
        createdAt,
      };
      renderApp();
      return cloneOrder(state.membershipOrder);
    }

    function formatCountdown(deadline) {
      const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      const minutes = Math.floor(seconds / 60);
      return `${String(minutes).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function setInventoryAvailable(value) {
      state.inventoryAvailable = Boolean(value);
      renderApp();
    }

    function setPriceChanged(value) {
      state.priceChanged = Boolean(value);
      if (state.priceChanged && state.order) state.screen = 'checkout';
      renderApp();
    }

    function navigate(screen) {
      if (screen === 'checkout') ensureGameOrder();
      if (screen === 'orders') ensureSelectedOrder();
      state.screen = screen;
      renderApp();

    function payOrder() {
      if (!state.order || state.order.status !== 'pending') return false;
      state.order.status = 'allocating';
      renderApp();
      return true;
    }

    function allocateAccount(success = true) {
      if (!state.order || state.order.status !== 'allocating') return false;
      state.order.status = success ? 'active' : 'refunding';
      if (success) state.accountAllocationCount += 1;
      renderApp();
      return true;

    function ensureScenarioOrder(scenario = state.scenario) {
      if (scenario !== 'active-rental') return null;
      state.order = {
        ...ORDER_FIXTURES[0],
        id: 'APP-SCENARIO-ACTIVE',
        sku: 'hourly-8h',
        priceVersion: 'APP-PRICE-2026-08-03',
        paymentMethod: 'alipay',

      state.selectedOrderId = state.order.id;
      state.accountAllocationCount = 1;
      if (!state.rentalUsage || state.rentalUsage.expiryHandled) {
        const now = Date.now();
        state.rentalUsageSequence += 1;
        state.serverTime = now;
        state.rentalUsage = {
          id: `USAGE-APP-SCENARIO-ACTIVE-${state.rentalUsageSequence}`,
          orderId: state.order.id,
          expireAt: now + 8 * 60 * 60 * 1000,
          sessionActive: true,
          rentalSessionRevoked: false,
          shortAuthValid: true,
          accountReleased: false,
          packageInstalled: true,
          expiryHandled: false,
          expiryExecutionCount: 0,
          accountReleaseCount: 0,
          takeover: null,
        };
        state.expiryReminderOpen = false;
        state.expiredLaunchDialogOpen = false;
        state.postRentalEntitlement = null;
      }
      return cloneOrder(state.order);
    }

    function getOrderCollection() {
      const fixtures = ORDER_FIXTURES.map(cloneOrder);
      if (!state.order) return fixtures;
      let index = fixtures.findIndex(({ id }) => id === state.order.id);
      if (index < 0) index = fixtures.findIndex(({ status }) => status === state.order.status);
      if (index >= 0) fixtures.splice(index, 1);
      return [cloneOrder(state.order), ...fixtures];
    }

    function getFilteredOrders() {
      const orders = getOrderCollection();
      if (state.orderTab === 'renting') return orders.filter(({ status }) => ['allocating', 'active'].includes(status));
      if (state.orderTab === 'pending') return orders.filter(({ status }) => status === 'pending');
      return orders;
    }

    function ensureSelectedOrder() {
      const orders = getFilteredOrders();
      if (!orders.some(({ id }) => id === state.selectedOrderId)) {
        state.selectedOrderId = orders.find(({ status }) => status === 'active')?.id || orders[0]?.id || null;
      }
      return state.selectedOrderId;
    }

    function getSelectedOrder() {
      ensureSelectedOrder();
      return getOrderCollection().find(({ id }) => id === state.selectedOrderId) || null;
    }

    function selectOrder(orderId) {
      if (!getOrderCollection().some(({ id }) => id === orderId)) return false;
      state.selectedOrderId = orderId;
      if (state.orientation === 'portrait') state.screen = 'order-detail';
      renderApp();
      return true;
    }

    function openLoginMethod() {
      if (getSelectedOrder()?.status !== 'active') return false;
      state.loginMethodOpen = true;
      state.oneClickStatus = 'idle';
      renderApp();
      return true;
    }

    function closeLoginMethod() {
      state.loginMethodOpen = false;

    function startOneClickLogin() {
      if (!state.loginMethodOpen || getSelectedOrder()?.status !== 'active') return false;
      state.oneClickStatus = 'failed';
      renderApp();
      return true;

    function openManualLogin() {
      if (getSelectedOrder()?.status !== 'active') return false;
      state.loginMethodOpen = false;

      state.screen = 'steam-login';

    function openCredentialPanel() {
      if (getSelectedOrder()?.status !== 'active') return false;
      state.credentialPanelOpen = true;
      state.credentialAccountVisible = false;
      state.credentialPasswordVisible = false;
      renderApp();
      return true;
    }

    function closeCredentialPanel() {
      state.credentialPanelOpen = false;
      state.credentialAccountVisible = false;
      state.credentialPasswordVisible = false;
      renderApp();
    }

    function toggleCredential(field) {
      if (field === 'account') state.credentialAccountVisible = !state.credentialAccountVisible;
      if (field === 'password') state.credentialPasswordVisible = !state.credentialPasswordVisible;
      renderApp();
    }

    function showToast(message) {
      state.toast = message;
      renderApp();
      setTimeout(() => {
        if (state.toast !== message) return;
        state.toast = null;
        document.querySelector('#appRentalDemo .demo-toast')?.remove();
      }, 1800);
    }

    function copyCredential(field) {
      if (!['account', 'password'].includes(field)) return false;
      const value = RENTAL_CREDENTIAL[field];
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(value).catch(() => {});
      showToast(`${field === 'account' ? '账号' : '密码'}已复制`);
      return true;
    }

    function submitSteamLogin() {
      if (!state.steamForm.account.trim() || !state.steamForm.password) {
        showToast('请输入 Steam 账号和密码');
        return false;
      }
      state.steamForm.submitted = true;
      state.steamForm.requiresGuard = true;
      renderApp();
      return true;
    }

    function guardRemainingSeconds() {
      if (!state.guardCode || !state.guardExpiresAt) return 0;
      return Math.max(0, Math.ceil((state.guardExpiresAt - Date.now()) / 1000));
    }

    function requestGuardCode() {
      if (getSelectedOrder()?.status !== 'active' || !state.steamForm.requiresGuard) return false;
      if (!state.guardCode || guardRemainingSeconds() <= 0) return refreshGuardCode();
      renderApp();
      return true;
    }

    function refreshGuardCode() {
      if (getSelectedOrder()?.status !== 'active' || !state.steamForm.requiresGuard) return false;
      state.guardCode = '48291';
      state.guardExpiresAt = Date.now() + 30 * 1000;
      state.guardIssued = true;
      renderApp();
      return true;
    }

    function copyGuardCode() {
      if (!state.guardCode || guardRemainingSeconds() <= 0) return false;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(state.guardCode).catch(() => {});
      showToast('验证码已复制');
      return true;
    }

    function expireGuardCode() {
      if (!state.guardCode && !state.guardIssued) return false;
      state.guardCode = null;
      state.guardExpiresAt = null;
      renderApp();
      return true;
    }

    function wipeSensitiveState({ clearAccount = false, closePanels = true } = {}) {
      state.guardCode = null;
      state.guardExpiresAt = null;
      state.guardIssued = false;
      if (clearAccount) state.steamForm.account = '';
      state.steamForm.password = '';
      state.steamForm.submitted = false;
      state.steamForm.requiresGuard = false;
      state.credentialAccountVisible = false;
      state.credentialPasswordVisible = false;
      if (closePanels) {
        state.credentialPanelOpen = false;
        state.steamHelpOpen = false;
        state.loginMethodOpen = false;
      }
    }

    function clearSensitiveState(reason = 'manual') {
      wipeSensitiveState({ clearAccount: ['order-ended', 't0', 'after-sales'].includes(reason), closePanels: true });
      renderApp();
      return true;
    }

    function endOrder() {
      if (!state.order || state.order.status !== 'active') return false;
      state.order.status = 'ended';
      clearSensitiveState('order-ended');
      return true;
    }

    function setGameplayContext(value) {
      state.gameplayContext = Boolean(value);
      renderApp();
      return state.gameplayContext;
    }

    function resolvePostRentalEntitlement() {
      if (['personal-owned', 'permanent', 'membership'].includes(state.postRentalEntitlement)) return state.postRentalEntitlement;
      if (['owned-installed', 'owned-uninstalled', 'permanent-owned'].includes(state.scenario)) return 'personal-owned';
      if (['monthly-active', 'annual-active', 'permanent'].includes(state.membershipStatus) || state.scenario === 'active-member') return 'membership';
      return null;
    }

    function setPostRentalEntitlement(value) {
      state.postRentalEntitlement = ['personal-owned', 'permanent', 'membership'].includes(value) ? value : null;
      renderApp();
      return state.postRentalEntitlement;
    }

    function handleRentalT0() {
      const usage = state.rentalUsage;
      if (!usage || usage.expiryHandled || state.serverTime < usage.expireAt) return false;
      usage.expiryHandled = true;
      usage.expiryExecutionCount += 1;
      usage.rentalSessionRevoked = true;
      usage.shortAuthValid = false;
      usage.accountReleased = true;
      usage.accountReleaseCount += 1;
      state.expiryReminderOpen = false;
      if (state.order) state.order.status = 'ended';
      wipeSensitiveState({ clearAccount: true, closePanels: true });
      const takeover = resolvePostRentalEntitlement();
      usage.takeover = takeover;
      usage.sessionActive = Boolean(takeover);
      state.expiredLaunchDialogOpen = !takeover;
      state.expiredLaunchReason = 'ended';
      state.screen = takeover ? 'detail' : 'order-detail';
      renderApp();
      return true;
    }

    function triggerExpiryMinutes(minutes) {
      if (!state.rentalUsage || !Number.isFinite(Number(minutes))) return false;
      const numericMinutes = Number(minutes);
      state.serverTime = state.rentalUsage.expireAt - Math.max(0, numericMinutes) * 60 * 1000;
      if (numericMinutes <= 0) return handleRentalT0();
      const alreadyShown = state.remindedUsageIds.includes(state.rentalUsage.id);
      if (numericMinutes === 15 && !alreadyShown) {
        state.remindedUsageIds.push(state.rentalUsage.id);
        state.expiryReminderCount += 1;
        state.expiryReminderOpen = true;
      }
      renderApp();
      return state.expiryReminderOpen;
    }

    function closeExpiryReminder() {
      state.expiryReminderOpen = false;
      renderApp();
      return true;
    }

    function continueFromExpiryReminder() {
      state.expiryReminderOpen = false;
      state.screen = 'detail';
      renderApp();
      return true;
    }

    function setLaunchVerification(value) {
      state.launchVerification = value === 'offline' ? 'offline' : 'online';
      renderApp();
      return state.launchVerification;
    }

    function attemptLaunchAfterExpiry() {
      if (!state.rentalUsage?.expiryHandled) return false;
      if (state.launchVerification !== 'online') {
        state.expiredLaunchDialogOpen = true;
        state.expiredLaunchReason = 'network';
        renderApp();
        return false;
      }
      const takeover = resolvePostRentalEntitlement();
      if (!takeover) {
        state.expiredLaunchDialogOpen = true;
        state.expiredLaunchReason = 'ended';
        state.rentalUsage.sessionActive = false;
        renderApp();
        return false;
      }
      state.rentalUsage.takeover = takeover;
      state.rentalUsage.sessionActive = true;
      state.expiredLaunchDialogOpen = false;
      state.screen = 'detail';
      renderApp();
      return true;
    }

    function recheckEntitlement() {
      return attemptLaunchAfterExpiry();
    }

      state.expiredLaunchDialogOpen = false;
      state.screen = 'orders';
      renderApp();
      return true;

      const order = getSelectedOrder();
      if (!order || !['active', 'refunding'].includes(order.status)) return false;
      if (state.afterSalesDraft.orderId !== order.id) {

        state.afterSalesOrder = null;

      if (state.afterSalesOrder?.orderId === state.afterSalesDraft.orderId) return cloneOrder(state.afterSalesOrder);
      if (!state.afterSalesDraft.orderId || !state.afterSalesDraft.description.trim()) {

      state.afterSalesOrder = {
        id: `AFTER-${state.afterSalesDraft.orderId}`,

        type: state.afterSalesDraft.type,
        description: state.afterSalesDraft.description.trim(),
        status: 'submitted',
        refundProgress: state.afterSalesDraft.type === 'refund' ? ['申请中', '人工审核', '原路退款', '完成'] : [],

      const order = getOrderCollection().find(({ id }) => id === state.afterSalesDraft.orderId) || getSelectedOrder();
      if (!order) return false;
      wipeSensitiveState({ clearAccount: true, closePanels: true });
      if (!state.afterSalesInventoryAvailable) {

          orderId: order.id,
          gameId: order.gameId,
          version: order.version,
          originalBindingPreserved: true,

      state.replacementRequest = {

      };
      renderApp();

    function realCrop(assetKey, crop, alt, label = '', className = 'cover-art') {
      const [sourceWidth, sourceHeight] = ASSET_SIZES[assetKey];
      const [x, y, width, height] = crop;
      return `<span class="real-media ${className}"><img data-real-asset="true" data-source-screen="${assetKey}" data-source-width="${sourceWidth}" data-source-height="${sourceHeight}" data-crop-x="${x}" data-crop-y="${y}" data-crop-width="${width}" data-crop-height="${height}" src="${ASSETS[assetKey]}" alt="${alt}" draggable="false">${label ? `<small>${label}</small>` : ''}</span>`;
    }

    function applyRealCrops(root) {
      root.querySelectorAll('img[data-real-asset="true"]').forEach((image) => {
        const frame = image.parentElement.getBoundingClientRect();
        const sourceWidth = Number(image.dataset.sourceWidth);
        const sourceHeight = Number(image.dataset.sourceHeight);
        const cropX = Number(image.dataset.cropX);
        const cropY = Number(image.dataset.cropY);
        const cropWidth = Number(image.dataset.cropWidth);
        const cropHeight = Number(image.dataset.cropHeight);
        const scale = Math.max(frame.width / cropWidth, frame.height / cropHeight);
        const renderedWidth = sourceWidth * scale;
        const renderedHeight = sourceHeight * scale;
        const cropCenterX = (cropX + cropWidth / 2) * scale;
        const cropCenterY = (cropY + cropHeight / 2) * scale;
        image.style.width = `${renderedWidth}px`;
        image.style.height = `${renderedHeight}px`;
        image.style.left = `${frame.width / 2 - cropCenterX}px`;
        image.style.top = `${frame.height / 2 - cropCenterY}px`;
      });
    }

    function renderSkuOptions(model) {
      const passive = new Set(['launch', 'download', 'continue', 'member-play']);
      if (model.options.length === 1 && passive.has(model.options[0].id)) {
        return `<div class="sku-card selected"><span><strong>${model.options[0].label}</strong><small>当前权益已确认</small></span><span class="member-chip">可用</span></div>`;
      }
      const notes = {
        'rent-2h': '轻量体验，即买即玩',
        'more-duration': '3–23小时、日租与周租',
        trial: '会员库游戏首次专享价',
        permanent: '当前游戏长期畅玩',
        membership: '进入会员中心选择套餐',
      };
      return model.options.map(({ id, label }) => {
        const action = id === 'more-duration' ? 'toggle-more-duration' : id === 'membership' ? 'navigate' : 'select-sku';
        const extra = id === 'membership' ? 'data-screen="membership"' : id === 'more-duration' ? '' : `data-sku="${id}"`;
        const selected = state.selectedSku === id;
        return `<button class="sku-card ${selected ? 'selected' : ''}" type="button" data-action="${action}" ${extra}><span><strong>${label}</strong><small>${notes[id]}</small></span><span>${id === 'trial' ? '¥1.99' : id === 'permanent' ? '¥168' : id === 'rent-2h' ? '¥9.90' : '›'}</span></button>`;
      }).join('');
    }

    function renderDurationOptions() {
      if (!state.moreDurationOpen) return '';
      const hours = Array.from({ length: 21 }, (_, index) => index + 3);
      return `<div class="duration-grid" aria-label="更多租期">
        ${hours.map((value) => `<button class="${state.selectedSku === `hourly-${value}h` ? 'selected' : ''}" type="button" data-action="select-sku" data-sku="hourly-${value}h" data-duration-hours="${value}">${value}小时</button>`).join('')}

        <button class="${state.selectedSku === 'weekly' ? 'selected' : ''}" type="button" data-action="select-sku" data-sku="weekly">周租</button>
      </div>`;
    }

    function detailPrimaryMeta() {
      const model = getDetailModel();
      const { primary } = model.action;
      if (primary === 'launch') return { label: '启动游戏', action: 'feedback', summary: '当前游戏已可启动' };
      if (primary === 'download') return { label: '下载游戏', action: 'feedback', summary: '下载完成后即可启动' };
      if (primary === 'continue') return { label: '继续游戏', action: 'navigate', screen: 'orders', summary: '租用权益生效中' };
      if (primary === 'member-play') return { label: '会员畅玩', action: 'feedback', summary: '畅玩会员权益生效中' };

    function renderOrderCard(order) {
      const meta = ORDER_STATUS_META[order.status] || ORDER_STATUS_META.ended;

        <span class="order-card-copy"><strong>${order.gameName}</strong><span>${order.durationLabel} · ¥${Number(order.amount).toFixed(2)}</span><small>${meta.note}</small></span>
        <span class="order-status-chip" data-tone="${meta.tone}">${meta.label}</span>
      </button>`;

    function renderOrderProgress(order) {
      const steps = ['提交订单', '完成支付', '分配账号', '开始畅玩'];
      const current = { pending: 0, allocating: 2, active: 3, refunding: 2, ended: 4 }[order.status] ?? 0;
      return `<div class="order-progress" aria-label="订单四步进度">${steps.map((label, index) => {
        const done = index < current || order.status === 'ended';
        const active = index === current && order.status !== 'ended';
        return `<div class="order-progress-step ${done ? 'done' : active ? 'current' : ''}" data-progress-step="${index + 1}"><span class="order-progress-dot">✓</span><span>${label}</span></div>`;
      }).join('')}</div>`;

      const refundProgress = ticket.type === 'refund'
        ? `<div class="refund-progress" aria-label="退款进度">${ticket.refundProgress.map((label) => `<span>${label}</span>`).join('')}</div>`
        : '';
      let replacementStatus = '';
      if (replacement?.status === 'no-stock') {
        replacementStatus = '<div class="replacement-status"><p>暂无同游戏同版本账号，已保留原绑定，不会影响当前售后处理。</p><div class="replacement-actions"><button type="button" data-action="contact-support">联系客服</button><button class="replacement-primary" type="button" data-action="request-replacement">重试换号</button></div></div>';
      } else if (replacement?.status === 'success') {
        replacementStatus = `<div class="replacement-status"><p>换号成功，已匹配同游戏同版本账号：${replacement.version}。</p><div class="replacement-actions"><button type="button" data-action="contact-support">联系客服</button><button class="replacement-primary" type="button" data-action="back-to-orders">查看订单</button></div></div>`;
      }
      return `<div class="after-sales-result"><div class="after-sales-result-card"><strong>售后单 ${ticket.id} 已提交</strong><br>我们会保留订单信息并同步处理进度。</div>${refundProgress}<section class="replacement-box"><h3>账号异常处理</h3><p>如登录或启动问题仍未解决，可申请同游戏同版本换号。</p>${replacementStatus || '<div class="replacement-actions"><button type="button" data-action="contact-support">联系客服</button><button class="replacement-primary" type="button" data-action="request-replacement">申请换号</button></div>'}</section></div>`;
    }

            ['荒野大镖客：救赎 2', [1926, 297, 397, 224], 'landscapeLibrary'],
          ],
        },
        retro: {
          recent: [
            ['茶杯头', [1049, 753, 390, 216], 'landscapeLibrary'],
            ['星露谷物语', [1049, 753, 390, 216], 'landscapeSteamLibrary'],
          ],
          hot: [
            ['饥荒', [1926, 297, 397, 224], 'landscapeSteamLibrary'],
            ['Human Multiplayer Game', [326, 1260, 220, 250], 'home'],
            ['Drillbert', [828, 1260, 215, 250], 'home'],
            ['小小梦魇 2', [169, 753, 383, 216], 'landscapeSteamLibrary'],
          ],
        },
      };
      const { recent: recentGames, hot: hotGames } = playCatalogs[state.playTab] || playCatalogs.cloud;
      return `<section class="landscape-play">
        <div class="landscape-play-toolbar"><div class="landscape-play-tabs" role="tablist">${[['cloud', '云游戏'], ['pc', 'PC游戏'], ['retro', '复古游戏']].map(([value, label]) => `<button type="button" role="tab" aria-selected="${state.playTab === value}" class="${state.playTab === value ? 'active' : ''}" data-action="set-tab" data-group="playTab" data-value="${value}">${label}</button>`).join('')}</div><span class="rent-badge">会员游戏库已同步</span></div>
        <div class="landscape-play-grid">
          <section class="landscape-panel landscape-benefit"><div class="landscape-user-line">${realCrop('profile', [482, 302, 156, 158], '盖世玩家头像', '', 'avatar-small')}<div><strong>盖世玩家 0525</strong><span>${state.scenario === 'active-member' ? '畅玩会员生效中' : '登录后同步完整权益'}</span></div></div><h2>你的${tabLabel}权益</h2><div class="benefit-list"><span>极速启动，无需等待下载</span><span>支持云端存档与手柄</span><span>会员库游戏优先畅玩</span></div><button class="primary-action" type="button" data-primary-action="true" data-action="feedback">进入${tabLabel}</button></section>
          <section class="landscape-panel landscape-recent"><div class="landscape-section-title"><h2>最近常玩</h2><span>继续游戏</span></div><div class="landscape-recent-list">${recentGames.map(([name, crop, asset]) => `<article class="landscape-recent-item">${realCrop(asset, crop, `${name} 最近常玩封面`, '', 'landscape-cover')}<div><strong>${name}</strong><small>上次游玩 23 分钟前</small></div></article>`).join('')}</div></section>
          <section class="landscape-panel landscape-hot"><div class="landscape-section-title"><h2>人气热游</h2><span>全部游戏</span></div><div class="landscape-hot-wall">${hotGames.map(([name, crop, asset]) => `<article class="landscape-hot-card">${realCrop(asset, crop, `${name} 热游封面`, '', 'landscape-cover')}<strong>${name}</strong></article>`).join('')}</div></section>
        </div>
      </section>`;
    }

    function renderLandscapeProfile() {
      const membership = getMembershipStatusModel();
      return `<section class="landscape-profile">
        <aside class="landscape-profile-user">${realCrop('profile', [482, 302, 156, 158], '盖世玩家用户头像', '', 'profile-avatar real-avatar')}<h1>盖世玩家 0525</h1><span class="member-chip">${membership.chip}</span><p class="profile-uid">UID GH20260525</p><div class="landscape-profile-stats"><div><strong>110h</strong><span>累计游玩</span></div><div><strong>26</strong><span>游戏数量</span></div></div></aside>
        <div class="landscape-profile-actions">
          <section class="landscape-member-card">${realCrop('profile', [46, 1341, 1024, 174], '会员权益活动横幅', '', 'landscape-member-art')}<div class="landscape-member-copy"><strong>${membership.title}</strong><p>${membership.detail}</p></div><button class="landscape-outline-button" type="button" data-action="navigate" data-screen="membership">${membership.actionLabel}</button></section>
          <section class="landscape-order-card"><span class="landscape-order-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><div class="landscape-order-copy"><strong>租号订单</strong><p>查看进行中订单、登录信息、续租与售后进度</p></div><button class="landscape-order-entry" type="button" data-action="navigate" data-screen="orders">查看订单<svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></section>
        </div>
      </section>`;
    }

    function renderLandscapeRanking() {
      const games = [
        ['Slay the Spire 2', [169, 297, 383, 224]],
        ['The Forest', [606, 297, 390, 224]],
        ['中国式家长', [1049, 297, 390, 224]],
        ['Spiritfarer', [1486, 297, 383, 224]],
        ['饥荒', [1926, 297, 397, 224]],
      ];
      return `<section class="landscape-ranking"><div class="landscape-ranking-head"><div><h1>排行榜</h1><span class="profile-uid">本周玩家热度</span></div><span class="rent-badge">实时更新</span></div><div class="landscape-ranking-wall">${games.map(([name, crop], index) => `<article class="landscape-ranking-card"><span class="rank-number">${index + 1}</span>${realCrop('landscapeSteamLibrary', crop, `${name} 排行榜封面`, '', 'landscape-cover')}<strong>${name}</strong><small>${9864 - index * 741} 人正在玩</small></article>`).join('')}</div></section>`;
    }

    function renderLandscapeDetail() {
      const game = getSelectedGame();
      const model = getDetailModel();
      const meta = detailPrimaryMeta();
      return `<section class="landscape-detail" data-layout="landscape-detail">
        <article class="landscape-detail-game">${realCrop(game.asset, game.crop, `${game.name} 横屏详情主视觉`, '', 'landscape-detail-media')}<div class="landscape-detail-copy"><span class="rent-badge">Steam版本 · 支持手柄</span><h1>${game.name}</h1><p>沉浸式冒险体验，支持云端存档与多设备权益同步。</p><div class="landscape-detail-facts"><span>云端即开</span><span>正版账号</span><span>售后保障</span></div></div></article>
        <aside class="landscape-detail-benefits"><div class="detail-section-head"><h2>选择游戏权益</h2><span>已匹配账号状态</span></div><div class="sku-list">${renderSkuOptions(model)}</div>${model.action.primary === 'rent-2h' ? renderDurationOptions() : ''}<button class="primary-action" type="button" data-primary-action="true" data-action="${meta.action}" ${meta.screen ? `data-screen="${meta.screen}"` : ''}>${meta.label}</button></aside>
      </section>`;
    }

    function renderLandscapeCheckout() {
      const game = getSelectedGame();
      const order = state.order;
      if (!order) return '<section class="landscape-stub landscape-checkout"><div><h1>确认订单</h1><p>订单创建失败，请返回详情重新选择。</p></div></section>';
      const disabled = !state.inventoryAvailable;
      const processing = order.status !== 'pending';
      return `<section class="landscape-checkout" data-layout="landscape-checkout">
        <div class="landscape-checkout-main">${checkoutAlert()}<article class="checkout-product">${realCrop(game.asset, game.crop, `${order.gameName} 横屏订单封面`, '', 'checkout-cover')}<div><span class="rent-badge">${order.version}</span><h2>${order.gameName}</h2><p>订单号 ${order.id}</p></div></article><section class="checkout-panel"><div class="checkout-row"><span>套餐租期</span><strong>${order.durationLabel}</strong></div><div class="checkout-row game-original-row"><span class="price-label">游戏原价</span><strong class="game-original-amount">¥${order.gameOriginalPrice.toFixed(2)}</strong></div><div class="checkout-row total"><span>订单金额</span><strong class="order-total-amount">¥${order.amount.toFixed(2)}</strong></div></section></div>
        <aside class="landscape-checkout-side"><div class="detail-section-head"><h2>支付方式</h2><span class="countdown" data-countdown="${order.paymentDeadline}">${formatCountdown(order.paymentDeadline)}</span></div><div class="game-payment-layout"><div class="payment-list">${renderPaymentMethods()}</div>${renderGamePaymentQr()}</div>${renderCheckoutAgreement()}${renderCheckoutRecoveryActions() || `<button class="primary-action" type="button" data-primary-action="true" data-action="${state.priceChanged ? 'refresh-price' : 'pay-game-order'}" ${disabled || processing ? 'disabled' : ''}>${processing ? '支付处理中' : disabled ? '暂不可购买' : state.priceChanged ? '按新价格重新确认' : `确认支付 ¥${order.amount.toFixed(2)}`}</button>`}</aside>
      </section>`;
    }

    function renderLandscapeMembership() {
      const plan = MEMBER_PLANS.find(({ id }) => id === state.memberPlan) || MEMBER_PLANS[0];
      const created = state.membershipOrder?.status === 'pending';
      return `<section class="landscape-membership" data-layout="landscape-membership"><div class="landscape-membership-plans"><div class="detail-section-head"><h2>盖世畅玩会员</h2><button class="small-pill landscape-member-library-entry" type="button" data-action="navigate" data-screen="member-library">会员游戏库</button></div>${renderMembershipPlans()}</div><aside class="landscape-membership-pay">${created ? `<div class="state-alert">会员订单 ${state.membershipOrder.id} 已创建</div>` : ''}<div class="detail-section-head"><h2>${plan.name}会员 · ¥${plan.price}</h2><span>试运营优惠</span></div>${renderMembershipPayment()}<button class="primary-action" type="button" data-primary-action="true" data-action="create-membership-order" ${created ? 'disabled' : ''}>${created ? '订单已创建' : '确认支付'}</button></aside></section>`;
    }

    function renderLandscapeMemberLibrary() {
      return `<section class="landscape-member-library" data-layout="landscape-member-library"><div class="landscape-member-library-layout"><div><div class="detail-section-head"><h2>会员游戏库</h2><span>${MEMBER_GAMES.length}款本期精选</span></div>${renderMemberGameGrid()}</div><aside><div class="detail-section-head"><h2>常见问题</h2><span>FAQ</span></div>${renderMemberFaq()}</aside></div></section>`;
    }

    function renderLandscapeOrders() {
      ensureSelectedOrder();
      return `<section class="landscape-orders" data-layout="landscape-orders"><aside class="order-list-pane"><div class="order-page-head"><div><h1>租号订单</h1><p>订单状态与售后进度</p></div></div>${renderOrderTabs()}<div class="landscape-order-list">${getFilteredOrders().map(renderOrderCard).join('')}</div></aside><article class="order-detail-pane">${renderOrderDetailBody(getSelectedOrder())}</article></section>`;
    }

    function renderLandscapeStub(screen) {
      const copy = { detail: ['游戏详情', '选择权益后继续订单流程。'], membership: ['会员中心', '查看会员套餐与会员游戏库。'], orders: ['租号订单', '查看待支付、进行中与已完成订单。'] }[screen] || ['功能页面', '当前入口已连通。'];
      return `<section class="landscape-stub landscape-${screen}"><div><h1>${copy[0]}</h1><p>${copy[1]}</p></div></section>`;
    }

    function renderLandscapeContent() {
      if (state.screen === 'home') return renderLandscapeHome();
      if (state.screen === 'play') return renderLandscapePlay();
      if (state.screen === 'library') return renderLandscapeLibrary();
      if (state.screen === 'profile') return renderLandscapeProfile();
      if (state.screen === 'ranking') return renderLandscapeRanking();
      if (state.screen === 'detail') return renderLandscapeDetail();
      if (state.screen === 'checkout') return renderLandscapeCheckout();
      if (state.screen === 'membership') return renderLandscapeMembership();
      if (state.screen === 'member-library') return renderLandscapeMemberLibrary();
      if (state.screen === 'orders' || state.screen === 'order-detail') return renderLandscapeOrders();
      if (state.screen === 'after-sales') return renderLandscapeAfterSales();
      if (state.screen === 'steam-login') return renderSteamLogin('landscape');
      return renderLandscapeStub(state.screen);
    }

    function renderLandscapeShell(content, active = 'library') {
      const nav = [['library', '游戏库'], ['play', '玩游戏'], ['home', '探索'], ['ranking', '排行榜'], ['profile', '我的']];
      return `<section class="device landscape">
        <header class="landscape-top-nav"><nav aria-label="横屏主导航">${nav.map(([id, label]) => `<button class="${active === id ? 'active' : ''}" type="button" data-action="navigate" data-screen="${id}" aria-current="${active === id ? 'page' : 'false'}">${icon(id)}<span>${label}</span></button>`).join('')}</nav>${landscapeSystem()}</header>
        <main class="landscape-content">${content}</main>
        ${renderGlobalOverlays()}
      </section>`;
    }

    function updateCountdownDisplay(root) {
      root.querySelectorAll('[data-countdown]').forEach((node) => {
        node.textContent = formatCountdown(Number(node.dataset.countdown));
      });
    }

    function updateGuardDisplays(root) {
      const remaining = guardRemainingSeconds();
      if (state.guardCode && remaining <= 0) {
        state.guardCode = null;
        state.guardExpiresAt = null;
        renderApp();
        return;
      }
      root.querySelectorAll('[data-guard-remaining]').forEach((node) => {
        node.dataset.guardRemaining = String(remaining);
        node.textContent = remaining > 0 ? `${remaining}s${node.closest('.steam-guard-code') ? ' 后失效' : ''}` : '已过期';
      });
      if (remaining <= 0) root.querySelectorAll('[data-guard-code]').forEach((node) => { node.textContent = '已过期'; });
    }

    function renderApp() {
      const root = document.querySelector('#appRentalDemo');
      root.dataset.orientation = state.orientation;
      root.dataset.screen = state.screen;
      if (state.orientation === 'portrait') {
        root.innerHTML = renderPortraitShell(renderPortraitContent(), state.screen);
        applyRealCrops(root);
        updateCountdownDisplay(root);
        updateGuardDisplays(root);
        return;
      }
      root.innerHTML = renderLandscapeShell(renderLandscapeContent(), state.screen);
      applyRealCrops(root);
      updateCountdownDisplay(root);
      updateGuardDisplays(root);
    }

    document.querySelector('#appRentalDemo').addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (target.classList.contains('modal-backdrop') && event.target !== target) return;
      if (action === 'navigate') {
        navigate(target.dataset.screen);
        return;
      }
      if (action === 'set-tab') {
        state[target.dataset.group] = target.dataset.value;
        renderApp();
        return;
      }
      if (action === 'set-order-tab') {
        state.orderTab = ['all', 'renting', 'pending'].includes(target.dataset.value) ? target.dataset.value : 'all';
        ensureSelectedOrder();
        renderApp();
        return;
      }
      if (action === 'select-order') {
        selectOrder(target.dataset.orderId);
        return;
      }
      if (action === 'open-login-method') {
        openLoginMethod();
        return;
      }
      if (action === 'close-login-method') {
        closeLoginMethod();
        return;
      }
      if (action === 'start-one-click') {
        startOneClickLogin();
        return;
      }
      if (action === 'open-manual-login') {
        openManualLogin();
        return;
      }
      if (action === 'close-steam-login') {
        closeSteamLogin();
        return;
      }
      if (action === 'open-credential') {
        openCredentialPanel();
        return;
      }
      if (action === 'close-credential') {
        closeCredentialPanel();
        return;
      }
      if (action === 'toggle-credential') {
        toggleCredential(target.dataset.field);
        return;
      }
      if (action === 'copy-credential') {
        copyCredential(target.dataset.field);
        return;
      }
      if (action === 'open-steam-help') {
        state.steamHelpOpen = true;
        state.credentialAccountVisible = false;
        state.credentialPasswordVisible = false;
        renderApp();
        return;
      }
      if (action === 'close-steam-help') {
        state.steamHelpOpen = false;
        state.credentialAccountVisible = false;
        state.credentialPasswordVisible = false;
        renderApp();
        return;
      }
      if (action === 'submit-steam-login') {
        submitSteamLogin();
        return;
      }
      if (action === 'request-guard') {
        requestGuardCode();
        return;
      }
      if (action === 'refresh-guard') {
        refreshGuardCode();
        return;
      }
      if (action === 'copy-guard') {
        copyGuardCode();
        return;
      }
      if (action === 'close-expiry') {
        closeExpiryReminder();
        return;
      }
      if (action === 'continue-expiry') {
        continueFromExpiryReminder();
        return;
      }
      if (action === 'recheck-entitlement') {
        recheckEntitlement();
        return;
      }
      if (action === 'close-expired-launch') {
        closeExpiredLaunchDialog();
        return;
      }
      if (action === 'continue-play') {
        showToast('已为当前订单打开续租入口');
        return;
      }
      if (action === 'after-sales') {
        openAfterSales();
        return;
      }
      if (action === 'select-after-sales-type') {
        setAfterSalesType(target.dataset.afterSalesType);
        return;
      }
      if (action === 'submit-after-sales') {
        submitAfterSales();
        return;
      }
      if (action === 'request-replacement') {
        requestReplacement();
        return;
      }
      if (action === 'contact-support') {
        showToast('已为你连接在线客服');
        return;
      }
      if (action === 'back-to-orders') {
        navigate(state.orientation === 'portrait' ? 'order-detail' : 'orders');
        return;
      }
      if (action === 'retry-inventory') {
        retryInventoryCheck();
        return;
      }
      if (action === 'back-to-detail') {
        navigate('detail');
        return;
      }
      if (action === 'requery-order') {
        queryOrderStatus();
        return;
      }
      if (action === 'toggle-more-duration') {
        toggleMoreDuration();
        return;
      }
      if (action === 'select-sku') {
        selectRentalSku(target.dataset.sku);
        return;
      }
      if (action === 'set-payment') {
        state.selectedPayment = target.dataset.payment;
        if (state.order?.status === 'pending') state.order.paymentMethod = state.selectedPayment;
        renderApp();
        return;
      }
      if (action === 'select-member-plan') {
        if (state.memberPlan !== target.dataset.plan && state.membershipOrder?.status === 'pending') state.membershipOrder = null;
        state.memberPlan = target.dataset.plan;
        renderApp();
        return;
      }
      if (action === 'set-member-payment') {
        state.memberPayment = target.dataset.payment;
        if (state.membershipOrder?.status === 'pending') state.membershipOrder.paymentMethod = state.memberPayment;
        renderApp();
        return;
      }
      if (action === 'open-member-game') {
        state.selectedGameId = target.dataset.gameId;
        normalizeSkuForScenario();
        state.screen = 'detail';
        renderApp();
        return;
      }
      if (action === 'begin-checkout') {
        navigate('checkout');
        return;
      }
      if (action === 'refresh-price') {
        state.priceChanged = false;
        if (state.order?.status === 'pending') state.order = null;
        ensureGameOrder();
        renderApp();
        return;
      }
      if (action === 'pay-game-order') {
        payOrder();
        return;
      }
      if (action === 'create-membership-order') {
        createMembershipOrder();
        return;
      }
      if (action === 'feedback') {
        target.animate([{ transform: 'scale(1)' }, { transform: 'scale(.95)' }, { transform: 'scale(1)' }], { duration: 180 });
        return;
      }
    });

    document.querySelector('#appRentalDemo').addEventListener('input', (event) => {
      const field = event.target.dataset.steamField;
      if (field === 'account' || field === 'password') state.steamForm[field] = event.target.value;
      if (field === 'remember') state.steamForm.remember = event.target.checked;
      if (event.target.id === 'after-sales-description') setAfterSalesDescription(event.target.value);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (state.credentialPanelOpen) closeCredentialPanel();
      else if (state.loginMethodOpen) closeLoginMethod();
      else if (state.steamHelpOpen) {
        state.steamHelpOpen = false;
        renderApp();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') clearSensitiveState('background');
    });

    window.__appRentalDemo = {
      setOrientation(value) { state.orientation = value; renderApp(); },
      navigate,
      setScenario(value) {
        if (value !== 'active-rental' && state.order?.scenarioSeed) {
          state.order = null;
          state.selectedOrderId = null;
          state.accountAllocationCount = 0;
        }
        state.scenario = value;
        state.membershipStatus = SCENARIOS[value]?.membershipStatus || 'none';
        normalizeSkuForScenario();
        ensureScenarioOrder(value);
        renderApp();
      },
      setMembershipStatus,
      resolveAction,
      resolveCurrentAction,
      getDetailModel,
      selectRentalSku,
      toggleMoreDuration,
      createOrder,
      ensureGameOrder,
      createMembershipOrder,
      payOrder,
      allocateAccount,
      ensureScenarioOrder,
      getOrderCollection,
      getFilteredOrders,
      getSelectedOrder,
      selectOrder,
      openLoginMethod,
      startOneClickLogin,
      openManualLogin,
      openCredentialPanel,
      closeCredentialPanel,
      submitSteamLogin,
      requestGuardCode,
      refreshGuardCode,
      copyGuardCode,
      expireGuardCode,
      clearSensitiveState,
      endOrder,
      setGameplayContext,
      resolvePostRentalEntitlement,
      handleRentalT0,
      triggerExpiryMinutes,
      closeExpiryReminder,
      continueFromExpiryReminder,
      setPostRentalEntitlement,
      setLaunchVerification,
      attemptLaunchAfterExpiry,
      recheckEntitlement,
      closeExpiredLaunchDialog,
      openAfterSales,
      setAfterSalesType,
      setAfterSalesDescription,
      submitAfterSales,
      setAfterSalesInventory,
      requestReplacement,
      setNetworkAvailable,
      queryOrderStatus,
      retryInventoryCheck,
      setInventoryAvailable,
      setPriceChanged,
      snapshot: publicSnapshot,
      reset() { location.reload(); },
    };

    renderApp();
    setInterval(() => {
      const root = document.querySelector('#appRentalDemo');
      updateCountdownDisplay(root);
      updateGuardDisplays(root);
    }, 1000);
  </script>
</body>
</html>
