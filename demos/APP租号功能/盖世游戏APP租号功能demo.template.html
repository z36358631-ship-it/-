    function orderTimingCopy(order) {
      if (order.status === 'pending') return `请在 ${formatCountdown(order.paymentDeadline || Date.now())} 内完成支付`;
      return Number(order.expireAt) ? `有效期至：${formatOrderDateTime(order.expireAt)}` : '有效期以订单快照为准';
    }

    function formatOrderDateTime(timestamp) {
      if (!Number(timestamp)) return '--';
      const parts = new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
      }).formatToParts(new Date(Number(timestamp)));
      const value = Object.fromEntries(parts.map(({ type, value: part }) => [type, part]));
      return `${value.year}-${value.month}-${value.day} ${value.hour}:${value.minute}`;
    }

    function formatRentalDuration(totalMinutes, includeMinutes = false) {
      const safeMinutes = Math.max(0, Math.floor(Number(totalMinutes) || 0));
      const hours = Math.floor(safeMinutes / 60);
      const minutes = safeMinutes % 60;
      const hourCopy = hours > 24 ? `${Math.floor(hours / 24)}天${hours % 24}小时` : `${hours}小时`;
      return includeMinutes && minutes ? `${hourCopy}${minutes}分钟` : hourCopy;
    }

    function hasDirectGameEntitlement(gameId) {
      return getDiscoveryUserContext(gameId).playable;
    }

    function getOrderActions(order, { surface = 'list' } = {}) {
      let actions = [...(ORDER_ACTIONS_BY_STATUS[order?.status] || [])];
      if (surface === 'list') actions = actions.filter(([id]) => id !== 'after-sales');
      if (surface === 'detail' && state.afterSalesOrder?.orderId === order?.id && state.afterSalesOrder.status === 'submitted') {
        actions = actions.map((action) => action[0] === 'after-sales' ? ['after-sales-detail', '售后详情', action[2]] : action);
      }
      actions = actions.filter(([id]) => id !== 'credentials' || order.credentialAvailable !== false);
      if (['refunded', 'ended'].includes(order?.status)) {
        const next = hasDirectGameEntitlement(order.gameId)
          ? ['playable', '可畅玩', 'primary']
          : ['rent', '租号开玩', 'primary'];
        actions = actions.filter(([id]) => !['resume', 'playable', 'rent'].includes(id));
        actions.unshift(next);
      }
      return actions;
    }

    function renderOrderActions(order, surface = 'list') {
      return `<div class="order-actions-set" data-order-actions-surface="${surface}">${getOrderActions(order, { surface }).map(([id, label, tone]) => `<button class="${tone}" type="button" data-action="order-card-action" data-order-card-action="${id}" data-order-id="${order.id}" ${tone === 'primary' ? 'data-primary-action="true"' : ''}>${label}</button>`).join('')}</div>`;
    }

    function renderOrderCardActions(order) {
      return `<span class="order-card-actions">${renderOrderActions(order, 'list')}</span>`;
    }

    function renderOrderCard(order) {
      const meta = ORDER_STATUS_META[order.status] || ORDER_STATUS_META.ended;
      return `<article class="order-list-card ${state.selectedOrderId === order.id ? 'selected' : ''}" role="button" tabindex="0" data-action="select-order" data-order-id="${order.id}" data-status="${order.status}" aria-label="查看 ${order.gameName} ${meta.label} 订单">
        <span class="order-card-head"><small>订单编号：${order.id}</small></span>
        <span class="order-card-main">${renderOrderCover(order)}<span class="order-card-copy"><strong>${order.gameName}</strong><span>${order.version || 'Steam · 标准版'} · ${order.durationLabel}</span></span><span class="order-card-commerce"><span class="order-status-chip" data-tone="${meta.tone}">${meta.label}</span><b class="order-card-amount">¥${Number(order.amount).toFixed(2)}</b></span></span>
        <span class="order-card-foot"><small>${orderTimingCopy(order)}</small>${renderOrderCardActions(order)}</span>
      </article>`;
    }

    function renderOrderProgress(order) {
      const refundOrder = ['refunding', 'refunded'].includes(order.status);
      const steps = refundOrder
        ? ['提交订单', '完成支付', '发起退款', '退款完成']
        : order.saleMode === GAME_SALE_MODES.ENTITLEMENT
          ? ['提交订单', '完成支付', '权益生效', '开始畅玩']
          : ['提交订单', '完成支付', '租赁生效', '开始畅玩'];
      const current = { pending: 0, active: 3, refunding: 2, refunded: 4, ended: 4 }[order.status] ?? 0;
      return `<div class="order-progress" aria-label="订单四步进度">${steps.map((label, index) => {
        const done = index < current || order.status === 'ended';
        const active = index === current && order.status !== 'ended';
        return `<div class="order-progress-step ${done ? 'done' : active ? 'current' : ''}" data-progress-step="${index + 1}"><span class="order-progress-dot">✓</span><span>${label}</span></div>`;
      }).join('')}</div>`;
    }

    function renderOrderDetailBody(order) {

        replacementStatus = `<div class="replacement-status"><p>换号成功，已匹配同游戏同版本账号：${replacement.version}。</p><div class="replacement-actions"><button type="button" data-action="contact-support">联系客服</button><button class="replacement-primary" type="button" data-action="back-to-orders">查看订单</button></div></div>`;

    function renderThirdPartyCredentialSection() {
      const config = getThirdPartyLoginConfig();
      if (!config) return '';
      const account = state.thirdPartyAccountVisible ? config.account : config.maskedAccount;
      const password = state.thirdPartyPasswordVisible ? config.password : config.maskedPassword;
      const remaining = thirdPartyCodeRemainingSeconds();
      const cooldown = thirdPartyCodeCooldownSeconds();
      const hasCode = Boolean(state.thirdPartyCode && remaining > 0);
      const emptyLabel = state.thirdPartyCodeIssued ? '验证码已过期' : '按需获取，不提前展示';
      const codeActions = hasCode
        ? `<div class="third-party-code-actions"><button type="button" data-action="copy-third-party-code">复制验证码</button><button type="button" data-action="refresh-third-party-code" ${cooldown > 0 ? 'disabled' : ''}><span data-third-party-cooldown="${cooldown}">${cooldown > 0 ? `${cooldown}s后刷新` : '刷新验证码'}</span></button></div>`
        : `<div class="third-party-code-actions"><button type="button" data-action="request-third-party-code">${state.thirdPartyCodeIssued ? '重新获取验证码' : '获取验证码'}</button></div>`;
      return `<section class="credential-platform-section" data-third-party-platform="${config.platformId}"><div class="credential-platform-head"><strong>${config.title}</strong><p>完成 Steam 登录后，启动游戏时使用以下 ${config.platformName} 账号</p></div><div class="credential-fields"><div class="credential-field"><span>账号</span><code data-third-party-field="account">${account}</code><button type="button" data-action="toggle-third-party-credential" data-field="account">${state.thirdPartyAccountVisible ? '隐藏' : '查看'}</button><button type="button" data-action="copy-third-party-credential" data-field="account">复制</button></div><div class="credential-field"><span>密码</span><code data-third-party-field="password">${password}</code><button type="button" data-action="toggle-third-party-credential" data-field="password">${state.thirdPartyPasswordVisible ? '隐藏' : '查看'}</button><button type="button" data-action="copy-third-party-credential" data-field="password">复制</button></div></div><div class="third-party-code ${hasCode ? 'has-code' : ''}" data-third-party-code-expires-at="${state.thirdPartyCodeExpiresAt || ''}"><span>验证码</span><span class="third-party-code-value">${hasCode ? `<code data-third-party-code>${state.thirdPartyCode}</code> · <span data-third-party-code-remaining="${remaining}">${remaining}s</span>` : emptyLabel}</span>${codeActions}</div></section>`;
    }

    function renderCredentialFields(closeAction) {
      const account = state.credentialAccountVisible ? RENTAL_CREDENTIAL.account : 'gh_****_2607';
      const password = state.credentialPasswordVisible ? RENTAL_CREDENTIAL.password : '••••••••••••';
      const remaining = guardRemainingSeconds();
      const hasCode = Boolean(state.guardCode && remaining > 0);
      const ready = state.steamForm.requiresGuard || state.credentialPanelOpen;
      const emptyLabel = state.guardIssued ? '验证码已过期' : '登录后按需获取';
      const guardActions = hasCode
        ? '<div class="credential-guard-actions"><button type="button" data-action="copy-guard">复制验证码</button><button type="button" data-action="refresh-guard">刷新验证码</button></div>'
        : ready ? `<div class="credential-guard-actions"><button type="button" data-action="${state.guardIssued ? 'refresh-guard' : 'request-guard'}">${state.guardIssued ? '刷新验证码' : '获取验证码'}</button></div>` : '';
      return `<div class="credential-head"><div><h2>租号登录信息</h2><p>仅限订单 ${getSelectedOrder()?.id || '--'} 使用，请勿修改账号资料</p></div><button class="dialog-close" type="button" data-action="${closeAction}" aria-label="关闭登录信息">×</button></div>
        <div class="credential-fields">
          <div class="credential-field"><span>账号</span><code data-credential-field="account">${account}</code><button type="button" data-action="toggle-credential" data-field="account">${state.credentialAccountVisible ? '隐藏' : '查看'}</button><button type="button" data-action="copy-credential" data-field="account">复制</button></div>
          <div class="credential-field"><span>密码</span><code data-credential-field="password">${password}</code><button type="button" data-action="toggle-credential" data-field="password">${state.credentialPasswordVisible ? '隐藏' : '查看'}</button><button type="button" data-action="copy-credential" data-field="password">复制</button></div>
        </div>
        <div class="credential-guard ${hasCode ? 'has-code' : ''}" data-guard-expires-at="${state.guardExpiresAt || ''}"><span>Steam 令牌</span><span class="credential-guard-value">${hasCode ? `<code data-guard-code>${state.guardCode}</code> · <span data-guard-remaining="${remaining}">${remaining}s</span>` : emptyLabel}</span>${guardActions}</div>${renderThirdPartyCredentialSection()}`;
    }

    function renderCredentialPanel() {
      if (!state.credentialPanelOpen) return '';
      const variant = state.orientation === 'portrait' ? 'portrait' : 'landscape';
      return `<div class="modal-backdrop" data-action="close-credential" role="presentation"><section class="credential-panel credential-panel--${variant}" role="dialog" aria-modal="true" aria-label="租号登录信息">${renderCredentialFields('close-credential')}</section></div>`;
    }

    function renderLoginMethodDialog() {
      if (!state.loginMethodOpen) return '';
      return `<div class="modal-backdrop" data-action="close-login-method" role="presentation"><section class="login-method-dialog" role="dialog" aria-modal="true" aria-label="选择登录方式"><div class="credential-head"><div><h2>选择登录方式</h2><p>两种方式使用当前订单分配的同一账号</p></div><button class="dialog-close" type="button" data-action="close-login-method" aria-label="关闭登录方式">×</button></div><div class="login-method-list"><button class="primary-action" type="button" data-primary-action="true" data-action="start-one-click">一键上号</button><button type="button" data-action="open-manual-login">手动登录</button></div></section></div>`;
    }

    function renderExpiryReminder() {
      if (!state.expiryReminderOpen || !state.rentalUsage) return '';
      const context = state.gameplayContext ? 'in-game' : 'outside-game';
      return `<aside class="expiry-reminder" data-context="${context}" role="status" aria-label="租用即将结束提醒"><div class="expiry-reminder-copy"><strong>租用时间快结束了，是否继续畅玩？</strong><span>继续后将进入游戏详情查看当前可用权益，租期不会自动延长。</span></div><div class="expiry-reminder-actions"><button type="button" data-action="close-expiry" aria-label="关闭提醒">关闭</button><button type="button" data-action="continue-expiry">继续畅玩</button></div></aside>`;
    }

    function renderRentalEndedDialog() {
      if (!state.expiredLaunchDialogOpen) return '';
      const networkIssue = state.expiredLaunchReason === 'network';
      return `<div class="modal-backdrop" role="presentation"><section class="rental-ended-dialog" role="dialog" aria-modal="true" aria-label="租用已结束"><h2>租用已结束</h2><p>${networkIssue ? '当前网络异常，暂时无法校验最新游戏权益。恢复网络后可重新校验。' : '租用账号已安全释放。你可以校验个人拥有、永久或有效会员权益后继续畅玩，也可以立即结束。'}</p><div class="ended-dialog-actions"><button type="button" data-action="close-expired-launch">立即结束</button><button class="ended-primary" type="button" data-primary-action="true" data-action="recheck-entitlement">继续畅玩</button></div></section></div>`;
    }

    function renderNoReasonPolicyDialog() {
      if (!state.noReasonPolicyOpen) return '';
      return `<div class="modal-backdrop" role="presentation"><section class="policy-dialog" role="dialog" aria-modal="true" aria-label="3天无理由规则"><div class="credential-head"><div><h2>3天无理由退款</h2><p>支付成功后 72小时内，且游戏时长不超过 30分钟</p></div><button class="dialog-close" type="button" data-action="close-no-reason-policy" aria-label="关闭规则">×</button></div><div class="policy-rule-list"><p><strong>时间范围</strong><span>从订单支付成功时间起计算 72 小时。</span></p><p><strong>游玩限制</strong><span>目标游戏累计游玩时长不超过 30 分钟。</span></p><p><strong>退款方式</strong><span>审核通过后按订单实际支付金额原路退回。</span></p></div><button class="primary-action" type="button" data-action="close-no-reason-policy">我知道了</button></section></div>`;
    }

    function renderDeleteOrderConfirm() {
      if (!state.confirmDeleteOrderId) return '';
      return `<div class="modal-backdrop" role="presentation"><section class="policy-dialog delete-order-dialog" role="alertdialog" aria-modal="true" aria-label="删除订单确认"><h2>删除订单记录？</h2><p>删除后列表中不再显示该订单记录，进行中的订单不可删除。</p><div class="dialog-action-row"><button type="button" data-action="cancel-delete-order">取消</button><button class="danger" type="button" data-action="confirm-delete-order">删除订单</button></div></section></div>`;
    }

    function renderRefundProgressDialog() {
      if (!state.refundProgressOrderId) return '';
      const order = getOrderCollection().find(({ id }) => id === state.refundProgressOrderId);
      if (!order || !['refunding', 'refunded'].includes(order.status)) return '';
      const completed = order.status === 'refunded';
      const steps = [
        ['退款申请已提交', 'done'],
        ['支付渠道处理中', completed ? 'done' : 'current'],
        ['退款原路到账', completed ? 'done' : ''],
      ];
      return `<div class="modal-backdrop" data-action="close-refund-progress" role="presentation"><section class="refund-progress-dialog" role="dialog" aria-modal="true" aria-label="退款进度"><div class="credential-head"><div><h2>退款进度</h2><p>订单 ${order.id}</p></div><button class="dialog-close" type="button" data-action="close-refund-progress" aria-label="关闭退款进度">×</button></div><div class="refund-progress-summary"><strong>${completed ? '退款已完成' : '退款处理中'}</strong><span>退款金额 ¥${Number(order.amount).toFixed(2)}，${completed ? '已按原支付方式退回。' : '正在由原支付渠道处理，到账时间以支付平台为准。'}</span></div><div class="refund-progress-timeline">${steps.map(([label, status]) => `<span class="${status}">${label}</span>`).join('')}</div><button class="primary-action" type="button" data-action="close-refund-progress">我知道了</button></section></div>`;
    }

    function renderAfterSalesProgressDialog() {
      if (!state.afterSalesProgressOpen) return '';
      const ticket = state.afterSalesOrder;
      const order = getOrderCollection().find(({ id }) => id === ticket?.orderId);
      if (!ticket || !order) return '';
      const cancellable = ticket.status === 'submitted';
      const steps = [
        ['售后申请已提交', 'done'],
        ['平台处理中', cancellable ? 'current' : 'done'],
        ['处理完成', cancellable ? '' : 'done'],
      ];
      return `<div class="modal-backdrop" data-action="close-after-sales-progress" role="presentation"><section class="refund-progress-dialog after-sales-progress-dialog" role="dialog" aria-modal="true" aria-label="售后进度"><div class="credential-head"><div><h2>售后进度</h2><p>订单 ${order.id}</p></div><button class="dialog-close" type="button" data-action="close-after-sales-progress" aria-label="关闭售后进度">×</button></div><div class="refund-progress-summary"><strong>${cancellable ? '售后处理中' : '售后已完成'}</strong><span>${cancellable ? '申请已提交，平台正在核对订单与使用记录，请留意后续处理结果。' : '本次售后已处理完成，具体结果以订单状态为准。'}</span></div><div class="refund-progress-timeline">${steps.map(([label, status]) => `<span class="${status}">${label}</span>`).join('')}</div><div class="after-sales-progress-actions">${cancellable ? '<button class="after-sales-withdraw" type="button" data-action="withdraw-after-sales">撤销售后</button>' : ''}<button class="primary-action" type="button" data-action="close-after-sales-progress">我知道了</button></div></section></div>`;
    }

    function renderMembershipIntroDialog() {
      if (!state.membershipIntroOpen) return '';
      const items = [
        '开通会员可畅玩会员游戏，总价值30w+的正版游戏库存（标准版或默认版本）。启动游戏后绝不顶号、挤号；',
        '会员属于特殊虚拟商品，开通后无法退款；',
        '开通会员后可在工作时间联系客服申请远程协助，工作人员按顺序提供协助；',
        '会员游戏号池共享，非个人所有。一号一游戏，均为STEAM正版账号，在线联机游玩！非盗版、非假入库、非离线！',
      ];
      return `<div class="modal-backdrop membership-intro-backdrop" role="presentation" data-membership-intro><section class="membership-intro-dialog" role="dialog" aria-modal="true" aria-labelledby="membershipIntroTitle"><header><h2 id="membershipIntroTitle">关于会员</h2><button type="button" data-action="close-membership-intro" aria-label="关闭关于会员">×</button></header><ol>${items.map((item) => `<li>${item}</li>`).join('')}</ol><button class="primary-action" type="button" data-action="close-membership-intro">我已了解</button></section></div>`;
    }

    function renderRentalIntroDialog() {
      if (!state.rentalIntroOpen) return '';
      return `<div class="modal-backdrop" data-action="close-rental-intro" role="presentation" data-rental-intro><section class="policy-dialog rental-intro-dialog" role="dialog" aria-modal="true" aria-labelledby="rentalIntroTitle"><div class="credential-head"><div><h2 id="rentalIntroTitle">租号功能介绍</h2><p>常见问题</p></div><button class="dialog-close" type="button" data-action="close-rental-intro" aria-label="关闭租号介绍">×</button></div><div class="rental-intro-faq"><article><strong>租号有什么作用？</strong><p>无需先购买游戏，即可在所选租期内使用平台提供的目标游戏账号；租号获得的是限时游玩资格，不代表购买游戏或账号所有权。</p></article><article><strong>如何使用租号？</strong><p>选择租号套餐或权益方案并完成支付。在有效期内点击开始畅玩，系统会自动准备账号；准备完成后可一键上号，或按页面提供的登录信息进入游戏。</p></article><article><strong>使用时要注意什么？</strong><p>仅可游玩本次购买的目标游戏，请勿修改账号资料；租期到期后使用权失效。首次体验固定 2 小时，从支付成功开始计时，每位用户在整个游戏平台终身仅可使用 1 次。</p></article></div><button class="primary-action" type="button" data-action="close-rental-intro">我已了解</button></section></div>`;
    }

    function renderRentalRiskDialog() {
      if (!state.riskReminderOpen) return '';
      return `<div class="modal-backdrop" role="presentation"><section class="policy-dialog rental-risk-dialog" role="alertdialog" aria-modal="true" aria-label="退款权益提醒"><h2>退款权益提醒</h2><p>本单不适用平台额外“3天无理由”承诺。法定退款权利，以及 Steam 登录失败、启动失败、账号异常等履约售后不受影响。</p><div class="dialog-action-row"><button type="button" data-action="close-rental-risk">暂不购买</button><button class="primary-action" type="button" data-action="confirm-rental-risk">确认继续</button></div></section></div>`;
    }

    function renderNonTargetLaunchGuard() {
      const guard = state.nonTargetLaunchGuard;
      if (!guard) return '';
      const action = guard.rentable
        ? '<div class="dialog-action-row"><button type="button" data-action="close-non-target-guard">取消</button><button class="primary-action" type="button" data-action="view-target-rental">查看租号方案</button></div>'
        : '<div><span class="guard-unavailable">暂不可租用</span><button class="primary-action" type="button" data-action="close-non-target-guard" style="width:100%;margin-top:8px">我知道了</button></div>';
      return `<div class="modal-backdrop" role="presentation"><section class="policy-dialog launch-guard-dialog non-target-launch-guard" role="alertdialog" aria-modal="true" aria-label="当前账号游戏范围提醒"><h2>当前账号仅限本次租用游戏</h2><p>目标游戏不属于本次租赁，不能直接启动。</p><div class="guard-game-pair"><div><span>当前租用游戏</span><strong>${guard.currentGameName}</strong></div><b>→</b><div><span>目标游戏</span><strong>${guard.targetGameName}</strong></div></div>${action}</section></div>`;
    }

    function renderGlobalOverlays() {
      return `${renderExpiryReminder()}${renderRentalEndedDialog()}${renderNoReasonPolicyDialog()}${renderDeleteOrderConfirm()}${renderRefundProgressDialog()}${renderAfterSalesProgressDialog()}${renderMembershipIntroDialog()}${renderRentalIntroDialog()}${renderRentalRiskDialog()}${renderNonTargetLaunchGuard()}${renderLoginMethodDialog()}${renderCredentialPanel()}${state.toast ? `<div class="demo-toast" role="status">${state.toast}</div>` : ''}`;
    }

    function renderSteamGuard() {
      const remaining = guardRemainingSeconds();
      const ready = state.steamForm.requiresGuard;
      if (!ready) return '';
      const hasCode = Boolean(state.guardCode && remaining > 0);
      const nextAction = state.guardIssued ? 'refresh-guard' : 'request-guard';
      const nextLabel = state.guardIssued ? '刷新验证码' : '获取验证码';
      return `<section class="steam-guard ${hasCode ? 'has-code' : ''}" data-guard-expires-at="${state.guardExpiresAt || ''}" aria-label="Steam 令牌验证"><div class="steam-guard-head"><strong>Steam 令牌验证</strong>${hasCode ? '' : `<button type="button" data-action="${nextAction}">${nextLabel}</button>`}</div>${hasCode ? `<div class="steam-guard-code"><code data-guard-code>${state.guardCode}</code><span data-guard-remaining="${remaining}">${remaining}s 后失效</span></div><div class="steam-guard-actions"><button type="button" data-action="copy-guard">复制验证码</button><button type="button" data-action="refresh-guard">刷新验证码</button></div>` : ''}</section>`;
    }

    function renderSteamForm() {
      return `<form class="steam-login-form" onsubmit="return false"><h1>登录</h1><p>使用当前租赁订单分配的 Steam 账号继续</p><div class="steam-field"><label for="steam-account">用账户名称登录</label><input id="steam-account" data-steam-field="account" autocomplete="username" value="${escapeAttribute(state.steamForm.account)}" aria-label="Steam 账号"></div><div class="steam-field"><label for="steam-password">密码</label><input id="steam-password" data-steam-field="password" type="password" autocomplete="current-password" value="${escapeAttribute(state.steamForm.password)}" aria-label="Steam 密码"></div><label class="steam-remember" for="steam-remember"><input id="steam-remember" data-steam-field="remember" type="checkbox" ${state.steamForm.remember ? 'checked' : ''}>记住我</label><button class="steam-login-submit" type="button" data-action="submit-steam-login">登录</button>${renderSteamGuard()}</form>`;
    }

    function renderSteamQrPanel() {
      return `<aside class="steam-qr-panel"><div><h2>使用 Steam 移动应用登录</h2><div class="steam-qr" aria-label="Steam 登录二维码"></div><p>打开 Steam 移动应用扫描二维码</p></div></aside>`;
    }

    function renderSteamLogin(orientation) {
      const form = renderSteamForm();
      const qr = renderSteamQrPanel();
      const body = orientation === 'portrait' ? `${qr}<div class="steam-login-divider">或使用账号密码登录</div>${form}` : `${form}${qr}`;
      return `<section class="steam-login-page" data-layout="${orientation}-steam-login" data-orientation="${orientation}"><header class="steam-login-topbar"><div class="steam-wordmark">STEAM <span>登录</span></div><button class="steam-help-trigger" type="button" data-action="open-steam-help">租号登录信息</button><button class="steam-close" type="button" data-action="close-steam-login" aria-label="关闭 Steam 登录">×</button></header><div class="steam-login-body">${body}</div>${state.steamHelpOpen ? `<section class="steam-credential-sheet" role="dialog" aria-modal="true" aria-label="Steam 租号登录信息"><div class="credential-content">${renderCredentialFields('close-steam-help')}</div></section>` : ''}</section>`;
    }

    function renderPortraitFooter(screen) {
      if (screen === 'detail') {
        return `<footer class="portrait-fixed-footer detail-fixed-footer">${renderDetailActions('portrait-detail-actions')}</footer>`;
      }
      if (screen === 'checkout' && state.order) {
        const recovery = renderCheckoutRecoveryActions();
        if (recovery) return `<footer class="portrait-fixed-footer">${recovery}</footer>`;
        const model = getCheckoutAmountModel(state.order);
        const disabled = !state.inventoryAvailable;
        const processing = state.order.status !== 'pending';
        const completion = getCheckoutCompletionMeta(state.order);
        const ready = Boolean(completion);
        return `<footer class="portrait-fixed-footer checkout-bottom-bar"><strong>${completion?.summary || model.dueText}</strong><button class="primary-action payment-primary" type="button" data-primary-action="true" data-action="${completion?.action || (state.priceChanged ? 'refresh-price' : 'pay-game-order')}" ${disabled || (processing && !ready) ? 'disabled' : ''}>${completion?.label || (processing ? (order.status === 'refunding' ? '退款处理中' : '暂不可购买') : disabled ? '暂不可购买' : state.priceChanged ? '按新价格重新确认' : '立即购买')}</button></footer>`;
      }
      if (screen === 'membership') {
        const plan = MEMBER_PLANS.find(({ id }) => id === state.memberPlan) || MEMBER_PLANS[0];
        const purchase = getMembershipPurchaseModel(plan);
        return `<footer class="portrait-fixed-footer checkout-bottom-bar membership-checkout-bar"><strong>${purchase.dueText}</strong><button class="primary-action" type="button" data-primary-action="true" data-action="${purchase.action}">立即购买</button></footer>`;
      }
      if (screen === 'order-detail') {
        const order = getSelectedOrder();
        return order ? `<footer class="portrait-fixed-footer order-detail-actions-dock">${renderOrderActions(order, 'detail')}</footer>` : '';
      }
      return '';
    }

    function renderStub(screen) {
      const copy = {
        detail: ['游戏详情', '从首页租号曝光进入，后续任务将补齐套餐与交易链路。'],
        membership: ['会员中心', '查看会员权益、套餐与会员游戏库。'],
        orders: ['订单中心', '查看待支付、可使用与已完成订单。'],
      }[screen] || ['页面不可用', '请返回上一页后重试。'];
      return `<div class="subpage-head"><button class="back-button" type="button" data-action="navigate" data-screen="${screen === 'detail' ? 'home' : 'profile'}" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><h1>${copy[0]}</h1></div><section class="stub-panel"><div><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="30"/><path d="M28 48c4 4 8 6 12 6s8-2 12-6M31 33h.1M49 33h.1"/></svg><h2>${copy[0]}</h2><p>${copy[1]}</p></div></section>`;
    }

    function renderPortraitContent() {
      if (state.screen === 'home') return `<section data-app-baseline="home">${renderHome()}</section>`;

    function renderLandscapeShell(content, active = 'library') {
      const nav = [['library', '游戏库'], ['play', '玩游戏'], ['home', '探索'], ['community', '社区'], ['ranking', '排行榜'], ['profile', '我的']];
      const core = isCoreScreen(state.screen);
      return `<section class="device landscape ${core ? 'core-shell' : 'task-shell'} ${state.expiryReminderOpen ? `has-expiry-reminder ${state.gameplayContext ? 'has-ingame-expiry' : ''}` : ''}" data-shell="${core ? 'core' : 'task'}">
        ${core ? `<aside class="landscape-top-nav landscape-side-nav"><div class="landscape-window-controls" aria-label="窗口控制"><i></i><i></i><i></i></div><nav aria-label="横屏主导航">${nav.map(([id, label]) => `<button class="${active === id ? 'active' : ''}" type="button" data-action="navigate" data-screen="${id}" aria-current="${active === id ? 'page' : 'false'}">${icon(id)}<span>${label}</span></button>`).join('')}</nav></aside>${landscapeSystem()}<span data-rental-increment="core-shell" hidden></span>` : ''}
        <main class="landscape-content" data-scroll-region="primary">${content}</main>
        ${renderGlobalOverlays()}
      </section>`;
    }

    function updateCountdownDisplay(root) {
      root.querySelectorAll('[data-countdown]').forEach((node) => {
        node.textContent = formatCountdown(Number(node.dataset.countdown));
      });
    }

    function updateGuardDisplays(root) {
      const remaining = guardRemainingSeconds();
      if (state.guardCode && remaining <= 0) {
        state.guardCode = null;
        state.guardExpiresAt = null;
        renderApp();
        return;
      }
      root.querySelectorAll('[data-guard-remaining]').forEach((node) => {
        node.dataset.guardRemaining = String(remaining);
        node.textContent = remaining > 0 ? `${remaining}s${node.closest('.steam-guard-code') ? ' 后失效' : ''}` : '已过期';
      });
      if (remaining <= 0) root.querySelectorAll('[data-guard-code]').forEach((node) => { node.textContent = '已过期'; });
      const thirdPartyRemaining = thirdPartyCodeRemainingSeconds();
      if (state.thirdPartyCode && thirdPartyRemaining <= 0) {
        state.thirdPartyCode = null;
        state.thirdPartyCodeExpiresAt = null;
        renderApp();
        return;
      }
      root.querySelectorAll('[data-third-party-code-remaining]').forEach((node) => {
        node.dataset.thirdPartyCodeRemaining = String(thirdPartyRemaining);
        node.textContent = thirdPartyRemaining > 0 ? `${thirdPartyRemaining}s` : '已过期';
      });
      const cooldown = thirdPartyCodeCooldownSeconds();
      root.querySelectorAll('[data-third-party-cooldown]').forEach((node) => {
        node.dataset.thirdPartyCooldown = String(cooldown);
        node.textContent = cooldown > 0 ? `${cooldown}s后刷新` : '刷新验证码';
        const button = node.closest('button');
        if (button) button.disabled = cooldown > 0;
      });
    }

    function renderApp() {
      const root = document.querySelector('#appRentalDemo');
      const pageId = PAGE_CONTRACTS[state.capturePageId] ? state.capturePageId : state.screen;
      root.dataset.orientation = state.orientation;
      root.dataset.screen = state.screen;
      root.dataset.pageId = pageId;
      root.dataset.baselineSource = PAGE_CONTRACTS[pageId]?.baselineSource || (isCoreScreen(state.screen) ? 'app-v611' : 'mac-rental');
      if (state.orientation === 'portrait') {
        root.innerHTML = renderPortraitShell(renderPortraitContent(), state.screen);
        applyRealCrops(root);
        updateCountdownDisplay(root);
        updateGuardDisplays(root);
        return;
      }
      root.innerHTML = renderLandscapeShell(renderLandscapeContent(), state.screen);
      applyRealCrops(root);
      updateCountdownDisplay(root);
      updateGuardDisplays(root);
    }

    document.querySelector('#appRentalDemo').addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (target.classList.contains('modal-backdrop') && event.target !== target) return;
      if (action === 'navigate') {
        if (target.dataset.gameId) setSelectedGame(target.dataset.gameId, { shouldRender: false });
        navigate(target.dataset.screen);
        return;
      }
      if (action === 'open-membership-from-checkout') {
        if (state.order?.status === 'pending') state.order = null;
        navigate('membership');
        return;
      }
      if (action === 'close-membership-intro') {
        dismissMembershipIntro();
        return;
      }
      if (action === 'request-rental-checkout') {
        requestRentalCheckout(target.dataset.gameId || state.selectedGameId);
        return;
      }
      if (action === 'confirm-rental-risk') {
        confirmRentalRisk();
        return;
      }
      if (action === 'close-rental-risk') {
        closeRentalRisk();
        return;
      }
      if (action === 'launch-steam-library-game') {
        attemptRentalAccountLaunch(target.dataset.gameId, { launchRequestId: target.dataset.launchRequestId });
        return;
      }
      if (action === 'view-target-rental') {
        viewTargetRental();
        return;
      }
      if (action === 'close-non-target-guard') {
        closeNonTargetLaunchGuard();
        return;
      }
      if (action === 'task-back') {
        taskBack();
        return;
      }
      if (action === 'set-tab') {
        state[target.dataset.group] = target.dataset.value;
        renderApp();
        return;
      }
      if (action === 'set-order-tab') {
        state.orderTab = ORDER_TABS.some(({ id }) => id === target.dataset.value) ? target.dataset.value : 'all';
        ensureSelectedOrder();
        renderApp();
        return;
      }
      if (action === 'toggle-order-search') {
        state.orderSearchOpen = true;
        renderApp();
        requestAnimationFrame(() => document.querySelector('[data-order-search-input]')?.focus());
        return;
      }
      if (action === 'close-order-search') {
        state.orderSearch = '';
        state.orderSearchOpen = false;
        ensureSelectedOrder();
        renderApp();
        return;
      }
      if (action === 'clear-member-library-search') {
        state.memberLibrarySearch = '';
        renderApp();
        requestAnimationFrame(() => document.querySelector('[data-member-library-search-input]')?.focus());
        return;
      }
      if (action === 'set-search-tab') {
        state.searchTab = SEARCH_TABS.some(({ id }) => id === target.dataset.searchTab) ? target.dataset.searchTab : 'all';
        renderApp();
        return;
      }
      if (action === 'clear-order-search') {
        setOrderSearch('');
        return;
      }
      if (action === 'order-card-action') {
        handleOrderCardAction(target.dataset.orderCardAction, target.dataset.orderId);
        return;
      }
      if (action === 'select-order') {
        selectOrder(target.dataset.orderId);
        return;
      }
      if (action === 'open-login-method') {
        openLoginMethod();
        return;
      }
      if (action === 'close-login-method') {
        closeLoginMethod();
        return;
      }
      if (action === 'start-one-click') {
        startOneClickLogin();
        return;
      }
      if (action === 'open-manual-login') {
        openManualLogin();
        return;
      }
      if (action === 'close-steam-login') {
        closeSteamLogin();
        return;
      }
      if (action === 'open-credential') {
        openCredentialPanel();
        return;
      }
      if (action === 'close-credential') {
        closeCredentialPanel();
        return;
      }
      if (action === 'toggle-credential') {
        toggleCredential(target.dataset.field);
        return;
      }
      if (action === 'copy-credential') {
        copyCredential(target.dataset.field);
        return;
      }
      if (action === 'toggle-third-party-credential') {
        toggleThirdPartyCredential(target.dataset.field);
        return;
      }
      if (action === 'copy-third-party-credential') {
        copyThirdPartyCredential(target.dataset.field);
        return;
      }
      if (action === 'request-third-party-code') {
        requestThirdPartyCode();
        return;
      }
      if (action === 'refresh-third-party-code') {
        refreshThirdPartyCode();
        return;
      }
      if (action === 'copy-third-party-code') {
        copyThirdPartyCode();
        return;
      }
      if (action === 'open-steam-help') {
        if (getSelectedOrder()?.status !== 'active') return;
        state.steamHelpOpen = true;
        state.credentialAccountVisible = false;
        state.credentialPasswordVisible = false;
        resetThirdPartyCredentialState();
        renderApp();
        return;
      }
      if (action === 'close-steam-help') {
        state.steamHelpOpen = false;
        state.credentialAccountVisible = false;
        state.credentialPasswordVisible = false;
        resetThirdPartyCredentialState();
        renderApp();
        return;
      }
      if (action === 'submit-steam-login') {
        submitSteamLogin();
        return;
      }
      if (action === 'request-guard') {
        requestGuardCode();
        return;
      }
      if (action === 'refresh-guard') {
        refreshGuardCode();
        return;
      }
      if (action === 'copy-guard') {
        copyGuardCode();
        return;
      }
      if (action === 'close-expiry') {
        closeExpiryReminder();
        return;
      }
      if (action === 'continue-expiry') {
        continueFromExpiryReminder();
        return;
      }
      if (action === 'recheck-entitlement') {
        recheckEntitlement();
        return;
      }
      if (action === 'close-expired-launch') {
        closeExpiredLaunchDialog();
        return;
      }
      if (action === 'continue-play') {
        navigate('detail');
        return;
      }
      if (action === 'after-sales') {
        openAfterSales();
        return;
      }
      if (action === 'after-sales-detail') {
        state.afterSalesProgressOpen = true;
        renderApp();
        return;
      }
      if (action === 'select-after-sales-type') {
        setAfterSalesType(target.dataset.afterSalesType);
        return;
      }
      if (action === 'submit-after-sales') {
        submitAfterSales();
        return;
      }
      if (action === 'withdraw-after-sales') {
        withdrawAfterSales();
        return;
      }
      if (action === 'close-after-sales-progress') {
        state.afterSalesProgressOpen = false;
        renderApp();
        return;
      }
      if (action === 'request-replacement') {
        requestReplacement();
        return;
      }
      if (action === 'contact-support') {
        showToast('已为你连接在线客服');
        return;
      }
      if (action === 'back-to-orders') {
        navigate(state.orientation === 'portrait' ? 'order-detail' : 'orders', { rememberSource: false, replaceTask: true });
        return;
      }
      if (action === 'retry-inventory') {
        retryInventoryCheck();
        return;
      }
      if (action === 'back-to-detail') {
        navigate('detail', { rememberSource: false, replaceTask: true });
        return;
      }
      if (action === 'requery-order') {
        queryOrderStatus();
        return;
      }
      if (action === 'select-sku') {
        selectRentalSku(target.dataset.sku);
        return;
      }
      if (action === 'select-checkout-sku') {
        selectRentalSku(target.dataset.sku);
        return;
      }
      if (action === 'select-edition') {
        selectEdition(target.dataset.editionId);
        return;
      }
      if (action === 'select-rental-plan') {
        selectRentalPlan(target.dataset.rentalPlan);
        return;
      }
      if (action === 'change-rental-hours') {
        setRentalHours(state.selectedHours + Number(target.dataset.delta || 0));
        return;
      }
      if (action === 'set-rental-hours') {
        setRentalHours(Number(target.dataset.hourShortcut));
        return;
      }
      if (action === 'open-no-reason-policy') {
        state.noReasonPolicyOpen = true;
        renderApp();
        return;
      }
      if (action === 'close-no-reason-policy') {
        state.noReasonPolicyOpen = false;
        renderApp();
        return;
      }
      if (action === 'open-rental-intro') {
        state.rentalIntroOpen = true;
        renderApp();
        return;
      }
      if (action === 'close-rental-intro') {
        state.rentalIntroOpen = false;
        renderApp();
        return;
      }
      if (action === 'close-refund-progress') {
        state.refundProgressOrderId = null;
        renderApp();
        return;
      }
      if (action === 'cancel-delete-order') {
        state.confirmDeleteOrderId = null;
        renderApp();
        return;
      }
      if (action === 'confirm-delete-order') {
        const orderId = state.confirmDeleteOrderId;
        const order = getOrderCollection().find(({ id }) => id === orderId);
        if (!order || NON_DELETABLE_ORDER_STATUSES.has(order.status)) {
          state.confirmDeleteOrderId = null;
          showToast('进行中的订单不可删除');
          return;
        }
        if (!state.hiddenOrderIds.includes(orderId)) state.hiddenOrderIds.push(orderId);
        if (state.order?.id === orderId) state.order = null;
        state.confirmDeleteOrderId = null;
        state.selectedOrderId = null;
        ensureSelectedOrder();
        if (state.screen === 'order-detail') navigate('orders', { rememberSource: false, replaceTask: true });
        else renderApp();
        return;
      }
      if (action === 'set-payment') {
        state.selectedPayment = target.dataset.payment;
        if (state.order?.status === 'pending') state.order.paymentMethod = state.selectedPayment;
        renderApp();
        return;
      }
      if (action === 'select-member-plan') {
        if (state.memberPlan !== target.dataset.plan && state.membershipOrder?.status === 'pending') state.membershipOrder = null;
        state.memberPlan = target.dataset.plan;
        renderApp();
        return;
      }
      if (action === 'set-member-payment') {
        state.memberPayment = target.dataset.payment;
        if (state.membershipOrder?.status === 'pending') state.membershipOrder.paymentMethod = state.memberPayment;
        renderApp();
        return;
      }
      if (action === 'open-member-game') {
        setSelectedGame(target.dataset.gameId, { shouldRender: false });
        navigate('detail');
        return;
      }
      if (action === 'begin-checkout') {
        requestRentalCheckout(state.selectedGameId);
        return;
      }
      if (action === 'refresh-price') {
        state.priceChanged = false;
        if (state.order?.status === 'pending') state.order = null;
        ensureGameOrder();
        renderApp();
        return;
      }
      if (action === 'pay-game-order') {
        payOrder();
        return;
      }
      if (action === 'launch-entitlement-game') {
        const order = state.order;
        if (!order) return;
        const result = prepareAccountForLaunch({
          orderId: order.id,
          launchRequestId: `ENTITLEMENT-${order.id}-${nowFromServer()}`,
        });
        if (result.ok) navigate('library', { rememberSource: false });
        return;
      }
      if (action === 'create-membership-order') {
        createMembershipOrder();
        return;
      }
      if (action === 'pay-membership-order') {
        payMembershipOrder();
        return;
      }
      if (action === 'feedback') {
        target.animate([{ transform: 'scale(1)' }, { transform: 'scale(.95)' }, { transform: 'scale(1)' }], { duration: 180 });
        return;
      }
    });

    document.querySelector('#appRentalDemo').addEventListener('input', (event) => {
      if (event.target.matches('[data-discovery-search-input]')) {
        state.searchQuery = event.target.value;
        return;
      }
      if (event.target.matches('[data-order-search-input]')) {
        const value = event.target.value;
        setOrderSearch(value);
        requestAnimationFrame(() => {
          const input = document.querySelector('[data-order-search-input]');
          if (!input) return;
          input.focus();
          input.setSelectionRange(value.length, value.length);
        });
        return;
      }
      if (event.target.matches('[data-member-library-search-input]')) {
        const value = event.target.value;
        state.memberLibrarySearch = value;
        renderApp();
        requestAnimationFrame(() => {
          const input = document.querySelector('[data-member-library-search-input]');
          if (!input) return;
          input.focus();
          input.setSelectionRange(value.length, value.length);
        });
        return;
      }
      const field = event.target.dataset.steamField;
      if (field === 'account' || field === 'password') state.steamForm[field] = event.target.value;
      if (field === 'remember') state.steamForm.remember = event.target.checked;
      if (event.target.id === 'after-sales-description') setAfterSalesDescription(event.target.value);
    });

    document.querySelector('#appRentalDemo').addEventListener('change', (event) => {
      if (!event.target.matches('[data-rental-hours-input]')) return;
      const updated = setRentalHours(event.target.value);
      if (updated === false) {
        event.target.value = String(state.selectedHours);
        showToast('请输入 2—23 的整数小时');
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (state.membershipIntroOpen) {
        dismissMembershipIntro();
      } else if (state.rentalIntroOpen) {
        state.rentalIntroOpen = false;
        renderApp();
      } else if (state.riskReminderOpen) {
        closeRentalRisk();
      } else if (state.nonTargetLaunchGuard) {
        closeNonTargetLaunchGuard();
      } else if (state.noReasonPolicyOpen) {
        state.noReasonPolicyOpen = false;
        renderApp();
      } else if (state.refundProgressOrderId) {
        state.refundProgressOrderId = null;
        renderApp();
      } else if (state.afterSalesProgressOpen) {
        state.afterSalesProgressOpen = false;
        renderApp();
      } else if (state.confirmDeleteOrderId) {
        state.confirmDeleteOrderId = null;
        renderApp();
      } else if (state.credentialPanelOpen) closeCredentialPanel();
      else if (state.loginMethodOpen) closeLoginMethod();
      else if (state.steamHelpOpen) {
        state.steamHelpOpen = false;
        state.credentialAccountVisible = false;
        state.credentialPasswordVisible = false;
        resetThirdPartyCredentialState();
        renderApp();
      } else if (state.orderSearchOpen && !state.orderSearch) {
        state.orderSearchOpen = false;
        renderApp();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') clearSensitiveState('background');
    });

    window.__appRentalDemo = {
      setOrientation(value) {
        const currentRegion = document.querySelector('.device.portrait .portrait-content')
          || [...document.querySelectorAll('[data-scroll-region="primary"], .device.landscape .landscape-content, .device.landscape .task-scroll-region')]
            .find((node) => node.scrollHeight > node.clientHeight);
        if (currentRegion) {
          const previous = Number(state.scrollRegistry[state.screen] || 0);
          state.scrollRegistry[state.screen] = Math.max(previous, currentRegion.scrollTop);
        }
        state.orientation = value;
        renderApp();
        const savedTop = Number(state.scrollRegistry[state.screen] || 0);
        const nextCandidates = state.orientation === 'portrait'
          ? [document.querySelector('.device.portrait .portrait-content')]
          : [...document.querySelectorAll('[data-scroll-region="primary"], .landscape-membership-body, .landscape-member-library-layout, .device.landscape .landscape-content, .device.landscape .task-scroll-region')];
        const nextRegion = nextCandidates.find((node) => node && node.scrollHeight > node.clientHeight) || nextCandidates.find(Boolean);
        if (nextRegion) nextRegion.scrollTop = Math.min(savedTop, Math.max(0, nextRegion.scrollHeight - nextRegion.clientHeight));
      },
      navigate,
      go: navigate,
      taskBack,
      setRouteContext,
      setScenario,
      setMembershipStatus,
      setSelectedGame,
      normalizeGameUserContext,
      getDiscoveryUserContext,
      resolveGameDisplayModel,
      getDiscoveryDisplay,
      setDiscoveryContext,
      getGamePlatform,
      getGameEditions,
      getGameEdition,
      getCheckoutEligibilityContext,
      getGameSaleMode,
      eligibleCheckoutSkus,
      defaultCheckoutSku,
      lowestEligibleRentalSku,
      lowestEligiblePurchaseSku,
      setSaleMode(gameId, value) {
        const game = getGameContext(gameId);
        if (!game || !Object.values(GAME_SALE_MODES).includes(value)) return null;
        game.saleMode = value;
        renderApp();
        return game.saleMode;
      },
      setSearchTab(value) {
        state.searchTab = SEARCH_TABS.some(({ id }) => id === value) ? value : 'all';
        renderApp();
        return state.searchTab;
      },
      resolveAction,
      resolveCurrentAction,
      getDetailModel,
      resolveDetailActions,
      selectRentalSku,
      selectEdition,
      selectRentalPlan,
      setRentalHours,
      quoteRentalOffer,
      getCheckoutAmountModel,
      requestRentalCheckout,
      confirmRentalRisk,
      setRentalRiskDecision,
      attemptRentalAccountLaunch,
      closeNonTargetLaunchGuard,
      createOrder,
      ensureGameOrder,
      createMembershipOrder,
      payMembershipOrder,
      completeMembershipPayment: payMembershipOrder,
      payOrder,
      confirmGamePayment: payOrder,
      setServerNow(value) {
        state.serverNow = Number(value);
        return state.serverNow;
      },
      simulateTrialPayment(paidAt) {
        state.serverNow = Number(paidAt);
        state.platformTrialEligibility = { eligible: true, consumedAt: null, orderId: null };
        state.discoveryContexts.spiritfarer.firstRentalEligible = true;
        state.discoveryContexts['shadow-blade-zero'].firstRentalEligible = true;
        setScenario('member-library-trial', { shouldRender: false });
        setSelectedGame('spiritfarer', { shouldRender: false });
        prepareCheckoutForSelectedGame();
        state.selectedSku = 'trial';
        const order = ensureGameOrder();
        if (!order) return null;
        const paid = payOrder({ paidAt: Number(paidAt), transactionId: `TRIAL-${paidAt}` });
        return {
          ...paid,
          firstRentalEligible: getCheckoutEligibilityContext('spiritfarer').firstRentalEligible,
          platformTrialEligible: state.platformTrialEligibility.eligible,
        };
      },
      prepareAccountForLaunch,
      setMembershipEntitlement(value = {}) {
        state.membershipEntitlement = {
          planId: value.planId || null,
          startsAt: Number(value.startsAt || 0) || null,
          expiresAt: Number(value.expiresAt || 0) || null,
        };
        return { ...state.membershipEntitlement };
      },
      activeMemberUsage() { return state.activeMemberUsage ? { ...state.activeMemberUsage } : null; },
      startMemberGameUsage,
      releaseMemberGameUsage,
      simulateMembershipPayment: applyMembershipPayment,
      ensureScenarioOrder,
      getOrderCollection,
      getFilteredOrders,
      setOrderSearch,
      getOrderActions,
      formatRentalDuration,
      getSelectedOrder,
      selectOrder,
      openLoginMethod,
      startOneClickLogin,
      openManualLogin,
      openCredentialPanel,
      closeCredentialPanel,
      submitSteamLogin,
      requestGuardCode,
      getCredentialAccess(now = Date.now()) { return credentialAccessActive(now); },
      authorizeCredentialAccess,
      scheduleClipboardClear,
      clearCopiedCredential,
      refreshGuardCode,
      copyGuardCode,
      expireGuardCode,
      requestThirdPartyCode,
      refreshThirdPartyCode,
      copyThirdPartyCode,
      expireThirdPartyCode,
      clearSensitiveState,
      endOrder,
      setCurrentOrderStatus,
      setGameplayContext,
      resolvePostRentalEntitlement,
      handleRentalT0,
      triggerExpiryMinutes,
      crossExpiryThreshold: triggerExpiryMinutes,
      closeExpiryReminder,
      continueFromExpiryReminder,
      setPostRentalEntitlement,
      setLaunchVerification,
      attemptLaunchAfterExpiry,
      recheckEntitlement,
      closeExpiredLaunchDialog,
      getNoReasonEligibility,
      openAfterSales,
      setAfterSalesType,
      setAfterSalesDescription,
      submitAfterSales,
      withdrawAfterSales,
      setAfterSalesInventory,
      requestReplacement,
      setNetworkAvailable,
      queryOrderStatus,
      retryInventoryCheck,
      setInventoryAvailable,
      setPriceChanged,
      openCaptureState,
      snapshot: publicSnapshot,
      reset() { location.reload(); },
    };

    renderApp();
    setInterval(() => {
      const root = document.querySelector('#appRentalDemo');
      updateCountdownDisplay(root);
      updateGuardDisplays(root);
    }, 1000);
  </script>
</body>
</html>
