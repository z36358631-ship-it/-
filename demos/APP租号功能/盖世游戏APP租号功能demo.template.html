<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盖世游戏 APP 租号功能 Demo</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg-primary: #000000;
      --bg-card: #1a1a1a;
      --bg-elevated: #252525;
      --text-primary: #ffffff;
      --text-secondary: #e6e6e6;
      --text-muted: #9b9ca3;
      --brand-gold: #ffcc43;
      --brand-green: #33d8a4;
      --brand-blue: #338feb;
      --border-default: #353d4e;
      --font-primary: "MiSans VF", "MiSans", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-number: "D-DIN-PRO", var(--font-primary);
      font-family: var(--font-primary);
      background: #07090d;
      color: var(--text-primary);
    }

    html, body { min-width: 320px; min-height: 100%; }
    body { margin: 0; background: radial-gradient(circle at 50% 8%, #202637 0, #0b0e14 38%, #050608 100%); }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible { outline: 2px solid var(--brand-gold); outline-offset: 2px; }

    #appRentalDemo {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .device {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 20px;
      background: var(--bg-primary);
      box-shadow: 0 30px 90px rgb(0 0 0 / 58%), 0 0 0 7px rgb(255 255 255 / 3%);
    }

    .device.portrait { width: 390px; height: 844px; }

    .device.portrait::before {
      position: absolute;
      z-index: -2;
      inset: 0;
      background:
        radial-gradient(circle at 76% 2%, rgb(75 47 105 / 56%), transparent 32%),
        radial-gradient(circle at 15% 30%, rgb(31 76 105 / 38%), transparent 31%),
        linear-gradient(165deg, #10131d 0, #090a0e 44%, #020203 100%);
      content: "";
    }

    .device.portrait.theme-home::before {
      background:
        radial-gradient(circle at 14% 0, rgb(121 72 31 / 54%), transparent 38%),
        radial-gradient(circle at 90% 45%, rgb(63 72 35 / 42%), transparent 35%),
        linear-gradient(164deg, #1d1611 0, #0a0a09 54%, #020202 100%);
    }

    .device.portrait.theme-library::before {
      background:
        radial-gradient(circle at 36% 0, rgb(53 65 117 / 60%), transparent 38%),
        linear-gradient(174deg, #141828 0, #090a0f 52%, #030303 100%);
    }

    .device.portrait.theme-profile::before {
      background:
        radial-gradient(circle at 18% 5%, rgb(4 84 110 / 62%), transparent 39%),
        radial-gradient(circle at 83% 70%, rgb(57 24 69 / 34%), transparent 36%),
        linear-gradient(178deg, #06131a 0, #07070a 50%, #020203 100%);
    }

    .mobile-status {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      display: flex;
      width: 100%;
      height: 34px;
      align-items: center;
      justify-content: space-between;
      padding: 4px 17px 0;
      color: rgb(255 255 255 / 94%);
      font-family: var(--font-number);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .status-left, .status-right { display: flex; align-items: center; gap: 7px; }
    .status-rate { color: rgb(255 255 255 / 76%); font-size: 10px; font-style: italic; }
    .status-icon { display: inline-flex; width: 15px; height: 15px; align-items: center; justify-content: center; }
    .status-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .battery { display: inline-flex; height: 14px; min-width: 27px; align-items: center; justify-content: center; border: 1px solid rgb(255 255 255 / 74%); border-radius: 4px; font-size: 8px; }

    .portrait-content {
      position: absolute;
      inset: 34px 0 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 10px 16px 104px;
      scrollbar-width: none;
    }

    .portrait-content::-webkit-scrollbar { display: none; }

    .portrait-nav {
      position: absolute;
      z-index: 10;
      right: 8px;
      bottom: 8px;
      left: 8px;
      display: grid;
      height: 72px;
      grid-template-columns: repeat(5, 1fr);
      align-items: stretch;
      padding: 4px;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 24px;
      background: rgb(36 36 39 / 83%);
      box-shadow: 0 -10px 34px rgb(0 0 0 / 34%), inset 0 1px rgb(255 255 255 / 6%);
      backdrop-filter: blur(20px);
    }

    .portrait-nav button {
      display: flex;
      min-width: 0;
      min-height: 62px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 2px 3px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: #85868c;
      cursor: pointer;
      font-size: 10px;
      line-height: 14px;
      transition: background 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .portrait-nav button:active { transform: scale(.96); }
    .portrait-nav button.active { background: rgb(255 255 255 / 10%); color: #fff; }
    .portrait-nav button svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }

    .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .search-box {
      display: flex;
      height: 44px;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 100px;
      background: rgb(255 255 255 / 5%);
      color: rgb(255 255 255 / 47%);
      font-size: 14px;
      backdrop-filter: blur(12px);
    }

    .search-box svg { width: 21px; height: 21px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; }
    .device-link { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border: 0; background: none; color: #fff; cursor: pointer; }
    .device-link svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .page-tabs {
      display: flex;
      align-items: flex-start;
      gap: 27px;
      overflow-x: auto;
      margin: 0 -2px 18px;
      padding: 0 2px 2px;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .page-tabs::-webkit-scrollbar { display: none; }
    .page-tabs button {
      position: relative;
      min-height: 38px;
      padding: 0 0 10px;
      border: 0;
      background: none;
      color: rgb(255 255 255 / 48%);
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
    }

    .page-tabs button.active { color: #fff; font-weight: 650; }
    .page-tabs button.active::after {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 18px;
      height: 3px;
      border-radius: 100px;
      background: #fff;
      content: "";
      transform: translateX(-50%);
    }

    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 1px 11px; }
    .section-head h2 { margin: 0; font-size: 18px; font-weight: 650; line-height: 26px; }
    .section-head span { color: var(--text-muted); font-size: 11px; }

    .hero-card {
      position: relative;
      min-height: 224px;
      overflow: hidden;
      padding: 18px;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 20px;
      background:
        linear-gradient(180deg, transparent 8%, rgb(3 5 9 / 7%) 38%, rgb(3 4 7 / 96%) 100%),
        radial-gradient(circle at 66% 28%, rgb(238 184 85 / 42%), transparent 23%),
        linear-gradient(135deg, #40301e 0, #1e2534 50%, #0b0c10 100%);
      box-shadow: 0 12px 32px rgb(0 0 0 / 24%);
    }

    .real-media { position: relative; display: block; overflow: hidden; background: #11141a; }
    .real-media > img { position: absolute; max-width: none; pointer-events: none; user-select: none; }
    .hero-real { position: absolute; z-index: 0; inset: 0; }
    .hero-real::after { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(5 7 10 / 18%) 0, rgb(5 7 10 / 44%) 45%, rgb(3 4 7 / 97%) 100%); content: ""; }

    .hero-card::after {
      position: absolute;
      top: -36px;
      right: -10px;
      width: 190px;
      height: 190px;
      border: 1px solid rgb(255 212 113 / 27%);
      border-radius: 50%;
      box-shadow: inset 0 0 0 24px rgb(0 0 0 / 16%), inset 0 0 0 25px rgb(255 255 255 / 5%);
      content: "";
    }

    .hero-mark { position: absolute; z-index: 1; top: 40px; right: 33px; width: 94px; height: 94px; color: rgb(255 235 189 / 76%); }
    .hero-mark svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.3; }
    .hero-eyebrow { position: relative; z-index: 2; color: rgb(255 255 255 / 68%); font-size: 11px; letter-spacing: .11em; }
    .hero-copy { position: absolute; z-index: 2; right: 16px; bottom: 15px; left: 16px; }
    .hero-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .rent-badge { padding: 4px 8px; border: 1px solid rgb(255 215 115 / 25%); border-radius: 100px; background: rgb(255 204 67 / 14%); color: #ffda78; font-size: 10px; }
    .hero-score { margin-left: auto; color: #ffb14b; font-family: var(--font-number); font-size: 14px; font-weight: 650; }
    .hero-title { margin: 0 0 10px; font-size: 23px; font-weight: 680; letter-spacing: .02em; }
    .hero-bottom { display: flex; align-items: center; gap: 10px; }
    .hero-subtitle { flex: 1; color: var(--text-muted); font-size: 11px; line-height: 16px; }
    .primary-action {
      min-width: 112px;
      min-height: 44px;
      padding: 0 15px;
      border: 0;
      border-radius: 100px;
      background: linear-gradient(135deg, #ffd86b, #e6a62b);
      box-shadow: 0 8px 22px rgb(241 178 47 / 19%);
      color: #19140b;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .mini-game-row { display: grid; grid-auto-columns: 84px; grid-auto-flow: column; gap: 11px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .mini-game-row::-webkit-scrollbar { display: none; }
    .mini-game { min-width: 0; }
    .mini-game .cover-art { width: 84px; height: 84px; }
    .mini-game strong { display: block; overflow: hidden; margin-top: 7px; font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }

    .cover-art {
      position: relative;
      display: block;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(140deg, #303b5d, #121721);
    }

    .cover-art::after { position: absolute; inset: 0; background: linear-gradient(155deg, rgb(255 255 255 / 16%), transparent 42%, rgb(0 0 0 / 44%)); content: ""; }
    .cover-art svg { position: absolute; inset: 0; width: 100%; height: 100%; color: rgb(255 255 255 / 55%); fill: none; stroke: currentColor; stroke-width: 1.15; }
    .cover-art small { position: absolute; z-index: 2; right: 7px; bottom: 6px; left: 7px; color: rgb(255 255 255 / 89%); font-size: 8px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 1px 5px #000; }
    .cover-art--ember { background: linear-gradient(140deg, #8a3527, #251410 55%, #0c0908); }
    .cover-art--forest { background: linear-gradient(145deg, #315f5a, #142c31 52%, #080e12); }
    .cover-art--violet { background: linear-gradient(145deg, #7056a1, #34254e 54%, #11101d); }
    .cover-art--gold { background: linear-gradient(145deg, #a68035, #47371a 55%, #17120b); }
    .cover-art--blue { background: linear-gradient(145deg, #3f78a3, #1e3a55 52%, #0b111a); }
    .cover-art--red { background: linear-gradient(145deg, #a73e46, #4b1b25 52%, #160a0d); }

    .account-card {
      display: flex;
      min-height: 74px;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
      padding: 13px 16px;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 18px;
      background: rgb(255 255 255 / 5%);
      backdrop-filter: blur(14px);
    }

    .avatar-small, .profile-avatar {
      display: grid;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 50%;
      background: linear-gradient(145deg, #526071, #272c36);
      color: rgb(255 255 255 / 72%);
    }

    .avatar-small { width: 46px; height: 46px; flex: 0 0 auto; }
    .avatar-small svg, .profile-avatar svg { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .account-card strong { font-size: 15px; }
    .account-card p { margin: 4px 0 0; color: var(--text-muted); font-size: 11px; }

    .feature-scroll { display: grid; grid-auto-columns: 75%; grid-auto-flow: column; gap: 12px; overflow-x: auto; scrollbar-width: none; }
    .feature-scroll::-webkit-scrollbar { display: none; }
    .feature-card { overflow: hidden; border: 1px solid rgb(255 255 255 / 10%); border-radius: 18px; background: rgb(20 20 23 / 76%); }
    .feature-card .cover-art { width: 100%; height: 112px; border-radius: 17px 17px 10px 10px; }
    .feature-info { display: flex; min-height: 57px; align-items: center; gap: 8px; padding: 9px 11px; }
    .feature-info strong { overflow: hidden; flex: 1; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .small-pill { min-height: 36px; padding: 0 14px; border: 1px solid rgb(255 255 255 / 12%); border-radius: 100px; background: rgb(255 255 255 / 7%); cursor: pointer; font-size: 11px; }

    .game-list { display: grid; gap: 12px; }
    .game-list-item { display: grid; min-height: 76px; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 11px; }
    .game-list-item .cover-art { width: 64px; height: 64px; }
    .game-list-copy { min-width: 0; }
    .game-list-copy strong { display: block; overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .game-list-copy p { overflow: hidden; margin: 5px 0 3px; color: var(--text-muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .rating { color: #ff9c42; font-family: var(--font-number); font-size: 12px; font-weight: 650; }

    .library-tools { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 9px; margin-bottom: 17px; }
    .filter-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: rgb(255 255 255 / 6%); cursor: pointer; }
    .filter-button svg { width: 20px; height: 20px; fill: none; stroke: #a1a2aa; stroke-linecap: round; stroke-width: 1.7; }
    .library-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
    .library-card { min-width: 0; overflow: hidden; padding: 0 0 10px; border: 1px solid rgb(255 255 255 / 7%); border-radius: 17px; background: rgb(16 16 18 / 78%); }
    .library-card .cover-art { width: 100%; height: 109px; border-radius: 16px 16px 10px 10px; }
    .library-card strong { display: block; overflow: hidden; margin: 9px 10px 3px; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .library-card span { margin: 0 10px; color: #8c8d94; font-size: 9px; }

    .profile-tools { display: flex; justify-content: flex-end; gap: 5px; margin-bottom: 21px; }
    .icon-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
    .icon-button svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .profile-identity { display: flex; flex-direction: column; align-items: center; margin-bottom: 23px; text-align: center; }
    .profile-avatar { width: 76px; height: 76px; margin-bottom: 12px; background: linear-gradient(145deg, #76524a, #342a3d); }
    .profile-avatar.real-avatar { display: block; }
    .profile-name-row { display: flex; align-items: center; gap: 8px; }
    .profile-name-row h1 { margin: 0; font-size: 19px; font-weight: 650; }
    .member-chip { padding: 5px 9px; border: 1px solid rgb(255 218 123 / 22%); border-radius: 100px; background: rgb(255 204 67 / 13%); color: #ffda79; font-size: 10px; }
    .profile-uid { margin: 7px 0 0; color: var(--text-muted); font-family: var(--font-number); font-size: 11px; }

    .profile-card {
      width: 100%;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid rgb(255 255 255 / 11%);
      border-radius: 19px;
      background: linear-gradient(145deg, rgb(35 49 57 / 90%), rgb(20 20 27 / 88%));
      backdrop-filter: blur(16px);
    }

    .platform-card { margin-bottom: 14px; padding: 14px 16px; border: 1px solid rgb(255 255 255 / 9%); border-radius: 18px; background: rgb(28 34 40 / 74%); }
    .platform-head { display: flex; align-items: center; justify-content: space-between; }
    .platform-head strong { font-size: 14px; }
    .platform-head span { padding: 3px 7px; border-radius: 100px; background: rgb(51 216 164 / 10%); color: var(--brand-green); font-size: 9px; }
    .platform-stats { display: grid; grid-template-columns: repeat(2, 1fr); margin-top: 13px; }
    .platform-stats div { color: #fff; font-family: var(--font-number); font-size: 17px; font-weight: 650; text-align: center; }
    .platform-stats div + div { border-left: 1px solid rgb(255 255 255 / 10%); }
    .platform-stats small { display: block; margin-top: 3px; color: var(--text-muted); font-family: var(--font-primary); font-size: 9px; font-weight: 400; }
    .profile-promo { width: 100%; height: 60px; margin-bottom: 14px; border: 1px solid rgb(255 255 255 / 11%); border-radius: 16px; }

    .member-banner { display: flex; min-height: 92px; align-items: center; gap: 12px; padding: 16px; }
    .member-emblem { display: grid; width: 50px; height: 50px; flex: 0 0 auto; place-items: center; border-radius: 16px; background: linear-gradient(145deg, #ffe29c, #a97224); color: #2b210e; }
    .member-emblem svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .member-copy { min-width: 0; flex: 1; }
    .member-copy strong { display: block; font-size: 15px; }
    .member-copy p { margin: 5px 0 0; color: var(--text-muted); font-size: 10px; }
    .chevron { width: 18px; height: 18px; fill: none; stroke: #bbbcc2; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }

    .profile-menu { display: grid; gap: 1px; margin-bottom: 15px; overflow: hidden; border: 1px solid rgb(255 255 255 / 9%); border-radius: 18px; background: rgb(24 24 29 / 82%); }
    .profile-menu button { display: grid; min-height: 58px; grid-template-columns: 38px minmax(0, 1fr) 18px; align-items: center; gap: 10px; padding: 0 15px; border: 0; border-bottom: 1px solid rgb(255 255 255 / 7%); background: transparent; cursor: pointer; text-align: left; }
    .profile-menu button:last-child { border-bottom: 0; }
    .menu-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: rgb(255 255 255 / 6%); color: #d5d6da; }
    .menu-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .menu-copy strong { display: block; font-size: 13px; font-weight: 550; }
    .menu-copy small { display: block; margin-top: 3px; color: var(--text-muted); font-size: 9px; }

    .ranking-head { display: flex; align-items: end; justify-content: space-between; margin: 4px 0 19px; }
    .ranking-head h1 { margin: 0; font-size: 28px; }
    .ranking-head p { margin: 0 0 3px; color: var(--text-muted); font-size: 10px; }
    .ranking-list { display: grid; gap: 10px; }
    .ranking-row { display: grid; min-height: 78px; grid-template-columns: 30px 58px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid rgb(255 255 255 / 7%); border-radius: 16px; background: rgb(255 255 255 / 4%); }
    .rank-number { color: var(--brand-gold); font-family: var(--font-number); font-size: 20px; font-style: italic; font-weight: 700; }
    .ranking-row .cover-art { width: 58px; height: 58px; }
    .ranking-row strong { display: block; font-size: 13px; }
    .ranking-row small { color: var(--text-muted); font-size: 9px; }

    .subpage-head { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .back-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: rgb(255 255 255 / 6%); cursor: pointer; }
    .back-button svg { width: 21px; height: 21px; fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .subpage-head h1 { margin: 0; font-size: 21px; }
    .stub-panel { display: grid; min-height: 420px; place-items: center; padding: 28px; border: 1px solid rgb(255 255 255 / 9%); border-radius: 20px; background: rgb(255 255 255 / 4%); text-align: center; }
    .stub-panel svg { width: 64px; height: 64px; margin-bottom: 18px; fill: none; stroke: rgb(255 255 255 / 56%); stroke-width: 1.35; }
    .stub-panel h2 { margin: 0 0 7px; font-size: 18px; }
    .stub-panel p { max-width: 240px; margin: 0; color: var(--text-muted); font-size: 12px; line-height: 19px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="appRentalDemo" data-orientation="portrait" data-screen="home"></main>
  <script>
    const ASSETS = Object.freeze({
      home: '{{APP_PORTRAIT_HOME}}',
      play: '{{APP_PORTRAIT_PLAY}}',
      library: '{{APP_PORTRAIT_LIBRARY}}',
      profile: '{{APP_PORTRAIT_PROFILE}}',
      landscapeLibrary: '{{APP_LANDSCAPE_LIBRARY}}',
    });

    const ASSET_SIZES = Object.freeze({
      home: [1116, 2480],
      play: [1116, 2480],
      library: [1116, 2480],
      profile: [1116, 2480],
      landscapeLibrary: [2480, 1116],
    });

    const state = {
      orientation: 'portrait',
      screen: 'home',
      scenario: 'member-library-trial',
      selectedGameId: 'elden-ring',
      selectedSku: 'trial',
      selectedHours: 2,
      playTab: 'cloud',
      libraryTab: 'steam',
      order: null,
      credentialVisible: false,
      guardCode: null,
      expiry15Shown: false,
    };

    const SCENARIOS = {
      'owned-installed': { owns: true, installed: true },
      'owned-uninstalled': { owns: true, installed: false },
      'active-rental': { activeRental: true },
      'not-member-library': { memberLibrary: false },
      'member-library-trial': { memberLibrary: true, trialEligible: true },
      'member-library-trial-used': { memberLibrary: true, trialEligible: false },
      'active-member': { memberLibrary: true, membershipActive: true },
      'permanent-owned': { permanentEntitlement: true },
    };

    const NON_TERMINAL_ORDER_STATUSES = new Set(['pending', 'allocating', 'active']);
    let lastOrderNumber = 0;

    const GAMES = [
      ['elden-ring', '艾尔登法环', 'ember', 'ELDEN RING'],
      ['witcher-3', '巫师 3：狂猎', 'forest', 'THE WITCHER'],
      ['forza-5', '极限竞速：地平线 5', 'blue', 'FORZA'],
      ['red-dead-2', '荒野大镖客：救赎 2', 'red', 'RED DEAD'],
      ['hogwarts', '霍格沃茨之遗', 'violet', 'HOGWARTS'],
      ['stardew', '星露谷物语', 'gold', 'STARDEW'],
      ['spiritfarer', 'Spiritfarer', 'blue', 'SPIRITFARER'],
      ['dont-starve', '饥荒', 'ember', 'DON’T STARVE'],
    ];

    function cloneOrder(order) {
      return JSON.parse(JSON.stringify(order));
    }

    function nextOrderId(timestamp) {
      lastOrderNumber = Math.max(timestamp, lastOrderNumber + 1);
      return `APP-${lastOrderNumber}`;
    }

    function resolveAction(input) {
      if (input.owns && input.installed) return { primary: 'launch', secondary: [] };
      if (input.owns) return { primary: 'download', secondary: [] };
      if (input.permanentEntitlement) return { primary: 'launch', secondary: [] };
      if (input.activeRental) return { primary: 'continue', secondary: ['credential', 'renew'] };
      if (!input.memberLibrary) return { primary: 'rent-2h', secondary: ['more-duration'] };
      if (input.membershipActive) return { primary: 'member-play', secondary: ['membership-status'] };
      if (input.trialEligible) return { primary: 'trial', secondary: ['permanent', 'membership'] };
      return { primary: 'permanent', secondary: ['membership'] };
    }

    function resolveCurrentAction() {
      return resolveAction(SCENARIOS[state.scenario]);
    }

    function createOrder({ sku, amount, priceVersion }) {
      if (state.order && NON_TERMINAL_ORDER_STATUSES.has(state.order.status)) return null;
      const createdAt = Date.now();
      state.order = {
        id: nextOrderId(createdAt),
        status: 'pending',
        sku,
        amount,
        priceVersion,
        paymentDeadline: createdAt + 30 * 60 * 1000,
      };
      renderApp();
      return cloneOrder(state.order);
    }

    function payOrder() {
      if (!state.order || state.order.status !== 'pending') return false;
      state.order.status = 'allocating';
      renderApp();
      return true;
    }

    function allocateAccount(success = true) {
      if (!state.order || state.order.status !== 'allocating') return false;
      state.order.status = success ? 'active' : 'refunding';
      renderApp();
      return true;
    }

    function icon(id) {
      const icons = {
        home: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.7 12 3.8l8.5 6.9v8.6a1.2 1.2 0 0 1-1.2 1.2h-4.7v-6H9.4v6H4.7a1.2 1.2 0 0 1-1.2-1.2z"/></svg>',
        play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 8.5h7.6c2 0 3.3 1.1 3.7 3.2l.9 5.1c.3 1.7-1.8 2.8-2.9 1.5l-2.1-2.5H8.6l-2.1 2.5c-1.1 1.3-3.2.2-2.9-1.5l.9-5.1c.4-2.1 1.7-3.2 3.7-3.2Z"/><path d="M8.5 11v3M7 12.5h3M16.2 11.8h.1M18 13.5h.1M12 8.3V5.5"/></svg>',
        ranking: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 20V12h3v8zM10.5 20V5h3v15zM16.5 20V9h3v11z"/></svg>',
        library: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="6.8" height="6.8" rx="1.4"/><rect x="13.7" y="3.5" width="6.8" height="6.8" rx="1.4"/><rect x="3.5" y="13.7" width="6.8" height="6.8" rx="1.4"/><rect x="13.7" y="13.7" width="6.8" height="6.8" rx="1.4"/></svg>',
        profile: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M8.8 9.8a3.2 3.2 0 0 0 6.4 0M8.6 16.2c1.1.8 2.2 1.2 3.4 1.2s2.3-.4 3.4-1.2"/></svg>',
      };
      return icons[id] || icons.home;
    }

    function personIcon() {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6"/></svg>';
    }

    function coverArt(game) {
      const [, , theme, label] = game;
      return `<span class="cover-art cover-art--${theme}">
        <svg viewBox="0 0 100 70" preserveAspectRatio="none" aria-hidden="true">
          <path d="M-8 58 16 31l11 10 18-26 18 30 12-14 34 34"/>
          <circle cx="72" cy="16" r="10"/><path d="M0 61c20-8 36-7 54 0s32 8 49-2"/>
        </svg><small>${label}</small>
      </span>`;
    }

    function realCrop(assetKey, crop, alt, label = '', className = 'cover-art') {
      const [sourceWidth, sourceHeight] = ASSET_SIZES[assetKey];
      const [x, y, width, height] = crop;
      const style = [
        `width:${(sourceWidth / width * 100).toFixed(4)}%`,
        `height:${(sourceHeight / height * 100).toFixed(4)}%`,
        `left:${(-x / width * 100).toFixed(4)}%`,
        `top:${(-y / height * 100).toFixed(4)}%`,
      ].join(';');
      return `<span class="real-media ${className}"><img data-real-asset="true" data-source-screen="${assetKey}" src="${ASSETS[assetKey]}" alt="${alt}" draggable="false" style="${style}">${label ? `<small>${label}</small>` : ''}</span>`;
    }

    function statusBar() {
      return `<header class="mobile-status" aria-label="系统状态栏">
        <div class="status-left"><time>14:38</time><span class="status-rate">120Hz</span></div>
        <div class="status-right">
          <span class="status-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.5c3.8-3.2 8.2-3.2 12 0M4.5 9c2.2-1.8 4.8-1.8 7 0M7 11.5c.7-.6 1.3-.6 2 0"/></svg></span>
          <span class="battery">82</span>
        </div>
      </header>`;
    }

    function searchRow(placeholder = '搜索游戏') {
      return `<div class="search-row">
        <div class="search-box" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.3 15.3 5 5"/></svg><span>${placeholder}</span></div>
        <button class="device-link" type="button" data-action="feedback" aria-label="连接设备"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="10" height="18" rx="2"/><path d="M15 8h2.5l2 2v7h-4.2M9 17h2"/></svg></button>
      </div>`;
    }

    function pageTabs(items, active, group) {
      return `<div class="page-tabs" role="tablist">${items.map(([value, label]) => `<button type="button" role="tab" aria-selected="${active === value}" class="${active === value ? 'active' : ''}" data-action="set-tab" data-group="${group}" data-value="${value}">${label}</button>`).join('')}</div>`;
    }

    function rentalBadge() {
      if (['owned-installed', 'owned-uninstalled', 'permanent-owned', 'active-rental'].includes(state.scenario)) return null;
      if (state.scenario === 'member-library-trial') return '¥1.99 首次体验';
      if (state.scenario === 'active-member') return '会员畅玩';
      return '可租号';
    }

    function renderHome() {
      const badge = rentalBadge();
      const actionLabel = badge === '¥1.99 首次体验' ? '立即体验' : badge || '查看游戏';
      return `${searchRow('影之刃零')}
        <article class="hero-card">
          ${realCrop('home', [584, 1656, 492, 240], '影之刃零游戏画面', '', 'hero-real')}
          <span class="hero-eyebrow">今日推荐 · 云端即刻开玩</span>
          <span class="hero-mark"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="20"/><path d="M50 5v22M50 73v22M5 50h22M73 50h22M18 18l16 16M66 66l16 16M82 18 66 34M34 66 18 82"/></svg></span>
          <div class="hero-copy">
            <div class="hero-meta">${badge ? `<span class="rent-badge">${badge}</span>` : ''}<span class="hero-score">9.5</span></div>
            <h1 class="hero-title">影之刃零</h1>
            <div class="hero-bottom"><span class="hero-subtitle">无需购买游戏，选择适合你的权益立即开始</span><button class="primary-action" type="button" data-primary-action="true" data-action="navigate" data-screen="detail">${actionLabel}</button></div>
          </div>
        </article>
        <div class="section-head"><h2>为你推荐</h2><span>发现更多</span></div>
        <div class="mini-game-row">${[
          ['GTA V', [70, 1260, 215, 250]],
          ['Human Multiplayer Game', [326, 1260, 220, 250]],
          ['荒野大镖客：救赎 2', [575, 1260, 220, 250]],
          ['Drillbert', [828, 1260, 215, 250]],
        ].map(([name, crop]) => `<article class="mini-game">${realCrop('home', crop, `${name} 游戏封面`, '')}<strong>${name}</strong></article>`).join('')}</div>
        <div class="section-head"><h2>最新资讯</h2><span>每周更新</span></div>
        <div class="feature-scroll">${[
          ['龙之信条 2', [67, 1658, 492, 235], '开放世界新作本周登场'],
          ['影之刃零', [584, 1658, 492, 235], '国产动作新作情报公开'],
        ].map(([name, crop, title]) => `<article class="feature-card">${realCrop('home', crop, `${name} 资讯配图`, '')}<div class="feature-info"><strong>${title}</strong></div></article>`).join('')}</div>`;
    }

    function renderPlay() {
      const tabLabel = { cloud: '秒玩', pc: '启动', retro: '畅玩' }[state.playTab];
      const featureGames = [
        ['极限竞速：地平线 6', [53, 753, 642, 305]],
        ['怪物猎人：世界', [756, 753, 350, 305]],
      ];
      const listGames = [
        ['巫师 3：狂猎', [45, 1359, 189, 225]],
        ['极限竞速：地平线 5', [45, 1630, 189, 238]],
        ['刺客信条：起源', [45, 1904, 189, 238]],
      ];
      return `${searchRow('搜索秒玩游戏')}
        ${pageTabs([['cloud', '云游戏'], ['pc', 'PC游戏'], ['retro', '复古游戏']], state.playTab, 'playTab')}
        <div class="account-card"><span class="avatar-small">${personIcon()}</span><div><strong>欢迎回来，玩家</strong><p>会员游戏库已为你同步</p></div></div>
        <div class="section-head"><h2>${tabLabel}人气热游</h2><span>精选</span></div>
        <div class="feature-scroll">${featureGames.map(([name, crop]) => `<article class="feature-card">${realCrop('play', crop, `${name} 游戏画面`, '')}<div class="feature-info"><strong>${name}</strong><button class="small-pill" type="button" data-action="feedback">${tabLabel}</button></div></article>`).join('')}</div>
        <div class="section-head"><h2>全部${tabLabel}</h2><span>按热度</span></div>
        <div class="game-list">${listGames.map(([name, crop], index) => `<article class="game-list-item">${realCrop('play', crop, `${name} 游戏封面`, '')}<div class="game-list-copy"><strong>${name}</strong><p>沉浸式冒险 · 支持手柄</p><span class="rating">评分 ${(9.6 - index * .3).toFixed(1)}</span></div><button class="small-pill" type="button" data-action="feedback">${tabLabel}</button></article>`).join('')}</div>`;
    }

    function renderLibrary() {
      const labels = { pc: 'PC', steam: 'Steam', epic: 'Epic', retro: '复古' };
      const libraryGames = [
        ['Slay the Spire 2', [57, 436, 472, 270]],
        ['The Forest', [587, 436, 472, 270]],
        ['中国式家长', [57, 896, 472, 270]],
        ['Spiritfarer', [587, 896, 472, 270]],
        ['饥荒', [57, 1353, 472, 270]],
        ['小小梦魇 2', [587, 1353, 472, 270]],
        ['霍格沃茨之遗', [57, 1808, 472, 270]],
        ['星露谷物语', [587, 1808, 472, 270]],
      ];
      return `${pageTabs([['pc', 'PC游戏'], ['steam', 'Steam游戏'], ['epic', 'Epic游戏'], ['retro', '复古游戏']], state.libraryTab, 'libraryTab')}
        <div class="library-tools"><div class="search-box" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.3 15.3 5 5"/></svg><span>搜索${labels[state.libraryTab]}游戏</span></div><button class="filter-button" type="button" data-action="feedback" aria-label="筛选"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button></div>
        <div class="library-grid">${libraryGames.map(([name, crop]) => `<article class="library-card">${realCrop('library', crop, `${name} 游戏封面`, '')}<strong>${name}</strong><span>手柄适配 · 云端存档</span></article>`).join('')}</div>`;
    }

    function renderProfile() {
      const isMember = state.scenario === 'active-member';
      const memberText = isMember ? '畅玩会员 · 有效期 326 天' : '畅玩会员 · 待开通';
      return `<div class="profile-tools"><button class="icon-button" type="button" data-action="feedback" aria-label="下载管理"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg></button><button class="icon-button" type="button" data-action="feedback" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m18.2 13.8 1.4 1-.9 1.6-1.6-.6a7 7 0 0 1-1.8 1l-.3 1.7h-1.8l-.3-1.7a7 7 0 0 1-1.8-1l-1.6.6-.9-1.6 1.4-1a7 7 0 0 1 0-2l-1.4-1 .9-1.6 1.6.6a7 7 0 0 1 1.8-1l.3-1.7H15l.3 1.7a7 7 0 0 1 1.8 1l1.6-.6.9 1.6-1.4 1a7 7 0 0 1 0 2Z"/></svg></button></div>
        <section class="profile-identity">${realCrop('profile', [482, 302, 156, 158], '盖世玩家用户头像', '', 'profile-avatar real-avatar')}<div class="profile-name-row"><h1>盖世玩家 0525</h1><span class="member-chip">${isMember ? '会员生效中' : '会员未开通'}</span></div><p class="profile-uid">UID GH20260525</p></section>
        <button class="profile-card member-banner" type="button" data-action="navigate" data-screen="membership"><span class="member-emblem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 3.5 3L12 4l4.5 6L20 7l-1.5 11h-13z"/><path d="M7 14h10"/></svg></span><span class="member-copy"><strong>盖世畅玩会员</strong><p>${memberText}</p></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        <section class="platform-card"><div class="platform-head"><strong>Steam 个人信息</strong><span>已绑定</span></div><div class="platform-stats"><div>110<small>游玩时长（h）</small></div><div>26<small>游戏数量</small></div></div></section>
        ${realCrop('profile', [46, 1341, 1024, 174], '新人见面礼活动横幅', '', 'profile-promo')}
        <div class="section-head"><h2>我的服务</h2><span>账号与权益</span></div>
        <div class="profile-menu">
          <button type="button" data-action="navigate" data-screen="orders"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><span class="menu-copy"><strong>租号订单</strong><small>查看进行中订单、登录信息与售后</small></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
          <button type="button" data-action="feedback"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="3"/><path d="M7 10h4M7 14h7"/></svg></span><span class="menu-copy"><strong>我的设备</strong><small>管理已连接的主机和手柄</small></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>`;
    }

    function renderRanking() {
      return `${searchRow('搜索排行榜')}
        <div class="ranking-head"><div><h1>排行榜</h1><p>本周玩家热度</p></div><span class="rent-badge">实时更新</span></div>
        <div class="ranking-list">${GAMES.slice(0, 6).map((game, index) => `<article class="ranking-row"><span class="rank-number">${index + 1}</span>${coverArt(game)}<div><strong>${game[1]}</strong><small>${9864 - index * 741} 人正在玩</small></div><span class="rating">${(9.7 - index * .2).toFixed(1)}</span></article>`).join('')}</div>`;
    }

    function renderStub(screen) {
      const copy = {
        detail: ['游戏详情', '从首页租号曝光进入，后续任务将补齐套餐与交易链路。'],
        membership: ['会员中心', '查看月度、年度与永久会员权益。'],
        orders: ['租号订单', '查看待支付、进行中与已完成订单。'],
      }[screen] || ['功能页面', '当前入口已连通。'];
      return `<div class="subpage-head"><button class="back-button" type="button" data-action="navigate" data-screen="${screen === 'detail' ? 'home' : 'profile'}" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><h1>${copy[0]}</h1></div><section class="stub-panel"><div><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="30"/><path d="M28 48c4 4 8 6 12 6s8-2 12-6M31 33h.1M49 33h.1"/></svg><h2>${copy[0]}</h2><p>${copy[1]}</p></div></section>`;
    }

    function renderPortraitContent() {
      if (state.screen === 'home') return renderHome();
      if (state.screen === 'play') return renderPlay();
      if (state.screen === 'ranking') return renderRanking();
      if (state.screen === 'library') return renderLibrary();
      if (state.screen === 'profile') return renderProfile();
      return renderStub(state.screen);
    }

    function renderPortraitShell(content, active = 'home') {
      const nav = [['home', '首页'], ['play', '玩游戏'], ['ranking', '排行榜'], ['library', '游戏库'], ['profile', '我的']];
      const theme = active === 'library' ? 'theme-library' : active === 'profile' ? 'theme-profile' : active === 'home' ? 'theme-home' : '';
      return `<section class="device portrait ${theme}">
        ${statusBar()}
        <main class="portrait-content">${content}</main>
        <nav class="portrait-nav" aria-label="主导航">${nav.map(([id, label]) => `<button class="${active === id ? 'active' : ''}" type="button" data-action="navigate" data-screen="${id}" aria-current="${active === id ? 'page' : 'false'}">${icon(id)}<span>${label}</span></button>`).join('')}</nav>
      </section>`;
    }

    function renderApp() {
      const root = document.querySelector('#appRentalDemo');
      root.dataset.orientation = state.orientation;
      root.dataset.screen = state.screen;
      if (state.orientation === 'portrait') {
        root.innerHTML = renderPortraitShell(renderPortraitContent(), state.screen);
        return;
      }
      root.innerHTML = '<section class="device"><div class="stub-panel"><div><h2>横屏布局</h2><p>横屏原生页面将在下一任务中完成。</p></div></div></section>';
    }

    document.querySelector('#appRentalDemo').addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'navigate') state.screen = target.dataset.screen;
      if (action === 'set-tab') state[target.dataset.group] = target.dataset.value;
      if (action === 'feedback') {
        target.animate([{ transform: 'scale(1)' }, { transform: 'scale(.95)' }, { transform: 'scale(1)' }], { duration: 180 });
        return;
      }
      renderApp();
    });

    window.__appRentalDemo = {
      setOrientation(value) { state.orientation = value; renderApp(); },
      navigate(screen) { state.screen = screen; renderApp(); },
      setScenario(value) { state.scenario = value; renderApp(); },
      resolveAction,
      resolveCurrentAction,
      createOrder,
      payOrder,
      allocateAccount,
      snapshot() { return JSON.parse(JSON.stringify(state)); },
      reset() { location.reload(); },
    };

    renderApp();
  </script>
</body>
</html>
