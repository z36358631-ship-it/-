    const funnel = stats.funnel.map(([label, value]) => `<div class="funnel-step"><strong>${value}</strong><span>${label}</span></div>`).join('');
    const rows = currentData().products.map((item, index) => `<tr><td><strong>${item.game}</strong><span class="subline">${item.edition}</span></td><td>${1320 - index * 187}</td><td>${(96.8 - index * 1.1).toFixed(1)}%</td><td>${item.stock}</td><td>${(2.1 + index * .4).toFixed(1)}%</td></tr>`).join('');
    return `<div class="admin-toolbar"><strong>${clientLabel()} · 近30天</strong><span class="spacer"></span><button class="a-btn" data-admin-action="export">导出报表</button></div><div class="kpi-grid">${kpis}</div><section class="funnel-card"><h3>租号转化漏斗</h3><div class="funnel">${funnel}</div></section>${table(['游戏 / 版本', '支付订单', '上号成功率', '库存', '退款率'], rows)}`;
  }
  function renderAudit() {
    const rows = adminState.auditLogs.map((log) => `<tr><td><strong>${log.time}</strong><span class="subline">${log.id}</span></td><td>${log.operator}</td><td>${log.module}</td><td>${log.action}</td><td>${log.objectId}</td><td><span class="audit-client">clientType: ${log.clientType}</span></td><td><span class="status">${log.result}</span></td><td><button class="a-btn" data-admin-action="audit-detail" data-object-id="${log.id}">查看详情</button></td></tr>`).join('');
    return `<div class="admin-toolbar"><input aria-label="搜索操作记录" placeholder="日志ID / 对象ID / 操作人"><select><option>全部 clientType</option><option>android</option><option>mac</option></select><span class="spacer"></span><button class="a-btn" data-admin-action="export-audit">导出当前筛选</button></div>${table(['操作时间 / 日志ID', '操作人', '模块', '动作', '对象ID', '端别快照', '结果', '详情'], rows)}`;
  }
  const ADMIN_RENDERERS = Object.freeze({ products: renderProducts, 'member-library': renderMemberLibrary, 'member-plans': renderMemberPlans, accounts: renderAccounts, 'admin-orders': renderOrders, stats: renderStats, audit: renderAudit });
  function renderAdminApp() {
    const target = root();
    if (!target) return;
    const meta = pageMeta[adminState.page];
    const renderer = ADMIN_RENDERERS[adminState.page];
    target.dataset.adminPage = adminState.page;
    target.dataset.adminClientType = currentClientType();
    target.innerHTML = `<div class="admin-app"><section class="admin-page" data-admin-page-id="${adminState.page}"><header class="admin-header"><div><h1>${meta[0]}</h1><p>${meta[1]}</p></div><div class="admin-header-actions">${renderClientTabs(adminState.page)}</div></header>${renderer()}</section>${adminState.toast ? `<div class="admin-toast">${escapeHtml(adminState.toast)}</div>` : ''}</div>`;
    document.querySelectorAll('[data-admin-page]').forEach((button) => button.classList.toggle('active', button.dataset.adminPage === adminState.page));
  }
  function setSurface(surface) {
    const admin = surface === 'admin';
    document.body.classList.toggle('admin-surface', admin);
    document.querySelectorAll('[data-annotation-surface]').forEach((button) => button.classList.toggle('active', button.dataset.annotationSurface === surface));
    const adminRoot = root();
    const clientFrame = document.getElementById('demoScaleFrame');
    if (adminRoot) adminRoot.hidden = !admin;
    if (clientFrame) clientFrame.hidden = admin;
    if (admin) {
      adminState.page = 'products';
      adminState.clientByPage.products = 'android';
      renderAdminApp();
    } else {
      requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
    }
  }
  function navigate(pageId) {
    if (!ADMIN_RENDERERS[pageId]) throw new Error(`Unknown admin page: ${pageId}`);
    adminState.page = pageId;
    if (pageId !== 'audit') adminState.clientByPage[pageId] = 'android';
    renderAdminApp();
    return window.__appRentalAdminDemo.snapshot();
  }
  function setClientType(clientType) {
    if (adminState.page === 'audit') throw new Error('Audit page has no client tab');
    if (!['android', 'mac'].includes(clientType)) throw new Error(`Unknown client type: ${clientType}`);
    const pageId = adminState.page;
    const previous = currentClientType(pageId);
    adminState.selectedIds[previous][pageId] = [];
    adminState.filters[previous][pageId] = {};
    adminState.clientByPage[pageId] = clientType;
    renderAdminApp();
    return window.__appRentalAdminDemo.snapshot();
  }
  function addAudit(action, objectId = '-') {
    const clientType = currentClientType();
    adminState.auditLogs.unshift({ id: `AUD-${Date.now()}`, time: new Date().toLocaleString('zh-CN', { hour12: false }), operator: '当前管理员', module: pageMeta[adminState.page][0], action, objectId, clientType, result: '成功' });
    adminState.toast = `${clientLabel(clientType)} · ${action} 已记录`;
    renderAdminApp();
    setTimeout(() => { adminState.toast = ''; renderAdminApp(); }, 1600);
  }
  document.addEventListener('click', (event) => {
    const surfaceButton = event.target.closest('[data-annotation-surface]');
    if (surfaceButton) { setSurface(surfaceButton.dataset.annotationSurface); return; }
    const navButton = event.target.closest('.admin-module-nav [data-admin-page]');
    if (navButton) { navigate(navButton.dataset.adminPage); return; }
    const clientButton = event.target.closest('[data-admin-client-tab]');
    if (clientButton) { setClientType(clientButton.dataset.adminClientTab); return; }
    const actionButton = event.target.closest('#appRentalAdminDemo [data-admin-action]');
    if (actionButton) addAudit(actionButton.textContent.trim(), actionButton.dataset.objectId || currentClientType());
  });
  window.__appRentalAdminDemo = Object.freeze({
    navigate,
    setClientType,
    setSurface,
    adminRequest(scope, payload = {}) { return { scope, clientType: currentClientType(), payload }; },
    snapshot() { return { page: adminState.page, clientType: currentClientType(), auditCount: adminState.auditLogs.length, dataCount: adminState.page === 'audit' ? adminState.auditLogs.length : (currentData()[dataKeyForPage(adminState.page)]?.length || 0) }; },
    reset() { adminState.page = 'products'; ADMIN_DUAL_CLIENT_PAGES.forEach((pageId) => { adminState.clientByPage[pageId] = 'android'; }); adminState.selectedIds = { android: {}, mac: {} }; adminState.filters = { android: {}, mac: {} }; adminState.auditLogs = [...BASE_AUDIT_LOGS]; adminState.toast = ''; renderAdminApp(); return this.snapshot(); },
  });
})();
</script>
<!-- APP_RENTAL_ADMIN_FRAGMENT_END -->
