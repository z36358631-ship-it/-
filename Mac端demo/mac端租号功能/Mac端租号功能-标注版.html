function filteredAuditLogs(now=serverNow()){const f=state.auditFilters,keyword=f.keyword.trim().toLowerCase(),objectId=f.objectId.trim().toLowerCase();return retainedAuditLogs(now).filter(log=>{const date=log.occurredAt.slice(0,10),search=[log.id,log.operatorName,log.operatorId,AUDIT_MODULE_LABELS[log.module],log.action,log.actionLabel,log.objectType,log.objectId,log.summary,log.requestId,log.error?.code,log.error?.reason].join(' ').toLowerCase();return(!f.startDate||date>=f.startDate)&&(!f.endDate||date<=f.endDate)&&(f.operator==='all'||log.operatorId===f.operator)&&(f.module==='all'||log.module===f.module)&&(f.action==='all'||log.action===f.action)&&(f.result==='all'||log.result===f.result)&&(!objectId||log.objectId.toLowerCase()===objectId)&&(!keyword||search.includes(keyword))})}
function auditPageData(now=serverNow()){const filtered=filteredAuditLogs(now),pageSize=Math.max(1,Number(state.auditFilters.pageSize)||10),totalPages=Math.max(1,Math.ceil(filtered.length/pageSize)),page=Math.min(totalPages,Math.max(1,Number(state.auditFilters.page)||1));state.auditFilters.page=page;return{filtered,pageSize,totalPages,page,rows:filtered.slice((page-1)*pageSize,page*pageSize)}}

function renderFlowNav(){const pages=state.mode==='mac'?MAC_PAGES:ADMIN_PAGES;document.getElementById('flowNav').innerHTML=`<div class="flow-head"><div class="flow-title">Mac 端租号功能</div><div class="flow-subtitle">交互标注文档 · 前后台一体</div></div><div class="mode-switch"><button class="mode-btn ${state.mode==='mac'?'active':''}" data-action="switch-mode" data-mode="mac">Mac 客户端</button><button class="mode-btn ${state.mode==='admin'?'active':''}" data-action="switch-mode" data-mode="admin">运营后台</button></div><div class="nav-group-label">${state.mode==='mac'?'用户链路':'后台模块'}</div><nav class="page-nav">${pages.map(p=>`<button class="page-item ${state.page===p.id?'active':''}" data-action="navigate" data-mode="${state.mode}" data-page="${p.id}">${icon(p.icon,16)}<span>${p.name}</span></button>`).join('')}</nav><div class="flow-bottom"><button class="shell-button ${state.badgeVisible?'active':''}" data-action="toggle-badges">${icon('badge-help',15)} ${state.badgeVisible?'隐藏标号':'显示标号'}</button></div>`}

function renderAnnotationPanel(){const list=annotations.filter(a=>a.mode===state.mode&&a.page===state.page&&a.tab===state.annotationTab);const pageName=(state.mode==='mac'?MAC_PAGES:ADMIN_PAGES).find(p=>p.id===state.page)?.name||(state.page==='refund-detail'?'退款详情':''),demoControls=state.mode==='mac'&&state.page==='after-sales'?`<section class="demo-controls" data-demo-controls="refund-case"><h4>演示控制 · 审核结果</h4><p>仅用于切换后续审核分支，不属于客户端功能。</p><div class="demo-control-row"><button class="${state.refundCase==='eligible'?'active':''}" data-action="set-refund-case" data-value="eligible">审核通过分支</button><button class="${state.refundCase==='ineligible'?'active':''}" data-action="set-refund-case" data-value="ineligible">审核拒绝分支</button></div></section>`:'';document.getElementById('annotationPanel').innerHTML=`<div class="anno-head"><strong>${pageName} · 标注</strong><div class="anno-actions"><button class="icon-btn badge-toggle ${state.badgeVisible?'active':''}" data-action="toggle-badges" title="显示标号">${icon('badge-help',15)}</button><button class="icon-btn" data-action="toggle-panel" title="收起">${icon('panel-right-close',15)}</button></div></div><div class="anno-tabs"><button class="anno-tab ${state.annotationTab==='interaction'?'active':''}" data-action="anno-tab" data-value="interaction">交互说明</button><button class="anno-tab ${state.annotationTab==='edge'?'active':''}" data-action="anno-tab" data-value="edge">异常 & 边界</button></div>${demoControls}<div class="anno-scroll"><div class="anno-section-title">${state.mode==='mac'?'MAC CLIENT':'OPERATIONS'} / ${pageName}</div>${list.length?list.map(a=>`<button class="anno-card" data-action="focus-annotation" data-id="${a.id}"><span class="anno-id ${a.id.startsWith('E')?'error':a.id.startsWith('G')?'global':''}">${a.id}</span><span class="anno-copy"><h5>${a.title}</h5><span class="anno-fields"><span class="anno-field"><b>触发条件</b><p>${a.trigger}</p></span><span class="anno-field"><b>展示说明</b><p>${a.display}</p></span><span class="anno-field"><b>交互说明</b><p>${a.interaction}</p></span></span><span class="anno-tag">${a.tag}</span></span></button>`).join(''):`<div style="padding:30px 10px;text-align:center;color:var(--shell-faint);font-size:11px">当前页面暂无此类标注</div>`}</div>`;refreshIcons()}
function renderApp(){const reminderLayer=document.getElementById('expiryReminderLayer');if(reminderLayer&&!reminderLayer.hidden&&(state.steamSession!=='rental'||reminderLayer.dataset.orderId!==state.activeRentalOrderId))hideExpiryReminder();document.body.dataset.mode=state.mode;document.body.dataset.page=state.page;document.body.dataset.badges=state.badgeVisible?'visible':'hidden';document.getElementById('app').classList.toggle('panel-closed',!state.panelOpen);renderFlowNav();renderCanvas();renderAnnotationPanel()}
function navigate(mode,page,track=true){const fromMode=state.mode,fromPage=state.page;if(track&&state.mode==='mac'&&mode==='mac'&&state.page!==page)state.macHistory.push(state.page);state.mode=mode;state.page=page;if(page!=='detail')state.detailGuardOpen=false;if(page!=='audit')state.auditDetailId='';renderApp();if(fromMode==='mac'&&fromPage==='checkout'&&mode==='mac'&&page==='detail'&&credentialAccess(state.selectedOrderId).ok)openLoginMethodDialog(state.selectedOrderId)}
function updateScale(){const vp=document.getElementById('canvasViewport'),canvas=document.getElementById('demoCanvas');if(!vp||!canvas)return;const w=state.mode==='mac'?1076:1800,h=state.mode==='mac'?734:1300;const scale=Math.min((vp.clientWidth-28)/w,(vp.clientHeight-28)/h,1);canvas.style.transform=`translate(-50%,-50%) scale(${Math.max(scale,.1)})`}

let confirmHandler=null,formHandler=null;function openConfirm({title,message,confirmText='确认',options=null,danger=false,onConfirm}){formHandler=null;confirmHandler=onConfirm;const layer=document.getElementById('confirmLayer');layer.hidden=false;layer.innerHTML=`<div class="confirm-box"><h3>${title}</h3><p>${message}</p>${options?`<div class="confirm-options">${options.map((o,i)=>`<button data-action="confirm-option" data-index="${i}">${o.label}<span class="subline">${o.desc}</span></button>`).join('')}</div>`:''}<div class="confirm-actions"><button data-action="confirm-no">取消</button>${options?'':`<button class="${danger?'danger':'primary'}" data-action="confirm-yes">${confirmText}</button>`}</div></div>`}

function recordCredentialEvent(event,orderId,extra={}){state.rentalEvents.push({event,orderId,result:extra.result||'success',...(extra.action?{action:extra.action}:{}),...(extra.errorCode?{errorCode:extra.errorCode}:{}),at:serverNow()})}
function copySensitiveText(value,label){const fallback=()=>{const temp=document.createElement('textarea');temp.value=value;temp.setAttribute('readonly','');temp.style.position='fixed';temp.style.opacity='0';document.body.appendChild(temp);temp.select();try{document.execCommand('copy')}finally{temp.remove()}};try{const result=navigator.clipboard?.writeText?.(value);if(result?.catch)result.catch(fallback);else fallback()}catch{fallback()}showToast(`${label}已复制，请勿分享`)}
function openLoginMethodDialog(orderId,{oneClickFailed=false}={}){const access=credentialAccess(orderId);if(!access.ok){recordCredentialEvent('rental_login_method_select',orderId,{result:'failed',errorCode:access.reason});return showToast('当前使用单已失效，无法登录','error')}clearCredentialView();state.credentialView.orderId=orderId;const g=gameById(access.order.gameId),layer=document.getElementById('confirmLayer');confirmHandler=null;formHandler=null;layer.hidden=false;layer.innerHTML=`<section class="order-confirm-dialog login-method-dialog" role="dialog" aria-modal="true" aria-labelledby="loginMethodTitle" data-anno-target="login-method-choice"><button class="order-confirm-close" data-action="confirm-no" title="关闭">${icon('x',16)}</button><div class="order-confirm-head"><div class="order-confirm-icon">${icon('log-in',21)}</div><div><h3 id="loginMethodTitle">${oneClickFailed?'一键上号未完成':'选择登录方式'}</h3><p>${oneClickFailed?'可以重试，或改用账号密码手动登录。':'两种方式使用同一个租赁账号，不会重复取号。'}</p></div></div><div class="order-confirm-game"><img src="${g.image}" alt="${g.name}"><div><strong>${g.name}</strong><span>${versionName(access.order.version)} · ${statusName(access.order.status)}</span></div><b class="order-confirm-amount">${access.order.periodCode==='monthly_member'?'会员权益':access.order.period}</b></div><div class="login-method-grid"><button class="login-method-card primary" data-action="choose-one-click-login" data-id="${orderId}"><span class="login-method-card-icon">${icon('rocket',20)}</span><b>${oneClickFailed?'重试一键上号':'一键上号'}</b><span>系统自动完成 Steam 登录，成功后直接进入下载或启动流程。</span></button><button class="login-method-card" data-action="choose-manual-login" data-id="${orderId}"><span class="login-method-card-icon">${icon('keyboard',20)}</span><b>手动登录</b><span>查看账号和密码，按需获取 Steam 令牌验证码。</span></button></div><div class="login-method-safe">${icon('shield-check',13)} 登录信息仅在当前使用单有效期内可查看</div></section>`;recordCredentialEvent('rental_login_method_select',orderId,{action:'view_options'});refreshIcons()}
function openManualLoginDialog(orderId,{refreshAccess=true}={}){const access=credentialAccess(orderId),now=serverNow();if(!access.ok){recordCredentialEvent('rental_credential_view',orderId,{result:'failed',errorCode:access.reason});clearCredentialView(orderId);return showToast('登录信息已失效，请重新取号','error')}if(state.credentialView.orderId!==orderId)Object.assign(state.credentialView,{orderId,accountVisible:false,passwordVisible:false,guardCodeVisible:false,accessExpireAt:0});if(refreshAccess||Number(state.credentialView.accessExpireAt)<=now)state.credentialView.accessExpireAt=Math.min(Number(access.order.expireAt),now+5*60000);const accountText=state.credentialView.accountVisible?access.account.loginName:maskLoginName(access.account.loginName),passwordText=state.credentialView.passwordVisible?access.account.loginPassword:'••••••••••',guardActive=state.credentialView.guardCodeVisible&&Number(access.account.guardExpireAt)>now,guardText=guardActive?access.account.guardCode:'未获取',guardRemaining=guardActive?Math.max(0,Math.ceil((Number(access.account.guardExpireAt)-now)/1000)):0,g=gameById(access.order.gameId),layer=document.getElementById('confirmLayer');confirmHandler=null;formHandler=null;layer.hidden=false;layer.innerHTML=`<section class="order-confirm-dialog manual-login-dialog" role="dialog" aria-modal="true" aria-labelledby="manualLoginTitle" data-anno-target="manual-login-credentials"><button class="order-confirm-close" data-action="confirm-no" title="关闭">${icon('x',16)}</button><div class="credential-watermark">${access.order.id} · ${access.order.user}</div><div class="order-confirm-head"><div class="order-confirm-icon">${icon('key-round',21)}</div><div><h3 id="manualLoginTitle">Steam 登录信息</h3><p>${g.name} · 仅用于当前使用单，请勿分享或保存。</p></div></div><div class="credential-panel"><div class="credential-row"><span>Steam 账号</span><b class="credential-value">${accountText}</b><div class="credential-actions"><button class="credential-icon-btn" data-action="toggle-account-visibility" data-id="${orderId}">${icon(state.credentialView.accountVisible?'eye-off':'eye',13)} ${state.credentialView.accountVisible?'隐藏':'查看'}</button><button class="credential-icon-btn" data-action="copy-login-account" data-id="${orderId}">${icon('copy',13)} 复制</button></div></div><div class="credential-row"><span>Steam 密码</span><b class="credential-value">${passwordText}</b><div class="credential-actions"><button class="credential-icon-btn" data-action="toggle-password-visibility" data-id="${orderId}">${icon(state.credentialView.passwordVisible?'eye-off':'eye',13)} ${state.credentialView.passwordVisible?'隐藏':'查看'}</button><button class="credential-icon-btn" data-action="copy-login-password" data-id="${orderId}">${icon('copy',13)} 复制</button></div></div><div class="credential-row"><span>令牌验证码</span><b class="credential-value guard" data-guard-value>${guardText}</b><div class="credential-actions"><button class="credential-icon-btn" data-action="request-guard-code" data-id="${orderId}">${icon(guardActive?'refresh-cw':'shield-keyhole',13)} ${guardActive?'刷新':'获取验证码'}</button></div><small class="credential-countdown" data-guard-countdown>${guardActive?`${guardRemaining} 秒后失效`:'点击后获取当前验证码'}</small></div></div><div class="credential-note">到期、换号、退款或结束使用后，平台会撤销登录会话并回收凭据；回收失败的账号不会再次分配。</div><div class="credential-footer"><span class="credential-footer-copy">授权查看至 ${formatDateTime(state.credentialView.accessExpireAt)}</span><div class="credential-footer-actions"><button class="mac-btn ghost" data-action="back-to-login-methods" data-id="${orderId}">返回选择</button><button class="mac-btn green" data-action="manual-login-done" data-id="${orderId}">已完成登录</button></div></div></section>`;recordCredentialEvent('rental_credential_view',orderId,{action:'open'});refreshIcons()}
