function render(){let oldFocus=document.activeElement?.dataset?.action;document.getElementById('device').classList.toggle('landscape',state.orientation==='landscape');document.getElementById('workspace').classList.toggle('land-mode',state.orientation==='landscape');document.getElementById('portraitBtn').classList.toggle('active',state.orientation==='portrait');document.getElementById('landscapeBtn').classList.toggle('active',state.orientation==='landscape');document.getElementById('sizeLabel').textContent=state.orientation==='portrait'?'402 × 850':'900 × 430';const renderers={library:renderLibrary,legal:renderLegal,mode:renderMode,prepare:renderPrepare,settings:renderSettings,steamSettings:renderSteamSettings,profile:renderProfile,steam:renderSteam,login:renderSteam};screen.innerHTML=renderers[state.page]();if(state.modal)screen.insertAdjacentHTML('beforeend',modal());document.getElementById('rail').innerHTML=rail();document.getElementById('scenario').value=state.scenario;document.getElementById('viewLabel').textContent={library:'盖世游戏 · 游戏库',legal:'Steam · 协议全文',mode:'首次进入 · 模式选择',prepare:'首次准备 · Steam 运行组件',settings:'盖世游戏 · 设置',steamSettings:'盖世游戏 · Steam 设置',profile:'盖世游戏 · 我的',steam:'Steam · '+(state.currentMode==='gamepad'?'大屏模式':'窗口模式')+'（交互模拟）',login:'Steam · 原生登录承接（模拟）'}[state.page];let step=state.page==='prepare'?1:['steam','login'].includes(state.page)?2:['settings','steamSettings','profile'].includes(state.page)?3:0;document.getElementById('crumbs').innerHTML=['01 进入','02 准备','03 Steam','04 返回与设置'].map((t,i)=>i===step?'<b>'+t+'</b>':'<span>'+t+'</span>').join('');if(state.modal){(screen.querySelector('.modal button[aria-checked="true"]')||screen.querySelector('.modal .btn.primary'))?.focus({preventScroll:true})}else if(focusAfter){document.querySelector('[data-action="'+focusAfter+'"]')?.focus({preventScroll:true});focusAfter=null}else if(oldFocus){screen.querySelector('[data-action="'+oldFocus+'"]')?.focus({preventScroll:true})}bindBall()}
