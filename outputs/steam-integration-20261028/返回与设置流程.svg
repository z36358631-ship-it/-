<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1350" viewBox="0 0 1380 1350" role="img" aria-label="02 使用中：返回、设置与原生能力承接"><defs><marker id="arrow-02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7d91"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#17273b}.sub{font-size:15px;fill:#65738a}.label{font-size:15px;fill:#4a5c73;paint-order:stroke;stroke:#f7f9fc;stroke-width:7px;stroke-linejoin:round}.node{font-size:18px;font-weight:600;fill:#24344b}.small{font-size:14px;font-weight:400;fill:#5c6d82}.note{font-size:16px;fill:#53677f}</style><rect width="1380" height="1350" fill="#f7f9fc"/><text class="title" x="60" y="58">02 使用中：返回、设置与原生能力承接</text><text class="sub" x="60" y="90">Steam 与盖世模式独立 · 最小化球不改变 Steam 页面 · 球无关闭及开关</text><path d="M510 175 H275 V305" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M690 210 V305" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M870 175 H1105 V305" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M275 375 V445" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M1105 375 V445" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M690 375 V580" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M430 480 H490 V615 H510" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><text class="label" x="516" y="548" text-anchor="middle">接受游戏邀请</text><path d="M690 650 V696" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M845 745 H950" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><text class="label" x="900" y="730" text-anchor="middle">失败</text><path d="M1105 710 V615 H870" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><text class="label" x="1040" y="598" text-anchor="middle">重试</text><path d="M690 794 V840" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><text class="label" x="719" y="827" text-anchor="middle">成功</text><path d="M510 195 H65 V745 H120" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><text class="label" x="125" y="635" text-anchor="middle">收起 Steam</text><path d="M275 710 V615 H25 V125 H690 V140" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><text class="label" x="272" y="599" text-anchor="middle">完成当前确认后恢复</text><path d="M275 780 V850" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M275 920 V1000" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><path d="M1265 175 H1320 V1035 H1275" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><text class="label" x="1283" y="941" text-anchor="middle">悬浮球菜单</text><path d="M1105 1070 V1120" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-02)"/><rect x="510" y="140" width="360" height="70" rx="14" fill="#e6edf6" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="181">Steam 窗口式 / 大屏式界面</text><rect x="115" y="305" width="320" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="275" y="346">好友 / 消息通知</text><rect x="530" y="305" width="320" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="346">游戏库 → 启动游戏</text><rect x="945" y="305" width="320" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1105" y="346">创意工坊</text><rect x="120" y="445" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="275" y="475">Steam 原生好友 / 对应 event</text><text class="small" text-anchor="middle" x="275" y="499">未就绪时保留目标</text><rect x="510" y="580" width="360" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="610">盖世游戏运行桥接</text><text class="small" text-anchor="middle" x="690" y="634">启动参数 / 邀请参数须透传</text><rect x="950" y="445" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1105" y="475">Steam 原生工坊</text><text class="small" text-anchor="middle" x="1105" y="499">保留具体游戏上下文</text><path d="M690 696 L845 745 L690 794 L535 745 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="751">实际启动结果？</text><rect x="950" y="710" width="310" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1105" y="740">启动失败</text><text class="small" text-anchor="middle" x="1105" y="764">保留上下文；可重试或返回</text><rect x="535" y="840" width="310" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="881">进入游戏</text><rect x="120" y="710" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="275" y="740">球 / 固定返回 → 返回盖世</text><text class="small" text-anchor="middle" x="275" y="764">保留当前模式与会话</text><rect x="120" y="850" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="275" y="880">设置 → Steam 设置 → 启动模式</text><text class="small" text-anchor="middle" x="275" y="904">每次询问 / 大屏 / 窗口</text><rect x="95" y="1000" width="360" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="275" y="1030">下次新启动应用新偏好</text><text class="small" text-anchor="middle" x="275" y="1054">恢复已有会话仍沿用当前模式</text><rect x="935" y="1000" width="340" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1105" y="1030">菜单 → 最小化悬浮球</text><text class="small" text-anchor="middle" x="1105" y="1054">球缩成小图标，Steam页面不变</text><rect x="935" y="1120" width="340" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1105" y="1150">点击小图标</text><text class="small" text-anchor="middle" x="1105" y="1174">恢复常规球并展开菜单</text><text class="note" x="60" y="1270">Demo 仅演示路由和状态：不发送真实消息、不登录真实账号、不下载真实组件、不启动真实游戏。</text><text class="note" x="60" y="1296">账号与下载迁移、组件更新、手柄输入、原生页面内 View 覆盖及游戏启动桥接均需单独联调验收。</text></svg>