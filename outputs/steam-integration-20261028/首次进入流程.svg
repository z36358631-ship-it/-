<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="2240" viewBox="0 0 1380 2240" role="img" aria-label="01 进入 Steam：模式、组件与登录声明"><defs><marker id="arrow-01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7d91"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#17273b}.sub{font-size:15px;fill:#65738a}.label{font-size:15px;fill:#4a5c73;paint-order:stroke;stroke:#f7f9fc;stroke-width:7px;stroke-linejoin:round}.node{font-size:18px;font-weight:600;fill:#24344b}.small{font-size:14px;font-weight:400;fill:#5c6d82}.note{font-size:16px;fill:#53677f}</style><rect width="1380" height="2240" fill="#f7f9fc"/><text class="title" x="60" y="58">01 进入 Steam：模式、组件与登录声明</text><text class="sub" x="60" y="90">声明确认位于首次账号登录授权 · 模式页仅选择启动方式 · 所有成功以实际回执为准</text><path d="M690 200 V236" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M870 285 H955" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="910" y="270" text-anchor="middle">是</text><path d="M1110 320 H1320 V1830 H845" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1200" y="1810" text-anchor="middle">有效会话恢复</text><path d="M690 334 V371" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="714" y="360" text-anchor="middle">否</text><path d="M510 420 H435" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="474" y="404" text-anchor="middle">否</text><path d="M255 455 V515" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="289" y="492" text-anchor="middle">取消</text><path d="M435 435 H475 V550 H535" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="495" y="524" text-anchor="middle">继续</text><path d="M690 469 V515" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="714" y="492" text-anchor="middle">是</text><path d="M690 585 V646" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M690 744 V795" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="714" y="779" text-anchor="middle">否</text><path d="M870 695 H900 V1050 H690 V1075" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="924" y="740" text-anchor="middle">是</text><path d="M535 815 H435" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="486" y="799" text-anchor="middle">中断</text><path d="M435 849 H535" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="486" y="880" text-anchor="middle">恢复 / 重试</text><path d="M690 865 V935" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M535 955 H435" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="486" y="941" text-anchor="middle">失败</text><path d="M435 990 H535" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="486" y="1022" text-anchor="middle">重试准备</text><path d="M75 970 H35 V760 H690 V795" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="260" y="747" text-anchor="middle">校验失败重取损坏内容</text><path d="M690 1005 V1075" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M845 1095 H930" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="889" y="1080" text-anchor="middle">失败</text><path d="M930 1128 H845" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="889" y="1160" text-anchor="middle">重试</text><path d="M690 1145 V1196" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M510 1245 H450" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="480" y="1230" text-anchor="middle">否</text><path d="M690 1294 V1455 H925 V1830 H845" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="993" y="1450" text-anchor="middle">是：直接进入</text><path d="M255 1280 V1336" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M435 1385 H690 V1500" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="554" y="1370" text-anchor="middle">是</text><path d="M255 1434 V1500" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="279" y="1479" text-anchor="middle">否</text><path d="M450 1535 H535" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="491" y="1517" text-anchor="middle">知晓并同意</text><path d="M60 1535 H20 V1245 H60" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="158" y="1630" text-anchor="middle">不同意：保留账号密码</text><path d="M690 1570 V1631" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M870 1680 H930" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="900" y="1664" text-anchor="middle">失败</text><path d="M1110 1645 V1535 H845" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1065" y="1518" text-anchor="middle">重试</text><path d="M690 1729 V1795" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="719" y="1773" text-anchor="middle">成功</text><path d="M690 1865 V1935" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><rect x="535" y="130" width="310" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="171">游戏库 → Steam 入口</text><path d="M690 236 L870 285 L690 334 L510 285 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="291">会话及登录仍有效？</text><rect x="955" y="250" width="310" height="70" rx="14" fill="#e6edf6" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="291">恢复原 Steam 页面与模式</text><path d="M690 371 L870 420 L690 469 L510 420 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="426">已记住启动模式？</text><rect x="75" y="385" width="360" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="415">选择大屏 / 窗口</text><text class="small" text-anchor="middle" x="255" y="439">记住我的选择默认关闭</text><rect x="75" y="515" width="360" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="545">取消 → 返回游戏库</text><text class="small" text-anchor="middle" x="255" y="569">不保存本次模式偏好</text><rect x="535" y="515" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="556">使用选择或已保存的模式</text><path d="M690 646 L870 695 L690 744 L510 695 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="701">组件可用且已准备？</text><rect x="535" y="795" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="825">下载运行组件</text><text class="small" text-anchor="middle" x="690" y="849">真实字节进度，可暂停继续</text><rect x="75" y="795" width="360" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="825">网络 / 空间异常或离开</text><text class="small" text-anchor="middle" x="255" y="849">保留有效分片，恢复后重试</text><rect x="535" y="935" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="965">校验 → 准备</text><text class="small" text-anchor="middle" x="690" y="989">100% 下载不代表可以使用</text><rect x="75" y="935" width="360" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="965">校验或准备失败</text><text class="small" text-anchor="middle" x="255" y="989">重取损坏内容 / 重试准备</text><rect x="535" y="1075" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1116">启动 Steam</text><rect x="930" y="1075" width="360" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="1105">启动失败</text><text class="small" text-anchor="middle" x="1110" y="1129">重试或返回，不重复下载有效包</text><path d="M690 1196 L870 1245 L690 1294 L510 1245 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1251">原生登录仍有效？</text><rect x="60" y="1210" width="390" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1240">登录页：账号、密码、声明</text><text class="small" text-anchor="middle" x="255" y="1264">首次默认未勾选，全文可只读查看</text><path d="M255 1336 L435 1385 L255 1434 L75 1385 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1391">点击登录时已勾选？</text><rect x="60" y="1500" width="390" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1530">声明弹窗：全文可上下滚动</text><text class="small" text-anchor="middle" x="255" y="1554">知晓并同意 / 不同意（纯文字）</text><rect x="535" y="1500" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1530">提交本次登录授权</text><text class="small" text-anchor="middle" x="690" y="1554">保存当前声明版本，等待登录结果</text><path d="M690 1631 L870 1680 L690 1729 L510 1680 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1686">实际登录结果？</text><rect x="930" y="1645" width="360" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="1675">登录未完成</text><text class="small" text-anchor="middle" x="1110" y="1699">保留输入与目标，可重试或返回</text><rect x="535" y="1795" width="310" height="70" rx="14" fill="#e6edf6" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1825">Steam 界面可用</text><text class="small" text-anchor="middle" x="690" y="1849">进入库或原目标</text><rect x="535" y="1935" width="310" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1965">返回盖世游戏</text><text class="small" text-anchor="middle" x="690" y="1989">保留 Steam 会话，不注销</text><text class="note" x="60" y="2160">声明同版本已同意可回显；新版本在下次登录授权确认，不因版本变化打断有效会话。只读查看不自动同意或登录。</text><text class="note" x="60" y="2186">悬浮球最小化只缩小球，不改变 Steam 页面；不同于“返回盖世游戏”。用户提供声明正文，法律及服务事实仍需核对。</text><text class="note" x="60" y="2212">图为产品方案；APK 当前模拟器启动受阻，真实登录、游戏启动与迁移须真机联调。</text></svg>