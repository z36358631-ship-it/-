e" text-anchor="middle" x="1110" y="1045">复用本方案会话与原模式</text><text class="small" text-anchor="middle" x="1110" y="1069">有新游戏目标则继续该目标</text><rect x="500" y="1175" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1205">确定本次启动模式</text><text class="small" text-anchor="middle" x="690" y="1229">首次新方案按所选模式启动</text><rect x="65" y="1175" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1205">未记忆模式 → 选择页</text><text class="small" text-anchor="middle" x="255" y="1229">已确认协议可回显；取消不保存</text><path d="M690 1321 L880 1370 L690 1419 L500 1370 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1376">组件可用且已准备？</text><rect x="500" y="1495" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1525">简洁准备弹窗：下载组件</text><text class="small" text-anchor="middle" x="690" y="1549">实际进度，暂停 / 继续 / 收起</text><rect x="65" y="1495" width="380" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1525">断网 / 空间不足 / 收起</text><text class="small" text-anchor="middle" x="255" y="1549">保留有效内容；重进后继续</text><rect x="500" y="1655" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1685">同一弹窗：校验 → 准备</text><text class="small" text-anchor="middle" x="690" y="1709">仅显示当前状态与操作</text><rect x="65" y="1655" width="380" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1685">校验失败 / 准备失败</text><text class="small" text-anchor="middle" x="255" y="1709">重取损坏内容 / 重试准备</text><rect x="500" y="1815" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1845">同一弹窗：启动 Steam</text><text class="small" text-anchor="middle" x="690" y="1869">等待真实可用结果</text><rect x="920" y="1815" width="380" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="1845">启动失败</text><text class="small" text-anchor="middle" x="1110" y="1869">重试复用有效组件，或收起</text><path d="M690 1961 L880 2010 L690 2059 L500 2010 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2016">Steam 登录态仍有效？</text><rect x="500" y="2135" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2165">关闭弹窗 → 登录页</text><text class="small" text-anchor="middle" x="690" y="2189">上方扫码，下方账号密码</text><rect x="60" y="2135" width="390" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="2165">二维码加载 / 有效 / 过期 / 失败</text><text class="small" text-anchor="middle" x="255" y="2189">过期刷新，获取失败重试</text><rect x="65" y="2295" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="2325">已扫码：等待手机确认</text><text class="small" text-anchor="middle" x="255" y="2349">扫码本身不算登录成功</text><path d="M690 2281 L890 2330 L690 2379 L490 2330 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2325">原生认证结果</text><text class="small" text-anchor="middle" x="690" y="2349">扫码或账号密码，两路径只进入一次</text><rect x="920" y="2295" width="380" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="2325">登录失败</text><text class="small" text-anchor="middle" x="1110" y="2349">保留输入及原目标，可重试</text><rect x="500" y="2555" width="380" height="70" rx="14" fill="#e6edf6" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2585">Steam 界面可用</text><text class="small" text-anchor="middle" x="690" y="2609">进入库或继续指定游戏目标</text><rect x="500" y="2725" width="380" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2755">返回盖世游戏</text><text class="small" text-anchor="middle" x="690" y="2779">保留本方案会话，不注销</text><rect x="920" y="2555" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="2585">承接指定 PC 游戏</text><text class="small" text-anchor="middle" x="1110" y="2609">发起实际游戏运行请求</text><path d="M1110 2711 L1300 2760 L1110 2809 L920 2760 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="2766">实际运行结果？</text><rect x="920" y="2905" width="380" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="2946">进入目标游戏</text><rect x="495" y="2905" width="390" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2935">失败：保留目标，可明确重试</text><text class="small" text-anchor="middle" x="690" y="2959">取消：停止本次自动继续</text><text class="note" x="60" y="3220">冷启动未设置与旧版缺字段均按启动时方向；设置只有主页、社区、游戏库、Steam四项。旋转当前页面不跳转。</text><text class="note" x="60" y="3246">新方案/协议、模式、组件及登录共用门禁；导入成功不等于Steam权益或游戏运行成功。取消不会在下次普通进入时自动启动。</text><text class="note" x="60" y="3272">资料昵称头像不取登录账号字符串；Demo仅模拟落地、资料与运行结果，真实认证、文件导入及游戏运行仍需联调。</text></svg>