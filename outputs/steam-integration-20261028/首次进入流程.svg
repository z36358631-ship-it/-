<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="2560" viewBox="0 0 1380 2560" role="img" aria-label="01 进入 Steam：模式、协议与扫码登录"><defs><marker id="arrow-01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7d91"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#17273b}.sub{font-size:15px;fill:#65738a}.label{font-size:15px;fill:#4a5c73;paint-order:stroke;stroke:#f7f9fc;stroke-width:7px;stroke-linejoin:round}.node{font-size:18px;font-weight:600;fill:#24344b}.small{font-size:14px;font-weight:400;fill:#5c6d82}.note{font-size:16px;fill:#53677f}</style><rect width="1380" height="2560" fill="#f7f9fc"/><text class="title" x="60" y="58">01 进入 Steam：模式、协议与扫码登录</text><text class="sub" x="60" y="90">旧版已登录也须首次确认 · 准备弹窗仅状态、进度和操作 · 实际登录成功才进入</text><path d="M690 200 V241" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M500 290 H255 V405" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="284" y="325" text-anchor="middle">否：含旧版已登录</text><path d="M880 290 H1110 V391" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1065" y="325" text-anchor="middle">是</text><path d="M1110 489 V565" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1140" y="535" text-anchor="middle">是</text><path d="M920 440 H690 V711" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="767" y="520" text-anchor="middle">否：按偏好</text><path d="M255 475 V565" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="255" y="530" text-anchor="middle">勾选后继续</text><path d="M445 600 H480 V760 H500" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="470" y="695" text-anchor="middle">首次按所选模式</text><path d="M500 740 H445" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="470" y="717" text-anchor="middle">需询问</text><path d="M445 778 H500" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="472" y="812" text-anchor="middle">继续</text><path d="M690 795 V871" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M690 969 V1045" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="719" y="1013" text-anchor="middle">否</text><path d="M880 920 H1315 V1320 H690 V1365" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1195" y="952" text-anchor="middle">是：复用</text><path d="M500 1063 H445" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="473" y="1043" text-anchor="middle">中断</text><path d="M445 1098 H500" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="473" y="1141" text-anchor="middle">恢复</text><path d="M690 1115 V1205" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M500 1223 H445" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="473" y="1203" text-anchor="middle">失败</text><path d="M445 1258 H500" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="473" y="1301" text-anchor="middle">重试</text><path d="M65 1240 H30 V990 H690 V1045" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="265" y="975" text-anchor="middle">校验失败重取损坏内容</text><path d="M690 1275 V1365" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M880 1383 H920" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="900" y="1356" text-anchor="middle">失败</text><path d="M920 1418 H880" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="900" y="1459" text-anchor="middle">重试</text><path d="M690 1435 V1511" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M690 1609 V1685" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="719" y="1650" text-anchor="middle">否</text><path d="M880 1560 H1315 V2140 H880" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1165" y="2118" text-anchor="middle">是：含有效旧登录态</text><path d="M500 1720 H450" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M255 1755 V1845" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="283" y="1807" text-anchor="middle">扫码</text><path d="M445 1880 H490" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M690 1755 V1831" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="778" y="1807" text-anchor="middle">账号密码登录</text><path d="M890 1880 H920" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="903" y="1858" text-anchor="middle">失败</text><path d="M1110 1845 V1720 H880" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1095" y="1701" text-anchor="middle">重试</text><path d="M690 1929 V2105" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="740" y="2020" text-anchor="middle">实际成功</text><path d="M690 2175 V2275" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><rect x="535" y="130" width="310" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="171">游戏库 → Steam 入口</text><path d="M690 241 L880 290 L690 339 L500 290 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="296">新方案和当前声明已确认？</text><rect x="60" y="405" width="390" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="435">模式选择 + 记忆开关 + 协议勾选</text><text class="small" text-anchor="middle" x="255" y="459">首次未勾选，继续禁用</text><rect x="60" y="565" width="390" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="595">勾选后继续</text><text class="small" text-anchor="middle" x="255" y="619">保存模式、声明版本及新流程确认</text><path d="M1110 391 L1300 440 L1110 489 L920 440 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="446">本方案有效会话可恢复？</text><rect x="920" y="565" width="380" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="595">恢复原 Steam 页面与模式</text><text class="small" text-anchor="middle" x="1110" y="619">仅适用已完成新方案的再次进入</text><rect x="500" y="725" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="755">确定本次启动模式</text><text class="small" text-anchor="middle" x="690" y="779">首次新方案按所选模式启动</text><rect x="65" y="725" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="755">未记忆模式 → 选择页</text><text class="small" text-anchor="middle" x="255" y="779">已确认协议可回显；取消不保存</text><path d="M690 871 L880 920 L690 969 L500 920 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="926">组件可用且已准备？</text><rect x="500" y="1045" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1075">简洁准备弹窗：下载组件</text><text class="small" text-anchor="middle" x="690" y="1099">实际进度，暂停 / 继续 / 收起</text><rect x="65" y="1045" width="380" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1075">断网 / 空间不足 / 收起</text><text class="small" text-anchor="middle" x="255" y="1099">保留有效内容；重进后继续</text><rect x="500" y="1205" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1235">同一弹窗：校验 → 准备</text><text class="small" text-anchor="middle" x="690" y="1259">仅显示当前状态与操作</text><rect x="65" y="1205" width="380" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1235">校验失败 / 准备失败</text><text class="small" text-anchor="middle" x="255" y="1259">重取损坏内容 / 重试准备</text><rect x="500" y="1365" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1395">同一弹窗：启动 Steam</text><text class="small" text-anchor="middle" x="690" y="1419">等待真实可用结果</text><rect x="920" y="1365" width="380" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="1395">启动失败</text><text class="small" text-anchor="middle" x="1110" y="1419">重试复用有效组件，或收起</text><path d="M690 1511 L880 1560 L690 1609 L500 1560 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1566">Steam 登录态仍有效？</text><rect x="500" y="1685" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1715">关闭弹窗 → 登录页</text><text class="small" text-anchor="middle" x="690" y="1739">上方扫码，下方账号密码</text><rect x="60" y="1685" width="390" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1715">二维码加载 / 有效 / 过期 / 失败</text><text class="small" text-anchor="middle" x="255" y="1739">过期刷新，获取失败重试</text><rect x="65" y="1845" width="380" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1875">已扫码：等待手机确认</text><text class="small" text-anchor="middle" x="255" y="1899">扫码本身不算登录成功</text><path d="M690 1831 L890 1880 L690 1929 L490 1880 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1875">原生认证结果</text><text class="small" text-anchor="middle" x="690" y="1899">扫码或账号密码，两路径只进入一次</text><rect x="920" y="1845" width="380" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="1875">登录失败</text><text class="small" text-anchor="middle" x="1110" y="1899">保留输入及原目标，可重试</text><rect x="500" y="2105" width="380" height="70" rx="14" fill="#e6edf6" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2135">Steam 界面可用</text><text class="small" text-anchor="middle" x="690" y="2159">进入库或原目标</text><rect x="500" y="2275" width="380" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2305">返回盖世游戏</text><text class="small" text-anchor="middle" x="690" y="2329">保留本方案会话，不注销</text><text class="note" x="60" y="2480">旧版首次接入不能凭已登录或记忆模式跳过；继续后按本次模式启动新界面，有效登录态保留。</text><text class="note" x="60" y="2506">未勾选不能继续；取消不保存本次更改；声明全文只读往返保留选择，登录页不再重复勾选。</text><text class="note" x="60" y="2532">Demo 二维码仅为模拟；原生扫码、账号迁移、游戏运行及输入仍须联调。</text></svg>