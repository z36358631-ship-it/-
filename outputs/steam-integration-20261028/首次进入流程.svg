525" text-anchor="middle">是</text><path d="M510 595 H475 V665 H255 V710" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="433" y="650" text-anchor="middle">否</text><path d="M690 644 V710" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="715" y="685" text-anchor="middle">是</text><path d="M435 745 H535" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="485" y="728" text-anchor="middle">继续</text><path d="M255 780 V840" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="288" y="813" text-anchor="middle">取消</text><path d="M690 780 V846" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M690 944 V1010" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="715" y="984" text-anchor="middle">否</text><path d="M870 895 H940 V1295 H690 V1330" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1050" y="945" text-anchor="middle">是：复用有效组件</text><path d="M510 1030 H435" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="473" y="1010" text-anchor="middle">中断</text><path d="M435 1063 H510" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="475" y="1105" text-anchor="middle">恢复 / 重试</text><path d="M690 1080 V1170" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M510 1190 H435" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="473" y="1170" text-anchor="middle">失败</text><path d="M435 1223 H510" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="473" y="1265" text-anchor="middle">重试准备</text><path d="M75 1205 H35 V970 H690 V1010" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="267" y="957" text-anchor="middle">校验失败：重取损坏内容</text><path d="M690 1240 V1330" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M870 1348 H930" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="900" y="1328" text-anchor="middle">失败</text><path d="M930 1383 H870" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="900" y="1423" text-anchor="middle">重试</text><path d="M690 1400 V1476" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M690 1574 V1640" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="715" y="1612" text-anchor="middle">否</text><path d="M870 1525 H1315 V2320 H885" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1190" y="2302" text-anchor="middle">是：直接进入</text><path d="M690 1710 V1786" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M510 1835 H450" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="480" y="1815" text-anchor="middle">已取消</text><path d="M690 1884 V1960" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="715" y="1930" text-anchor="middle">是</text><path d="M255 1800 V1675 H495" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="282" y="1648" text-anchor="middle">不同意：关闭且保留输入</text><path d="M255 1870 V1995 H510" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="386" y="1977" text-anchor="middle">知晓并同意</text><path d="M690 2030 V2106" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><path d="M870 2155 H930" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="900" y="2135" text-anchor="middle">失败</text><path d="M1110 2120 V1995 H870" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="1058" y="1977" text-anchor="middle">重试</text><path d="M690 2204 V2285" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><text class="label" x="719" y="2250" text-anchor="middle">成功</text><path d="M690 2355 V2435" fill="none" stroke="#8b9aae" stroke-width="2"  marker-end="url(#arrow-01)"/><rect x="535" y="130" width="310" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="171">游戏库 → Steam 入口</text><path d="M690 236 L870 285 L690 334 L510 285 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="291">会话及登录仍有效？</text><rect x="930" y="250" width="360" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="280">恢复原 Steam 页面与模式</text><text class="small" text-anchor="middle" x="1110" y="304">不因声明更新打断有效会话</text><path d="M690 386 L870 435 L690 484 L510 435 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="441">当前声明版本已同意？</text><rect x="75" y="400" width="360" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="430">游戏库上弹免责声明全文</text><text class="small" text-anchor="middle" x="255" y="454">可滚动阅读，尚不下载组件</text><rect x="75" y="550" width="360" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="580">不同意 → 关闭弹窗</text><text class="small" text-anchor="middle" x="255" y="604">停留游戏库，不开始下载</text><path d="M690 546 L870 595 L690 644 L510 595 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="601">已记住启动模式？</text><rect x="75" y="710" width="360" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="740">整页选择大屏 / 窗口</text><text class="small" text-anchor="middle" x="255" y="764">记住我的选择默认关闭</text><rect x="75" y="840" width="360" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="870">取消 → 返回游戏库</text><text class="small" text-anchor="middle" x="255" y="894">不保存本次模式偏好</text><rect x="535" y="710" width="310" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="751">使用选择或已保存的模式</text><path d="M690 846 L870 895 L690 944 L510 895 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="901">组件可用且已准备？</text><rect x="510" y="1010" width="360" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1040">游戏库上的准备弹窗</text><text class="small" text-anchor="middle" x="690" y="1064">下载组件，展示进度，可暂停继续</text><rect x="75" y="1010" width="360" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1040">断网 / 空间不足 / 收起弹窗</text><text class="small" text-anchor="middle" x="255" y="1064">保留有效内容；重进后继续</text><rect x="510" y="1170" width="360" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1200">同一弹窗：校验 → 准备</text><text class="small" text-anchor="middle" x="690" y="1224">100% 下载不代表可以使用</text><rect x="75" y="1170" width="360" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1200">校验或准备失败</text><text class="small" text-anchor="middle" x="255" y="1224">重取损坏内容 / 重试准备</text><rect x="510" y="1330" width="360" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1360">同一弹窗：启动 Steam</text><text class="small" text-anchor="middle" x="690" y="1384">等待实际可用回执</text><rect x="930" y="1330" width="360" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="1360">启动失败</text><text class="small" text-anchor="middle" x="1110" y="1384">原弹窗重试，复用有效组件</text><path d="M690 1476 L870 1525 L690 1574 L510 1525 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1531">原生登录仍有效？</text><rect x="495" y="1640" width="390" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1670">关闭准备弹窗 → 登录页</text><text class="small" text-anchor="middle" x="690" y="1694">回显已同意勾选；输入后点击登录</text><path d="M690 1786 L870 1835 L690 1884 L510 1835 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1841">点击登录时仍已勾选？</text><rect x="60" y="1800" width="390" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="255" y="1830">登录声明弹窗：可滚动全文</text><text class="small" text-anchor="middle" x="255" y="1854">知晓并同意 / 不同意（纯文字）</text><rect x="510" y="1960" width="360" height="70" rx="14" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="1990">提交本次登录请求</text><text class="small" text-anchor="middle" x="690" y="2014">等待真实登录结果，不提前进入</text><path d="M690 2106 L870 2155 L690 2204 L510 2155 Z" fill="#e7f4ff" stroke="#aac9e4" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2161">实际登录结果？</text><rect x="930" y="2120" width="360" height="70" rx="14" fill="#fff2e7" stroke="#e7c5a5" stroke-width="1.5"/><text class="node" text-anchor="middle" x="1110" y="2150">登录未完成</text><text class="small" text-anchor="middle" x="1110" y="2174">保留输入与目标，可重试或返回</text><rect x="495" y="2285" width="390" height="70" rx="14" fill="#e6edf6" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2315">关闭准备弹窗 / 登录完成</text><text class="small" text-anchor="middle" x="690" y="2339">Steam 界面可用，进入库或原目标</text><rect x="535" y="2435" width="310" height="70" rx="14" fill="#e7f5ef" stroke="#c8d4e0" stroke-width="1.5"/><text class="node" text-anchor="middle" x="690" y="2465">返回盖世游戏</text><text class="small" text-anchor="middle" x="690" y="2489">保留 Steam 会话，不注销</text><text class="note" x="60" y="2610">入口同版本已同意不重复弹；新版本在下一次新启动前确认。登录页回显已有同意，正常主链不重复确认。</text><text class="note" x="60" y="2636">准备弹窗收起后下载暂停并保留进度；重进按已选模式 / 偏好及有效阶段恢复。只有启动可用后才进入登录或 Steam。</text><text class="note" x="60" y="2662">声明链接只读，不自动授权；用户正文原样保留，法律及服务事实仍需核对。APK 真实登录、游戏运行与迁移须真机联调。</text></svg>