<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--nav:#001529;--nav-hover:#002140;--gold:#d4b473;--gold-dark:#b99959;--bg:#f0f2f5;--line:#e8e8e8;--text:#333;--muted:#8c8c8c;--green:#52c41a;--red:#ff4d4f}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:13px}button,input,select,textarea{font:inherit}.layout{display:flex;height:100vh;min-width:1180px}.sidebar{width:210px;background:var(--nav);color:#fff;flex-shrink:0;display:flex;flex-direction:column}.logo{padding:19px 18px;font-size:15px;font-weight:700;border-bottom:1px solid var(--nav-hover);color:var(--gold)}.menu-group{padding:20px 20px 8px;color:rgba(255,255,255,.35);font-size:11px}.menu-item{border:0;background:none;width:100%;padding:14px 20px;text-align:left;color:rgba(255,255,255,.65);cursor:pointer;display:flex;align-items:center;gap:10px}.menu-item:hover{color:#fff;background:var(--nav-hover)}.menu-item.active{color:#fff;background:var(--gold)}.menu-icon{width:16px;text-align:center}.side-note{margin-top:auto;padding:20px;color:rgba(255,255,255,.38);font-size:11px;line-height:1.8}.main{flex:1;display:flex;flex-direction:column;overflow:hidden}.topbar{min-height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:18px}.topbar .title{font-size:16px;font-weight:600}.demo-label{font-size:12px;color:#927746;background:#fffaf0;border:1px solid #f0e1bf;border-radius:4px;padding:5px 9px}.content{flex:1;overflow:auto;padding:22px}.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card-head h3{font-size:15px}.card-head p{color:var(--muted);font-size:12px;margin-top:6px}.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.filter-field{display:flex;flex-direction:column;gap:7px}.filter-field label{font-size:12px;color:#777}.filter-field input,.filter-field select{height:33px;padding:5px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;outline:none;background:#fff;width:150px}.filter-field.date input{width:145px}.filter-field input:focus,.filter-field select:focus{border-color:var(--gold)}.filter-actions{display:flex;gap:8px}.btn{min-height:33px;padding:5px 15px;border-radius:4px;font-size:12px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#333;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-dark)}.btn:disabled{cursor:not-allowed;color:#bfbfbf;background:#f5f5f5}.btn-primary{background:var(--gold);color:#fff;border-color:var(--gold)}.btn-primary:hover:not(:disabled){background:var(--gold-dark);color:#fff}.btn-danger{color:var(--red);border-color:#ffccc7}.btn-sm{min-height:26px;padding:3px 9px;font-size:11px}.table-wrap{width:100%;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{background:#fafafa;padding:12px 10px;text-align:left;font-weight:500;color:#666;border-bottom:1px solid #f0f0f0}td{padding:12px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle}tr:hover td{background:#fafafa}.saves-table th:last-child{position:sticky;right:0;background:#fafafa;z-index:2;box-shadow:-4px 0 7px rgba(0,0,0,.035)}.saves-table td:last-child{position:sticky;right:0;background:#fff;z-index:1;box-shadow:-4px 0 7px rgba(0,0,0,.035)}.saves-table tr:hover td:last-child{background:#fafafa}.ellipsis{max-width:200px;overflow:hidden;text-overflow:ellipsis}.cover-img{width:66px;height:44px;border-radius:4px;object-fit:cover;background:#24354b;display:block}.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;border:1px solid transparent}.tag-green{background:#f6ffed;color:#389e0d;border-color:#b7eb8f}.tag-gray{background:#fafafa;color:#8c8c8c;border-color:#ddd}.tag-blue{background:#e6f4ff;color:#1677ff;border-color:#91caff}.table-summary{display:flex;justify-content:space-between;margin-top:16px;color:#999;font-size:12px}.empty{text-align:center;color:#aaa;padding:54px 16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}.stat-card{background:#fff;border-radius:8px;padding:21px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.stat-card .label{font-size:12px;color:var(--muted)}.stat-card .num{font-size:28px;font-weight:650;margin-top:14px}.stat-card .sub{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}.bar{display:inline-block;width:130px;height:6px;border-radius:4px;background:#f2ede2;overflow:hidden;margin-left:12px;vertical-align:middle}.bar span{display:block;height:100%;background:var(--gold);border-radius:4px}.metric-note{color:#8c8c8c;font-size:12px;line-height:1.8;margin-top:16px}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}.modal-mask.show{display:flex}.modal-box{background:#fff;width:690px;max-height:90vh;border-radius:8px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2);display:flex;flex-direction:column}.modal-box.confirm-box{width:440px}.modal-head{padding:17px 22px;border-bottom:1px solid #f0f0f0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;cursor:pointer;color:#999;font-size:23px;line-height:1;padding:2px}.modal-body{padding:20px 22px;overflow:auto}.modal-foot{padding:14px 22px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.form-group{margin-bottom:17px}.form-group.full{grid-column:1/-1}.form-group label{display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:7px;font-weight:500}.required{color:var(--red);margin-right:3px}.form-group input:not([type=file]):not([type=checkbox]),.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;outline:none}.form-group input:disabled{background:#fafafa;color:#888}.form-group textarea{height:100px;resize:vertical}.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--gold)}.counter,.hint{font-size:11px;color:#999;font-weight:400}.hint{line-height:1.7;margin-top:6px}.file-select{padding:10px;border:1px dashed #d9d9d9;border-radius:5px;background:#fafafa}.file-select input{max-width:100%;font-size:12px}.cover-preview{width:124px;height:78px;object-fit:cover;display:block;margin-top:10px;border-radius:4px}.file-name{margin-top:8px;color:#666;font-size:12px;overflow-wrap:anywhere}.metadata{background:#fafafa;padding:11px 12px;border-radius:4px;color:#777;font-size:12px;line-height:1.9;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.form-error{color:#d4380d;font-size:12px;min-height:18px;margin-top:5px}.notice{padding:10px 12px;background:#fffbe6;border:1px solid #ffe58f;border-radius:5px;color:#876800;line-height:1.8;font-size:12px}.confirm-title{font-size:14px;font-weight:600;margin-bottom:10px}.confirm-copy{color:#777;line-height:1.9}.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:5px;font-size:13px;opacity:0;transition:.2s;z-index:200;pointer-events:none}.toast.show{opacity:1}.muted{color:var(--muted)}
.environment-row{padding:12px;border:1px solid #e8e8e8;border-radius:4px;margin-top:8px}.environment-row .environment-controls{display:flex;justify-content:space-between;gap:12px}.environment-row label{display:flex;align-items:center;justify-content:flex-start;gap:7px;margin-bottom:8px}.environment-row input[type=checkbox]{width:14px;height:14px;accent-color:var(--gold-dark)}.environment-row textarea{height:58px;min-height:58px;font-size:12px}.environment-row textarea:disabled{background:#fafafa;color:#aaa}.scope-summary{white-space:normal;min-width:145px;max-width:190px;font-size:11px;line-height:1.7;color:#666}</style>

<body>
<div class="layout">
 <aside class="sidebar"><div class="logo">盖世游戏 · 存档管理</div><div class="menu-group">内容运营</div><button class="menu-item active" data-page="list" onclick="switchPage('list')"><span class="menu-icon">▤</span>存档列表</button><button class="menu-item" data-page="stats" onclick="switchPage('stats')"><span class="menu-icon">▥</span>数据统计</button><div class="side-note">免费云存档运营后台<br>桌面交互 Demo</div></aside>
 <main class="main"><header class="topbar"><div class="title" id="pageTitle">存档列表</div><div class="demo-label">示例数据 · 验证为演示数据，非生产测试 · 操作仅本次会话生效</div></header><div class="content" id="pageContent"></div></main>
</div>
<div class="modal-mask" id="modal" onclick="if(event.target===this)closeModal()"><section class="modal-box" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><span id="modalTitle"></span><button class="close" aria-label="关闭" onclick="closeModal()">×</button></header><div class="modal-body" id="modalBody"></div><footer class="modal-foot" id="modalFoot"></footer></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cover(game){var colors=game==='GTA V'?['#364f42','#927b51']:game==='艾尔登法环'?['#332f28','#9c8758']:['#282c3c','#c8ab28'];var svg='<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="'+colors[0]+'"/><stop offset="1" stop-color="'+colors[1]+'"/></linearGradient></defs><rect width="600" height="360" fill="url(#g)"/><circle cx="470" cy="95" r="88" fill="none" stroke="white" stroke-opacity=".18" stroke-width="18"/><path d="M0 280 120 170 260 245 390 130 600 260V360H0" fill="#000" opacity=".18"/><text x="35" y="270" fill="white" font-family="sans-serif" font-size="42" font-weight="bold">'+game+'</text><text x="38" y="310" fill="white" opacity=".6" font-family="sans-serif" font-size="18">GAMEHUB · SAVE</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
var environments=[{id:'cloud',label:'云游戏'},{id:'steam',label:'Steam 登录下载'},{id:'import',label:'自己导入'}];
var saves=[
 {id:'SAVE001',title:'500多万CR，440辆车全收集',game:'GTA V',type:'通关存档',source:'官方',uid:'官方',status:'已上架',time:'2026-10-20',description:'车辆全收集，适合自由探索与体验。',fileName:'gta-full-collection.sav'},
 {id:'SAVE002',title:'线上模式满级+全武器+1000万',game:'GTA V',type:'通关存档',source:'用户分享',uid:'u10086',status:'已上架',time:'2026-10-19',description:'满级角色及武器收集存档。',fileName:'gta-max-level.sav'},
 {id:'SAVE003',title:'全BOSS击杀存档（含DLC）',game:'艾尔登法环',type:'BOSS存档',source:'用户分享',uid:'u20088',status:'已上架',time:'2026-10-18',description:'已完成全部BOSS挑战，包含DLC。',fileName:'elden-boss.sl2'},
 {id:'SAVE004',title:'全成就通关存档',game:'艾尔登法环',type:'通关存档',source:'官方',uid:'官方',status:'已上架',time:'2026-10-16',description:'完整主线及全成就收集。',fileName:'elden-all.sl2'},
 {id:'SAVE005',title:'夜之城全武器存档',game:'赛博朋克2077',type:'通关存档',source:'用户分享',uid:'u30055',status:'已下架',time:'2026-10-15',description:'夜之城探索及武器收集。',fileName:'cyberpunk-weapons.dat'},
 {id:'SAVE006',title:'96辆车3000U全改装',game:'GTA V',type:'通关存档',source:'用户分享',uid:'u40128',status:'待审核',time:'',description:'车辆改装与自由驾驶存档。',fileName:'gta-cars.sav'}
].map(function(s,i){s.cover=cover(s.game);s.environments=i%2===0?['cloud']:['steam','import'];s.verifications={};s.environments.forEach(function(id){s.verifications[id]={passed:s.status!=='待审核',note:s.status==='待审核'?'':'演示数据：模拟该环境验证通过；未执行生产测试。'}});s.steamBuildIds=s.environments.includes('steam')&&s.verifications.steam.passed?['10002']:[];s.description+=' DLC、MOD 要求以作者说明和人工验证记录为准。';return s});
// 独立的示例应用记录；使用次数只计成功记录，尝试次数包含成功与失败。
var usageRecords=[];
saves.forEach(function(s,i){if(s.status==='待审核'||s.status==='草稿')return;for(var n=0;n<18+i*7;n++){usageRecords.push({id:'USE-'+i+'-'+n,saveId:s.id,game:s.game,time:'2026-10-'+String(20+n%4).padStart(2,'0'),success:n%9!==0})}});
var currentPage='list',listFilter={title:'',game:'',uid:'',type:'',status:'',start:'',end:''},statsFilter={game:'',start:'',end:''};
var editingSaveId=null,formState=null,nextId=7,lastFocused=null,toastTimer=null;
function successfulUses(id){return usageRecords.filter(function(r){return r.saveId===id&&r.success}).length}
function today(){var d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function contains(text,q){return String(text).toLocaleLowerCase().includes(String(q).toLocaleLowerCase())}
function inRange(d,f){return (!f.start||d>=f.start)&&(!f.end||d<=f.end)}
function validDates(start,end,errorTarget){var msg=start&&end&&end<start?'结束日期不能早于开始日期':'';if(errorTarget)document.getElementById(errorTarget).textContent=msg;if(msg)showToast(msg);return !msg}
function showToast(text){clearTimeout(toastTimer);var e=document.getElementById('toast');e.textContent=text;e.classList.add('show');toastTimer=setTimeout(function(){e.classList.remove('show')},2400)}
function switchPage(page){currentPage=page==='stats'?'stats':'list';document.querySelectorAll('[data-page]').forEach(function(e){e.classList.toggle('active',e.dataset.page===currentPage)});document.getElementById('pageTitle').textContent=currentPage==='stats'?'数据统计':'存档列表';var url=new URL(location.href);url.searchParams.set('page',currentPage);history.replaceState(null,'',url);renderCurrent()}
function renderCurrent(){if(currentPage==='stats')renderStats();else renderList()}
function inputField(id,label,value,placeholder,type){return '<div class="filter-field'+(type==='date'?' date':'')+'"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(value)+'" placeholder="'+(placeholder||'')+'"></div>'}
function selectField(id,label,value,options){return '<div class="filter-field"><label for="'+id+'">'+label+'</label><select id="'+id+'">'+options.map(function(o){return '<option value="'+esc(o)+'"'+(value===o?' selected':'')+'>'+esc(o||'全部')+'</option>'}).join('')+'</select></div>'}
function renderList(){var rows=saves.filter(function(s){return contains(s.title,listFilter.title)&&contains(s.game,listFilter.game)&&contains(s.uid,listFilter.uid)&&(!listFilter.type||s.type===listFilter.type)&&(!listFilter.status||s.status===listFilter.status)&&inRange(s.time,listFilter)});var h='<section class="card"><div class="filter-bar">';h+=inputField('lf-title','标题',listFilter.title,'搜索存档标题')+inputField('lf-game','游戏名',listFilter.game,'输入游戏名称')+inputField('lf-uid','用户 UID',listFilter.uid,'输入用户 UID')+selectField('lf-type','存档类型',listFilter.type,['','通关存档','BOSS存档'])+selectField('lf-status','状态',listFilter.status,['','已上架','已下架','待审核','草稿'])+inputField('lf-start','首次上架开始日期',listFilter.start,'','date')+inputField('lf-end','首次上架结束日期',listFilter.end,'','date')+'<div class="filter-actions"><button class="btn btn-primary" onclick="applyListFilter()">查询</button><button class="btn" onclick="resetListFilter()">重置</button></div></div><div class="form-error" id="lf-error" role="alert"></div></section>';
 h+='<section class="card"><header class="card-head"><div><h3>存档列表</h3><p>管理官方及用户分享存档，所有存档免费使用；玩家提交进入待审核，验证后方可上架</p></div><button class="btn btn-primary" id="new-save" onclick="openSaveForm()">＋ 新建存档</button></header><div class="table-wrap"><table class="saves-table"><thead><tr><th>ID</th><th>封面</th><th>标题</th><th>游戏</th><th>类型</th><th>来源</th><th>适用环境</th><th>UID</th><th>状态</th><th>使用次数</th><th>首次上架时间</th><th>操作</th></tr></thead><tbody>';
 rows.forEach(function(s){h+='<tr data-save-id="'+s.id+'"><td>'+s.id+'</td><td><img class="cover-img" src="'+esc(s.cover)+'" alt="'+esc(s.game)+'封面"></td><td class="ellipsis" title="'+esc(s.title)+'">'+esc(s.title)+'</td><td>'+esc(s.game)+'</td><td>'+esc(s.type)+'</td><td><span class="tag '+(s.source==='官方'?'tag-blue':'tag-gray')+'">'+esc(s.source)+'</span></td><td class="scope-summary">'+environmentSummary(s)+'</td><td>'+esc(s.uid)+'</td><td><span class="tag '+(s.status==='已上架'?'tag-green':'tag-gray')+'">'+s.status+'</span></td><td>'+successfulUses(s.id).toLocaleString()+'</td><td>'+esc(s.time||'—')+'</td><td><button class="btn btn-sm" onclick="openSaveForm(\''+s.id+'\')">编辑</button> <button class="btn btn-sm" onclick="toggleSaveStatus(\''+s.id+'\')">'+(s.status==='已上架'?'下架':'上架')+'</button> <button class="btn btn-sm btn-danger" onclick="deleteSave(\''+s.id+'\')">删除</button></td></tr>'});
 h+=(rows.length?'':'<tr><td colspan="12" class="empty">没有符合条件的存档，请调整筛选条件</td></tr>')+'</tbody></table></div><div class="table-summary"><span>共 '+rows.length+' 条</span><span>使用次数为成功应用记录累计次数</span></div></section>';document.getElementById('pageContent').innerHTML=h;
}
function applyListFilter(){var start=document.getElementById('lf-start').value,end=document.getElementById('lf-end').value;if(!validDates(start,end,'lf-error'))return;listFilter={title:document.getElementById('lf-title').value.trim(),game:document.getElementById('lf-game').value.trim(),uid:document.getElementById('lf-uid').value.trim(),type:document.getElementById('lf-type').value,status:document.getElementById('lf-status').value,start:start,end:end};renderList()}
function resetListFilter(){listFilter={title:'',game:'',uid:'',type:'',status:'',start:'',end:''};renderList()}
function openModal(title,body,foot,isConfirm){lastFocused=document.activeElement;document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modalBox').classList.toggle('confirm-box',!!isConfirm);document.getElementById('modal').classList.add('show');document.getElementById('modal').querySelector('input:not(:disabled),select,textarea,button').focus()}
function closeModal(){document.getElementById('modal').classList.remove('show');formState=null;if(lastFocused&&lastFocused.isConnected)lastFocused.focus()}
function graphemes(s){return typeof Intl.Segmenter==='function'?Array.from(new Intl.Segmenter('zh',{granularity:'grapheme'}).segment(s),function(x){return x.segment}):Array.from(s)}
function limitField(id,max,event){if(event&&event.isComposing)return;var el=document.getElementById(id),a=graphemes(el.value);if(a.length>max)el.value=a.slice(0,max).join('');document.getElementById(id+'-count').textContent=graphemes(el.value).length+' / '+max}
function openSaveForm(id){var s=id?saves.find(function(x){return x.id===id}):null;if(id&&!s)return;editingSaveId=s?s.id:null;formState={cover:s?s.cover:cover('GTA V'),fileName:s?s.fileName:'',fileSize:0,coverReading:false};var body='';if(s)body+='<div class="metadata"><span>ID：'+s.id+'</span><span>游戏：'+esc(s.game)+'</span><span>来源：'+s.source+'</span><span>UID：'+s.uid+'</span><span>使用次数：'+successfulUses(s.id)+'</span><span>首次上架时间：'+esc(s.time||'—')+'</span><span>存档文件：'+esc(s.fileName||'尚未选择')+'</span><span>作者声明平台：'+esc(s.platformNote||'不清楚')+'</span><span>作者声明版本：'+esc(s.versionNote||'不清楚')+'</span><span>提交时运行环境：'+esc((environments.find(function(e){return e.id===s.originEnvironment})||{}).label||s.originEnvironment||'未提供')+'</span><span>提交时 Steam 版本标识：'+esc(s.submittedSteamBuild||'未提供')+'</span></div>';
 body+='<div class="form-grid">';if(!s)body+='<div class="form-group"><label for="sf-game"><span><span class="required">*</span>关联游戏</span></label><select id="sf-game" onchange="changeFormGame()"><option>GTA V</option><option>艾尔登法环</option><option>赛博朋克2077</option></select></div>';
 body+='<div class="form-group"><label for="sf-type">存档类型</label><select id="sf-type"><option'+(s&&s.type==='通关存档'?' selected':'')+'>通关存档</option><option'+(s&&s.type==='BOSS存档'?' selected':'')+'>BOSS存档</option></select></div>';if(s)body+='<div class="form-group"><label for="sf-status">状态</label><select id="sf-status"><option'+(s.status==='已上架'?' selected':'')+'>已上架</option><option'+(s.status==='已下架'?' selected':'')+'>已下架</option><option'+(s.status==='待审核'?' selected':'')+'>待审核</option><option'+(s.status==='草稿'?' selected':'')+'>草稿</option></select></div>';
 body+='<div class="form-group full"><label for="sf-title"><span><span class="required">*</span>标题</span><span class="counter" id="sf-title-count">'+graphemes(s?s.title:'').length+' / 40</span></label><input id="sf-title" value="'+esc(s?s.title:'')+'" placeholder="请输入存档标题，最多40字" oninput="limitField(\'sf-title\',40,event)" oncompositionend="limitField(\'sf-title\',40,event)"></div><div class="form-group full"><label for="sf-desc"><span>描述</span><span class="counter" id="sf-desc-count">'+graphemes(s?s.description:'').length+' / 500</span></label><textarea id="sf-desc" placeholder="说明存档内容及作者提供的版本、DLC、MOD 要求；未知可写未提供，最多500字" oninput="limitField(\'sf-desc\',500,event)" oncompositionend="limitField(\'sf-desc\',500,event)">'+esc(s?s.description:'')+'</textarea><div class="hint">版本、DLC、MOD 要求沿用作者说明；未知允许，不能默认全版本兼容。</div></div>';
 body+=environmentForm(s);
 if(!s)body+='<div class="form-group"><label for="sf-cover">封面图</label><div class="file-select"><input type="file" id="sf-cover" accept="image/*" onchange="selectCover(this)"><img class="cover-preview" id="sf-cover-preview" src="'+esc(formState.cover)+'" alt="封面预览"><div class="hint">未选择时使用游戏默认封面</div></div></div><div class="form-group"><label for="sf-file"><span><span class="required">*</span>存档文件</span></label><div class="file-select"><input type="file" id="sf-file" onchange="selectSaveFile(this)"><div class="file-name" id="sf-file-name">尚未选择文件</div><div class="hint">上架前必填；草稿可后补。单文件不超过500MB，仅在本地选择</div></div></div>';
 else{body+='<div class="form-group full"><label>封面图</label><img class="cover-preview" src="'+esc(s.cover)+'" alt="当前封面"></div>';if(!s.fileName)body+='<div class="form-group full"><label for="sf-file">存档文件</label><div class="file-select"><input type="file" id="sf-file" onchange="selectSaveFile(this)"><div class="file-name" id="sf-file-name">尚未选择文件</div><div class="hint">上架前必填，单文件不超过500MB，仅在本地选择</div></div></div>'}
 body+='</div><div class="notice">'+'来源（官方/用户分享）与适用环境独立。上架前须逐一验证全部适用环境并填写说明；未完成可保存草稿。示例验证仅为演示数据，非生产测试；真实发布仍需服务端安全扫描。'+'</div><div class="form-error" id="sf-error" role="alert"></div>';
 openModal(s?'编辑存档':'新建存档',body,'<button class="btn" onclick="closeModal()">取消</button><button class="btn" id="sf-draft" onclick="saveSave(\'草稿\')">保存草稿</button><button class="btn btn-primary" id="sf-save" onclick="saveSave()">'+(s?'保存':'保存并上架')+'</button>');document.getElementById('sf-title').focus();
}
function changeFormGame(){resetEnvironmentVerification();if(formState&&!document.getElementById('sf-cover').files.length){formState.cover=cover(document.getElementById('sf-game').value);document.getElementById('sf-cover-preview').src=formState.cover}}
function formError(msg){var e=document.getElementById('sf-error');if(e){e.textContent=msg;if(msg)e.scrollIntoView({block:'nearest'})}}
function selectCover(input){var state=formState;if(!state)return;var request=(state.coverRequest||0)+1;state.coverRequest=request;state.coverReading=false;document.getElementById('sf-save').disabled=false;var file=input.files[0];if(!file)return;if(!file.type.startsWith('image/')){input.value='';formError('请选择有效的图片文件');return}state.coverReading=true;document.getElementById('sf-save').disabled=true;var reader=new FileReader();reader.onerror=function(){if(formState!==state||state.coverRequest!==request)return;state.coverReading=false;document.getElementById('sf-save').disabled=false;input.value='';formError('图片读取失败，请重新选择')};reader.onload=function(){if(formState!==state||state.coverRequest!==request)return;var img=new Image();img.onload=function(){if(formState!==state||state.coverRequest!==request)return;state.cover=String(reader.result);state.coverReading=false;document.getElementById('sf-cover-preview').src=state.cover;document.getElementById('sf-save').disabled=false;formError('')};img.onerror=function(){if(formState!==state||state.coverRequest!==request)return;state.coverReading=false;document.getElementById('sf-save').disabled=false;input.value='';formError('图片无法解析，请重新选择')};img.src=String(reader.result)};reader.readAsDataURL(file)}
function resetEnvironmentVerification(){environments.forEach(function(e){var pass=document.getElementById('sf-verified-'+e.id),note=document.getElementById('sf-note-'+e.id);if(pass)pass.checked=false;if(note)note.value=''})}
function selectSaveFile(input){var f=input.files[0];if(!f)return;if(f.size>500*1024*1024){input.value='';formState.fileName='';formState.fileSize=0;document.getElementById('sf-file-name').textContent='尚未选择文件';formError('文件过大，单个存档文件不能超过500MB');return}resetEnvironmentVerification();formState.fileName=f.name;formState.fileSize=f.size;document.getElementById('sf-file-name').textContent=f.name+'（'+(f.size/1024/1024).toFixed(2)+'MB）';formError('')}
function environmentSummary(s){return (s.environments||[]).map(function(id){var e=environments.find(function(x){return x.id===id});return esc(e?e.label:id)}).join('<br>')||'待选择'}
function parseSteamBuildIds(value){var text=String(value||'').trim();if(!text)return {ids:[],error:''};var parts=text.split(',').map(function(id){return id.trim()});if(parts.some(function(id){return !/^[1-9][0-9]{0,19}$/.test(id)}))return {ids:[],error:'Steam BuildID 请填写逗号分隔的1–20位正整数，不支持小数、负数、前导零或空项'};return {ids:Array.from(new Set(parts)),error:''}}
function environmentForm(s){var h='<div class="form-group full" id="sf-environments"><label>适用环境与人工验证</label><div class="hint">可多选；仅识别游戏名称与封面不能确定兼容性。上架前，所选环境必须分别人工验证通过并填写验证说明。</div>';environments.forEach(function(e){var selected=!!(s&&s.environments&&s.environments.includes(e.id)),v=s&&s.verifications&&s.verifications[e.id]||{};h+='<div class="environment-row" data-environment="'+e.id+'"><div class="environment-controls"><label for="sf-env-'+e.id+'"><input type="checkbox" id="sf-env-'+e.id+'"'+(selected?' checked':'')+' onchange="changeEnvironment(\''+e.id+'\')">'+e.label+'</label><label for="sf-verified-'+e.id+'"><input type="checkbox" id="sf-verified-'+e.id+'"'+(selected&&v.passed?' checked':'')+(selected?'':' disabled')+'>人工验证通过</label></div>';if(e.id==='steam')h+='<label for="sf-steam-build-ids">Steam 已验证版本标识（BuildID）</label><input id="sf-steam-build-ids" type="text" value="'+esc(s&&s.steamBuildIds?s.steamBuildIds.join(', '):'')+'" placeholder="例如：10002, 10003" oninput="changeSteamBuildIds()"'+(selected?'':' disabled')+'><div class="hint">填写经人工验证的 BuildID，以英文逗号分隔；每个1–20位正整数，自动去除首尾空白、去重，不接受标识内部空白。用户实际安装的 Steam 版本须精确命中此集合。修改后须重新验证；作者声明版本不能替代此字段。示例10002为模拟数据。</div>';h+='<textarea id="sf-note-'+e.id+'" aria-label="'+e.label+'验证说明" placeholder="填写实测环境、加载结果与已知限制；仅对所验证环境负责"'+(selected?'':' disabled')+'>'+esc(v.note||'')+'</textarea></div>'});return h+'</div>'}
function changeSteamBuildIds(){document.getElementById('sf-verified-steam').checked=false;formError('')}
function changeEnvironment(id){var selected=document.getElementById('sf-env-'+id).checked,pass=document.getElementById('sf-verified-'+id),note=document.getElementById('sf-note-'+id);pass.disabled=!selected;note.disabled=!selected;pass.checked=false;note.value='';if(id==='steam')document.getElementById('sf-steam-build-ids').disabled=!selected;formError('')}
function readEnvironmentForm(){var scope=[],checks={};environments.forEach(function(e){if(document.getElementById('sf-env-'+e.id).checked){scope.push(e.id);checks[e.id]={passed:document.getElementById('sf-verified-'+e.id).checked,note:document.getElementById('sf-note-'+e.id).value.trim()}}});var builds=scope.includes('steam')?parseSteamBuildIds(document.getElementById('sf-steam-build-ids').value):{ids:[],error:''};return {environments:scope,verifications:checks,steamBuildIds:builds.ids,error:builds.error}}
function publishError(s){if(!s.fileName)return '上架前请选择存档文件';if(!s.environments||!s.environments.length)return '上架前请至少选择一个适用环境';if(s.environments.includes('steam')){if(!Array.isArray(s.steamBuildIds)||!s.steamBuildIds.length)return '上架前请填写 Steam 已验证版本标识（BuildID）';if(s.steamBuildIds.some(function(id){return typeof id!=='string'||!/^[1-9][0-9]{0,19}$/.test(id)}))return 'Steam BuildID 必须是1–20位正整数字符串'}for(var i=0;i<s.environments.length;i++){var id=s.environments[i],e=environments.find(function(x){return x.id===id}),v=s.verifications&&s.verifications[id];if(!e||!v||!v.passed||!v.note||!v.note.trim())return '上架前请完成「'+(e?e.label:id)+'」人工验证并填写验证说明'}return ''}
function saveSave(forceStatus){if(!formState)return;var title=document.getElementById('sf-title').value.trim(),description=document.getElementById('sf-desc').value.trim();if(!title){formError('请输入存档标题');document.getElementById('sf-title').focus();return}if(graphemes(title).length>40||graphemes(description).length>500){formError('标题最多40字，描述最多500字');return}if(formState.coverReading){formError('正在读取封面，请稍后');return}var s=editingSaveId?saves.find(function(x){return x.id===editingSaveId}):null;if(editingSaveId&&!s){formError('存档已不存在，请关闭后重试');return}if(formState.fileSize>500*1024*1024){formError('文件过大，单个存档文件不能超过500MB');return}var status=forceStatus||(s?document.getElementById('sf-status').value:'已上架'),env=readEnvironmentForm();if(env.error){formError(env.error);return}var candidate={fileName:formState.fileName,environments:env.environments,verifications:env.verifications,steamBuildIds:env.steamBuildIds};if(status==='已上架'){var error=publishError(candidate);if(error){formError(error);return}}var wasEditing=!!s;if(s){if(status==='已上架'&&!s.time)s.time=today();s.title=title;s.description=description;s.type=document.getElementById('sf-type').value;s.status=status;s.fileName=formState.fileName;s.environments=env.environments;s.verifications=env.verifications;s.steamBuildIds=env.steamBuildIds}else{s={id:'SAVE'+String(nextId++).padStart(3,'0'),title:title,description:description,game:document.getElementById('sf-game').value,type:document.getElementById('sf-type').value,source:'官方',uid:'官方',status:status,time:status==='已上架'?today():'',cover:formState.cover,fileName:formState.fileName,environments:env.environments,verifications:env.verifications,steamBuildIds:env.steamBuildIds};saves.unshift(s)}closeModal();renderCurrent();showToast(status==='草稿'?'已保存草稿，仅本次演示会话生效':wasEditing?'已保存本次演示修改':'已添加至演示列表，文件未上传')}
function toggleSaveStatus(id){var s=saves.find(function(x){return x.id===id});if(!s)return;if(s.status!=='已上架'){var error=publishError(s);if(error){openSaveForm(id);formError(error);return}s.status='已上架';if(!s.time)s.time=today()}else s.status='已下架';renderCurrent();showToast('本次演示中已'+(s.status==='已上架'?'上架':'下架'))}
function deleteSave(id){var s=saves.find(function(x){return x.id===id});if(!s)return;openModal('删除存档','<div class="confirm-title">确认删除此存档？</div><p class="confirm-copy">'+esc(s.title)+'</p><p class="confirm-copy">删除后该存档将不可见。本次操作仅影响演示列表。</p>','<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-danger" id="confirm-delete" onclick="confirmDelete(\''+id+'\')">确认删除</button>',true)}
function confirmDelete(id){saves=saves.filter(function(s){return s.id!==id});closeModal();renderCurrent();showToast('已从本次演示列表删除')}
function metrics(game){var inventory=saves.filter(function(s){return !!s.time&&contains(s.game,game)&&inRange(s.time,statsFilter)});var attempts=usageRecords.filter(function(r){return contains(r.game,game)&&inRange(r.time,statsFilter)});return {inventory:inventory,attempts:attempts,successes:attempts.filter(function(r){return r.success}).length}}
function percentage(success,total){return total?(success/total*100).toFixed(1)+'%':'暂无数据'}
function renderStats(){var m=metrics(statsFilter.game),games=Array.from(new Set(saves.map(function(s){return s.game}).concat(usageRecords.map(function(r){return r.game})))).filter(function(g){return contains(g,statsFilter.game)});var h='<section class="card"><div class="filter-bar">'+inputField('st-start','开始日期',statsFilter.start,'','date')+inputField('st-end','结束日期',statsFilter.end,'','date')+inputField('st-game','游戏名',statsFilter.game,'输入游戏名称')+'<div class="filter-actions"><button class="btn btn-primary" onclick="applyStatsFilter()">查询</button><button class="btn" onclick="resetStatsFilter()">重置</button></div></div><div class="form-error" id="st-error" role="alert"></div></section>';
 var cards=[['总存档数',m.inventory.length,'所选首次上架范围内的当前存档'],['已上架数',m.inventory.filter(function(s){return s.status==='已上架'}).length,'所选范围内当前为已上架的存档'],['总使用次数',m.successes,'所选范围内成功应用的次数'],['应用成功率',percentage(m.successes,m.attempts.length),'成功 '+m.successes+' 次 / 尝试 '+m.attempts.length+' 次']];h+='<div class="stats">'+cards.map(function(c,i){return '<div class="stat-card" data-metric="'+i+'"><div class="label">'+c[0]+'</div><div class="num">'+c[1]+'</div><div class="sub">'+c[2]+'</div></div>'}).join('')+'</div>';
 h+='<section class="card"><header class="card-head"><div><h3>各游戏分布</h3><p>按当前日期及游戏条件汇总</p></div></header><div class="table-wrap"><table id="game-distribution"><thead><tr><th>游戏名</th><th>存档数</th><th>使用次数</th><th>应用成功率</th></tr></thead><tbody>';var shown=0;games.forEach(function(g){var gm=metrics(g);if(!gm.inventory.length&&!gm.attempts.length)return;shown++;h+='<tr><td>'+esc(g)+'</td><td>'+gm.inventory.length+'</td><td>'+gm.successes+'<span class="bar"><span style="width:'+(m.successes?gm.successes/m.successes*100:0)+'%"></span></span></td><td>'+percentage(gm.successes,gm.attempts.length)+'</td></tr>'});h+=(shown?'':'<tr><td colspan="4" class="empty">暂无符合条件的数据</td></tr>')+'</tbody></table></div><div class="metric-note">统计口径：存档数仅统计已有首次上架日期的当前库存（下架后保留，未首次上架的草稿和待审核不计入）；按首次上架日期筛选，重新上架不重置日期；使用次数按应用发生日期统计成功记录；成功率 = 成功应用次数 ÷ 全部应用尝试次数，无尝试时显示“暂无数据”。<br>删除存档不删除历史应用记录；应用成功仅代表存档文件应用完成，不代表游戏成功读取；数据均为独立示例记录计算，未连接真实统计服务。</div></section>';document.getElementById('pageContent').innerHTML=h;
}
function applyStatsFilter(){var start=document.getElementById('st-start').value,end=document.getElementById('st-end').value;if(!validDates(start,end,'st-error'))return;statsFilter={start:start,end:end,game:document.getElementById('st-game').value.trim()};renderStats()}
function resetStatsFilter(){statsFilter={start:'',end:'',game:''};renderStats()}
document.addEventListener('keydown',function(e){var modal=document.getElementById('modal');if(e.key==='Escape'&&modal.classList.contains('show'))closeModal();if(e.key==='Enter'&&!modal.classList.contains('show')&&e.target.tagName==='INPUT'){e.preventDefault();if(currentPage==='list')applyListFilter();else applyStatsFilter()}if(e.key==='Tab'&&modal.classList.contains('show')){var items=Array.from(modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea'));if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items[items.length-1].focus()}else if(!e.shiftKey&&document.activeElement===items[items.length-1]){e.preventDefault();items[0].focus()}}});
document.addEventListener('compositionend',function(e){if(e.target.id==='sf-title')limitField('sf-title',40,e);if(e.target.id==='sf-desc')limitField('sf-desc',500,e)});
switchPage(new URLSearchParams(location.search).get('page')==='stats'?'stats':'list');
</script>
