  function steamCatalog(){

ync-line"><span>游戏同步失败</span>${btn('重试','sync-retry','compact')}</div>`:''}${state.notice?`<div class="mh-inline-message">${esc(state.notice)}</div>`:''}<div class="mh-grid">${filtered.map(g=>card(g)).join('')}</div>${!filtered.length?`<div class="mh-empty">${state.query?'没有找到游戏':state.steamCategory==='imported'?'暂无盖世导入游戏':'暂无游戏'}</div>`:''}`;

      default:return `<div class="mh-detail-overview"><section class="mh-detail-card mh-forum-overview"><div class="mh-card-heading"><h2>社区论坛</h2><span class="mh-placeholder">内容占位</span></div><p>${esc(game.name)}</p><div class="mh-setting-divider"></div><p>分享游戏体验，查看玩家讨论。</p><div class="mh-rating mh-rating-small"><strong>4.8</strong><div><b>盖世评价</b><p>5 条评价 · 示例数据</p></div><button class="mh-text-btn" data-host="detail-tab" data-value="reviews">查看评价 ›</button></div></section>${achievementSummary()}</div>`;
    }

  function render(){

  function navigate(page){window.SteamDemo?.close?.();state.modal=null;state.notice='';state.settingNotice='';state.page=page==='home'?'discovery':page;render()}

      case 'reset-app':state.modal='reset-confirm';render();break;

      case 'my-account':case 'my-setting':note('盖世账号保留现有能力，本次不调整。');break;

      case 'permission':note('输入监控为 macOS 系统权限，浏览器 Demo 不发起授权。');break;
      case 'cloud-play':navigate('cloud');break;
      case 'game-settings':note('游戏设置沿用重构版，Steam 接入不改变现有配置。');break;
      case 'shortcut':case 'wine-path':case 'reset-game':case 'rebuild':case 'activate':note('此项保留重构版原生能力，浏览器 Demo 不执行系统或账号操作。');break;

  function init(){root=document.getElementById('host-root');if(!root)return;root.addEventListener('click',e=>{const el=e.target.closest('[data-host]');if(el)handle(el.dataset.host,el)});root.addEventListener('change',e=>{const key=e.target.dataset.hostField;if(!key)return;state[key]=key==='installed'?e.target.value==='installed':e.target.value;if(key==='preferredMode')state.remember=true;render()});root.addEventListener('input',e=>{if(e.target.matches('[data-host-query]')){state.query=e.target.value;const start=e.target.selectionStart;render();const input=root.querySelector('[data-host-query]');input?.focus();input?.setSelectionRange(start,start)}if(e.target.matches('[data-legacy-query]')){const value=e.target.value.toLowerCase();root.querySelectorAll('[data-legacy-grid] .mh-game').forEach(card=>card.hidden=!card.textContent.toLowerCase().includes(value))}});root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-global-search]')){state.query=e.target.value;state.installed=false;navigate('library')}});render()}
  function showSteamLibrary(){state.page='steam-library';state.modal=null;state.installed=false;state.query='';state.notice='';render()}
  function showDetailTab(tab){window.SteamDemo?.close?.();state.page='detail';state.game=state.game||'stardew';state.detailTab=['overview','achievements','reviews','dlc','mods','announcement'].includes(tab)?tab:'overview';render();requestAnimationFrame(()=>{const main=root?.querySelector('.mh-main'),tabs=root?.querySelector('.mh-detail-tabs');if(main&&tabs)main.scrollTop=tabs.offsetTop-12;})}

</script><script>(() => {

  function nativeFeature(){const g=getGame(s.gameId),name=nativeTitles[s.nativePage]||'游戏详情';let content='';if(s.nativePage==='achievements')content='<div class="ms-feature-summary"><strong>8 / 40</strong><span>已解锁成就 · 占位</span><div class="ms-progress"><i style="width:20%"></i></div></div><div class="ms-feature-items"><article><b>★</b><div><strong>初次收获</strong><p>完成你的第一季收获 · 成就示例</p></div><span>已解锁</span></article><article><b>◇</b><div><strong>新的旅程</strong><p>继续探索游戏世界 · 成就示例</p></div><span>未解锁</span></article></div>';else if(s.nativePage==='reviews')content='<div class="ms-feature-summary"><strong>好评如潮</strong><span>Steam 用户评测 · 占位</span></div><div class="ms-feature-items"><article><b>✓</b><div><strong>推荐</strong><p>节奏轻松，适合慢慢探索。此内容仅作评测展示示例。</p><small>演示玩家 · 游玩 24 小时</small></div></article></div>';else if(s.nativePage==='dlc')content='<div class="ms-feature-items"><article>'+img(g.id)+'<div><strong>'+esc(g.name)+' · 附加内容示例</strong><p>DLC 名称、价格与拥有状态以 Steam 实际返回为准。</p><small>未接入购买或安装</small></div><span>示意</span></article></div>';else content='<div class="ms-feature-items"><article>'+img(g.id)+'<div><strong>社区创作内容示例</strong><p>工坊条目、订阅状态及 Mac 兼容性待联调。</p><small>不代表已订阅或已安装</small></div><span>示意</span></article></div>';return '<div class="ms-feature-breadcrumb">'+button('return','‹ 返回盖世详情','ms-detail-back')+'<span>'+esc(g.name)+'</span></div><div class="ms-library-head"><div><small>STEAM · '+esc(g.name)+'</small><h1>'+name+'</h1></div><span>页面定位演示</span></div>'+content+'<p class="ms-library-note">展示对应原生功能与返回路径；深链、数据及操作能力以客户端接入为准。</p>';}
  function native(){return `<section class="ms-steam-window ms-big ${s.displayMode==='fullscreen'?'ms-native-fullscreen':'ms-native-window'}"><nav class="ms-steam-tabs">${button('library','库',s.page==='library'||s.page==='detail'?'active':'')}${button('friends','好友',s.page==='friends'?'active':'')}${button('workshop','创意工坊',s.page==='workshop'?'active':'')}<span>${s.displayMode==='fullscreen'?'全屏显示':'窗口显示'}</span></nav><div class="ms-native-body"><main class="ms-native-scroll" style="--steam-scale:${s.scale/100}"><div class="ms-scaled-content">${s.network==='error'?`<div class="ms-empty ms-network"><span class="ms-empty-icon">⌁</span><h2>网络连接失败</h2><p>请检查网络后重试</p>${button('network-retry','重试','ms-steam-primary')}</div>`:s.network==='loading'?'<div class="ms-empty"><span class="ms-spinner"></span><h2>正在加载</h2></div>':s.page==='library'?library():s.page==='feature'?nativeFeature():s.page==='detail'?detail():social()}</div></main></div><footer class="ms-steam-footer">${s.mode==='big'?'<span class="ms-controller-hints"><b>A</b> 选择 <b>B</b> 返回</span><span>手柄操作示意 · 原生交互以接入为准</span><span>STEAM</span>':'<span>下载内容</span><span>Steam 内容为演示占位</span><span>好友与聊天</span>'}</footer></section>`;}
  function bubble(){const view=viewport();const panelPosition=s.bubbleX!==null?'left:'+Math.max(8,Math.min(view.width-292,s.bubbleX-234))+'px;top:'+Math.max(8,Math.min(view.height-365,s.bubbleY-300))+'px;right:auto;bottom:auto;':'';return `<div class="ms-ball-wrap" style="${s.bubbleX!==null?`left:${s.bubbleX}px;top:${s.bubbleY}px;right:auto;bottom:auto;`:''}">${s.bubbleOpen?`<section class="ms-ball-panel" style="${panelPosition}"><div class="ms-ball-heading">${img('logo')}<strong>盖世游戏</strong>${button('bubble-minimize','−','ms-ball-minimize','aria-label="最小化悬浮球"')}</div><div class="ms-ball-section"><span>显示模式</span><div class="ms-segment">${button('session-mode','窗口',s.displayMode==='window'?'active':'','data-value="window"')}${button('session-mode','全屏',s.displayMode==='fullscreen'?'active':'','data-value="fullscreen"')}</div></div><div class="ms-ball-section ms-scale-line"><label for="ms-scale">缩放比例</label><output>${s.scale}%</output><input id="ms-scale" type="range" min="100" max="150" step="10" value="${s.scale}" data-s-change="scale"><span>100%</span><span>150%</span></div><div class="ms-ball-links">${button('friends','好友与聊天')}${button('workshop','创意工坊')}${button('accounts','账号管理')}${button('return','返回盖世')}</div></section>`:`<button type="button" class="ms-ball" data-s-action="bubble-open" aria-label="打开盖世悬浮球" title="盖世游戏 · 拖动可调整位置">${img('logo')}</button>`}</div>`;}
  function accountModal(){const current=s.account;return `<div class="ms-backdrop"><section class="ms-modal ms-accounts" role="dialog" aria-modal="true" aria-label="Steam 账号管理">${title('账号管理')}<div class="ms-current-account"><span class="ms-demo-avatar">${current?.nickname==='时雨'?'雨':'星'}</span><div><small>当前账号</small><strong>${esc(current?.nickname||'未登录')}</strong></div>${button('logout','退出登录','ms-secondary')}</div><div class="ms-account-methods">${button('account-login','扫码登录','ms-secondary')}${button('account-login','密码登录','ms-secondary')}${button('account-import','导入账号','ms-secondary')}</div><div class="ms-account-list-head">已保存的账号</div><div class="ms-account-list">${accountList.map(a=>`<button type="button" data-s-action="account-switch" data-value="${a.id}" class="${a.id===current?.id?'selected':''}"><span class="ms-demo-avatar">${a.nickname.slice(0,1)}</span><span><strong>${esc(a.nickname)}</strong><small>${a.id===current?.id?'当前使用':'演示账号'}</small></span><span>${a.id===current?.id?'✓':'›'}</span></button>`).join('')}</div></section></div>`;}
  function modal(){if(s.modal==='legal')return `<div class="ms-backdrop ms-top-overlay"><section class="ms-modal ms-legal" role="dialog" aria-modal="true" aria-label="免责声明">${title('第三方 Steam 服务调用免责声明','legal-close')}<div class="ms-legal-scroll">${window.MAC_LEGAL||''}</div>${button('legal-close','返回','ms-primary')}</section></div>`;if(s.modal==='accounts')return accountModal();if(s.modal==='import')return `<div class="ms-backdrop"><section class="ms-modal ms-import" role="dialog" aria-modal="true" aria-label="导入账号">${title('导入账号','import-close')}<p class="ms-muted">演示导入流程，无需输入真实 Token</p><label>Steam 登录用户名<input readonly value="demo_imported" aria-label="演示导入用户名"></label><label>Refresh token<input readonly type="password" value="demo-token-only" aria-label="演示 Refresh token"></label>${button('import-account-run','模拟导入','ms-primary')}</section></div>`;return '';}
  function render(){if(!root())return;root().className=s.open?'ms-active':'';root().innerHTML=!s.open?'':`${s.screen==='mode'?modeScreen():s.screen==='prepare'?prepareScreen():s.screen==='login'?loginScreen():s.screen==='hub'?'':native()}${s.screen==='native'?bubble():''}${modal()}`;if(s.open&&(s.screen==='mode'||s.screen==='prepare'||s.modal))root().setAttribute('aria-label','Steam 接入');else root().removeAttribute('aria-label');}
  function finishPrepare(){s.ready=true;openDestination();}
  function prepare(){s.screen='prepare';s.downloadError=false;s.progress=Math.max(s.progress,8);s.prepareStep='正在下载 Steam 组件';render();later(()=>{s.progress=42;render();later(()=>{s.progress=78;s.prepareStep='正在校验组件';render();later(()=>{s.progress=96;s.prepareStep='正在启动服务';render();later(finishPrepare,500);},550);},650);},600);}
  function openDestination(){s.modal=null;s.bubbleOpen=false;if(!s.account){s.screen='login';render();return;}if(s.forceBig)s.mode='big';s.launchStatus='idle';if(s.mode==='hub'){s.screen='hub';if(s.target==='accounts'){s.open=true;s.modal='accounts';render();}else{const intent={target:s.target||'library',gameId:s.gameId};close();host()?.onSteamReady?.(intent);}}else{s.screen='native';s.open=true;s.page=s.nativePage?'feature':['friends','workshop'].includes(s.target)?s.target:s.target==='launch'||s.gameId?'detail':'library';if(s.target==='accounts')s.modal='accounts';render();}if(pendingImport&&s.account){s.sync='loading';render();later(()=>{record().imported=true;s.imported=true;s.sync='ready';pendingImport=false;render();host()?.render?.();},1000);}}
  function enter(options={}){cancelTimer();const pref=host()?.getState()||{};s.sourcePage=pref.page||'library';s.sourceDetailTab=pref.detailTab||null;s.open=true;s.forceBig=Boolean(options.forceBig);s.mode=s.forceBig?'big':'hub';s.displayMode=pref.preferredMode==='fullscreen'?'fullscreen':'window';s.remember=Boolean(pref.remember);s.account=accountValue(pref.account);restoreRecord();s.target=options.target==='imported'?'wukong':options.target||'library';s.gameId=options.gameId||(['stardew','elden','hades','cyber','wukong','imported'].includes(s.target)?s.target==='imported'?'wukong':s.target:null);s.nativePage=nativeTitles[options.nativePage]?options.nativePage:null;s.modal=null;s.bubbleOpen=false;s.network='ready';if(options.legacy){s.accepted=false;s.checked=false;setAccount(accountList[0]);}if(!s.accepted||(s.forceBig&&!s.remember)){s.screen='mode';s.checked=false;render();}else if(s.forceBig&&!s.ready)prepare();else openDestination();}
  function close(){cancelTimer();s.open=false;s.modal=null;s.bubbleOpen=false;render();}
  function reset(){cancelTimer();s=fresh();records={};pendingImport=false;accountList=[{id:'demo-star',nickname:'星际玩家'},{id:'demo-rain',nickname:'时雨'}];render();}
  function ready(){const pref=host()?.getState()||{};s.sourcePage=pref.page||'library';s.sourceDetailTab=pref.detailTab||null;s.accepted=true;s.checked=true;s.ready=true;s.open=true;s.mode='hub';s.screen='hub';s.page='library';s.category='steam';s.target='library';s.gameId=null;s.nativePage=null;s.forceBig=false;s.modal=null;s.network='ready';s.sync='ready';s.empty=false;s.bubbleOpen=false;setAccount(accountList[0]);}
  function scenario(key){cancelTimer();if(key==='first'){reset();setAccount(null);enter();return;}if(key==='native-first'){reset();setAccount(null);host()?.setPreference?.('remember',false);host()?.setPreference?.('preferredMode','window');enter({forceBig:true});return;}if(key==='legacy'){reset();enter({legacy:true});return;}if(key==='prepare'||key==='download-error'){s.mode='big';s.forceBig=true;s.displayMode='window';s.open=true;s.screen='prepare';s.accepted=true;s.ready=false;s.progress=42;s.downloadError=key==='download-error';s.modal=null;render();return;}ready();s.displayMode='window';if(key==='ready'){s.ready=false;openDestination();return;}if(key==='login'){s.ready=false;s.screen='login';setAccount(null);}else if(key==='accounts'){s.ready=false;s.screen='hub';s.modal='accounts';}else{s.mode='big';s.forceBig=true;s.screen='native';if(key==='big'||key==='fullscreen')s.displayMode='fullscreen';if(key==='panel')s.bubbleOpen=true;if(key==='network-error')s.network='error';if(key==='sync-error'){s.sync='error';pendingImport=true;s.category='steam';}if(key==='empty'){s.empty=true;s.category='steam';}if(key==='friends')s.page='friends';if(key==='workshop')s.page='workshop';}render();}
  function importGame(){pendingImport=true;if(s.accepted&&s.account){if(s.open&&s.screen==='native'){s.category='imported';s.page='library';}s.sync='loading';render();later(()=>{record().imported=true;s.imported=true;pendingImport=false;s.sync='ready';render();host()?.render?.();},1000);}return {id:'wukong',name:'黑神话：悟空'};}
  function openAccounts(){if(!s.accepted){enter({target:'accounts'});return;}s.account=accountValue(host()?.getState()?.account);if(!(s.open&&s.screen==='native')){s.mode='hub';s.target='accounts';s.forceBig=false;s.nativePage=null;}s.open=true;if(!s.account){s.screen='login';s.modal=null;}else{s.screen=s.mode==='big'?'native':'hub';s.modal='accounts';}s.bubbleOpen=false;render();}
  function act(action,el){switch(action){
    case 'mode':if(s.forceBig)s.displayMode=el.dataset.value;render();break;
    case 'mode-confirm':if(!s.accepted&&!s.checked)return;s.accepted=true;if(s.forceBig){host()?.setPreference?.('preferredMode',s.displayMode);host()?.setPreference?.('remember',s.remember);}if(s.forceBig&&!s.ready)prepare();else openDestination();break;
    case 'legal':s.modal='legal';render();break;
    case 'legal-close':s.modal=null;render();break;
    case 'return':{const page=s.sourcePage,tab=s.sourceDetailTab;close();if(page==='detail'){if(tab&&host()?.showDetailTab)host().showDetailTab(tab);else host()?.navigate('detail');}else if(page)host()?.navigate(page);else host()?.navigate('library');break;}
    case 'download-retry':prepare();break;
    case 'login':setAccount(accountList[0]);openDestination();break;
    case 'category':s.category=el.dataset.value;render();break;
    case 'game':s.target='detail';s.gameId=el.dataset.value;s.nativePage=null;s.page='detail';s.launchStatus='idle';render();break;
    case 'library':s.page='library';s.target='library';s.gameId=null;s.nativePage=null;s.network='ready';render();break;
    case 'friends':case 'workshop':s.nativePage=null;s.page=action;s.target=action;s.bubbleOpen=false;s.network='ready';render();break;
    case 'chat':s.page='friends';render();break;
    case 'launch':s.launchStatus='pending';render();break;
    case 'download-game':{const gameId=s.gameId||s.target,owner=s.account?.id;s.launchStatus='downloading';render();later(()=>{const r=records[owner];if(r&&!r.downloaded.includes(gameId))r.downloaded.push(gameId);if(s.account?.id===owner){s.launchStatus='idle';syncToHost();render();}},1100);break;}
    case 'bubble-open':s.bubbleOpen=true;render();break;
    case 'bubble-minimize':s.bubbleOpen=false;render();break;
    case 'session-mode':s.displayMode=el.dataset.value==='fullscreen'?'fullscreen':'window';render();break;
    case 'accounts':openAccounts();break;
    case 'modal-close':s.modal=null;if(s.screen==='hub')close();else render();break;
    case 'logout':pendingImport=false;setAccount(null);s.modal=null;s.screen='login';s.target='library';s.nativePage=null;s.gameId=null;s.imported=false;s.empty=false;render();break;
    case 'account-login':s.modal=null;s.screen='login';s.target='accounts';render();break;
    case 'account-import':s.modal='import';render();break;
    case 'import-close':s.modal='accounts';render();break;
    case 'import-account-run':if(!accountList.some(a=>a.id==='demo-imported'))accountList.push({id:'demo-imported',nickname:'导入玩家'});s.modal='accounts';render();break;
    case 'account-switch':pendingImport=false;setAccount(accountList.find(a=>a.id===el.dataset.value));s.modal=null;s.target='library';s.gameId=null;s.nativePage=null;s.page='library';s.category='steam';s.sync='ready';s.network='ready';if(s.mode==='hub'){close();host()?.onSteamReady?.({target:'library',gameId:null});}else render();break;
    case 'network-retry':s.network='loading';render();later(()=>{s.network='ready';render();},800);break;
    case 'sync-retry':s.sync='loading';render();later(()=>{s.sync='ready';if(pendingImport){record().imported=true;s.imported=true;pendingImport=false;}render();},800);break;
  }}
  function init(){const r=root();if(!r||r.dataset.bound)return;r.dataset.bound='true';r.addEventListener('click',e=>{const el=e.target.closest('[data-s-action]');if(el&&!el.disabled){if(el.dataset.dragged==='true'){el.dataset.dragged='false';return;}act(el.dataset.sAction,el);}});r.addEventListener('change',e=>{if(e.target.dataset.sChange==='consent'){s.checked=e.target.checked;const b=r.querySelector('[data-s-action="mode-confirm"]');if(b)b.disabled=!s.accepted&&!s.checked;}if(e.target.dataset.sChange==='remember')s.remember=e.target.checked;if(e.target.dataset.sChange==='scale'){s.scale=Number(e.target.value);render();}});r.addEventListener('input',e=>{if(e.target.dataset.sChange==='scale'){s.scale=Number(e.target.value);const o=r.querySelector('output');if(o)o.textContent=s.scale+'%';const n=r.querySelector('.ms-native-scroll');if(n)n.style.setProperty('--steam-scale',s.scale/100);}});r.addEventListener('pointerdown',e=>{const ball=e.target.closest('.ms-ball');if(!ball)return;const wrap=ball.parentElement,rect=wrap.getBoundingClientRect(),view=viewport(),startX=e.clientX,startY=e.clientY,startLeft=(rect.left-view.left)/view.scaleX,startTop=(rect.top-view.top)/view.scaleY;let moved=false;ball.setPointerCapture(e.pointerId);const move=ev=>{if(Math.abs(ev.clientX-startX)+Math.abs(ev.clientY-startY)>5)moved=true;if(!moved)return;s.bubbleX=Math.max(8,Math.min(view.width-64,startLeft+(ev.clientX-startX)/view.scaleX));s.bubbleY=Math.max(8,Math.min(view.height-64,startTop+(ev.clientY-startY)/view.scaleY));wrap.style.cssText=`left:${s.bubbleX}px;top:${s.bubbleY}px;right:auto;bottom:auto;`;};const end=()=>{ball.dataset.dragged=String(moved);ball.removeEventListener('pointermove',move);ball.removeEventListener('pointerup',end);};ball.addEventListener('pointermove',move);ball.addEventListener('pointerup',end);});render();}
  window.SteamDemo={init,enter,scenario,reset,close,importGame,openAccounts,getState:()=>JSON.parse(JSON.stringify({...s,records,pendingImport}))};
})();

</script><script>(()=>{
 const q=new URLSearchParams(location.search),capture=q.get('capture')==='1';if(capture)document.body.classList.add('capture');

 const scenes=[['first','首次连接账号'],['legacy','旧版已登录'],['ready','已登录 · 盖世游戏库'],['native-first','原生入口 · 显示选择'],['window','Steam · 窗口'],['big','Steam · 全屏'],['login','扫码 / 密码登录'],['accounts','账号管理'],['panel','悬浮球面板'],['prepare','组件准备中'],['download-error','组件下载失败'],['network-error','网络连接失败'],['sync-error','游戏同步失败'],['empty','空游戏库']];
 const labels=Object.fromEntries([...pages,...details,...scenes]);
 function render(){const base=MacHost.getState().baseline;document.querySelector('#demo-controls').innerHTML=`<header class="dc-brand"><span class="dc-brand-icon"><img src="${MAC_ASSETS.logo}" alt=""></span><div><strong>GameHub</strong><small>Mac · Steam 接入评审</small></div></header><div class="dc-scroll"><section class="dc-section"><span class="dc-label">方案版本</span><div class="dc-segment"><button data-dc-version="new" class="${base?'':'active'}">接入新方案</button><button data-dc-version="baseline" class="${base?'active':''}">重构原页面</button></div></section><section class="dc-section"><span class="dc-label">页面</span><div class="dc-grid">${pages.map(([v,t])=>`<button data-dc-page="${v}" class="${selection===v?'active':''}">${t}</button>`).join('')}</div></section><section class="dc-section"><span class="dc-label">游戏详情</span><div class="dc-grid">${details.map(([v,t])=>`<button data-dc-detail="${v}" class="${selection==='detail-'+v?'active':''}">${t}</button>`).join('')}</div></section><section class="dc-section"><span class="dc-label">Steam 演示</span><div class="dc-grid"><button data-dc-scene="first">连接账号</button><button data-dc-scene="native-first">原生入口</button><button data-dc-scene="window">窗口</button><button data-dc-scene="big">全屏</button></div></section><section class="dc-section"><label class="dc-label" for="dc-state">演示状态</label><select id="dc-state" class="dc-select"><option value="">选择场景</option>${scenes.map(([v,t])=>`<option value="${v}" ${selection===v?'selected':''}>${t}</option>`).join('')}</select><div class="dc-tools"><button data-dc="reopen">模拟重开 App</button><button data-dc="reset">重置演示</button></div></section></div><footer class="dc-foot"><div class="dc-note"><strong>评审提示</strong><p id="dc-context">左侧为演示工具，不属于客户端。</p><p>账号、数据及运行均为模拟。原生窗口化、页面定位及 MOD 安装待联调。</p></div></footer>`;updateContext();}
 function fit(){const board=document.querySelector('.ds-board'),frame=document.querySelector('.ds-frame'),v=document.querySelector('#demo-viewport');const scale=capture||zoom==='actual'?1:Math.min((board.clientWidth-8)/1280,(board.clientHeight-22)/835,1);v.style.setProperty('--preview-scale',Math.max(.2,scale));frame.style.width=1280*Math.max(.2,scale)+'px';frame.style.height=835*Math.max(.2,scale)+'px';document.querySelector('#ds-scale').textContent=Math.round(scale*100)+'%';document.querySelectorAll('[data-dc-zoom]').forEach(b=>b.classList.toggle('active',b.dataset.dcZoom===zoom));}
 function updateContext(){const h=MacHost.getState(),s=SteamDemo.getState();let title=labels[h.page]||'盖世游戏',note='保留重构版布局，Steam 能力按入口承接。';if(h.page==='detail'){const tab=h.detailTab||h.detailSection;title='游戏详情';note='盖世评价与 Steam 评测分开；本地 MOD 与创意工坊分开。';if(tab)title+=' · '+(labels[tab]||tab);}if(h.page==='steam-library'){title='盖世游戏库 · Steam 游戏';note='在盖世内管理和启动；原生功能按需打开 Steam 界面。';}if(s.open){if(s.screen==='mode'){title=s.forceBig?'Steam 原生界面 · 显示方式':'连接 Steam 账号';note=s.forceBig?'默认窗口，可选全屏；窗口化能力待客户端验证。':'确认协议并登录后，停留在盖世游戏内。';}else if(s.screen==='prepare'){title='准备 Steam';note='下载、校验和准备；失败重试，无暂停或收起。';}else if(s.screen==='login'){title='登录 Steam';note='演示扫码与密码登录，不输入真实账号。';}else{title=s.screen==='native'?'Steam 原生界面 · '+(s.displayMode==='fullscreen'?'全屏':'窗口'):'盖世游戏';note='Steam 画面和页面定位为示意，以实际接入为准。';}if(s.modal==='accounts')title='Steam 账号管理';}document.querySelector('#ds-title').textContent=title;document.querySelector('#ds-subtitle').textContent=h.baseline?'GameHub 1.0.0 · 重构版页面基线':'GameHub 1.0.0 · 连接 Steam / 打开原生界面';const n=document.querySelector('#dc-context');if(n)n.textContent=note;document.querySelectorAll('[data-dc-page]').forEach(b=>b.classList.toggle('active',b.dataset.dcPage===h.page));document.querySelectorAll('[data-dc-detail]').forEach(b=>b.classList.toggle('active',h.page==='detail'&&b.dataset.dcDetail===h.detailTab));document.querySelectorAll('[data-dc-scene]').forEach(b=>b.classList.toggle('active',s.open&&(b.dataset.dcScene==='big'?s.screen==='native'&&s.displayMode==='fullscreen':b.dataset.dcScene==='window'?s.screen==='native'&&s.displayMode==='window':b.dataset.dcScene==='native-first'?s.screen==='mode'&&s.forceBig:s.screen==='mode'&&!s.forceBig)));}
 function show(page){SteamDemo.close?.();selection=page;if(page==='steam-library'){MacHost.setBaseline(false);SteamDemo.scenario('ready');}else MacHost.navigate(page);render();}
 function detail(tab){SteamDemo.close?.();MacHost.setBaseline(false);selection='detail-'+tab;MacHost.showDetailTab?.(tab);render();}
 function scene(key){selection=key;MacHost.setBaseline(false);SteamDemo.scenario(key);render();}
 document.querySelector('#demo-controls').addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;if(el.dataset.dcPage)show(el.dataset.dcPage);if(el.dataset.dcDetail)detail(el.dataset.dcDetail);if(el.dataset.dcScene)scene(el.dataset.dcScene);if(el.dataset.dcVersion){SteamDemo.close?.();MacHost.setBaseline(el.dataset.dcVersion==='baseline');render();}if(el.dataset.dc==='reset'){SteamDemo.reset();MacHost.reset();selection='library';render();}if(el.dataset.dc==='reopen'){MacHost.restart();selection=MacHost.getState().landing;render();}});
 document.querySelector('#demo-controls').addEventListener('change',e=>{if(e.target.id==='dc-state'&&e.target.value)scene(e.target.value);});
 document.querySelectorAll('[data-dc-zoom]').forEach(b=>b.addEventListener('click',()=>{zoom=b.dataset.dcZoom;fit();}));
 window.MacReview={setOpen(){},show,scene,detail,baseline(v){SteamDemo.close?.();MacHost.setBaseline(v);render();},fit};
 if(q.get('baseline')==='1')MacHost.setBaseline(true);if(q.get('page'))show(q.get('page'));if(q.get('tab'))detail(q.get('tab'));if(q.get('scene'))scene(q.get('scene'));if(q.get('native')){SteamDemo.scenario('ready');MacHost.showDetailTab(q.get('native')==='workshop'?'mods':q.get('native'));SteamDemo.enter({nativePage:q.get('native'),gameId:'stardew',forceBig:true});}render();fit();
 new ResizeObserver(fit).observe(document.querySelector('.ds-board'));new MutationObserver(updateContext).observe(document.querySelector('#host-root'),{childList:true,subtree:true});new MutationObserver(updateContext).observe(document.querySelector('#steam-root'),{childList:true,subtree:true});
})();
</script></body></html>
