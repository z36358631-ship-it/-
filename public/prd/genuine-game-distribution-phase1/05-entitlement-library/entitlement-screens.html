<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="entitlement-screens.css">

<body>
<div id="app" class="screen"></div>
<script>
const pageKey=new URLSearchParams(location.search).get('page')||'game-detail';
const app=document.getElementById('app');
const badge=(text,kind='gray')=>`<span class="badge ${kind}">${text}</span>`;

function statusbar(){return `<div class="statusbar"><span>4:17</span><div class="status-icons"><span>120Hz</span><span>⌁</span><span class="status-pill">82</span></div></div>`}
function evidence(text){return `<div class="evidence-strip">证据边界｜${text}</div>`}
function topbar(title,extra=''){return `<div class="app-topbar"><div class="back">‹</div><div class="app-title">${title}</div><div class="top-spacer"></div>${extra}</div>`}
function nav(){return `<nav class="bottom-nav"><div class="nav-cell"><i></i>首页</div><div class="nav-cell"><i></i>玩游戏</div><div class="nav-cell"><i></i>排行榜</div><div class="nav-cell active"><i></i>游戏库</div><div class="nav-cell"><i></i>我的</div></nav>`}
function shell({title,content,boundary,noNav=false,action='',topExtra='',hideTop=false}){
  return `<div class="mobile-shell">${statusbar()}${evidence(boundary)}${hideTop?'':topbar(title,topExtra)}<main class="mobile-content ${noNav?'no-nav':''} ${hideTop?'without-top':''}"><div class="mobile-scroll">${content}</div></main>${noNav?'':nav()}${action}</div>`;
}
function gameSummary(name='空洞骑士：丝之歌',sub='标准版 · Windows'){
  return `<div class="game-summary"><div class="cover"></div><div class="summary-main"><h2>${name}</h2><p>${sub}</p><p>Team Cherry</p></div></div>`;
}

  return shell({title:'游戏详情',noNav:true,boundary:'当前截图仅证明详情外壳；正版信息区与动作状态为本期目标结构',action,content:`

}
