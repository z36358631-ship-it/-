<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>游戏包体、测试审核与版本发布页面结构</title>
  <link rel="stylesheet" href="build-release-screens.css">
</head>
<body>
<div id="app" class="screen"></div>
<script>
const pageKey = new URLSearchParams(location.search).get('page') || 'version-list';
const app = document.getElementById('app');

const roleConfig = {
  developer:{brand:'开发者平台',account:'示例厂商',avatar:'厂',nav:['工作台','厂商资料','游戏管理','CDKEY 供给','包体版本','投放需求','发行数据'],foot:'受邀合作方，仅见本厂商版本；无直接发布权限'},
  tester:{brand:'测试工作台',account:'测试人员',avatar:'测',nav:['测试总览','待测任务','测试记录','操作记录'],foot:'仅处理分配给自己的测试任务；无版本发布权限'},
  ops:{brand:'发行运营后台',account:'平台发行运营',avatar:'运',nav:['发行总览','版本审核','待发布','线上处置','操作记录'],foot:'签约项目的审核、发布与线上处置完整留痕'}
};
function badge(text,kind='gray'){return `<span class="badge ${kind}">${text}</span>`}
function field(label,value,help='',full=false,type='input'){
  const body=type==='textarea'?`<div class="textarea">${value}</div>`:`<div class="${type==='readonly'?'readonly-field':type==='select'?'select':'input'}">${value}</div>`;
  return `<div class="field ${full?'full':''}"><label>${label}</label>${body}${help?`<div class="help">${help}</div>`:''}</div>`;
}
function scope(){return `<div class="scope-banner"><div><h2>首款签约游戏 · 正式版本</h2><p>一期只覆盖首版与后续正式更新，一个游戏同时只有一个正式线上版本</p></div><div class="scope-tags">${badge('1 个受邀厂商','blue')}${badge('1 款 Windows 游戏','blue')}${badge('单正式分支','gray')}${badge('1 个线上版本','green')}</div></div>`}
function stateStrip(active){
  const states=['草稿','上传中','待提交','测试中','测试不通过／测试通过','待发布','已发布','已撤回'];
  const kind=(s)=>s.includes(active)?(active==='测试不通过'?'red':active==='已发布'?'green':active==='待发布'?'purple':'amber'):'gray';
  return `<div class="card state-strip"><b>版本状态</b>${states.map((s,i)=>`${i?'<span class="state-arrow">›</span>':''}${badge(s,kind(s))}`).join('')}<span class="state-caption">已发布版本不可直接删除</span></div>`;
}
function shell({role,title,subtitle,active,content,evidence='target'}){
  const cfg=roleConfig[role];
  const strip=evidence==='blocked'?'结构示意 · 已确认现有包体管理流但缺页面证据 · 待现状盘点后定稿':'产品低保真结构 · 非现网页面 · 基于已批准规格表达字段、状态与动作';
  return `<div class="admin-shell"><div class="lowfi-strip">${strip}</div><aside class="admin-aside"><div class="admin-brand"><i class="brand-mark"></i>${cfg.brand}</div><div class="nav-list">${cfg.nav.map(x=>`<div class="nav-item ${x===active?'active':''}"><i class="nav-dot"></i>${x}</div>`).join('')}</div><div class="aside-bottom">一期范围：${cfg.foot}</div></aside><main class="admin-main"><header class="admin-top"><div><h1>${title}</h1><div class="sub">${subtitle}</div></div><div class="account">${cfg.account}<i class="avatar">${cfg.avatar}</i></div></header><div class="admin-content">${content}</div></main></div>`;
}

const pages = {
  'version-list':()=>shell({role:'developer',title:'包体版本',subtitle:'查看本厂商 Windows 正式版本、当前线上版本和待处理状态',active:'包体版本',evidence:'blocked',content:`
    ${scope()}${stateStrip('测试不通过')}
    <div class="stats"><section class="card stat"><div class="label">当前线上版本</div><div class="value">v1.0.0</div><div class="hint">同时仅 1 个正式线上版本</div></section><section class="card stat"><div class="label">待处理版本</div><div class="value">1</div><div class="hint">v1.1.0 测试不通过</div></section><section class="card stat"><div class="label">正式分支</div><div class="value" style="font-size:23px">正式版本</div><div class="hint">一期不提供多分支</div></section><section class="card stat"><div class="label">开发者权限</div><div class="value" style="font-size:23px">提交测试</div><div class="hint">不能直接发布或回滚</div></section></div>
    <section class="card section-card"><div class="section-title"><div><h2>版本记录</h2><p>一个版本一行；当前线上版本固定标识</p></div><button class="btn primary">创建版本</button></div><table class="table"><colgroup><col style="width:18%"><col style="width:15%"><col style="width:14%"><col style="width:15%"><col style="width:14%"><col style="width:14%"><col style="width:10%"></colgroup><thead><tr><th>游戏／版本</th><th>包体</th><th>测试轮次</th><th>版本状态</th><th>线上关系</th><th>更新时间</th><th>操作</th></tr></thead><tbody><tr><td><div class="object"><i class="thumb">WIN</i><div><b>v1.1.0</b><br><span class="muted">后续正式更新</span></div></div></td><td>包体已保留</td><td>第 1 轮</td><td>${badge('测试不通过','red')}</td><td>${badge('未上线','gray')}</td><td>2026-09-01 15:10</td><td><span class="link">查看原因</span></td></tr><tr><td><div class="object"><i class="thumb">WIN</i><div><b>v1.0.0</b><br><span class="muted">首个正式版本</span></div></div></td><td>包体已发布</td><td>第 1 轮通过</td><td>${badge('已发布','green')}</td><td>${badge('当前线上','blue')}</td><td>2026-08-20 10:00</td><td><span class="link">查看详情</span></td></tr></tbody></table><div class="pagination"><button class="page-btn active">1</button></div></section>`}),

  'version-editor':()=>shell({role:'developer',title:'创建／编辑版本',subtitle:'填写正式版本资料，保存草稿后上传 Windows 游戏包体',active:'包体版本',evidence:'blocked',content:`
    ${scope()}${stateStrip('草稿')}
    <div class="form-layout"><section class="card form-card"><div class="form-section"><div class="section-title"><div><h2>版本资料</h2><p>首版与后续正式更新使用同一资料结构</p></div>${badge('草稿','gray')}</div><div class="field-grid">${field('游戏','首款签约游戏 · 盖世直接下载','',false,'readonly')}${field('支持系统','Windows','一期不包含 Mac／Linux',false,'readonly')}${field('版本号','v1.1.0')}${field('版本类型','正式版本','一期仅单正式分支',false,'readonly')}${field('更新说明','修复已知问题并更新正式内容；用户可在更新提示中查看。','',true,'textarea')}</div></div><div class="form-section"><h2>启动与运行说明</h2><div class="field-grid">${field('启动文件','Game.exe')}${field('启动参数','—','无参数时显示“—”')}${field('必要运行说明','首次启动所需环境及已知注意事项。','',true,'textarea')}</div></div><div class="actions end"><button class="btn">保存草稿</button><button class="btn primary">下一步：上传包体</button></div></section><aside><section class="card side-note"><h3>提交边界</h3><ul><li>只有游戏资料已通过，才能创建包体版本。</li><li>保存失败保留本页已填信息并允许重试。</li><li>开发者只能提交测试，不能直接发布。</li></ul></section><section class="card side-note"><h3>一期不包含</h3><ul><li>多正式分支、测试分支自助管理。</li><li>预载、P2P、复杂增量更新。</li><li>开发者自助灰度或版本回滚。</li></ul></section></aside></div>`}),

  'build-upload':()=>shell({role:'developer',title:'包体上传',subtitle:'为当前正式版本上传 Windows 包体；中断后保留草稿与已填资料',active:'包体版本',evidence:'blocked',content:`
    ${scope()}${stateStrip('上传中')}
    <div class="grid-2"><section class="card form-card"><div class="section-title"><div><h2>v1.1.0 · Windows 包体</h2><p>上传任务已中断，版本资料和任务记录仍保留</p></div>${badge('上传中断','red')}</div><div class="upload-zone"><i class="icon"></i><b>继续当前上传或重新选择完整包体</b><span>本页不提供预载、P2P 或复杂增量包配置</span></div><div class="file-row" style="margin-top:14px"><div class="file-head"><b>game-v1.1.0.zip</b>${badge('上传中断','red')}</div><div class="progress"><i></i></div><div class="file-meta"><span>已上传 62%</span><span>包体大小：已读取</span><span>校验：等待上传完成</span></div></div><div class="actions end" style="margin-top:16px"><button class="btn">重新上传</button><button class="btn primary">继续上传</button></div></section><aside class="stack"><section class="card side-note"><h3>当前版本资料</h3><div class="info-grid cols-2"><div class="info-item"><div class="k">版本号</div><div class="v">v1.1.0</div></div><div class="info-item"><div class="k">启动文件</div><div class="v">Game.exe</div></div><div class="info-item"><div class="k">更新说明</div><div class="v">已保存</div></div><div class="info-item"><div class="k">运行说明</div><div class="v">已保存</div></div></div></section><section class="notice red" style="margin:0"><strong>上传失败不生成可测试版本</strong>继续上传成功或重新上传并完成校验后，版本才进入“待提交”；失败不会清空版本草稿。</section><section class="card side-note"><h3>包体范围</h3><ul><li>仅当前签约 Windows 游戏。</li><li>仅完整正式版本包体。</li><li>无 Mac、Linux 或其他分支入口。</li></ul></section></aside></div>`}),

  'submit-test':()=>shell({role:'developer',title:'提交测试确认',subtitle:'确认版本资料、包体和运行说明后提交；成功后进入测试中',active:'包体版本',content:`
    ${scope()}${stateStrip('待提交')}
    <div class="result-layout"><div class="stack"><section class="card section-card"><div class="section-title"><div><h2>v1.1.0 提交摘要</h2><p>提交对象固定为当前游戏的正式版本</p></div>${badge('待提交','amber')}</div><div class="info-grid"><div class="info-item"><div class="k">版本号／类型</div><div class="v">v1.1.0 · 正式版本</div></div><div class="info-item"><div class="k">包体</div><div class="v">上传完成 · 校验通过</div></div><div class="info-item"><div class="k">启动文件</div><div class="v">Game.exe</div></div><div class="info-item"><div class="k">更新说明</div><div class="v">已填写</div></div><div class="info-item"><div class="k">启动参数</div><div class="v">—</div></div><div class="info-item"><div class="k">运行说明</div><div class="v">已填写</div></div></div></section><section class="notice blue" style="margin:0"><strong>提交成功后的状态</strong>版本进入“测试中”，平台生成第 1 轮测试任务；同一版本在测试中不能重复提交。</section></div><aside class="card review-panel"><h2>提交前确认</h2><div class="check-list"><div class="check-row"><div><b>游戏资料已通过</b><small>创建版本前置满足</small></div>${badge('通过','green')}</div><div class="check-row"><div><b>Windows 包体校验</b><small>完整包体可供测试</small></div>${badge('通过','green')}</div><div class="check-row"><div><b>启动与运行说明</b><small>测试人员可读取</small></div>${badge('通过','green')}</div></div><div class="security-strip" style="margin-top:14px">提交失败时保留当前页面和已填资料；服务端以版本状态拦截重复提交，不生成重复测试轮次。</div><div class="actions end" style="margin-top:16px"><button class="btn">返回修改</button><button class="btn primary">确认提交测试</button></div></aside></div>`}),

  'test-rejection':()=>shell({role:'developer',title:'测试驳回详情',subtitle:'查看问题说明，修改版本并重新提交；新提交产生新的测试轮次',active:'包体版本',content:`
    ${scope()}${stateStrip('测试不通过')}
    <div class="result-layout"><div class="stack"><section class="card section-card"><div class="section-title"><div><h2>v1.1.0 · 第 1 轮测试不通过</h2><p>版本资料、包体记录和已填输入均保留</p></div>${badge('测试不通过','red')}</div><div class="error-box"><b>测试结论</b>当前包体未达到发布前置，问题修复并重新提交后生成第 2 轮测试任务。</div><div class="issue"><b>问题 1 · 启动验证</b>按提交的启动文件执行后未进入游戏主界面，请核对包体内容与启动说明。</div><div class="issue"><b>问题 2 · 运行说明</b>必要运行环境说明不完整，请补充后重新提交。</div></section><section class="card section-card"><div class="section-title"><div><h2>重新提交路径</h2><p>不覆盖第 1 轮结果和问题记录</p></div></div><div class="check-list"><div class="check-row"><div><b>修改版本资料</b><small>补充启动与运行说明</small></div><span class="link">去修改</span></div><div class="check-row"><div><b>继续或重新上传包体</b><small>按修复结果更新完整包体</small></div><span class="link">去上传</span></div><div class="check-row"><div><b>再次提交测试</b><small>校验通过后生成第 2 轮</small></div>${badge('待修订','amber')}</div></div></section></div><aside class="card timeline"><div class="section-title"><div><h2>版本记录</h2><p>测试轮次与状态留痕</p></div></div><div class="timeline-item"><span class="time">09-01 15:10</span><span class="desc">测试人员提交不通过<br><span class="muted">问题说明已记录</span></span>${badge('第 1 轮','red')}</div><div class="timeline-item"><span class="time">09-01 10:30</span><span class="desc">开发者提交测试<br><span class="muted">包体校验通过</span></span>${badge('成功','green')}</div><div class="timeline-item"><span class="time">09-01 09:50</span><span class="desc">包体上传完成</span>${badge('成功','green')}</div><div class="security-strip" style="margin-top:14px">开发者只能查看本厂商问题；无测试通过、发布或回滚操作。</div></aside></div>`}),

  'test-task-list':()=>shell({role:'tester',title:'待测任务',subtitle:'查看分配给自己的版本测试任务和轮次',active:'待测任务',content:`
    ${scope()}<div class="stats"><section class="card stat"><div class="label">分配给我</div><div class="value">1</div><div class="hint">仅显示有权限任务</div></section><section class="card stat"><div class="label">待测试</div><div class="value">1</div><div class="hint">v1.1.0 · 第 2 轮</div></section><section class="card stat"><div class="label">今日已提交</div><div class="value">1</div><div class="hint">结果和问题已留痕</div></section><section class="card stat"><div class="label">发布权限</div><div class="value" style="font-size:23px">无</div><div class="hint">测试结果不等于发布</div></section></div><section class="card section-card"><div class="toolbar"><div class="toolbar-left"><div class="input">搜索游戏／版本</div><div class="select">任务状态：全部</div><div class="select">测试轮次：全部</div></div><div class="toolbar-right">${badge('只看分配给我','blue')}</div></div><table class="table"><colgroup><col style="width:22%"><col style="width:12%"><col style="width:12%"><col style="width:16%"><col style="width:14%"><col style="width:14%"><col style="width:10%"></colgroup><thead><tr><th>厂商／游戏</th><th>版本</th><th>轮次</th><th>包体与说明</th><th>任务状态</th><th>分配时间</th><th>操作</th></tr></thead><tbody><tr><td><b>示例厂商</b><br><span class="muted">首款签约游戏</span></td><td>v1.1.0</td><td>第 2 轮</td><td>包体已更新<br>说明已补充</td><td>${badge('待测试','amber')}</td><td>09-02 09:20</td><td><span class="link">开始测试</span></td></tr><tr><td><b>示例厂商</b><br><span class="muted">首款签约游戏</span></td><td>v1.1.0</td><td>第 1 轮</td><td>历史提交快照</td><td>${badge('测试不通过','red')}</td><td>09-01 10:30</td><td><span class="link">查看记录</span></td></tr></tbody></table><div class="pagination"><button class="page-btn active">1</button></div></section><div class="notice blue" style="margin-top:15px"><strong>权限与恢复</strong>越权任务不返回包体或说明；列表加载失败保留搜索和筛选条件并允许重试，未知数量不显示为 0。</div>`}),

  'test-task-detail':()=>shell({role:'tester',title:'测试任务详情',subtitle:'获取分配任务的包体、版本资料和测试说明',active:'待测任务',content:`
    ${scope()}<div class="result-layout"><div class="stack"><section class="card section-card"><div class="section-title"><div><h2>首款签约游戏 · v1.1.0</h2><p>示例厂商 · 正式版本 · 第 2 轮</p></div>${badge('待测试','amber')}</div><div class="info-grid"><div class="info-item"><div class="k">包体</div><div class="v">game-v1.1.0.zip</div></div><div class="info-item"><div class="k">支持系统</div><div class="v">Windows</div></div><div class="info-item"><div class="k">启动文件</div><div class="v">Game.exe</div></div><div class="info-item"><div class="k">启动参数</div><div class="v">—</div></div><div class="info-item"><div class="k">更新说明</div><div class="v">已提交</div></div><div class="info-item"><div class="k">运行说明</div><div class="v">已补充</div></div></div><div class="actions" style="margin-top:15px"><button class="btn primary">获取测试包体</button><button class="btn">查看提交说明</button></div></section><section class="card section-card"><div class="section-title"><div><h2>本轮测试说明</h2><p>只展示当前轮次对应的提交快照</p></div></div><div class="error-box" style="border-left-color:#377dff;background:#f4f8ff;color:#36547f"><b style="color:#2f5288">第 2 轮修订说明</b>已更新包体并补充启动所需运行环境说明；请按当前包体和当前说明记录结果。</div><div class="security-strip" style="margin-top:13px">测试人员只能提交“通过／不通过”和问题说明；不能修改开发者版本资料、设为待发布或执行发布。</div></section></div><aside class="stack"><section class="card side-note"><h3>任务与访问</h3><div class="check-list"><div class="check-row"><b>任务已分配给当前账号</b>${badge('有权限','green')}</div><div class="check-row"><b>当前轮次</b>${badge('第 2 轮','blue')}</div><div class="check-row"><b>包体校验</b>${badge('通过','green')}</div></div></section><section class="card timeline"><div class="section-title"><div><h2>轮次记录</h2><p>历史轮次只读</p></div></div><div class="timeline-item"><span class="time">第 2 轮</span><span class="desc">开发者重新提交<br><span class="muted">等待测试结果</span></span>${badge('当前','blue')}</div><div class="timeline-item"><span class="time">第 1 轮</span><span class="desc">测试不通过<br><span class="muted">问题已回传开发者</span></span>${badge('已结束','gray')}</div></section><button class="btn primary" style="width:100%">提交测试结果</button></aside></div>`}),

  'test-result':()=>shell({role:'tester',title:'提交测试结果',subtitle:'记录本轮测试通过或不通过；不通过时必须填写问题说明',active:'待测任务',content:`
    ${scope()}<div class="result-layout"><div class="stack"><section class="card section-card"><div class="section-title"><div><h2>首款签约游戏 · v1.1.0 · 第 2 轮</h2><p>结果提交后结束本轮测试并写入操作记录</p></div>${badge('测试中','amber')}</div><div class="choice-row"><div class="choice"><b><i class="radio"></i>测试通过</b><span>结果进入平台发布前置检查；不代表已正式发布。</span></div><div class="choice danger selected"><b><i class="radio"></i>测试不通过</b><span>版本退回开发者，问题说明同步展示。</span></div></div><label style="display:block;font-size:13px;font-weight:650;margin:14px 0 7px">问题说明（不通过时必填）</label><div class="textarea">启动后未进入主界面；请核对当前包体和启动说明后重新提交。</div><div class="actions end" style="margin-top:15px"><button class="btn">返回任务</button><button class="btn danger">提交不通过结果</button></div></section><section class="notice red" style="margin:0"><strong>结果提交失败</strong>保留当前选择和问题说明并允许重试；同一测试轮次只接受一个生效结果，不生成重复结束记录。</section></div><aside class="stack"><section class="card side-note"><h3>提交结果影响</h3><ul><li>不通过：版本回到开发者并显示问题说明。</li><li>重新提交：生成新的测试轮次。</li><li>通过：版本进入平台待发布处理，不直接上线。</li></ul></section><section class="card side-note"><h3>权限边界</h3><ul><li>只能处理分配给当前账号的任务。</li><li>不能修改版本号、包体或运行说明。</li><li>不能发布、撤回、下架或暂停入口。</li></ul></section></aside></div>`}),

  'ops-version-list':()=>shell({role:'ops',title:'版本审核',subtitle:'核对签约项目、测试状态和版本处理进度',active:'版本审核',content:`
    ${scope()}<div class="stats"><section class="card stat"><div class="label">签约游戏</div><div class="value">1</div><div class="hint">仅首款 Windows 游戏</div></section><section class="card stat"><div class="label">测试中</div><div class="value">0</div><div class="hint">当前无测试中版本</div></section><section class="card stat"><div class="label">测试通过</div><div class="value">1</div><div class="hint">待平台设为待发布</div></section><section class="card stat"><div class="label">当前线上</div><div class="value">v1.0.0</div><div class="hint">发布失败时继续保留</div></section></div><section class="card section-card"><div class="toolbar"><div class="toolbar-left"><div class="input">搜索厂商／游戏／版本</div><div class="select">测试状态：全部</div><div class="select">版本状态：全部</div></div><div class="toolbar-right">${badge('签约范围','blue')}</div></div><table class="table"><colgroup><col style="width:20%"><col style="width:11%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:16%"><col style="width:11%"></colgroup><thead><tr><th>厂商／游戏</th><th>版本</th><th>签约项目校验</th><th>测试结果</th><th>版本状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody><tr><td><b>示例厂商</b><br><span class="muted">首款签约游戏 · Windows</span></td><td>v1.1.0</td><td>${badge('属于签约项目','green')}</td><td>${badge('第 2 轮通过','green')}</td><td>${badge('测试通过','green')}</td><td>09-02 16:20</td><td><span class="link">审核详情</span></td></tr><tr><td><b>示例厂商</b><br><span class="muted">首款签约游戏 · Windows</span></td><td>v1.0.0</td><td>${badge('属于签约项目','green')}</td><td>${badge('第 1 轮通过','green')}</td><td>${badge('已发布','blue')}</td><td>08-20 10:00</td><td><span class="link">查看详情</span></td></tr></tbody></table><div class="pagination"><button class="page-btn active">1</button></div></section><div class="security-strip" style="margin-top:15px">列表只包含已签约项目；测试未通过或签约归属校验失败的版本不能设为待发布，所有处理尝试均记录结果。</div>`}),

  'ops-version-detail':()=>shell({role:'ops',title:'版本审核详情',subtitle:'核对版本资料、签约归属和测试通过前置',active:'版本审核',content:`
    ${scope()}<div class="result-layout"><div class="stack"><section class="card section-card"><div class="section-title"><div><h2>首款签约游戏 · v1.1.0</h2><p>示例厂商 · Windows 正式版本</p></div>${badge('测试通过','green')}</div><div class="info-grid"><div class="info-item"><div class="k">版本号／分支</div><div class="v">v1.1.0 · 正式版本</div></div><div class="info-item"><div class="k">包体</div><div class="v">上传完成 · 校验通过</div></div><div class="info-item"><div class="k">启动文件</div><div class="v">Game.exe</div></div><div class="info-item"><div class="k">更新说明</div><div class="v">已填写</div></div><div class="info-item"><div class="k">运行说明</div><div class="v">已填写</div></div><div class="info-item"><div class="k">测试结果</div><div class="v">第 2 轮通过</div></div></div></section><section class="card section-card"><div class="section-title"><div><h2>操作记录</h2><p>版本、轮次、操作人与结果可追溯</p></div></div><div class="audit-row"><b>09-02 16:20</b><span>测试人员提交第 2 轮通过</span>${badge('成功','green')}</div><div class="audit-row"><b>09-02 09:20</b><span>开发者重新提交测试</span>${badge('成功','green')}</div><div class="audit-row"><b>09-01 15:10</b><span>第 1 轮测试不通过</span>${badge('已记录','gray')}</div></section></div><aside class="card review-panel"><h2>待发布前置</h2><div class="check-list"><div class="check-row"><div><b>已签约项目</b><small>厂商、游戏与合作范围有效</small></div>${badge('通过','green')}</div><div class="check-row"><div><b>游戏资料有效</b><small>发行方式为盖世直接下载</small></div>${badge('通过','green')}</div><div class="check-row"><div><b>版本测试</b><small>第 2 轮测试通过</small></div>${badge('通过','green')}</div><div class="check-row"><div><b>单线上版本</b><small>当前线上 v1.0.0</small></div>${badge('已确认','blue')}</div></div><div class="security-strip" style="margin-top:14px">设为待发布不等于上线；后续由平台选择立即或定时发布。</div><div class="actions end" style="margin-top:16px"><button class="btn">返回列表</button><button class="btn primary">设为待发布</button></div></aside></div>`}),

  'release-list':()=>shell({role:'ops',title:'待发布版本',subtitle:'管理测试通过且已进入待发布的正式版本',active:'待发布',content:`
    ${scope()}${stateStrip('待发布')}
    <div class="stats"><section class="card stat"><div class="label">当前线上版本</div><div class="value">v1.0.0</div><div class="hint">新版本成功前保持在线</div></section><section class="card stat"><div class="label">待发布版本</div><div class="value">1</div><div class="hint">v1.1.0 测试已通过</div></section><section class="card stat"><div class="label">定时任务</div><div class="value">0</div><div class="hint">当前未设置</div></section><section class="card stat"><div class="label">发布失败</div><div class="value">0</div><div class="hint">失败时仍保持待发布</div></section></div><section class="card section-card"><div class="section-title"><div><h2>待发布列表</h2><p>立即／定时发布仅由平台发行运营配置</p></div></div><table class="table"><colgroup><col style="width:21%"><col style="width:11%"><col style="width:14%"><col style="width:15%"><col style="width:15%"><col style="width:14%"><col style="width:10%"></colgroup><thead><tr><th>厂商／游戏</th><th>候选版本</th><th>测试结果</th><th>当前线上版本</th><th>发布方式</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td><b>示例厂商</b><br><span class="muted">首款签约游戏 · Windows</span></td><td>v1.1.0</td><td>${badge('第 2 轮通过','green')}</td><td>v1.0.0</td><td>${badge('未配置','gray')}</td><td>${badge('待发布','purple')}</td><td><span class="link">配置发布</span><br><span class="link" style="line-height:2">撤回版本</span></td></tr></tbody></table><div class="pagination"><button class="page-btn active">1</button></div></section><div class="notice red" style="margin-top:15px"><strong>发布失败保护</strong>候选版本保持“待发布”，用户继续获得并运行原线上版本 v1.0.0；平台可重试，不自动回滚或切换到其他版本。</div>`}),

  'release-config':()=>shell({role:'ops',title:'发布配置',subtitle:'为测试通过的正式版本选择立即发布或定时发布',active:'待发布',content:`
    ${scope()}<div class="result-layout"><div class="stack"><section class="card section-card"><div class="section-title"><div><h2>v1.1.0 发布方式</h2><p>成功后成为用户可获取的新线上版本</p></div>${badge('待发布','purple')}</div><div class="choice-row"><div class="choice selected"><b><i class="radio"></i>立即发布</b><span>提交成功后立即切换为当前线上版本。</span></div><div class="choice"><b><i class="radio"></i>定时发布</b><span>在平台选择的时间执行发布。</span></div></div><div class="field-grid" style="margin-top:14px">${field('候选版本','v1.1.0','',false,'readonly')}${field('当前线上版本','v1.0.0','发布失败时继续保留',false,'readonly')}${field('定时发布时间','选择“定时发布”后填写','当前选择立即发布',true,'readonly')}</div><div class="actions end" style="margin-top:16px"><button class="btn">取消</button><button class="btn primary">确认立即发布</button></div></section><section class="notice red" style="margin:0"><strong>失败处理</strong>发布失败时 v1.1.0 保持待发布，v1.0.0 继续为当前线上版本；平台可在本页重新执行。</section></div><aside class="card review-panel"><h2>发布前检查</h2><div class="check-list"><div class="check-row"><b>签约项目有效</b>${badge('通过','green')}</div><div class="check-row"><b>游戏资料有效</b>${badge('通过','green')}</div><div class="check-row"><b>第 2 轮测试通过</b>${badge('通过','green')}</div><div class="check-row"><b>候选版本处于待发布</b>${badge('通过','green')}</div><div class="check-row"><b>当前线上版本唯一</b>${badge('v1.0.0','blue')}</div></div><div class="security-strip" style="margin-top:14px">开发者无本页权限；发布方式、时间、操作人、结果与失败原因均写入操作记录。</div></aside></div>`}),

  'live-disposal':()=>shell({role:'ops',title:'线上版本处置',subtitle:'重大问题时暂停下载或启动入口，并同步开发者平台处理状态',active:'线上处置',content:`
    ${scope()}<div class="notice red"><strong>重大问题处置边界</strong>当前线上版本为 v1.0.0。暂停下载、暂停启动或下架游戏均由平台发行运营执行并记录原因；本页不提供开发者自助回滚。</div><section class="card section-card"><div class="section-title"><div><h2>线上入口状态</h2><p>处置只作用于当前游戏和当前线上版本</p></div>${badge('线上 v1.0.0','green')}</div><div class="disposal-grid"><div class="disposal-card"><h3>新用户获取／游戏展示</h3><p>游戏下架后停止新用户获取；已获得用户的权益表现由后续权益规则处理。</p><div class="current">当前状态：${badge('正常展示','green')}</div><button class="btn danger" style="width:100%">下架游戏</button></div><div class="disposal-card"><h3>下载入口</h3><p>重大问题时暂停新的下载入口，并在开发者平台显示处理状态。</p><div class="current">当前状态：${badge('可下载','green')}</div><button class="btn warn" style="width:100%">暂停下载</button></div><div class="disposal-card"><h3>启动入口</h3><p>重大问题时暂停启动入口，避免用户继续进入受影响版本。</p><div class="current">当前状态：${badge('可启动','green')}</div><button class="btn danger" style="width:100%">暂停启动</button></div></div></section><div class="grid-2" style="margin-top:15px"><section class="card section-card"><div class="section-title"><div><h2>处置原因与影响</h2><p>提交前明确原因和当前影响范围</p></div></div><div class="field-grid">${field('处置原因','填写面向内部与开发者可理解的原因','',true,'textarea')}${field('当前线上版本','v1.0.0','',false,'readonly')}${field('开发者平台状态','处置后同步展示','',false,'readonly')}</div></section><aside class="card timeline"><div class="section-title"><div><h2>操作记录</h2><p>成功与失败均留痕</p></div></div><div class="timeline-item"><span class="time">当前</span><span class="desc">下载与启动入口正常<br><span class="muted">无重大问题处置</span></span>${badge('线上','green')}</div><div class="security-strip" style="margin-top:12px">记录操作对象、动作、前后状态、原因、操作人、结果和时间；失败时保留原线上入口状态。</div></aside></div>`})
};

app.innerHTML=(pages[pageKey]||pages['version-list'])();
</script>
</body>
</html>
