<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>游戏下载、安装、启动与更新页面结构</title>
  <link rel="stylesheet" href="local-delivery-screens.css">
</head>
<body>
<div id="app" class="screen"></div>
<script>
const key=new URLSearchParams(location.search).get('page')||'install-path';
const app=document.getElementById('app');
const tag=(t,k='')=>`<span class="tag ${k}">${t}</span>`;
function status(){return `<div class="statusbar"><span>4:17</span><div class="status-icons"><span>120Hz</span><span>⌁</span><span class="battery">82</span></div></div>`}
function topbar(title,more=false){return `<div class="topbar"><div class="back">‹</div><div class="title">${title}</div><div class="spacer"></div>${more?'<div class="more">•••</div>':''}</div>`}
function nav(){return `<nav class="bottom-nav"><div class="nav"><i></i>首页</div><div class="nav"><i></i>玩游戏</div><div class="nav"><i></i>排行榜</div><div class="nav active"><i></i>游戏库</div><div class="nav"><i></i>我的</div></nav>`}
function shell({title,boundary,body,sticky='',more=false,withNav=false}){return `<div class="shell ${withNav?'with-nav':''}">${status()}<div class="evidence">证据边界｜${boundary}</div>${topbar(title,more)}<main class="content ${sticky?'':'no-action'}"><div class="stack">${body}</div></main>${withNav?nav():''}${sticky}</div>`}
function game(version='目标版本 v1.0.0',right=tag('盖世直接下载','green')){return `<div class="game"><div class="cover"></div><div><h2>空洞骑士：丝之歌</h2><p>${version}</p><p>Windows · 正式版本</p></div><div>${right}</div></div>`}
function sticky(primary,secondary='',danger=false){return `<div class="sticky">${secondary?`<button class="btn">${secondary}</button>`:''}<button class="btn ${danger?'red':'primary'}">${primary}</button></div>`}
function progress(value,kind=''){return `<div class="progress ${kind}"><i style="width:${value}%"></i></div>`}

function installPath(){return shell({title:'选择安装位置',boundary:'本期新页面 · 结构已由产品规格确认 · 历史 Mac 方案仅作规则参考',sticky:sticky('开始下载','返回游戏库'),body:`
  <section class="section">${game('当前线上版本 v1.0.0')}</section>
  <section class="section"><div class="section-title">安装位置 ${tag('路径可用','green')}</div><div class="input"><span class="path">D:\\GameHub\\Games\\HollowKnightSilksong</span><button class="select">修改位置</button></div><div class="grid" style="margin-top:16px"><div class="info"><div class="k">本次任务所需空间</div><div class="v">43.2 GB</div></div><div class="info"><div class="k">磁盘可用空间</div><div class="v green">126.8 GB</div></div></div></section>
  <section class="section"><div class="section-title">开始前校验 <small>修改路径后立即重检</small></div><div class="checklist"><div class="check"><i></i><div><b>有效盖世权益</b><br><span>当前用户可下载本游戏</span></div>${tag('通过','green')}</div><div class="check"><i></i><div><b>唯一当前线上版本</b><br><span>v1.0.0 · 下载开关已开启</span></div>${tag('通过','green')}</div><div class="check"><i></i><div><b>目录可创建且可写</b><br><span>未被同游戏其他任务占用</span></div>${tag('通过','green')}</div><div class="check"><i></i><div><b>可用空间充足</b><br><span>覆盖下载、校验与安装过程</span></div>${tag('通过','green')}</div></div></section>
  <div class="notice amber"><b>恢复边界：</b>目录不存在、不可写、空间不足或被同游戏任务占用时，“开始下载”不可用，并在对应校验项展示原因；不会创建空任务或不完整安装目录。</div>`})}

function downloadTask(){return shell({title:'下载任务',boundary:'当前证据仅证明下载管理空态 · 本页进行态为本期产品低保真',sticky:sticky('暂停下载','取消任务'),body:`
  <section class="task-hero"><div class="task-head"><div><h2>空洞骑士：丝之歌</h2><p>盖世直接下载 · 目标 v1.0.0</p></div><div class="state">下载中</div></div>${progress(62)}<div class="progress-meta"><span><b>11.5 GB</b> / 18.6 GB</span><span>18.4 MB/s · 预计 6 分钟</span></div></section>
  <section class="section"><div class="section-title">当前阶段 <small>同一 task_id 连续流转</small></div><div class="stage-row"><div class="stage current"><b>下载</b><p>62% · 网络阶段</p></div><div class="stage"><b>完整性校验</b><p>下载完成后自动开始</p></div><div class="stage"><b>安装</b><p>校验通过后开始</p></div></div></section>
  <section class="section"><div class="section-title">任务详情</div><div class="line"><span class="k">安装位置</span><span class="v">D:\\GameHub\\Games\\...</span></div><div class="line"><span class="k">任务状态</span><span class="v green">下载中</span></div><div class="line"><span class="k">已完成数据</span><span class="v">可暂停并继续</span></div><div class="line"><span class="k">客户端退出</span><span class="v">保存进度并转为暂停</span></div></section>
  <div class="notice red"><b>网络中断：</b>任务进入失败并保留已完成数据、目标版本和安装位置；网络恢复后显示“重试”，从平台确认的可恢复位置继续，不清空进度。</div>
  <div class="notice amber"><b>操作边界：</b>下载中可暂停或取消；校验中和安装中不提供暂停／取消。重复操作返回同一结果，不创建第二条任务。</div>`})}

function downloadManager(){return shell({title:'下载管理',boundary:'沿用现有标题、返回和空态 · 任务卡片与进行状态为本期新增',body:`
  <div class="group-title">正在处理 <span>1 个任务</span></div><div class="task-list"><section class="task-card"><div class="game"><div class="cover"></div><div><h3>空洞骑士：丝之歌</h3><p>下载安装 · v1.0.0</p><p class="state">下载中 · 62%</p></div><button class="btn small">暂停</button></div>${progress(62)}<div class="progress-meta"><span>11.5 / 18.6 GB</span><span>18.4 MB/s</span></div></section></div>
  <div class="group-title">需要处理 <span>2 个任务</span></div><div class="task-list"><section class="task-card"><div class="game"><div class="cover" style="filter:hue-rotate(65deg)"></div><div><h3>山海旅人</h3><p>强制更新 · v1.2.0</p><p class="state pause">暂停 · 退出客户端</p></div><button class="btn small">继续</button></div>${progress(41,'amber')}<div class="notice amber" style="margin-top:14px">已保存进度；重新打开客户端后需手动继续。</div></section><section class="task-card"><div class="game"><div class="cover" style="filter:hue-rotate(150deg)"></div><div><h3>霓虹深渊</h3><p>修复 · 当前版本</p><p class="state fail">失败 · 网络中断</p></div><button class="btn small">重试</button></div>${progress(27,'red')}<div class="notice red" style="margin-top:14px">已下载数据保留，不影响权益和当前完整本地版本。</div></section></div>
  <div class="notice"><b>列表范围：</b>仅显示本机当前账号的盖世包体有效任务和待处理结果；不显示第三方平台交付游戏、其他设备任务或已安装且无待处理任务的游戏。</div>`})}

function installResult(){return shell({title:'安装进度与结果',boundary:'本期新页面 · 结构已确认 · 校验、安装和恢复状态均非现状截图',sticky:sticky('重试安装','返回下载管理'),body:`
  <section class="section">${game('目标 v1.0.0 · 下载已完成')}</section>
  <section class="section"><div class="result"><div class="result-icon">!</div><h1>安装未完成</h1><p>写入安装记录失败。已下载和校验通过的数据仍保留，可直接重试安装。</p></div><div class="stage-row"><div class="stage done"><b>下载完成</b><p>18.6 GB</p></div><div class="stage done"><b>校验通过</b><p>文件完整</p></div><div class="stage fail"><b>安装失败</b><p>未写入新版本</p></div></div></section>
  <section class="section"><div class="section-title">恢复结果</div><div class="line"><span class="k">失败阶段</span><span class="v red">安装 / 应用</span></div><div class="line"><span class="k">已下载文件</span><span class="v green">保留，可复用</span></div><div class="line"><span class="k">当前完整本地版本</span><span class="v">未写入 v1.0.0</span></div><div class="line"><span class="k">恢复动作</span><span class="v">重试安装</span></div></section>
  <div class="notice green"><b>成功判定：</b>只有目标版本再次完成完整性校验、安装成功并写入本地安装记录后，任务才进入“已安装”，游戏库主动作才变为“启动游戏”。</div>
  <div class="notice amber"><b>客户端退出：</b>校验或安装阶段被客户端进程退出中断时，任务进入失败；重新打开后从对应阶段重试，不把中断版本标为已安装。</div>`})}

function libraryLaunch(){return shell({title:'游戏库详情',boundary:'复用当前 PC 游戏详情外壳 · 权益、版本、启动状态与主动作是本期新增',withNav:true,more:true,sticky:sticky('启动游戏'),body:`
  <div class="library-hero"></div><div class="library-name"><div><h1>空洞骑士：丝之歌</h1><p>盖世直接下载 · Windows 正式版本</p></div><div class="score">9.3<span>玩家评价</span></div></div>
  <section class="section"><div class="section-title">启动前校验 ${tag('可以启动','green')}</div><div class="prechecks"><div class="precheck"><i></i><b>盖世权益</b><span>有效</span></div><div class="precheck"><i></i><b>当前完整本地版本</b><span>v1.0.0</span></div><div class="precheck"><i></i><b>当前线上版本</b><span>v1.0.0 · 无必须更新</span></div><div class="precheck"><i></i><b>启动开关</b><span>已开启</span></div><div class="precheck"><i></i><b>文件完整性</b><span>最近校验通过</span></div></div></section>
  <section class="section"><div class="section-title">当前安装</div><div class="grid"><div class="info"><div class="k">本地状态</div><div class="v green">已安装</div></div><div class="info"><div class="k">安装位置</div><div class="v">D:\\GameHub\\Games\\...</div></div></div></section>
  <div class="notice"><b>启动触发：</b>点击后再次校验权益、交付方式、完整本地版本、当前线上版本和启动开关；任一条件变化都不继续启动，并进入对应更新或恢复状态。</div>`})}

function requiredUpdate(){const base=shell({title:'游戏库详情',boundary:'复用当前详情外壳 · 必须更新提示为本期新状态',body:`<div class="library-hero"></div><div class="library-name"><div><h1>空洞骑士：丝之歌</h1><p>盖世直接下载 · 已安装 v1.0.0</p></div><div class="score">9.3<span>玩家评价</span></div></div><section class="section"><div class="section-title">版本状态</div><div class="line"><span class="k">当前完整本地版本</span><span class="v">v1.0.0</span></div><div class="line"><span class="k">当前线上版本</span><span class="v amber">v1.1.0 · 必须更新</span></div></section>`});return base.replace('</div>',`</div><div class="overlay"></div><section class="dialog"><div style="display:flex;justify-content:space-between;align-items:center"><h1>需要更新后启动</h1>${tag('必须更新','amber')}</div><p>当前完整本地版本为 v1.0.0。完成 v1.1.0 更新前，暂不能启动游戏。</p><div class="grid"><div class="info"><div class="k">更新大小</div><div class="v">4.8 GB</div></div><div class="info"><div class="k">预计额外空间</div><div class="v">9.6 GB</div></div></div><div class="notice green" style="margin-top:18px"><b>版本保护：</b>更新失败或取消时保留 v1.0.0 的完整文件与更新任务；本次必须更新仍有效，完成前继续拦截启动。</div><div class="notice" style="margin-top:14px"><b>更新说明：</b>修复启动崩溃与存档载入问题，并更新正式版本资源。</div><div class="buttons"><button class="btn">返回游戏库</button><button class="btn primary">开始更新</button></div></section>`)}

function updateTask(){return shell({title:'更新前校验',boundary:'本期新页面 · 游戏运行中不创建更新任务 · 退出后重新检测',sticky:sticky('重新检测','返回游戏库'),body:`
  <section class="section">${game('盖世直接下载 · v1.0.0 → v1.1.0',tag('必须更新','amber'))}</section>
  <section class="task-hero"><div class="task-head"><div><h2>暂不能开始更新</h2><p>更新前校验未通过</p></div><div class="state pause">未创建任务</div></div><div class="notice amber" style="margin-top:20px"><b>检测到游戏运行，请退出后重新检测。</b></div></section>
  <section class="section"><div class="section-title">校验结果</div><div class="line"><span class="k">游戏进程</span><span class="v amber">运行中</span></div><div class="line"><span class="k">本次请求</span><span class="v">未创建更新任务</span></div><div class="line"><span class="k">当前完整本地版本</span><span class="v green">v1.0.0 · 保持不变</span></div><div class="line"><span class="k">目标版本</span><span class="v">v1.1.0 · 必须更新</span></div></section>
  <section class="section"><div class="section-title">重新检测</div><div class="notice"><b>退出游戏后点击“重新检测”。</b>检测确认游戏未运行后，才创建当前游戏的更新任务。</div><div class="line" style="margin-top:14px"><span class="k">启动状态</span><span class="v amber">必须更新完成前不可启动</span></div></section>`})}

function launchRecovery(){return shell({title:'启动失败',boundary:'本期新页面 · 只提供可理解原因与恢复入口 · 不新增高级 DRM',sticky:sticky('修复游戏文件','返回游戏库'),body:`
  <section class="section"><div class="result"><div class="result-icon">!</div><h1>游戏未能启动</h1><p>盖世直接下载游戏的启动文件完整性异常。权益和版本状态正常，需要先修复游戏文件。</p></div></section>
  <section class="section"><div class="section-title">校验结果</div><div class="prechecks"><div class="precheck"><i></i><b>盖世权益</b><span>有效</span></div><div class="precheck"><i></i><b>当前线上版本</b><span>v1.1.0 · 已更新</span></div><div class="precheck"><i></i><b>启动开关</b><span>已开启</span></div></div><div class="line"><span class="k">失败阶段</span><span class="v red">启动执行</span></div><div class="line"><span class="k">可理解原因</span><span class="v">启动文件缺失或损坏</span></div></section>
  <section class="section"><div class="section-title">恢复方式</div><div class="notice green"><b>修复游戏文件。</b>系统只校验版本清单中的托管文件，下载缺失或损坏文件；不删除权益、订单或未托管文件。</div></section>
  <div class="notice red"><b>不展示：</b>启动敏感参数、内部错误堆栈、文件清单明细和高级 DRM 设置。</div>`})}

function gameManagement(){const base=shell({title:'游戏详情',boundary:'复用当前 PC 游戏详情与更多菜单外壳 · 修复和卸载是本期新增动作',body:`<div class="library-hero"></div><div class="library-name"><div><h1>空洞骑士：丝之歌</h1><p>盖世直接下载 · 已安装 v1.1.0</p></div><div class="score">9.3<span>玩家评价</span></div></div><section class="section"><div class="section-title">当前状态</div><div class="line"><span class="k">游戏进程</span><span class="v green">未运行</span></div><div class="line"><span class="k">本地任务</span><span class="v">无有效任务</span></div></section>`});return base.replace('</div>',`</div><div class="overlay"></div><section class="sheet"><div class="sheet-head"><h1>游戏管理</h1><div class="close">×</div></div><div class="menu-grid"><div class="menu"><i></i>秒玩设置</div><div class="menu"><i></i>分享</div><div class="menu"><i></i>添加到桌面</div><div class="menu"><i></i>修改信息</div><div class="menu"><i></i>按键与布局</div><div class="menu green"><i></i>修复游戏文件</div><div class="menu red"><i></i>卸载游戏</div></div><div class="notice menu-note"><b>盖世直接下载正式版：</b>一期只使用唯一当前线上版本，不展示版本切换、自助回滚、备份或云存档入口。</div><div class="notice amber menu-note"><b>任务冲突：</b>游戏下载、更新或修复进行中，或游戏进程仍在运行时，修复与卸载入口禁用并显示原因。</div></section>`)}

function repair(){return shell({title:'修复游戏文件',boundary:'本期新页面 · 只处理版本清单内托管文件 · 不删除权益或用户文件',sticky:'<div class="sticky"><button class="btn">取消</button><button class="btn disabled" disabled>开始修复</button></div>',body:`
  <section class="section">${game('当前完整本地版本 v1.1.0')}</section>
  <section class="section"><div class="section-title">修复确认 ${tag('空间不足','red')}</div><div class="notice green"><b>修复不会删除已获得权益。</b>系统只校验并恢复版本清单内的托管游戏文件；未列入清单的用户文件、存档和配置不主动删除。</div><div class="grid" style="margin-top:16px"><div class="info"><div class="k">目标版本</div><div class="v">v1.1.0</div></div><div class="info"><div class="k">安装位置</div><div class="v">D:\\GameHub\\Games\\...</div></div><div class="info"><div class="k">预计所需空间</div><div class="v">6.4 GB</div></div><div class="info"><div class="k">可用空间</div><div class="v red">3.1 GB</div></div></div></section>
  <section class="section"><div class="section-title">开始前检查</div><div class="checklist"><div class="check"><i></i><div><b>游戏未运行</b><br><span>无进程写入冲突</span></div>${tag('通过','green')}</div><div class="check"><i></i><div><b>同游戏无其他任务</b><br><span>未进行下载、更新或卸载</span></div>${tag('通过','green')}</div><div class="check"><i></i><div><b>有效权益与版本清单</b><br><span>目标版本 v1.1.0</span></div>${tag('通过','green')}</div><div class="check fail"><i></i><div><b>可用空间不足</b><br><span>还需释放 3.3 GB</span></div>${tag('未通过','red')}</div></div></section>
  <section class="section"><div class="section-title">执行与恢复</div><div class="timeline"><div class="timeitem"><div class="dot"></div><div><b>校验托管文件</b><p>发现缺失或损坏后进入补下载</p></div><span>等待通过校验</span></div><div class="timeitem"><div class="dot"></div><div><b>下载异常文件</b><p>网络中断时保留已完成数据</p></div><span>等待</span></div><div class="timeitem"><div class="dot"></div><div><b>再次校验并完成</b><p>通过后恢复完整性结果</p></div><span>等待</span></div></div></section>
  <div class="notice red"><b>当前不可开始：</b>可用空间不足时“开始修复”不可用；释放足够空间并重新检测后才可开始。</div>`})}
