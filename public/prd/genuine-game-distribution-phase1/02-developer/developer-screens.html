<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正版发行平台一期·开发者页面图</title><link rel="stylesheet" href="developer-screens.css"></head>
<body><div id="app" class="screen"></div><script>
const page = new URLSearchParams(location.search).get('page') || 'developer-home';
const app = document.getElementById('app');

const navDeveloper = ['工作台','厂商资料','游戏管理','CDKEY 供给','包体版本','投放需求','发行数据'];
const navOps = ['发行总览','合作方账号','厂商资料审核','游戏资料审核','操作记录'];
function aside(items, active, ops=false){return `<aside class="admin-aside"><div class="admin-brand"><i class="brand-mark"></i>${ops?'发行运营后台':'开发者平台'}</div><div class="nav-list">${items.map(x=>`<div class="nav-item ${x===active?'active':''}"><i class="nav-dot"></i>${x}</div>`).join('')}</div><div class="aside-bottom">一期范围：${ops?'签约项目的审核与操作留痕':'受邀合作方，仅见本厂商数据'}</div></aside>`}
function admin(title,subtitle,active,content,ops=false){const nav=ops?navOps:navDeveloper;return `<div class="admin-shell"><div class="lowfi-strip">产品低保真结构 · 非现网页面 · 仅表达已确认字段、状态与动作</div>${aside(nav,active,ops)}<main class="admin-main"><header class="admin-top"><div><h1>${title}</h1><div class="sub">${subtitle}</div></div><div class="account"><span>${ops?'平台发行运营':'示例厂商'}</span><i class="avatar">${ops?'运':'厂'}</i></div></header><div class="admin-content">${content}</div></main></div>`}
function badge(text,kind='gray'){return `<span class="badge ${kind}">${text}</span>`}
function field(label,value,help='',full=false,type='input'){return `<div class="field ${full?'full':''}"><label>${label}</label>${type==='textarea'?`<div class="textarea">${value}</div>`:`<div class="input" style="display:flex;align-items:center">${value}</div>`}${help?`<div class="help">${help}</div>`:''}</div>`}

function cTop(title){return `<div class="c-status"><span>09:41</span><span>盖世游戏</span></div><header class="c-top"><i class="back"></i><h1>${title}</h1><span class="share">更多</span></header><div class="c-page-tag">C 端结构示意 · 复用现有深色外壳</div>`}
function cBottom(active){return `<nav class="c-bottom">${['首页','玩游戏','排行榜','游戏库','我的'].map(x=>`<div class="c-nav ${x===active?'active':''}"><i></i>${x}</div>`).join('')}</nav>`}

const pages = {
'vendor-home':()=>`<div class="c-shell">${cTop('厂商主页')}<div class="c-content"><section class="c-card vendor-hero"><div class="vendor-logo">厂商<br>LOGO</div><div class="vendor-meta"><h2>示例厂商</h2><p>厂商简介由已签约合作方提交，经平台审核通过后按固定模板展示。一期不支持页面装修、社区或私域运营。</p><span class="site">官方网站↗</span></div></section><div class="c-section-head"><h2>已发布游戏</h2><span>仅展示已发布内容</span></div><section class="c-card c-game-card"><div class="c-cover">游戏封面</div><div><h3>首款签约游戏</h3><p>固定游戏卡片展示游戏名称、已发布状态和唯一交付方式。未发布或已下架游戏不在此列表展示。</p><div class="c-badges"><span class="c-badge">已发布</span><span class="c-badge cyan">盖世直接下载</span></div></div><div class="c-action">查看游戏</div></section><div class="c-section-head"><h2>页面状态</h2><span>固定模板</span></div><section class="c-card" style="padding:30px;font-size:20px;color:#a5a8af;line-height:1.7">无已发布游戏时，游戏列表位置展示“暂无已发布游戏”；官网不可用时不执行跳转，但仍保留厂商名称与简介。</section></div>${cBottom('首页')}</div>`,
'game-publisher-entry':()=>`<div class="c-shell">${cTop('游戏详情')}<div class="c-content" style="padding-bottom:170px"><section class="detail-hero"><div class="detail-title"><h2>首款签约游戏</h2><p>游戏类型 · Windows · 系统要求已审核</p></div></section><div class="detail-grid"><section class="c-card detail-card"><h3>游戏简介</h3><p style="font-size:20px;line-height:1.75;color:#a7aab1;margin:0 0 28px">复用现有游戏详情媒体区、名称、标签与内容区；本期在详情内增加发行厂商入口和唯一交付方式。</p><h3>发行厂商</h3><div class="publisher-row"><div class="mini-logo">厂商<br>LOGO</div><div><b>示例厂商</b><span>选择后进入固定模板厂商主页</span></div><i class="chev"></i></div></section><aside class="c-card delivery"><h3 style="font-size:25px;margin:0 0 20px">获取信息</h3><div class="row"><span>交付方式</span><b style="color:#6bd4e7">盖世直接下载</b></div><div class="row"><span>支持系统</span><b>Windows</b></div><div class="row"><span>下载大小</span><b>由已发布版本提供</b></div><div class="row"><span>获取条件</span><b>按商品配置展示</b></div><p class="delivery-note">若当前为 CDKEY 游戏，此区改为“第三方平台激活”，并展示激活平台、地区限制和退款边界；两种入口不同时出现。</p></aside></div></div><div class="c-fixed-action"><p>价格或零价领取条件由合同对应商品配置决定；页面只展示与当前交付方式一致的行动。</p><div class="c-action">购买或领取</div></div></div>`,
'developer-login':()=>`<div class="login-shell"><div class="lowfi-strip">产品低保真结构 · 非现网页面 · 仅用于受邀合作方登录</div><section class="login-visual"><div class="admin-brand" style="border:0;padding:0"><i class="brand-mark"></i>盖世游戏 · 开发者平台</div><h1>统一跟进厂商资料、游戏审核与发行结果</h1><p>一期仅面向已签约、由平台创建账号的受邀合作方。账号登录后只能访问绑定厂商的对象和数据。</p><div class="login-tags"><span>受邀账号</span><span>厂商数据隔离</span><span>无公众注册</span></div></section><section class="login-panel"><div class="login-card"><h2>合作方登录</h2><div class="desc">请使用平台创建的账号登录</div><div class="login-field"><label>登录账号</label><input value="" placeholder="输入受邀账号"></div><div class="login-field"><label>登录密码</label><input type="password" value="" placeholder="输入密码"></div><button class="btn primary">登录</button><div class="login-rule">登录成功后进入已绑定厂商工作台。账号无效、合作范围失效或访问其他厂商时，不返回目标数据。</div></div></section></div>`,
'developer-home':()=>admin('工作台','查看本厂商发行对象和共享状态','工作台',`<div class="stats"><div class="card stat"><div class="label">厂商资料</div><div class="value" style="font-size:24px">资料已通过</div><div class="hint">关键资料修改后重新审核</div></div><div class="card stat"><div class="label">游戏项目</div><div class="value">1</div><div class="hint">仅展示本厂商项目</div></div><div class="card stat"><div class="label">待处理审核</div><div class="value">1</div><div class="hint">资料驳回后待修改</div></div><div class="card stat"><div class="label">数据更新</div><div class="value" style="font-size:24px">暂无数据</div><div class="hint">未知值不显示为 0</div></div></div><div class="grid-2"><section class="card section-card"><div class="section-title"><div><h2>本厂商游戏</h2><p>查看资料、交付方式及下一步状态</p></div><button class="btn primary">创建游戏</button></div><table class="table"><thead><tr><th>游戏</th><th>发行方式</th><th>资料</th><th>发布</th><th>操作</th></tr></thead><tbody><tr><td><div class="object"><i class="thumb">封面</i><b>首款签约游戏</b></div></td><td>${badge('盖世直接下载','blue')}</td><td>${badge('已驳回','red')}</td><td>${badge('未发布')}</td><td><span class="link">修改资料</span></td></tr></tbody></table></section><aside class="card section-card"><div class="section-title"><div><h2>发行模块</h2><p>后续流程入口，无直接发布权限</p></div></div>${['CDKEY 供给状态','包体版本','投放需求','发行数据'].map((x,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #edf0f4"><div><b>${x}</b><div class="muted" style="font-size:13px;margin-top:5px">${i===0?'查看关联与供应状态':i===1?'资料通过后进入版本流程':i===2?'提交需求，由平台配置':'仅查看本厂商数据'}</div></div><span class="link">进入</span></div>`).join('')}</aside></div>`,false),
'vendor-profile':()=>admin('厂商资料','维护固定模板所需信息并提交平台审核','厂商资料',`<div class="form-layout"><section class="card form-card"><div class="section-title"><div><h2>基本资料</h2><p>所有字段仅展示于本厂商固定模板主页</p></div>${badge('草稿')}</div><div class="field-grid">${field('厂商名称','示例厂商')}${field('厂商 Logo','已选择 Logo 素材','厂商拥有合法授权')}${field('厂商简介','简介内容在此展示，提交后由平台审核。','',true,'textarea')}${field('官方网站','https://www.example.com')}${field('联系信息','对接人／联系方式')}</div><div class="actions" style="justify-content:flex-end;margin-top:24px"><button class="btn">保存草稿</button><button class="btn primary">提交审核</button></div></section><aside><div class="card side-note"><h3>审核状态</h3>${badge('草稿')}<ul style="margin-top:14px"><li>保存失败不清空已填输入。</li><li>提交后进入“资料审核中”。</li><li>驳回时保留资料与原因，修改后重新提交。</li></ul></div><div class="card side-note"><h3>一期边界</h3><ul><li>不支持厂商主页自定义装修。</li><li>不包含成员、权限、合同或结算账户配置。</li></ul></div></aside></div>`,false),
'game-list':()=>admin('游戏管理','仅查看和管理本厂商游戏','游戏管理',`<div class="toolbar"><div class="toolbar-left"><input class="input" placeholder="搜索游戏名称"><select class="select"><option>全部发行方式</option></select><select class="select"><option>全部资料状态</option></select><select class="select"><option>全部发布状态</option></select></div><button class="btn primary">创建游戏</button></div><table class="table"><thead><tr><th>游戏</th><th>发行方式</th><th>资料审核</th><th>供给／版本</th><th>发布状态</th><th>投放状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody><tr><td><div class="object"><i class="thumb">封面</i><div><b>首款签约游戏</b><div class="muted" style="font-size:12px;margin-top:4px">本厂商项目</div></div></div></td><td>${badge('盖世直接下载','blue')}</td><td>${badge('已驳回','red')}</td><td>${badge('未进入')}</td><td>${badge('草稿')}</td><td>${badge('未提交')}</td><td>2026-09-01 10:30</td><td><span class="link">编辑</span><br><span class="link" style="line-height:2.1">查看审核</span></td></tr></tbody></table><div class="pagination"><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button></div><div class="card" style="margin-top:22px;padding:18px;color:#657084;font-size:14px;line-height:1.7"><b style="color:#30394a">列表恢复：</b> 加载失败时保留搜索、筛选和排序条件并提供重试；无游戏时展示空态和“创建游戏”入口；不展示其他厂商数据。</div>`,false),
'game-editor':()=>admin('创建／编辑游戏','填写发行资料，保存草稿或提交审核','游戏管理',`<div class="form-layout"><section class="card form-card"><div class="form-section"><div class="section-title"><div><h2>基本资料与宣传素材</h2><p>提交后进入资料审核中</p></div>${badge('草稿')}</div><div class="field-grid">${field('游戏名称','首款签约游戏')}${field('发行厂商','示例厂商','根据账号绑定厂商确定')}${field('游戏简介','游戏简介内容','',true,'textarea')}<div class="field full"><label>宣传素材</label><div class="placeholder">封面、媒体与相关素材上传区</div><div class="help">厂商对素材拥有合法授权</div></div></div></div><div class="form-section"><h2>语言、地区与系统要求</h2><div class="field-grid">${field('支持语言','由开发者选择')}${field('发行地区','由签约与授权范围确定')}${field('支持系统','Windows')}${field('系统要求','填写必要运行要求')}</div></div><div class="form-section"><h2>游戏标签与发行方式</h2><div class="field-grid">${field('游戏标签','类型／题材／玩法／适配设备','平台审核或修正后生效',true)}<div class="field full"><label>发行方式</label><div class="choice-row"><div class="choice"><b>第三方平台激活</b><span>后续进入 CDKEY 供给关联流程</span></div><div class="choice selected"><b>盖世直接下载</b><span>后续进入 Windows 包体版本和测试流程</span></div></div></div></div></div><div class="actions" style="justify-content:flex-end"><button class="btn">保存草稿</button><button class="btn primary">提交审核</button></div></section><aside><div class="card side-note"><h3>提交规则</h3><ul><li>提交失败不清空已填输入。</li><li>审核中页面只读，防止重复提交。</li><li>已发布游戏修改关键资料时，线上内容保持不变，修改稿重新审核。</li></ul></div><div class="card side-note"><h3>一期发行限制</h3><ul><li>仅覆盖一款 Windows 游戏、单一正式发布分支。</li><li>开发者只能提交审核，不能直接发布。</li></ul></div></aside></div>`,false),
'review-result':()=>admin('资料审核结果','查看原因、保留已填内容并修改后重新提交','游戏管理',`<div class="state-panel"><div class="detail-stack"><section class="card result-head"><div style="display:flex;align-items:center;justify-content:space-between"><div><h2>游戏资料已驳回</h2><p>本次提交的资料未通过平台审核，已填内容和素材已保留。</p></div>${badge('已驳回','red')}</div></section><section class="card section-card"><div class="section-title"><div><h2>驳回原因</h2><p>平台审核结果</p></div></div><div style="background:#fff4f2;border:1px solid #f0c5c0;color:#7d4039;border-radius:10px;padding:18px;line-height:1.7;font-size:14px">示例原因：宣传素材与发行授权范围需补充一致性说明；已提交游戏标签需根据实际玩法调整。</div><div class="actions" style="margin-top:20px"><button class="btn primary">修改并重新提交</button><button class="btn">返回游戏列表</button></div></section><section class="card section-card"><div class="section-title"><h2>本次提交摘要</h2></div><div class="info-grid"><div class="info-item"><div class="k">游戏</div><div class="v">首款签约游戏</div></div><div class="info-item"><div class="k">发行方式</div><div class="v">盖世直接下载</div></div><div class="info-item"><div class="k">提交内容</div><div class="v">基本资料、素材、标签</div></div></div></section></div><aside class="card timeline"><div class="section-title"><div><h2>审核记录</h2><p>状态与轮次留痕</p></div></div><div class="timeline-item"><b>2026-09-01</b><span>平台驳回<br><span class="muted">原因已记录</span></span></div><div class="timeline-item"><b>2026-08-31</b><span>开发者提交<br><span class="muted">进入资料审核中</span></span></div><div style="margin-top:20px;padding:16px;background:#f7f8fa;border-radius:10px;color:#687386;font-size:13px;line-height:1.65">重新提交后再次进入“资料审核中”，不覆盖既有驳回记录。</div></aside></div>`,false),

ottom:14px">资料审核通过不等于可发布。发行授权、期限、地区或合同合作范围未满足时，标记“资料已通过／发布前置未满足”并禁止正式发布；销售地区明确超出授权范围时驳回。</div><label style="display:block;font-size:14px;font-weight:650;margin-bottom:8px">驳回原因</label><div class="textarea">选择驳回时填写具体原因</div><div class="actions" style="margin-top:18px;flex-wrap:wrap"><button class="btn">保存标签修正</button><button class="btn danger">驳回</button><button class="btn primary">通过资料审核</button></div><div class="log" style="font-size:13px;color:#687386;line-height:1.65">修正后标签用于正式展示和后续投放；操作记录保留操作人、时间、对象和结果。</div></aside></div>`,true)
