const ref=id=>'';
const heading=(title,id,more='')=>`<div class="section-title"><h2>${title} ${ref(id)}</h2>${more}</div>`;
function feedback(text){/* Review feedback stays out of the product canvas. */}
function snapshot(){return {page:appState.page,detail:{...appState.detail},mode:appState.mode,scope:appState.communityScope,navCollapsed:appState.navCollapsed,scroll:document.querySelector('.content')?.scrollTop||0};}
function go(page,detail={}){if(page===appState.page&&Object.keys(detail).length===0)return;trail.push(snapshot());appState.page=page;appState.detail=detail;appState.navCollapsed=false;overlayData=null;render();}
function back(){if(overlayData){if(overlayData.kind!=='prepare')closePop();return;}if(appState.page==='community'&&appState.navCollapsed){restoreNav();return;}const prev=trail.pop();if(!prev){feedback('已在本次演示的起点。');return;}Object.assign(appState,{page:prev.page,detail:prev.detail,mode:prev.mode,communityScope:prev.scope,navCollapsed:prev.navCollapsed});render();recordingRestore=true;const c=document.querySelector('.content');if(c)c.scrollTop=prev.scroll;previousScroll=prev.scroll;requestAnimationFrame(()=>recordingRestore=false);}
function topLevel(page){trail.length=0;appState.page=page;appState.detail={};appState.navCollapsed=false;overlayData=null;if(page==='community')appState.mode='landscape';render();}
function pop(kind,title,bodyHtml){lastFocus=document.activeElement;overlayData={kind,title,body:bodyHtml};paintOverlay();}
function paintOverlay(){document.querySelector('.overlay')?.remove();if(!overlayData)return;const screen=document.querySelector('.screen');if(!screen)return;const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(overlayData.title)}" tabindex="-1"><h2>${esc(overlayData.title)}</h2>${overlayData.body}</div>`;screen.append(o);o.querySelector('button,input,select')?.focus();}
function closePop(){overlayData=null;document.querySelector('.overlay')?.remove();if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}
function continueStrip(){if(!appState.recent||appState.recentFolded)return '';return `<div class="continue-row" data-testid="continue-strip">${btn('<span>▷</span>继续','game','data-game="最近游玩游戏"','continue-label')}${btn('封面','game','data-game="最近游玩游戏"','thumb')}</div>`;}
function business(){return `<div class="business-row">${btn('秒玩上新','destination','data-title="秒玩上新"')}${btn('组队云玩','destination','data-title="组队云玩"')}</div>`;}
function contentCard(c){return `<article class="content-card"><button class="body" data-act="article" data-id="${c.id}">${placeholder('内容图','media')}<div><h3>${c.title}</h3><span class="mini muted">2 小时前</span></div></button><div class="link-game"><span>关联：${c.game}</span>${btn('查看游戏 →','game',`data-game="${c.game}"`)}</div></article>`;}
function editorial(pc=false){let body='';if(appState.variant==='loading')body='<div aria-busy="true"><div class="skeleton"></div><span class="small">精选加载中…</span></div>';else if(appState.variant==='empty')body='<div class="state-block">暂无精选内容</div>';else if(appState.variant==='error')body=`<div class="state-block"><p>精选内容加载失败</p>${btn('重试','retry-content')}</div>`;else body=`<div class="stack">${contentSamples.filter(c=>homeFilter==='全部'||c.type===homeFilter).slice(0,pc?3:4).map(contentCard).join('')}</div>`;return `<section class="section">${heading(pc?'PC 精选':'精选内容','H05 / H06',btn('社区 →','community-home'))}${body}</section>`;}

function resourceModule(){return `<section class="section"><div class="box"><div class="row between"><b>${appState.resourceIndex?'和朋友一起出发':'本周游戏精选'}</b><div class="row">${btn('‹','ops-resource-prev','aria-label="上一张"')}${btn('›','ops-resource-next','aria-label="下一张"')}</div></div><button class="placeholder" style="width:100%;margin-top:8px" data-act="ops-resource-open">${appState.resourceIndex?'周末一起玩':'发现更多游戏'} →</button>${appState.resourceFailed&&appState.resourceOpened?'<p>内容暂时无法打开</p>':''}</div></section>`;}

function playable(){const known=appState.playableMode==='known';return `${heading('本机可玩','P03')}<div class="box"><b>${known?'机型 A':appState.playableMode==='unknown'?'尚未识别设备':'机型 B'}</b></div>${appState.playableMode==='unknown'?'<div class="state-block">暂无法识别当前设备</div>':appState.playableMode==='none'?'<div class="state-block">暂无匹配的游戏</div>':`<div class="stack" style="margin-top:12px">${['A','B','C'].map(x=>`<div class="box"><div class="row">${placeholder('封面')}<div><b>PC 游戏 ${x}</b><p>机型 A · 默认配置</p></div></div><div class="row wrap" style="margin-top:10px">${btn('测试详情','conditions',`data-game="PC 游戏 ${x}"`)}${btn('查看游戏','game',`data-game="PC 游戏 ${x}"`)}</div></div>`).join('')}</div>`}`;}

function calendarPage(){const types=['新游发售','版本更新','适配更新'];return `${heading('游戏日历','P04')}<div class="strip">${['11 月 06 日','11 月 08 日','11 月 12 日'].map((t,i)=>btn(t,'calendar-day',`data-day="${i}"`,appState.calendarDay===i?'selected':'')).join('')}</div><div class="calendar-event"><b>${types[appState.calendarDay]} · 游戏 ${String.fromCharCode(65+appState.calendarDay)}</b><p>PC · ${['新游戏即将发售','新版本内容发布','新增设备适配'][appState.calendarDay]}</p></div><div class="row wrap">${btn('查看详情','article','data-title="游戏最新动态" data-kind="游戏资讯"')}${btn('查看游戏','game',`data-game="PC 游戏 ${String.fromCharCode(65+appState.calendarDay)}"`)}</div>`;}
function campaign(){if(!appState.campaign)return '<div class="state-block">暂无活动</div>';return `<iframe title="主题活动" class="campaign-frame" srcdoc="&lt;style&gt;body{margin:0;font:14px sans-serif;color:#222}div{height:110px;border:1px solid #aaa;background:#eee;display:grid;place-items:center}&lt;/style&gt;&lt;div&gt;周末一起玩&lt;/div&gt;"></iframe><h2>周末一起玩</h2><p>游戏体验、玩家交流与本周精选。</p><div class="stack">${gameGrid('PC 游戏',3)}${btn('查看活动','article','data-title="周末一起玩"')}${btn('我的任务','destination','data-title="我的任务"')}</div>`;}
function post(id,media='single'){return `<article class="post" data-post="${id}"><header><span>社区作者 ${id}</span><span>2 小时前</span></header><button data-act="article" data-title="分区帖子 ${id}" data-kind="社区帖子"><h3>${id%2?'玩家的运行与操作经验':'游戏问题与配置讨论'} ${id}</h3><p>分享一下这几天的游玩感受，也欢迎大家交流自己的操作设置。</p>${media==='multi'?'<div class="media-three">'+[1,2,3].map(n=>placeholder('图 '+n)).join('')+'</div>':media==='none'?'':placeholder(id%2?'图片':'图片')}</button><footer><span>点赞</span><span>收藏</span><span>评论</span><span>转发</span></footer></article>`;}
function community(){const sub=appState.communityScope!=='all';let posts='';const count=appState.communityVariant==='single'?1:8;if(appState.communityVariant==='empty')posts='<div class="state-block">暂无帖子</div>';else {const list=Array.from({length:count},(_,i)=>i+1).filter(i=>appState.communityFilter==='综合'||['官方','求助','攻略'][(i-1)%3]===appState.communityFilter);posts=`<div class="post-grid"><div class="post-column">${list.filter(i=>i%2).map(i=>post(i,i===3?'multi':'single')).join('')}</div>${count>1?`<div class="post-column">${list.filter(i=>!(i%2)).map(i=>post(i,i===4?'none':'single')).join('')}</div>`:''}</div>`;if(appState.communityVariant==='error')posts+=`<div class="state-block"><p>后续帖子加载失败，已显示内容保留</p>${btn('重试加载','retry-community')}</div>`;else posts+='<div class="end">没有更多帖子</div>';}
return `${sub?`<div class="circle-head"><div class="row between"><h3>Steam 游戏分区</h3><div class="row">${btn(appState.infoOpen?'收起分区介绍':'分区介绍','toggle-info')}${btn('加入分区','destination','data-title="加入分区"')}</div></div>${appState.infoOpen?'<div class="info">交流 Steam 游戏、配置心得与游玩体验。</div>':''}</div><div class="pins">置顶 ${btn('分区公告与说明','article','data-title="分区置顶公告" data-kind="置顶内容"')}</div><div class="strip">${['综合','官方','求助','攻略'].map(t=>btn(t,'community-filter',`data-value="${t}"`,appState.communityFilter===t?'selected':'')).join('')}</div>`:''}${sub&&appState.layout==='legacy'?`<div class="legacy-split"><div>${posts}</div><aside class="legacy-side"><b>分区信息</b><p>游戏讨论与玩家交流</p>${btn('收起','set-layout','data-value="proposed"')}</aside></div>`:posts}`;}
function genericPage(){const d=appState.detail;if(appState.page==='article')return `<article class="detail-copy"><h2>${esc(d.title||'内容标题')}</h2><p class="muted">玩家小林 · 2 小时前</p>${placeholder('内容图片')}<p>开始游戏前，我先调了按键与灵敏度。移动、视角和常用动作顺手以后，整个游玩过程也轻松了不少。</p><p>遇到卡点时，可以看看其他玩家的配置和经验。你习惯怎样的操作方式？欢迎一起交流。</p><div class="box">${esc(d.game||'PC 游戏 A')} ${btn('查看游戏','game',`data-game="${esc(d.game||'PC 游戏 A')}"`)}</div><div class="row wrap" style="margin-top:12px">${btn('进入分区','community-home')}${btn('返回','back')}</div></article>`;

function notes(){}

function render(preserve=false){const oldScroll=preserve?(document.querySelector('.content')?.scrollTop||0):0;document.querySelector('#page-nav').innerHTML=pages.map(([p,t])=>btn(t,'page',`data-page="${p}"`,appState.page===p?'active':'')).join('');document.querySelector('#toolbar').innerHTML=controls();document.querySelector('#center').innerHTML=`<div class="stage">${screen()}</div>`;notes();const c=document.querySelector('.content');if(c){recordingRestore=true;c.scrollTop=oldScroll;previousScroll=oldScroll;c.addEventListener('scroll',onContentScroll,{passive:true});requestAnimationFrame(()=>recordingRestore=false);}paintOverlay();}
function onContentScroll(e){const y=e.target.scrollTop;if(appState.page==='community'&&appState.mode==='landscape'&&appState.navPolicy==='scroll'&&!recordingRestore&&!appState.navCollapsed&&y>70&&y>previousScroll+2&&performance.now()-restoredAt>350){appState.navCollapsed=true;render(true);feedback('导航已收纳；可恢复导航、切分区和发布。滚动阈值仅用于线框演示。');}previousScroll=y;}
function restoreNav(){const y=document.querySelector('.content')?.scrollTop||0;appState.navCollapsed=false;restoredAt=performance.now();render(true);const c=document.querySelector('.content');if(c)c.scrollTop=y;feedback('已恢复导航，并保留当前阅读位置。');}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.id==='toggle-notes'){document.body.classList.toggle('notes-hidden');b.textContent=document.body.classList.contains('notes-hidden')?'展开说明':'收起说明';return;}if(b.dataset.note){appState.noteTab=b.dataset.note;notes();return;}const a=b.dataset.act;if(!a)return;if(operationsAction(a,b))return;switch(a){case 'page':topLevel(b.dataset.page);break;case 'go':go(b.dataset.page,{from:appState.page});break;case 'back':back();break;case 'close':case 'close-pop':closePop();break;case 'mode':appState.mode=b.dataset.value;appState.navCollapsed=false;render(true);break;case 'channel':if(['home','pc'].includes(b.dataset.page))go(b.dataset.page);else go('destination',{title:b.dataset.title,from:appState.page});break;case 'main-nav':if(['home','community','steam'].includes(b.dataset.page)){go(b.dataset.page);}else go('destination',{title:b.dataset.title,from:appState.page});break;case 'destination':go('destination',{title:b.dataset.title,from:appState.page});break;case 'game':go('game',{game:b.dataset.game,from:appState.page});break;case 'article':{const s=contentSamples.find(c=>c.id===b.dataset.id);go('article',{title:s?.title||b.dataset.title,kind:s?.type||b.dataset.kind,body:s?.body,game:s?.game,from:appState.page});break;}case 'community-home':go('community');appState.communityScope='sub';render();break;case 'filter-content':homeFilter=b.dataset.filter;render(true);break;case 'retry-content':appState.variant='normal';render(true);feedback('精选样例已恢复。');break;case 'set-playable':appState.playableMode=b.dataset.value;render();break;case 'conditions':go('conditions',{game:b.dataset.game,from:'playable'});break;case 'controller-story':go('article',{title:b.dataset.title||'游戏 A 的手柄操作体验',kind:'手柄体验',game:'PC 游戏 A',from:'controller'});break;case 'controller-commerce':go('external',{kind:'browser',title:'手柄介绍',from:appState.page,explanation:'仅演示内容到外部商品信息的关系，不新增商城、不执行真实购买。'});break;case 'calendar-event':appState.calendarDay=Number(b.dataset.day);go('calendar');break;case 'calendar-day':appState.calendarDay=Number(b.dataset.day);render(true);break;case 'scope':appState.communityScope=b.dataset.value;appState.navCollapsed=false;appState.infoOpen=false;render();break;case 'switch-scope':appState.communityScope=appState.communityScope==='all'?'sub':'all';appState.navCollapsed=false;render();break;case 'toggle-info':appState.infoOpen=!appState.infoOpen;render(true);break;case 'community-filter':appState.communityFilter=b.dataset.value;render(true);feedback('筛选：'+appState.communityFilter+'；线框保留分区头部，展示样例帖子。');break;case 'set-layout':appState.layout=b.dataset.value;render(true);break;case 'nav-demo':if(appState.navCollapsed)restoreNav();else{appState.navCollapsed=true;render(true);}break;case 'restore-nav':restoreNav();break;case 'retry-community':appState.communityVariant='normal';render(true);break;case 'preview-launch':feedback('这里承接原有启动入口；线框不执行游戏启动，也不伪造成功结果。');break;case 'coverage-go':{const c=coverage.find(x=>x.id===b.dataset.id);if(c.id==='Q01')appState.communityScope='all';else if(c.page==='community')appState.communityScope='sub';if(c.page==='community')appState.mode='landscape';go(c.page);feedback(c.id+'：'+c.title+'。'+c.demo);break;}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.act&&operationsAction(el.dataset.act,el))return;const k=el.dataset.control;if(!k)return;if(k==='recent'){appState.recent=el.value!=='none';appState.recentFolded=el.value==='folded';}else if(k==='campaign')appState.campaign=el.value==='yes';else if(k==='compact')appState.compact=el.value==='compact';else appState[k]=el.value;if(k==='navPolicy')appState.navCollapsed=false;render(k==='compact'||k==='layout');});
document.addEventListener('keydown',e=>{if(overlayData&&e.key==='Tab'){const list=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal a[href]')];if(list.length){const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}if(e.key==='Escape'||(e.key.toLowerCase()==='b'&&!/input|textarea|select/i.test(e.target.tagName))){e.preventDefault();back();}});
render();

</script></body></html>
