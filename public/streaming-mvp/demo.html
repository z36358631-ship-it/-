function settings(){const local=S.platform==='mac';if(!local)return appSettings();return `${subhead(local?'本机与连接设置':'电脑连接设置')}<div class="two-col"><div><div class="panel"><div class="row"><div class="device-icon">${icon(local?'laptop':'monitor')}</div><div><h3>${local?'这台 Mac':'我的 Windows 电脑'}</h3><small>${local?'本机被控设置':'远程访问管理'}</small></div></div><div class="settingrow"><div class="grow"><h3>允许远程连接</h3><small>${local?'开启后，已信任设备可连接这台 Mac。':'需要在这台电脑上开启；可在此停用访问。'}</small></div><button class="switch" role="switch" aria-label="允许远程连接" aria-checked="${S.targetAllow}" data-action="toggle:allow"></button></div><div class="settingrow"><div><h3>系统权限</h3><small>${S.permission?'屏幕与输入权限已准备':'录屏或辅助功能权限缺失'}</small></div>${btn('查看','permissions','soft')}</div></div><div class="notice" style="margin-top:15px">远端物理屏幕可见。需要现场防窥的工作，请使用具备对应能力的工具。</div></div><div><div class="section-label" style="margin-top:0">已信任的控制设备</div><div class="panel"><div class="row"><div class="device-icon">${icon('screen')}</div><div class="grow"><h3>我的手机</h3><small>${S.targetTrusted?'可以访问这台电脑':'访问已撤销'}</small></div></div><div style="margin-top:18px">${S.targetTrusted?btn('撤销访问','confirm-revoke','danger'):btn('重新建立信任','nav:setup','primary')}</div><small style="display:block;margin-top:12px">撤销将立即结束此设备的连接，并阻止自动重连。</small></div><p class="feedback" role="status" style="margin-top:12px">${esc(S.notice)}</p></div></div>`}
function appSettings(){return `${subhead('连接设置',S.connected?'session':'devices')}<div class="panel"><h3>会话偏好</h3><div class="settingrow"><div><h3>自动画质</h3><small>根据设备和网络调整。</small></div><select id="quality" class="field" style="width:135px"><option value="auto" ${S.quality==='auto'?'selected':''}>自动</option><option value="smooth" ${S.quality==='smooth'?'selected':''}>流畅</option><option value="clear" ${S.quality==='clear'?'selected':''}>清晰</option></select></div><div class="settingrow"><span>帧率档位</span><select id="fps" class="field" style="width:135px"><option ${S.fps==='30'?'selected':''}>30</option><option ${S.fps==='60'?'selected':''}>60</option></select></div><div class="settingrow"><div><h3>接收电脑声音</h3><small>控制当前设备播放的声音。</small></div><button class="switch" role="switch" aria-label="接收电脑声音" aria-checked="${S.sound}" data-action="toggle:sound"></button></div></div><div class="section-label">主机访问权限</div><div class="panel"><h3>在电脑端管理访问</h3><p class="intro" style="margin-top:10px">允许被控、信任设备与撤销权限，由电脑本地管理。手机不能给自己授权。</p>${btn('查看首次连接步骤','nav:setup','soft','monitor')}<small style="display:block;margin-top:13px">远端物理屏幕可见；断开连接不会关闭电脑程序。</small></div>`}

function errorData(k){return({switching:{title:'正在切换屏幕',text:'正在更新画面与输入坐标，请稍候。',ic:'monitor'},offline:{title:'电脑当前离线',text:'请确认电脑已开机、联网，且盖世正在运行。本期不支持远程开机。',ic:'power'},busy:{title:'电脑正在被其他设备控制',text:'同一时间仅允许一台设备控制。请在原设备断开，或在电脑本地结束连接后重试。',ic:'monitor'},permission:{title:'需要在电脑补充权限',text:'屏幕采集或输入控制权限尚未准备。请在电脑端完成授权，再重新连接。',ic:'shield'},reconnecting:{title:'网络中断，正在恢复',text:'已暂停输入并释放按键。恢复画面与授权后才接收新操作。',ic:'wifi'},failed:{title:'连接未恢复',text:'恢复窗口已结束，远端程序仍在运行。你可以重新连接或返回设备列表。',ic:'warning'},revoked:{title:'访问已取消',text:'主机已撤销当前设备的访问。连接立即结束，需重新获得授权。',ic:'lock'}})[k]||{title:'暂时无法连接',text:'请检查设备状态后重试。',ic:'warning'}}

function fault(k){if(!k)return;S.lastAction='';S.pressCount=0;S.files.forEach(f=>{if(['running','checking'].includes(f.status))f.status='failed'});if(k==='reconnecting'){S.page='session';S.connected=true;S.sessionStatus='reconnecting';S.restoreRemaining=30;const token=Date.now();S.restoreToken=token;function tick(){if(S.restoreToken!==token||S.sessionStatus!=='reconnecting')return;S.restoreRemaining--;if(S.restoreRemaining<=0)S.sessionStatus='failed';render();if(S.sessionStatus==='reconnecting')later(tick,1000)}later(tick,1000)}else{S.error=k;S.page='error';S.connected=false;if(k==='revoked')S.targetTrusted=false}updateURL();render()}
function startFile(direction,name,reuse){if(S.files.some(f=>['running','checking'].includes(f.status))){S.modal='';S.notice='请先等待当前传输完成，或取消当前任务。';render();return}const f=reuse||{id:++S.transferId,name:name||'需求说明.txt',size:(name||'').endsWith('.png')?'2.4 MB':'12 KB',direction};f.progress=0;f.status='running';if(!reuse)S.files.unshift(f);S.modal='';S.page='files';S.notice='';updateURL();render();function tick(){if(f.status!=='running')return;f.progress=Math.min(100,f.progress+20);if(f.progress===100){f.status='checking';render();later(()=>{if(f.status==='checking'){f.status='done';render()}},650)}else{render();later(tick,450)}}later(tick,450)}
function act(a){const [key,val]=a.split(':');if(key==='nav'){nav(val);return}if(key==='connect'){connect(val);return}if(key==='fault'){fault(val);return}if(key==='host'){S.hostOs=val;S.setupStep=0;S.notice='';render();return}if(key==='manage'){S.device=val;nav('settings');return}if(key==='setup'){if(val==='login'){S.setupStep=Math.max(1,S.setupStep);S.notice='已确认电脑与控制端使用同一账号。'}if(val==='permission'){if(S.setupStep<1){S.notice='请先确认电脑已经登录。'}else{S.setupStep=Math.max(2,S.setupStep);S.permission=true;S.targetAllow=true;S.notice='主机权限准备完成（演示状态）。'}}if(val==='trust'){if(S.setupStep<2){S.notice='请先完成主机权限检查。'}else{S.authPending=true;S.notice='\u8bf7\u6c42\u5df2\u53d1\u9001\uff0c\u8bf7\u5728\u7535\u8111\u7aef\u786e\u8ba4\u3002'}}render();return}if(key==='toggle'){if(val==='allow'&&S.targetAllow){S.targetAllow=false;S.connected=false;S.sessionStatus='revoked';S.notice='已停用远程访问，当前连接已结束。'}else if(val==='allow'){if(S.platform!=='mac'){S.notice='请在这台电脑上开启允许远程连接。';render();return}S.targetAllow=true;S.notice='这台 Mac 已允许已信任设备连接。'}else S[val]=!S[val];render();return}if(key==='tool'){S.tool=S.tool===val?'':val;render();return}if(key==='remote'){if(!canInput())return;S.remoteApp=val;S.lastAction='';S.tool='';render();return}if(key==='mode'){if(!canInput())return;S.mode=val;S.pressCount=0;render();return}if(key==='screen'){if(!canInput())return;S.sessionStatus='switching';S.screen=Number(val);S.pressCount=0;S.tool='';render();later(()=>{if(S.sessionStatus==='switching'){S.sessionStatus='active';S.lastAction='已切换屏幕，输入坐标已更新。';render()}},350);return}if(key==='zoom'){S.zoom=val==='reset'?100:Math.min(175,S.zoom+25);render();return}if(key==='game'){if(!canInput())return;S.pressCount++;S.lastAction='已发送游戏按键 '+val;render();return}if(key==='file'){if(!S.connected){S.notice='请先连接在线电脑，再传输文件。';render();return}if(S.sessionStatus!=='active'){S.notice='连接未恢复，暂不能传输文件。';render();return}S.modal=val;render();return}if(key==='start-file'){startFile(val,$('#file-choice').value);return}if(key==='cancel'){const f=S.files.find(f=>f.id===Number(val));if(f)f.status='cancelled';render();return}if(key==='retryfile'){if(!S.connected||S.sessionStatus!=='active'){S.notice='请先恢复连接，再重新传输。';render();return}const f=S.files.find(f=>f.id===Number(val));startFile(f.direction,f.name,f);return}if(key==='location'){const f=S.files.find(f=>f.id===Number(val));S.notice=`${f.direction==='upload'?'远端电脑':'本机'} / 下载 / GameHub / ${f.name.replace(/(\.[^.]+)$/,' (1)$1')}。示例路径，不会打开真实磁盘。`;S.modal='location';render();return}
switch(a){case'sidebar':S.expanded=!S.expanded;break;case'outside':S.modal='outside';break;case'permissions':S.modal='permissions';break;case'grant-permission':S.permission=true;S.modal='';S.notice='系统权限已标记为准备完成。';break;case'confirm-revoke':S.modal='revoke';break;case'revoke':S.targetTrusted=false;S.connected=false;S.sessionStatus='revoked';S.modal='';S.notice='已撤销访问；远端程序继续运行。';break;case'confirm-disconnect':S.files.forEach(f=>{if(['running','checking'].includes(f.status))f.status='cancelled'});S.modal='';act('disconnect');return;case'close-modal':S.modal='';break;case'disconnect':if(S.files.some(f=>['running','checking'].includes(f.status))){S.modal='disconnect';render();return}S.connected=false;S.sessionStatus='active';S.restoreToken=0;S.draft='';S.pressCount=0;S.files.forEach(f=>{if(['running','checking'].includes(f.status))f.status='failed'});S.page='devices';S.tool='';S.notice='已断开，电脑上的程序继续运行。';updateURL();break;case'retry':if(S.error==='offline'&&S.page==='error'){S.notice='电脑仍离线，请先在电脑端开机联网。';break}if(S.error==='busy'&&S.page==='error'){S.notice='原设备仍在控制，请先结束原连接。';break}connect(S.device);return;case'paste-text':if(!canInput())return;if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(t=>{S.draft+=t;S.lastAction='已粘贴纯文本到编辑区，尚未发送。';render()}).catch(()=>{S.lastAction='未获得剪贴板权限，请手动粘贴到输入框。';render()})}else{S.lastAction='请在输入框使用系统粘贴；当前浏览器未提供剪贴板读取。'}break;case'insert-newline':S.draft+='\n';break;case'send-text':if(!canInput()||S.composing)return;if(S.draft.length>10000){S.lastAction='最多输入10000个字符，请拆分后发送；草稿已保留。';break}if(!S.draft.trim()){S.lastAction='请先输入文字。';break}if(S.remoteApp==='doc'){S.docText+=S.draft;S.docSaved=false}else if(S.remoteApp==='ai'){S.aiText=S.draft;S.aiReply='文字已输入，尚未提交。请使用原窗口操作或发送 Enter。';S.aiConfirmed=false}else S.lastAction='文字已输入到游戏窗口。';S.draft='';S.lastAction='文字已输入，未附加 Enter。';break;case'send-enter':if(!canInput())return;if(S.remoteApp==='ai'){S.aiReply='已接收补充要求，将继续处理原任务。';S.lastAction='已向原 AI 窗口发送一次 Enter。'}else{S.docText+='\n';S.docSaved=false;S.lastAction='已向远端发送一次 Enter。'}break;case'save-doc':if(!canInput())return;S.docSaved=true;S.lastAction='已保存到远端电脑。';break;case'ai-confirm':if(!canInput())return;S.aiConfirmed=true;S.aiReply='已确认，正在继续当前文件的处理。';break}

Object.assign(S,{localAllow:true,localTrusted:true,localPermission:true,localIncomingSession:{controller:'我的手机'},localRequest:null,volume:70,remoteCopiedText:'',authOrigin:null});
const initialSettings=settings,initialAct=act,initialRender=render,initialToolpanel=toolpanel,initialFault=fault;
settings=function(){if(S.platform!=='mac')return appSettings();return `${subhead('这台 Mac · 本机连接设置')}<div class="two-col"><div class="panel"><div class="row"><div class="device-icon">${icon('laptop')}</div><div><h3>这台 Mac</h3><small>管理其他设备对本机的访问</small></div></div><div class="settingrow"><div><h3>允许远程连接</h3><small>关闭仅结束别人对这台 Mac 的控制。</small></div><button class="switch" role="switch" aria-label="允许远程连接" aria-checked="${S.localAllow}" data-action="local-toggle"></button></div><div class="settingrow"><div><h3>系统权限</h3><small>${S.localPermission?'屏幕与输入权限已准备':'需要在 macOS 设置中授权'}</small></div>${btn('查看','local-permissions','soft')}</div><div class="settingrow"><div><h3>当前控制设备</h3><small>${S.localIncomingSession?esc(S.localIncomingSession.controller)+'正在控制本机':'没有设备正在控制'}</small></div>${S.localIncomingSession?btn('停止控制','local-stop','danger'):''}</div><small>本机屏幕可见。停止控制不会关闭本机程序，也不影响你连接另一台电脑。</small></div><div class="stack"><div class="panel"><h3>首次连接请求</h3>${S.localRequest?`<p class="intro" style="margin-top:12px">${esc(S.localRequest.name)} 请求控制这台 Mac。</p><small>请确认是你自己的设备。请求有效期 2 分钟。</small><div class="row" style="margin-top:15px">${btn('拒绝','local-reject','soft')}${btn('允许并信任','local-accept','primary')}</div>`:'<p class="intro" style="margin-top:12px">暂无待确认请求。</p>'}</div><div class="panel"><h3>已信任设备</h3><div class="settingrow"><div><h3>我的手机</h3><small>${S.localTrusted?'可访问本机':'信任已撤销'}</small></div>${S.localTrusted?btn('撤销访问','local-confirm-revoke','danger'):''}</div></div><p class="feedback" role="status">${esc(S.notice)}</p></div></div>`};
const initialModal=modal;
modal=function(){if(S.modal==='target-info'){return `<div class="modal-shade"><section class="dialog" role="dialog" aria-modal="true" aria-label="目标电脑状态"><h2>${S.managedTarget==='mac'?'我的 Mac':'我的 Windows 电脑'}</h2><p>这是远端电脑的只读状态。允许连接与可信设备需要在该电脑本地管理。</p><p style="margin-top:12px">${S.managedTarget==='mac'?'离线 · 请保持电脑开机联网':'在线 · '+(S.targetTrusted?'当前控制端已获授权':'当前控制端需要授权')}</p><div class="row">${btn('关闭','close-modal','soft')}${btn('查看设置步骤','target-setup','primary')}</div></section></div>`}if(S.modal==='local-revoke'){return `<div class="modal-shade"><section class="dialog" role="dialog" aria-modal="true" aria-label="撤销本机访问"><h2>撤销手机对本机的访问？</h2><p>立即停止它对这台 Mac 的控制。不会结束你与另一台电脑的连接。</p><div class="row">${btn('取消','close-modal','soft')}${btn('撤销本机访问','local-revoke','danger')}</div></section></div>`}if(S.modal==='local-permissions'){return `<div class="modal-shade"><section class="dialog" role="dialog" aria-modal="true" aria-label="本机系统权限"><h2>本机系统权限</h2><p>屏幕录制、系统音频与辅助功能需在这台 Mac 的系统设置中开启。</p><div class="row">${btn('关闭','close-modal','soft')}${btn('已在系统完成授权','local-grant','primary')}</div></section></div>`}return initialModal()};
function volumeControl(){return `<div class="settingrow"><label for="volume-level">播放音量 <output id="volume-value">${S.volume}</output></label><input id="volume-level" type="range" min="0" max="100" value="${S.volume}" aria-label="播放音量" style="min-height:44px;width:170px;accent-color:#39aee8"></div>`}
toolpanel=function(){let h=initialToolpanel();if(S.tool==='quality')h=h.replace('<small>档位',volumeControl()+'<small>档位');if(S.tool==='keyboard')h=h.replace('<div class="feedback"',`${btn('复制远端文本到本地','copy-remote','soft','copy')}<small style="display:block;margin-top:8px">演示复制当前文档或 AI 输出的纯文本。</small><div class="feedback"`);return h};
render=function(){initialRender();if(S.page==='settings'&&S.platform!=='mac'){const panel=$('.content .panel');if(panel)panel.insertAdjacentHTML('beforeend',volumeControl())}const v=$('#volume-level');if(v)v.addEventListener('input',e=>{S.volume=Number(e.target.value);$('#volume-value').textContent=S.volume});};
function invalidateTarget(reason){S.connected=false;S.sessionStatus=reason;S.targetTrusted=reason==='revoked'?false:S.targetTrusted;S.restoreToken=0;S.draft='';S.composing=false;S.pressCount=0;S.lastAction='';S.tool='';S.files.forEach(f=>{if(['running','checking'].includes(f.status)){f.status='failed';f.failureReason=reason}})}
fault=function(k){if(k==='revoked')invalidateTarget('revoked');initialFault(k)};
act=function(a){
 if(a.startsWith('manage:')){S.managedTarget=a.split(':')[1];S.modal='target-info';render();return}
 if(a==='target-setup'){S.hostOs=S.managedTarget;S.modal='';nav('setup');return}
 if(a==='nav:settings'&&S.page==='session'){S.tool='quality';render();return}
 if(a==='toggle:allow')a='local-toggle';
 if(a.startsWith('local-')){if(S.platform!=='mac')return;switch(a){
  case'local-toggle':S.localAllow=!S.localAllow;if(!S.localAllow){S.localIncomingSession=null;S.localRequest=null}S.notice=S.localAllow?'已允许可信设备访问这台 Mac。':'本机远控已关闭；你对其他电脑的连接不受影响。';break;
  case'local-stop':S.localIncomingSession=null;S.notice='已停止手机对这台 Mac 的控制。';break;
  case'local-accept':if(!S.localRequest||!S.localAllow)return;S.localTrustedDevices=S.localTrustedDevices||['我的手机'];if(!S.localTrustedDevices.includes(S.localRequest.name))S.localTrustedDevices.push(S.localRequest.name);if(S.localRequest.fromSetup&&S.authOrigin?.host==='mac'){S.targetTrusted=true;S.targetAllow=true;S.setupStep=3;S.authPending=false}S.localRequest=null;S.notice=S.localIncomingSession?'已信任新手机；原控制设备继续使用，新手机需等待当前连接结束。':'已信任新手机，它可以重新发起连接。';break;
  case'local-reject':if(!S.localRequest)return;if(S.localRequest.fromSetup){S.authPending=false;S.authResult='denied'}S.localRequest=null;S.notice='已拒绝此次请求，未建立信任。';break;
  case'local-confirm-revoke':S.modal='local-revoke';break;
  case'local-revoke':S.localTrusted=false;S.localIncomingSession=null;S.modal='';S.notice='已撤销手机访问本机的权限。';break;
  case'local-permissions':S.modal='local-permissions';break;
  case'local-grant':S.localPermission=true;S.modal='';break;
 }render();return}
 if(a==='setup:trust'&&S.setupStep>=2){S.authPending=true;S.authResult='pending';S.authOrigin={platform:S.platform,host:S.hostOs};S.notice='请求已发送，请在目标电脑本地确认。有效期 2 分钟。';render();return}
 if(a==='revoke'){invalidateTarget('revoked');S.modal='';S.error='revoked';nav('error');return}
 if(a==='insert-newline'){if(!canInput())return;S.draft+=String.fromCharCode(10);render();return}
 if(a==='send-text'){if(!canInput()||S.composing)return;if(S.draft.length<1||S.draft.length>10000){S.lastAction='请输入 1—10000 个字符；现有草稿已保留。';render();return}if(S.remoteApp==='doc'){S.docText+=S.draft;S.docSaved=false}else if(S.remoteApp==='ai'){S.aiText=S.draft;S.aiReply='文字已输入，尚未提交。';S.aiConfirmed=false}S.draft='';S.lastAction='文字已输入，未附加换行或 Enter。';render();return}
 if(a==='copy-remote'){if(!canInput())return;const text=S.remoteApp==='ai'?S.aiReply:S.remoteApp==='doc'?S.docText:'';if(!text){S.lastAction='当前窗口没有可复制的示例文本。';render();return}S.remoteCopiedText=text;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>{S.lastAction='已将远端纯文本复制到本地剪贴板。';render()}).catch(()=>{S.draft=text;S.lastAction='未获得剪贴板权限；文本已放入编辑区，可手动复制。';render()})}else{S.draft=text;S.lastAction='文本已放入编辑区，可手动复制。';render()}return}
 initialAct(a);
};
const hostModal=modal;
modal=function(){if(S.modal==='win-host-request')return `<div class="modal-shade"><section class="dialog" role="dialog" aria-modal="true" aria-label="Windows主机本地确认"><div class="eyebrow">目标 Windows 电脑 · 本地确认视图</div><h2>我的手机请求连接</h2><p>请确认是你自己的设备。允许后，该设备可访问这台 Windows 电脑；请求有效期 2 分钟。</p><div class="row">${btn('拒绝请求','target-reject','soft')}${btn('允许并信任此设备','target-accept','primary')}</div></section></div>`;return hostModal()};
const hostAct=act;
act=function(a){if(a==='target-accept'||a==='target-reject'){if(S.modal!=='win-host-request'||!S.authPending)return;S.authPending=false;S.authResult=a==='target-accept'?'approved':'denied';if(a==='target-accept'){S.targetTrusted=true;S.targetAllow=true;S.setupStep=3}S.modal='';S.notice=a==='target-accept'?'Windows 主机已允许并信任当前控制设备。':'Windows 主机拒绝了此次请求。请确认设备后重新发起。';render();return}hostAct(a)};
// Review controls inject requests, while acceptance remains on a host-local view.
$('#host-approve').textContent='模拟请求到达主机';
$('#host-approve').addEventListener('click',()=>{if(S.authPending&&S.authOrigin?.host==='win'){S.modal='win-host-request';render();return}S.localRequest={name:'新手机',fromSetup:S.authPending};S.platform='mac';S.page='settings';S.notice='请在本机请求卡片选择允许或拒绝。';updateURL();render()});
const basicRemoteWindow=remoteWindow;
remoteWindow=function(){if(S.remoteApp!=='game')return basicRemoteWindow();return `<div class="remote-window"><div class="windowtitle">${icon('game')}远端游戏窗口<span class="wincontrols">− □ ×</span></div><div class="gameview full-controller"><div class="game-copy"><b>森林漫游</b><small>示例游戏画面 · 基础手柄操控</small></div><i class="player" style="transform:translateX(${(S.pressCount%7-3)*12}px)"></i>${S.mode==='game'?`<div class="shoulders">${btn('LB','game:LB')}${btn('Start','game:Start')}${btn('RB','game:RB')}</div><div class="controller-bottom"><div class="stick-pair"><button class="stick" data-action="game:LS" aria-label="左摇杆">L<span></span></button><button class="stick" data-action="game:RS" aria-label="右摇杆">R<span></span></button></div><div class="abxy">${['Y','X','B','A'].map(t=>btn(t,'game:'+t)).join('')}</div></div>`:''}</div></div>`};
const previousSettings=settings;
settings=function(){let html=previousSettings();if(S.platform==='mac'&&S.localTrustedDevices?.includes('新手机'))html=html.replace('<h3>已信任设备</h3>','<h3>已信任设备</h3><div class="settingrow"><div><h3>新手机</h3><small>已信任 · 连接时仍检查占用</small></div></div>');return html};
const finishingStyle=document.createElement('style');finishingStyle.textContent='.app .toolpanel{max-height:365px}.app .toolpanel .composer{min-height:60px;height:60px}.app .toolpanel .editorhint{font-size:10px;line-height:1.5}.app .toolpanel h3{margin-bottom:3px}.app .toolpanel{padding:10px 14px}.app .toolpanel [data-action="copy-remote"]{margin-top:7px;min-height:44px}.full-controller .game-copy{margin-top:0}.shoulders{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between}.shoulders button{min-width:50px;min-height:44px;background:#10212c99;border-color:#ffffff30}.controller-bottom{position:absolute;bottom:12px;left:14px;right:14px;display:flex;align-items:end;justify-content:space-between}.stick-pair{display:flex;gap:17px;align-items:end}.stick{width:68px;height:68px;min-height:68px;border-radius:50%;background:#10212c99;position:relative;color:#b1c6d1;font-size:11px;align-items:flex-start;padding:6px}.stick span{position:absolute;width:30px;height:30px;border-radius:50%;background:#8ca6b350;left:18px;top:25px;border:1px solid #c9e2ed50}.abxy{display:grid;grid-template-columns:44px 44px;gap:5px}.abxy button{padding:5px;min-width:44px;min-height:44px;border-radius:50%;background:#10212caa;border-color:#ffffff30}.app .gameview.full-controller{min-height:260px}.app .stick-pair{gap:8px}.app .stick{width:60px;height:60px;min-height:60px}.app .stick span{left:14px;top:22px}.app .full-controller .game-copy b{font-size:19px}.landscape .gameview.full-controller{min-height:230px}.landscape .controller-bottom{bottom:12px}.full-controller .player{bottom:42%}';document.head.appendChild(finishingStyle);
window.demo={action:act,navigate:nav,injectFault:fault,connect,getState:window.getState};render();
</script></body></html>
