const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.monitor}"/></svg>`;
const btn=(label,action,cls='',ic='')=>`<button type="button" class="${cls}" data-action="${action}">${ic?icon(ic):''}${label}</button>`;

let s={platform:params.get('platform')||DEFAULT_PLATFORM,page:'list',device:'win',review:false,compare:false,modal:'',panel:'',view:false,sound:true,mapping:false,pointer:'鼠标指针',fps:'60',quality:'自动',resolution:'1920 × 1080',scale:'100%',rotation:'横向',keyboard:'输入法',files:[],toast:'',menu:false,filter:'全部设备',empty:false,error:'',desktop:false,collapsed:{},source:'',doc:'项目讨论记录\n\n在远程电脑上继续编辑文档，或使用已经安装的软件。\n\n这里是可操作的界面模拟，不会连接真实电脑。'};

 let top=head('可控设备',false,btn('全部设备','all','ghost'));
 if(s.loading)return top+'<main class="content">'+blank('正在加载设备','正在获取当前账号的设备列表…')+'</main>';
 if(s.error)return top+'<main class="content">'+blank('无法加载设备','请检查网络后重试。','retry','重新加载')+'</main>';

 const group=online=>{let ds=devices.filter(d=>d.online===online&&(s.filter==='全部设备'||d.os===s.filter));return '<section><button class="group-title ghost" data-action="collapse:'+online+'">'+(s.collapsed[online]?'▸':'▾')+' '+(online?'在线':'离线')+'设备（'+ds.length+'）</button>'+(s.collapsed[online]?'':ds.map(d=>'<button class="device-row '+(!d.online?'off':'')+'" data-action="device:'+d.id+'"><span class="device-cover '+(d.os==='macOS'?'mac':d.os==='Android'?'phone':'')+'">'+icon(d.os==='macOS'?'laptop':'monitor')+badge(d)+'</span><span class="grow"><strong class="device-name">'+d.name+'</strong><small>'+d.os+(d.busy?' · 1 台设备正在控制':'')+'</small></span><span class="arrow">›</span></button>').join(''))+'</section>';};

function sampleFile(kind='running',paused=false){return {id:Date.now()+Math.random(),name:'项目说明.txt',size:'84 B',kind,progress:kind==='running'?36:100,paused};}
function applyState(id){clearTimeout(connectTimer);devices=structuredClone(initialDevices);Object.assign(s,{page:'list',device:'win',modal:'',panel:'',view:false,mapping:false,empty:false,loading:false,error:'',menu:false,source:id,toast:'',expanded:false,files:[],review:false,desktop:false});
 if(id==='loading')s.loading=true;else if(id==='empty')s.empty=true;else if(id==='load-error')s.error='network';else if(['detail','busy','takeover','offline','blocked'].includes(id)){s.page='detail';if(['busy','takeover'].includes(id)){s.device='work';s.expanded=true;}if(id==='takeover')s.modal='takeover';if(id==='offline')s.device='off';if(id==='blocked')s.device='mac';}
 else if(['session','operation','display','keyboard','shortcuts','computer-keyboard','view','mapping','connecting','failed','ended','exit'].includes(id)){s.page='session';if(['operation','display','keyboard','mapping'].includes(id))s.panel=id;if(id==='mapping')s.mapping=true;if(id==='view')s.view=true;if(id==='shortcuts'||id==='computer-keyboard'){s.panel='keyboard';s.keyboard=id==='shortcuts'?'快捷键':'电脑键盘';}if(id==='keyboard')s.keyboard='输入法';if(id==='connecting')s.modal='connecting';if(id==='failed')s.modal='connection-error';if(id==='ended'){s.page='ended';}if(id==='exit')s.modal='exit';}
 else if(['files','transferring','paused','file-failed','done','conflict','clear','file-offline'].includes(id)){s.page='files';if(id==='file-offline')s.device='off';if(id==='transferring'||id==='paused')s.files=[sampleFile('running',id==='paused')];if(id==='file-failed')s.files=[{...sampleFile(),failed:true,paused:true}];if(id==='done'||id==='clear')s.files=[sampleFile('sent'),sampleFile('received')];if(id==='clear'){s.clearKind='sent';s.modal='clear-records';}if(id==='conflict'){s.pick='file';s.modal='conflict';}}
 else if(['all','properties','quicklaunch','more','terminal','assist','entry'].includes(id))s.page=id;render();}
function action(a){const [k,v,w]=a.split(':');s.source='';if(k==='state'){applyState(v);return;}if(k==='review'){s.review=!s.review;render();return;}if(k==='compare'){s.compare=!s.compare;s.review=false;render();return;}if(k==='device'){s.device=v;s.page='detail';s.menu=false;}
 else if(['list','all','detail','more','properties','quicklaunch','terminal','assist','mine','entry'].includes(k)){s.page=k;s.modal='';s.menu=false;}
 else if(k==='back'){s.modal='';s.menu=false;s.page=['all','detail','assist','mine','entry'].includes(s.page)?'list':'detail';}
 else if(k==='collapse')s.collapsed[v]=!s.collapsed[v];else if(k==='filter')s.modal='filter';else if(k==='filter-set'){s.filter=v;s.modal='';}
 else if(k==='retry'){s.error='';s.empty=false;}else if(k==='menu')s.menu=!s.menu;else if(k==='expand-controllers')s.expanded=!s.expanded;
 else if(k==='connect'||k==='watch'){requestConnection(k==='watch'?'view':'control');return;}
 else if(k==='takeover-confirm'){device().busy=false;s.modal='';if(s.pending==='file'){s.modal='picker';}else {startConnection(s.pending||'control');return;}}
 else if(k==='disconnect-all')s.modal='disconnect';else if(k==='disconnect-confirm'){device().busy=false;s.modal='';}
 else if(k==='open-files'){s.page='files';s.modal='';}
 else if(k==='cancel'){clearTimeout(connectTimer);if(s.modal==='connecting')s.page='detail';s.modal='';}
 else if(k==='panel')s.panel=s.panel===v?'':v;else if(k==='panel-close')s.panel='';else if(k==='toggle'){s[v]=!s[v];}
 else if(k==='set')s[v]=w;else if(k==='rotate')s.platform=s.platform==='app'?'landscape':s.platform==='landscape'?'app':'mac';
 else if(k==='toggle-view'){s.view=!s.view;}else if(k==='exit')s.modal='exit';else if(k==='exit-confirm'){s.page='detail';s.modal='';s.panel='';}
 else if(k==='desktop')s.desktop=!s.desktop;else if(k==='windows'){s.desktop=false;s.panel='';}
 else if(k==='key'){if(s.view){toast('当前为仅观看模式');return;}if(v==='Win+D')s.desktop=!s.desktop;else if(v==='Esc')s.panel='';else if(v==='Enter')s.doc+='\n';else if(v==='Backspace')s.doc=s.doc.slice(0,-1);else if(v.length===1)s.doc+=v;}
 else if(k==='file-pick'){if(!device().online){toast('设备已离线，无法操作');return;}s.pick=v;s.pending='file';s.modal=device().busy?'takeover':'picker';}
 else if(k==='file-selected'){s.files.push({...sampleFile(),name:s.pick==='media'?'示例图片.png':'项目说明.txt',size:s.pick==='media'?'11 KB':'84 B',direction:s.pick});s.modal='';}
 else if(k==='file-pause'){let f=s.files.find(f=>f.id===Number(v));if(f){f.paused=!f.paused;f.failed=false;}}
 else if(k==='file-cancel')s.files=s.files.filter(f=>f.id!==Number(v));
 else if(k==='file-manage'){s.clearKind=v;s.modal=v==='running'?'file-manage':'clear-records';}
 else if(k==='clear-confirm'){s.files=s.files.filter(f=>f.kind!==s.clearKind);s.modal='';}
 else if(k==='pause-all'||k==='resume-all'){s.files.filter(f=>f.kind==='running').forEach(f=>f.paused=k==='pause-all');s.modal='';}
 else if(k==='cancel-all'){s.files=s.files.filter(f=>f.kind!=='running');s.modal='';}
 else if(k==='file-skip')s.modal='';else if(k==='file-keep'){s.files.push({...sampleFile(),name:'项目说明 (1).txt'});s.modal='';}
 else if(k==='rename'){s.modal='rename';s.menu=false;}else if(k==='rename-save'){let name=$('#rename-value').value.trim();if(name)device().name=name;s.modal='';}
 else if(k==='rename-terminal')s.modal='terminal-rename';else if(k==='terminal-save'){s.terminalName=$('#terminal-value').value.trim()||'会话 1';s.modal='';}
 else if(k==='new-terminal'){s.terminalName='会话 2';}else if(k==='end-terminal')s.modal='end-terminal';else if(k==='terminal-end-confirm'){s.page='detail';s.modal='';}
 else if(['source-only','apps-permission','screen-select','reorder'].includes(k))s.modal=k;
 else if(['mapping-layout','terminal-keyboard'].includes(k))s.modal='source-only';
 render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action);});
document.addEventListener('change',e=>{if(e.target.id==='platform'){s.platform=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.matches('.doc'))s.doc=e.target.value;if(e.target.id==='remote-input'){if(!s.view&&!e.isComposing){s.doc=e.target.value;const doc=$('.doc');if(doc)doc.value=s.doc;}}if(e.target.id==='assist-id')$('#app [data-action="source-only"]').disabled=!e.target.value.trim();});
setInterval(()=>{let changed=false;for(const f of s.files){if(f.kind==='running'&&!f.paused){f.progress=Math.min(100,f.progress+8);if(f.progress===100)f.kind=f.direction==='download'?'received':'sent';changed=true;}}if(changed&&s.page==='files'&&!s.modal)render();},1600);
document.addEventListener('compositionend',e=>{if(e.target.id==='remote-input'&&!s.view){s.doc=e.target.value;const doc=$('.doc');if(doc)doc.value=s.doc;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){s.modal='';s.review=false;s.panel='';render();}});
if(params.get('state'))applyState(params.get('state'));else if(params.get('page')==='session')applyState('session');else render();
</script></body></html>
