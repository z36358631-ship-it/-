function floatingMouse(){if(s.platform==='mac'||s.view)return '';const p=s.mousePos||{x:.86,y:.70};return '<div class="floating-mouse '+(s.mouseOpen?'expanded':'')+'" style="left:'+p.x*100+'%;top:'+p.y*100+'%" aria-label="悬浮鼠标" '+(s.mouseOpen?'':'data-action="mouse-open"')+'>'+(s.mouseOpen?'<div class="mouse-grip" aria-label="拖动鼠标">⠿</div>'+ib('收起鼠标','mouse-close','close')+'<div class="mouse-buttons">'+btn('左键','mouse-left')+btn('右键','mouse-right')+'</div><div class="mouse-wheel">'+btn('▴','mouse-scroll:up')+btn('▾','mouse-scroll:down')+'</div><div class="mouse-bottom">鼠标</div>':'<button data-action="mouse-open" aria-label="展开悬浮鼠标">'+mouseSvg+'</button>')+'</div>'+(s.mouseMenu?'<div class="mouse-context">'+btn('全选文字','mouse-select')+btn('关闭','mouse-menu-close')+'</div>':'');}
function controlAction(a){const [k,v]=a.split(':');
 if(['quicklaunch','terminal','open-files','apps-permission'].includes(k)){
  if(!device().online||device().blocked){toast(!device().online?'设备已离线，无法操作':'该设备不允许被控');return true;}
  if(device().busy){s.pendingAction=a;s.modal='takeover';render();return true;}
 }
 if(k==='more'&&device().online&&device().busy){s.pendingAction=a;s.modal='takeover';render();return true;}
 if(k==='power'||k==='power-start'){const kind=k==='power'?v:s.powerKind;if(kind!=='boot'&&(!device().online||device().blocked)){toast(!device().online?'设备已离线，无法发送操作':'该设备不允许远程操作');return true;}if(device().busy){s.pendingAction=a;s.modal='takeover';render();return true;}}
 if(k==='mouse-open'||k==='mouse-close'){s.mouseOpen=k==='mouse-open';render();clampMouse();return true;}
 if(k==='ime-numbers'){s.numbers=!s.numbers;render();return true;}
 if(k==='ime-shift'){s.shift=!s.shift;render();return true;}
 if(k==='window'){if(s.view){toast('仅观看模式不能切换电脑窗口');return true;}s.activeWindow=v;s.desktop=false;s.panel='';render();return true;}
 if(k==='office-desktop'){s.desktop=true;s.panel='';render();return true;}
 if(k==='write-draft'){if(s.view)return true;writeRemote(remoteText()+(s.textDraft||''));s.textDraft='';s.desktop=false;s.panel='';render();return true;}
 if(k.startsWith('mouse-')){if(s.view)return true;const doc=$('.doc');if(k==='mouse-left')doc?.focus();if(k==='mouse-right'){s.mouseMenu=!s.mouseMenu;render();}if(k==='mouse-scroll')doc?.scrollBy(0,v==='up'?-80:80);if(k==='mouse-select'){s.mouseMenu=false;render();$('.doc')?.select();}if(k==='mouse-menu-close'){s.mouseMenu=false;render();}return true;}
 return false;
}
function clampMouse(){const m=$('.floating-mouse'),c=$('.remote-canvas');if(!m||!c)return;const p=s.mousePos||{x:.86,y:.70};const x=Math.max(m.offsetWidth/2+22,Math.min(c.clientWidth-m.offsetWidth/2+(s.mouseOpen?54:12),p.x*c.clientWidth)),y=Math.max(m.offsetHeight/2+22,Math.min(c.clientHeight-m.offsetHeight/2+(s.mouseOpen?54:12),p.y*c.clientHeight));m.style.left=x+'px';m.style.top=y+'px';}
let mouseDrag=null,ignoreMouseClick=false;
document.addEventListener('pointerdown',e=>{const m=e.target.closest('.floating-mouse');if(!m||(!e.target.closest('.mouse-grip')&&s.mouseOpen))return;const c=$('.remote-canvas').getBoundingClientRect();mouseDrag={id:e.pointerId,startX:e.clientX,startY:e.clientY,c,m};m.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!mouseDrag)return;const d=mouseDrag;if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<5&&!ignoreMouseClick)return;ignoreMouseClick=true;s.mousePos={x:Math.max(0,Math.min(1.18,(e.clientX-d.c.left)/d.c.width)),y:Math.max(0,Math.min(1.18,(e.clientY-d.c.top)/d.c.height))};clampMouse();});
document.addEventListener('pointerup',()=>{mouseDrag=null;setTimeout(()=>ignoreMouseClick=false,0);});
document.addEventListener('click',e=>{if(ignoreMouseClick&&e.target.closest('.floating-mouse')){e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('input',e=>{if(e.target.id==='office-draft')s.textDraft=e.target.value;});

function sourcePanel(){if(['home','entry','library','profile','remote-settings'].includes(s.page)||s.modal==='onboarding')return '<aside class="source"><div class="row spread"><h2>盖世整合设计</h2>'+ib('关闭对照','compare','close')+'</div><p>盖世 6.3.0 的导航与结构保持，主入口建议在游戏库增加远程电脑卡，我的设备增加电脑入口。右下角可比较推荐旁边的备选。设置右上收口、双路径引导及仅 Mac 显示 APP 二维码，依据本轮需求调整。</p><p style="margin-top:16px">这些是盖世产品设计，不标作 UU 原有界面。</p></aside>';const x=sourceMap[sourceKey()];return '<aside class="source"><div class="row spread"><h2>UU 实机对照</h2>'+ib('关闭对照','compare','close')+'</div><p class="proof-note">'+x[1]+' · 已脱敏</p><img src="assets/'+x[0]+'" alt="'+x[1]+'原始界面脱敏截图"><p>'+x[2]+'</p><small style="margin-top:15px">右侧为 UU Android 证据；左侧为盖世风格的可操作复刻。文字、账号、桌面内容经过脱敏。Mac 和横屏为布局适配，不宣称原生 Mac 像素级复刻。</small></aside>';}
function review(){return '<aside class="review"><div class="row spread"><h2>状态</h2>'+ib('关闭状态面板','review','close')+'</div><p>先选使用场景，Demo 会保留对应的入口和操作重点。</p><div class="mode-switch">'+['normal','game','office'].map((id,i)=>btn(['普通模式','游戏模式','AI办公模式'][i],'mode:'+id,s.mode===id?'active':'')).join('')+'</div><p class="mode-note">'+({normal:'完整远程控制与文件操作。',game:'优先显示桌面、悬浮鼠标、键盘和画面设置。',office:'优先显示已打开窗口、长文本输入和浏览器中的 AI 工具。'}[s.mode]||'')+'</p><label>预览布局<select id="platform"><option value="app" '+(s.platform==='app'?'selected':'')+'>APP 竖屏</option><option value="landscape" '+(s.platform==='landscape'?'selected':'')+'>APP 横屏</option><option value="mac" '+(s.platform==='mac'?'selected':'')+'>Mac（盖世布局适配）</option></select></label>'+btn(s.compare?'关闭 UU 对照':'打开 UU 实机对照','compare','primary')+Object.entries(stateGroups).map(([name,states])=>'<details open><summary>'+name+'</summary><div class="state-grid">'+states.map(([id,title])=>btn(title,'state:'+id)).join('')+'</div></details>').join('')+'<p><a href="prd.html">查看 PRD</a> · <a href="comparison.html">逐项比对与差异</a></p></aside>';}
function render(){const pages={ended:()=>head('会话已结束')+'<main class="content">'+blank('与电脑的连接已结束','电脑上的程序保持运行。','detail','返回设备详情')+'</main>',list,all,detail,session,files,more,properties,quicklaunch,terminal,home:appHome,entry:appHome,library:libraryPage,profile:profilePage,'remote-settings':remoteSettings};let html=macRemoteWorkspace((pages[s.page]||list)());const nav=['home','entry','library','profile'].includes(s.page);$('#app').innerHTML='<div class="stage"><div class="shell '+s.platform+'" data-page="'+s.page+'">'+(s.platform==='mac'?'<aside class="mac-side"><strong>盖世游戏</strong>'+btn('主页','home',nav?'selected':'','home')+btn('远程','enter-remote',!nav?'selected':'','screen')+btn('社区','source-only','','chat')+'</aside>':'')+(s.platform==='landscape'&&nav?'<div class="home-topnav"><strong>主页</strong><span>社区</span><span>排行榜</span><span>游戏库</span><span>我的</span></div>':'<div class="desktop-strip"><span>盖世游戏　/　远程电脑</span><span>连接自己的电脑</span></div>')+(s.platform==='app'?'<div class="status"><span>9:41</span><span>◉ ▰</span></div>':'')+html+(nav?gamehubNav():'')+modal()+(s.toast?'<div role="status" class="toast">'+s.toast+'</div>':'')+'</div>'+(s.compare?sourcePanel():'')+'</div>'+btn('状态 · '+({normal:'普通',game:'游戏',office:'AI办公'}[s.mode]||'普通'),'review','fab','grid')+(s.review?review():'');requestAnimationFrame(clampMouse);}
let timer,connectTimer,powerTimer;function toast(text){s.toast=text;render();clearTimeout(timer);timer=setTimeout(()=>{s.toast='';render()},2300);}
function requestConnection(mode='control'){const d=device();if(!d.online){toast('设备已离线，无法操作');return;}if(d.blocked){toast('该设备不允许被控');return;}s.pending=mode;if(d.busy){s.modal='takeover';render();return;}startConnection(mode);}
function startConnection(mode){s.modal='connecting';render();clearTimeout(connectTimer);connectTimer=setTimeout(()=>{if(s.modal!=='connecting')return;s.modal='';s.page='session';s.panel='';s.view=mode==='view';render();},550);}
function sampleFile(kind='running',paused=false){return {id:Date.now()+Math.random(),name:'项目说明.txt',size:'84 B',kind,progress:kind==='running'?36:100,paused};}
function applyState(id){clearTimeout(timer);clearTimeout(connectTimer);clearTimeout(powerTimer);devices=structuredClone(initialDevices);Object.assign(s,{page:'list',device:'win',modal:'',panel:'',view:false,mapping:false,empty:false,loading:false,error:'',menu:false,source:id,toast:'',expanded:false,files:[],review:false,mode:'normal',powerKind:'boot',desktop:false,mouseOpen:false,mousePos:null,pendingAction:'',pending:'',activeWindow:'doc',textDraft:'',aiText:'',codeText:'',imeBuffer:'',doc:'项目讨论记录\n\n在远程电脑上继续编辑文档，或使用已经安装的软件。\n\n这里是可操作的界面模拟，不会连接真实电脑。'});
 if(id.startsWith('entry-')){s.entryVariant=id==='entry-channel'?'channel':'';s.page=id==='entry-library'?'library':id==='entry-profile'?'profile':'home';}else if(id==='onboarding'){s.modal='onboarding';}else if(id==='loading')s.loading=true;else if(id==='empty')s.empty=true;else if(id==='load-error')s.error='network';else if(['detail','busy','takeover','offline','blocked'].includes(id)){s.page='detail';if(['busy','takeover'].includes(id)){s.device='work';s.expanded=false;}if(id==='takeover')s.modal='takeover';if(id==='offline')s.device='off';if(id==='blocked')s.device='mac';}
 else if(['session','operation','display','keyboard','shortcuts','computer-keyboard','view','mapping','connecting','failed','ended','exit'].includes(id)){s.page='session';if(['operation','display','keyboard','mapping'].includes(id))s.panel=id;if(id==='mapping')s.mapping=true;if(id==='view')s.view=true;if(id==='shortcuts'||id==='computer-keyboard'){s.panel='keyboard';s.keyboard=id==='shortcuts'?'快捷键':'电脑键盘';}if(id==='keyboard')s.keyboard='输入法';if(id==='connecting')s.modal='connecting';if(id==='failed')s.modal='connection-error';if(id==='ended'){s.page='ended';}if(id==='exit')s.page='detail';}
 else if(['files','transferring','paused','file-failed','done','conflict','clear','file-offline'].includes(id)){s.page='files';if(id==='file-offline')s.device='off';if(id==='transferring'||id==='paused')s.files=[sampleFile('running',id==='paused')];if(id==='file-failed')s.files=[{...sampleFile(),failed:true,paused:true}];if(id==='done'||id==='clear')s.files=[sampleFile('sent'),sampleFile('received')];if(id==='clear'){s.clearKind='sent';s.modal='clear-records';}if(id==='conflict'){s.pick='file';s.modal='conflict';}}
 else if(['mouse','windows','text'].includes(id)){s.page='session';s.mouseOpen=id==='mouse';s.panel=id==='mouse'?'':id;}
 else if(['power-boot','power-restart','power-shutdown'].includes(id)){s.page='more';s.powerKind=id.replace('power-','');s.modal='power-attempt';}
 else if(['all','properties','quicklaunch','more','terminal','home','entry','remote-settings'].includes(id))s.page=id;render();}
function action(a){if(controlAction(a))return;const [k,v,w]=a.split(':');s.source='';if(k==='no-action')return;if(k==='enter-remote'){enterRemote();return;}if(k==='guide'){s.modal='onboarding';render();return;}if(k==='guide-done'){markGuideSeen();s.modal='';render();return;}if(k==='state'){applyState(v);return;}if(k==='mode'){previewMode(v);return;}if(k==='review'){s.review=!s.review;render();return;}if(k==='compare'){s.compare=!s.compare;s.review=false;render();return;}if(k==='device'){s.device=v;s.page='detail';s.menu=false;s.expanded=false;}
 else if(['list','all','detail','more','properties','quicklaunch','terminal','home','entry','library','profile','remote-settings'].includes(k)){s.page=k;s.modal='';s.menu=false;}
 else if(k==='back'){s.modal='';s.menu=false;s.page=s.page==='list'?(s.returnPage||'library'):['all','detail','remote-settings'].includes(s.page)?'list':'detail';}
 else if(k==='collapse')s.collapsed[v]=!s.collapsed[v];else if(k==='filter')s.modal='filter';else if(k==='filter-set'){s.filter=v;s.modal='';}
 else if(k==='retry'){s.error='';s.empty=false;}else if(k==='menu')s.menu=!s.menu;else if(k==='expand-controllers')s.expanded=!s.expanded;
 else if(k==='connect'||k==='watch'){requestConnection(k==='watch'?'view':'control');return;}
 else if(k==='power'){s.powerKind=v;s.modal='power-attempt';return render();}
 else if(k==='power-start'){s.modal='power-loading';render();clearTimeout(powerTimer);powerTimer=setTimeout(()=>{if(s.modal==='power-loading'){s.modal='power-result';render();}},850);return;}
 else if(k==='power-retry'){s.modal='power-attempt';render();return;}
 else if(k==='connect-guide'){clearTimeout(powerTimer);s.modal='connect-guide';render();return;}
 else if(k==='takeover-confirm'){if(!device().online||device().blocked){s.modal='';s.pendingAction='';toast('设备当前无法连接');return;}device().busy=false;s.modal='';if(s.pendingAction){const next=s.pendingAction;s.pendingAction='';action(next);return;}if(s.pending==='file'){s.modal='picker';}else {startConnection(s.pending||'control');return;}}
 else if(k==='disconnect-all')s.modal='disconnect';else if(k==='disconnect-confirm'){device().busy=false;s.modal='';}
 else if(k==='open-files'){s.page='files';s.modal='';}
 else if(k==='cancel'){s.pendingAction='';s.pending='';clearTimeout(connectTimer);clearTimeout(powerTimer);if(s.modal==='connecting')s.page='detail';s.modal='';}
 else if(k==='panel'){s.panel=s.panel===v?'':v;if(v==='keyboard')s.imeBuffer='';}else if(k==='panel-close')s.panel='';else if(k==='toggle'){s[v]=!s[v];}
 else if(k==='set')s[v]=w;else if(k==='rotate'){s.panel='';s.platform=s.platform==='app'?'landscape':s.platform==='landscape'?'app':'mac';}
 else if(k==='toggle-view'){s.view=!s.view;}else if(k==='exit'||k==='exit-confirm'){s.page='detail';s.modal='';s.panel='';s.mouseOpen=false;s.mouseMenu=false;s.textDraft='';s.view=false;s.pendingAction='';clearTimeout(connectTimer);}
 else if(k==='desktop')s.desktop=!s.desktop;else if(k==='windows'){s.panel=s.panel==='windows'?'':'windows';}
 else if(k==='key'){s.imeBuffer='';if(s.view){toast('当前为仅观看模式');return;}if(v==='Win+D')s.desktop=!s.desktop;else if(v==='Esc')s.panel='';else if(v==='Alt+Tab'){s.panel='windows';}else if(v==='Enter')writeRemote(remoteText()+'\n');else if(v==='Backspace')writeRemote(remoteText().slice(0,-1));else if(v==='Space')writeRemote(remoteText()+' ');else if(v.length===1)writeRemote(remoteText()+v);}
 else if(k==='file-pick'){if(!device().online){toast('设备已离线，无法操作');return;}s.pick=v;s.pending='file';s.modal=device().busy?'takeover':'picker';}
 else if(k==='file-selected'){s.files.push({...sampleFile(),name:s.pick==='media'?'示例图片.png':'项目说明.txt',size:s.pick==='media'?'11 KB':'84 B',direction:s.pick});s.modal='';}
 else if(k==='file-pause'){let f=s.files.find(f=>f.id===Number(v));if(f){f.paused=!f.paused;f.failed=false;}}
 else if(k==='file-cancel')s.files=s.files.filter(f=>f.id!==Number(v));
 else if(k==='file-manage'){s.clearKind=v;s.modal=v==='running'?'file-manage':'clear-records';}
 else if(k==='clear-confirm'){s.files=s.files.filter(f=>f.kind!==s.clearKind);s.modal='';}
 else if(k==='pause-all'||k==='resume-all'){s.files.filter(f=>f.kind==='running').forEach(f=>f.paused=k==='pause-all');s.modal='';}
 else if(k==='cancel-all'){s.files=s.files.filter(f=>f.kind!=='running');s.modal='';}
 else if(k==='file-skip')s.modal='';else if(k==='file-keep'){s.files.push({...sampleFile(),name:'项目说明 (1).txt'});s.modal='';}
 else if(k==='rename'){s.modal='rename';s.menu=false;}else if(k==='rename-save'){let name=$('#rename-value').value.trim();if(name)device().name=name;s.modal='';}
 else if(k==='rename-terminal')s.modal='terminal-rename';else if(k==='terminal-save'){s.terminalName=$('#terminal-value').value.trim()||'会话 1';s.modal='';}
 else if(k==='new-terminal'){s.terminalName='会话 2';}else if(k==='end-terminal')s.modal='end-terminal';else if(k==='terminal-end-confirm'){s.page='detail';s.modal='';}
 else if(['source-only','apps-permission','screen-select'].includes(k))s.modal=k;
 else if(['mapping-layout','terminal-keyboard'].includes(k))s.modal='source-only';
 render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action);});
document.addEventListener('change',e=>{if(e.target.id==='platform'){s.platform=e.target.value;s.panel='';render();}});
document.addEventListener('input',e=>{if(e.target.matches('.doc')&&!s.view)writeRemote(e.target.value);if(e.target.id==='remote-input'){if(!s.view&&!e.isComposing){commitIme(e.target.value);}}});
setInterval(()=>{let changed=false;for(const f of s.files){if(f.kind==='running'&&!f.paused){f.progress=Math.min(100,f.progress+8);if(f.progress===100)f.kind=f.direction==='download'?'received':'sent';changed=true;}}if(changed&&s.page==='files'&&!s.modal)render();},1600);
document.addEventListener('compositionend',e=>{if(e.target.id==='remote-input'&&!s.view){commitIme(e.target.value);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.modal==='onboarding')markGuideSeen();s.modal='';s.review=false;s.panel='';render();}});
if(params.get('state'))applyState(params.get('state'));else if(params.get('page')==='session')applyState('session');else {if(s.platform==='mac'&&!guideSeen())s.modal='onboarding';render();}
</script></body></html>
