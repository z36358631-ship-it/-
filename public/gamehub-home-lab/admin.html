const rowCells=values=>`<tr>${values.map((s,i)=>`<td${i===2?' class="name"':''}>${s}</td>`).join('')}</tr>`;
function topicRow(r){return rowCells([`<input type="checkbox" aria-label="选择专题${r.id}">`,r.id,esc(r.name),`<span class="orange">${esc(r.position)}</span>`,`<span class="tag">${esc(r.direction)}</span>`,`<span class="teal">${esc(r.os)}</span>`,`<span class="blue-text">${esc(r.channel)}</span>`,`<span class="teal">${esc(r.language)}</span>`,esc(r.category),`<span class="${r.status==='正常'?'teal':'red'}">${r.status}</span>`,r.columns.length,r.sort,'zhengqunchao','zhengqunchao','2026-11-05 21:30:00','2026-11-05 21:30:00',`<div class="operations">${button('专题栏目列表','columns',r.id,'blue','cards')}${button('复制','topic-copy',r.id,'blue','copy')}${button('','topic-edit',r.id,'','edit')}</div>`])}
function columnRow(r,t){const versions=[r.version&&r.versionOp+r.version,r.version2&&r.versionOp2+r.version2].filter(Boolean).join(' 且 ');return rowCells([`<input type="checkbox" aria-label="选择栏目${r.id}">`,r.id,esc(r.name),`<span class="orange">${esc(t.position)}</span>`,`<span class="tag">${esc(t.direction)}</span>`,esc(r.type),esc(r.type===TYPES[3]?'兼容接口 · 热度降序':'运营配置'),configuredCount(r),r.quantity,`<span class="${r.status==='正常'?'teal':'red'}">${r.status}</span>`,r.sort,versions?`<span class="tag blue">${esc(versions)}</span>`:'全部版本','zhengqunchao','zhengqunchao','2026-11-05 21:30:00','2026-11-05 21:30:00',button('','column-edit',r.id,'','edit')])}

// 2026.11.6修改：本地演示仅保存配置；接口、定时发布和消息投递由正式后台执行。
function columnDefaults(type){
 if(type===TYPES[7])return {shortcuts:[{name:'兼容性查询',icon:'compatibility',targetType:'页面',target:'compatibility'},{name:'喜加一',icon:'giveaways',targetType:'页面',target:'ret-giveaways'},{name:'游戏日历',icon:'calendar',targetType:'页面',target:'ret-calendar'},{name:'盖世讨论区',icon:'forum',targetType:'社区专题',target:'gamehub'}]};
 if(type===TYPES[3])return {layout:'图标合集'};
 if(type===TYPES[4])return {batches:[]};
 if(type===TYPES[1])return {posts:[]};
 return {};
}
function configuredCount(r){return r.type===TYPES[7]?(r.shortcuts||[]).length:r.type===TYPES[1]?(r.posts||[]).length:r.type===TYPES[4]?(r.batches||[]).reduce((sum,b)=>sum+(b.games||[]).length,0):r.type===TYPES[3]?'接口返回':r.cards;}
const editInput=(label,key,value='',type='text')=>`<label class="detail-control"><span>${esc(label)}</span><input data-field="${key}" aria-label="${esc(label)}" value="${esc(value)}" type="${type}"></label>`;
function shortcutRow(row,index){return `<div class="shortcut-config-row" data-shortcut-row><b>${index+1}</b>${editInput('入口名称','name',row.name)}${editInput('图标资源','icon',row.icon)}<label class="detail-control"><span>目标类型</span><select data-field="targetType" aria-label="目标类型">${opt(['页面','社区专题'],row.targetType)}</select></label>${editInput('目标标识','target',row.target)}</div>`;}
function postRow(row={}){return `<div class="post-config-row" data-post-row>${editInput('已有帖子ID','id',row.id)}${editInput('帖子标题','title',row.title)}${editInput('顺序','sort',row.sort??1,'number')}${editInput('展示时间','showAt',row.showAt,'datetime-local')}<span class="optional-cover">封面沿用原帖，可无图</span><button type="button" class="btn secondary" data-detail-action="remove-post">移除</button></div>`;}
function batchRow(row={}){return `<div class="batch-config-row" data-batch-row>${editInput('更新日期','date',row.date,'date')}<label class="detail-control detail-wide"><span>更新说明</span><textarea data-field="description" aria-label="更新说明" placeholder="填写测试已确认的问题改善及芯片适用范围">${esc(row.description)}</textarea></label><label class="detail-control detail-wide"><span>游戏ID列表</span><textarea data-field="games" aria-label="游戏ID列表" placeholder="每行一个游戏ID">${esc((row.games||[]).join('\n'))}</textarea></label><button type="button" class="btn secondary" data-detail-action="remove-batch">移除批次</button></div>`;}
function detailsFields(r){
 const stamp='<div class="detail-title">2026.11.6修改 · 栏目配置</div>';
 if(r.type===TYPES[7]){let rows=r.shortcuts||columnDefaults(r.type).shortcuts;if(topic().os==='iOS官方包')rows=rows.filter(x=>x.target!=='compatibility');return `<section class="type-details">${stamp}<p>编辑现有入口的图标资源、名称和跳转目标，按当前端保留入口数量。</p><div id="shortcut-rows">${rows.map(shortcutRow).join('')}</div></section>`;}
 if(r.type===TYPES[3])return `<section class="type-details">${stamp}<p>模块显示与位置沿用上方状态、排序；游戏由兼容接口按当前机型／GPU返回，再按现有热度降序，不手选游戏。</p>${field('展示样式','layout',{options:['图标合集','紧凑横条'],value:r.layout||'图标合集'})}<div class="readonly-source">内容来源：本机兼容接口　｜　内容排序：排行榜热度降序</div></section>`;
 if(r.type===TYPES[4])return `<section class="type-details">${stamp}<p>官方整体兼容更新，按测试确认内容配置日期、说明与游戏列表；不承诺当前设备一定可玩。</p><div id="batch-rows">${(r.batches||[]).map(batchRow).join('')}</div><button type="button" class="btn secondary" data-detail-action="add-batch">添加更新批次</button></section>`;
 if(r.type===TYPES[1])return `<section class="type-details">${stamp}<p>选择已有帖子，最多6条；按顺序展示，展示时间留空时立即展示，填写后到时展示。封面沿用原帖，允许纯文字。</p><div id="post-rows">${(r.posts||[]).map(postRow).join('')}</div><button type="button" class="btn secondary" data-detail-action="add-post" ${(r.posts||[]).length>=6?'disabled':''}>添加已有帖子</button></section>`;
 return '';
}
function collectRows(selector){return [...body.querySelectorAll(selector)].map(row=>Object.fromEntries([...row.querySelectorAll('[data-field]')].map(input=>[input.dataset.field,input.value.trim()])));}
function readDetails(type){
 const values={};
 if(type===TYPES[7]){values.shortcuts=collectRows('[data-shortcut-row]');if(values.shortcuts.some(row=>!row.name||!row.icon||!row.target))return {error:'请补全每个金刚入口的名称、图标资源和目标'};}
 if(type===TYPES[3])values.layout=body.querySelector('[name=layout]').value;
 if(type===TYPES[4]){values.batches=collectRows('[data-batch-row]').map(row=>({...row,games:row.games.split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean)}));if(values.batches.some(row=>!row.date||!row.description||!row.games.length))return {error:'请补全更新日期、更新说明和至少一个游戏ID'};}
 if(type===TYPES[1]){values.posts=collectRows('[data-post-row]');if(values.posts.length>6)return {error:'社区精选最多6条'};if(values.posts.some(row=>!row.id||!row.title||!row.sort||!Number.isInteger(Number(row.sort))))return {error:'请填写已有帖子ID、帖子标题和整数顺序'};if(new Set(values.posts.map(row=>row.id)).size!==values.posts.length)return {error:'同一帖子不能重复配置'};values.posts=values.posts.map(row=>({...row,sort:Number(row.sort)})).sort((a,b)=>a.sort-b.sort);}
 return {values};
}
body.addEventListener('click',event=>{const b=event.target.closest('[data-detail-action]');if(!b)return;switch(b.dataset.detailAction){case'add-post':{const list=body.querySelector('#post-rows');if(list.children.length<6)list.insertAdjacentHTML('beforeend',postRow({sort:list.children.length+1}));b.disabled=list.children.length>=6;break}case'remove-post':b.closest('[data-post-row]').remove();body.querySelector('[data-detail-action="add-post"]').disabled=false;break;case'add-batch':body.querySelector('#batch-rows').insertAdjacentHTML('beforeend',batchRow());break;case'remove-batch':b.closest('[data-batch-row]').remove();break;}});
function openEditor(kind,id){lastFocus=document.activeElement;const isColumn=kind==='column',current=isColumn?topic().columns.find(c=>c.id===id):topics.find(t=>t.id===id);editing={kind,id};document.getElementById('dialog-name').textContent=id?'编辑':'添加';
 if(isColumn){const r=current||{type:TYPES[1],name:'',slide:'横向',showTitle:true,showButton:false,status:'正常',quantity:6,sort:topic().columns.length+1,buttonText:'',version:'7.0.0',versionOp:'>=',version2:'',versionOp2:''};body.innerHTML=`<div class="editor">${field('专栏类型','type',{options:TYPES,value:r.type})}${field('专栏标题','name',{value:r.name})}${radio('滑动方向','slide',[['横向','横向'],['纵向','纵向']],r.slide)}${radio('显示标题','showTitle',[['是','true'],['否','false']],r.showTitle)}${radio('显示按钮','showButton',[['是','true'],['否','false']],r.showButton)}${radio('状态','status',[['正常','正常'],['隐藏','隐藏']],r.status)}${field('按钮文案','buttonText',{value:r.buttonText,placeholder:'按钮文案'})}${field('展示卡片数量','quantity',{value:r.quantity,type:'number'})}${field('排序','sort',{value:r.sort,type:'number'})}<div class="field"><label for="version">版本号控制</label><div class="version-box"><span style="color:#168df9">ⓘ</span> 留空表示所有版本可见，配置后仅满足条件的客户端版本才展示此栏目<div class="version-row"><select aria-label="最低版本比较" name="versionOp">${opt(['>=','>','=','<=','<'],r.versionOp)}</select><input id="version" name="version" placeholder="版本号" value="${esc(r.version)}"><span>且</span><select aria-label="并且版本比较" name="versionOp2">${opt(['','>=','>','=','<=','<'],r.versionOp2)}</select><input name="version2" aria-label="并且版本号" placeholder="并且版本号" value="${esc(r.version2)}"></div></div></div><div id="type-details">${detailsFields(r)}</div><p class="inline-error" id="form-error" role="alert"></p></div>`}
 else{const r=current||{name:'',position:'探索',direction:'竖版',os:'安卓官方包',channel:'国内官网包',language:'中文',category:'推荐',status:'正常',sort:0};body.innerHTML=`<div class="editor">${field('专题名称','name',{value:r.name})}${field('专题位置','position',{options:['探索','玩游戏','搜索'],value:r.position})}${field('屏幕方向','direction',{options:['横屏版','竖版'],value:r.direction})}${field('APP协议','os',{options:['安卓官方包','iOS官方包'],value:r.os})}${field('APP渠道','channel',{options:['国内官网包','海外官网包'],value:r.channel})}${field('语言','language',{options:['中文','英文'],value:r.language})}${field('平台归类','category',{options:['推荐','全部','PC游戏','云游戏','云游组队玩'],value:r.category})}${radio('状态','status',[['正常','正常'],['隐藏','隐藏']],r.status)}${field('排序','sort',{value:r.sort,type:'number'})}<p class="inline-error" id="form-error" role="alert"></p></div>`}
 if(isColumn)body.querySelector('[name=type]').onchange=()=>{const type=body.querySelector('[name=type]').value;document.getElementById('type-details').innerHTML=detailsFields({...columnDefaults(type),type});};
 overlay.hidden=false;initialForm=body.innerHTML;body.querySelector('input[name=name]').focus();}
function close(){overlay.hidden=true;editing=null;lastFocus?.focus()}
document.getElementById('close-dialog').onclick=close;
document.getElementById('edit-form').onreset=e=>{e.preventDefault();body.innerHTML=initialForm;if(editing?.kind==='column')body.querySelector('[name=type]').onchange=()=>{const type=body.querySelector('[name=type]').value;document.getElementById('type-details').innerHTML=detailsFields({...columnDefaults(type),type});}};
document.getElementById('edit-form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target)),error=document.getElementById('form-error');if(!data.name?.trim()){error.textContent=editing.kind==='column'?'请输入专栏标题':'请输入专题名称';return}if(!Number.isInteger(Number(data.sort))){error.textContent='排序请输入整数';return}data.name=data.name.trim();data.sort=Number(data.sort);
 if(editing.kind==='column'){if(!TYPES.includes(data.type)){error.textContent='请选择专栏类型';return}if(!Number.isInteger(Number(data.quantity))||Number(data.quantity)<1){error.textContent='展示卡片数量请输入大于0的整数';return}for(const key of ['version','version2'])if(data[key]&&!/^\d+\.\d+\.\d+$/.test(data[key])){error.textContent='版本号格式为数字.数字.数字';return}if(data.version2&&!data.versionOp2){error.textContent='请选择并且版本号的比较条件';return}const detail=readDetails(data.type);if(detail.error){error.textContent=detail.error;return}Object.assign(data,detail.values);data.quantity=Number(data.quantity);data.showTitle=data.showTitle==='true';data.showButton=data.showButton==='true';const list=topic().columns,index=list.findIndex(c=>c.id===editing.id);if(index>=0)list[index]={...list[index],...data};else list.push({...data,id:Math.max(700,...topics.flatMap(t=>t.columns.map(c=>c.id)))+1,cards:0})}
 else{for(const k of ['position','direction','os','channel','language','category'])if(!data[k]){error.textContent='请补全专题配置';return}const index=topics.findIndex(t=>t.id===editing.id);if(index>=0)topics[index]={...topics[index],...data};else topics.push({...data,id:Math.max(70,...topics.map(t=>t.id))+1,columns:[]})}
 const persisted=save();close();show();document.getElementById('saved-note').textContent=persisted?'已保存到本地演示':'已应用到当前演示（浏览器未允许本地保存）';};
content.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=Number(b.dataset.id);switch(action){case'topics':view='topics';filters={};show();break;case'columns':selected=id;view='columns';filters={};show();break;case'column-edit':openEditor('column',id);break;case'column-add':openEditor('column');break;case'topic-edit':openEditor('topic',id);break;case'topic-add':openEditor('topic');break;case'topic-copy':{const t=topics.find(t=>t.id===id);topics.push({...structuredClone(t),id:Math.max(...topics.map(t=>t.id))+1,name:t.name+'-副本'});save();show();break}case'refresh':show();break}});
for(const id of ['topics-nav','top-topics'])document.getElementById(id).onclick=()=>{view='topics';filters={};show()};
document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const focusables=[...overlay.querySelectorAll('button,input,select')].filter(x=>!x.disabled);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
window.ADMIN_DEMO={getState:()=>({view,selected,topics:structuredClone(topics)}),reset:()=>{topics=structuredClone(seeds);filters={};view='topics';save();show()},styles:TYPES};show();
})();
</script></body></html>
