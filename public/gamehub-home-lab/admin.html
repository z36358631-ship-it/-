const KEY='gamehub-home-admin-demo-r9';let topics;try{topics=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!Array.isArray(topics))topics=structuredClone(seeds);
let view='topics',selected=70,editing=null,filters={},initialForm='',lastFocus=null;
const content=document.getElementById('content'),overlay=document.getElementById('overlay'),body=document.getElementById('dialog-body');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 const columns=view==='columns',t=topic();if(columns&&!t){view='topics';return show()}
 const fields=columns?[['id','filter-id'],['专栏标题','filter-name'],['专栏类型','filter-type',{options:TYPES}],['状态','filter-status',{options:['正常','隐藏']}],['排序','filter-sort'],['创建者','filter-creator'],['更新者','filter-updater'],['创建时间','filter-created'],['更新时间','filter-updated']]:[['id','filter-id'],['专题名称','filter-name'],['专题位置','filter-position',{options:['探索','玩游戏','搜索']}],['屏幕方向','filter-direction',{options:['横屏版','竖版']}],['APP协议','filter-os',{options:['安卓官方包','iOS官方包']}],['APP渠道','filter-channel',{options:['国内官网包','海外官网包']}],['语言','filter-language',{options:['中文','英文']}],['平台归类','filter-category',{options:['推荐','全部','PC游戏','云游戏','云游组队玩']}],['状态','filter-status',{options:['正常','隐藏']}],['排序','filter-sort'],['创建者','filter-creator'],['更新者','filter-updater'],['创建时间','filter-created'],['更新时间','filter-updated']];
 const list=(columns?t.columns:topics).filter(row=>Object.entries(filters).every(([key,val])=>!val||String(row[key]??(['creator','updater'].includes(key)?'zhengqunchao':['created','updated'].includes(key)?'2026-11-05 21:30:00':'')).toLowerCase().includes(val.toLowerCase())));
 const heads=columns?['','id','专栏标题','位置','屏幕方向','专栏类型','推荐类型','配置卡片数量','展示卡片数量','状态','排序','版本范围','创建者','更新者','创建时间','更新时间','操作']:['','id','专题名称','专题位置','屏幕方向','APP协议','APP渠道','语言','平台归类','状态','配置的专栏数量','排序','创建者','更新者','创建时间','更新时间','操作'];
 content.innerHTML=`${columns?`<div class="page-title">专题栏目列表 <button type="button" data-action="topics">×</button></div><div class="breadcrumbs"><button type="button" data-action="topics">新版专题管理</button> / ${esc(t.name)}</div>`:''}<form id="filters" class="filters">${fields.map(([l,n,o])=>field(l,n,{...o,value:filters[n.replace('filter-','')]||''})).join('')}<div class="field"><span style="width:74px;flex:none"></span><div class="filter-actions"><button class="btn" type="submit">提交</button><button class="btn secondary" type="reset">重置</button></div></div></form><div class="toolbar"><button type="button" class="btn dark" data-action="refresh" aria-label="刷新">${icon('refresh')}</button><button type="button" class="btn" data-action="${columns?'column-add':'topic-add'}">${icon('plus')}添加</button><span class="style-count">${columns?'首页新增栏目样式已加入专栏类型':''}</span><div class="tools"><button class="btn secondary" type="button" disabled aria-label="列表视图">${icon('list')}</button><button class="btn secondary" type="button" disabled aria-label="搜索">${icon('search')}</button></div></div><div class="table-wrap"><table><thead><tr>${heads.map((h,i)=>`<th>${i===0?'<input type="checkbox" aria-label="全选" id="select-all">':h}</th>`).join('')}</tr></thead><tbody>${list.map(row=>columns?columnRow(row,t):topicRow(row)).join('')}</tbody></table>${!list.length?'<div class="empty">没有找到匹配的记录</div>':''}</div><div class="pager">显示第 ${list.length?1:0} 到第 ${list.length} 条记录，总共 ${list.length} 条记录<span id="saved-note" class="saved-note"></span></div>`;

const rowCells=values=>`<tr>${values.map((s,i)=>`<td${i===2?' class="name"':''}>${s}</td>`).join('')}</tr>`;

function openEditor(kind,id){lastFocus=document.activeElement;const isColumn=kind==='column',current=isColumn?topic().columns.find(c=>c.id===id):topics.find(t=>t.id===id);editing={kind,id};document.getElementById('dialog-name').textContent=id?'编辑':'添加';
 if(isColumn){const r=current||{type:TYPES[1],name:'',slide:'横向',showTitle:true,showButton:false,status:'正常',quantity:6,sort:topic().columns.length+1,buttonText:'',version:'7.0.0',versionOp:'>=',version2:'',versionOp2:''};body.innerHTML=`<div class="editor">${field('专栏类型','type',{options:TYPES,value:r.type})}${field('专栏标题','name',{value:r.name})}${radio('滑动方向','slide',[['横向','横向'],['纵向','纵向']],r.slide)}${radio('显示标题','showTitle',[['是','true'],['否','false']],r.showTitle)}${radio('显示按钮','showButton',[['是','true'],['否','false']],r.showButton)}${radio('状态','status',[['正常','正常'],['隐藏','隐藏']],r.status)}${field('按钮文案','buttonText',{value:r.buttonText,placeholder:'按钮文案'})}${field('展示卡片数量','quantity',{value:r.quantity,type:'number'})}${field('排序','sort',{value:r.sort,type:'number'})}<div class="field"><label for="version">版本号控制</label><div class="version-box"><span style="color:#168df9">ⓘ</span> 留空表示所有版本可见，配置后仅满足条件的客户端版本才展示此栏目<div class="version-row"><select aria-label="最低版本比较" name="versionOp">${opt(['>=','>','=','<=','<'],r.versionOp)}</select><input id="version" name="version" placeholder="版本号" value="${esc(r.version)}"><span>且</span><select aria-label="并且版本比较" name="versionOp2">${opt(['','>=','>','=','<=','<'],r.versionOp2)}</select><input name="version2" aria-label="并且版本号" placeholder="并且版本号" value="${esc(r.version2)}"></div></div></div><p class="inline-error" id="form-error" role="alert"></p></div>`}
 else{const r=current||{name:'',position:'探索',direction:'竖版',os:'安卓官方包',channel:'国内官网包',language:'中文',category:'推荐',status:'正常',sort:0};body.innerHTML=`<div class="editor">${field('专题名称','name',{value:r.name})}${field('专题位置','position',{options:['探索','玩游戏','搜索'],value:r.position})}${field('屏幕方向','direction',{options:['横屏版','竖版'],value:r.direction})}${field('APP协议','os',{options:['安卓官方包','iOS官方包'],value:r.os})}${field('APP渠道','channel',{options:['国内官网包','海外官网包'],value:r.channel})}${field('语言','language',{options:['中文','英文'],value:r.language})}${field('平台归类','category',{options:['推荐','全部','PC游戏','云游戏','云游组队玩'],value:r.category})}${radio('状态','status',[['正常','正常'],['隐藏','隐藏']],r.status)}${field('排序','sort',{value:r.sort,type:'number'})}<p class="inline-error" id="form-error" role="alert"></p></div>`}
 overlay.hidden=false;initialForm=body.innerHTML;body.querySelector('input[name=name]').focus();}
function close(){overlay.hidden=true;editing=null;lastFocus?.focus()}
document.getElementById('close-dialog').onclick=close;
document.getElementById('edit-form').onreset=e=>{e.preventDefault();body.innerHTML=initialForm};
document.getElementById('edit-form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target)),error=document.getElementById('form-error');if(!data.name?.trim()){error.textContent=editing.kind==='column'?'请输入专栏标题':'请输入专题名称';return}if(!Number.isInteger(Number(data.sort))){error.textContent='排序请输入整数';return}data.name=data.name.trim();data.sort=Number(data.sort);
 if(editing.kind==='column'){if(!TYPES.includes(data.type)){error.textContent='请选择专栏类型';return}if(!Number.isInteger(Number(data.quantity))||Number(data.quantity)<1){error.textContent='展示卡片数量请输入大于0的整数';return}for(const key of ['version','version2'])if(data[key]&&!/^\d+\.\d+\.\d+$/.test(data[key])){error.textContent='版本号格式为数字.数字.数字';return}if(data.version2&&!data.versionOp2){error.textContent='请选择并且版本号的比较条件';return}data.quantity=Number(data.quantity);data.showTitle=data.showTitle==='true';data.showButton=data.showButton==='true';const list=topic().columns,index=list.findIndex(c=>c.id===editing.id);if(index>=0)list[index]={...list[index],...data};else list.push({...data,id:Math.max(700,...topics.flatMap(t=>t.columns.map(c=>c.id)))+1,cards:0})}
 else{for(const k of ['position','direction','os','channel','language','category'])if(!data[k]){error.textContent='请补全专题配置';return}const index=topics.findIndex(t=>t.id===editing.id);if(index>=0)topics[index]={...topics[index],...data};else topics.push({...data,id:Math.max(70,...topics.map(t=>t.id))+1,columns:[]})}
 const persisted=save();close();show();document.getElementById('saved-note').textContent=persisted?'已保存到本地演示':'已应用到当前演示（浏览器未允许本地保存）';};
content.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=Number(b.dataset.id);switch(action){case'topics':view='topics';filters={};show();break;case'columns':selected=id;view='columns';filters={};show();break;case'column-edit':openEditor('column',id);break;case'column-add':openEditor('column');break;case'topic-edit':openEditor('topic',id);break;case'topic-add':openEditor('topic');break;case'topic-copy':{const t=topics.find(t=>t.id===id);topics.push({...structuredClone(t),id:Math.max(...topics.map(t=>t.id))+1,name:t.name+'-副本'});save();show();break}case'refresh':show();break}});
for(const id of ['topics-nav','top-topics'])document.getElementById(id).onclick=()=>{view='topics';filters={};show()};
document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const focusables=[...overlay.querySelectorAll('button,input,select')].filter(x=>!x.disabled);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
window.ADMIN_DEMO={getState:()=>({view,selected,topics:structuredClone(topics)}),reset:()=>{topics=structuredClone(seeds);filters={};view='topics';save();show()},styles:TYPES};show();
})();
</script></body></html>
