0" fill="#5b657a" fill-opacity="1.000">1.0.0</text><text x="264.00" y="141.00" font-family="Arial" font-size="12.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">P03-03 / T10</text><text x="264.00" y="174.00" font-family="Noto Sans SC" font-size="24.00" font-weight="700" fill="#172033" fill-opacity="1.000">包体上传页</text><text x="264.00" y="203.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">Windows 包体分片上传、中断恢复、重传和基础校验页。</text><text x="1272.00" y="150.75" font-family="Noto Sans SC" font-size="11.00" font-weight="650" fill="#d95656" fill-opacity="1.000">已中断</text><text x="1337.00" y="152.00" font-family="Noto Sans SC" font-size="14.00" font-weight="650" fill="#071522" fill-opacity="1.000">继续上传</text><text x="285.00" y="261.44" font-family="Noto Sans SC" font-size="15.00" font-weight="700" fill="#172033" fill-opacity="1.000">包体分片上传</text><text x="560.94" y="428.79" font-family="Noto Sans SC" font-size="16.38" font-weight="700" fill="#172033" fill-opacity="1.000">Windows 包体已选择</text><text x="512.73" y="453.97" font-family="Noto Sans SC" font-size="12.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">网络中断，已完成分片保留，可从 68% 继续上传</text><text x="632.16" y="491.72" font-family="Noto Sans SC" font-size="11.00" font-weight="650" fill="#d95656" fill-opacity="1.000">已中断</text><text x="285.00" y="586.19" font-family="Noto Sans SC" font-size="11.00" font-weight="400" fill="#8b94a6" fill-opacity="1.000">已上传 68%，已完成分片将保留</text><text x="914.89" y="586.19" font-family="Arial" font-size="11.00" font-weight="400" fill="#8b94a6" fill-opacity="1.000">6.8 GB / 10.0 GB</text><text x="285.00" y="649.44" font-family="Noto Sans SC" font-size="11.00" font-weight="400" fill="#8b94a6" fill-opacity="1.000">不会上传真实文件；继续后先校验已完成分片</text><text x="929.33" y="650.69" font-family="Noto Sans SC" font-size="14.00" font-weight="650" fill="#071522" fill-opacity="1.000">继续上传</text><text x="1058.33" y="261.44" font-family="Noto Sans SC" font-size="15.00" font-weight="700" fill="#172033" fill-opacity="1.000">校验与提交规则</text><text x="1071.33" y="330.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">展示版本 1.0.0、build_rev_003、文件、分</text><text x="1071.33" y="351.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">片上传进度、开始和最近活动时间。</text><text x="1360.41" y="326.19" font-family="Arial" font-size="11.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">01</text><text x="1071.33" y="404.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">上传任务与版本草稿分离，重复开始不创建</text><text x="1071.33" y="425.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">第二个并发任务。</text><text x="1360.41" y="400.19" font-family="Arial" font-size="11.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">02</text><text x="1071.33" y="478.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">演示上传中→网络中断→保留已完成分片→</text><text x="1071.33" y="499.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">继续上传。</text><text x="1360.41" y="474.19" font-family="Arial" font-size="11.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">03</text><text x="1071.33" y="552.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">恢复条件失效时可重新上传；取消仅丢弃未</text><text x="1071.33" y="573.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">完成进度并返回草稿。</text><text x="1360.41" y="548.19" font-family="Arial" font-size="11.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">04</text><text x="1071.33" y="626.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">校验上传完整、包体可读、启动文件存在、</text><text x="1071.33" y="647.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">游戏关系和完全重复。</text><text x="1360.41" y="622.19" font-family="Arial" font-size="11.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">05</text><text x="1071.33" y="700.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">校验通过生成不可变修订并进入待提交；失</text><text x="1071.33" y="721.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">败不进入测试。</text><text x="1360.41" y="696.19" font-family="Arial" font-size="11.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">06</text><text x="1071.33" y="774.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">只上传单个 Windows 包体，不提供预载、</text><text x="1071.33" y="795.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">P2P、增量包、多平台包或多正式分支。</text><text x="1360.41" y="770.19" font-family="Arial" font-size="11.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">07</text><text x="1071.33" y="848.19" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">上传凭据和长期包体地址不展示或记录。</text><text x="1360.41" y="844.19" font-family="Arial" font-size="11.00" font-weight="700" fill="#6a7cff" fill-opacity="1.000">08</text></g></svg>
