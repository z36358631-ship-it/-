ont-size="14.00" font-weight="400" fill="#bed0e5" fill-opacity="1.000">账号由盖世游戏发行运营创建，一期不提供公众注册。</text><text x="887.05" y="305.16" font-family="Microsoft YaHei" font-size="24.00" font-weight="700" fill="#172033" fill-opacity="1.000">受邀账号登录页</text><text x="887.05" y="327.34" font-family="Microsoft YaHei" font-size="14.00" font-weight="400" fill="#5b657a" fill-opacity="1.000">使用已获授权的受邀账号继续</text><text x="887.05" y="374.34" font-family="Microsoft YaHei" font-size="12.00" font-weight="600" fill="#5b657a" fill-opacity="1.000">账号</text><text x="914.05" y="374.34" font-family="Microsoft YaHei" font-size="12.00" font-weight="600" fill="#d95656" fill-opacity="1.000">*</text><text x="887.05" y="454.34" font-family="Microsoft YaHei" font-size="12.00" font-weight="600" fill="#5b657a" fill-opacity="1.000">密码</text><text x="914.05" y="454.34" font-family="Microsoft YaHei" font-size="12.00" font-weight="600" fill="#d95656" fill-opacity="1.000">*</text><text x="1112.52" y="550.34" font-family="Microsoft YaHei" font-size="14.00" font-weight="650" fill="#071522" fill-opacity="1.000">登录</text><text x="1005.02" y="593.34" font-family="Microsoft YaHei" font-size="11.00" font-weight="400" fill="#8b94a6" fill-opacity="1.000">本页仅演示受邀登录流程，不发起真实认证。</text></g></svg>
