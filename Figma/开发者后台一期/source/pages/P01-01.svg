00" font-weight="400" fill="#b7c2d6" fill-opacity="1.000">开发者后台一期</text><text x="256.00" y="32.00" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#ffffff" fill-opacity="1.000">开发者平台与资料</text><text x="389.00" y="30.25" font-family="Noto Sans SC" font-size="11.00" font-weight="400" fill="#d9fbff" fill-opacity="1.000">正式环境</text><text x="1226.00" y="32.00" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#eaf0fa" fill-opacity="1.000">帮助中心</text><text x="1327.00" y="32.00" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#142039" fill-opacity="1.000">王</text><text x="1361.00" y="23.75" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#dce3f0" fill-opacity="1.000">王明</text><text x="1361.00" y="40.75" font-family="Noto Sans SC" font-size="11.00" font-weight="400" fill="#b7c2d6" fill-opacity="1.000">受邀开发者</text><text x="140.00" y="136.00" font-family="Noto Sans SC" font-size="11.00" font-weight="400" fill="#c8f7ff" fill-opacity="1.000">一期仅面向受邀合作方</text><text x="89.00" y="192.50" font-family="Arial" font-size="12.00" font-weight="700" fill="#91efff" fill-opacity="1.000">P01-01 / T01</text><text x="89.00" y="214.50" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#eaf0fa" fill-opacity="1.000">受邀账号登录页</text><text x="89.00" y="257.69" font-family="Noto Sans SC" font-size="32.00" font-weight="700" fill="#ffffff" fill-opacity="1.000">从首款签约游戏开始，完成发行闭环</text><text x="89.00" y="293.72" font-family="Noto Sans SC" font-size="14.00" font-weight="400" fill="#b7c2d6" fill-opacity="1.000">盖世游戏为已签约且获得发行授权的合作方提供资料、供给、测试发布、精准投放和发行数据能力。</text><text x="106.00" y="357.72" font-family="Arial" font-size="14.00" font-weight="700" fill="#38e8ff" fill-opacity="1.000">1</text><text x="106.00" y="394.72" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#f6f9fd" fill-opacity="1.000">完成厂商与游戏资料</text><text x="424.50" y="357.72" font-family="Arial" font-size="14.00" font-weight="700" fill="#38e8ff" fill-opacity="1.000">2</text><text x="424.50" y="394.72" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#f6f9fd" fill-opacity="1.000">配置商品及 CDKEY</text><text x="743.00" y="357.72" font-family="Arial" font-size="14.00" font-weight="700" fill="#38e8ff" fill-opacity="1.000">3</text><text x="743.00" y="394.72" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#f6f9fd" fill-opacity="1.000">上传包体并通过测试发布</text><text x="1061.50" y="357.72" font-family="Arial" font-size="14.00" font-weight="700" fill="#38e8ff" fill-opacity="1.000">4</text><text x="1061.50" y="394.72" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#f6f9fd" fill-opacity="1.000">提交精准投放并查看发行数据</text><text x="89.00" y="466.72" font-family="Noto Sans SC" font-size="14.00" font-weight="700" fill="#eaf0fa" fill-opacity="1.000">开始前请准备</text><text x="100.00" y="501.72" font-family="Noto Sans SC" font-size="12.00" font-weight="400" fill="#c6d1e1" fill-opacity="1.000">受邀账号</text><text x="178.00" y="501.72" font-family="Noto Sans SC" font-size="12.00" font-weight="400" fill="#c6d1e1" fill-opacity="1.000">公司与游戏授权资料</text><text x="316.00" y="501.72" font-family="Noto Sans SC" font-size="12.00" font-weight="400" fill="#c6d1e1" fill-opacity="1.000">首款签约游戏资料</text><text x="442.00" y="501.72" font-family="Noto Sans SC" font-size="12.00" font-weight="400" fill="#c6d1e1" fill-opacity="1.000">拟合作渠道和技术联系人</text><text x="127.00" y="560.72" font-family="Noto Sans SC" font-size="14.00" font-weight="650" fill="#071522" fill-opacity="1.000">开始入驻</text></g></svg>
