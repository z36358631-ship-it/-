<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2280" viewBox="0 0 1600 2280">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1D2A3A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#168FD0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#22A879"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#E36565"/>
    </marker>
    <style>
      .title{font:700 42px "Microsoft YaHei","PingFang SC",sans-serif;fill:#15263C}
      .subtitle{font:400 20px "Microsoft YaHei","PingFang SC",sans-serif;fill:#60748C}
      .lane{font:700 22px "Microsoft YaHei","PingFang SC",sans-serif;fill:#24405F}
      .step{font:700 19px "Microsoft YaHei","PingFang SC",sans-serif;fill:#12243A}
      .body{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#536A82}
      .tag{font:700 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#168FD0}
      .tagGreen{font:700 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#198963}
      .tagRed{font:700 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#C94E4E}
      .edge{font:600 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#53708D}
      .box{fill:#FFFFFF;stroke:#B8D8EA;stroke-width:2;rx:18;filter:url(#shadow)}
      .service{fill:#F5FAFE;stroke:#7AB9DB;stroke-width:2;rx:18;filter:url(#shadow)}
      .success{fill:#EFFAF6;stroke:#78CDB0;stroke-width:2;rx:18;filter:url(#shadow)}
      .failure{fill:#FFF5F2;stroke:#F0A291;stroke-width:2;rx:18;filter:url(#shadow)}
      .line{fill:none;stroke:#168FD0;stroke-width:4;marker-end:url(#arrowBlue)}
      .lineGreen{fill:none;stroke:#22A879;stroke-width:4;marker-end:url(#arrowGreen)}
      .lineRed{fill:none;stroke:#E36565;stroke-width:4;marker-end:url(#arrowRed)}
      .dash{stroke-dasharray:10 8}
    </style>
  </defs>

  <rect width="1600" height="2280" fill="#F3F7FB"/>
  <rect width="1600" height="10" fill="#168FD0"/>
  <text class="title" x="80" y="82">盖世游戏｜移动端扫码登录 Mac 会话继承流程</text>
  <text class="subtitle" x="80" y="124">一次性 challenge · Mac 私有领取凭证 · 全平台自动继承 · 全成全败</text>

  <rect x="80" y="168" width="430" height="58" rx="16" fill="#E7F3FA"/>
  <rect x="585" y="168" width="430" height="58" rx="16" fill="#EAF8F3"/>
  <rect x="1090" y="168" width="430" height="58" rx="16" fill="#EEF1F8"/>
  <text class="lane" x="295" y="205" text-anchor="middle">Mac 客户端</text>
  <text class="lane" x="800" y="205" text-anchor="middle">移动端</text>
  <text class="lane" x="1305" y="205" text-anchor="middle">登录服务 / 平台会话服务</text>

  <line x1="545" y1="168" x2="545" y2="2180" stroke="#DCE6EF" stroke-width="2" stroke-dasharray="8 10"/>
  <line x1="1050" y1="168" x2="1050" y2="2180" stroke="#DCE6EF" stroke-width="2" stroke-dasharray="8 10"/>

  <rect class="box" x="100" y="280" width="390" height="128"/>
  <text class="tag" x="130" y="316">01 发起登录</text>
  <text class="step" x="130" y="350">创建本次设备密钥对</text>
  <text class="body" x="130" y="382">申请一次性 Mac 登录请求</text>

  <path class="line" d="M490 344H1110"/>
  <text class="edge" x="800" y="330" text-anchor="middle">设备公钥 + 登录请求</text>

  <rect class="service" x="1110" y="266" width="390" height="156"/>
  <text class="tag" x="1140" y="304">waiting_scan</text>
  <text class="step" x="1140" y="340">生成 challenge 与私有领取凭证</text>
  <text class="body" x="1140" y="372">二维码不包含账号/平台 Token</text>
  <text class="body" x="1140" y="398">私有领取凭证只返回给本次 Mac</text>

  <path class="line" d="M1110 456H490"/>
  <text class="edge" x="800" y="444" text-anchor="middle">二维码内容 + Mac 私有领取凭证</text>

  <rect class="box" x="100" y="486" width="390" height="132"/>
  <text class="tag" x="130" y="524">02 展示二维码</text>
  <text class="step" x="130" y="560">二维码 2 分钟有效</text>
  <text class="body" x="130" y="592">关闭、刷新或重新进入时旧请求失效</text>

  <path class="line" d="M490 552H605"/>
  <text class="edge" x="548" y="538" text-anchor="middle">扫码</text>

  <rect class="box" x="605" y="486" width="390" height="132"/>
  <text class="tagGreen" x="635" y="524">03 首次有效扫码</text>
  <text class="step" x="635" y="560">识别 challenge 并提交校验</text>
  <text class="body" x="635" y="592">绑定 uid、设备与移动端 session</text>

  <path class="line" d="M995 552H1110"/>

  <rect class="service" x="1110" y="486" width="390" height="132"/>
  <text class="tag" x="1140" y="524">pending_confirm</text>
  <text class="step" x="1140" y="560">原子占用 challenge</text>
  <text class="body" x="1140" y="592">并发扫描仅首个设备进入确认</text>

  <path class="line" d="M1305 618V710H995"/>
  <text class="edge" x="1150" y="696" text-anchor="middle">返回设备、位置与全部已绑定平台</text>

  <rect class="box" x="605" y="710" width="390" height="164"/>
  <text class="tagGreen" x="635" y="748">04 移动端确认</text>
  <text class="step" x="635" y="784">自动继承全部实际绑定平台</text>
  <text class="body" x="635" y="816">不提供单个平台开关</text>
  <text class="body" x="635" y="844">提交一次性确认 nonce</text>

  <path class="line" d="M995 792H1110"/>
  <text class="edge" x="1052" y="778" text-anchor="middle">确认登录</text>

  <rect class="service" x="1110" y="696" width="390" height="192"/>
  <text class="tag" x="1140" y="734">authorizing · 最长 15 秒</text>
  <text class="step" x="1140" y="770">复核账号、设备、session 与 nonce</text>
  <text class="body" x="1140" y="804">重复确认返回同一处理结果</text>
  <text class="body" x="1140" y="832">目标平台使用自有会话体系</text>
  <text class="body" x="1140" y="860">不触发第三方拒绝或二次验证</text>

  <text class="tag" x="590" y="970">05 并行签发 Mac 独立设备会话</text>
  <rect class="service" x="180" y="1000" width="360" height="132"/>
  <text class="step" x="360" y="1048" text-anchor="middle">盖世账号会话</text>
  <text class="body" x="360" y="1082" text-anchor="middle">不复制移动端 Token</text>
  <rect class="service" x="620" y="1000" width="360" height="132"/>
  <text class="step" x="800" y="1048" text-anchor="middle">目标平台会话 0..N</text>
  <text class="body" x="800" y="1082" text-anchor="middle">按账号实际绑定关系逐一创建</text>
  <rect class="service" x="1060" y="1000" width="360" height="132"/>
  <text class="step" x="1240" y="1048" text-anchor="middle">原子激活闸门</text>
  <text class="body" x="1240" y="1082" text-anchor="middle">完成前预备会话不可鉴权</text>
  <path class="line" d="M1305 888V950H360V1000"/>
  <path class="line" d="M800 950V1000"/>
  <path class="line" d="M1240 950V1000"/>

  <path class="line" d="M360 1132V1196H800"/>
  <path class="line" d="M800 1132V1196"/>
  <path class="line" d="M1240 1132V1196H800"/>
  <polygon points="800,1184 990,1280 800,1376 610,1280" fill="#168FD0" filter="url(#shadow)"/>
  <text x="800" y="1268" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">全部目标会话</text>
  <text x="800" y="1300" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">均签发成功？</text>

  <path class="lineGreen" d="M800 1376V1455"/>
  <text class="tagGreen" x="818" y="1422">全部成功</text>
  <rect class="success" x="570" y="1455" width="460" height="142"/>
  <text class="tagGreen" x="600" y="1492">ready_to_claim</text>
  <text class="step" x="600" y="1528">生成一次性加密会话包</text>
  <text class="body" x="600" y="1560">仅本次 Mac 私有领取凭证可兑换</text>

  <path class="lineGreen" d="M570 1526H490"/>
  <rect class="success" x="100" y="1455" width="390" height="142"/>
  <text class="tagGreen" x="130" y="1492">领取 / ACK</text>
  <text class="step" x="130" y="1528">Mac 幂等领取并持久化会话包</text>
  <text class="body" x="130" y="1560">30 秒内响应丢失可重领，ACK 后核销</text>

  <path class="lineGreen" d="M295 1597V1688H605"/>
  <rect class="success" x="605" y="1634" width="390" height="142"/>
  <text class="tagGreen" x="635" y="1672">used · 登录成功</text>
  <text class="step" x="635" y="1708">移动端展示 Mac 登录成功</text>
  <text class="body" x="635" y="1740">实际继承平台已在此 Mac 可用</text>

  <path class="lineRed" d="M990 1280H1090"/>
  <text class="tagRed" x="1040" y="1260" text-anchor="middle">任一失败 / 超时</text>
  <rect class="failure" x="1090" y="1210" width="410" height="184"/>
  <text class="tagRed" x="1120" y="1248">authorization_failed</text>
  <text class="step" x="1120" y="1284">立即拒绝鉴权 + Outbox 全部回收</text>
  <text class="body" x="1120" y="1318">物理回收期间本次会话仍不可使用</text>
  <text class="body" x="1120" y="1348">失败持续重试并告警</text>
  <text class="body" x="1120" y="1378">两端提示重新扫码</text>

  <path class="lineRed dash" d="M1295 1394V1704H995"/>
  <rect class="failure" x="1090" y="1640" width="410" height="128"/>
  <text class="step" x="1120" y="1686">登录未完成</text>
  <text class="body" x="1120" y="1718">平台状态未全部同步，本次授权已撤销</text>

  <rect x="80" y="1845" width="1440" height="300" rx="24" fill="#FFFFFF" stroke="#CFDDE9" stroke-width="2" filter="url(#shadow)"/>
  <text class="tag" x="120" y="1890">异常与生命周期保护</text>

  <rect x="120" y="1924" width="315" height="166" rx="16" fill="#FFF8F3" stroke="#F0B18B"/>
  <text class="step" x="148" y="1964">过期 expired</text>
  <text class="body" x="148" y="1998">2 分钟内未完成则失效</text>
  <text class="body" x="148" y="2028">回收未提交会话</text>
  <text class="body" x="148" y="2058">旧 challenge 不可复用</text>

  <rect x="468" y="1924" width="315" height="166" rx="16" fill="#FFF8F3" stroke="#F0B18B"/>
  <text class="step" x="496" y="1964">取消 cancelled</text>
  <text class="body" x="496" y="1998">用户取消后禁止继续确认</text>
  <text class="body" x="496" y="2028">Mac 提示刷新二维码</text>
  <text class="body" x="496" y="2058">不影响移动端原登录态</text>

  <rect x="816" y="1924" width="315" height="166" rx="16" fill="#F5FAFE" stroke="#91C5E0"/>
  <text class="step" x="844" y="1964">并发与重放</text>
  <text class="body" x="844" y="1998">首次有效扫码原子占用</text>
  <text class="body" x="844" y="2028">确认 nonce 保证幂等</text>
  <text class="body" x="844" y="2058">领取凭证一次核销</text>

  <rect x="1164" y="1924" width="315" height="166" rx="16" fill="#F5FAFE" stroke="#91C5E0"/>
  <text class="step" x="1192" y="1964">后台与弱网</text>
  <text class="body" x="1192" y="1998">确认页退后台尽力取消</text>
  <text class="body" x="1192" y="2028">离线由有效期兜底</text>
  <text class="body" x="1192" y="2058">网络重试不重复签发</text>

  <rect x="80" y="2196" width="1440" height="2" fill="#D7E3EC"/>
  <text class="body" x="80" y="2238">V1.1｜状态主路径：waiting_scan → pending_confirm → authorizing → ready_to_claim → used</text>
  <text class="body" x="1520" y="2238" text-anchor="end">失败原则：立即拒绝鉴权，再全部回收</text>
</svg>
