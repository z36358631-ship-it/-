function shareEntryMarkup(action){return '<button type="button" class="share-entry" aria-label="分享存档" title="分享存档" onclick="'+action+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v10m-3.6-6.5L12 3.5l3.6 3.5M5.5 12.5V18A2.5 2.5 0 0 0 8 20.5h8a2.5 2.5 0 0 0 2.5-2.5v-5.5"/></svg></button>'}
function shareTargetAvailable(){return shareTarget&&(shareTarget.type==='system'||shareTarget.save.status==='on')}
function shareLocalUrl(){var url=new URL(location.href);url.hash='save='+encodeURIComponent(shareTarget.type==='system'?'system-'+shareTarget.save.id:'published-'+shareTarget.index);return url.href}
function openSaveShare(index,type){var s=type==='system'?saves[index]:consignSaves[index];if(!s||type!=='system'&&s.status!=='on')return;shareReturnFocus=document.activeElement;shareTarget={save:s,index:index,type:type};document.getElementById('shareStatus').textContent='';renderSaveShare();document.getElementById('shareOverlay').hidden=false;document.getElementById('shareClose').focus()}
function renderSaveShare(){if(!shareTarget)return;var s=shareTarget.save;document.getElementById('sharePreview').innerHTML='<img src="'+s.cover+'" alt=""><div><strong>'+escapeText(s.title)+'</strong><small>GTA V · '+escapeText(s.author||'玩家')+' · 免费存档</small></div>';document.getElementById('shareChannels').innerHTML=shareChannels[shareRegion].map(function(c){return '<button type="button" class="share-channel" onclick="shareSaveChannel(\''+c[0]+'\')"><img src="'+shareChannelAssets[c[0]]+'" alt=""><span>'+c[1]+'</span></button>'}).join('')}
function closeSaveShare(){document.getElementById('shareOverlay').hidden=true;document.getElementById('posterOverlay').hidden=true;if(shareReturnFocus&&shareReturnFocus.isConnected)shareReturnFocus.focus()}
async function shareSaveChannel(channel){if(shareBusy||!shareTargetAvailable())return;var status=document.getElementById('shareStatus');shareBusy=true;try{if(channel==='link'){await navigator.clipboard.writeText(shareLocalUrl());status.textContent='链接已复制'}else if(window.GameHubShare&&typeof window.GameHubShare.share==='function'){status.textContent='正在打开分享应用';var s=shareTarget.save,result=await window.GameHubShare.share({channel:channel,title:s.title,description:'GTA V · 免费存档',image:s.cover,url:shareLocalUrl()});status.textContent=result&&result.status==='success'?'分享完成':result&&result.status==='cancel'?'已取消分享':'未完成分享，请重试'}else{status.textContent='当前为网页演示，请在盖世游戏客户端打开'+shareChannels[shareRegion].find(function(c){return c[0]===channel})[1]+'分享'}}catch(e){status.textContent=channel==='link'?'复制失败，请重试':'分享未完成，请重试'}finally{shareBusy=false}}
function posterLines(ctx,text,x,y,width,lineHeight,maxLines){var line='',lines=[];for(var c of Array.from(text)){if(ctx.measureText(line+c).width>width&&line){lines.push(line);line=c}else line+=c}if(line)lines.push(line);lines.slice(0,maxLines).forEach(function(l,i){if(i===maxLines-1&&lines.length>maxLines)l=l.slice(0,-1)+'...';ctx.fillText(l,x,y+i*lineHeight)})}
async function openSavePoster(){if(!shareTargetAvailable())return;var s=shareTarget.save,canvas=document.createElement('canvas');canvas.width=720;canvas.height=1000;var ctx=canvas.getContext('2d');ctx.fillStyle='#101114';ctx.fillRect(0,0,720,1000);ctx.fillStyle='#d4b473';ctx.font='bold 34px Arial';ctx.fillText('GameHub',40,65);ctx.font='22px Arial';ctx.fillStyle='#ddd';ctx.fillText('盖世游戏 · 免费存档',40,108);try{var img=await new Promise(function(resolve,reject){var image=new Image();image.onload=function(){resolve(image)};image.onerror=reject;image.src=s.cover});var ratio=Math.min(640/img.width,360/img.height),w=img.width*ratio,h=img.height*ratio;ctx.drawImage(img,40+(640-w)/2,150+(360-h)/2,w,h)}catch(e){document.getElementById('shareStatus').textContent='分享图生成失败，请重试';return}ctx.fillStyle='#fff';ctx.font='bold 34px Arial';posterLines(ctx,s.title,40,560,640,48,3);ctx.fillStyle='#aaa';ctx.font='24px Arial';posterLines(ctx,'GTA V · '+(s.author||'玩家'),40,730,640,34,2);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(40,820);ctx.lineTo(680,820);ctx.stroke();ctx.fillStyle='#d4b473';ctx.font='28px Arial';ctx.fillText('打开盖世游戏，查看并使用存档',40,882);ctx.fillStyle='#999';ctx.font='20px Arial';ctx.fillText('存档分享 · 免费使用',40,936);document.getElementById('posterImage').src=canvas.toDataURL('image/png');document.getElementById('posterStatus').textContent='';document.getElementById('posterOverlay').hidden=false;document.getElementById('posterBack').focus()}
function backToShare(){document.getElementById('posterOverlay').hidden=true;document.getElementById('sharePreview').focus()}
function downloadSavePoster(){var a=document.createElement('a');a.href=document.getElementById('posterImage').src;a.download='gamehub-save-share.png';a.click();document.getElementById('posterStatus').textContent='已发起图片下载'}
function openSharedSave(){var match=location.hash.match(/^#save=system-(\d+)$/);if(!match)return;var index=saves.findIndex(function(s){return s.id===Number(match[1])});if(index>=0){closeSaveShare();openDetail(index)}}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('posterOverlay').hidden){e.stopImmediatePropagation();backToShare()}else if(e.key==='Escape'&&!document.getElementById('shareOverlay').hidden){e.stopImmediatePropagation();closeSaveShare()}} ,true);

modalConfirm=function(){var action=mobilePending;if(!action||mobileBusy||action.env!==mobileEnv)return;var blocked=mobileBlocked();if(blocked){mobileNotice(blocked[0],blocked[1]);return}var ctx=mobileContext(),target=action.kind==='restore'?ctx.backups[action.index]:null;if(action.kind==='use'&&!mobileEligible(saves[action.index])){mobileNotice('当前环境不适用','存档适配范围已变化，请重新选择。');return}if(ctx.current&&mobileFault==='backup'){mobileNotice('备份失败','当前进度未替换，请检查存储空间与文件访问权限后重试。');return}var before=ctx.current?Object.assign({},ctx.current):null;if(before)ctx.backups.unshift({name:before.name,time:new Date().toLocaleString('zh-CN'),snapshot:before,environment:mobileEnv,syncPolicy:mobileSync});if(mobileFault==='apply'){renderMine();mobileNotice('应用失败','原进度保持不变；若已生成备份，可在「我的存档 → 已备份」查看。');return}if(action.kind==='restore'){ctx.current=Object.assign({},target.snapshot);activeIdx=ctx.current.active;ctx.active=activeIdx}else{var idx=action.index;if(!used.has(idx)&&knownDownloads(saves[idx]))saves[idx].downloads++;used.add(idx);activeIdx=idx;ctx.active=idx;ctx.current={name:saves[idx].title,active:idx}}closeModal();refreshAll();closeDetail();showToast(action.kind==='restore'?'备份已恢复，请进入游戏检查':'存档已应用，请进入游戏检查')};

var mobileFaq={use:[['哪些游戏可以使用存档？','按当前游戏和云游戏、Steam 登录下载、自己导入的运行环境展示已适配存档。版本、DLC、MOD可能不同，环境适配不代表所有版本通用。'],['未发现存档怎么办？','先进入游戏保存进度并退出，再返回重试。手机本地游戏仍未找到时，可通过系统文件选择器选择已知存档文件；无法定位目标位置时不会覆盖。云游戏请重试或联系客服。'],['云同步冲突怎么办？','核对本机与云端存档的进度和时间后再决定保留哪份，等待同步完成。无法确认时先取消操作，不默认选择本地。'],['存储空间不足或无法访问怎么办？','本机游戏请清理手机存储空间，或通过系统文件选择器重新授权。只能访问系统允许的文件。云游戏存储不足请重试或联系客服。'],['如何恢复原来的进度？','在「我的存档 → 已备份」选择使用前的备份并恢复。恢复前先保护当前进度；备份失败不替换。云游戏恢复对应云运行环境的用户存档。'],['应用后没有变化或无法读取怎么办？','文件应用完成不代表游戏已读取成功。请核对作者说明中的版本、DLC和MOD要求，退出游戏后恢复备份，或换用其他适配存档。']],upload:[['找不到可发布的存档怎么办？','先在当前游戏保存进度并退出，再重试检测。手机本地游戏仍未找到，可通过系统文件选择器选择存档文件；取消或授权失败时保留已填写内容。云游戏不选择手机文件。'],['不知道平台、版本、DLC、MOD怎么办？','适用平台可选择已知平台或“不清楚”；游戏版本选择“不清楚”或填写具体版本号。DLC、MOD的已知要求写在描述中。作者填写不等于平台验证，不要猜测或宣称全版本通用。'],['为什么发布后没有展示？','提交后进入审核；运营检查内容并在拟开放的游戏环境验证。通过后仅在相应环境展示，待审核或未通过不公开。'],['审核不通过或时间较长怎么办？','请使用清晰标题，描述存档进度、使用方法和已知依赖，配图与存档内容保持一致。可用性验证需要时间，不承诺固定审核时长；查看审核结果后补充并重新提交。']]};

/* Local publishing drafts; never persist the selected game-save bytes. */
(function(){
  'use strict';
  var key='gamehub-save-drafts-v1',records=[],sessions={},current=null,baseline='',submitting=false,exitAction=null,reauthorize=false;
  var page=document.getElementById('consignPage'),app=document.getElementById('app');
  try{var loaded=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(loaded))records=loaded.filter(function(d){return d&&typeof d.id==='string'&&typeof d.gameKey==='string'&&Array.isArray(d.images)})}catch(e){}
  page.querySelector('.top-bar').insertAdjacentHTML('beforeend','<button class="draft-save" onclick="savePublishDraft(false)">保存草稿</button>');
  page.querySelector('.consign-body').insertAdjacentHTML('afterbegin','<div id="draftStatus" class="draft-status" role="status"></div>');
  var exit=document.createElement('div');exit.id='draftExit';exit.className='draft-exit';exit.hidden=true;
  exit.innerHTML='<div class="draft-dialog" role="dialog" aria-modal="true" aria-labelledby="draftExitTitle"><h3 id="draftExitTitle">保存到草稿箱？</h3><p>本次编辑尚未保存，可保存后继续编辑。</p><button onclick="savePublishDraft(true)">保存草稿</button><button onclick="discardDraftChanges()">不保存</button><button onclick="continueDraftEditing()">继续编辑</button></div>';app.appendChild(exit);
  function val(id){return document.getElementById(id).value}
  function selected(){var el=document.querySelector('input[name="cf"]:checked');if(!el)return null;var n=el.value,source=n.indexOf('manual-')===0?mobileContext().files[Number(n.slice(7))]:autoSaves[Number(n)];return source?{value:n,name:source.name,size:source.size}:null}
  function snapshot(){return {title:val('cTitle'),desc:val('cDesc'),platform:val('cPlatform'),versionMode:val('cVersionMode'),version:val('cVersion'),images:consignImages.slice(),file:selected()}}
  function signature(){return JSON.stringify(snapshot())}
  function dirty(){return page.classList.contains('show')&&signature()!==baseline}
  function message(text){document.getElementById('draftStatus').textContent=text}
  function update(){renderMine();if(window.renderSaveLibrary)renderSaveLibrary()}
  function persist(next){try{localStorage.setItem(key,JSON.stringify(next));records=next;return true}catch(e){message('本机草稿保存失败，请释放存储空间后重试。当前编辑内容已保留。');return false}}
  window.getGameDraftCount=function(game,env){return records.filter(function(d){return d.gameKey===game&&d.environment===env}).length};
  var baseMine=window.renderMine;
  window.renderMine=function(){baseMine();var items=records.filter(function(d){return d.gameKey===activeGameKey&&d.environment===mobileEnv}).sort(function(a,b){return b.updatedAt-a.updatedAt});var section=document.createElement('section');section.className='draft-section';section.innerHTML='<div class="section-label">草稿箱（'+items.length+'）</div><div class="backup-note">仅保存在本机，未提交审核</div>'+items.map(function(d){return '<button class="draft-row" data-draft-id="'+escapeText(d.id)+'"><span><strong>'+escapeText(d.title.trim()||'未命名草稿')+'</strong><small>'+new Date(d.updatedAt).toLocaleString('zh-CN',{hour12:false})+'</small></span><span>继续编辑 ›</span></button>'}).join('')+(items.length?'':'<div class="backup-empty">暂无草稿</div>');section.querySelectorAll('[data-draft-id]').forEach(function(b){b.onclick=function(){editPublishDraft(b.dataset.draftId)}});document.getElementById('sec-mine').prepend(section)};
  function reset(){consignImageVersion++;consignImages=[];document.getElementById('cTitle').value='';document.getElementById('cDesc').value='';document.getElementById('cPlatform').value=mobileEnv==='steam'?'Steam':'不清楚';document.getElementById('cVersionMode').value='unknown';document.getElementById('cVersion').value='';toggleSaveVersion();message('');reauthorize=false;current=null}
  function gameLabel(){page.querySelectorAll('.fg').forEach(function(f){var l=f.querySelector('label');if(l&&l.textContent==='关联游戏')l.nextElementSibling.textContent=getActiveGame().title+'（当前游戏）'})}
  var baseOpen=window.openConsign,baseClose=window.closeConsign,baseSubmit=window.submitConsign;
  window.openConsign=function(){reset();baseOpen();gameLabel();baseline=signature()};
  function finish(){exit.hidden=true;baseClose();exitAction=null;reset();update()}
  window.closeConsign=function(){if(submitting){baseClose();return}if(!page.classList.contains('show'))return;if(dirty()){exitAction=null;exit.hidden=false;exit.querySelector('button').focus()}else finish()};
  window.continueDraftEditing=function(){exit.hidden=true;exitAction=null};
  window.discardDraftChanges=function(){var action=exitAction;finish();if(action)action()};
  window.savePublishDraft=function(close){if(consignImageBusy){message('图片处理中，请稍后保存。');return}var draft=Object.assign(snapshot(),{id:current||('draft-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),gameKey:activeGameKey,environment:mobileEnv,updatedAt:Date.now()});if(reauthorize&&current){var prev=records.find(function(d){return d.id===current});draft.file=prev?prev.file:null}var next=records.filter(function(d){return d.id!==draft.id}).concat(draft);if(!persist(next)){exit.hidden=true;return}current=draft.id;sessions[current]=reauthorize?null:selected();baseline=signature();message('已保存到本机草稿箱');update();if(close){var action=exitAction;finish();if(action)action()}};
  window.editPublishDraft=function(id){var d=records.find(function(x){return x.id===id&&x.gameKey===activeGameKey&&x.environment===mobileEnv});if(!d)return;openConsign();current=d.id;document.getElementById('cTitle').value=d.title;document.getElementById('cDesc').value=d.desc;document.getElementById('cPlatform').value=d.platform;document.getElementById('cVersionMode').value=d.versionMode;document.getElementById('cVersion').value=d.version;consignImages=d.images.slice();toggleSaveVersion();renderConsignImages();updateConsignText(document.getElementById('cTitle'),40,false);updateConsignText(document.getElementById('cDesc'),500,false);var ref=sessions[id];document.querySelectorAll('input[name="cf"]').forEach(function(el){el.checked=!!ref&&el.value===ref.value});if(ref&&JSON.stringify(selected())!==JSON.stringify(ref))ref=null;if(!ref){document.querySelectorAll('input[name="cf"]').forEach(function(el){el.checked=false});reauthorize=true;message(d.file?'原文件：'+d.file.name+'。请重新选择存档文件后提交。':'请选择本次要提交的存档文件。')}baseline=signature();page.querySelector('.consign-body').scrollTop=0};
  page.addEventListener('change',function(e){if(e.target.matches('input[name="cf"]')){reauthorize=false;message('')}});
  var baseFile=window.mobileFileSelected;
  window.mobileFileSelected=async function(input){await baseFile(input);if(page.classList.contains('show')&&selected()){reauthorize=false;message('')}};
  window.submitConsign=function(){if(reauthorize){message('请重新选择存档文件后提交。');return}var oldId=current,n=consignSaves.length;submitting=true;try{baseSubmit()}finally{submitting=false}if(consignSaves.length>n){if(oldId){var next=records.filter(function(d){return d.id!==oldId});if(!persist(next))message('已提交审核，但本机草稿清理失败。');delete sessions[oldId]}reset();baseline='';update()}};
  ['changeMobileEnv','openGameSaves','showSaveLibrary'].forEach(function(name){var base=window[name];window[name]=function(){var args=arguments,context=this,action=function(){base.apply(context,args)};if(page.classList.contains('show')&&dirty()){exitAction=action;exit.hidden=false;document.getElementById('demoEnv').value=mobileEnv;return}if(page.classList.contains('show'))finish();return action()}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!exit.hidden){e.preventDefault();e.stopImmediatePropagation();continueDraftEditing()}else if(e.key==='Escape'&&page.classList.contains('show')){e.preventDefault();e.stopImmediatePropagation();closeConsign()}},true);
  window.addEventListener('beforeunload',function(e){if(dirty()){e.preventDefault();e.returnValue=''}});
  document.querySelector('.demo-data-note').textContent='网页演示：环境、检测、备份恢复与审核为模拟；游戏文件不上传、不改写。发布草稿保存在本机，其他演示数据刷新后重置。';
  update();
})();
