function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));original.hidden=mode!=='original';scene.hidden=mode!=='implementation';difference.hidden=mode!=='difference';document.getElementById('legend').textContent=mode==='original'?'原稿视图 · V6.1.1 实机图':mode==='difference'?'差异视图 · 自动计算像素与边缘差异':'实现视图 · 局部媒体裁片 + 可复用 DOM UI'}
function render(){const p=pageMap[current],row=reportMap[current];document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===current));document.getElementById('title').textContent=p.name;document.getElementById('subtitle').textContent=`${p.id} · ${p.width}×${p.height} · ${p.mode}`;document.getElementById('rightTitle').textContent=p.name;document.getElementById('rightDesc').textContent=descriptions[current];const score=document.getElementById('score');score.textContent=row?`${(row.score*100).toFixed(1)}%`:'待计算';score.classList.toggle('fail',!!row&&!row.passed);document.getElementById('tags').innerHTML=p.components.map(x=>`<span class="tag">${x.id} · ${x.label}</span>`).join('');document.getElementById('sources').innerHTML=`<li>${p.id} · V6.1.1 实机图</li><li>${p.width}×${p.height} 原始画布</li><li>${Object.keys(p.media).length} 个登记媒体裁片；UI 禁止整页截图</li>`;document.getElementById('prompt').textContent=`使用 $gamehub-app-ui，以 ${p.id} 为基准生成“${p.name}”，提供原稿、实现、差异图及组件级评分。`;device.className=`device ${p.orientation}`;root.style.width=px(p.width);root.style.height=px(p.height);original.src=ASSETS[`${current}:original`];difference.src=ASSETS[`${current}:difference`]||'';renderers[current](p);setMode(mode)}
