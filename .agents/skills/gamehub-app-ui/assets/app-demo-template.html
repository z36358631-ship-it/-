function renderLandscapeLibraryRegression(root){root.classList.add('regression-page','reg-l-page');root.innerHTML=`<nav class="reg-l-nav" data-component-id="C-NAV-L"><div class="reg-l-main">${icon('grid',40,'#e6e6e6',4)}<span>游戏库</span></div><div class="reg-l-icons">${icon('game',35,'#444446',4)}${planetIcon('#444446')}${icon('rank',35,'#444446',4)}${icon('user',35,'#444446',4)}</div><div class="reg-l-status"><span style="left:9px;top:13px">${deviceIcon(42)}</span><span style="left:78px;top:14px">${icon('game',42,'#e6e6e6',4)}</span><span style="left:141px;top:13px;width:1px;height:34px;background:#555559"></span><span style="left:160px;top:13px">17:59</span><span style="left:240px;top:14px">${wifiIcon(42)}</span><span style="left:307px;top:13px">${batteryWideIcon()}</span><span style="left:350px;top:13px">97%</span></div></nav><div data-component-id="D-GAME-CARD" style="position:absolute;left:95px;top:105px;width:480px;height:365px;pointer-events:none"></div><div class="reg-placeholder"><img src="${ASSETS['media:library-landscape:placeholder']}" alt="游戏占位卡"></div><img class="reg-cover" src="${ASSETS['media:library-landscape:cover']}" alt="空洞骑士丝之歌封面"><div class="reg-game-title">空洞骑士：丝之歌</div><div data-component-id="C-BUTTON-SECONDARY" style="position:absolute;left:95px;top:500px;width:370px;height:80px;pointer-events:none"></div><button class="reg-detail-btn">查看详情</button><button class="reg-grid-btn">${icon('grid',42,'#e6e6e6',4)}</button>`}
function regNavItems(active){const items=[['home','首页',86,56,52,54],['game','玩游戏',81,61,50,52],['rank','排行榜',83,51,51,49],['grid','游戏库',79,57,50,47],['user','我的',74,57,52,43]];return items.map(([type,label,left,width,height,labelLeft])=>`<div class="reg-bottom-item ${type===active?'active':''}"><img class="reg-source-icon" style="left:${left}px;top:51px;width:${width}px;height:${height}px" src="${ASSETS[`media:epic-unbound-portrait:nav-${type}`]}" alt=""><span class="reg-nav-label" style="left:${labelLeft}px">${label}</span></div>`).join('')}
function settingsIcon(){return '<svg viewBox="0 0 32 32" fill="none" stroke="#f2f2f2" stroke-width="3"><circle cx="16" cy="16" r="5"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4M7 7l3 3M22 22l3 3M25 7l-3 3M10 22l-3 3"/></svg>'}
function wifiIcon(size=34){return `<svg viewBox="0 0 40 30" width="${size}" fill="#f2f2f2"><path d="M3 9c10-8 24-8 34 0l-4 5c-8-6-18-6-26 0Zm7 8c6-5 14-5 20 0l-4 5c-4-3-8-3-12 0Zm7 8c2-2 4-2 6 0l-3 3Z"/></svg>`}
function signalIcon(){return '<svg viewBox="0 0 34 28" fill="#f2f2f2"><path d="M2 24 11 10v14Zm13 0L25 2v22Z"/></svg>'}
function batteryIcon(){return '<svg viewBox="0 0 24 32" fill="#f2f2f2"><path d="M7 1h10v3h2a2 2 0 0 1 2 2v23a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2Zm5 7-4 10h4l-2 8 7-12h-4l2-6Z"/></svg>'}
function batteryWideIcon(){return '<svg viewBox="0 0 54 28" width="42" fill="#f2f2f2"><rect x="2" y="4" width="45" height="20" rx="5"/><rect x="48" y="9" width="4" height="10" rx="2"/></svg>'}
function deviceIcon(size=40){return `<svg viewBox="0 0 48 48" width="${size}" fill="none" stroke="#f2f2f2" stroke-width="4" stroke-linecap="round"><rect x="7" y="6" width="28" height="35" rx="5"/><path d="M15 42h12M41 14v20"/></svg>`}
function planetIcon(color){return `<svg viewBox="0 0 48 48" width="35" fill="none" stroke="${color}" stroke-width="4"><circle cx="24" cy="24" r="11"/><path d="M5 29c8 7 28 2 38-9M8 14c9-4 23-2 31 6"/></svg>`}
function renderUsage(){setHeader('使用方法','从真实页面基准开始，再以来源化组件完成最小改动');stage.innerHTML=`<div class="usage"><h2>如何使用 $gamehub-app-ui</h2><p>这个 Skill 先回答“现有页面是什么”，再回答“新增内容放在哪里”。页面事实库用于选基准，组件展厅用于选真实组件，回归证据用于证明实现是否真的接近原稿。</p><div class="usage-grid"><section class="usage-card"><h3>1. 推荐输入</h3><ul><li>目标页面与方向</li><li>现有 Demo 或截图路径</li><li>本期新增/修改点</li><li>明确不能增加的能力</li><li>目标输出路径</li></ul></section><section class="usage-card"><h3>2. 新建页面</h3><pre>使用 $gamehub-app-ui，按 screen-18 游戏库基准制作竖屏离线 Demo。先还原现行结构，再在 EPIC 与后续入口之间增加 GOG；列出组件、来源、冲突和严格视觉证据。</pre></section><section class="usage-card"><h3>3. 修改已有 Demo</h3><pre>使用 $gamehub-app-ui 修改 demos/xxx.html。保留现有 DOM 和交互，只修改本期范围；横竖版使用独立 Shell，不新增弹窗、Toast 或流程。</pre></section><section class="usage-card"><h3>4. 横竖双版</h3><pre>使用 $gamehub-app-ui 生成搜索结果横竖版。竖屏一排 2 个，平台标识在封面；横屏使用原生双面板，不整体缩放竖屏 DOM。</pre></section><section class="usage-card"><h3>5. 生成与验证</h3><pre>node .agents/skills/gamehub-app-ui/scripts/build-screen-catalog.mjs\nnode .agents/skills/gamehub-app-ui/scripts/build-preview.mjs\nnode .agents/skills/gamehub-app-ui/scripts/capture-visuals.mjs\npython .agents/skills/gamehub-app-ui/scripts/compare-visuals.py\nnode .agents/skills/gamehub-app-ui/scripts/validate.mjs all</pre></section><section class="usage-card"><h3>6. 输出证据</h3><ul><li>原稿与实现必须同尺寸</li><li>生成 50% 叠加、绝对差异和热图</li><li>RGB / 边缘 / 结构 / 几何分别过门槛</li><li>人工肉眼可否决自动 PASS</li><li>缺资源时写“未完成”，不使用近似图标</li></ul></section></div></div>`;inspector.innerHTML='<div class="kicker">USAGE</div><h2>交付结构</h2><p class="desc">离线 HTML、页面/组件清单、横竖状态、来源、冲突、原稿/实现/叠加/差异/热图、机器报告、人工结论和已知限制。</p><div class="right-section"><h3>重要边界</h3><div class="tag-list"><span class="tag">仅 APP</span><span class="tag">Mac 独立适配</span><span class="tag">不猜 Figma 参数</span><span class="tag">不冒充 95%</span></div></div>'}
document.querySelectorAll('[data-workspace]').forEach(button=>button.onclick=()=>{state.workspace=button.dataset.workspace;state.orientation='all';state.query='';search.value='';if(state.workspace==='facts')state.selection='screen-01';if(state.workspace==='components')state.selection=FIGMA_COMPONENTS.components[0].id;if(state.workspace==='evidence')state.selection=VISUAL_CONFIG.pages[0].key;document.querySelectorAll('[data-workspace]').forEach(item=>item.classList.toggle('active',item===button));buildList();render()});search.addEventListener('input',()=>{state.query=search.value;buildList()});
buildList();render();
window.GameHubUI={state,renderRegression,screenCatalog:SCREEN_CATALOG,components:FIGMA_COMPONENTS.components,visualConfig:VISUAL_CONFIG};
</script>
